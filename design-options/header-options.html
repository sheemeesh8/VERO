<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Oswald:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 300px; border-radius: 28px 28px 10px 10px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); border: 6px solid #0d0d0d; border-bottom: none; }
.screen { width: 390px; height: 390px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; }
.hero { position: absolute; inset: 0; background: url('../clothing-hero.jpg') center 30% / cover no-repeat; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.3)); }
.hero .cap { position: absolute; left: 24px; bottom: 26px; color: #fff; z-index: 1; }
.hero .cap .k { font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; }
.hero .cap .t { font-family: 'Bodoni Moda', serif; font-size: 30px; margin-top: 4px; }
.wm { height: 20px; filter: brightness(0) invert(1); }
.wm.dk { filter: none; }
svg.ic { width: 21px; height: 21px; stroke: #fff; stroke-width: 1.4; fill: none; }
svg.ic.dk { stroke: #111; }
/* header base */
.hd { position: absolute; top: 0; left: 0; right: 0; z-index: 5; color: #fff; }
.hd .bar { display: flex; align-items: center; justify-content: space-between; padding: 30px 20px 0; }
.hd .right { display: flex; align-items: center; gap: 16px; }
.hd .left { display: flex; align-items: center; gap: 14px; }
.txtbtn { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #fff; }
.tog { width: 36px; height: 19px; border: 1.3px solid #fff; border-radius: 19px; position: relative; }
.tog::after { content: ''; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
.centerlogo { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); z-index: 6; }
.serif { font-family: 'Bodoni Moda', serif; font-size: 22px; letter-spacing: 1px; color: #fff; }
/* H4 inline search */
.srch { flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.18); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 10px 14px; color: #fff; font-size: 12px; margin: 0 12px; }
.srch svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 1.5; fill: none; }
/* H6 two row tabs */
.tabs { display: flex; gap: 20px; justify-content: center; padding: 12px 0 0; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
.tabs span { color: rgba(255,255,255,0.7); } .tabs span.on { color: #fff; border-bottom: 1.5px solid #fff; padding-bottom: 5px; }
/* H7 floating pill */
.floatbar { position: absolute; top: 28px; left: 16px; right: 16px; z-index: 6; background: rgba(20,22,28,0.82); backdrop-filter: blur(10px); border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; }
/* H8 center segmented */
.seg { display: flex; background: rgba(255,255,255,0.18); backdrop-filter: blur(6px); border-radius: 999px; padding: 3px; }
.seg span { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; color: rgba(255,255,255,0.8); }
.seg span.on { background: #fff; color: #111; }
</style>
</head>
<body>
<h1>Header — אופציות</h1>
<p class="sub">8 עיצובים להדר (מוצג מעל ההירו)</p>

<div class="grid" id="opts"></div>

<script>
var MENU = '<svg class="ic" viewBox="0 0 24 24" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>';
var SEARCH = '<svg class="ic" viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
var USER = '<svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
var BAG = '<svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>';
var WM = '<img class="wm" src="../moravchick-letters.png" alt="moravchick">';
var hero = '<div class="hero"><div class="cap"><div class="k">In season</div><div class="t">Autumn Collection</div></div></div>';
var scr = (inner, extra) => '<div class="screen">' + hero + (extra || '') + '<div class="hd">' + inner + '</div></div>';

var OPTS = [
  ['H1 · הקיים', 'המבורגר וטוגל משמאל, לוגו במרכז, חיפוש ומשתמש מימין.',
   scr('<div class="bar"><div class="left">' + MENU + '<span class="tog"></span></div><div class="right">' + SEARCH + USER + '</div></div>', '<div class="centerlogo">' + WM + '</div>')],

  ['H2 · לוגו משמאל', 'לוגו בפינה שמאל, ומימין חיפוש, תיק ומשתמש. קלאסי של חנות אונליין.',
   scr('<div class="bar"><div class="left">' + WM + '</div><div class="right">' + SEARCH + BAG + USER + '</div></div>')],

  ['H3 · קוטור טקסטואלי', '"MENU" משמאל, לוגו במרכז, "SEARCH" מימין. אותיות דקות ומרווחות, מאוד יוקרתי.',
   scr('<div class="bar"><span class="txtbtn">Menu</span><span class="txtbtn">Search</span></div>', '<div class="centerlogo">' + WM + '</div>')],

  ['H4 · חיפוש מובנה', 'שדה חיפוש תמידי לרוחב ההדר, עם אייקון תפריט ומשתמש. הכי מזמין לחפש.',
   scr('<div class="bar">' + MENU + '<span class="srch">' + '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' + 'Search pieces, sellers…</span>' + USER + '</div>')],

  ['H5 · סריף מינימלי', 'רק שם המותג בסריף במרכז ואייקון תפריט אחד. נקי וחגיגי.',
   scr('<div class="bar">' + MENU + '<span></span></div>', '<div class="centerlogo"><span class="serif">moravchick</span></div>')],

  ['H6 · שתי שורות + טאבים', 'שורה עליונה עם לוגו ואייקונים, ושורה שנייה עם טאבים: Women / Men / Art / Sale.',
   scr('<div class="bar"><div class="left">' + MENU + '</div><div class="right">' + SEARCH + USER + '</div></div><div class="tabs"><span class="on">Women</span><span>Men</span><span>Art</span><span>Sale</span></div>', '<div class="centerlogo">' + WM + '</div>')],

  ['H7 · פס צף', 'הדר "מרחף" בצורת כדור כהה מעט מתחת לקצה, עם לוגו ואייקונים. מודרני ובולט.',
   '<div class="screen">' + hero + '<div class="floatbar">' + MENU + WM + '<div class="right">' + SEARCH + USER + '</div></div></div>'],

  ['H8 · מתג במרכז', 'לוגו משמאל, מתג Shop / Art במרכז (כמו הטוגל הקיים), אייקונים מימין.',
   scr('<div class="bar"><div class="left">' + WM + '</div><div class="seg"><span class="on">Shop</span><span>Art</span></div><div class="right">' + SEARCH + USER + '</div></div>')]
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
