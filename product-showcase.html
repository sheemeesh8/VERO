<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Product Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #F2F0EF;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        /* Whole page centred on the flat sand background. */
        .showcase {
            min-height: 100vh;
            display: grid;
            /* Data on the LEFT column, images on the RIGHT column. */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
            align-items: center;
            gap: 80px;
            max-width: 1240px;
            margin: 0 auto;
            padding: 60px 56px;
        }

        /* ==================== LEFT: the data ==================== */
        .info { max-width: 440px; }
        /* data column sits second in DOM but first visually (RTL grid) */
        .info-price {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            margin-bottom: 26px;
        }
        .info-title {
            font-family: 'Cormorant Garamond', 'Playfair Display', serif;
            font-size: 58px;
            font-weight: 500;
            line-height: 1.05;
            letter-spacing: 0.5px;
            margin-bottom: 26px;
        }

        /* Tab strip — Key Ingredients / Uses / … */
        .info-tabs {
            display: flex;
            gap: 26px;
            border-bottom: 0;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .info-tab {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: #9a958c;
            letter-spacing: 0.4px;
            cursor: pointer;
            padding: 0 0 8px;
            position: relative;
            transition: color 0.2s;
        }
        .info-tab:hover { color: #1a1a1a; }
        .info-tab.active { color: #1a1a1a; }
        .info-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 100%; height: 2px;
            background: #c98a63;
        }

        .info-desc {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.85;
            color: #3a352e;
            min-height: 96px;
            margin-bottom: 34px;
        }

        /* Quantity selector */
        .info-qty-row {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 26px;
        }
        .info-qty-row .lbl { font-size: 15px; color: #3a352e; letter-spacing: 0.5px; }
        .qty {
            display: inline-flex;
            align-items: center;
            border: 1px solid #d8d4cd;
            background: #fff;
        }
        .qty button {
            width: 40px; height: 42px;
            background: none; border: none;
            font-size: 20px; color: #6b665e;
            cursor: pointer;
            transition: color 0.15s;
        }
        .qty button:hover { color: #1a1a1a; }
        .qty span {
            width: 46px; text-align: center;
            font-size: 16px; font-weight: 400;
            border-inline: 1px solid #d8d4cd;
            line-height: 42px;
        }

        /* Buy bar */
        .btn-buy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 56px;
            background: #c98a63;
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 14px;
            transition: filter 0.2s, transform 0.2s;
        }
        .btn-buy:hover { filter: brightness(1.05); transform: translateY(-2px); }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #cfcbc3;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .btn-secondary:hover { border-color: #1a1a1a; }

        /* ==================== RIGHT: the 3 images ==================== */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .gallery-main {
            width: 100%;
            aspect-ratio: 4 / 4.6;
            background: #EDEBE9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-main img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-thumbs {
            display: flex;
            gap: 14px;
        }
        .gallery-thumb {
            width: 92px; height: 92px;
            background: #EDEBE9;
            border: 1px solid transparent;
            padding: 0;
            cursor: pointer;
            overflow: hidden;
            opacity: 0.82;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-thumb:hover { opacity: 1; }
        .gallery-thumb.active { opacity: 1; border-color: #c98a63; }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .showcase {
                grid-template-columns: 1fr;
                gap: 44px;
                padding: 40px 22px;
            }
            .gallery { order: -1; }
            .info { max-width: 100%; }
            .info-title { font-size: 46px; }
        }
    </style>
</head>
<body>
    <div class="showcase">
        <!-- LEFT column: the data -->
        <div class="info">
            <div class="info-price" id="price">₪120.00</div>
            <h1 class="info-title" id="title">שם המוצר</h1>

            <div class="info-tabs" id="tabs">
                <button class="info-tab active" data-key="ingredients">מרכיבים</button>
                <button class="info-tab" data-key="uses">שימושים</button>
                <button class="info-tab" data-key="directions">הוראות</button>
                <button class="info-tab" data-key="list">רשימה מלאה</button>
            </div>

            <p class="info-desc" id="desc">תיאור המוצר יופיע כאן.</p>

            <div class="info-qty-row">
                <span class="lbl">כמות</span>
                <div class="qty">
                    <button onclick="changeQty(-1)" aria-label="הפחת">−</button>
                    <span id="qty">1</span>
                    <button onclick="changeQty(1)" aria-label="הוסף">+</button>
                </div>
            </div>

            <button class="btn-buy" onclick="addToCart()">
                <span>הוסף לעגלה</span>
                <span id="buyPrice">— ₪120.00</span>
            </button>
            <button class="btn-secondary" onclick="toggleWishlist()" id="wishBtn">הוסף לרשימת המשאלות</button>
        </div>

        <!-- RIGHT column: 3 product images -->
        <div class="gallery">
            <div class="gallery-main" id="mainFrame">
                <img id="mainImg" src="" alt="">
            </div>
            <div class="gallery-thumbs" id="thumbs"></div>
        </div>
    </div>

    <script>
        // ---- Content (overridable via ?product= JSON, same shape as product.html) ----
        const params = new URLSearchParams(location.search);
        let product = { name: 'שם המוצר', price: 120, desc: '', seller: 'VERO' };
        try {
            const raw = params.get('product');
            if (raw) product = Object.assign(product, JSON.parse(decodeURIComponent(raw)));
        } catch (e) { console.error(e); }

        const seed = encodeURIComponent(product.name || 'vero');
        const images = [
            `https://picsum.photos/seed/${seed}-1/900/1000`,
            `https://picsum.photos/seed/${seed}-2/900/1000`,
            `https://picsum.photos/seed/${seed}-3/900/1000`
        ];

        // Tab copy — falls back to a description when the product has no per-tab text.
        const base = product.desc || `${product.name} — פריט נבחר מבית ${product.seller || 'VERO'}, זמין כעת בחנות.`;
        const tabText = {
            ingredients: base,
            uses: `${product.name} מתאים לשימוש יומיומי. ${base}`,
            directions: 'מרחו כמות קטנה, עסו בעדינות עד לספיגה מלאה. לשימוש חופשי לפי הצורך.',
            list: base
        };

        // ---- Render ----
        function fmt(p) { return '₪' + Number(p).toFixed(2); }
        document.getElementById('title').textContent = product.name;
        document.getElementById('price').textContent = fmt(product.price);
        document.getElementById('desc').textContent = tabText.ingredients;
        document.getElementById('buyPrice').textContent = '— ' + fmt(product.price);

        // Gallery
        const mainImg = document.getElementById('mainImg');
        mainImg.src = images[0];
        mainImg.alt = product.name;
        const thumbs = document.getElementById('thumbs');
        thumbs.innerHTML = images.map((src, i) =>
            `<button class="gallery-thumb${i === 0 ? ' active' : ''}" onclick="showImg(${i})" aria-label="תמונה ${i + 1}">
                <img src="${src}" alt="" loading="lazy">
             </button>`).join('');
        function showImg(i) {
            mainImg.src = images[i];
            document.querySelectorAll('.gallery-thumb').forEach((t, idx) => t.classList.toggle('active', idx === i));
        }

        // Tabs
        document.getElementById('tabs').addEventListener('click', e => {
            const btn = e.target.closest('.info-tab');
            if (!btn) return;
            document.querySelectorAll('.info-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('desc').textContent = tabText[btn.dataset.key] || base;
        });

        // Quantity
        let qty = 1;
        function changeQty(d) {
            qty = Math.max(1, qty + d);
            document.getElementById('qty').textContent = qty;
        }

        // Cart (syncs with vero_cart, same shape as the rest of the site)
        function addToCart() {
            const cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
            const id = `${product.name}|${product.price}`;
            const now = Date.now(), HOLD = 48 * 60 * 60 * 1000;
            const existing = cart.find(i => i.id === id);
            if (existing) { existing.qty += qty; existing.addedAt = now; existing.expiresAt = now + HOLD; }
            else cart.push({ id, name: product.name, price: product.price, seller: product.seller,
                             qty, addedAt: now, expiresAt: now + HOLD });
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            location.href = 'index.html?open=cart';
        }

        // Wishlist
        function toggleWishlist() {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            const id = `${product.name}|${product.price}`;
            const btn = document.getElementById('wishBtn');
            const idx = wl.findIndex(i => i.id === id);
            if (idx >= 0) { wl.splice(idx, 1); btn.textContent = 'הוסף לרשימת המשאלות'; }
            else { wl.push({ id, name: product.name, price: product.price, seller: product.seller, addedAt: Date.now() });
                   btn.textContent = 'הסר מרשימת המשאלות'; }
            localStorage.setItem('vero_wishlist', JSON.stringify(wl));
        }
        (function () {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            if (wl.some(i => i.id === `${product.name}|${product.price}`))
                document.getElementById('wishBtn').textContent = 'הסר מרשימת המשאלות';
        })();
    </script>
</body>
</html>
