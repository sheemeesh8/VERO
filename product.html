<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="stylesheet" href="design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Product</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: white;
            direction: rtl;
            letter-spacing: 0px;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }




        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            font-style: normal;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            position: relative;
            width: 80px;
            height: 43px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 21.5px;
            padding: 3px;
            cursor: pointer;
            border: 2px solid white;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .toggle-circle {
            position: absolute;
            width: 37px;
            height: 37px;
            background: #2196F3;
            border-radius: 50%;
            transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            left: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            z-index: 1;
        }

        .toggle-switch.active-clothing .toggle-circle {
            left: 3px;
        }

        .toggle-switch.active-art .toggle-circle {
            left: 40px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .icon-wrap {
            position: relative;
            display: inline-flex;
        }

        .badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .badge.show {
            display: flex;
        }

        /* ==================== PRODUCT HERO (full-width background image) ==================== */
        /* Adding to cart slides the whole page out before we land on the cart. */
        body.slide-out {
            animation: pageSlideOut 0.45s cubic-bezier(0.65, 0.05, 0.1, 1) forwards;
            overflow: hidden;
        }
        @keyframes pageSlideOut {
            to { transform: translateX(-12%); opacity: 0; }
        }

        /* No background image, no card: the page itself splits in half —
           product data on one side, gallery on the other. */
        .product-hero {
            width: 100%;
            min-height: 100vh;
            /* Background dropped — the card sits straight on the white page, held
               by its own border and shadow. */
            background: #fff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 48px;
        }

        /* One white card holding both halves: the photograph on the left, the
           purchase panel on the right. */
        .product-banner {
            width: 100%;
            max-width: 1180px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 56px;
            align-items: center;
            background: #fff;
            /* Minimal: no card frame, no shadow — the two halves sit straight on
               the white page, held apart by whitespace alone. */
            border: none;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
        }
        /* Photograph first, panel second — as in the reference. */
        .product-banner-image { order: 1; }
        .product-banner-info  { order: 2; }

        /* Gallery half: one photograph filling the side, the rest inside it */
        .product-banner-image {
            min-width: 0;
        }

        /* The main shot takes the whole width and height of this half. */
        .pd-main-img {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 560px;
            background: #f4f3f1;
            overflow: hidden;
            border-radius: 14px;
        }
        /* A soft wash off the bottom-left corner, so the pale thumbnail cards keep
           their contrast whatever the photograph is doing underneath. */
        .pd-main-img::after {
            content: '';
            position: absolute;
            inset: 0;
            /* Minimal: only a whisper of shade to hold the thumbnails' contrast. */
            background: linear-gradient(to top right, rgba(0,0,0,0.12), rgba(0,0,0,0) 45%);
            pointer-events: none;
        }
        /* The frame the shot is painted into — swapping shots never touches the
           thumbnails, which live alongside it. */
        .pd-main-frame {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .pd-main-frame img { width: 100%; height: 100%; object-fit: cover; }

        .product-banner-icon {
            font-size: 190px;
            line-height: 1;
        }

        /* The seller's other shots sit inside the main photograph, along its
           bottom edge, as squares. */
        .pd-thumbs {
            position: absolute;
            left: 24px;
            bottom: 24px;
            z-index: 2;
            display: flex;
            gap: 14px;
        }
        /* Rounded cards along the bottom edge, like the numbered steps in the
           reference: the selected one is solid white, the rest are frosted. */
        .pd-thumb {
            width: 104px;
            height: 104px;
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.28);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.55);
            padding: 0;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            transition: border-color 0.2s, opacity 0.2s, transform 0.2s;
            opacity: 0.85;
        }
        .pd-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .pd-thumb:hover { opacity: 1; transform: translateY(-2px); }
        .pd-thumb.active {
            background: #fff;
            border-color: #fff;
            opacity: 1;
        }
        .pd-thumb:focus-visible { outline: 3px solid #111; outline-offset: 3px; }

        @media (max-width: 900px) {
            .pd-main-img { height: 62vh; min-height: 360px; }
            .pd-thumbs { left: 14px; bottom: 14px; gap: 10px; }
            .pd-thumb { width: 84px; height: 84px; }
        }

        /* Data half — minimal: type kicker, name, price, hairline rules */
        /* The panel reads like the sign-up form in the reference: one narrow column
           centred in its half, headed by the name and closed by the buttons. */
        .product-banner-info {
            min-width: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 64px 56px;
        }
        .product-banner-info > * { width: 100%; max-width: 380px; }

        /* --- Minimal product data panel: type · name · price · hairline specs --- */
        .pd-type {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #999;
            font-weight: 600;
        }

        .pd-name {
            font-size: 30px;
            font-weight: 500;
            color: #111;
            line-height: 1.2;
            letter-spacing: 0.2px;
            margin-top: 10px;
        }

        .pd-price {
            font-size: 22px;
            font-weight: 500;
            color: #111;
            margin-top: 8px;
            letter-spacing: 0.2px;
        }

        .pd-seller {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #ededea;
            cursor: pointer;
            text-decoration: none;
        }
        .pd-seller:hover .seller-name { text-decoration: underline; }

        .seller-avatar { display: none; }   /* minimal: the name alone carries it */

        .pd-seller-meta { display: inline-flex; align-items: baseline; gap: 8px; }
        .pd-seller-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #999; font-weight: 600; }
        .seller-name { font-size: 13px; color: #111; font-weight: 600; }

        .pd-desc {
            font-size: 13px;
            color: #6b6b6b;
            line-height: 1.8;
            margin-top: 14px;
        }

        /* Specs as filled fields, two to a row — the form block of the panel. */
        .pd-specs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            margin-top: 26px;
            border-top: 1px solid #ededea;
        }

        /* Minimal: no filled boxes — each spec is a hairline-ruled row, label at
           the start and value at the end. */
        .pd-spec {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 2px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ededea;
            text-align: start;
        }
        .pd-spec:last-child:nth-child(odd) { grid-column: auto; }

        .pd-spec-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #999;
            font-weight: 600;
        }

        .pd-spec-value { font-size: 13px; color: #111; font-weight: 600; }

        .pd-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 28px;
        }

        /* Both buttons are plain rectangles: cart green, wishlist white/outlined */
        .pd-add {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #111;
            padding: 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.25s, color 0.25s;
            border-radius: 10px;
        }

        .pd-add:hover { background: #333; border-color: #333; }

        .pd-wish {
            width: 100%;
            border: 1px solid #e0e0dd;   /* thin outline */
            border-radius: 10px;
            background: #fff;
            color: #111;
            padding: 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: border-color 0.2s, background 0.2s;
        }

        .pd-wish:hover { border-color: #111; background: #fafafa; }
        .pd-wish.active { border-color: #111; background: #fff; color: #111; }

        /* ==================== TOASTS ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #004225;
            color: white;
            padding: 14px 22px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateX(-120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(0);
        }






        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .product-hero { padding: 24px 16px; }
            .product-banner {
                grid-template-columns: 1fr;   /* gallery on top, data below */
                border-radius: 16px;
            }
            .pd-main-img { min-height: 340px; }
            .product-banner-info { padding: 34px 24px 40px; }
            .product-banner-icon { font-size: 120px; }
            .pd-name { font-size: 22px; }
        }

        @media (max-width: 768px) {
            .header-container {
                grid-template-columns: auto 1fr auto;
                gap: 20px;
            }

            .header-left {
                display: none;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 6px;
            }
        }
    </style>

    <script>function goBackToStore(){ if (document.referrer && history.length > 1) history.back(); else location.href = "index.html"; }</script>
    <!-- No site header on the product page. -->


    <!-- ==================== PRODUCT HERO ==================== -->
    <div class="product-hero" id="productHero">
        <div class="product-banner">
            <div class="product-banner-info">
                <span class="pd-type" id="productType">סוג</span>
                <h1 class="pd-name" id="productName">שם המוצר</h1>
                <div class="pd-price" id="productPrice">₪0.00</div>

                <a class="pd-seller" onclick="goHome()">
                    <div class="seller-avatar" id="sellerAvatar">מ</div>
                    <div class="pd-seller-meta">
                        <span class="pd-seller-label">מוכר</span>
                        <span class="seller-name" id="sellerName">שם המוכר</span>
                    </div>
                </a>

                <p class="pd-desc" id="productDesc">תיאור המוצר יופיע כאן</p>

                <div class="pd-specs" id="productSpecs">
                    <div class="pd-spec"><span class="pd-spec-label">סוג</span><span class="pd-spec-value" id="specType">-</span></div>
                    <div class="pd-spec"><span class="pd-spec-label">בד</span><span class="pd-spec-value" id="specFabric">-</span></div>
                    <div class="pd-spec"><span class="pd-spec-label">מידה</span><span class="pd-spec-value" id="specSize">-</span></div>
                    <div class="pd-spec"><span class="pd-spec-label">צבע</span><span class="pd-spec-value" id="specColor">-</span></div>
                    <div class="pd-spec"><span class="pd-spec-label">מצב פריט</span><span class="pd-spec-value" id="specCondition">-</span></div>
                </div>

                <div class="pd-actions">
                    <button class="pd-add" onclick="addProductToCart()">הוסף לעגלה</button>
                    <button class="pd-wish" id="wishBtn" onclick="toggleWishlist()">הוסף לרשימת המשאלות</button>
                </div>
            </div>
            <div class="product-banner-image">
                <div class="pd-main-img" id="pdMainImg">
                    <div class="pd-main-frame" id="pdMainFrame">
                        <div class="product-banner-icon" id="productIcon">🎨</div>
                    </div>
                    <!-- the other shots, inside the photograph; click to swap them in -->
                    <div class="pd-thumbs" id="pdThumbs"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- ==================== TOASTS ==================== -->

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Cart & Wishlist State
        let cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
        let currentProduct = null;

        function saveState() {
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_wishlist', JSON.stringify(wishlist));
        }

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            if (cb) { cb.textContent = cartCount; cb.classList.toggle('show', cartCount > 0); }
            if (wb) { wb.textContent = wishlist.length; wb.classList.toggle('show', wishlist.length > 0); }
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        // Every cart item is held for 48 hours from the moment it was added.
        const HOLD_MS = 48 * 60 * 60 * 1000;

        function addProductToCart() {
            if (!currentProduct) return;
            const id = `${currentProduct.name}|${currentProduct.price}`;
            const existing = cart.find(i => i.id === id);
            const now = Date.now();
            if (existing) {
                existing.qty++;
                existing.addedAt = now;
                existing.expiresAt = now + HOLD_MS;   // adding again restarts the hold
            } else {
                cart.push({
                    id: id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    icon: currentProduct.icon,
                    category: currentProduct.category,
                    seller: currentProduct.seller,
                    rating: currentProduct.rating,
                    qty: 1,
                    addedAt: now,
                    expiresAt: now + HOLD_MS
                });
            }
            saveState();
            updateBadges();
            // Slide the page out, then land straight on the cart.
            document.body.classList.add('slide-out');
            setTimeout(() => { window.location.href = 'index.html?open=cart'; }, 460);
        }

        // ---- Gallery: the icon frame plus three more shots of the same item.
        // Clicking a thumbnail swaps it into the main frame.
        function galleryShots(product) {
            const seed = encodeURIComponent(product.name || 'vero');
            // A listing carries three photographs — the main one plus two others,
            // the same three the upload wizard asks the seller for.
            return [
                { icon: product.icon },                                    // the item's own icon
                { src: `https://picsum.photos/seed/${seed}-a/900/900` },
                { src: `https://picsum.photos/seed/${seed}-b/900/900` }
            ];
        }

        let galleryItems = [];

        function buildGallery(product) {
            galleryItems = galleryShots(product);
            const thumbs = document.getElementById('pdThumbs');
            // the main frame starts on shot 0, so the thumbnails are shots 1..3
            thumbs.innerHTML = galleryItems.slice(1).map((s, i) =>
                `<button class="pd-thumb" onclick="showShot(${i + 1})" aria-label="תמונה ${i + 2}">
                    <img src="${s.src}" alt="" loading="lazy" onerror="this.remove()">
                 </button>`).join('');
            showShot(0);
        }

        function showShot(i) {
            const shot = galleryItems[i];
            if (!shot) return;
            const main = document.getElementById('pdMainFrame');
            main.innerHTML = shot.src
                ? `<img src="${shot.src}" alt="${currentProduct ? currentProduct.name : ''}">`
                : `<div class="product-banner-icon" id="productIcon">${shot.icon || '🛍️'}</div>`;
            document.querySelectorAll('.pd-thumb').forEach((t, idx) => {
                t.classList.toggle('active', idx + 1 === i);
            });
        }

        function toggleWishlist() {
            if (!currentProduct) return;
            const id = `${currentProduct.name}|${currentProduct.price}`;
            const btn = document.getElementById('wishBtn');
            const idx = wishlist.findIndex(i => i.id === id);
            if (idx >= 0) {
                wishlist.splice(idx, 1);
                btn.classList.remove('active');
                btn.textContent = 'הוסף לרשימת המשאלות';
                showToast(`הוסר מרשימת המשאלות: ${currentProduct.name}`);
            } else {
                wishlist.push({
                    id, name: currentProduct.name, price: currentProduct.price,
                    icon: currentProduct.icon, category: currentProduct.category,
                    seller: currentProduct.seller, rating: currentProduct.rating,
                    addedAt: Date.now()
                });
                btn.classList.add('active');
                btn.textContent = 'הסר מרשימת המשאלות';
                showToast(`נוסף לרשימת המשאלות: ${currentProduct.name}`);
            }
            saveState();
            updateBadges();
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function goHomeCategory() {
            window.location.href = 'index.html';
        }

        function openWishlist() {
            window.location.href = 'index.html';
        }

        function openCart() {
            window.location.href = 'index.html';
        }


        // Load product from URL parameter
        const params = new URLSearchParams(window.location.search);
        const productData = params.get('product');

        if (productData) {
            try {
                currentProduct = JSON.parse(decodeURIComponent(productData));

                // Big title: clothing → company (seller) name, art → product name
                const isArt = currentProduct.type === 'art';
                document.getElementById('productName').textContent =
                    isArt ? currentProduct.name : (currentProduct.seller || 'Vero Store');

                // Product type: extract first word from product name (e.g., "טי-שירט לבן קלאסי" → "טי-שירט")
                const productTypeName = currentProduct.name.split(' ')[0];
                document.getElementById('productType').textContent = productTypeName;

                // Seller row: name and avatar
                document.getElementById('sellerName').textContent = currentProduct.seller || 'Vero Store';
                const sellerInitial = (currentProduct.seller || 'V')[0].toUpperCase();
                document.getElementById('sellerAvatar').textContent = sellerInitial;

                // The seller's own edits and any discount, folded in here so the
                // page shows exactly what the cards elsewhere show.
                currentProduct = veroApplyOverride(currentProduct);
                document.getElementById('productPrice').innerHTML = veroPriceHTML(currentProduct);
                buildGallery(currentProduct);

                document.getElementById('productDesc').textContent = currentProduct.desc ||
                    `${currentProduct.name} — פריט יד שנייה במצב מעולה, זמין כעת בחנות.`;

                // Dry specs (use provided values or sensible defaults)
                document.getElementById('specType').textContent = currentProduct.category || '-';
                document.getElementById('specFabric').textContent = currentProduct.fabric || (currentProduct.type === 'art' ? 'קנבס' : 'כותנה');
                document.getElementById('specSize').textContent = currentProduct.size || (currentProduct.type === 'art' ? '50×70 ס"מ' : 'M');
                document.getElementById('specColor').textContent = currentProduct.color || 'רב-גוני';
                document.getElementById('specCondition').textContent = currentProduct.condition || 'מצוין';

                // Reflect whether this item is already in the wishlist.
                const wid = `${currentProduct.name}|${currentProduct.price}`;
                if (wishlist.some(i => i.id === wid)) {
                    const wb = document.getElementById('wishBtn');
                    wb.classList.add('active');
                    wb.textContent = 'הסר מרשימת המשאלות';
                }
            } catch (e) {
                console.error('Error loading product:', e);
            }
        }

        // Initialize
        updateBadges();
    </script>
    <!-- Gentle site-wide animations: page fade-in + reveal-on-scroll. -->
    <script src="vero-animations.js"></script>
    <!-- Live manual editor (✎ button, bottom-left) — move & resize any piece. -->
    <script src="vero-editor.js"></script>
</body>
</html>
