<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phone-only presentation: opened as a top-level window this page hands off to
         phone-frame.html, which reloads it inside a phone-width iframe. Inside that
         frame (window.top !== self) the check is skipped, so the page renders. -->
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';   // some servers serve clean URLs (no .html)
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf));
      }
    </script>
    <title>VERO — Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow-x: hidden;
        }

        /* Sticky search — a floating round button fixed to the viewport that opens
           a search pill. Both stay put while the page scrolls. */
        .search-fab {
            position: fixed; bottom: 28px; right: 28px; z-index: 60;
            width: 54px; height: 54px; border-radius: 999px; border: none; cursor: pointer;
            background: #000; color: #fff; display: grid; place-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: transform 0.2s, opacity 0.2s;
        }
        .search-fab:hover { transform: scale(1.06); }
        .search-fab.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }
        .search-fab svg {
            width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .search-pop {
            position: fixed; bottom: 28px; right: 28px; z-index: 61;
            display: none; align-items: center; gap: 10px;
            width: min(420px, calc(100vw - 56px));
            padding: 11px 16px; border-radius: 999px;
            background: #fff; border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-pop.open { display: flex; }
        .search-pop svg {
            width: 18px; height: 18px; flex: none; fill: none; stroke: #1c1c1c;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        }
        .search-pop input {
            border: none; outline: none; background: none; flex: 1; min-width: 0;
            font-family: inherit; font-size: 12.50px; color: #1c1c1c;
        }
        .search-pop-close {
            border: none; background: none; cursor: pointer; flex: none;
            font-size: 20.00px; line-height: 1; color: #6b6b6b;
        }
        .search-pop-close:hover { color: #1c1c1c; }

        /* Back button — same pill language as the rest of the site. */
        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 12px;
            padding: 6px 4px; border: none; border-radius: 0;
            font-size: 14px; letter-spacing: 2px; text-decoration: none; color: #fff;
            background: none; text-shadow: 0 1px 10px rgba(0,0,0,0.55);
            transition: opacity 0.25s;
        }
        .back svg, .back img { width: 22px; height: 22px; }
        .back:hover { opacity: 0.7; }

        /* The whole page slides in from the left, like every other area. */
        .wrap { animation: slideInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-6vw); }
            to   { opacity: 1; transform: none; }
        }

        /* ===================== HERO =====================
           The store's background image (set in settings), full-bleed, with the
           store name and tagline laid over a bottom scrim. No profile picture. */
        .hero {
            position: relative; width: 100%; height: 64vh; min-height: 440px;
            background: #23231f center / cover no-repeat;
            border-bottom: 1px solid #000;
            display: flex; align-items: flex-end;
        }
        .hero::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0.55) 100%);
        }
        .hero-inner { position: relative; z-index: 2; padding: 0 44px 40px; color: #fff; width: 100%; }
        /* Bottom row: name + status/follow at left, follower count at right. */
        .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; }
        .hero-lead { display: flex; align-items: flex-end; gap: 26px; min-width: 0; }
        .hero-name { font-size: clamp(46px, 8vw, 104px); font-weight: 200; letter-spacing: 2px; line-height: 0.82; }
        /* OPEN status + Follow, stacked beside the name and sitting on its baseline. */
        .hero-meta { display: flex; flex-direction: column; gap: 7px; padding-bottom: 8px; flex: none; }
        .hero-status { font-size: 9.17px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; }
        .hero-status.is-closed { opacity: 0.6; }
        /* Follower / following / products slider — right-aligned, one stat visible
           at a time, fading between them. Fixed box so the layout never jumps. */
        .hero-followers { position: relative; flex: none; width: 230px; height: 58px; }
        .hero-followers .hero-stat {
            position: absolute; right: 0; top: 0; text-align: right;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none;
        }
        .hero-followers .hero-stat.is-active { opacity: 1; transform: none; }
        .hf-num { font-size: clamp(20px, 2.6vw, 32px); font-weight: 300; letter-spacing: 8px; line-height: 1; }
        .hf-lbl { font-size: 10.83px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.9; }
        @media (max-width: 700px) {
            /* ===== Dedicated mobile hero =====
               The background image fills the whole screen; a single centred column
               is pinned to its bottom — profile picture, big name, status + follow,
               then the rotating stat. The rest of the profile scrolls up from below. */
            .hero {
                height: 100vh; height: 100dvh; min-height: 0;
                flex-direction: column; justify-content: center; align-items: center;
            }
            .hero-inner { padding: 0 22px; width: 100%; }
            .hero-row  { flex-direction: column; align-items: center; gap: 14px; }
            /* Dissolve the name+meta wrapper so the stats slider can sit between the
               name and the OPEN / Follow row (order is set on .hero-row directly). */
            .hero-lead { display: contents; }
            .hero-name {
                order: 1; text-align: center; font-size: clamp(40px, 12.5vw, 58px);
                line-height: 0.92; letter-spacing: 1px; max-width: 100%;
            }
            /* Status + Follow + Socials sit in one centred row below the stats. */
            .hero-meta { order: 3; flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding-bottom: 0; }
            .hero-socials-btn { align-self: center; }
            /* Followers / Following / Products slider — placed directly under the name.
               Its slides are absolute, so re-anchor them to the centre. */
            .hero-followers { order: 2; width: auto; height: 46px; }
            .hero-followers .hero-stat {
                left: 50%; right: auto; align-items: center; text-align: center;
                transform: translate(-50%, 10px);
            }
            .hero-followers .hero-stat.is-active { transform: translate(-50%, 0); }
            .hf-num { letter-spacing: 6px; }
            /* Floating verified badge is anchored to the desktop name position;
               drop it on the centred mobile layout (matches the personal profile). */
            .verified-check { display: none; }
        }
        /* Shared five-star rating (outline stars, proportional fill). */
        .vero-stars { position: relative; display: inline-flex; align-items: center; line-height: 1; font-size: 15.00px; direction: ltr; }
        .vero-stars-base, .vero-stars-fill { letter-spacing: 3px; }
        .vero-stars-base { color: #d9d9d4; }
        .vero-stars-fill { color: #111; position: absolute; top: 0; left: 0; width: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
        .vero-stars-num { margin-left: 10px; font-size: 10.83px; color: #6b6b66; letter-spacing: 0.3px; }
        .hero-rating { margin-top: 14px; }
        .hero-tag  { margin-top: 14px; font-size: 12.50px; font-weight: 300; letter-spacing: 0.5px; max-width: 620px; opacity: 0.92; }
        /* Small blue verified check, floated over the hero above the name. */
        .verified-check {
            position: absolute; z-index: 3; left: 44px; bottom: calc(40px + clamp(46px, 8vw, 104px) + 14px);
            display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none;
            border-radius: 50%; background: #2f6bff; color: #fff; font-size: 10px; font-weight: 700;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }
        .verified-check.is-hidden { display: none; }

        /* SOCIALS — a small underlined label under Follow, in the hero-meta stack. */
        .hero-socials-btn {
            padding: 0; cursor: pointer; align-self: flex-start;
            border: none; background: none; color: #fff;
            font-family: inherit; font-size: 8.33px; letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(255,255,255,0.5);
            transition: text-decoration-color 0.2s;
        }
        .hero-socials-btn:hover { text-decoration-color: #fff; }

        /* SOCIALS popup — a small centred dialog listing each network. */
        .soc-overlay {
            position: fixed; inset: 0; z-index: 85; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
        }
        .soc-overlay.open { display: flex; }
        .soc-modal {
            width: min(360px, 100%); background: #fff; border-radius: 16px; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .soc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .soc-title { font-size: 10.83px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .soc-x {
            width: 30px; height: 30px; border: none; background: none; cursor: pointer;
            font-size: 20.00px; line-height: 1; color: #9a9a95; border-radius: 999px;
        }
        .soc-x:hover { background: #f0f0f0; color: #1c1c1c; }
        .soc-links { display: flex; flex-direction: column; gap: 10px; }
        .soc-links a {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 14px; border: 1px solid rgba(0,0,0,0.14); border-radius: 12px;
            color: #1c1c1c; text-decoration: none; font-size: 11.67px; letter-spacing: 0.4px;
            transition: background 0.2s, border-color 0.2s;
        }
        .soc-links a:hover { background: #f6f6f3; border-color: #000; }
        .soc-links svg { width: 22px; height: 22px; fill: currentColor; display: block; flex: none; }
        .hero-stat {
            position: absolute; right: 0; top: 0; text-align: right;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; transform: translateY(14px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        .hero-stat.is-active { opacity: 1; transform: translateY(0); }
        .hs-num { font-size: 48.33px; font-weight: 200; line-height: 1; }
        .hs-lbl { font-size: 10.00px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        /* Follow — plain bold text beside the name (matches the mock), not a pill. */
        .follow-btn {
            padding: 0; border: none; background: none; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 12.50px; font-weight: 600; letter-spacing: 1px;
            text-align: left; transition: opacity 0.2s;
        }
        .follow-btn:hover { opacity: 0.75; }
        .follow-btn.following { font-weight: 500; opacity: 0.85; }

        /* ===================== SLIDERS =====================
           A horizontally-scrolling row of outline chips. Two of them: the
           store's categories and the audiences it serves. Only what the seller
           offers is rendered. */
        .slider-block { padding: 26px 40px 0; }
        .slider-label { font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; margin-bottom: 12px; }
        .slider {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .slider::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 10px 22px; border: 1.4px solid #000; border-radius: 999px;
            background: #fff; color: #1c1c1c; cursor: pointer; white-space: nowrap;
            font-family: inherit; font-size: 10.00px; letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }
        .chip:hover { background: #efefec; }
        .chip.active { background: #000; color: #fff; }

        /* Featured slider — five product cards in a horizontal row. Same card
           and product-card.css as the feed; only the rail (flex + widths) lives
           here. */
        .feat-slider {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .feat-slider::-webkit-scrollbar { display: none; }
        .feat-slider .product-card {
            /* Five across, matching the feed's column width. */
            flex: none; width: calc((100% - 64px) / 5);
        }
        @media (max-width: 700px) {
            .feat-slider .product-card { width: calc((100% - 14px) / 2); }
        }

        /* Per-product edit button — rides on top of the shared card (store-profile
           only; product-card.css is untouched). */
        .sp-edit {
            position: absolute; top: 10px; left: 10px; z-index: 3;
            width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center; padding: 0;
            border: none; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.15s, background 0.2s;
        }
        .sp-edit:hover { transform: scale(1.08); background: #fff; }
        .sp-edit svg { width: 17px; height: 17px; fill: none; stroke: #1c1c1c; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

        /* Edit dialog. */
        .pe-overlay {
            position: fixed; inset: 0; z-index: 80; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
        }
        .pe-overlay.open { display: flex; }
        .pe-modal {
            width: min(400px, 100%); background: #fff; border-radius: 16px; padding: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .pe-title { font-size: 15.00px; font-weight: 500; margin-bottom: 20px; }
        .pe-field { display: block; margin-bottom: 16px; }
        .pe-field span { display: block; font-size: 9.17px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a9a95; margin-bottom: 7px; }
        .pe-field select {
            width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.2); border-radius: 9px;
            font-family: inherit; font-size: 11.67px; background: #fff; color: #1c1c1c;
        }
        .pe-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
        .pe-btn {
            padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 10.83px;
            letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; border: 1.4px solid #000;
        }
        .pe-btn.ghost { background: #fff; color: #1c1c1c; }
        .pe-btn.ghost:hover { background: #f0f0f0; }
        .pe-btn.solid { background: #000; color: #fff; }
        .pe-btn.solid:hover { opacity: 0.85; }

        /* Audience banner — a full-bleed image slider, edge to edge of the page,
           cycling Women / Men / Kids. Same treatment as the hero. */
        .aud-banner {
            position: relative; width: 100%; height: 58vh; min-height: 420px;
            overflow: hidden; border-top: 1px solid #000; border-bottom: 1px solid #000;
        }
        .aud-slide {
            position: absolute; inset: 0; cursor: pointer;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            opacity: 0; transition: opacity 1s ease; z-index: 1;
        }
        .aud-slide.is-active { opacity: 1; z-index: 2; }
        .aud-slide::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
        }
        .aud-label {
            position: absolute; left: 40px; bottom: 34px; z-index: 3; color: #fff;
            font-size: clamp(34px, 5vw, 62px); font-weight: 200; letter-spacing: 1px;
            line-height: 1; pointer-events: none;
        }
        .aud-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
            width: 46px; height: 46px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid rgba(255,255,255,0.7); background: rgba(0,0,0,0.25);
            color: #fff; font-size: 16.67px; line-height: 1;
            transition: background 0.2s, border-color 0.2s;
        }
        .aud-arrow:hover { background: rgba(0,0,0,0.55); border-color: #fff; }
        .aud-arrow.prev { left: 24px; }
        .aud-arrow.next { right: 24px; }
        .aud-dots {
            position: absolute; right: 40px; bottom: 40px; z-index: 4;
            display: flex; gap: 10px;
        }
        .aud-dot {
            width: 9px; height: 9px; border-radius: 999px; padding: 0; cursor: pointer;
            border: 1px solid #fff; background: transparent; transition: background 0.3s;
        }
        .aud-dot.is-active { background: #fff; }
        @media (max-width: 700px) {
            .aud-label { left: 20px; bottom: 24px; }
            .aud-dots  { right: 20px; bottom: 28px; }
            .aud-arrow { width: 38px; height: 38px; }
            .aud-arrow.prev { left: 14px; }
            .aud-arrow.next { right: 14px; }
        }

        /* Clothing-category slider — a quarter-width info panel on the left and a
           three-quarter viewport on the right showing three cards. The leftmost
           (lead) card scales up and is the selected category. */
        .clo-block {
            /* Card size + gap drive both the track and the viewport width, so the
               viewport holds exactly three small cards; the info panel fills the
               rest of the row on the left. */
            --clo-w: 210px; --clo-gap: 8px;
            display: flex; gap: 28px; align-items: stretch;
        }
        .clo-info {
            flex: 1 1 auto; min-width: 0;
            display: flex; flex-direction: column; justify-content: center;
            padding-right: 8px;
        }
        .clo-kicker {
            font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase;
            color: #9a9a95; margin-bottom: 14px;
        }
        .clo-info-title { font-size: 28.33px; font-weight: 300; line-height: 1.05; color: #1c1c1c; }
        .clo-info-desc {
            margin-top: 14px; font-size: 11.67px; font-weight: 300; line-height: 1.6;
            color: #55554f; max-width: 320px;
        }
        .clo-nav { display: flex; gap: 10px; margin-top: 26px; }
        .clo-arrow {
            width: 42px; height: 42px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid #000; background: transparent;
            color: #111; font-size: 16.67px; line-height: 1;
            transition: background 0.2s, color 0.2s;
        }
        .clo-arrow:hover { background: #000; color: #fff; }

        /* The viewport is exactly three cards wide, so only three ever show. */
        .clo-slider {
            flex: 0 0 auto;
            width: calc(var(--clo-w) * 5 + var(--clo-gap) * 4);
            position: relative; overflow: hidden; padding: 18px 0;
        }
        .clo-track {
            display: flex; gap: var(--clo-gap);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .clo-card {
            /* Small equal cards, no enlargement, tight gaps. */
            flex: none; width: var(--clo-w); cursor: pointer;
            background: none; border: none; padding: 0; font-family: inherit; text-align: left;
        }
        .clo-thumb {
            width: 100%; aspect-ratio: 3 / 5; border: 1px solid #000;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            transition: filter 0.4s;
        }
        .clo-card.is-lead .clo-thumb { filter: grayscale(0); }
        .clo-cap {
            display: flex; align-items: baseline; gap: 10px; margin-top: 14px;
            font-size: 13.33px; letter-spacing: 0.5px; color: #1c1c1c;
        }
        .clo-num { font-size: 10.83px; color: #9a9a95; letter-spacing: 1px; }
        .clo-card.is-lead .clo-cap { font-weight: 600; }

        @media (max-width: 700px) {
            .clo-block { flex-direction: column; gap: 18px; --clo-w: 150px; --clo-gap: 8px; }
            .clo-info { flex-basis: auto; max-width: none; }
            /* The 5-card fixed width overflows a phone — cap it to the screen and let
               overflow:hidden clip; the arrows still page through the track. */
            .clo-slider { width: 100%; max-width: 100%; }
        }

        /* ===================== AD BANNER =====================
           The seller's own promo, but a FIXED size on every store profile. */
        .ad-band {
            margin: 30px 40px 0; height: 150px; border: 1px solid #000;
            background: #23231f center / cover no-repeat; position: relative;
            display: flex; align-items: center; overflow: hidden;
        }
        .ad-band::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.05) 70%);
        }
        .ad-copy { position: relative; z-index: 2; padding: 0 40px; color: #fff; }
        .ad-kicker { font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; }
        .ad-title { font-size: clamp(22px, 3vw, 34px); font-weight: 300; margin-top: 6px; line-height: 1.1; }
        /* Inside the feed grid the ad band spans the full row, between every
           two rows of five products. */
        .feed .ad-band { grid-column: 1 / -1; margin: 10px 0; }

        /* ===================== FEED =====================
           Five across, two rows. Filters live off the category + audience chips,
           exactly like the main feed. */
        .feed-head {
            display: flex; align-items: baseline; justify-content: space-between;
            margin: 44px 40px 0; padding-bottom: 14px; border-bottom: 1px solid #000;
        }
        .feed-title { font-size: 10.83px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .feed-note  { font-size: 10.00px; letter-spacing: 0.5px; color: #9a9a95; }
        .feed {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
            padding: 26px 40px 70px;
        }
        .feed-empty {
            margin: 26px 40px 70px; padding: 44px; border: 1px dashed #cfcfca;
            text-align: center; color: #9a9a95; font-size: 11.67px;
        }

        @media (max-width: 1100px) { .feed { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 700px)  {
            .feed { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 14px; }
            .hero-inner, .slider-block, .feed-head { padding-left: 20px; padding-right: 20px; }
            .ad-band, .feed-head { margin-left: 20px; margin-right: 20px; }
            .hs-num { font-size: 26.67px; }
        }

        /* VERO manual placement — DISABLED: fixed-pixel transforms broke the layout.
           Wrapped in @media (width:0) so none of it applies; structural CSS is used. */
        @media (width: 0px) {
        #heroStats {
            transform: translate(-105px, 18px) scale(1.5, 1.5);
            transform-origin: top left;
        }

        #socialsBtn {
            transform: translate(-1432px, -70px);
            transform-origin: top left;
        }

        #storeRating {
            transform: translate(9px, -76px);
            transform-origin: top left;
        }

        #storeTag {
            transform: translate(1468px, -11px);
            transform-origin: top left;
        }

        #storeName {
            transform: translate(3px, 53px);
            transform-origin: top left;

        #hero > div.hero-inner > div.hero-tag-row > div.hero-lead:nth-of-type(1) > div.hero-name-row:nth-of-type(1) > span.verified-check {
            transform: translate(2px, 72px);
            transform-origin: top left;
        }
        }  /* end DISABLED manual-placement @media */
    </style>

<body>
    <a class="back" href="index.html" onclick="if(history.length>1){history.back();return false;}">&#8592; חזרה</a>

    <!-- STICKY SEARCH POPUP — a floating button pinned to the viewport; clicking it
         opens a search field that filters the feed live. -->
    <button class="search-fab" id="searchFab" aria-label="Search this store">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    </button>
    <div class="search-pop" id="searchPop" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
        <input type="search" id="storeSearch" placeholder="Search this store…" autocomplete="off">
        <button class="search-pop-close" id="searchClose" aria-label="Close">&times;</button>
    </div>

    <div class="wrap">
        <!-- HERO — the store's background image full-bleed, with the store name
             big and thin at bottom-left, its OPEN status + Follow beside it, and
             the follower count set large at bottom-right. -->
        <div class="hero" id="hero">
            <span class="verified-check" id="verifiedCheck" title="VERO Verified Store" aria-label="VERO Verified Store">✓</span>
            <div class="hero-inner">
                <div class="hero-row">
                    <div class="hero-lead">
                        <h1 class="hero-name" id="storeName">Studio Noir</h1>
                        <div class="hero-meta">
                            <span class="hero-status" id="storeStatus">Open</span>
                            <button class="follow-btn" id="followBtn">Follow</button>
                            <button class="hero-socials-btn" id="socialsBtn" type="button" aria-haspopup="dialog">Socials</button>
                        </div>
                    </div>
                    <!-- Followers / Following / Products — one big letterspaced stat
                         at a time, auto-rotating (see the #heroStats rotator). -->
                    <div class="hero-followers" id="heroStats">
                        <div class="hero-stat is-active">
                            <span class="hf-num" id="followers">1,284</span>
                            <span class="hf-lbl">Followers</span>
                        </div>
                        <div class="hero-stat">
                            <span class="hf-num" id="following">0</span>
                            <span class="hf-lbl">Following</span>
                        </div>
                        <div class="hero-stat">
                            <span class="hf-num" id="itemCount">0</span>
                            <span class="hf-lbl">Products</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FEATURED PRODUCTS — five pieces the seller chose to highlight at the
             top of the profile. Built from the same product card + product-card.css
             as the feed. -->
        <div class="slider-block">
            <div class="slider-label">Featured</div>
            <div class="feat-slider" id="featSlider"></div>
        </div>

        <!-- AUDIENCE BANNER — a full-bleed image slider that reaches both edges of
             the page, cycling Women / Men / Kids. Clicking a slide filters the
             feed by that audience. -->
        <div class="aud-banner" id="audBanner"></div>

        <!-- CLOTHING CATEGORIES — three cards per view across three quarters of the
             row; the remaining quarter (left) carries the section title and the
             lead category's name + description. The leftmost card is scaled up and
             is the selected category; each page shifts the lead. -->
        <div class="slider-block">
            <div class="clo-block">
                <div class="clo-info">
                    <div class="clo-kicker">Shop by category</div>
                    <div class="clo-info-title" id="cloTitle">—</div>
                    <div class="clo-info-desc" id="cloDesc">—</div>
                    <div class="clo-nav">
                        <button class="clo-arrow prev" id="cloPrev" aria-label="Previous">&#8249;</button>
                        <button class="clo-arrow next" id="cloNext" aria-label="Next">&#8250;</button>
                    </div>
                </div>
                <div class="clo-slider">
                    <div class="clo-track" id="cloTrack"></div>
                </div>
            </div>
        </div>


        <!-- FEED -->
        <div class="feed-head">
            <div class="feed-title">The collection</div>
            <div class="feed-note" id="feedNote">—</div>
        </div>
        <div class="feed" id="feed"></div>
        <div class="feed-empty" id="feedEmpty" style="display:none;">
            Nothing here in this filter yet.
        </div>
    </div>

    <!-- SOCIALS popup — opened by the "Our Socials" button in the hero; lists the
         seller's networks to choose from. Links are built from STORE.socials. Placed
         before the main script so #socLinks exists when buildSocials runs. -->
    <div class="soc-overlay" id="socOverlay">
        <div class="soc-modal" role="dialog" aria-modal="true" aria-label="Our socials">
            <div class="soc-head">
                <div class="soc-title">Our Socials</div>
                <button class="soc-x" id="socClose" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="soc-links" id="socLinks"></div>
        </div>
    </div>

    <script>
        // ===================== DEMO DATA =====================
        // In the real build this comes from the store's own record + vero_listings.
        const STORE = {
            name: 'Studio Noir',
            tag: 'Curated wardrobe & one-off pieces. Tel Aviv.',
            followers: 1284,
            following: 312,
            hero: 'women-hero.jpg',        // background set in settings
            ad:   { image: 'men-hero.jpg', kicker: 'End of season', title: 'Up to 40% off selected pieces' },
            // Only the categories / audiences the seller actually offers get chips.
            categories: ['Dresses', 'Outerwear', 'Knitwear', 'Denim', 'Shoes', 'Bags'],
            audiences:  ['women', 'men', 'kids'],
            // Cover image per category (set by the seller; falls back to a neutral tile).
            catImages: {
                Dresses:   'women-hero.jpg',
                Outerwear: 'men-hero.jpg',
                Knitwear:  'clothing-hero.png',
                Denim:     'hero-beach.jpg',
                Shoes:     'gallery-hero.jpg',
                Bags:      'magazine-hero.jpg',
            },
            // A short line the seller writes for each category, shown in the
            // clothing slider's info panel.
            catDesc: {
                Dresses:   'From slip to structured — one-off dresses for day and night.',
                Outerwear: 'Coats and jackets built to layer through the season.',
                Knitwear:  'Hand-finished knits in wool, cotton and cashmere blends.',
                Denim:     'Raw and washed denim, cut clean and made to last.',
                Shoes:     'Everyday runners to evening leather, chosen with care.',
                Bags:      'Totes and crossbodies — quiet shapes, honest materials.',
            },
            // Which clothing categories each audience shows. Selecting Women / Men /
            // Kids in the banner re-builds the category slider from its list.
            audCategories: {
                women: ['Dresses', 'Outerwear', 'Knitwear', 'Bags'],
                men:   ['Outerwear', 'Knitwear', 'Denim', 'Shoes'],
                kids:  ['Knitwear', 'Denim', 'Shoes', 'Bags'],
            },
            // The seller's social links, entered in the seller area (My Shop). Only
            // the ones the seller fills in are shown.
            socials: {
                instagram: 'https://instagram.com/',
                tiktok:    'https://tiktok.com/',
                website:   'https://vero.example/',
            },
        };

        // A pool of demo products, each tagged with a category + audience so the
        // sliders can filter the feed like the main feed does.
        const CATS = STORE.categories;
        const AUDS = STORE.audiences;
        const ICONS = { Dresses:'👗', Outerwear:'🧥', Knitwear:'🧶', Denim:'👖', Shoes:'👟', Bags:'👜' };
        const NAMES = ['Wrap dress','Wool coat','Ribbed sweater','Raw denim','Runner','Tote','Silk shirt','Blazer','Cardigan','Slim jean','Loafer','Crossbody'];
        function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
        const PRODUCTS = Array.from({length: 40}, (_, i) => {
            const cat = rnd(CATS);
            return {
                id: i,
                name: NAMES[i % NAMES.length],
                cat,
                aud: rnd(AUDS),
                icon: ICONS[cat] || '🛍️',
                price: 79 + Math.floor(Math.random()*22)*10,
                rating: (4 + Math.random()).toFixed(1),
            };
        });

        // ===================== SELLER CONFIG =====================
        // Anything the seller set in the Storefront editor (My Shop) overrides the
        // demo above. Stored as vero_store_config in localStorage.
        (function applyStoreConfig() {
            let cfg; try { cfg = JSON.parse(localStorage.getItem('vero_store_config')); } catch (e) { cfg = null; }
            if (!cfg) return;

            // Shop name + tagline from the first-run questionnaire (My Shop editor).
            if (cfg.name) STORE.name = cfg.name;
            if (cfg.tag) STORE.tag = cfg.tag;

            // Store background → the hero image behind the store name.
            if (cfg.hero) STORE.hero = cfg.hero;
            // Banners → the ad band uses the first banner (the hero image is separate).
            if (Array.isArray(cfg.banners) && cfg.banners[0]) {
                const b = cfg.banners[0];
                STORE.ad = { image: b.image || STORE.ad.image, kicker: b.kicker || STORE.ad.kicker, title: b.title || STORE.ad.title };
            }
            // Categories → names, cover images, descriptions and type. The type is
            // the base kind (Dresses, Shoes…) the seller picked; it drives the icon
            // even when the category is given a custom name.
            if (Array.isArray(cfg.categories) && cfg.categories.length) {
                STORE.categories = cfg.categories.map(c => c.name);
                STORE.catImages = {}; STORE.catDesc = {}; STORE.catType = {};
                cfg.categories.forEach(c => {
                    if (c.image) STORE.catImages[c.name] = c.image;
                    if (c.desc)  STORE.catDesc[c.name]  = c.desc;
                    if (c.type)  STORE.catType[c.name]  = c.type;
                });
            }
            // Collections → which categories each audience shows.
            if (cfg.collections) STORE.audCategories = cfg.collections;
            // Opening hours → drives the OPEN / CLOSED status in the hero.
            if (cfg.hours) STORE.hours = cfg.hours;

            // Products → rebuild the feed pool from the seller's division, keeping a
            // demo price/rating/icon for anything not carried in the config.
            if (Array.isArray(cfg.products) && cfg.products.length) {
                PRODUCTS.length = 0;
                cfg.products.forEach((p, i) => PRODUCTS.push({
                    id: i, name: p.name,
                    cat: p.cat, aud: p.aud,
                    icon: ICONS[p.cat] || ICONS[(STORE.catType && STORE.catType[p.cat])] || '🛍️',
                    price: p.price != null ? p.price : 79 + ((i * 7) % 22) * 10,
                    rating: p.rating != null ? p.rating : (4 + (i % 10) / 10).toFixed(1),
                }));
            }
        })();

        // Live numbers shared with My Shop (profile.html): the follower count comes
        // from the seller's profile record and the item count from their live
        // listings — so the storefront always shows the same figures the seller
        // sees in their My Shop. Runs even when there is no store config yet.
        (function syncLiveData() {
            let sellerProf; try { sellerProf = JSON.parse(localStorage.getItem('vero_seller_profile')) || {}; } catch (e) { sellerProf = {}; }
            let prof; try { prof = JSON.parse(localStorage.getItem('vero_profile')) || {}; } catch (e) { prof = {}; }
            const followers = (sellerProf.followers != null) ? sellerProf.followers : prof.followers;
            if (followers != null && !isNaN(Number(followers))) STORE.followers = Number(followers);
            const following = (sellerProf.following != null) ? sellerProf.following : prof.following;
            if (following != null && !isNaN(Number(following))) STORE.following = Number(following);
            // The "About" the seller types in My Shop settings becomes the store's
            // tagline (the description shown directly under the name).
            const bio = (sellerProf.bio || prof.bio || '').trim();
            if (bio) STORE.tag = bio;

            // Name + socials edited on the My Shop settings page (vero_seller_profile)
            // take precedence, so the storefront always mirrors the settings exactly.
            if (sellerProf.name && sellerProf.name.trim()) STORE.name = sellerProf.name.trim();
            if (sellerProf.hours) STORE.hours = sellerProf.hours;
            if (sellerProf.socials) {
                const s = Object.assign({}, STORE.socials);
                ['instagram', 'tiktok', 'twitter', 'facebook', 'website'].forEach(k => {
                    if (sellerProf.socials[k]) s[k] = sellerProf.socials[k];
                });
                STORE.socials = s;
            }

            let listings; try { listings = JSON.parse(localStorage.getItem('vero_listings')) || []; } catch (e) { listings = []; }
            if (Array.isArray(listings)) {
                STORE.itemsLive = listings.filter(p => (p.status || 'active') === 'active').length;
            }
        })();

        // ===================== RENDER =====================
        const nis = n => '₪' + (Number(n)||0).toLocaleString('en-US');
        let activeCat = 'all';
        let activeAud = 'all';
        let searchTerm = '';

        // Five-star rating markup (outline stars filled proportionally).
        function veroStarsHTML(rating) {
            const r = Math.max(0, Math.min(5, Number(rating) || 0));
            return `<span class="vero-stars-base">★★★★★</span>`
                + `<span class="vero-stars-fill" style="width:${(r/5)*100}%">★★★★★</span>`
                + `<span class="vero-stars-num">${r.toFixed(1)}</span>`;
        }
        // A store rating derived from its products (falls back to a stable 4.x).
        function storeRatingValue() {
            const rs = (PRODUCTS || []).map(p => Number(p.rating)).filter(n => !isNaN(n));
            if (rs.length) return rs.reduce((a, b) => a + b, 0) / rs.length;
            let h = 0; const s = STORE.name || 'Store';
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return 4 + (h % 10) / 10;
        }

        // Hero + ad + header text.
        document.getElementById('storeName').textContent = STORE.name;
        document.getElementById('followers').textContent = STORE.followers.toLocaleString('en-US');
        document.getElementById('following').textContent = (Number(STORE.following) || 0).toLocaleString('en-US');
        document.getElementById('hero').style.backgroundImage = `url('${STORE.hero}')`;
        document.getElementById('itemCount').textContent =
            (STORE.itemsLive != null ? STORE.itemsLive : PRODUCTS.length);

        // OPEN / CLOSED status, computed from the seller's opening hours (set on the
        // My Shop settings page). hours = { 0..6: {open:'09:00', close:'18:00'} | null }.
        (function renderStatus() {
            const el = document.getElementById('storeStatus');
            if (!el) return;
            const hours = STORE.hours;
            let open = true;   // default open when the seller has set no hours
            if (hours && typeof hours === 'object') {
                const now = new Date();
                const day = hours[now.getDay()];
                if (!day || !day.open || !day.close) open = false;
                else {
                    const cur = now.getHours() * 60 + now.getMinutes();
                    const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
                    open = cur >= toMin(day.open) && cur < toMin(day.close);
                }
            }
            el.textContent = open ? 'Open' : 'Closed';
            el.classList.toggle('is-closed', !open);
        })();

        // Build the two sliders. "All" first, then only what the seller offers.
        const AUD_LABEL = { women:'Women', men:'Men', kids:'Kids' };
        function buildSlider(el, values, labelFn, onPick, key) {
            const chips = [['all','All'], ...values.map(v => [v, labelFn(v)])];
            el.innerHTML = chips.map(([v,l]) =>
                `<button class="chip ${v==='all'?'active':''}" data-v="${v}">${l}</button>`).join('');
            el.addEventListener('click', e => {
                const b = e.target.closest('.chip'); if (!b) return;
                el.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                b.classList.add('active');
                onPick(b.dataset.v);
            });
        }

        // The card — same markup + shared product-card.css as the rest of the site.
        // A local edit button rides on top (store-profile only; it does not touch
        // the shared card component). It carries the product's id.
        function card(p) {
            return `
                <a class="product-card" href="#" title="${p.name}">
                    <button class="sp-edit" data-edit="${p.id}" title="Edit product" aria-label="Edit product">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z"></path><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"></line></svg>
                    </button>
                    <div class="product-image">${p.icon}</div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price"><span class="vprice">${nis(p.price)}</span></div>
                        </div>
                        <div class="pc-right">
                            <div class="product-name">${p.name}</div>
                            <div class="product-rating">★ ${p.rating}</div>
                        </div>
                    </div>
                </a>`;
        }

        // The seller's promo banner, inserted into the feed as a full-width row.
        function adBand() {
            return `
                <div class="ad-band" style="background-image:url('${STORE.ad.image}')">
                    <div class="ad-copy">
                        <div class="ad-kicker">${STORE.ad.kicker}</div>
                        <div class="ad-title">${STORE.ad.title}</div>
                    </div>
                </div>`;
        }

        // Feed = 5 across, filtered by the two chips. The seller's ad banner is
        // dropped in after every 10 products (two rows of five).
        const AD_EVERY = 10;
        function renderFeed() {
            const filtered = PRODUCTS.filter(p => {
                // A live search spans the whole store, so it overrides the category
                // filter; without a search, the category / audience filters apply.
                const nameOk = searchTerm === '' || p.name.toLowerCase().includes(searchTerm);
                const catOk  = searchTerm !== '' || activeCat === 'all' || p.cat === activeCat;
                const audOk  = activeAud === 'all' || p.aud === activeAud;
                return nameOk && catOk && audOk;
            });
            const feed = document.getElementById('feed');
            const empty = document.getElementById('feedEmpty');
            let html = '';
            filtered.forEach((p, i) => {
                html += card(p);
                // After every full block of ten products, insert a banner — but not
                // when that block is also the very last product (no trailing banner).
                if ((i + 1) % AD_EVERY === 0 && i + 1 < filtered.length) html += adBand();
            });
            feed.innerHTML = html;
            feed.style.display = filtered.length ? 'grid' : 'none';
            empty.style.display = filtered.length ? 'none' : 'block';
            document.getElementById('feedNote').textContent =
                `${filtered.length} item${filtered.length===1?'':'s'}`;
        }
        renderFeed();

        // Featured — the five pieces the seller highlighted, rendered with the
        // same card() as the feed so they stay identical to it.
        const FEATURED = PRODUCTS.slice(0, 5);
        document.getElementById('featSlider').innerHTML = FEATURED.map(card).join('');

        // Clothing-category slider — re-buildable so the audience banner can swap
        // its category list. The leftmost (lead) card is the selected category.
        const cloNav = { prev(){}, next(){} };
        function buildCloSlider(cats) {
            const track = document.getElementById('cloTrack');
            track.innerHTML = cats.map((c, i) => `
                <button class="clo-card" data-v="${c}">
                    <div class="clo-thumb" style="background-image:url('${STORE.catImages[c]||STORE.hero}')"></div>
                    <div class="clo-cap"><span class="clo-num">${String(i+1).padStart(2,'0')}</span><span class="clo-name">${c}</span></div>
                </button>`).join('');

            const cards = track.querySelectorAll('.clo-card');
            const titleEl = document.getElementById('cloTitle');
            const descEl  = document.getElementById('cloDesc');
            let lead = 0;

            function update() {
                cards.forEach((c, n) => c.classList.toggle('is-lead', n === lead));
                track.style.transform = `translateX(${-cards[lead].offsetLeft}px)`;
                const c = cards[lead].dataset.v;
                titleEl.textContent = c;
                descEl.textContent = (STORE.catDesc && STORE.catDesc[c]) || '';
                activeCat = c; renderFeed();
            }
            function go(i) { lead = (i + cards.length) % cards.length; update(); }

            cards.forEach((c, n) => c.addEventListener('click', () => go(n)));
            cloNav.prev = () => go(lead - 1);
            cloNav.next = () => go(lead + 1);
            update();
        }
        // The category arrows are wired once; they call whichever slider is current.
        document.getElementById('cloPrev').addEventListener('click', () => cloNav.prev());
        document.getElementById('cloNext').addEventListener('click', () => cloNav.next());
        buildCloSlider(STORE.categories);

        // Socials — render only the links the seller filled in (My Shop). Icons are
        // inline SVG so nothing loads from outside.
        (function buildSocials(){
            const ICON = {

                website:   '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.93 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8ZM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96ZM4.26 14a7.99 7.99 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4H4.26Zm.81 2h2.95c.34 1.27.8 2.47 1.38 3.56A8.03 8.03 0 0 1 5.07 16Zm2.95-8H5.07a8.03 8.03 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.02 8ZM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96ZM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4Zm.28 5.56c.58-1.09 1.04-2.29 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56ZM16.36 14a16.5 16.5 0 0 0 0-4h3.38a7.99 7.99 0 0 1 0 4h-3.38Z"/></svg>',
                twitter:   '<svg viewBox="0 0 24 24"><path d="M17.5 3h3l-6.6 7.6L21.8 21h-6l-4.3-5.6L6.5 21h-3l7.1-8.1L2.4 3h6.1l3.9 5.2L17.5 3zm-1.1 16.1h1.7L8 4.8H6.2l10.2 14.3z"/></svg>',
                facebook:  '<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.75-1.6 1.5V12h2.7l-.43 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>',
            };
            const LABEL = { instagram:'Instagram', tiktok:'TikTok', website:'Website', twitter:'Twitter / X', facebook:'Facebook' };
            const s = STORE.socials || {};
            const links = Object.keys(s).filter(k => s[k]);
            document.getElementById('socLinks').innerHTML = links
                .map(k => `<a href="${s[k]}" target="_blank" rel="noopener noreferrer">${ICON[k]||''}<span>${LABEL[k]||k}</span></a>`)
                .join('');

            // The "Our Socials" button opens the popup; the button hides itself if
            // the seller filled in no links at all.
            const btn = document.getElementById('socialsBtn');
            const overlay = document.getElementById('socOverlay');
            if (!links.length) { btn.style.display = 'none'; return; }
            const openPop  = () => overlay.classList.add('open');
            const closePop = () => overlay.classList.remove('open');
            btn.addEventListener('click', openPop);
            document.getElementById('socClose').addEventListener('click', closePop);
            overlay.addEventListener('click', e => { if (e.target === overlay) closePop(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
        })();

        // Selecting an audience filters the feed AND rebuilds the categories from
        // that audience's list.
        function applyAudience(a) {
            activeAud = a;
            buildCloSlider((STORE.audCategories && STORE.audCategories[a]) || STORE.categories);
        }

        // Audience banner — full-bleed image slider cycling Women / Men / Kids.
        // Auto-rotates every 6s; a click, dot, arrow OR swipe selects that audience.
        (function buildAudBanner() {
            const el = document.getElementById('audBanner');
            const AUD_IMG = { women:'women-hero.jpg', men:'men-hero.jpg', kids:'clothing-hero.png' };
            const auds = STORE.audiences;   // ['women','men','kids']
            el.innerHTML = auds.map((a, i) => `
                <div class="aud-slide ${i===0?'is-active':''}" data-v="${a}"
                     style="background-image:url('${AUD_IMG[a]||STORE.hero}')">
                    <span class="aud-label">${AUD_LABEL[a]||a}</span>
                </div>`).join('') +
                `<button class="aud-arrow prev" aria-label="Previous">&#8249;</button>` +
                `<button class="aud-arrow next" aria-label="Next">&#8250;</button>` +
                `<div class="aud-dots">${auds.map((a,i)=>
                    `<button class="aud-dot ${i===0?'is-active':''}" data-i="${i}" aria-label="${AUD_LABEL[a]||a}"></button>`).join('')}</div>`;

            const slides = el.querySelectorAll('.aud-slide');
            const dots   = el.querySelectorAll('.aud-dot');
            let idx = 0, timer;

            // select=true also applies the audience (feed + categories follow).
            function show(i, select) {
                idx = (i + slides.length) % slides.length;
                slides.forEach((s, n) => s.classList.toggle('is-active', n === idx));
                dots.forEach((d, n)   => d.classList.toggle('is-active', n === idx));
                if (select) applyAudience(slides[idx].dataset.v);
            }
            function start() { timer = setInterval(() => show(idx + 1, false), 6000); }
            function reset() { clearInterval(timer); start(); }

            slides.forEach((s, n) => s.addEventListener('click', () => { show(n, true); reset(); }));
            dots.forEach(d => d.addEventListener('click', () => { show(+d.dataset.i, true); reset(); }));
            el.querySelector('.aud-arrow.prev').addEventListener('click', () => { show(idx - 1, true); reset(); });
            el.querySelector('.aud-arrow.next').addEventListener('click', () => { show(idx + 1, true); reset(); });

            // Swipe / drag — pointer events cover both touch and mouse.
            let startX = null;
            el.addEventListener('pointerdown', e => { startX = e.clientX; });
            el.addEventListener('pointerup', e => {
                if (startX === null) return;
                const dx = e.clientX - startX; startX = null;
                if (Math.abs(dx) < 40) return;               // ignore taps / tiny drags
                show(idx + (dx < 0 ? 1 : -1), true); reset();
            });
            el.addEventListener('pointercancel', () => { startX = null; });

            start();
        })();

        // Sticky search popup — opens the search pill, filters the feed live.
        (function(){
            const fab = document.getElementById('searchFab');
            const pop = document.getElementById('searchPop');
            const inp = document.getElementById('storeSearch');
            const open  = () => { pop.classList.add('open'); fab.classList.add('hidden'); inp.focus(); };
            const close = () => {
                pop.classList.remove('open'); fab.classList.remove('hidden');
                inp.value = ''; searchTerm = ''; renderFeed();
            };
            fab.addEventListener('click', open);
            document.getElementById('searchClose').addEventListener('click', close);
            inp.addEventListener('input', function(){
                searchTerm = this.value.trim().toLowerCase(); renderFeed();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && pop.classList.contains('open')) close();
            });
        })();

        // Follow toggle (demo only).
        document.getElementById('followBtn').addEventListener('click', function(){
            const on = this.classList.toggle('following');
            this.textContent = on ? 'Following' : 'Follow';
            const f = document.getElementById('followers');
            f.textContent = (STORE.followers + (on?1:0)).toLocaleString('en-US');
        });

        // Hero stats slider — rotate the visible stat every 8 seconds.
        (function(){
            const slides = document.querySelectorAll('#heroStats .hero-stat');
            if (slides.length < 2) return;
            let i = 0;
            setInterval(function(){
                slides[i].classList.remove('is-active');
                i = (i + 1) % slides.length;
                slides[i].classList.add('is-active');
            }, 4000);
        })();

        // Exit like the other pages.
        document.querySelector('.back').addEventListener('click', e => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.transition = 'opacity 0.5s ease, transform 0.55s cubic-bezier(0.22,1,0.36,1)';
            wrap.style.opacity = '0'; wrap.style.transform = 'translateX(-6vw)';
            setTimeout(() => location.href = e.currentTarget.getAttribute('href'), 520);
        });
    </script>

    <!-- Per-product edit dialog — set the product's category and collection. Saves
         to vero_store_config (the same store the seller edits in My Shop). -->
    <div class="pe-overlay" id="peOverlay">
        <div class="pe-modal" role="dialog" aria-modal="true" aria-label="Edit product">
            <div class="pe-title" id="peTitle">Edit product</div>
            <label class="pe-field">
                <span>Category</span>
                <select id="peCat"></select>
            </label>
            <label class="pe-field">
                <span>Collection (audience)</span>
                <select id="peAud">
                    <option value="women">Women</option>
                    <option value="men">Men</option>
                    <option value="kids">Kids</option>
                </select>
            </label>
            <div class="pe-actions">
                <button class="pe-btn ghost" id="peCancel">Cancel</button>
                <button class="pe-btn solid" id="peSave">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Per-product edit — opens a dialog to place a product in a category and a
        // collection, then persists to vero_store_config and re-renders.
        (function productEdit(){
            const overlay = document.getElementById('peOverlay');
            const catSel = document.getElementById('peCat');
            const audSel = document.getElementById('peAud');
            const titleEl = document.getElementById('peTitle');
            let editing = null;   // product id being edited

            const close = () => { overlay.classList.remove('open'); editing = null; };

            function open(id) {
                const p = PRODUCTS.find(x => String(x.id) === String(id));
                if (!p) return;
                editing = p.id;
                titleEl.textContent = 'Edit — ' + p.name;
                catSel.innerHTML = STORE.categories
                    .map(c => `<option ${c === p.cat ? 'selected' : ''}>${c}</option>`).join('');
                audSel.value = p.aud;
                overlay.classList.add('open');
            }

            // Persist the change to vero_store_config.products (matched by name).
            function persist(p) {
                let cfg; try { cfg = JSON.parse(localStorage.getItem('vero_store_config')) || {}; } catch(e){ cfg = {}; }
                if (!Array.isArray(cfg.products)) {
                    cfg.products = PRODUCTS.map(x => ({ id:x.id, name:x.name, cat:x.cat, aud:x.aud, price:x.price, rating:x.rating }));
                }
                const rec = cfg.products.find(x => x.name === p.name);
                if (rec) { rec.cat = p.cat; rec.aud = p.aud; }
                else cfg.products.push({ id:p.id, name:p.name, cat:p.cat, aud:p.aud, price:p.price, rating:p.rating });
                localStorage.setItem('vero_store_config', JSON.stringify(cfg));
            }

            document.getElementById('peSave').addEventListener('click', () => {
                const p = PRODUCTS.find(x => String(x.id) === String(editing));
                if (p) {
                    p.cat = catSel.value; p.aud = audSel.value;
                    p.icon = { Dresses:'👗', Outerwear:'🧥', Knitwear:'🧶', Denim:'👖', Shoes:'👟', Bags:'👜' }[p.cat] || p.icon;
                    persist(p);
                    renderFeed();
                    document.getElementById('featSlider').innerHTML = PRODUCTS.slice(0,5).map(card).join('');
                }
                close();
            });
            document.getElementById('peCancel').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) close(); });

            // Delegate clicks from any edit button on a product card.
            document.addEventListener('click', e => {
                const btn = e.target.closest('.sp-edit');
                if (!btn) return;
                e.preventDefault(); e.stopPropagation();
                open(btn.dataset.edit);
            });
        })();
    </script>

    <!-- One-time cleanup: the previous auto-generated manual placements pushed the
         store name / stats down in the header and scaled the category info panel +
         title into the cards. They live in localStorage and are re-applied on every
         load by the editor, so clearing the stale map is what actually fixes it.
         Guarded by a version flag so any NEW placements the seller makes still stick. -->
    <script>
        (function () {
            try {
                var FLAG = 'veroEditorReset::store-profile.html::v1';
                if (!localStorage.getItem(FLAG)) {
                    localStorage.removeItem('veroEditor::' + location.pathname.split('/').pop());
                    localStorage.setItem(FLAG, '1');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Manual edit mode (✎ button bottom-left, or Ctrl+Shift+E) with Copy CSS — same editor as the rest of the site. -->
    <script src="vero-editor.js"></script>
