<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow-x: hidden;
        }

        /* Back button — same pill language as the rest of the site. */
        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(6px);
            transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        /* The whole page slides in from the left, like every other area. */
        .wrap { animation: slideInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-6vw); }
            to   { opacity: 1; transform: none; }
        }

        /* ===================== HERO =====================
           The store's background image (set in settings), full-bleed, with the
           store name and tagline laid over a bottom scrim. No profile picture. */
        .hero {
            position: relative; width: 100%; height: 64vh; min-height: 440px;
            background: #23231f center / cover no-repeat;
            border-bottom: 1px solid #000;
            display: flex; align-items: flex-end;
        }
        .hero::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0.55) 100%);
        }
        .hero-inner { position: relative; z-index: 2; padding: 0 40px 34px; color: #fff; width: 100%; }
        .hero-name { font-size: clamp(38px, 6vw, 78px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .hero-tag  { margin-top: 14px; font-size: 15px; font-weight: 300; letter-spacing: 0.5px; max-width: 620px; opacity: 0.92; }
        .hero-badges { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .verified {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.7); border-radius: 999px;
            font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
        }

        /* ===================== STATS =====================
           Followers + item count, bottom-left of the hero, on a slider that
           auto-rotates every 8 seconds. Only one stat shows at a time. */
        .hero-tag-row {
            display: flex; align-items: flex-end; justify-content: space-between;
            gap: 24px; margin-top: 14px;
        }
        .hero-tag-row .hero-tag { margin-top: 0; }
        .hero-stats {
            position: relative; height: 74px; width: 240px; flex: none; overflow: hidden;
        }
        .hero-stat {
            position: absolute; right: 0; bottom: 0; text-align: right;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; transform: translateY(14px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        .hero-stat.is-active { opacity: 1; transform: translateY(0); }
        .hs-num { font-size: 58px; font-weight: 200; line-height: 1; }
        .hs-lbl { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        .follow-btn {
            padding: 6px 20px;
            border: 1px solid rgba(255,255,255,0.7); border-radius: 999px; background: #fff; color: #000;
            font-family: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .follow-btn:hover { background: transparent; color: #fff; }
        .follow-btn.following { background: transparent; color: #fff; }

        /* ===================== SLIDERS =====================
           A horizontally-scrolling row of outline chips. Two of them: the
           store's categories and the audiences it serves. Only what the seller
           offers is rendered. */
        .slider-block { padding: 26px 40px 0; }
        .slider-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; margin-bottom: 12px; }
        .slider {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .slider::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 10px 22px; border: 1.4px solid #000; border-radius: 999px;
            background: #fff; color: #1c1c1c; cursor: pointer; white-space: nowrap;
            font-family: inherit; font-size: 12px; letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }
        .chip:hover { background: #efefec; }
        .chip.active { background: #000; color: #fff; }

        /* Featured slider — five product cards in a horizontal row. Same card
           and product-card.css as the feed; only the rail (flex + widths) lives
           here. */
        .feat-slider {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .feat-slider::-webkit-scrollbar { display: none; }
        .feat-slider .product-card {
            /* Five across, matching the feed's column width. */
            flex: none; width: calc((100% - 64px) / 5);
        }
        @media (max-width: 700px) {
            .feat-slider .product-card { width: calc((100% - 14px) / 2); }
        }

        /* Audience banner — a full-bleed image slider, edge to edge of the page,
           cycling Women / Men / Kids. Same treatment as the hero. */
        .aud-banner {
            position: relative; width: 100%; height: 58vh; min-height: 420px;
            overflow: hidden; border-top: 1px solid #000; border-bottom: 1px solid #000;
        }
        .aud-slide {
            position: absolute; inset: 0; cursor: pointer;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            opacity: 0; transition: opacity 1s ease; z-index: 1;
        }
        .aud-slide.is-active { opacity: 1; z-index: 2; }
        .aud-slide::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
        }
        .aud-label {
            position: absolute; left: 40px; bottom: 34px; z-index: 3; color: #fff;
            font-size: clamp(34px, 5vw, 62px); font-weight: 200; letter-spacing: 1px;
            line-height: 1; pointer-events: none;
        }
        .aud-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
            width: 46px; height: 46px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid rgba(255,255,255,0.7); background: rgba(0,0,0,0.25);
            color: #fff; font-size: 20px; line-height: 1;
            transition: background 0.2s, border-color 0.2s;
        }
        .aud-arrow:hover { background: rgba(0,0,0,0.55); border-color: #fff; }
        .aud-arrow.prev { left: 24px; }
        .aud-arrow.next { right: 24px; }
        .aud-dots {
            position: absolute; right: 40px; bottom: 40px; z-index: 4;
            display: flex; gap: 10px;
        }
        .aud-dot {
            width: 9px; height: 9px; border-radius: 999px; padding: 0; cursor: pointer;
            border: 1px solid #fff; background: transparent; transition: background 0.3s;
        }
        .aud-dot.is-active { background: #fff; }
        @media (max-width: 700px) {
            .aud-label { left: 20px; bottom: 24px; }
            .aud-dots  { right: 20px; bottom: 28px; }
            .aud-arrow { width: 38px; height: 38px; }
            .aud-arrow.prev { left: 14px; }
            .aud-arrow.next { right: 14px; }
        }

        /* Clothing-category slider — a quarter-width info panel on the left and a
           three-quarter viewport on the right showing three cards. The leftmost
           (lead) card scales up and is the selected category. */
        .clo-block { display: flex; gap: 28px; align-items: stretch; }
        .clo-info {
            flex: 0 0 25%; max-width: 25%;
            display: flex; flex-direction: column; justify-content: center;
            padding-right: 8px;
        }
        .clo-kicker {
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            color: #9a9a95; margin-bottom: 14px;
        }
        .clo-info-title { font-size: 34px; font-weight: 300; line-height: 1.05; color: #1c1c1c; }
        .clo-info-desc {
            margin-top: 14px; font-size: 14px; font-weight: 300; line-height: 1.6;
            color: #55554f; max-width: 320px;
        }
        .clo-nav { display: flex; gap: 10px; margin-top: 26px; }
        .clo-arrow {
            width: 42px; height: 42px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid #000; background: transparent;
            color: #111; font-size: 20px; line-height: 1;
            transition: background 0.2s, color 0.2s;
        }
        .clo-arrow:hover { background: #000; color: #fff; }

        /* The viewport takes the remaining three quarters; three cards fill it. */
        .clo-slider { flex: 1 1 75%; position: relative; overflow: hidden; padding: 18px 0; }
        .clo-track {
            display: flex; gap: 14px;
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .clo-card {
            /* Smaller equal cards, no enlargement, tight gaps.
               Four across the viewport:  w = (100% - 42px) / 4 (three 14px gaps) */
            --clo-w: calc((100% - 42px) / 4);
            flex: none; width: var(--clo-w); cursor: pointer;
            background: none; border: none; padding: 0; font-family: inherit; text-align: left;
        }
        .clo-thumb {
            width: 100%; aspect-ratio: 3 / 4; border: 1px solid #000;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            transition: filter 0.4s;
        }
        .clo-card.is-lead .clo-thumb { filter: grayscale(0); }
        .clo-cap {
            display: flex; align-items: baseline; gap: 8px; margin-top: 12px;
            font-size: 15px; letter-spacing: 0.5px; color: #1c1c1c;
        }
        .clo-num { font-size: 12px; color: #9a9a95; letter-spacing: 1px; }
        .clo-card.is-lead .clo-cap { font-weight: 600; }

        @media (max-width: 700px) {
            .clo-block { flex-direction: column; gap: 18px; }
            .clo-info, .clo-slider { flex-basis: auto; max-width: none; }
            .clo-card { --clo-w: calc((100% - 16px) / 2); }
        }

        /* ===================== AD BANNER =====================
           The seller's own promo, but a FIXED size on every store profile. */
        .ad-band {
            margin: 30px 40px 0; height: 150px; border: 1px solid #000;
            background: #23231f center / cover no-repeat; position: relative;
            display: flex; align-items: center; overflow: hidden;
        }
        .ad-band::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.05) 70%);
        }
        .ad-copy { position: relative; z-index: 2; padding: 0 40px; color: #fff; }
        .ad-kicker { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; }
        .ad-title { font-size: clamp(22px, 3vw, 34px); font-weight: 300; margin-top: 6px; line-height: 1.1; }

        /* ===================== FEED =====================
           Five across, two rows. Filters live off the category + audience chips,
           exactly like the main feed. */
        .feed-head {
            display: flex; align-items: baseline; justify-content: space-between;
            margin: 44px 40px 0; padding-bottom: 14px; border-bottom: 1px solid #000;
        }
        .feed-title { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .feed-note  { font-size: 12px; letter-spacing: 0.5px; color: #9a9a95; }
        .feed {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
            padding: 26px 40px 70px;
        }
        .feed-empty {
            margin: 26px 40px 70px; padding: 44px; border: 1px dashed #cfcfca;
            text-align: center; color: #9a9a95; font-size: 14px;
        }

        @media (max-width: 1100px) { .feed { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 700px)  {
            .feed { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 14px; }
            .hero-inner, .slider-block, .feed-head { padding-left: 20px; padding-right: 20px; }
            .ad-band, .feed-head { margin-left: 20px; margin-right: 20px; }
            .hs-num { font-size: 32px; }
        }
    </style>
    <link rel="stylesheet" href="product-card.css">
</head>
<body>
    <a class="back" href="index.html">&#8592; חזרה</a>

    <div class="wrap">
        <!-- HERO -->
        <div class="hero" id="hero">
            <div class="hero-inner">
                <h1 class="hero-name" id="storeName">Studio Noir</h1>
                <div class="hero-tag-row">
                    <p class="hero-tag" id="storeTag">Curated wardrobe & one-off pieces. Tel Aviv.</p>
                    <div class="hero-stats" id="heroStats">
                        <div class="hero-stat is-active">
                            <span class="hs-num" id="followers">1,284</span>
                            <span class="hs-lbl">Followers</span>
                        </div>
                        <div class="hero-stat">
                            <span class="hs-num" id="itemCount">0</span>
                            <span class="hs-lbl">Items in store</span>
                        </div>
                    </div>
                </div>
                <div class="hero-badges">
                    <span class="verified">✓ VERO Verified Store</span>
                    <button class="follow-btn" id="followBtn">Follow</button>
                </div>
            </div>
        </div>

        <!-- FEATURED PRODUCTS — five pieces the seller chose to highlight at the
             top of the profile. Built from the same product card + product-card.css
             as the feed. -->
        <div class="slider-block">
            <div class="slider-label">Featured</div>
            <div class="feat-slider" id="featSlider"></div>
        </div>

        <!-- AUDIENCE BANNER — a full-bleed image slider that reaches both edges of
             the page, cycling Women / Men / Kids. Clicking a slide filters the
             feed by that audience. -->
        <div class="aud-banner" id="audBanner"></div>

        <!-- MORE PRODUCTS — another five pieces, same product card + rail as the
             featured slider above. -->
        <div class="slider-block">
            <div class="slider-label">More from the store</div>
            <div class="feat-slider" id="featSlider2"></div>
        </div>

        <!-- CLOTHING CATEGORIES — three cards per view across three quarters of the
             row; the remaining quarter (left) carries the section title and the
             lead category's name + description. The leftmost card is scaled up and
             is the selected category; each page shifts the lead. -->
        <div class="slider-block">
            <div class="clo-block">
                <div class="clo-info">
                    <div class="clo-kicker">Shop by category</div>
                    <div class="clo-info-title" id="cloTitle">—</div>
                    <div class="clo-info-desc" id="cloDesc">—</div>
                    <div class="clo-nav">
                        <button class="clo-arrow prev" id="cloPrev" aria-label="Previous">&#8249;</button>
                        <button class="clo-arrow next" id="cloNext" aria-label="Next">&#8250;</button>
                    </div>
                </div>
                <div class="clo-slider">
                    <div class="clo-track" id="cloTrack"></div>
                </div>
            </div>
        </div>

        <!-- AD BANNER (fixed size across all stores) -->
        <div class="ad-band" id="adBand">
            <div class="ad-copy">
                <div class="ad-kicker" id="adKicker">End of season</div>
                <div class="ad-title" id="adTitle">Up to 40% off selected pieces</div>
            </div>
        </div>

        <!-- FEED -->
        <div class="feed-head">
            <div class="feed-title">The collection</div>
            <div class="feed-note" id="feedNote">—</div>
        </div>
        <div class="feed" id="feed"></div>
        <div class="feed-empty" id="feedEmpty" style="display:none;">
            Nothing here in this filter yet.
        </div>
    </div>

    <script>
        // ===================== DEMO DATA =====================
        // In the real build this comes from the store's own record + vero_listings.
        const STORE = {
            name: 'Studio Noir',
            tag: 'Curated wardrobe & one-off pieces. Tel Aviv.',
            followers: 1284,
            hero: 'women-hero.jpg',        // background set in settings
            ad:   { image: 'men-hero.jpg', kicker: 'End of season', title: 'Up to 40% off selected pieces' },
            // Only the categories / audiences the seller actually offers get chips.
            categories: ['Dresses', 'Outerwear', 'Knitwear', 'Denim', 'Shoes', 'Bags'],
            audiences:  ['women', 'men', 'kids'],
            // Cover image per category (set by the seller; falls back to a neutral tile).
            catImages: {
                Dresses:   'women-hero.jpg',
                Outerwear: 'men-hero.jpg',
                Knitwear:  'clothing-hero.png',
                Denim:     'hero-beach.jpg',
                Shoes:     'gallery-hero.jpg',
                Bags:      'magazine-hero.jpg',
            },
            // A short line the seller writes for each category, shown in the
            // clothing slider's info panel.
            catDesc: {
                Dresses:   'From slip to structured — one-off dresses for day and night.',
                Outerwear: 'Coats and jackets built to layer through the season.',
                Knitwear:  'Hand-finished knits in wool, cotton and cashmere blends.',
                Denim:     'Raw and washed denim, cut clean and made to last.',
                Shoes:     'Everyday runners to evening leather, chosen with care.',
                Bags:      'Totes and crossbodies — quiet shapes, honest materials.',
            },
        };

        // A pool of demo products, each tagged with a category + audience so the
        // sliders can filter the feed like the main feed does.
        const CATS = STORE.categories;
        const AUDS = STORE.audiences;
        const ICONS = { Dresses:'👗', Outerwear:'🧥', Knitwear:'🧶', Denim:'👖', Shoes:'👟', Bags:'👜' };
        const NAMES = ['Wrap dress','Wool coat','Ribbed sweater','Raw denim','Runner','Tote','Silk shirt','Blazer','Cardigan','Slim jean','Loafer','Crossbody'];
        function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
        const PRODUCTS = Array.from({length: 40}, (_, i) => {
            const cat = rnd(CATS);
            return {
                id: i,
                name: NAMES[i % NAMES.length],
                cat,
                aud: rnd(AUDS),
                icon: ICONS[cat] || '🛍️',
                price: 79 + Math.floor(Math.random()*22)*10,
                rating: (4 + Math.random()).toFixed(1),
            };
        });

        // ===================== RENDER =====================
        const nis = n => '₪' + (Number(n)||0).toLocaleString('en-US');
        let activeCat = 'all';
        let activeAud = 'all';

        // Hero + ad + header text.
        document.getElementById('storeName').textContent = STORE.name;
        document.getElementById('storeTag').textContent = STORE.tag;
        document.getElementById('followers').textContent = STORE.followers.toLocaleString('en-US');
        document.getElementById('hero').style.backgroundImage = `url('${STORE.hero}')`;
        document.getElementById('adBand').style.backgroundImage = `url('${STORE.ad.image}')`;
        document.getElementById('adKicker').textContent = STORE.ad.kicker;
        document.getElementById('adTitle').textContent = STORE.ad.title;
        document.getElementById('itemCount').textContent = PRODUCTS.length;

        // Build the two sliders. "All" first, then only what the seller offers.
        const AUD_LABEL = { women:'Women', men:'Men', kids:'Kids' };
        function buildSlider(el, values, labelFn, onPick, key) {
            const chips = [['all','All'], ...values.map(v => [v, labelFn(v)])];
            el.innerHTML = chips.map(([v,l]) =>
                `<button class="chip ${v==='all'?'active':''}" data-v="${v}">${l}</button>`).join('');
            el.addEventListener('click', e => {
                const b = e.target.closest('.chip'); if (!b) return;
                el.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                b.classList.add('active');
                onPick(b.dataset.v);
            });
        }

        // The card — same markup + shared product-card.css as the rest of the site.
        function card(p) {
            return `
                <a class="product-card" href="#" title="${p.name}">
                    <div class="product-image">${p.icon}</div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price"><span class="vprice">${nis(p.price)}</span></div>
                        </div>
                        <div class="pc-right">
                            <div class="product-seller">${STORE.name}</div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-rating">★ ${p.rating}</div>
                        </div>
                    </div>
                </a>`;
        }

        // Feed = 5 across × 2 rows = 10, filtered by the two chips.
        function renderFeed() {
            const filtered = PRODUCTS.filter(p =>
                (activeCat === 'all' || p.cat === activeCat) &&
                (activeAud === 'all' || p.aud === activeAud));
            const shown = filtered.slice(0, 10);   // two rows of five
            const feed = document.getElementById('feed');
            const empty = document.getElementById('feedEmpty');
            feed.innerHTML = shown.map(card).join('');
            feed.style.display = shown.length ? 'grid' : 'none';
            empty.style.display = shown.length ? 'none' : 'block';
            document.getElementById('feedNote').textContent =
                `${filtered.length} item${filtered.length===1?'':'s'}` +
                (filtered.length > 10 ? ` · showing 10` : '');
        }
        renderFeed();

        // Featured — the five pieces the seller highlighted, rendered with the
        // same card() as the feed so they stay identical to it.
        const FEATURED = PRODUCTS.slice(0, 5);
        document.getElementById('featSlider').innerHTML = FEATURED.map(card).join('');

        // Another five pieces, in the second rail.
        const MORE = PRODUCTS.slice(5, 10);
        document.getElementById('featSlider2').innerHTML = MORE.map(card).join('');

        // Audience banner — full-bleed image slider cycling Women / Men / Kids.
        // Auto-rotates every 6s; a slide, dot or arrow selects it and filters the feed.
        (function buildAudBanner() {
            const el = document.getElementById('audBanner');
            const AUD_IMG = { women:'women-hero.jpg', men:'men-hero.jpg', kids:'clothing-hero.png' };
            const auds = STORE.audiences;   // ['women','men','kids']
            el.innerHTML = auds.map((a, i) => `
                <div class="aud-slide ${i===0?'is-active':''}" data-v="${a}"
                     style="background-image:url('${AUD_IMG[a]||STORE.hero}')">
                    <span class="aud-label">${AUD_LABEL[a]||a}</span>
                </div>`).join('') +
                `<button class="aud-arrow prev" aria-label="Previous">&#8249;</button>` +
                `<button class="aud-arrow next" aria-label="Next">&#8250;</button>` +
                `<div class="aud-dots">${auds.map((a,i)=>
                    `<button class="aud-dot ${i===0?'is-active':''}" data-i="${i}" aria-label="${AUD_LABEL[a]||a}"></button>`).join('')}</div>`;

            const slides = el.querySelectorAll('.aud-slide');
            const dots   = el.querySelectorAll('.aud-dot');
            let idx = 0, timer;

            function show(i) {
                idx = (i + slides.length) % slides.length;
                slides.forEach((s, n) => s.classList.toggle('is-active', n === idx));
                dots.forEach((d, n)   => d.classList.toggle('is-active', n === idx));
            }
            function start() { timer = setInterval(() => show(idx + 1), 6000); }
            function reset() { clearInterval(timer); start(); }

            slides.forEach(s => s.addEventListener('click', () => { activeAud = s.dataset.v; renderFeed(); }));
            dots.forEach(d => d.addEventListener('click', () => { show(+d.dataset.i); reset(); }));
            el.querySelector('.aud-arrow.prev').addEventListener('click', () => { show(idx - 1); reset(); });
            el.querySelector('.aud-arrow.next').addEventListener('click', () => { show(idx + 1); reset(); });
            start();
        })();

        // Clothing-category slider — a paged rail of clothing types. The leftmost
        // (lead) card scales up and is the selected category; each page shifts the
        // lead and filters the feed by it.
        (function buildCloSlider() {
            const track = document.getElementById('cloTrack');
            const cats = STORE.categories;   // clothing types
            track.innerHTML = cats.map((c, i) => `
                <button class="clo-card" data-v="${c}">
                    <div class="clo-thumb" style="background-image:url('${STORE.catImages[c]||STORE.hero}')"></div>
                    <div class="clo-cap"><span class="clo-num">${String(i+1).padStart(2,'0')}</span> ${c}</div>
                </button>`).join('');

            const cards = track.querySelectorAll('.clo-card');
            let lead = 0;

            const titleEl = document.getElementById('cloTitle');
            const descEl  = document.getElementById('cloDesc');

            function update() {
                cards.forEach((c, n) => c.classList.toggle('is-lead', n === lead));
                // Bring the lead card to the left edge (scale doesn't affect offsetLeft).
                track.style.transform = `translateX(${-cards[lead].offsetLeft}px)`;
                // The lead card is the selected category — fill the info panel and feed.
                const c = cards[lead].dataset.v;
                titleEl.textContent = c;
                descEl.textContent = (STORE.catDesc && STORE.catDesc[c]) || '';
                activeCat = c; renderFeed();
            }
            function go(i) { lead = (i + cards.length) % cards.length; update(); }

            cards.forEach((c, n) => c.addEventListener('click', () => go(n)));
            document.getElementById('cloPrev').addEventListener('click', () => go(lead - 1));
            document.getElementById('cloNext').addEventListener('click', () => go(lead + 1));
            update();
        })();

        // Follow toggle (demo only).
        document.getElementById('followBtn').addEventListener('click', function(){
            const on = this.classList.toggle('following');
            this.textContent = on ? 'Following' : 'Follow';
            const f = document.getElementById('followers');
            f.textContent = (STORE.followers + (on?1:0)).toLocaleString('en-US');
        });

        // Hero stats slider — rotate the visible stat every 8 seconds.
        (function(){
            const slides = document.querySelectorAll('#heroStats .hero-stat');
            if (slides.length < 2) return;
            let i = 0;
            setInterval(function(){
                slides[i].classList.remove('is-active');
                i = (i + 1) % slides.length;
                slides[i].classList.add('is-active');
            }, 8000);
        })();

        // Exit like the other pages.
        document.querySelector('.back').addEventListener('click', e => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.transition = 'opacity 0.5s ease, transform 0.55s cubic-bezier(0.22,1,0.36,1)';
            wrap.style.opacity = '0'; wrap.style.transform = 'translateX(-6vw)';
            setTimeout(() => location.href = e.currentTarget.getAttribute('href'), 520);
        });
    </script>
    <!-- Manual edit mode (✎ button bottom-left, or Ctrl+Shift+E) with Copy CSS — same editor as the rest of the site. -->
    <script src="vero-editor.js"></script>
</body>
