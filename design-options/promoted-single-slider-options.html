<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promoted Single-Slide Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; --ink: #111; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 560px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 728px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; font-family: 'Inter', sans-serif; padding-top: 30px; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.15); }
.money { font-variant-numeric: tabular-nums; }
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px; margin: 10px 0 14px; }
.sh b { font-family: 'Aharoni CLM', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.5px; }
.sh .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 3px; }
.sh span.see { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #d6d2cb; } .dots i.on { width: 18px; border-radius: 6px; background: #111; }
.dots.light i { background: rgba(255,255,255,0.45); } .dots.light i.on { background: #fff; }
.arrow { position: absolute; top: 50%; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 10px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 3; color: #111; }
.count { position: absolute; z-index: 3; font-size: 10px; letter-spacing: 1px; }

/* Q1 full-bleed hero */
.q1 .slide { margin: 0 22px; height: 470px; position: relative; border-radius: 6px; overflow: hidden; color: #fff; }
.q1 .th { position: absolute; inset: 0; }
.q1 .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,0.72)); }
.q1 .promo { position: absolute; left: 16px; top: 16px; z-index: 2; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,0.9); color: #111; padding: 5px 9px; border-radius: 3px; }
.q1 .count { right: 16px; top: 18px; color: #fff; background: rgba(0,0,0,0.3); padding: 4px 9px; border-radius: 999px; }
.q1 .in { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; }
.q1 .nm { font-family: 'Bodoni Moda', serif; font-size: 30px; } .q1 .s { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.q1 .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.q1 .pr { font-size: 18px; } .q1 .cta { background: #fff; color: #111; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 11px 18px; }

/* Q2 image top, info card below */
.q2 .slide { margin: 0 22px; }
.q2 .img { height: 340px; position: relative; border-radius: 6px 6px 0 0; overflow: hidden; }
.q2 .img .th { position: absolute; inset: 0; }
.q2 .promo { position: absolute; left: 14px; top: 14px; z-index: 2; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; background: #111; color: #fff; padding: 5px 9px; border-radius: 3px; }
.q2 .info { border: 1px solid var(--line); border-top: none; border-radius: 0 0 8px 8px; padding: 16px; }
.q2 .nm { font-size: 19px; } .q2 .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.q2 .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.q2 .pr { font-size: 20px; } .q2 .cta { background: #111; color: #fff; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 22px; border-radius: 8px; }

/* Q3 side by side editorial */
.q3 .slide { margin: 0 22px; display: flex; gap: 16px; height: 440px; align-items: stretch; }
.q3 .th { width: 210px; flex: none; border-radius: 4px; }
.q3 .bd { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.q3 .promo { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
.q3 .nm { font-family: 'Bodoni Moda', serif; font-size: 30px; line-height: 1.02; margin: 10px 0; }
.q3 .s { font-size: 12px; color: var(--muted); } .q3 .pr { font-size: 20px; margin: 16px 0; }
.q3 .cta { border: 1px solid #111; text-align: center; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 13px; }

/* Q4 centered card with peek */
.q4 { overflow: hidden; }
.q4 .stage { display: flex; gap: 14px; justify-content: center; align-items: center; height: 480px; transform: translateX(10px); }
.q4 .side { width: 40px; flex: none; height: 400px; border-radius: 6px; opacity: 0.5; }
.q4 .main { width: 250px; flex: none; position: relative; height: 480px; border-radius: 8px; overflow: hidden; color: #fff; box-shadow: 0 14px 30px rgba(0,0,0,0.2); }
.q4 .main .th { position: absolute; inset: 0; }
.q4 .main::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.7)); }
.q4 .main .in { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1; }
.q4 .main .nm { font-size: 20px; } .q4 .main .pr { font-size: 14px; opacity: 0.9; }
.q4 .main .promo { position: absolute; left: 14px; top: 14px; z-index: 1; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,0.9); color: #111; padding: 4px 8px; border-radius: 3px; }

/* Q5 floating info card */
.q5 .slide { margin: 0 22px; position: relative; }
.q5 .img { height: 400px; border-radius: 8px; overflow: hidden; } .q5 .img .th { height: 100%; }
.q5 .float { background: #fff; margin: -56px 18px 0; position: relative; z-index: 2; border-radius: 10px; box-shadow: 0 14px 30px rgba(0,0,0,0.14); padding: 16px; }
.q5 .promo { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.q5 .nm { font-size: 18px; margin: 6px 0 2px; } .q5 .s { font-size: 12px; color: var(--muted); }
.q5 .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.q5 .pr { font-size: 19px; } .q5 .cta { background: #111; color: #fff; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 11px 20px; border-radius: 8px; }

/* Q6 minimal centered */
.q6 .slide { text-align: center; padding: 0 40px; }
.q6 .img { height: 400px; border-radius: 4px; overflow: hidden; } .q6 .img .th { height: 100%; }
.q6 .promo { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
.q6 .nm { font-family: 'Bodoni Moda', serif; font-size: 24px; margin: 8px 0 3px; } .q6 .pr { font-size: 14px; color: #333; }

/* Q7 big type over image */
.q7 .slide { margin: 0 22px; height: 470px; position: relative; border-radius: 6px; overflow: hidden; color: #fff; }
.q7 .th { position: absolute; inset: 0; }
.q7 .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.25), transparent 40%, rgba(0,0,0,0.55)); }
.q7 .big { position: absolute; left: 14px; right: 14px; top: 30px; z-index: 2; font-family: 'Bodoni Moda', serif; font-size: 52px; line-height: 0.92; }
.q7 .tag { position: absolute; left: 16px; bottom: 16px; z-index: 2; background: #fff; color: #111; font-size: 16px; font-weight: 600; padding: 8px 14px; }
.q7 .promo { position: absolute; right: 16px; bottom: 20px; z-index: 2; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }

/* Q8 deal spotlight */
.q8 .slide { margin: 0 22px; position: relative; }
.q8 .img { height: 330px; border-radius: 8px; overflow: hidden; position: relative; } .q8 .img .th { height: 100%; }
.q8 .off { position: absolute; left: 0; top: 16px; background: #d33; color: #fff; font-size: 14px; font-weight: 700; padding: 6px 12px; z-index: 2; }
.q8 .cd { position: absolute; right: 12px; top: 12px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 6px 10px; border-radius: 6px; z-index: 2; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.q8 .info { padding: 14px 4px 0; }
.q8 .nm { font-size: 18px; } .q8 .s { font-size: 12px; color: var(--muted); }
.q8 .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.q8 .now { font-size: 22px; font-weight: 700; color: #d33; } .q8 .was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.q8 .cta { margin-left: auto; background: #111; color: #fff; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 20px; border-radius: 8px; }
</style>
</head>
<body>
<h1>Promoted — מוצר אחד בכל סלייד</h1>
<p class="sub">8 עיצובים לסליידר שמראה מוצר מקודם אחד בכל פעם · מחליקים לבא</p>

<div class="grid" id="opts"></div>

<script>
var HERO = { img: '../women-hero.jpg', pos: '30% 32%' };
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var alt = { img: '../men-hero.jpg', pos: '50% 30%' };
var head = (k, t) => '<div class="sh"><b>' + (k ? '<span class="k">' + k + '</span>' : '') + t + '</b><span class="see">See all</span></div>';
var DOTS = '<div class="dots"><i class="on"></i><i></i><i></i><i></i></div>';

var OPTS = [
  ['Q1 · הירו מלא', 'התמונה ממלאת את הסלייד, שם בסריף, מוכר, מחיר וכפתור על גבי התמונה. חיצים, מונה (1/5) ונקודות.',
   '<div class="screen q1">' + head('', 'Promoted') + '<div class="slide"><span class="th" ' + bg(HERO) + '></span><span class="promo">Promoted</span><span class="count">1 / 5</span>' +
   '<span class="arrow" style="left:30px">‹</span><span class="arrow" style="right:30px">›</span>' +
   '<div class="in"><div class="nm">Wool Overcoat</div><div class="s">Atelier Nord</div><div class="row"><span class="pr money">₪380</span><span class="cta">Shop now</span></div></div></div>' + DOTS + '</div>'],

  ['Q2 · תמונה + כרטיס מידע', 'תמונה גדולה למעלה וכרטיס לבן נקי מתחת עם שם, מוכר, מחיר וכפתור. ברור וקליל.',
   '<div class="screen q2">' + head('', 'Promoted') + '<div class="slide"><div class="img"><span class="th" ' + bg(HERO) + '></span><span class="promo">Promoted</span></div>' +
   '<div class="info"><div class="nm">Wool Overcoat</div><div class="s">Atelier Nord · Size M</div><div class="row"><span class="pr money">₪380</span><span class="cta">Shop</span></div></div></div>' + DOTS + '</div>'],

  ['Q3 · זה לצד זה', 'חצי תמונה, חצי מידע בסריף גדול. עריכתי ונקי, מרגיש כמו קמפיין.',
   '<div class="screen q3">' + head('', 'Promoted') + '<div class="slide"><span class="th" ' + bg(HERO) + '></span>' +
   '<div class="bd"><span class="promo">Promoted</span><div class="nm">Wool Overcoat</div><div class="s">Atelier Nord</div><div class="pr money">₪380</div><div class="cta">Shop now</div></div></div>' + DOTS + '</div>'],

  ['Q4 · כרטיס ממורכז עם הצצה', 'כרטיס אחד במרכז, עם הצצה לקודם ולבא בקצוות (coverflow). מדגיש שיש עוד להחליק.',
   '<div class="screen q4">' + head('', 'Promoted') + '<div class="stage"><span class="side th" ' + bg(alt) + '></span><div class="main"><span class="th" ' + bg(HERO) + '></span><span class="promo">Promoted</span><div class="in"><div class="nm">Wool Overcoat</div><div class="pr money">₪380 · Atelier Nord</div></div></div><span class="side th" ' + bg(alt) + '></span></div>' + DOTS + '</div>'],

  ['Q5 · כרטיס מידע צף', 'התמונה למעלה וכרטיס מידע "צף" שעולה עליה מלמטה. מודרני ומוקפד.',
   '<div class="screen q5">' + head('', 'Promoted') + '<div class="slide"><div class="img"><span class="th" ' + bg(HERO) + '></span></div>' +
   '<div class="float"><span class="promo">Promoted</span><div class="nm">Wool Overcoat</div><div class="s">Atelier Nord</div><div class="row"><span class="pr money">₪380</span><span class="cta">Shop</span></div></div></div>' + DOTS + '</div>'],

  ['Q6 · מינימלי וממורכז', 'תמונה אחת, ומתחתיה שם ומחיר ממורכזים. שקט, יוקרתי, בלי עומס.',
   '<div class="screen q6">' + head('', 'Promoted') + '<div class="slide"><div class="img"><span class="th" ' + bg(HERO) + '></span></div><div class="promo">Promoted · Atelier Nord</div><div class="nm">Wool Overcoat</div><div class="pr money">₪380</div></div>' + DOTS + '</div>'],

  ['Q7 · טיפוגרפיה גדולה', 'שם המוצר ענק על התמונה, ומחיר כתווית בפינה. נועז וקמפייני.',
   '<div class="screen q7">' + head('', 'Promoted') + '<div class="slide"><span class="th" ' + bg(HERO) + '></span><div class="big">Wool<br>Overcoat</div><span class="tag money">₪380</span><span class="promo">Promoted · Atelier Nord</span></div>' + '<div class="dots light" style="margin-top:-38px;position:relative;z-index:4"><i class="on"></i><i></i><i></i><i></i></div></div>'],

  ['Q8 · מבצע בזרקור', 'אחוז הנחה, ספירה לאחור, מחיר היה/עכשיו וכפתור. מושלם לקדם דיל אחד חזק.',
   '<div class="screen q8">' + head('', 'Deal of the day') + '<div class="slide"><div class="img"><span class="th" ' + bg(HERO) + '></span><span class="off">-40%</span><span class="cd">02:14:36</span></div>' +
   '<div class="info"><div class="nm">Wool Overcoat</div><div class="s">Atelier Nord</div><div class="row"><span class="now money">₪228</span><span class="was money">₪380</span><span class="cta">Grab it</span></div></div></div>' + DOTS + '</div>']
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
