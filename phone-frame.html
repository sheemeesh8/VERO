<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- App-style viewport: fill the notch area, no user pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Keep the phone on the freshest deploy: revalidate the shell every load so a
         new GitHub Pages build shows up without a manual cache clear. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="moravchick">
    <meta name="theme-color" content="#000000">
    <!-- PWA: installable as a standalone app (Add to Home Screen / Install). -->
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
    <script>
      // Keep an installed PWA on the freshest deploy. updateViaCache:'none' stops the
      // browser HTTP-caching sw.js, so a new worker is always detected; we then force
      // it active (skipWaiting) and reload once it takes control.
      if ('serviceWorker' in navigator) {
        var pfReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (pfReloaded) return;
          pfReloaded = true;
          location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
            reg.update();
            // Re-check for a new version whenever the app is brought back to the front.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update();
            });
          }).catch(function () {});
        });
      }
    </script>
    <title>moravchick</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        /* Never show a scrollbar anywhere on the frame chrome. */
        html { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { width: 0; height: 0; display: none; }
        /* Black "no phone" area on the sides. */
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        /* The device body — Samsung Galaxy A56 style: thin uniform bezel, flat
           display, moderately rounded corners, soft shadow + thin rim so it reads
           as a real phone against the black. */
        .phone {
            position: relative;
            width: 412px;
            max-width: 100%;
            height: min(94vh, 900px);
            background: #0b0b0b;
            border-radius: 44px;
            padding: 10px;                 /* thin, even Samsung bezel */
            box-shadow: 0 0 0 2px #2b2b2b, 0 24px 70px rgba(0, 0, 0, 0.6);
        }
        /* The screen: rounded to sit inside the bezel, clips the content. The base
           colour is a soft warm paper (NOT stark white) so any loading gap between
           pages reads as a calm surface instead of a white flash. */
        :root { --pf-paper: #f4f1ec; }
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 36px;
            overflow: hidden;
            background: var(--pf-paper);
            display: flex;
            flex-direction: column;
        }
        /* Centred punch-hole camera (Samsung A56) — a small round dot at top centre
           that floats OVER the content, reserving no space, so the site fills the
           whole screen behind it. pointer-events:none so it never blocks taps. */
        .island {
            position: absolute;
            top: 13px;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 13px;
            background: #000;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.12);
        }
        .screen iframe {
            flex: 1 1 auto;
            width: 100%;
            border: 0;
            display: block;
            position: relative;
            z-index: 2;
            /* Paper (not white) while the inner page's own CSS is still painting. */
            background: var(--pf-paper);
        }
        /* Every in-frame navigation: the new page slides DOWN from the top over the
           paper base (.screen background) — no white, no fade. One animation for all
           navigations (forward and back alike), so transitions feel consistent. */
        @keyframes pfSlideInDown {
            from { transform: translateY(-100%); }
            to   { transform: translateY(0); }
        }
        .screen iframe.pf-enter {
            /* Near-instant page-to-page transition (0.01s) — the new page just
               appears, no drawn-out slide. */
            animation: pfSlideInDown 0.01s linear both;
        }

        /* Instant paper cover (no fade) shown only during the fetch gap, so the
           browser's blank white repaint between documents is never visible. */
        .pf-cover {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: var(--pf-paper);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pf-cover.is-on { opacity: 1; visibility: visible; }
        /* Loading mark: the peacock logo flipping around its vertical axis like a coin. */
        .pf-cover .pf-spin-wrap { perspective: 600px; }
        .pf-spin {
            width: 72px; height: auto; display: block;
            transform-style: preserve-3d;
            backface-visibility: visible;
            animation: pfSpin 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        @keyframes pfSpin {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .pf-spin { animation-duration: 3s; }
        }

        /* ---- Cinematic entrance: a luminous white peacock is revealed by a moving
               light, holds a heraldic pose, then dissolves/morphs into a flat black
               logo on pure white. Pure CSS + inline SVG (no external deps), so it is
               reliable on first paint and fully offline in the installed PWA.
               Timeline (~6s): 0–2.5 reveal + slow tracking pan · 2.5–4 settle ·
               4–5.5 dissolve to white + fill white→black · 5.5+ lock. ---- */
        .pf-intro {
            position: absolute; inset: 0; z-index: 9;
            background: #0A0D0B;                 /* near-black entrance */
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            animation: ciBgToWhite 1.5s cubic-bezier(0.65,0,0.35,1) 4s forwards;
        }
        .pf-intro.done { display: none; }

        /* Deep-forest radial vignette behind the bird; fades away on the dissolve. */
        .ci-vignette {
            position: absolute; inset: -10%;
            background:
                radial-gradient(60% 55% at 50% 42%,
                    rgba(20,96,107,0.55) 0%,
                    rgba(11,31,43,0.45) 40%,
                    rgba(10,13,11,0) 78%);
            animation: ciFadeOut 1.2s ease 4s forwards;
        }

        /* Responsive, centered SVG stage. */
        .ci-svg {
            width: min(74vmin, 300px); height: auto; display: block; overflow: visible;
        }
        /* Slow left→right tracking pan (parallax) that eases to a stop. */
        .ci-parallax {
            transform-box: view-box; transform-origin: 50% 50%;
            animation: ciPan 4s cubic-bezier(0.22,1,0.36,1) 0s both;
        }
        /* Luminous white bird: fades up under the moving light, then dissolves out. */
        .ci-white {
            opacity: 0;
            animation:
                ciReveal 1.3s ease 0.1s forwards,
                ciFadeOut 1.3s ease 4s forwards;
        }
        /* Soft glow copy behind it; killed as the lighting flattens. */
        .ci-glow {
            opacity: 0;
            animation:
                ciGlowIn 1.5s ease 0.1s forwards,
                ciFadeOut 1.0s ease 4s forwards;
        }
        /* The moving "spotlight" swept across the plumage (a group inside the mask). */
        .ci-light { animation: ciLight 2.6s cubic-bezier(0.4,0,0.2,1) 0s both; }
        /* The flat black logo the bird resolves into; fades in as the white fades out. */
        .ci-black {
            opacity: 0;
            animation: ciBlackIn 1.4s cubic-bezier(0.65,0,0.35,1) 4.1s forwards;
        }
        /* Wordmark locks in under the crisp logo. */
        .ci-word {
            position: absolute; left: 0; right: 0; bottom: 22%;
            text-align: center;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 15px; font-weight: 500; text-transform: uppercase; color: #000;
            letter-spacing: 8px; padding-left: 8px;
            opacity: 0;
            animation: ciWordIn 1.1s cubic-bezier(0.22,1,0.36,1) 5s forwards;
        }

        @keyframes ciReveal  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes ciGlowIn  { from { opacity: 0; } to { opacity: 0.85; } }
        @keyframes ciFadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes ciBlackIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes ciBgToWhite { from { background: #0A0D0B; } to { background: #FFFFFF; } }
        @keyframes ciWordIn  { from { opacity: 0; letter-spacing: 20px; transform: translateY(6px); }
                               to   { opacity: 1; letter-spacing: 8px;  transform: translateY(0); } }
        /* Tracking pan: drift left→right, then ease to rest centered. */
        @keyframes ciPan {
            0%   { transform: translateX(-16px); }
            62%  { transform: translateX(14px); }
            100% { transform: translateX(0); }
        }
        /* Spotlight sweep across the bird, then settle wide/centered. */
        @keyframes ciLight {
            0%   { transform: translate(-70px, 30px); }
            70%  { transform: translate(110px, -20px); }
            100% { transform: translate(0, 0); }
        }
        /* Reduced motion: no cinematic sequence — snap to the final locked frame. */
        @media (prefers-reduced-motion: reduce) {
            .pf-intro { background: #FFFFFF; animation: none; }
            .ci-vignette, .ci-white, .ci-glow, .ci-light, .ci-parallax { animation: none; }
            .ci-vignette, .ci-white, .ci-glow { opacity: 0; }
            .ci-black { opacity: 1; animation: none; }
            .ci-word  { opacity: 1; animation: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .screen iframe.pf-enter { animation: none; }
        }
        /* No scrollbar on the frame itself. */
        body::-webkit-scrollbar, .screen::-webkit-scrollbar { width: 0; height: 0; display: none; }
        /* On a real phone (narrow screen) drop the device chrome — the site fills the
           screen edge to edge, no bezel, no black bars, no fake status bar. */
        @media (max-width: 460px) {
            .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; padding: 0; box-shadow: none; background: #fff; }
            .screen { border-radius: 0; }
            .island { display: none; }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="screen">
            <!-- The whole site lives in here. index.html detects it is framed and renders
                 the real homepage instead of bouncing back to this frame. -->
            <iframe title="moravchick" id="siteFrame"></iframe>
            <!-- Paper cover shown during the page-to-page fetch gap and on first load,
                 with the moravchick logo spinning as the loading mark. -->
            <div class="pf-cover is-on" id="pfCover">
                <div class="pf-spin-wrap">
                    <img class="pf-spin" src="peacock-logo.png?v=1" alt="Loading moravchick" />
                </div>
            </div>
            <!-- Camera island floats over the full-screen content. -->
            <div class="island"></div>
            <!-- Cinematic peacock entrance played once per app open. Two SVG path
                 states share the same anchor structure: a luminous white bird
                 (ci-white / ci-glow) revealed by a moving light, dissolving into a
                 flat black logo (ci-black) on pure white. -->
            <div class="pf-intro" id="pfIntro">
                <div class="ci-vignette"></div>
                <svg class="ci-svg" viewBox="0 0 400 480" aria-label="moravchick" role="img"
                     xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Luminous plumage gradient: bright core → shadow. -->
                        <linearGradient id="ciPlumage" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#ffffff"/>
                            <stop offset="0.55" stop-color="#e7f0f2"/>
                            <stop offset="1" stop-color="#8fa7ad"/>
                        </linearGradient>
                        <!-- Soft glow/blur for dramatic rim lighting. -->
                        <filter id="ciGlow" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
                            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                        <!-- Moving spotlight mask: a soft circle swept over the plumage. -->
                        <radialGradient id="ciLightGrad" cx="0.5" cy="0.5" r="0.5">
                            <stop offset="0" stop-color="#fff" stop-opacity="1"/>
                            <stop offset="0.6" stop-color="#fff" stop-opacity="0.6"/>
                            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                        </radialGradient>
                        <mask id="ciLightMask">
                            <rect x="0" y="0" width="400" height="480" fill="#fff" opacity="0.2"/>
                            <g class="ci-light">
                                <circle cx="180" cy="230" r="175" fill="url(#ciLightGrad)"/>
                            </g>
                        </mask>
                    </defs>

                    <g class="ci-parallax">
                        <!-- Glow copy, lit through the moving mask. -->
                        <path class="ci-glow" filter="url(#ciGlow)" mask="url(#ciLightMask)"
                              fill="url(#ciPlumage)" d="M 150 70 C 148 58 156 48 168 50 C 165 40 175 34 182 42 C 182 30 194 28 196 40 C 202 30 214 34 210 46 C 220 44 226 54 216 60 C 232 66 226 84 212 82 C 224 96 214 118 198 112 C 208 130 214 156 210 184 C 246 150 300 140 344 168 C 322 156 300 168 300 190 C 330 182 360 200 366 232 C 344 214 320 222 320 246 C 350 244 372 272 366 306 C 344 282 320 292 322 316 C 348 322 360 356 340 382 C 326 358 302 362 300 386 C 316 404 306 436 282 436 C 292 418 276 408 264 420 C 262 398 240 396 236 416 C 232 392 210 396 212 418 C 206 398 186 402 190 422 C 178 400 156 410 162 432 C 146 410 120 420 122 446 C 108 420 120 392 146 388 C 176 384 196 360 200 330 C 184 344 160 342 150 324 C 168 330 186 320 188 302 C 170 300 158 282 166 264 C 176 280 196 278 200 260 C 182 248 178 222 194 206 C 190 232 206 244 216 236 C 204 214 180 214 170 232 C 168 208 176 176 160 150 C 166 176 150 190 138 178 C 150 160 142 138 124 138 C 140 128 144 106 130 96 C 146 100 158 90 154 76 C 152 74 151 72 150 70 Z"/>
                        <!-- Crisp luminous white bird (entrance state). -->
                        <path class="ci-white" fill="url(#ciPlumage)"
                              d="M 150 70 C 148 58 156 48 168 50 C 165 40 175 34 182 42 C 182 30 194 28 196 40 C 202 30 214 34 210 46 C 220 44 226 54 216 60 C 232 66 226 84 212 82 C 224 96 214 118 198 112 C 208 130 214 156 210 184 C 246 150 300 140 344 168 C 322 156 300 168 300 190 C 330 182 360 200 366 232 C 344 214 320 222 320 246 C 350 244 372 272 366 306 C 344 282 320 292 322 316 C 348 322 360 356 340 382 C 326 358 302 362 300 386 C 316 404 306 436 282 436 C 292 418 276 408 264 420 C 262 398 240 396 236 416 C 232 392 210 396 212 418 C 206 398 186 402 190 422 C 178 400 156 410 162 432 C 146 410 120 420 122 446 C 108 420 120 392 146 388 C 176 384 196 360 200 330 C 184 344 160 342 150 324 C 168 330 186 320 188 302 C 170 300 158 282 166 264 C 176 280 196 278 200 260 C 182 248 178 222 194 206 C 190 232 206 244 216 236 C 204 214 180 214 170 232 C 168 208 176 176 160 150 C 166 176 150 190 138 178 C 150 160 142 138 124 138 C 140 128 144 106 130 96 C 146 100 158 90 154 76 C 152 74 151 72 150 70 Z"/>
                        <!-- Flat black final logo (logo state, same anchors). -->
                        <path class="ci-black" fill="#000000"
                              d="M 150 70 C 149 60 155 52 166 54 C 164 44 174 40 180 48 C 181 34 193 34 195 46 C 200 34 213 40 208 50 C 219 50 224 58 214 63 C 229 70 224 86 211 84 C 222 98 213 118 198 113 C 207 131 213 156 210 184 C 250 152 300 144 344 170 C 320 160 302 172 302 192 C 332 184 359 202 364 232 C 342 216 322 224 322 246 C 351 246 371 272 364 305 C 343 284 322 293 323 316 C 349 323 359 355 339 380 C 325 358 303 363 301 386 C 315 405 305 435 282 435 C 291 419 277 409 265 420 C 263 399 241 397 237 416 C 233 393 211 397 213 418 C 207 399 187 403 191 422 C 179 401 157 410 163 432 C 147 411 121 420 123 446 C 109 421 121 393 147 389 C 177 385 197 361 201 331 C 185 345 161 343 151 325 C 169 331 187 321 189 303 C 171 301 159 283 167 265 C 177 281 197 279 201 261 C 183 249 179 223 195 207 C 191 233 207 245 217 237 C 205 215 181 215 171 233 C 169 209 177 177 161 151 C 167 177 151 191 139 179 C 151 161 143 139 125 139 C 141 129 145 107 131 97 C 147 101 159 91 155 77 C 153 75 151 72 150 70 Z"/>
                    </g>
                </svg>
                <div class="ci-word">moravchick</div>
            </div>
        </div>
    </div>
    <script>
        // Hide the content scrollbar inside the phone (scrolling still works). Same-origin
        // (file://) lets us inject a style into the framed document; re-runs on every
        // in-frame navigation because onload fires for each page load.
        var frame = document.getElementById('siteFrame');

        // ---- Entrance animation: remove the intro overlay once it has played, so it
        // never intercepts taps. Runs once per app open (phone-frame load). ----
        (function playIntro() {
            var intro = document.getElementById('pfIntro');
            if (!intro) return;
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var total = reduce ? 900 : 6300;   // ~6s cinematic timeline + brief lock hold
            setTimeout(function () {
                intro.classList.add('done');
                // Signal completion so anything that wants to react to "app ready" can.
                try { document.dispatchEvent(new CustomEvent('peacock-intro:complete')); } catch (e) {}
                if (typeof window.onPeacockIntroComplete === 'function') {
                    try { window.onPeacockIntroComplete(); } catch (e) {}
                }
            }, total);
        })();

        // ---- Straight-to-home entry ----
        // The feed is a "protected" view (auth.js bounces logged-out visitors to the
        // login page). So the app can open straight to the home feed every time, seed a
        // lightweight guest session first — but only when none exists, so a real login
        // is never overwritten.
        (function ensureGuestSession() {
            try {
                if (localStorage.getItem('vero_session')) return;
                var uid = 'guest';
                localStorage.setItem('vero_users', JSON.stringify([{ id: uid, handle: 'guest', name: 'Guest' }]));
                localStorage.setItem('vero_session', JSON.stringify({ userId: uid, token: 'guest', expiresAt: Date.now() + 31536000000 }));
                localStorage.setItem('vero_onboarded:' + uid, '1');
                if (!localStorage.getItem('vero_active_account')) localStorage.setItem('vero_active_account', 'buyer');
            } catch (e) { /* storage blocked — the login page will handle it */ }
        })();

        // Which page to render inside the phone. Defaults to the homepage; a
        // ?page=<file>.html param lets a directly-opened inner page (e.g. a profile)
        // hand off to this frame and still load itself. Only a bare local filename is
        // accepted, so the param can't point the frame at an arbitrary URL.
        function pageTargetFromHash(cacheBust) {
            var raw = (location.hash.match(/[#&]page=([^&]+)/) || [])[1];
            raw = raw ? decodeURIComponent(raw) : null;
            // Split an optional query string (e.g. profile.html?from=seller) off the
            // filename, so a mode can be carried into the framed page.
            var file = raw, query = '';
            if (raw) { var qi = raw.indexOf('?'); if (qi >= 0) { file = raw.slice(0, qi); query = raw.slice(qi); } }
            if (file && !/\.html$/.test(file)) file += '.html';   // tolerate clean-URL servers
            var safe = file && /^[a-zA-Z0-9_-]+\.html$/.test(file) && file !== 'phone-frame.html'
                       && /^(\?[\w=&%.-]*)?$/.test(query);
            var target = safe ? file + query : 'index.html';
            if (cacheBust) target += (target.indexOf('?') >= 0 ? '&' : '?') + '_ts=' + Date.now();
            return target;
        }
        // Compare two targets ignoring the cache-bust param, so a hashchange to the
        // page already showing doesn't pointlessly reload it.
        function samePage(a, b) {
            var strip = function (u) { return u.replace(/([?&])_ts=\d+/, '$1').replace(/[?&]$/, ''); };
            return strip(a) === strip(b);
        }
        // Initial load (with cache-bust so a fresh deploy always wins).
        frame.src = pageTargetFromHash(true);

        // In-frame navigation via the #page= hash (veroGoAccount / veroOpenArea /
        // veroSlideToCart set window.top.location.hash). Without this listener the hash
        // would change but the iframe would never move — so honour it here.
        window.addEventListener('hashchange', function () {
            var next = pageTargetFromHash(false);
            if (!samePage(frame.src, next)) frame.src = next;
        });
        function hideFrameScrollbar() {
            try {
                var d = frame.contentDocument;
                if (!d) return;
                if (!d.getElementById('pf-hide-sb')) {
                    var s = d.createElement('style');
                    s.id = 'pf-hide-sb';
                    s.textContent =
                        // No scrollbars anywhere (scrolling still works).
                        'html,body{scrollbar-width:none!important;-ms-overflow-style:none!important;}' +
                        'html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;}' +
                        // ---- App-feel layer (applied to every inner page) ----
                        // No blue tap-highlight, no long-press callout menu.
                        '*{-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;}' +
                        // No pull-to-refresh / rubber-band bounce; no auto text-resize.
                        'html,body{overscroll-behavior:none!important;-webkit-text-size-adjust:100%!important;}' +
                        // Text is not selectable (like a native app)…
                        'body,body *{-webkit-user-select:none!important;user-select:none!important;}' +
                        // …except real inputs, where typing/selection must still work.
                        'input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;}';
                    (d.head || d.documentElement).appendChild(s);
                }
                // ---- Auto cache-busting for in-frame link navigation ----
                // Appends a _ts param to plain same-origin .html link clicks so the
                // browser always fetches the freshest deploy (no manual hard-refresh).
                // Skips links with their own onclick (their handler navigates) and
                // external / hash / new-tab links.
                if (!d.__pfNavBust) {
                    d.__pfNavBust = true;
                    d.addEventListener('click', function (e) {
                        var a = e.target && e.target.closest && e.target.closest('a[href]');
                        if (!a || a.hasAttribute('onclick') || a.target === '_blank') return;
                        var href = a.getAttribute('href');
                        if (!href || href.charAt(0) === '#') return;
                        if (/^(https?:|mailto:|tel:|javascript:|data:)/i.test(href)) return;
                        if (!/\.html(\?|$)/.test(href) || /[?&]_ts=/.test(href)) return;
                        e.preventDefault();
                        var sep = href.indexOf('?') >= 0 ? '&' : '?';
                        d.location.href = href + sep + '_ts=' + Date.now();
                    }, false);
                }
            } catch (e) { /* cross-origin (e.g. served over http) — ignore */ }
        }

        // Replay the slide-in animation on every navigation the iframe performs
        // (each inner link is a full document load, so 'load' fires per page).
        // One consistent slide for ALL navigations — forward and back alike: the new
        // page slides down from the top over the paper base.
        function playSlideIn() {
            frame.classList.remove('pf-enter');
            void frame.offsetWidth;          // force reflow so the animation restarts
            frame.classList.add('pf-enter');
        }

        // ---- No-white-flash page transitions ----
        // The moment the current page starts navigating away (pagehide, same-origin)
        // we raise a paper cover over the iframe, so the browser's blank white repaint
        // during the fetch is never visible. When the new page's 'load' fires we drop
        // the cover and slide the fresh page in over the paper base.
        var cover = document.getElementById('pfCover');
        var coverTimer = null;
        function showCover() {
            cover.classList.add('is-on');
            // Failsafe: if the next page's 'load' never fires (a navigation that was
            // cancelled, a mailto/tel/download, a stalled fetch), drop the cover anyway
            // so the app can never get stuck behind a blank paper screen.
            clearTimeout(coverTimer);
            coverTimer = setTimeout(hideCover, 2500);
        }
        function hideCover() {
            // Drop the cover immediately: behind the iframe is the paper base of
            // .screen, so the new page slides down over paper (never white). Keeping
            // the cover up during the slide would hide the animation.
            clearTimeout(coverTimer);
            cover.classList.remove('is-on');
        }

        // (Re)attach the pagehide listener to whichever document is currently framed.
        function armPageHide() {
            try {
                var w = frame.contentWindow;
                if (!w) return;
                w.removeEventListener('pagehide', showCover);
                w.addEventListener('pagehide', showCover);
            } catch (e) { /* cross-origin — ignore */ }
        }

        frame.addEventListener('load', function () {
            hideFrameScrollbar();
            playSlideIn();        // slide the new page down from the top
            hideCover();          // drop the paper cover so the slide is visible over paper
            armPageHide();        // arm the cover for the next navigation
            rememberCurrentPage();// keep the URL hash on the page shown, so a refresh stays here
        });
        hideFrameScrollbar();
        armPageHide();

        // ---- Refresh stays on the current page ----
        // In-frame navigations (location.href inside the iframe) don't change the top
        // URL, so a browser refresh would reload the ORIGINAL #page. On every inner
        // load, mirror the iframe's current page into the top hash (replaceState, so it
        // fires no hashchange and adds no history entry). On refresh, phone-frame then
        // reopens that same page.
        function rememberCurrentPage() {
            try {
                var loc = frame.contentWindow.location;
                var file = (loc.pathname.split('/').pop() || '');
                if (!/\.html$/.test(file) || file === 'phone-frame.html') return;
                // Keep meaningful params (e.g. ?from=seller) but drop the _ts cache-bust.
                var q = (loc.search || '').replace(/([?&])_ts=\d+/g, '$1').replace(/[?&]+$/, '');
                if (q === '?') q = '';
                var wanted = '#page=' + file + q;
                if (location.hash !== wanted) history.replaceState(null, '', wanted);
            } catch (e) { /* cross-origin — ignore */ }
        }

        // ---- Keep our install SW registered; keep ITS caches ----
        // The app installs as a standalone PWA and its speed comes from sw.js caching
        // the heavy assets (see sw.js: stale-while-revalidate). So we must NOT wipe the
        // SW's own caches here. We only delete caches from an OLDER caching scheme
        // (anything not prefixed 'vero-'), so no device stays stuck on a stale build.
        if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { if (k.indexOf('vero-') !== 0) caches.delete(k); });
            }).catch(function () {});
        }

        // ---- Proactive page prefetch (runs in the persistent frame, covers every
        //      inner page) — pull the pages a user is most likely to open next into
        //      the browser's HTTP cache, so tapping any of them loads near-instantly.
        //      This is the real fix for slow navigation on the phone (no hover there).
        (function warmPages() {
            var warmed = {};
            function warm(u) {
                if (warmed[u]) return; warmed[u] = 1;
                try { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = u; document.head.appendChild(l); } catch (e) {}
                fetch(u, { priority: 'low' }).catch(function () {});
            }
            var pages = [
                'index.html', 'profile.html', 'products.html', 'seller-area.html',
                'chats.html', 'cart-store.html', 'cart.html',
                'buyer-profile.html', 'drafts.html',
                'offers-received.html', 'saved.html', 'follows.html', 'product.html'
            ];
            var run = function () { pages.forEach(warm); };
            if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 2500 });
            else setTimeout(run, 1000);
        })();
    </script>
</body>
</html>
