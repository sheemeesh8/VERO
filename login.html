<style>
    :root {
        --bg:#000; --fg:#fff;
        --line:rgba(255,255,255,0.28); --muted:rgba(255,255,255,0.6); --err:#e5807f;
        --ease:cubic-bezier(0.22,1,0.36,1);
        --f-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        --f-serif: 'Bodoni Moda', 'Didot', Georgia, serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: var(--f-sans); color: var(--fg);
        background: var(--bg); display: flex; align-items: center; justify-content: center;
        padding: 40px 30px;
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }
    .brand-logo { display: block; height: 40px; margin: 0 auto 6px; object-fit: contain; }
    .brand { text-align: center; font-family: var(--f-serif); font-size: 34px; letter-spacing: 0.22em; text-indent: 0.22em; font-weight: 500; margin: 0 0 6px; }
    .tagline { text-align: center; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); margin-bottom: 46px; font-weight: 300; }

    /* Entrance */
    @keyframes riseIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    .anim { opacity:0; animation:riseIn .8s var(--ease) both; }
    .d1{animation-delay:.1s;} .d2{animation-delay:.25s;}
    @media (prefers-reduced-motion:reduce){ .anim{animation:none;opacity:1;} }

    /* ---- Saved accounts (avatar + name grid, two per row) ---- */
    .lead { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 30px; font-weight: 300; }
    .accounts { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 14px; }
    .acct {
        position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;
        cursor: pointer; padding: 2px 0; transition: transform .1s;
    }
    .acct:active { transform: scale(.97); }
    .acct .avwrap { position: relative; width: 80px; height: 80px; }
    .acct .av {
        width: 80px; height: 80px; border-radius: 50%;
        background: #161616 center/cover no-repeat; border: 1px solid rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--f-serif); font-size: 28px; font-weight: 400; color: #fff; overflow: hidden;
    }
    .acct .biz {
        position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
        width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
        background: #2a2a2a center/cover no-repeat; border: 3px solid #000;
        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff;
    }
    .acct .name {
        font-size: 13px; font-weight: 400; text-align: center; max-width: 100%; color: #fff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .acct .rm {
        position: absolute; top: -3px; right: calc(50% - 48px);
        width: 22px; height: 22px; border: none; border-radius: 50%;
        background: #fff; color: #b23b3b; font-size: 15px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 5px rgba(0,0,0,.5);
    }
    /* The "+" tile: a dashed circle to add / build a new profile. */
    .acct.add .av { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 30px; font-weight: 200; }

    /* Options revealed by tapping the "+" tile. */
    .add-sheet { display: none; flex-direction: column; gap: 12px; margin-top: 30px; }
    .add-sheet.show { display: flex; }
    .add-sheet .btn { text-decoration: none; text-align: center; }

    /* ---- Form (ruled-line fields, matching the sign-up screen) ---- */
    .field { margin-bottom: 22px; }
    .field label { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 300; }
    .field input {
        width: 100%; border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent;
        padding: 8px 2px 10px; font-size: 16px; font-weight: 300; font-family: inherit; color: var(--fg); direction: ltr; text-align: left;
    }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus { outline: none; border-bottom-color: #fff; }
    .btn {
        width: 100%; border: none; border-radius: 2px; padding: 17px; font-size: 13px; font-weight: 500;
        letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer; background: #fff; color: #000; font-family: inherit;
        transition: opacity .2s, background .2s, color .2s;
    }
    .btn:hover { opacity: .86; }
    .btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); font-weight: 400; margin-top: 12px; }
    .btn.ghost:hover { background: rgba(255,255,255,0.08); opacity: 1; }
    .note { min-height: 16px; margin: 12px 0 0; font-size: 12px; color: var(--err); text-align: center; }
    .foot { text-align: center; margin-top: 30px; font-size: 13px; color: var(--muted); font-weight: 300; }
    .foot a { color: #fff; font-weight: 500; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.5); padding-bottom: 1px; }
    .hide { display: none !important; }
    .backlink { display: block; text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted); text-decoration: none; }
    .backlink:hover { color: #fff; }
</style>

<body>
    <div class="wrap">
        <img src="peacock-logo-white.png?v=1" alt="moravchick" class="brand-logo anim" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand anim',textContent:'moravchick'}))">

        <!-- ===== SAVED ACCOUNTS (one-tap) ===== -->
        <section id="savedView" class="hide">
            <p class="lead">Choose a profile</p>
            <div class="accounts" id="acctList"></div>
            <div class="add-sheet" id="addSheet">
                <button class="btn ghost" onclick="showForm()">Sign in to an existing account</button>
                <a class="btn" href="signup.html">Build a new profile</a>
            </div>
        </section>

        <!-- ===== EMAIL / PASSWORD FORM ===== -->
        <section id="formView" class="hide">
            <form id="loginForm" autocomplete="on">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Sign in</button>
                <p class="note" id="formNote"></p>
            </form>
            <div class="foot">You don't have an account? <a href="signup.html">Sign up</a></div>
            <a class="backlink hide" id="backToSaved" href="#" onclick="showSaved();return false;">← Back to saved accounts</a>
        </section>
    </div>

    <script src="auth.js"></script>
    <script>
        // Already signed in? Skip straight through the guard.
        if (VeroAuth.guard('auth')) {
            var saved = VeroAuth.savedAccounts();

            function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

            function renderSaved() {
                saved = VeroAuth.savedAccounts();
                if (!saved.length) { showForm(); return; }
                var html = saved.map(function (a) {
                    var initial = (a.name || a.username || '?').trim().charAt(0).toUpperCase();
                    var av = a.avatar
                        ? '<span class="av" style="background-image:url(\'' + esc(a.avatar) + '\')"></span>'
                        : '<span class="av">' + esc(initial) + '</span>';
                    // Optional business profile of the same person → overlapping circle.
                    var biz = '';
                    if (a.bizAvatar) biz = '<span class="biz" style="background-image:url(\'' + esc(a.bizAvatar) + '\')"></span>';
                    else if (a.bizName) biz = '<span class="biz">' + esc(a.bizName.trim().charAt(0).toUpperCase()) + '</span>';
                    // Grid tile: avatar circle (+ optional biz badge) + name below.
                    return '<div class="acct" role="button" tabindex="0" onclick="tap(\'' + a.id + '\')" ' +
                        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();tap(\'' + a.id + '\')}">' +
                        '<button type="button" class="rm" title="Remove account" onclick="removeAcct(event,\'' + a.id + '\')">×</button>' +
                        '<span class="avwrap">' + av + biz + '</span>' +
                        '<span class="name">' + esc(a.name) + '</span>' +
                    '</div>';
                }).join('');
                // The "+" tile — same size, opens the add / build-new options.
                html += '<div class="acct add" role="button" tabindex="0" onclick="toggleAdd()" ' +
                        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleAdd()}">' +
                        '<span class="av">+</span><span class="name">Add a profile</span></div>';
                document.getElementById('acctList').innerHTML = html;
                showSaved();
            }

            window.toggleAdd = function () {
                document.getElementById('addSheet').classList.toggle('show');
            };
            window.showSaved = function () {
                if (!VeroAuth.savedAccounts().length) { showForm(); return; }
                document.getElementById('addSheet').classList.remove('show');
                document.getElementById('savedView').classList.remove('hide');
                document.getElementById('formView').classList.add('hide');
            };
            window.showForm = function () {
                document.getElementById('addSheet').classList.remove('show');
                document.getElementById('savedView').classList.add('hide');
                document.getElementById('formView').classList.remove('hide');
                document.getElementById('backToSaved').classList.toggle('hide', !VeroAuth.savedAccounts().length);
            };

            // One-tap re-auth via stored refresh token — no password prompt.
            window.tap = function (id) {
                try {
                    var user = VeroAuth.oneTap(id);
                    location.href = VeroAuth.hasOnboarded(user.id) ? 'index.html' : 'onboarding.html';
                } catch (e) {
                    // Stale/removed token → fall back to the password form.
                    showForm();
                    document.getElementById('formNote').textContent = 'This account needs to sign in again.';
                }
            };

            window.removeAcct = function (ev, id) {
                ev.stopPropagation();
                VeroAuth.forgetAccount(id);
                renderSaved();
            };

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var note = document.getElementById('formNote'); note.textContent = '';
                try {
                    var user = VeroAuth.login(
                        document.getElementById('email').value,
                        document.getElementById('password').value
                    );
                    location.href = VeroAuth.hasOnboarded(user.id) ? 'index.html' : 'onboarding.html';
                } catch (err) {
                    note.textContent = err.message === 'NO_USER'
                        ? 'No account found with this email.'
                        : 'The email or password is incorrect.';
                }
            });

            // Start on the saved-accounts screen if the device remembers anyone.
            saved.length ? renderSaved() : showForm();
        }
    </script>
