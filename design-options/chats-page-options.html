<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chats Page Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #171716; --muted: #8a877f; --faint: #b6b3ab; --line: #ecebe6; --paper: #f7f6f2; --unread: #d99c2b; --green: #2fbf5e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); font-family: 'Poppins', sans-serif; }
svg.i { width: 23px; height: 23px; stroke: currentColor; stroke-width: 1.25; fill: none; flex: none; }

/* product thumbs cropped from the hero photos */
.p1 { background: url('../women-hero.jpg') center 25% / cover; }
.p2 { background: url('../men-hero.jpg') center 30% / cover; }
.p3 { background: url('../art-hero.jpg') center / cover; }
.p4 { background: url('../clothing-hero.jpg') center 30% / cover; }
.p5 { background: url('../gallery-hero.jpg') center / cover; }
.p6 { background: url('../sale-hero.jpg') center / cover; }

/* ---------- shared top bar (current style) ---------- */
.tb { display: flex; align-items: center; padding: 44px 16px 12px; border-bottom: 1px solid var(--line); }
.tb .t { flex: 1; padding-left: 5%; font-family: 'Bodoni Moda', serif; font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
.tb .ic { width: 42px; height: 42px; display: grid; place-items: center; }
.ctl { display: flex; align-items: center; padding: 14px 20px; font-size: 14px; color: var(--faint); }
.ctl span { flex: 1; padding: 12px 4px; }

/* ---------- C1 current: flat rows ---------- */
.r1 { display: flex; align-items: center; gap: 13px; padding: 11px 20px; margin-bottom: 10px; }
.av { width: 50px; height: 50px; border-radius: 50%; background: var(--paper); flex: none; position: relative; display: grid; place-items: center; font-size: 22px; }
.av .on { position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 2px solid #fff; }
.bd { flex: 1; min-width: 0; }
.tl { display: flex; align-items: baseline; gap: 8px; }
.nm { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; }
.pv { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv.u { color: var(--ink); font-weight: 500; }
.it { font-size: 11.5px; color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ud { width: 8px; height: 8px; border-radius: 50%; background: var(--unread); flex: none; }

/* ---------- C2 product-first ---------- */
.r2 { display: flex; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); align-items: center; }
.r2 .th { width: 64px; height: 80px; border-radius: 6px; flex: none; position: relative; }
.r2 .th .sa { position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 2px solid #fff; display: grid; place-items: center; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
.r2 .itm { font-family: 'Bodoni Moda', serif; font-size: 16px; }
.r2 .px { font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-top: 2px; }

/* ---------- C3 cards ---------- */
.c3 { background: var(--paper); }
.c3 .tb { background: var(--paper); border: none; }
.card { margin: 0 16px 14px; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
.card .top { display: flex; align-items: center; gap: 12px; }
.card .av { width: 40px; height: 40px; font-size: 18px; }
.card .msg { background: var(--paper); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 12.5px; color: #444; margin-top: 12px; }
.card .ft { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.card .ft .th { width: 30px; height: 36px; border-radius: 4px; }
.badge { margin-left: auto; font-size: 8.5px; letter-spacing: 1.4px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--ink); color: #fff; }
.badge.lt { background: #fff; color: var(--ink); border: 1px solid #d8d3ca; }
.badge.gr { background: #e6f6ec; color: #1f8a44; }

/* ---------- C4 tabs ---------- */
.tabs { display: flex; gap: 26px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.tabs span { padding: 16px 0 12px; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); position: relative; }
.tabs span.on { color: var(--ink); }
.tabs span.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.tabs sup { font-size: 8px; color: var(--unread); margin-left: 3px; }

/* ---------- C5 stories row ---------- */
.stories { display: flex; gap: 16px; padding: 18px 20px 20px; border-bottom: 1px solid var(--line); overflow: hidden; }
.st { text-align: center; flex: none; }
.st .ring { width: 62px; height: 62px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #d99c2b, #e8842b 50%, #b35a1f); }
.st .ring.seen { background: #e4e1dc; }
.st .ring i { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #fff; }
.st small { display: block; font-size: 10px; margin-top: 6px; color: #444; max-width: 62px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--faint); padding: 18px 20px 6px; }

/* ---------- C6 editorial ---------- */
.c6 { padding: 0 28px; }
.c6 .big { padding: 60px 0 6px; font-family: 'Bodoni Moda', serif; font-size: 46px; line-height: 1; }
.c6 .big i { font-style: italic; }
.c6 .meta { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); padding-bottom: 22px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
.r6 { padding: 18px 0; border-bottom: 1px solid var(--line); }
.r6 .tl { align-items: baseline; }
.r6 .n { font-family: 'Bodoni Moda', serif; font-size: 21px; }
.r6 .n .no { font-family: 'Poppins'; font-size: 10px; color: var(--faint); margin-right: 10px; letter-spacing: 1px; vertical-align: 3px; }
.r6 .pv { font-size: 12.5px; margin-top: 6px; }
.r6 .k { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

/* ---------- C7 dark ---------- */
.c7 { background: #111110; color: #f2efe8; }
.c7 .tb { border-color: #262523; }
.c7 .tb .t { color: #f2efe8; }
.c7 .srch { margin: 16px 20px 10px; background: #1d1c1a; border-radius: 999px; padding: 12px 18px; font-size: 13px; color: #6f6c66; display: flex; gap: 10px; align-items: center; }
.c7 .srch svg { width: 17px; height: 17px; }
.c7 .r1 { margin-bottom: 4px; }
.c7 .av { background: #1f1e1c; }
.c7 .av .on { border-color: #111110; }
.c7 .pv { color: #8d8a83; } .c7 .pv.u { color: #f2efe8; }
.c7 .tm { color: #6f6c66; }
.c7 .ud { background: #e8b04d; }
.c7 .cnt { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #e8b04d; color: #111; font-size: 10.5px; font-weight: 500; display: grid; place-items: center; }

/* ---------- C8 grouped + status ---------- */
.grp { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); padding: 22px 20px 8px; display: flex; align-items: center; gap: 12px; }
.grp::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.r8 { display: flex; align-items: center; gap: 13px; padding: 12px 20px; }
.r8 .av { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; }
.r8 .av i { position: absolute; inset: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 5px; color: var(--muted); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.o { color: #d17a1c; } .chip.s { color: #2f7fbf; } .chip.d { color: #1f8a44; } .chip.x { color: var(--faint); }

/* ---------- C9 split / tablet-like: pinned + list ---------- */
.pins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 20px 6px; }
.pin { border-radius: 16px; height: 150px; position: relative; overflow: hidden; color: #fff; }
.pin::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.65)); }
.pin .tx { position: absolute; left: 12px; right: 12px; bottom: 11px; z-index: 1; }
.pin b { display: block; font-size: 13px; font-weight: 500; }
.pin small { display: block; font-size: 10.5px; opacity: 0.85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin .ud { position: absolute; top: 12px; right: 12px; z-index: 1; box-shadow: 0 0 0 2px #fff; }
</style>
</head>
<body>
<h1>Chats — אופציות</h1>
<p class="sub">9 עיצובים לדף הצ׳אטים (רשימת השיחות)</p>
<div class="grid" id="grid"></div>

<script>
var FUN = '<svg class="i" viewBox="0 0 24 24" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.4V19l-3.6-1.6v-5z"/></svg>';
var BACK = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var PEN = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';
var SRCH = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

var C = [
  { nm: 'Atelier Nord',  ic: '🧥', pv: 'Can you do ₪420 for the coat?',   tm: '09:41', it: 'Wool Overcoat',   px: '₪480', p: 'p1', u: 2, on: 1, st: ['o','Offer'] },
  { nm: 'Studio Vero',   ic: '🧣', pv: 'Shipped! Tracking number inside', tm: '08:15', it: 'Silk Scarf',      px: '₪190', p: 'p4', u: 1, on: 1, st: ['s','Shipped'] },
  { nm: 'Gallery Nine',  ic: '🖼️', pv: 'The piece is still available.',   tm: 'Yesterday', it: 'Blue Horizon, oil', px: '₪2,400', p: 'p3', u: 0, st: ['x','Inquiry'] },
  { nm: 'Denim Lab',     ic: '👖', pv: 'Thanks for your purchase!',       tm: 'Mon', it: 'Raw Denim Jacket', px: '₪350', p: 'p2', u: 0, st: ['d','Delivered'] },
  { nm: 'Vintage Vault', ic: '👗', pv: 'I can hold it until Friday',      tm: 'Sun', it: '70s Midi Dress',   px: '₪260', p: 'p6', u: 0, st: ['x','Inquiry'] },
  { nm: 'Art House',     ic: '🎨', pv: 'Framing is included in the price', tm: '12 Sep', it: 'Untitled No. 4', px: '₪1,100', p: 'p5', u: 0, st: ['d','Delivered'] }
];

function topbar(title, right) {
  return '<div class="tb"><span class="t">' + (title || 'My Chats') + '</span>' + (right || '') + '<span class="ic">' + BACK + '</span></div>';
}
function ctl() { return '<div class="ctl"><span>Search chats…</span>' + FUN + '</div>'; }
function av(c, cls) { return '<div class="av ' + (cls || '') + '">' + c.ic + (c.on ? '<span class="on"></span>' : '') + '</div>'; }
function r1(c, extra) {
  return '<div class="r1">' + av(c) + '<div class="bd"><div class="tl"><span class="nm">' + c.nm + '</span><span class="tm">' + c.tm + '</span></div>' +
    '<div class="tl"><div class="pv' + (c.u ? ' u' : '') + '">' + c.pv + '</div>' + (extra ? extra(c) : (c.u ? '<span class="ud" style="margin-left:auto"></span>' : '')) + '</div>' +
    '<div class="it">' + c.it + '</div></div></div>';
}
function scr(cls, inner) { return '<div class="screen ' + (cls || '') + '">' + inner + '</div>'; }

var OPTS = [
  ['C1 · הקיים', 'רשימה שטוחה בסגנון וואטסאפ: אווטאר, שם, הודעה אחרונה ושם המוצר. נקודה צהובה לשיחה חדשה.',
   scr('', topbar() + ctl() + C.map(function (c) { return r1(c); }).join(''))],

  ['C2 · המוצר במרכז', 'תמונת המוצר היא ה"אווטאר", ואייקון המוכר קטן בפינה. שם הפריט בסריף והמחיר מתחת — רואים מיד על מה השיחה.',
   scr('', topbar() + ctl() + C.map(function (c) {
     return '<div class="r2"><div class="th ' + c.p + '"><span class="sa">' + c.ic + '</span></div><div class="bd">' +
       '<div class="tl"><span class="itm">' + c.it + '</span><span class="tm">' + c.tm + '</span></div>' +
       '<div class="px">' + c.nm + ' · ' + c.px + '</div><div class="tl"><div class="pv' + (c.u ? ' u' : '') + '">' + c.pv + '</div>' + (c.u ? '<span class="ud" style="margin-left:auto"></span>' : '') + '</div></div></div>';
   }).join(''))],

  ['C3 · כרטיסים', 'כל שיחה בכרטיס לבן על רקע שמנת: ההודעה האחרונה בבועה, ובתחתית המוצר וסטטוס ההזמנה.',
   scr('c3', topbar() + '<div style="height:12px"></div>' + C.slice(0, 4).map(function (c) {
     var b = c.st[0] === 'o' ? 'badge' : c.st[0] === 'd' ? 'badge gr' : 'badge lt';
     return '<div class="card"><div class="top">' + av(c) + '<div class="bd"><div class="tl"><span class="nm">' + c.nm + '</span><span class="tm">' + c.tm + '</span></div></div></div>' +
       '<div class="msg">' + c.pv + '</div><div class="ft"><span class="th ' + c.p + '"></span>' + c.it + ' · ' + c.px + '<span class="' + b + '">' + c.st[1] + '</span></div></div>';
   }).join(''))],

  ['C4 · טאבים', 'טאבים מתחת לכותרת: All / Buying / Selling / Offers עם מונה של לא־נקראו. מפריד בין שיחות כקונה וכמוכר.',
   scr('', topbar() + '<div class="tabs"><span class="on">All</span><span>Buying<sup>3</sup></span><span>Selling</span><span>Offers<sup>1</sup></span></div>' + ctl() + C.map(function (c) { return r1(c); }).join(''))],

  ['C5 · שורת מוכרים', 'שורה אופקית של עיגולים בראש העמוד — מוכרים פעילים / חדשים, עם טבעת כתומה למי שכתב. מתחת הרשימה הרגילה.',
   scr('', topbar() + '<div class="stories">' + C.map(function (c, i) {
     return '<div class="st"><div class="ring' + (i > 1 ? ' seen' : '') + '"><i class="' + c.p + '"></i></div><small>' + c.nm + '</small></div>';
   }).join('') + '</div><div class="cap">Messages</div>' + C.slice(0, 5).map(function (c) { return r1(c); }).join(''))],

  ['C6 · מגזין', 'כותרת ענקית "Messages" בסריף, שמות בסריף גדול עם מספור, קווים דקים ובלי אווטארים. הכי אופנתי־עריכתי.',
   scr('c6', '<div class="big">Mess<i>ages</i></div><div class="meta"><span>6 conversations</span><span>3 unread</span></div>' + C.slice(0, 5).map(function (c, i) {
     return '<div class="r6"><div class="tl"><span class="n"><span class="no">0' + (i + 1) + '</span>' + c.nm + '</span><span class="tm">' + c.tm + '</span>' + (c.u ? '<span class="ud"></span>' : '') + '</div>' +
       '<div class="pv' + (c.u ? ' u' : '') + '">' + c.pv + '</div><div class="k">' + c.it + ' · ' + c.px + '</div></div>';
   }).join(''))],

  ['C7 · כהה', 'אותו מבנה כמו הקיים במצב לילה: רקע כמעט שחור, חיפוש בכדור, ומונה זהוב של הודעות שלא נקראו.',
   scr('c7', topbar('My Chats', '<span class="ic">' + PEN + '</span>') + '<div class="srch">' + SRCH + 'Search chats…</div>' +
     C.map(function (c) { return r1(c, function (c) { return c.u ? '<span class="cnt">' + c.u + '</span>' : ''; }); }).join(''))],

  ['C8 · לפי תאריך + סטטוס', 'השיחות מקובצות: Today / This week / Earlier. מתחת לכל שיחה תווית צבעונית: הצעה, נשלח, נמסר, שאלה.',
   scr('', topbar() + ctl() + [['Today', C.slice(0, 2)], ['This week', C.slice(2, 5)], ['Earlier', C.slice(5)]].map(function (g) {
     return '<div class="grp">' + g[0] + '</div>' + g[1].map(function (c) {
       return '<div class="r8"><div class="av"><i class="' + c.p + '"></i></div><div class="bd"><div class="tl"><span class="nm">' + c.nm + '</span><span class="tm">' + c.tm + '</span></div>' +
         '<div class="pv' + (c.u ? ' u' : '') + '">' + c.pv + '</div><span class="chip ' + c.st[0] + '">' + c.st[1] + '</span></div></div>';
     }).join('');
   }).join(''))],

  ['C9 · נעוצים למעלה', 'שתי השיחות הפעילות (הזמנה / הצעה) כאריחי תמונה גדולים בראש, והשאר ברשימה רגילה מתחת.',
   scr('', topbar() + ctl() + '<div class="pins">' + C.slice(0, 2).map(function (c) {
     return '<div class="pin ' + c.p + '"><span class="ud"></span><div class="tx"><b>' + c.nm + '</b><small>' + c.pv + '</small></div></div>';
   }).join('') + '</div><div class="cap">All chats</div>' + C.slice(2).map(function (c) { return r1(c); }).join(''))]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
