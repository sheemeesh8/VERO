<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The moravchick feed — search, browse by category, and discover what's on sale and newly listed, all in one place.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Feed</title>
    <script src="vero-theme.js"></script>
    <link rel="stylesheet" href="zoom-parallax.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Arimo:wght@400;500;600;700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="search-box.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; direction: ltr; }

        /* ===== Feed shell — top padding set from JS to clear header + subnav. */
        .feed-wrap { max-width: 720px; margin: 0 auto; padding: 132px 20px 56px; }

        /* Keep the shared header pinned and visible at all times. */
        #siteHeader { position: fixed !important; transform: none !important; }

        /* ===== Gender category sub-header — a small bar under the main header ===== */
        .feed-subnav {
            position: fixed; left: 0; right: 0; top: 64px; z-index: 98;
            display: flex; justify-content: center; gap: 30px; align-items: flex-end;
            padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none;
            background: rgba(255,255,255,0.94);
            -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
            /* The guide line the labels sit on. */
            border-bottom: 1px solid #d9d7d2;
        }
        .feed-subnav::-webkit-scrollbar { display: none; }
        /* Plain text labels — no pill — underlined on the guide line when active. */
        .fsn-item {
            flex: none; appearance: none; background: transparent; cursor: pointer;
            font-family: 'Archivo','Poppins',sans-serif; font-weight: 600; font-size: 12px;
            letter-spacing: 1.4px; text-transform: uppercase; color: #8a857c;
            padding: 0 2px 11px; white-space: nowrap;
            border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
            transition: color .2s, border-color .2s;
        }
        .fsn-item:hover { color: #1b1916; }
        .fsn-item.on { color: #1b1916; border-bottom-color: #1b1916; }

        /* ===== Search bar ===== */
        .feed-search { position: relative; margin: 0 0 26px; }
        .feed-search input {
            width: 100%; height: 48px; border: 1px solid #e4e0d6; border-radius: 9999px;
            background: #fff; padding: 0 20px 0 46px;
            font-family: 'Arimo','Inter',sans-serif; font-size: 15px; color: #1b1916; outline: none;
            transition: border-color .2s;
        }
        .feed-search input:focus { border-color: #111; }
        .feed-search input::placeholder { color: #a3a298; }

        /* ===== Section banner — full-bleed image strip with centred title ===== */
        .feed-banner { position: relative; width: calc(100% + 40px); margin: 0 -20px 14px; height: 34svh; min-height: 230px; max-height: 420px; overflow: hidden;
            display: flex; align-items: center; justify-content: center; text-align: center; background: #e9e7e2; }
        .feed-banner .fb-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform: scale(1.02); transition: opacity .3s; }
        .feed-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.42)); }
        .feed-banner .fb-txt { position: relative; z-index: 2; color: #fff; padding: 0 20px; }
        .feed-banner .fb-title { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: clamp(22px, 6vw, 34px); letter-spacing: -0.02em; text-transform: uppercase; line-height: 1; text-shadow: 0 2px 14px rgba(0,0,0,0.3); }
        .feed-banner .fb-sub { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; color: rgba(255,255,255,0.92); }
        .feed-banner.is-sale .fb-title { color: #fff; }
        .feed-banner.is-sale::after { background: linear-gradient(180deg, rgba(123,30,27,0.30), rgba(123,30,27,0.55)); }

        /* ===== Gender coverflow carousel (ported 1:1 from the old home) ===== */
        #genderCover { position: relative; margin: 0 -20px 8px; --gc-card: clamp(240px, 78vw, 420px); }
        #genderCover .gc-head { font-family: 'Poppins','Inter',sans-serif; font-weight: 300; letter-spacing: 0.01em; font-size: 15px; color: #111; text-align: center; margin: 0 0 2px; }
        #genderCover .gc-sub { font-family: 'Poppins','Inter',sans-serif; font-weight: 400; font-size: 12px; color: #6b6a64; text-align: center; margin: 0 0 4px; min-height: 16px; }
        #genderCover .gc-rel { position: relative; }
        #genderCover .gc-frame { perspective: calc(var(--gc-card) * 3); overflow: hidden; padding: 16px 0 14px; outline: none; cursor: grab; touch-action: pan-y; }
        #genderCover .gc-frame:active { cursor: grabbing; }
        #genderCover .gc-stage { position: relative; height: var(--gc-card); transform-style: preserve-3d; }
        #genderCover .gc-card { position: absolute; left: 50%; top: 0; width: var(--gc-card); height: var(--gc-card); overflow: hidden; background: #fff; will-change: transform; }
        #genderCover .gc-card img, #genderCover .gc-card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; pointer-events: none; }
        #genderCover .gc-cap { display: flex; flex-direction: column; align-items: center; margin-top: 2px; }
        #genderCover .gc-cap .gc-name { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: -0.3px; color: #111; }
        #genderCover .gc-cap .gc-shop { margin-top: 4px; font-family: 'Arimo','Inter',sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #111; border-bottom: 1px solid #111; padding-bottom: 2px; text-decoration: none; cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; }
        #genderCover .gc-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
        #genderCover .gc-dots button { width: 8px; height: 8px; padding: 0; border: none; border-radius: 9999px; background: #111; opacity: 0.25; cursor: pointer; transition: opacity .25s ease, width .25s ease; }
        #genderCover .gc-dots button.on { opacity: 1; width: 22px; }

        /* ===== Single featured product card (follows the chosen gender) ===== */
        /* Single featured card — no background, the piece floating free with the
           brand / name / price centred beneath it. */
        .feature-card { display: block; text-decoration: none; color: #1b1916; margin: 4px 0 2px; }
        .feature-card .fc-img { position: relative; width: 100%; aspect-ratio: 1.5; background: transparent; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .feature-card .fc-img img { width: 100%; height: 100%; object-fit: contain; }
        .feature-card .fc-emoji { font-size: 96px; opacity: .5; }
        .feature-card .fc-pct { position: absolute; top: 4px; right: 10px; z-index: 3; height: 24px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 5px; background: #B3433B; color: #fff; font-family: 'Archivo',sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .5px; }
        .feature-card .fc-cap { text-align: center; margin-top: 8px; }
        .feature-card .fc-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #8a857c; }
        .feature-card .fc-name { font-family: 'Archivo','Inter',sans-serif; font-size: 16px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; margin-top: 4px; }
        .feature-card .fc-price { font-family: 'Archivo','Inter',sans-serif; font-size: 15px; margin-top: 5px; }
        .feature-card.is-sale .fc-price { color: #B3433B; }
        .feature-card .fc-was { font-family: 'Arimo',sans-serif; font-size: 12px; color: #a3a298; text-decoration: line-through; margin-right: 6px; }

        /* ===== Section heading ===== */
        .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 0 10px; }
        .sec-head h3 { margin: 0; font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; text-transform: uppercase; color: #1b1916; }
        .sec-head .sec-sub { font-family: 'Arimo','Inter',sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #a3a298; }

        /* ===== 4-card separator block ===== */
        .feed-sep { margin: 16px -4px; padding: 16px 0; border-top: 1px solid #ececec; border-bottom: 1px solid #ececec; }
        .sep-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        /* The editorial card, shared by the separator block + search results. */
        .cv-card { text-decoration: none; color: #1b1916; display: block; min-width: 0; text-align: left; }
        .cv-card-img { position: relative; width: 100%; aspect-ratio: 0.82; background: #F2F2F2; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cv-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .cv-card-emoji { font-size: 34px; opacity: 0.45; }
        .cv-card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: 10px; }
        .cv-card-name { font-family: 'Archivo','Inter',sans-serif; font-size: 11px; line-height: 1.3; letter-spacing: 0.3px; text-transform: uppercase; color: #1b1916; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; }
        .cv-card-price { font-family: 'Archivo','Inter',sans-serif; font-size: 11px; color: #1b1916; white-space: nowrap; flex: 0 0 auto; }
        .cv-card-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 10.5px; color: #8a857c; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cv-card.is-sale .cv-card-price { color: #B3433B; }
        .cv-card-was { font-family: 'Arimo',sans-serif; font-size: 10px; color: #a3a298; text-decoration: line-through; margin-right: 4px; }

        /* ===== Transparent 10-card rail (Sales / New) =====
           Cards have no card ground — just the piece on the page, with the brand,
           name and price centred beneath it. */
        .rail-trans { display: flex; gap: 18px; overflow-x: auto; padding: 4px 0 10px; margin: 0 -4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .rail-trans::-webkit-scrollbar { display: none; }
        .rt-card { flex: 0 0 160px; width: 160px; text-decoration: none; color: #1b1916; }
        .rt-img { position: relative; width: 100%; aspect-ratio: 0.9; background: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .rt-img img { width: 100%; height: 100%; object-fit: contain; }
        .rt-emoji { font-size: 54px; opacity: .5; }
        .rt-pct { position: absolute; top: 4px; right: 10px; z-index: 3; height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 5px; background: #B3433B; color: #fff; font-family: 'Archivo',sans-serif; font-size: 10px; font-weight: 800; }
        .rt-cap { text-align: center; margin-top: 10px; }
        .rt-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #8a857c; }
        .rt-name { font-family: 'Archivo','Inter',sans-serif; font-size: 12px; letter-spacing: .4px; text-transform: uppercase; color: #1b1916; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rt-price { font-family: 'Archivo','Inter',sans-serif; font-size: 12px; color: #1b1916; margin-top: 3px; }
        .rt-card.is-sale .rt-price { color: #B3433B; }
        .rt-was { font-family: 'Arimo',sans-serif; font-size: 10.5px; color: #a3a298; text-decoration: line-through; margin-right: 5px; }

        /* ===== Search results grid ===== */
        .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 8px; margin: 0 -4px; }
        .feed-grid .cv-card-emoji { font-size: 48px; }
        .feed-grid .cv-card-name { font-size: 13px; letter-spacing: .4px; }
        .feed-grid .cv-card-price { font-size: 13px; }
        .feed-grid .cv-card-brand { font-size: 12px; }
        .feed-empty { text-align: center; padding: 50px 20px; color: #8a857c; font-family: 'Arimo','Inter',sans-serif; font-size: 14px; }

        @media (min-width: 560px) {
            .feed-grid { grid-template-columns: repeat(3, 1fr); }
            #genderCover { --gc-card: clamp(260px, 60vw, 420px); }
        }
        @media (prefers-reduced-motion: reduce) {
            #genderCover .gc-card { transition: none !important; }
        }

        /* ===== Hero — zoom-parallax entrance (circles) + copy + band ===== */
        /* A ring of category circles over the hero video that opens on scroll.
           Captions sit on top (staggered in), the search + Autumn Collection
           slider band rests over the bottom third. */
        .zp-wrap { position: relative; width: 100%; z-index: 0; background: #fff;
            height: 200vh; height: 200svh; }
        .hero { position: sticky; top: 0; width: 100%; overflow: hidden; background: #fff; z-index: 0;
            height: 100vh; height: 100svh;
            /* Band holds the search + the Autumn Collection slider; the circle
               stage fills the rest above it. */
            --band-h: max(33svh, 300px); }
        .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        /* The zoom-circle stage fills the whole hero (clean full-screen nav). */
        .hero .zp-stage { position: absolute; inset: 0; }
        /* Welcome copy near the top, over the collage — dark with a soft halo. */
        .hero-copy { position: absolute; left: 0; right: 0; top: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: clamp(72px, 10vh, 96px) 20px 0; color: #1b1916;
            font-family: 'Poppins','Inter',system-ui,sans-serif;
            text-shadow: 0 1px 22px rgba(255,255,255,0.7); }
        /* Captions rise in, one after another. */
        .hero-copy > * { opacity: 0; transform: translateY(14px);
            animation: heroCapRise .6s cubic-bezier(.2,.75,.25,1) forwards; }
        .hero-eyebrow { animation-delay: .25s; }
        .hero-welcome { animation-delay: .45s; }
        .hero-slogan  { animation-delay: .65s; }
        @keyframes heroCapRise { to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            .hero-copy > * { opacity: 1; transform: none; animation: none; }
        }
        /* Category-page hero style: eyebrow + large title + subtitle sentence. */
        .hero-eyebrow { font-family: 'Arimo','Inter',sans-serif; font-size: clamp(10px, 2.6vw, 12px);
            letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; margin-bottom: 10px; }
        .hero-welcome { font-size: clamp(24px, 6.4vw, 40px); font-weight: 300; letter-spacing: 0.01em; }
        .hero-welcome b { font-weight: 600; }
        .hero-slogan { margin-top: 8px; font-size: clamp(11px, 3vw, 13px); font-weight: 400;
            letter-spacing: 0.5px; opacity: 0.92; max-width: 460px; padding: 0 20px;
            font-family: 'Arimo','Inter',sans-serif; }
        .hero-slogan b { font-weight: 600; }
        .hero-band { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: #fff;
            height: 44svh; height: var(--band-h);
            display: flex; flex-direction: column; align-items: stretch; justify-content: center;
            gap: 16px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
            /* The white band rises into view only after the hero has settled. */
            transform: translateY(100%); opacity: 0;
            animation: heroBandRise .72s cubic-bezier(.2,.75,.25,1) .5s forwards; }
        @keyframes heroBandRise { to { transform: translateY(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .hero-band { transform: none; opacity: 1; animation: none; }
        }
        .hero-band-search { width: 100%; max-width: 520px; margin: 0 auto; }
        /* Compact the slider cards so search + slider fit the ~1/3 band. */
        .hero-band .rail-trans { padding: 2px 0 2px; }
        .hero-band .rt-card { flex: 0 0 132px; width: 132px; }
        .hero-band .rt-img { aspect-ratio: 1.1; }
        .hero-band .rt-cap { margin-top: 6px; }
        .hero-band-search input { width: 100%; height: 48px; border: 1px solid #d9d7d2; border-radius: 999px;
            padding: 0 22px; font-size: 14px; font-family: 'Arimo','Inter',sans-serif; color: #1b1916;
            background: #fff; outline: none; transition: border-color .2s; }
        .hero-band-search input:focus { border-color: #1b1916; }
        .hero-band-cue { display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #8a857c; font-family: 'Arimo','Inter',sans-serif; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; background: none; border: 0; padding: 0; }
        .hero-band-cue svg { width: 18px; height: 18px; stroke: #8a857c; fill: none; stroke-width: 1.6;
            animation: cueBob 1.8s ease-in-out infinite; }
        @keyframes cueBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

        /* The feed follows directly after the hero's sticky track. */
        .feed-scroll { position: relative; z-index: 1; background: #fff; margin-top: 0; min-height: 100vh; }
        #siteFooter { position: relative; z-index: 1; }

        /* The gender sub-header fades away while the hero is in view. */
        .feed-subnav { transition: opacity .3s ease, transform .3s ease; }
        .feed-subnav.is-hero { opacity: 0; pointer-events: none; transform: translateY(-10px); }
    </style>
</head>
<body>
    <!-- Keep the header transparent over the hero, solid once the feed rises in. -->
    <script>
        // One transparent header through the whole zoom entrance; it goes solid
        // (white) only once we've crossed past the hero's sticky track.
        window.veroHeroPassed = function () {
            var w = document.getElementById('feedHeroWrap');
            var release = w ? (w.offsetTop + w.offsetHeight - window.innerHeight) : window.innerHeight;
            return window.scrollY >= release - 4;
        };
        window.veroHeaderScrolled = function () { return window.veroHeroPassed(); };
    </script>
    <!-- Shared site header (single source: header.js). It injects #siteHeader. -->
    <script src="header.js?v=60"></script>

    <!-- Hero — a clean entrance: a ring of category circles (with labels) that
         zooms open on scroll, then releases into the feed below. No copy, no
         search, no slider here — just the navigation ring. -->
    <div class="zp-wrap" id="feedHeroWrap">
    <section class="hero" id="feedHero">
        <video class="hero-video" src="assets/hero/unisex.mp4" poster="assets/hero/autumn-hero.jpg" autoplay muted loop playsinline></video>
    </section>
    </div>

    <!-- Gender category sub-header — a small bar pinned under the main header. -->
    <nav class="feed-subnav is-hero" id="feedSubnav" aria-label="Shop by gender">
        <button type="button" class="fsn-item" data-gender="women">Women</button>
        <button type="button" class="fsn-item" data-gender="men">Men</button>
        <button type="button" class="fsn-item" data-gender="unisex">Unisex</button>
        <button type="button" class="fsn-item" data-gender="kids">Kids</button>
    </nav>

    <div class="feed-scroll">
    <main class="feed-wrap">
        <!-- 1 · Search -->
        <form class="feed-search" role="search" onsubmit="return false;">
            <input type="search" id="feedSearchInput" placeholder="Search the feed…" autocomplete="off" aria-label="Search the feed">
        </form>

        <!-- The structured feed (hidden while a search is active). -->
        <div id="feedStructured">
            <!-- 0 · Autumn Collection — transparent product slider -->
            <section class="feed-collection">
                <div class="sec-head"><h3>Autumn Collection</h3><span class="sec-sub">The season's edit</span></div>
                <div class="rail-trans" id="railAutumn"></div>
            </section>

            <!-- Banner · shop by category -->
            <div class="feed-banner" id="bannerFeature"><div class="fb-bg"></div><div class="fb-txt"><div class="fb-title">Shop by category</div><div class="fb-sub">Find your edit</div></div></div>

            <!-- 2 · Gender slider -->
            <div id="genderCover" role="region" aria-roledescription="carousel" aria-label="Choose by category">
                <p class="gc-head">Choose by category</p>
                <p class="gc-sub" aria-live="polite">Women's collection</p>
                <div class="gc-rel">
                    <div class="gc-frame" tabindex="0">
                        <div class="gc-stage">
                            <div class="gc-card" data-gender="women" data-name="Women" data-sub="Women's collection"><video class="gc-media" src="assets/hero/hero-clothing.mp4" poster="assets/hero/women-editorial.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></div>
                            <div class="gc-card" data-gender="men" data-name="Men" data-sub="Men's collection"><video class="gc-media" src="assets/hero/men.mp4" poster="men-hero.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></div>
                            <div class="gc-card" data-gender="unisex" data-name="Unisex" data-sub="Unisex collection"><video class="gc-media" src="assets/hero/unisex.mp4" poster="hero-beach.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></div>
                            <div class="gc-card" data-gender="kids" data-name="Kids" data-sub="Kids collection"><video class="gc-media" src="assets/hero/kids.mp4" poster="clothing-hero.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></div>
                        </div>
                    </div>
                </div>
                <div class="gc-cap">
                    <span class="gc-name">Women</span>
                    <button type="button" class="gc-shop">Shop Women</button>
                </div>
                <div class="gc-dots"></div>
            </div>

            <!-- 3 · Single featured product card, by the chosen gender -->
            <a class="feature-card" id="genderFeature" href="#"></a>

            <!-- Rails-first discovery: a wall of horizontal sliders, each under a
                 banner or heading, finished by a short browse grid. -->

            <!-- 4 · Sales section — banner + 10-card transparent rail -->
            <section>
                <div class="feed-banner is-sale" id="bannerSale"><div class="fb-bg"></div><div class="fb-txt"><div class="fb-title">On sale</div><div class="fb-sub">Up to 50% off</div></div></div>
                <div class="rail-trans" id="railSale"></div>
            </section>

            <!-- 5 · New arrivals section — banner + 10-card transparent rail -->
            <section>
                <div class="feed-banner" id="bannerNew"><div class="fb-bg"></div><div class="fb-txt"><div class="fb-title">New arrivals</div><div class="fb-sub">Just listed</div></div></div>
                <div class="rail-trans" id="railNew"></div>
            </section>

            <!-- 6 · For you — personalised discovery rail -->
            <section>
                <div class="sec-head"><h3>For you</h3><span class="sec-sub">Picked to your taste</span></div>
                <div class="rail-trans" id="railForYou"></div>
            </section>

            <!-- 7 · Under budget — value discovery rail -->
            <section>
                <div class="sec-head"><h3>Under 100 ₪</h3><span class="sec-sub">Everyday steals</span></div>
                <div class="rail-trans" id="railBudget"></div>
            </section>

            <!-- 8 · More to browse — short grid anchor -->
            <section>
                <div class="sec-head"><h3>More to browse</h3><span class="sec-sub">Fresh off the feed</span></div>
                <div class="feed-grid" id="feedMore"></div>
            </section>
        </div>

        <!-- Search results (shown only while typing). -->
        <div class="feed-grid" id="searchResults" hidden></div>
    </main>
    </div><!-- /.feed-scroll -->

    <!-- Product data layer (shared across the site). -->
    <script src="collections.js"></script>

    <!-- Feed assembly. -->
    <script>
    (function () {
        'use strict';
        var VC = window.veroCollections;
        if (!VC) return;

        var params = new URLSearchParams(location.search);
        var urlMode = params.get('mode');
        if (urlMode === 'art' || urlMode === 'fashion') {
            try { localStorage.setItem('vero_category', urlMode === 'art' ? 'art' : 'clothing'); } catch (e) {}
        }
        var state = {
            mode: ((urlMode === 'art' || urlMode === 'fashion') ? urlMode
                   : (localStorage.getItem('vero_category') === 'art' ? 'art' : 'fashion')),
            gender: params.get('gender') || 'women'
        };

        // ----- Helpers -----------------------------------------------------
        function money(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-US') + ' ₪'; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
        function isArt(p) { return !!(p._raw && (p._raw.type === 'art' || p.collection === 'interiors')); }
        function genderOf(p) { return String((p._raw && (p._raw.gender || p._raw.audience)) || '').toLowerCase(); }

        function hrefOf(p, d) {
            var priceNum = VC.toNum(d && d.onSale ? d.price : (d ? d.original : p.price));
            var payload = JSON.stringify({
                name: p.name, price: priceNum, icon: p.icon, cover: p.cover || '',
                category: p.category || '', seller: p.seller, rating: (p._raw && p._raw.rating) || 4.5,
                type: isArt(p) ? 'art' : 'clothing'
            });
            return 'product-showcase.html?product=' + encodeURIComponent(payload);
        }

        function modeList() {
            var art = (state.mode === 'art');
            return VC.allProducts().filter(function (p) { return art ? isArt(p) : !isArt(p); });
        }
        function byGender(list, gender) {
            if (!gender) return list;
            var g = list.filter(function (p) { return genderOf(p) === gender; });
            return g.length ? g : list;         // demo data carries no gender → fall back
        }

        // ----- Card renderers ---------------------------------------------
        function cvCard(p) {
            var d = VC.discountOf(p._raw);
            var inner = p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '" loading="lazy">'
                                : '<span class="cv-card-emoji">' + esc(p.icon || '🛍️') + '</span>';
            var price = d && d.onSale
                ? '<span class="cv-card-was">' + money(d.original) + '</span>' + money(d.price)
                : money(p.price);
            return '<a class="cv-card' + (d && d.onSale ? ' is-sale' : '') + '" href="' + esc(hrefOf(p, d)) + '" title="' + esc(p.name) + '">' +
                '<div class="cv-card-img">' + inner + '</div>' +
                '<div class="cv-card-row"><span class="cv-card-name">' + esc(p.name) + '</span><span class="cv-card-price">' + price + '</span></div>' +
                '<div class="cv-card-brand">' + esc(p.seller) + '</div></a>';
        }

        function transCard(p) {
            var d = VC.discountOf(p._raw);
            var pct = d && d.onSale ? '<span class="rt-pct">-' + d.percent + '%</span>' : '';
            var inner = p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '" loading="lazy">'
                                : '<span class="rt-emoji">' + esc(p.icon || '🛍️') + '</span>';
            var price = d && d.onSale
                ? '<span class="rt-was">' + money(d.original) + '</span>' + money(d.price)
                : money(p.price);
            return '<a class="rt-card' + (d && d.onSale ? ' is-sale' : '') + '" href="' + esc(hrefOf(p, d)) + '" title="' + esc(p.name) + '">' +
                '<div class="rt-img">' + pct + inner + '</div>' +
                '<div class="rt-cap"><div class="rt-brand">' + esc(p.seller) + '</div>' +
                '<div class="rt-name">' + esc(p.name) + '</div>' +
                '<div class="rt-price">' + price + '</div></div></a>';
        }

        function renderFeature(p) {
            var el = document.getElementById('genderFeature');
            if (!el) return;
            if (!p) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            var d = VC.discountOf(p._raw);
            var pct = d && d.onSale ? '<span class="fc-pct">-' + d.percent + '%</span>' : '';
            var inner = p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '">'
                                : '<span class="fc-emoji">' + esc(p.icon || '🛍️') + '</span>';
            var price = d && d.onSale
                ? '<span class="fc-was">' + money(d.original) + '</span>' + money(d.price)
                : money(p.price);
            el.className = 'feature-card' + (d && d.onSale ? ' is-sale' : '');
            el.setAttribute('href', hrefOf(p, d));
            el.innerHTML =
                '<div class="fc-img">' + pct + inner + '</div>' +
                '<div class="fc-cap">' +
                    '<div class="fc-brand">' + esc(p.seller) + '</div>' +
                    '<div class="fc-name">' + esc(p.name) + '</div>' +
                    '<div class="fc-price">' + price + '</div>' +
                '</div>';
        }

        function fill(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }

        // ----- Section banners (backgrounds swap with Art / Fashion) ------
        var BANNERS = {
            bannerFeature: { fashion: 'clothing-hero.jpg',               art: 'art-hero.jpg' },
            bannerSale:    { fashion: 'assets/hero/sale-clothing.webp',  art: 'assets/hero/sale-art.webp' },
            bannerNew:     { fashion: 'gallery-hero.jpg',                art: 'magazine-hero.jpg' }
        };
        function applyBanners(art) {
            Object.keys(BANNERS).forEach(function (id) {
                var el = document.getElementById(id); if (!el) return;
                var bg = el.querySelector('.fb-bg'); if (!bg) return;
                bg.style.backgroundImage = 'url("' + BANNERS[id][art ? 'art' : 'fashion'] + '")';
            });
        }

        // Pick the featured piece for a gender. Uses real gender data when the
        // catalogue carries it; otherwise shows a distinct piece per gender so
        // the featured item still changes as the category switches.
        function featureFor(gender) {
            var list = modeList();
            if (!list.length) return null;
            var matched = list.filter(function (p) { return genderOf(p) === gender; });
            if (matched.length) return matched[0];
            var order = ['women', 'men', 'unisex', 'kids'];
            var idx = order.indexOf(gender); if (idx < 0) idx = 0;
            return list[idx % list.length];
        }

        // ----- Build the structured feed ----------------------------------
        function buildStructured() {
            var list = modeList();
            applyBanners(state.mode === 'art');

            // Featured single card, by the chosen gender.
            renderFeature(featureFor(state.gender));

            // Autumn Collection rail — up to 10 pieces from the current mode.
            fill('railAutumn', list.length ? list.slice(0, 10).map(transCard).join('') : '<div class="feed-empty">No pieces yet.</div>');

            // Sales rail — up to 10 discounted pieces (mode-filtered), deepest cut first.
            var art = (state.mode === 'art');
            var sale = VC.onSale().filter(function (p) { return art ? isArt(p) : !isArt(p); }).slice(0, 10);
            fill('railSale', sale.length ? sale.map(transCard).join('') : '<div class="feed-empty">Nothing on sale right now.</div>');

            // New arrivals rail — up to 10 most recent (mode-filtered).
            var recent = list.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).slice(0, 10);
            fill('railNew', recent.length ? recent.map(transCard).join('') : '<div class="feed-empty">No new pieces yet.</div>');

            // For you rail — a varied slice, biased to the chosen gender, so it
            // reads as a distinct edit rather than a repeat of Autumn.
            var forYou = byGender(list, state.gender).slice();
            forYou.sort(function (a, b) { return hashStr(a.name) - hashStr(b.name); });   // stable pseudo-shuffle
            forYou = forYou.slice(0, 10);
            fill('railForYou', forYou.length ? forYou.map(transCard).join('') : '<div class="feed-empty">Nothing to show yet.</div>');

            // Under 100 ₪ rail — value discovery, cheapest first.
            var budget = list.filter(function (p) { return VC.toNum(p.price) > 0 && VC.toNum(p.price) <= 100; })
                             .sort(function (a, b) { return VC.toNum(a.price) - VC.toNum(b.price); })
                             .slice(0, 10);
            fill('railBudget', budget.length ? budget.map(transCard).join('') : '<div class="feed-empty">No pieces under 100 ₪ right now.</div>');

            // More to browse — short grid anchor (6 pieces not already up top).
            var more = list.slice(10, 16);
            if (more.length < 6) more = list.slice(Math.max(0, list.length - 6));
            fill('feedMore', more.length ? more.map(cvCard).join('') : '<div class="feed-empty" style="grid-column:1/-1">Nothing more yet.</div>');
        }

        // Tiny stable string hash → lets "For you" shuffle the same way each load
        // instead of reshuffling on every rebuild.
        function hashStr(s) {
            var h = 0, str = String(s || '');
            for (var i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
            return h;
        }

        // ----- Search ------------------------------------------------------
        var input = document.getElementById('feedSearchInput');
        var structured = document.getElementById('feedStructured');
        var results = document.getElementById('searchResults');
        function runSearch(q) {
            q = (q || '').trim().toLowerCase();
            if (!q) { results.hidden = true; structured.style.display = ''; return; }
            var matches = modeList().filter(function (p) {
                return (p.name + ' ' + p.seller + ' ' + (p.category || '')).toLowerCase().indexOf(q) !== -1;
            });
            structured.style.display = 'none';
            results.hidden = false;
            results.innerHTML = matches.length ? matches.map(cvCard).join('')
                : '<div class="feed-empty" style="grid-column:1/-1">No matches for "' + esc(q) + '".</div>';
        }
        if (input) input.addEventListener('input', function () { runSearch(input.value); });

        // Art / Fashion is driven by the header's own built-in toggle (header.js).
        // It stores vero_category and reloads, so the feed reflects the latest
        // choice on load. As a belt-and-braces measure, re-sync if the stored
        // mode changed while the page stayed open (e.g. bfcache restore).
        function currentMode() { return (localStorage.getItem('vero_category') === 'art') ? 'art' : 'fashion'; }
        window.addEventListener('pageshow', function () {
            var m = currentMode();
            if (m !== state.mode) { state.mode = m; buildStructured(); if (input && input.value.trim()) runSearch(input.value); }
        });

        // ----- Gender category sub-header + slider → feature card ----------
        var subnav = document.getElementById('feedSubnav');
        function syncSubnav() {
            if (!subnav) return;
            [].slice.call(subnav.querySelectorAll('.fsn-item')).forEach(function (b) {
                b.classList.toggle('on', b.dataset.gender === state.gender);
            });
        }
        // The gender slider announces its centred gender through this hook.
        window.__onGenderChange = function (gender) {
            if (!gender) return;
            var changed = (gender !== state.gender);
            state.gender = gender;
            syncSubnav();
            if (changed) renderFeature(featureFor(gender));
        };
        // Tapping a category drives the slider (which then updates everything).
        if (subnav) subnav.addEventListener('click', function (e) {
            var b = e.target.closest ? e.target.closest('.fsn-item') : null;
            if (!b) return;
            var g = b.dataset.gender;
            if (typeof window.__gcGoToGender === 'function') window.__gcGoToGender(g);
            else window.__onGenderChange(g);
        });

        // ----- Keep the feed + sub-header clear of the fixed header --------
        var wrap = document.querySelector('.feed-wrap');
        function placeContent() {
            var hdr = document.getElementById('siteHeader');
            if (!hdr || !wrap) return;
            var hb = hdr.getBoundingClientRect().bottom; if (hb < 0) hb = 0;
            if (subnav) subnav.style.top = hb + 'px';
            var sh = subnav ? subnav.offsetHeight : 0;
            wrap.style.paddingTop = (hb + sh + 20) + 'px';
            // Open the second header (gender sub-nav) only after we cross the hero.
            if (subnav) subnav.classList.toggle('is-hero', !window.veroHeroPassed());
        }
        var raf; function schedulePlace() { cancelAnimationFrame(raf); raf = requestAnimationFrame(placeContent); }
        window.addEventListener('scroll', schedulePlace, { passive: true });
        window.addEventListener('resize', schedulePlace);
        if (window.ResizeObserver) { var he = document.getElementById('siteHeader'); if (he) { try { new ResizeObserver(schedulePlace).observe(he); } catch (e) {} } }
        var tries = 0; (function settle() { placeContent(); if (++tries < 40) setTimeout(settle, 100); })();

        syncSubnav();
        buildStructured();
    })();
    </script>

    <!-- Gender coverflow carousel (ported 1:1 from the old home feed). -->
    <script>
    (function () {
        var root = document.getElementById('genderCover');
        if (!root) return;
        var frame = root.querySelector('.gc-frame');
        var cards = [].slice.call(root.querySelectorAll('.gc-card'));
        var count = cards.length;
        if (!count) return;
        var sub = root.querySelector('.gc-sub');
        var nameEl = root.querySelector('.gc-cap .gc-name');
        var shopEl = root.querySelector('.gc-cap .gc-shop');
        var dotsWrap = root.querySelector('.gc-dots');

        var DEPTH = 0.6, FALLOFF = 0.56, FADE = 0.1, GAP = 0.08, ROTATE = 44, LOOP = true;
        var pos = 0, target = 0, width = 0, rafId = null, selected = 0, drag = null;

        dotsWrap.innerHTML = cards.map(function (c, i) {
            return '<button type="button" class="' + (i ? '' : 'on') + '" aria-label="Go to ' + (c.getAttribute('data-name') || ('slide ' + (i + 1))) + '"></button>';
        }).join('');
        var dots = [].slice.call(dotsWrap.querySelectorAll('button'));

        function indexAt(p) { return ((Math.round(p) % count) + count) % count; }
        function sign(n) { return n < 0 ? -1 : (n > 0 ? 1 : 0); }

        function paint() {
            if (!width) return;
            var pitch = width * (1 + GAP);
            for (var i = 0; i < count; i++) {
                var card = cards[i], offset = i - pos;
                if (LOOP) { offset = ((offset % count) + count) % count; if (offset > count / 2) offset -= count; }
                var dist = Math.abs(offset), ramp = Math.pow(dist, FALLOFF);
                var tilt = Math.min(ROTATE * ramp, 82) * sign(offset);
                card.style.transform = 'translateX(calc(-50% + ' + (offset * pitch) + 'px)) translateZ(' + (-DEPTH * width * ramp) + 'px) rotateY(' + (-tilt) + 'deg)';
                var edge = LOOP ? Math.min(1, Math.max(0, count / 2 - dist)) : 1;
                card.style.opacity = String(Math.max(0, 1 - FADE * dist) * edge);
                card.style.zIndex = String(100 - Math.round(dist));
            }
        }
        function render() {
            var a = indexAt(target); selected = a;
            dots.forEach(function (d, i) { d.classList.toggle('on', i === a); });
            var card = cards[a];
            var nm = card.getAttribute('data-name') || '';
            if (sub) sub.textContent = card.getAttribute('data-sub') || nm;
            if (nameEl) nameEl.textContent = nm;
            if (shopEl) shopEl.textContent = 'Shop ' + nm;
            if (typeof window.__onGenderChange === 'function') window.__onGenderChange(card.getAttribute('data-gender') || '');
            cards.forEach(function (c, i) {
                var v = c.querySelector('video'); if (!v) return;
                v.muted = true; v.defaultMuted = true;
                if (i === a) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else { try { v.pause(); } catch (x) {} }
            });
        }
        function clampPos(p) { return LOOP ? p : Math.max(0, Math.min(count - 1, p)); }
        function settle(t) {
            if (rafId !== null) cancelAnimationFrame(rafId);
            target = t; render();
            function step() {
                var remaining = target - pos;
                if (Math.abs(remaining) < 0.0004) { pos = target; paint(); rafId = null; return; }
                pos += remaining * 0.16; paint(); rafId = requestAnimationFrame(step);
            }
            rafId = requestAnimationFrame(step);
        }
        function goTo(index) { var t = LOOP ? index + Math.round((target - index) / count) * count : index; settle(clampPos(t)); }
        function nudge(by) { settle(clampPos(Math.round(target) + by)); }

        // Let the gender sub-header drive the slider to a given gender.
        window.__gcGoToGender = function (gender) {
            for (var i = 0; i < count; i++) {
                if (cards[i].getAttribute('data-gender') === gender) { goTo(i); return; }
            }
        };

        frame.addEventListener('pointerdown', function (e) {
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
            try { frame.setPointerCapture(e.pointerId); } catch (x) {}
            target = pos; drag = { id: e.pointerId, x: e.clientX, pos: pos, v: 0, t: performance.now(), moved: false };
        });
        frame.addEventListener('pointermove', function (e) {
            if (!drag || drag.id !== e.pointerId) return;
            var pitch = width * (1 + GAP); if (!pitch) return;
            var now = performance.now(), prev = pos;
            pos = clampPos(drag.pos - (e.clientX - drag.x) / pitch);
            if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
            drag.v = ((pos - prev) / Math.max(now - drag.t, 1)) * 1000; drag.t = now;
            var idx = indexAt(pos); if (idx !== selected) { selected = idx; render(); }
            paint();
        });
        function endDrag(e) {
            if (!drag || drag.id !== e.pointerId) return;
            var startIdx = Math.round(drag.pos), moved = pos - drag.pos;
            var dir = moved > 0 ? 1 : (moved < 0 ? -1 : 0), dest = startIdx;
            if (Math.abs(moved) > 0.12 || (Math.abs(drag.v) > 0.5 && Math.abs(moved) > 0.03)) dest = startIdx + dir;
            dest = Math.max(startIdx - 1, Math.min(startIdx + 1, dest));
            frame.__moved = drag.moved; drag = null; settle(clampPos(dest));
        }
        frame.addEventListener('pointerup', endDrag);
        frame.addEventListener('pointercancel', endDrag);
        cards.forEach(function (card, i) {
            card.addEventListener('click', function () {
                if (frame.__moved) { frame.__moved = false; return; }
                goTo(i);          // selecting a card just centres it (updates the feature card)
            });
        });
        frame.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(1); }
        });
        if (shopEl) shopEl.addEventListener('click', function () {
            var el = document.getElementById('genderFeature'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        dots.forEach(function (d, i) { d.addEventListener('click', function () { goTo(i); }); });

        function measure() { width = cards[0] ? cards[0].offsetWidth : 0; paint(); }
        if (window.ResizeObserver) { try { new ResizeObserver(measure).observe(frame); } catch (x) {} }
        window.addEventListener('resize', measure);

        function init() { measure(); render(); paint(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
    </script>
