<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — My Expenses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        /* Entry: the image holds static on the left while the content slides in
           from the left — nothing covers the image on load. */
        .page-cover { display: none; }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            /* The data slides in from the left, out from behind the static image. */
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }

        /* Image on the left, at one-rectangle width, matching My Profile. */
        .side-image {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 20vw;
            background: #2a2a28 url('assets/expenses-hero.jpg') center / cover no-repeat;
            filter: grayscale(1);
            border-right: 1px solid #000;
            /* Sits above the content so the data slides out from behind it. */
            z-index: 5;
        }
        @media (min-width: 1001px) { .wrap { padding-left: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 15px; color: #6b6b66; letter-spacing: 0.5px; }

        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            margin-top: 52px;
        }

        /* Thin black framed cards — same language as the rectangles. */
        .card { border: 1px solid #000; padding: 34px; }
        .card-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; margin-bottom: 8px; }

        /* Big total figure. */
        .total-num { font-size: 60px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
        .total-sub { margin-top: 6px; font-size: 12px; letter-spacing: 1px; color: #9a9a95; }

        .field { margin-bottom: 22px; }
        .field:last-child { margin-bottom: 0; }
        .field-val { font-size: 18px; font-weight: 400; }

        .divider { height: 1px; background: #eee; margin: 26px 0; }
        .col-right { display: flex; flex-direction: column; }

        /* Purchases list — horizontal slider, three rows per slide. */
        .exp-list { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .exp-list::-webkit-scrollbar { height: 4px; }
        .exp-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 999px; }
        .exp-slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; flex-direction: column; }
        .exp-dots { display: flex; justify-content: center; gap: 7px; margin-top: 14px; }
        .exp-dots .d { width: 7px; height: 7px; border-radius: 50%; background: #ddd; border: none; cursor: pointer; padding: 0; transition: background 0.2s; }
        .exp-dots .d.on { background: #111; }
        .exp-row {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 0; border-bottom: 1px solid #eee;
        }
        .exp-row:last-child { border-bottom: none; }
        .exp-emoji {
            width: 46px; height: 46px; flex: 0 0 auto;
            border: 1px solid #000; display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .exp-name { font-size: 15px; font-weight: 500; }
        .exp-seller { font-size: 12px; color: #9a9a95; letter-spacing: 0.5px; margin-top: 2px; }
        .exp-price { margin-left: auto; font-size: 17px; font-weight: 400; white-space: nowrap; }
        .exp-empty { font-size: 14px; color: #9a9a95; padding: 8px 0; }

        /* The three boxes below the cart double as the spend-graph mode switch. */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
        .stat {
            border: 1px solid #000; padding: 30px 24px; background: #fff; color: #1c1c1c;
            font-family: inherit; text-align: left; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .stat.mode:hover { background: #f4f4f2; }
        .stat.mode.on { background: #1c1c1c; color: #fff; }
        .stat-num { font-size: 40px; font-weight: 200; line-height: 1; }
        .stat-name { margin-top: 12px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

        /* Period spend slider (left card): This week / month / year. */
        .spend-slider { overflow: hidden; }
        .spend-track { display: flex; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
        .spend-slide { flex: 0 0 100%; }
        .spend-nav { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
        .spend-arrow {
            width: 34px; height: 34px; border: 1.4px solid #000; border-radius: 999px; background: #fff;
            cursor: pointer; font-size: 15px; line-height: 1; color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .spend-arrow:hover { background: #000; color: #fff; }
        .spend-dots { display: flex; gap: 7px; margin-left: 4px; }
        .spend-dots .d { width: 7px; height: 7px; border-radius: 50%; background: #ddd; border: none; cursor: pointer; padding: 0; transition: background 0.2s; }
        .spend-dots .d.on { background: #111; }

        /* Prev/next arrows on the cart list header. */
        .exp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .exp-arrows { display: flex; gap: 8px; }
        .exp-arrow {
            width: 30px; height: 30px; border: 1.4px solid #000; border-radius: 999px; background: #fff;
            cursor: pointer; font-size: 14px; line-height: 1; color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .exp-arrow:hover { background: #000; color: #fff; }
        .exp-arrow:disabled { opacity: 0.3; cursor: default; background: #fff; color: #1c1c1c; }

        /* ===== Sections below the summary — same framed-card language ===== */
        .section { margin-top: 24px; }
        .section-head {
            display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
        }
        .section-note { font-size: 12px; letter-spacing: 0.5px; color: #9a9a95; }

        /* Monthly spend bar chart. */
        .chart {
            display: flex; align-items: flex-end; gap: clamp(10px, 2vw, 28px);
            height: 220px; margin-top: 30px;
        }
        .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .bar-val { font-size: 12px; color: #6b6b66; margin-bottom: 8px; white-space: nowrap; }
        .bar {
            width: 100%; max-width: 60px; background: #d9d9d4; min-height: 2px;
            transition: height 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .bar.current { background: #1c1c1c; }
        .bar-label { margin-top: 12px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a9a95; }
        .bar-col.current .bar-label { color: #1c1c1c; font-weight: 500; }

        /* Preference charts — horizontal bars for styles + brands. */
        .pref-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; margin-top: 26px; }
        @media (max-width: 780px) { .pref-charts { grid-template-columns: 1fr; gap: 30px; } }
        .pref-chart-title { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #1c1c1c; font-weight: 500; margin-bottom: 18px; }
        .hbar { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 12px; margin-bottom: 14px; }
        .hbar:last-child { margin-bottom: 0; }
        .hbar-label { font-size: 13px; color: #6b6b66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hbar-track { height: 10px; background: #f0f0ee; position: relative; }
        .hbar-fill { height: 100%; background: #1c1c1c; width: 0; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
        .hbar-val { font-size: 12px; color: #9a9a95; white-space: nowrap; }

        /* Followed sellers list. */
        .seller-list { display: flex; flex-direction: column; margin-top: 8px; }
        .seller-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid #eee; }
        .seller-row:last-child { border-bottom: none; }
        .seller-avatar {
            width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%;
            border: 1px solid #000; display: flex; align-items: center; justify-content: center;
            font-size: 16px; text-transform: uppercase; font-weight: 300;
        }
        .seller-body { min-width: 0; flex: 1; }
        .seller-name { font-size: 15px; font-weight: 500; }
        .seller-meta { font-size: 12px; color: #9a9a95; letter-spacing: 0.3px; margin-top: 2px; }
        .seller-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .s-btn {
            border: 1px solid #000; background: #fff; cursor: pointer; font-family: inherit;
            border-radius: 999px; padding: 7px 14px; font-size: 11px; letter-spacing: 1px;
            color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .s-btn:hover { background: #000; color: #fff; }
        .s-btn.on { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }
        .seller-empty { font-size: 14px; color: #9a9a95; padding: 8px 0; }

        @media (max-width: 780px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back" href="buyer-area.html">&#8592; חזרה</a>

    <div class="wrap">
        <h1 class="head-title">My Expenses</h1>
        <p class="head-sub">A summary of your purchases and spending.</p>

        <div class="grid">
            <!-- Left: spend summary — a week / month / year slider -->
            <div class="card">
                <div class="spend-slider">
                    <div class="spend-track" id="spendTrack"></div>
                </div>
                <div class="spend-nav">
                    <button class="spend-arrow" id="spendPrev" aria-label="Previous">&#8249;</button>
                    <button class="spend-arrow" id="spendNext" aria-label="Next">&#8250;</button>
                    <div class="spend-dots" id="spendDots"></div>
                </div>

                <div class="divider"></div>

                <div class="field">
                    <div class="card-label">Items in cart</div>
                    <div class="field-val" id="itemCount">0</div>
                </div>
                <div class="field">
                    <div class="card-label">Average price</div>
                    <div class="field-val" id="avgPrice">₪0</div>
                </div>
                <div class="field">
                    <div class="card-label">Sellers</div>
                    <div class="field-val" id="sellerCount">0</div>
                </div>
            </div>

            <!-- Right: item breakdown + graph-mode switch -->
            <div class="col-right">
                <div class="card">
                    <div class="exp-head">
                        <div class="card-label" style="margin:0;">In your cart</div>
                        <div class="exp-arrows">
                            <button class="exp-arrow" id="expPrev" aria-label="Previous">&#8249;</button>
                            <button class="exp-arrow" id="expNext" aria-label="Next">&#8250;</button>
                        </div>
                    </div>
                    <div class="exp-list" id="expList"></div>
                </div>

                <!-- These three boxes switch the spend graph below. -->
                <div class="stats" id="modeSel">
                    <button class="stat mode" data-mode="weekly" type="button">
                        <div class="stat-num" id="mode-weekly">₪0</div>
                        <div class="stat-name">Weekly</div>
                    </button>
                    <button class="stat mode" data-mode="monthly" type="button">
                        <div class="stat-num" id="mode-monthly">₪0</div>
                        <div class="stat-name">Monthly</div>
                    </button>
                    <button class="stat mode" data-mode="yearly" type="button">
                        <div class="stat-num" id="mode-yearly">₪0</div>
                        <div class="stat-name">Yearly</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Monthly Spend Tracker -->
        <div class="section">
            <div class="card">
                <div class="section-head">
                    <div class="card-label" style="margin:0;">Monthly spend tracker</div>
                    <div class="section-note" id="monthNote">This month vs. previous months</div>
                </div>
                <div class="chart" id="chart"></div>
            </div>
        </div>

        <div class="section">
            <!-- Preferences — where your spend goes, by style and by brand -->
            <div class="card">
                <div class="section-head">
                    <div class="card-label" style="margin:0;">Your preferences</div>
                    <div class="section-note">Where your spend goes</div>
                </div>
                <div class="pref-charts">
                    <div class="pref-chart">
                        <div class="pref-chart-title">By style</div>
                        <div id="styleChart"></div>
                    </div>
                    <div class="pref-chart">
                        <div class="pref-chart-title">By brand</div>
                        <div id="brandChart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        let cart     = readJSON('vero_cart', []);
        const offers = readJSON('vero_offers', []);
        const offs   = Array.isArray(offers) ? offers : [];

        let items = Array.isArray(cart) ? cart : [];
        const nis = n => '₪' + Math.round(n).toLocaleString('en-US');
        const priceOf = it => (parseFloat(it.price) || 0) * (it.qty || 1);
        const tsOf    = it => it.addedAt || it.at || Date.now();

        // Seed a spread of clothing items so the cart + graphs always demonstrate
        // (only when the cart is genuinely empty — a real cart is never touched).
        if (!items.length) {
            const now = Date.now(), DAY = 864e5;
            items = [
                { name: 'Wool coat',      seller: 'Studio Noir',   icon: '🧥', price: 269, qty: 1, addedAt: now - 1 * DAY },
                { name: 'Raw denim',      seller: 'Studio Noir',   icon: '👖', price: 129, qty: 1, addedAt: now - 3 * DAY },
                { name: 'Ribbed sweater', seller: 'Knit & Co',     icon: '🧶', price: 95,  qty: 1, addedAt: now - 5 * DAY },
                { name: 'Silk shirt',     seller: 'Atelier V',     icon: '👔', price: 150, qty: 1, addedAt: now - 20 * DAY },
                { name: 'Leather boots',  seller: 'Sole Society',  icon: '🥾', price: 340, qty: 1, addedAt: now - 44 * DAY },
                { name: 'Denim jacket',   seller: 'Vintage Vault', icon: '🧥', price: 210, qty: 1, addedAt: now - 120 * DAY },
                { name: 'Linen trousers', seller: 'Studio Noir',   icon: '👖', price: 160, qty: 1, addedAt: now - 250 * DAY },
            ];
            localStorage.setItem('vero_cart', JSON.stringify(items));
        }

        // Period boundaries (Sunday-start week).
        const startOfWeek  = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); };
        const startOfMonth = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
        const startOfYear  = () => { const d = new Date(); return new Date(d.getFullYear(), 0, 1).getTime(); };
        const sumSince = ts => items.filter(it => tsOf(it) >= ts).reduce((s, it) => s + priceOf(it), 0);
        const cntSince = ts => items.filter(it => tsOf(it) >= ts).reduce((s, it) => s + (it.qty || 1), 0);

        const total   = items.reduce((s, it) => s + priceOf(it), 0);
        const count   = items.reduce((s, it) => s + (it.qty || 1), 0);
        const sellers = new Set(items.map(it => it.seller).filter(Boolean)).size;
        const avg     = count ? total / count : 0;

        document.getElementById('itemCount').textContent   = count;
        document.getElementById('avgPrice').textContent    = nis(avg);
        document.getElementById('sellerCount').textContent = sellers;

        // ===== Left card: This week / month / year spend slider =====
        const periods = [
            { label: 'This week',  ts: startOfWeek() },
            { label: 'This month', ts: startOfMonth() },
            { label: 'This year',  ts: startOfYear() },
        ];
        (function spendSlider() {
            const track = document.getElementById('spendTrack');
            track.innerHTML = periods.map(p => {
                const sum = sumSince(p.ts), c = cntSince(p.ts);
                return `<div class="spend-slide">
                    <div class="card-label">${p.label}</div>
                    <div class="total-num">${nis(sum)}</div>
                    <div class="total-sub">across ${c} item${c === 1 ? '' : 's'}</div>
                </div>`;
            }).join('');
            const dots = document.getElementById('spendDots');
            dots.innerHTML = periods.map((_, i) => `<button class="d${i === 0 ? ' on' : ''}" aria-label="${periods[i].label}"></button>`).join('');
            const dotEls = [...dots.children];
            let idx = 0;
            function go(n) {
                idx = (n + periods.length) % periods.length;
                track.style.transform = `translateX(-${idx * 100}%)`;
                dotEls.forEach((d, j) => d.classList.toggle('on', j === idx));
            }
            document.getElementById('spendPrev').addEventListener('click', () => go(idx - 1));
            document.getElementById('spendNext').addEventListener('click', () => go(idx + 1));
            dotEls.forEach((d, i) => d.addEventListener('click', () => go(i)));
            go(0);   // start on This week
        })();

        // ===== Cart list — three per slide, prev/next arrows + dots =====
        const list = document.getElementById('expList');
        const prevBtn = document.getElementById('expPrev');
        const nextBtn = document.getElementById('expNext');
        if (!items.length) {
            list.innerHTML = '<div class="exp-empty">No purchases yet — items you add to your cart appear here.</div>';
            prevBtn.style.display = nextBtn.style.display = 'none';
        } else {
            const rowHTML = it => `
                <div class="exp-row">
                    <div class="exp-emoji">${it.icon || '🛍️'}</div>
                    <div>
                        <div class="exp-name">${it.name || 'Item'}${it.qty > 1 ? ` ×${it.qty}` : ''}</div>
                        <div class="exp-seller">${it.seller || 'VERO'}</div>
                    </div>
                    <div class="exp-price">${nis(priceOf(it))}</div>
                </div>`;
            const slides = [];
            for (let i = 0; i < items.length; i += 3) slides.push(items.slice(i, i + 3));
            list.innerHTML = slides.map(group => `<div class="exp-slide">${group.map(rowHTML).join('')}</div>`).join('');

            const dots = document.createElement('div');
            dots.className = 'exp-dots';
            dots.innerHTML = slides.map((_, i) => `<button class="d${i === 0 ? ' on' : ''}" aria-label="Slide ${i + 1}"></button>`).join('');
            list.after(dots);
            const dotEls = [...dots.children];
            let cur = 0;
            function sync() {
                prevBtn.disabled = cur === 0;
                nextBtn.disabled = cur === slides.length - 1;
                dotEls.forEach((d, j) => d.classList.toggle('on', j === cur));
            }
            function goCart(i) { cur = Math.max(0, Math.min(slides.length - 1, i)); list.scrollTo({ left: list.clientWidth * cur, behavior: 'smooth' }); sync(); }
            prevBtn.addEventListener('click', () => goCart(cur - 1));
            nextBtn.addEventListener('click', () => goCart(cur + 1));
            dotEls.forEach((d, i) => d.addEventListener('click', () => goCart(i)));
            list.addEventListener('scroll', () => { cur = Math.round(list.scrollLeft / list.clientWidth); sync(); });
            sync();
        }

        // ===== Spend graph — three modes, switched by the boxes above =====
        document.getElementById('mode-weekly').textContent  = nis(sumSince(startOfWeek()));
        document.getElementById('mode-monthly').textContent = nis(sumSince(startOfMonth()));
        document.getElementById('mode-yearly').textContent  = nis(sumSince(startOfYear()));

        let chartMode = 'monthly';
        function buckets(mode) {
            const arr = []; const now = new Date();
            if (mode === 'weekly') {
                const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() - base.getDay());
                for (let i = 7; i >= 0; i--) {
                    const s = new Date(base); s.setDate(base.getDate() - i * 7); const st = s.getTime();
                    arr.push({ start: st, end: st + 7 * 864e5, label: s.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), total: 0 });
                }
            } else if (mode === 'monthly') {
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    arr.push({ start: d.getTime(), end: new Date(now.getFullYear(), now.getMonth() - i + 1, 1).getTime(), label: d.toLocaleDateString('en-GB', { month: 'short' }), total: 0 });
                }
            } else {
                for (let i = 4; i >= 0; i--) {
                    const y = now.getFullYear() - i;
                    arr.push({ start: new Date(y, 0, 1).getTime(), end: new Date(y + 1, 0, 1).getTime(), label: String(y), total: 0 });
                }
            }
            items.forEach(it => { const t = tsOf(it); const b = arr.find(x => t >= x.start && t < x.end); if (b) b.total += priceOf(it); });
            return arr;
        }
        function renderChart() {
            const data = buckets(chartMode);
            const max = Math.max(1, ...data.map(b => b.total));
            const chart = document.getElementById('chart');
            chart.innerHTML = data.map((b, i) => {
                const isCurrent = i === data.length - 1;
                const h = Math.round((b.total / max) * 100);
                return `<div class="bar-col${isCurrent ? ' current' : ''}">
                    <div class="bar-val">${b.total ? nis(b.total) : ''}</div>
                    <div class="bar${isCurrent ? ' current' : ''}" data-h="${h}" style="height:0"></div>
                    <div class="bar-label">${b.label}</div>
                </div>`;
            }).join('');
            requestAnimationFrame(() => requestAnimationFrame(() => {
                chart.querySelectorAll('.bar').forEach(b => { b.style.height = (b.dataset.h || 0) + '%'; });
            }));
            const noteMap = { weekly: 'Last 8 weeks', monthly: 'Last 6 months', yearly: 'Last 5 years' };
            document.getElementById('monthNote').textContent = noteMap[chartMode];
            document.querySelectorAll('#modeSel .mode').forEach(m => m.classList.toggle('on', m.dataset.mode === chartMode));
        }
        document.getElementById('modeSel').addEventListener('click', e => {
            const b = e.target.closest('.mode'); if (!b) return;
            chartMode = b.dataset.mode; renderChart();
        });
        renderChart();

        // ===== Preference charts — spend broken down by style and by brand =====
        (function preferenceCharts() {
            function agg(keyFn) {
                const m = new Map();
                items.forEach(it => { const k = (keyFn(it) || 'Other'); m.set(k, (m.get(k) || 0) + priceOf(it)); });
                return [...m.entries()].sort((a, b) => b[1] - a[1]);
            }
            function draw(elId, data) {
                const el = document.getElementById(elId); if (!el) return;
                if (!data.length) { el.innerHTML = '<div class="seller-empty">Nothing to show yet.</div>'; return; }
                const max = Math.max(1, ...data.map(d => d[1]));
                el.innerHTML = data.map(([label, val]) => `
                    <div class="hbar">
                        <div class="hbar-label" title="${label}">${label}</div>
                        <div class="hbar-track"><div class="hbar-fill" data-w="${Math.round(val / max * 100)}"></div></div>
                        <div class="hbar-val">${nis(val)}</div>
                    </div>`).join('');
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.querySelectorAll('.hbar-fill').forEach(b => { b.style.width = (b.dataset.w || 0) + '%'; });
                }));
            }
            // "Style" ≈ the item category; "brand" ≈ the seller. Top six each.
            draw('styleChart', agg(it => it.category).slice(0, 6));
            draw('brandChart', agg(it => it.seller).slice(0, 6));
        })();

        // Exit mirrors the entry: the image holds static while the data slides
        // back out to the left, then the personal area loads.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.55s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            wrap.style.opacity = '0';
            wrap.style.transform = 'translateX(-18vw)';
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
