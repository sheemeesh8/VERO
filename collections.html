<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — קולקציות</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { background: #000; color: #fff; -webkit-font-smoothing: antialiased; overflow: hidden; }

        /* ===== Full-screen horizontal slider ===== */
        .col-slider {
            direction: ltr;                 /* predictable L→R scroll; slide text stays RTL */
            display: flex;
            height: 100dvh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .col-slider::-webkit-scrollbar { display: none; }

        .col-slide {
            position: relative;
            flex: 0 0 100vw;
            width: 100vw;
            height: 100dvh;
            scroll-snap-align: start;
            overflow: hidden;
            display: block; text-decoration: none; color: #fff;
        }
        .col-slide .bg {
            position: absolute; inset: 0;
            background: #17170f center / cover no-repeat;
            transform: scale(1.06);
            transition: transform 6s ease-out;
        }
        /* Slow Ken-Burns drift on the slide currently in view. */
        .col-slide.is-active .bg { transform: scale(1.15); }
        .col-slide::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.20) 55%, rgba(0,0,0,0.42) 100%);
        }

        /* Slide content — centred, RTL text. */
        .col-body {
            position: absolute; inset: auto 0 0 0; z-index: 2; direction: rtl;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 0 24px clamp(96px, 16vh, 150px);
            opacity: 0; transform: translateY(26px);
            transition: opacity 0.8s ease, transform 0.9s cubic-bezier(0.16,1,0.3,1);
        }
        .col-slide.is-active .col-body { opacity: 1; transform: translateY(0); }
        .col-kicker { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.75); font-weight: 700; margin-bottom: 14px; }
        .season-emoji { font-size: clamp(40px, 8vw, 64px); line-height: 1; }
        .season-name { font-size: clamp(44px, 12vw, 96px); font-weight: 800; letter-spacing: -2px; margin-top: 6px; line-height: 1; }
        .season-months { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; margin-top: 16px; font-weight: 600; }
        .season-count { font-size: 12px; letter-spacing: 1px; font-weight: 600; opacity: 0.85; margin-top: 6px; }
        .chips { margin-top: 18px; display: flex; gap: 8px; }
        .chip-now, .chip-sale {
            display: inline-block; padding: 7px 16px; border-radius: 999px;
            font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
        }
        .chip-now { background: #fff; color: #111; }
        .chip-sale { background: #EB2323; color: #fff; }
        .chip-soon { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.55); }
        .col-cta {
            margin-top: 30px; display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 34px; border: 1.5px solid #fff; border-radius: 999px;
            color: #fff; text-decoration: none; background: transparent;
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
            transition: background 0.3s ease, color 0.3s ease, gap 0.3s ease;
        }
        .col-cta:hover { background: #fff; color: #111; gap: 16px; }

        /* ===== Controls: counter, dots, arrows ===== */
        .col-counter {
            position: fixed; z-index: 6; top: clamp(96px, 14vh, 130px); left: 50%; transform: translateX(-50%);
            direction: ltr; font-size: 12px; letter-spacing: 3px; font-weight: 700; color: rgba(255,255,255,0.85);
            display: flex; align-items: center; gap: 10px; pointer-events: none;
        }
        .col-counter .cc-line { width: 34px; height: 1px; background: rgba(255,255,255,0.4); }
        .col-counter .cc-total { opacity: 0.55; }

        .col-dots {
            position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
            display: flex; gap: 12px;
        }
        .col-dot {
            width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
            background: rgba(255,255,255,0.4); transition: transform 0.3s ease, background 0.3s ease;
        }
        .col-dot.on { background: #fff; transform: scale(1.5); }

        .col-arrow {
            position: fixed; z-index: 6; top: 50%; transform: translateY(-50%);
            width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
            background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.35); color: #fff;
            display: flex; align-items: center; justify-content: center;
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .col-arrow:hover { background: rgba(0,0,0,0.5); }
        .col-arrow svg { width: 22px; height: 22px; }
        .col-arrow.prev { right: clamp(14px, 3vw, 34px); }   /* RTL: "previous" points right */
        .col-arrow.next { left: clamp(14px, 3vw, 34px); }
        @media (max-width: 720px) { .col-arrow { display: none; } }  /* swipe on touch */
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
</head>
<body>
    <div id="siteHeader"></div>
    <script src="header.js"></script>

    <div class="col-slider" id="colSlider"></div>

    <div class="col-counter" id="colCounter" hidden>
        <span class="cc-idx" id="ccIdx">01</span>
        <span class="cc-line"></span>
        <span class="cc-total" id="ccTotal">01</span>
    </div>

    <button class="col-arrow prev" id="colPrev" aria-label="הקודם">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="col-arrow next" id="colNext" aria-label="הבא">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="col-dots" id="colDots"></div>

    <script src="product-overrides.js"></script>
    <script src="collections.js"></script>
    <script>
        (function () {
            var VC = window.veroCollections;
            var curr = VC.currentKey();
            var sale = VC.saleKey();
            // Only the collections that matter right now: the one in season, and the
            // one that just ended and is on end-of-season sale. Upcoming seasons are
            // hidden. The in-season collection comes first, so you land on it.
            var list = [];
            var seen = {};
            [curr, sale].forEach(function (k) {
                var c = VC.get(k);
                if (c && !seen[k]) { seen[k] = 1; list.push(c); }
            });
            var slider = document.getElementById('colSlider');
            var dotsWrap = document.getElementById('colDots');
            var counter = document.getElementById('colCounter');
            var ccIdx = document.getElementById('ccIdx');
            var ccTotal = document.getElementById('ccTotal');

            var monthName = ['','ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];

            slider.innerHTML = list.map(function (c) {
                var count = VC.byCollection(c.key).length;
                var months = c.months.map(function (m) { return monthName[m]; }).join(' · ');
                return '<a class="col-slide" href="collection.html?c=' + c.key + '">' +
                        '<div class="bg" style="background-image:url(\'' + c.hero + '\')"></div>' +
                        '<div class="col-body">' +
                            '<div class="col-kicker">moravchick · קולקציה</div>' +
                            '<div class="season-emoji">' + c.emoji + '</div>' +
                            '<div class="season-name">' + c.he + '</div>' +
                            '<div class="season-months">' + months + '</div>' +
                            '<div class="season-count">' + count + ' פריטים</div>' +
                            '<div class="chips">' +
                                (c.key === curr ? '<span class="chip-now">בעונה עכשיו</span>' : '') +
                                (c.key === sale ? '<span class="chip-sale">סוף עונה · ' + c.eos + '%-</span>' : '') +
                                (c.key !== curr && c.key !== sale ? '<span class="chip-soon">בקרוב</span>' : '') +
                            '</div>' +
                            '<span class="col-cta">צפו בקולקציה</span>' +
                        '</div>' +
                    '</a>';
            }).join('');

            var slides = Array.prototype.slice.call(slider.querySelectorAll('.col-slide'));
            var n = slides.length;
            if (!n) return;

            // Dots
            dotsWrap.innerHTML = slides.map(function (_, i) {
                return '<button class="col-dot" data-i="' + i + '" aria-label="קולקציה ' + (i + 1) + '"></button>';
            }).join('');
            var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('.col-dot'));

            counter.hidden = false;
            ccTotal.textContent = ('0' + n).slice(-2);

            var active = -1;
            function pad(i) { return ('0' + (i + 1)).slice(-2); }
            function setActive(i) {
                if (i === active) return;
                active = i;
                slides.forEach(function (s, k) { s.classList.toggle('is-active', k === i); });
                dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
                ccIdx.textContent = pad(i);
            }
            // Which slide is centred in the viewport right now.
            function currentIndex() {
                return Math.round(slider.scrollLeft / slider.clientWidth);
            }
            function goTo(i) {
                i = Math.max(0, Math.min(n - 1, i));
                slider.scrollTo({ left: i * slider.clientWidth, behavior: 'smooth' });
            }

            var raf = null;
            slider.addEventListener('scroll', function () {
                if (raf) return;
                raf = requestAnimationFrame(function () { raf = null; setActive(currentIndex()); });
            });
            dots.forEach(function (d) { d.addEventListener('click', function () { goTo(+d.dataset.i); }); });

            // Arrows — RTL: "prev" moves toward the first slide.
            document.getElementById('colPrev').addEventListener('click', function () { goTo(currentIndex() - 1); });
            document.getElementById('colNext').addEventListener('click', function () { goTo(currentIndex() + 1); });

            // Keyboard: arrow keys page through (respecting RTL direction).
            window.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowRight') goTo(currentIndex() - 1);
                else if (e.key === 'ArrowLeft') goTo(currentIndex() + 1);
            });

            // A card is a link; only navigate on a genuine tap, not after a swipe.
            slides.forEach(function (s) {
                var sx = 0, sy = 0, moved = false;
                s.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; moved = false; });
                s.addEventListener('pointermove', function (e) {
                    if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true;
                });
                s.addEventListener('click', function (e) { if (moved) e.preventDefault(); });
            });

            setActive(0);
            window.addEventListener('resize', function () { goTo(active); });
        })();
    </script>
</body>
</html>
