<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Only Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: #8a877f; font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: #8a877f; line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 650px; border-radius: 28px; overflow: hidden; position: relative; background: #111; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 845px; transform: scale(0.7692); transform-origin: top left; position: relative; overflow: hidden; color: #fff; }
.img { position: absolute; inset: 0; background: url('../hero-beach.jpg') center / cover no-repeat; }
.wash { position: absolute; inset: 0; }
.bar { position: absolute; top: 34px; left: 28px; right: 28px; z-index: 3; display: flex; align-items: center; justify-content: space-between; }
.bar .t { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.9; }
.bar svg { width: 21px; height: 21px; stroke: #fff; fill: none; stroke-width: 1.3; }
.center { position: absolute; left: 28px; right: 28px; top: 50%; transform: translateY(-50%); z-index: 2; text-align: center; }
.avimg { display: block; background: url('../women-hero.jpg') 50% 24% / cover no-repeat; }
.av { display: block; margin: 0 auto 22px; overflow: hidden; }
.av .avimg { width: 100%; height: 100%; }
.v { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--v); color: #fff; font-size: 10px; font-weight: 700; vertical-align: middle; }
.kick { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.85; }
.nm { font-size: 30px; margin-top: 6px; }
.bio { font-size: 12.5px; opacity: 0.82; margin-top: 7px; letter-spacing: 0.3px; }
.data { display: flex; justify-content: center; gap: 30px; margin-top: 24px; }
.data .d b { display: block; font-size: 18px; } .data .d span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.65; margin-top: 2px; }
.swipe { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 2; text-align: center; font-size: 8.5px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.75; }
.swipe i { display: block; width: 1px; height: 22px; background: rgba(255,255,255,0.5); margin: 10px auto 0; }

/* 1 — circle, soft wash */
.h1 .wash { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.1) 42%, rgba(0,0,0,0.72)); }
.h1 .av { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #fff; }

/* 2 — arch shape */
.h2 .wash { background: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.08) 42%, rgba(0,0,0,0.72)); }
.h2 .av { width: 160px; height: 196px; border-radius: 80px 80px 16px 16px; border: 3px solid #fff; }
.h2 .av .avimg { border-radius: 77px 77px 13px 13px; }

/* 3 — fine line, hairline data */
.h3 .wash { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.08) 42%, rgba(0,0,0,0.75)); }
.h3 .av { width: 150px; height: 150px; border-radius: 50%; border: 1px solid #fff; }
.h3 .nm { font-weight: 400; letter-spacing: 5px; text-transform: uppercase; font-size: 20px; }
.h3 .data { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.3); }
.h3 .data .d b { font-weight: 400; }

/* 4 — squircle, bottom aligned name (keeps hero feel) */
.h4 .wash { background: linear-gradient(transparent 42%, rgba(0,0,0,0.8)); }
.h4 .av { width: 170px; height: 170px; border-radius: 42% / 42%; border: 3px solid #fff; }
</style>
</head>
<body>
<h1>Hero — ההירו בלבד</h1>
<p class="sub">מסך מלא · תמונת פרופיל גדולה במרכז · 4 גרסאות מלוטשות</p>
<div class="grid" id="grid"></div>

<script>
var ARR = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var SHR = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var bar = '<div class="bar"><span class="t">Studio Vero</span>' + SHR + '</div>';
var av = '<span class="av"><span class="avimg"></span></span>';
var data = '<div class="data"><div class="d"><b>248</b><span>Followers</span></div><div class="d"><b>32</b><span>Items</span></div><div class="d"><b>4.9★</b><span>Rating</span></div></div>';
var nameBlock = '<div class="kick">Seller · Verified · Tel Aviv</div><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion</div>';
var swipe = '<div class="swipe">Items<i></i></div>';
function hero(cls, inner) { return '<div class="screen ' + cls + '"><div class="img"></div><div class="wash"></div>' + bar + inner + swipe + '</div>'; }

var OPTS = [
  ['1 · עיגול גדול', 'תמונת פרופיל עגולה גדולה במרכז, שם וביו, ושורת נתונים. נקי וקלאסי, האופציה הבטוחה.',
   hero('h1', '<div class="center">' + av + nameBlock + data + '</div>')],
  ['2 · קשת (Arch)', 'תמונת הפרופיל בצורת קשת — עליון מעוגל, תחתון ישר. אלגנטי וטרנדי, שונה מכולם.',
   hero('h2', '<div class="center">' + av + nameBlock + data + '</div>')],
  ['3 · קו דק', 'טבעת 1px, שם מרווח באותיות גדולות, ונתונים על קו דק. הכי מאופק, בשפת ה-fine line של האתר.',
   hero('h3', '<div class="center">' + av + nameBlock + data + '</div>')],
  ['4 · סקווירקל', 'ריבוע-עיגול רך (squircle) גדול במרכז. מודרני ונעים, בין עיגול לריבוע.',
   hero('h4', '<div class="center">' + av + nameBlock + data + '</div>')]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
