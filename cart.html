<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — My Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- The product card, shared by every page (single source: product-card.css). -->
    <link rel="stylesheet" href="product-card.css">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <!-- Page styles, shared by cart-store / cart / wishlist (single source: list-page.css). -->
    <link rel="stylesheet" href="list-page.css?v=20261005u">
    <script src="assets/back-button.js"></script>
    <script src="assets/footer.js"></script>
    <link rel="stylesheet" href="assets/page-header.css?v=20261003e">
    <script src="assets/page-header.js?v=20261005e"></script>
</head>
<body>
    <!-- Embedded inside profile.html (?embed=1): the page title + back button are
         hidden — the title is shown in the profile hero instead. -->
    <script>if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');</script>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->
    <header class="page-header">
        <div class="ph-name" role="heading" aria-level="1">Cart</div>
        <div class="sh-search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="listSearch" placeholder="Search this cart…" autocomplete="off" aria-label="Search this cart">
        </div>
        <div class="ph-actions">
            <button class="tb-ico sh-search-btn" onclick="toggleListSearch(this)" aria-label="Search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="tb-ico" onclick="openFilters()" aria-label="Filters">
                <svg viewBox="0 0 24 24"><path d="M4 3h16l-8 9-8-9z"/><path d="M12 12v8"/><path d="M8 21h8"/></svg>
            </button>
            <button class="tb-ico" onclick="shareList()" aria-label="Share">
                <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
        </div>
        <a class="ph-back" href="profile.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </header>

    <div class="wrap">
        <!-- Category chips (tap to filter), with the Clothing / Art switch at the end. -->
        <div class="q-bar">
            <div class="q-chips" id="qChips"></div>
            <div class="mode-toggle">
                <button class="mode-switch" id="modeSwitch" type="button" aria-label="Switch Clothing / Art"></button>
                <div class="mode-labels">
                    <button class="mode-btn active" data-mode="clothing">Clothing</button>
                    <button class="mode-btn" data-mode="art">Art</button>
                </div>
            </div>
        </div>
        <p class="head-sub" id="headSub" hidden></p>
        <div class="head-total" id="headTotal" hidden></div>

        <div id="tickerHost"></div>
        <div id="cartBody"></div>
        <div id="checkoutHost"></div>
    </div>

    <!-- Sticky selection summary — fades in while items are ticked for checkout. -->
    <div class="sel-bar" id="selBar" aria-live="polite">
        <span class="sel-count" id="selBarCount"></span>
        <span class="sel-total" id="selBarTotal"></span>
    </div>

    <!-- Filters bottom-sheet. -->
    <div class="cart-sheet-overlay" id="filterOverlay" onclick="if(event.target===this)closeFilters()">
        <div class="cart-sheet">
            <div class="sheet-grip"></div>
            <h3>Filters</h3>
            <div id="toolbarHost"></div>
        </div>
    </div>

    <!-- Order-placed confirmation (fine line, full screen) — shown after Checkout. -->
    <div class="co-screen" id="coSheet" role="dialog" aria-modal="true" aria-label="Order placed"></div>
    <script>
        // The search lives in the header; tapping the icon reveals an inline search field.
        function toggleListSearch(btn) {
            var head = document.querySelector('.page-header');
            if (!head) return;
            var open = head.classList.toggle('searching');
            if (btn) btn.classList.toggle('on', open);
            var input = document.getElementById('listSearch');
            if (open) { if (input) input.focus(); }
            else if (input && input.value) { input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true })); }
        }
        window.openFilters = function () { document.getElementById('filterOverlay').classList.add('show'); };
        window.closeFilters = function () { document.getElementById('filterOverlay').classList.remove('show'); };
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.closeFilters(); });
        // Share (native share where available, otherwise copy the link).
        window.shareList = function () {
            var url = location.href;
            if (navigator.share) { navigator.share({ title: 'moravchick', text: 'My moravchick cart', url: url }).catch(function(){}); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});
        };
    </script>

    <script>
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        let cart = readJSON('vero_cart', []);
        if (!Array.isArray(cart)) cart = [];

        // The art categories from the site — anything else counts as clothing.
        const ART_CATS = new Set(['Acrylic','Oil','Watercolor','Mixed Media','Digital','Gouache',
            'Pastel','Epoxy','Stone Sculpture','Metal Sculpture','Ceramic','Photography','Sculpture','Painting']);
        const typeOf = it => it.type === 'art' || it.type === 'clothing'
            ? it.type
            : (ART_CATS.has(it.category) ? 'art' : 'clothing');

        // Demo pieces so both carts show their categories when nothing's saved yet.
        // (In-memory only — never written to the real cart.)
        let DEMO = false;
        if (!cart.length && !localStorage.getItem('vero_cart_seeded')) {
            // Seed a starter cart once, persisted to vero_cart, so both cart pages
            // (header + personal area) share exactly the same items.
            cart = [
                { name: 'Cotton Oxford Shirt', seller: 'Studio Vero', icon: '👕', price: 220, rating: 4.7, type: 'clothing', category: 'Shirts' },
                { name: 'Linen Overshirt',     seller: 'Atelier Nord', icon: '👔', price: 340, rating: 4.5, type: 'clothing', category: 'Shirts' },
                { name: 'Striped Tee',         seller: 'Basics Co.',   icon: '👕', price: 130, rating: 4.2, type: 'clothing', category: 'Shirts' },
                { name: 'Slim Selvedge Jeans', seller: 'Denim Lab',    icon: '👖', price: 410, rating: 4.8, type: 'clothing', category: 'Pants' },
                { name: 'Wool Trousers',       seller: 'Atelier Nord', icon: '👖', price: 380, rating: 4.6, type: 'clothing', category: 'Pants' },
                { name: 'Cargo Pants',         seller: 'Urban Thread', icon: '🩳', price: 260, rating: 4.1, type: 'clothing', category: 'Pants' },
                { name: 'Leather Sneakers',    seller: 'Sole Society', icon: '👟', price: 520, rating: 4.6, type: 'clothing', category: 'Shoes' },
                { name: 'Chelsea Boots',       seller: 'Sole Society', icon: '🥾', price: 690, rating: 4.9, type: 'clothing', category: 'Shoes' },
                { name: 'Suede Loafers',       seller: 'Milano Feet',  icon: '👞', price: 610, rating: 4.7, type: 'clothing', category: 'Shoes' },
                { name: 'Automatic Watch',     seller: 'Horology Co.', icon: '⌚', price: 1250, rating: 5.0, type: 'clothing', category: 'Watches' },
                { name: 'Diver Chronograph',   seller: 'Horology Co.', icon: '⌚', price: 1680, rating: 4.8, type: 'clothing', category: 'Watches' },
                { name: 'Wool Overcoat',       seller: 'Atelier Nord', icon: '🧥', price: 980, rating: 4.9, type: 'clothing', category: 'Jackets' },
                { name: 'Denim Jacket',        seller: 'Denim Lab',    icon: '🧥', price: 450, rating: 4.4, type: 'clothing', category: 'Jackets' },
                { name: 'Leather Belt',        seller: 'Milano Feet',  icon: '👜', price: 190, rating: 4.3, type: 'clothing', category: 'Accessories' },
                { name: 'Silk Scarf',          seller: 'Studio Vero',  icon: '🧣', price: 210, rating: 4.5, type: 'clothing', category: 'Accessories' },

                { name: 'Sunset Landscape',    seller: 'Art House',    icon: '🖼️', price: 900, rating: 4.8, type: 'art', category: 'Oil' },
                { name: 'Harbour at Dawn',     seller: 'Art House',    icon: '🖼️', price: 1150, rating: 4.7, type: 'art', category: 'Oil' },
                { name: 'Abstract No. 4',      seller: 'Designer Collection', icon: '🎨', price: 650, rating: 4.4, type: 'art', category: 'Acrylic' },
                { name: 'Colour Field II',     seller: 'Gallery Nine', icon: '🎨', price: 720, rating: 4.6, type: 'art', category: 'Acrylic' },
                { name: 'Morning Mist',        seller: 'Gallery Nine', icon: '💧', price: 480, rating: 4.5, type: 'art', category: 'Watercolor' },
                { name: 'Marble Bust',         seller: 'Studio Vero',  icon: '🗿', price: 1800, rating: 4.9, type: 'art', category: 'Stone Sculpture' },
                { name: 'Bronze Figure',       seller: 'Forge Studio', icon: '⚙️', price: 2200, rating: 5.0, type: 'art', category: 'Metal Sculpture' },
                { name: 'Neon Print',          seller: 'Pixel Works',  icon: '💻', price: 300, rating: 4.3, type: 'art', category: 'Digital' },
                { name: 'Generative Grid',     seller: 'Pixel Works',  icon: '💻', price: 360, rating: 4.2, type: 'art', category: 'Digital' },
                { name: 'City Nights',         seller: 'Frame & Co.',  icon: '📷', price: 540, rating: 4.6, type: 'art', category: 'Photography' },
            ];
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_cart_seeded', '1');
        }

        // Open the tab that actually has items, so the cart never reads "empty"
        // while the personal-area peek counts items of the other type.
        let MODE = cart.some(it => typeOf(it) === 'clothing') ? 'clothing'
                 : cart.some(it => typeOf(it) === 'art') ? 'art' : 'clothing';

        // Filter / sort state behind the header's Filters button.
        let filterCat = 'all';      // category filter
        let filterSeller = 'all';   // seller filter
        let sortBy = 'featured';    // featured | price-asc | price-desc
        window.setFilterCat    = function (v) { filterCat = v; render(); };
        window.setFilterSeller = function (v) { filterSeller = v; render(); };
        window.setSortBy       = function (v) { sortBy = v; render(); };

        // Category (A–Z), seller (A–Z) and price controls, inside the filters sheet.
        function renderToolbar(rows) {
            const host = document.getElementById('toolbarHost');
            const cats    = [...new Set(rows.map(({ it }) => it.category || 'Other'))].sort((a, b) => a.localeCompare(b));
            const sellers = [...new Set(rows.map(({ it }) => it.seller || 'Vero Store'))].sort((a, b) => a.localeCompare(b));
            const opt = (v, cur, lbl) => `<option value="${v}"${v === cur ? ' selected' : ''}>${lbl || v}</option>`;
            host.innerHTML = `
                <div class="ct-filters">
                    <div class="ct-field">
                        <select class="ct-select" onchange="setFilterCat(this.value)">
                            ${opt('all', filterCat, 'All categories')}${cats.map(c => opt(c, filterCat)).join('')}
                        </select>
                        <span class="ct-label">Category</span>
                    </div>
                    <div class="ct-field">
                        <select class="ct-select" onchange="setFilterSeller(this.value)">
                            ${opt('all', filterSeller, 'All sellers')}${sellers.map(s => opt(s, filterSeller)).join('')}
                        </select>
                        <span class="ct-label">Seller</span>
                    </div>
                    <div class="ct-field">
                        <select class="ct-select" onchange="setSortBy(this.value)">
                            ${opt('featured', sortBy, 'Featured')}${opt('price-asc', sortBy, 'Price: low to high')}${opt('price-desc', sortBy, 'Price: high to low')}
                        </select>
                        <span class="ct-label">Price</span>
                    </div>
                </div>`;
        }

        // Which cart items (by index) are ticked for checkout. Everything starts
        // selected, so the total matches the whole cart until the buyer unticks.
        const selected = new Set(cart.map((_, i) => i));
        window.toggleSelect = function (idx) {
            if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
            render();
        };
        // Select / clear every item in the active (Clothing / Art) cart.
        window.selectAllVisible = function () {
            cart.forEach((it, i) => { if (typeOf(it) === MODE) selected.add(i); });
            render();
        };
        window.deselectAllVisible = function () {
            cart.forEach((it, i) => { if (typeOf(it) === MODE) selected.delete(i); });
            render();
        };

        const priceNum = p => parseFloat(String(p == null ? 0 : p).replace(/[^\d.]/g, '')) || 0;
        const priceStr = p => {
            const s = String(p == null ? '' : p).trim();
            return s.startsWith('₪') ? s : '₪' + priceNum(p).toFixed(2);
        };

        // Same product page link the feed builds.
        function productPageUrl(item) {
            const data = {
                name: item.name, price: item.price, icon: item.icon,
                category: item.category, seller: item.seller, rating: item.rating, type: item.type
            };
            return `product-showcase.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        // One card per item: photo (or the emoji), select ✓, remove ×, name + price, seller.
        function cartCardHTML(item, idx) {
            const on = selected.has(idx) ? ' on' : '';
            const photo = item.cover || item.image || item.photo;
            const rating = item.rating || 4.5;
            const stars = '\u2605'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '\u2606' : '');
            return `
                <a href="${productPageUrl(item)}" class="product-card cart-item" data-idx="${idx}">
                    <div class="product-image">${photo ? `<img class="pc-photo" src="${photo}" alt="${item.name || ''}" loading="lazy" onerror="this.remove()">` : (item.icon || '🛍️')}
                        <button class="pc-check${on}" title="Select" aria-label="Select"
                                onclick="event.preventDefault(); event.stopPropagation(); toggleSelect(${idx})">
                            <svg class="pc-x" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                            <svg class="pc-v" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </button>
                        <button class="product-icon remove" title="Remove from cart" aria-label="Remove from cart"
                                onclick="event.preventDefault(); event.stopPropagation(); removeItem(${idx})">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price"><span class="vprice">${priceStr(item.price)}</span></div>
                        </div>
                        <div class="pc-right">
                            <div class="product-seller">${item.seller || 'Vero Store'}</div>
                            <div class="product-name">${item.name || 'Item'}</div>
                            <div class="product-rating">${stars}</div>
                        </div>
                    </div>
                </a>`;
        }

        // Category chips: "All" plus one per category in this (Clothing / Art) list.
        function renderChips(rows) {
            const host = document.getElementById('qChips');
            if (!host) return;
            const counts = new Map();
            rows.forEach(({ it }) => { const c = it.category || 'Other'; counts.set(c, (counts.get(c) || 0) + 1); });
            const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
            const chip = (v, lbl) => `<button type="button" class="q-chip${filterCat === v ? ' on' : ''}" data-cat="${esc(v)}">${lbl}</button>`;
            host.innerHTML = chip('all', `All · ${rows.length}`) +
                [...counts.keys()].sort((a, b) => a.localeCompare(b)).map(c => chip(c, esc(c))).join('');
            host.querySelectorAll('.q-chip').forEach(b => b.addEventListener('click', () => setFilterCat(b.dataset.cat)));
        }

        function render() {
            const body = document.getElementById('cartBody');
            const host = document.getElementById('checkoutHost');
            const sub = document.getElementById('headSub');

            // This cart = the items whose type matches the active toggle, and
            // (when searching) whose name / seller / category match the query.
            const term = (document.getElementById('listSearch')?.value || '').trim().toLowerCase();
            const inMode = cart.map((it, idx) => ({ it, idx })).filter(({ it }) => typeOf(it) === MODE);
            renderToolbar(inMode);
            renderChips(inMode);
            let mine = term
                ? inMode.filter(({ it }) => ((it.name || '') + ' ' + (it.seller || '') + ' ' + (it.category || '')).toLowerCase().includes(term))
                : inMode;
            if (filterCat !== 'all')    mine = mine.filter(({ it }) => (it.category || 'Other') === filterCat);
            if (filterSeller !== 'all') mine = mine.filter(({ it }) => (it.seller || 'Vero Store') === filterSeller);
            if (sortBy === 'price-asc')  mine = mine.slice().sort((a, b) => priceNum(a.it.price) - priceNum(b.it.price));
            if (sortBy === 'price-desc') mine = mine.slice().sort((a, b) => priceNum(b.it.price) - priceNum(a.it.price));
            const filtered = term || filterCat !== 'all' || filterSeller !== 'all';

            if (!mine.length) {
                body.innerHTML = filtered
                    ? `<div class="cart-empty">${term ? `No items match “${term}”.` : 'No items match these filters.'}</div>`
                    : `<div class="cart-empty">Your ${MODE} cart is empty — pieces you add from the feed appear here.</div>`;
                host.innerHTML = '';
                document.getElementById('headTotal').innerHTML = '';
                if (!filtered) document.getElementById('tickerHost').innerHTML = '';
                sub.textContent = "The items you've gathered, ready to check out.";
                document.getElementById('selBar').classList.remove('show');
                return;
            }

            // One flat two-up grid — the chips above do the category split.
            body.innerHTML = `<div class="cart-grid">${mine.map(r => cartCardHTML(r.it, r.idx)).join('')}</div>`;

            const count = mine.reduce((s, { it }) => s + (it.qty || 1), 0);
            const total = mine.reduce((s, { it }) => s + priceNum(it.price) * (it.qty || 1), 0);
            sub.textContent = `${count} item${count === 1 ? '' : 's'} in your ${MODE} cart · ready to check out.`;
            // Total lives on the auto-rotating ticker (same as the regular cart),
            // keeping the header row clean.
            document.getElementById('headTotal').innerHTML = '';
            const money = '₪' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            // Checkout pinned at the end, with the ticked items' count + sum beside it.
            const chosen = mine.filter(({ idx }) => selected.has(idx));
            const selCount = chosen.reduce((s, { it }) => s + (it.qty || 1), 0);
            const selTotal = chosen.reduce((s, { it }) => s + priceNum(it.price) * (it.qty || 1), 0);
            const selTotalStr = selTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const allSel = mine.length > 0 && chosen.length === mine.length;
            document.getElementById('tickerHost').innerHTML = `
                <div class="q-meta"><span>${count} item${count === 1 ? '' : 's'}</span>
                    <button type="button" onclick="${allSel ? 'deselectAllVisible()' : 'selectAllVisible()'}">${allSel ? 'Clear' : 'Select all'}</button></div>`;
            host.innerHTML = `
                <div class="cart-actionbar q-pill">
                    <div class="q-sum"><span>${selCount} selected</span><b>₪${selTotalStr.replace(/\.00$/, '')}</b></div>
                    <button class="cab-cell cab-checkout" onclick="veroCheckout()"${selCount ? '' : ' disabled'}>Checkout &#8594;</button>
                </div>`;

            // Sticky summary popup — visible only while something is ticked.
            document.getElementById('selBarCount').textContent = `${selCount} selected`;
            document.getElementById('selBarTotal').innerHTML = `₪${selTotalStr}`;
            document.getElementById('selBar').classList.toggle('show', selCount > 0);
        }

        // Remove keeps the site's own cart storage in sync (demo items aren't saved).
        window.removeItem = function (idx) {
            cart.splice(idx, 1);
            if (!DEMO) localStorage.setItem('vero_cart', JSON.stringify(cart));
            // Indices shifted — resync the selection to the remaining items.
            selected.clear();
            cart.forEach((_, i) => selected.add(i));
            render();
        };

        // Checkout — turns the active cart into conversations with each seller,
        // written to the same vero_chats store the Chats page reads, then opens it.
        window.veroCheckout = function () {
            // Only the ticked items go through checkout.
            const mine = cart.map((it, idx) => ({ it, idx }))
                .filter(({ it, idx }) => typeOf(it) === MODE && selected.has(idx));
            if (!mine.length) return;

            const store = readJSON('vero_chats', {});
            const now = Date.now();
            mine.forEach(({ it }, n) => {
                const seller = it.seller || 'Vero Store';
                if (!Array.isArray(store[seller])) store[seller] = [];
                store[seller].push({ sender: 'buyer',  content: `Order placed — ${it.name} · ${priceStr(it.price)}`, at: now + n * 2 });
                store[seller].push({ sender: 'seller', content: `Thanks for your order of “${it.name}”! Let's arrange pickup or delivery.`, at: now + n * 2 + 1 });
            });
            localStorage.setItem('vero_chats', JSON.stringify(store));

            // Remember which sellers we just messaged, so the Chats page can surface
            // them first and mark them available (green dot) right after checkout.
            const recentSellers = [...new Set(mine.map(({ it }) => it.seller || 'Vero Store'))];
            localStorage.setItem('vero_checkout_recent',
                JSON.stringify({ sellers: recentSellers, at: now }));

            // Clear the purchased items from the real cart (demo items aren't saved).
            if (!DEMO) {
                mine.map(m => m.idx).sort((a, b) => b - a).forEach(i => cart.splice(i, 1));
                localStorage.setItem('vero_cart', JSON.stringify(cart));
            }

            // Show the fine-line "Order placed" receipt in the window; the buyer
            // taps through to the synced conversations.
            const placedTotal = mine.reduce((s, { it }) => s + priceNum(it.price) * (it.qty || 1), 0);
            showOrderPlaced(mine.map(m => m.it), placedTotal);
        };

        // Option E — "Order placed" receipt, shown inside the checkout window
        // after the slide confirms.
        function showOrderPlaced(items, total) {
            const money = v => '\u20aa' + v.toLocaleString('en-US');
            const d = new Date();
            const dateStr = ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + String(d.getFullYear()).slice(-2);
            const sheet = document.getElementById('coSheet');
            sheet.innerHTML = '<div class="co-card">' +
                '<div class="co-tick"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg></div>' +
                '<div class="co-ptitle">Order placed</div>' +
                '<div class="co-psub">moravchick \u00b7 ' + dateStr + '</div>' +
                '<div class="co-receipt">' +
                    items.map(it => '<div class="co-rln"><span>' + (it.name || 'Item') + '</span><span>' + money(priceNum(it.price) * (it.qty || 1)) + '</span></div>').join('') +
                    '<div class="co-rln"><span>Shipping</span><span>Free</span></div>' +
                    '<div class="co-rln co-rt"><span>Total</span><span>' + money(total) + '</span></div>' +
                '</div>' +
                '<a class="co-go" href="chats.html">Go to chats &#8594;</a>' +
            '</div>';
            requestAnimationFrame(() => sheet.classList.add('show'));
        }
        window.showOrderPlaced = showOrderPlaced;


        // Clothing / Art toggle — two carts, built the same way.
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                MODE = btn.dataset.mode;
                filterCat = 'all'; filterSeller = 'all'; sortBy = 'featured';
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
                render();
            });
        });

        // Reflect the auto-chosen tab in the toggle UI before the first render.
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === MODE));

        // Live search: filter the cart as you type.
        (function () {
            const si = document.getElementById('listSearch');
            if (!si) return;
            let t;
            si.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 110); });
        })();

        render();

        // Rotate the cart-summary stat every 4s (same as the regular cart).
        setInterval(function () {
            const slides = document.querySelectorAll('#cartTicker .cart-stat');
            if (slides.length < 2) return;
            let cur = [...slides].findIndex(s => s.classList.contains('is-active'));
            if (cur < 0) cur = 0;
            slides[cur].classList.remove('is-active');
            slides[(cur + 1) % slides.length].classList.add('is-active');
        }, 4000);

        // Exit mirrors the entry: the image holds static while the data slides
        // back out to the left, then the personal area loads.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.5s ease';
            wrap.style.opacity = '0';
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>

    <script id="mode-switch-js">
    (function () {
        var mt = document.querySelector('.mode-toggle');
        var sw = document.getElementById('modeSwitch');
        function sync() {
            if (!mt) return;
            var art = document.querySelector('.mode-btn[data-mode="art"]');
            mt.classList.toggle('is-art', !!(art && art.classList.contains('active')));
        }
        document.querySelectorAll('.mode-btn').forEach(function (b) { b.addEventListener('click', sync); });
        if (sw) sw.addEventListener('click', function () {
            var active = document.querySelector('.mode-btn.active');
            var cur = active ? active.getAttribute('data-mode') : 'clothing';
            var next = cur === 'clothing' ? 'art' : 'clothing';
            var b = document.querySelector('.mode-btn[data-mode="' + next + '"]');
            if (b) b.click();
        });
        sync();
    })();
    </script>
    <script src="assets/didone-hairline.js"></script>
    <script src="nav-icons.js" defer></script>
    <script src="reveal.js" defer></script>
</body>
</html>
