<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phone-only presentation: opened as a top-level window this page hands off to
         phone-frame.html. Inside a frame (window.top !== self) the check is skipped. -->
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
      }
    </script>
    <title>moravchick — Seller statistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --available: #1f8f4e;   /* 🟢 Available */
            --reserved:  #c9922b;   /* 🟡 Reserved */
            --sold:      #b23b3b;   /* 🔴 Sold */
            --gold:      #9a7d52;
            --ink: #1c1c1c;
            --muted: #7a7a75;
            --line: #e9e9e6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        /* Embedded store-management dashboard sitting at the top of the stats page. */
        .dash-embed { width: 100%; border: none; display: block; margin: 0 0 26px; min-height: 320px; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff; direction: ltr; color: var(--ink);
            overflow-x: hidden; font-size: 14px; line-height: 1.5;
        }

        /* Standalone chrome (hidden when embedded ?embed=1). */
        .back {
            position: fixed; top: 22px; left: 22px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10px; letter-spacing: 1.5px; text-decoration: none; color: var(--ink);
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }
        html.is-embed .back { display: none !important; }
        .old-back { display: none !important; }

        /* Sticky page header — back arrow + page name, pinned on scroll and dropped
           below the phone's camera / status area (safe-area inset). */
        .sticky-head {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; gap: 16px;
            padding: calc(env(safe-area-inset-top, 0px) + 54px) 20px 20px;
            background: rgba(255,255,255,0.94);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border-bottom: 1px solid #ececea;
        }
        .sh-back { width: 44px; height: 44px; border: 1px solid #e2e0da; border-radius: 50%; background: none; display: grid; place-items: center; cursor: pointer; color: #111; flex: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
        .sh-back svg { width: 22px; height: 22px; }
        .sh-back:hover { background: #111; color: #fff; border-color: #111; }
        .sh-title { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; color: #1b1916; }

        .wrap { position: relative; z-index: 1; padding: 24px 20px 60px; max-width: 640px; margin: 0 auto; animation: fadeIn 0.5s ease both; }
        /* Bottom clearance so the last rows aren't hidden behind the shell's
           floating bottom nav that overlays this embedded view. */
        html.is-embed .wrap { padding: 20px 18px 132px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .st-head { margin-bottom: 18px; }
        .st-title { font-size: clamp(26px, 7vw, 34px); font-weight: 200; letter-spacing: 0.5px; }
        .st-sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
        html.is-embed .st-sub { text-align: left; padding-left: 23px; }   /* in line with the page header title */

        /* Period segmented control (day / week / month). */
        .seg {
            display: inline-flex; gap: 4px; margin: 14px 0 24px; padding: 4px;
            background: rgba(7,12,28,0.96); border-radius: 999px;
        }
        .seg button {
            border: none; background: transparent; color: #b5b5b0; font-family: inherit;
            font-size: 11px; font-weight: 500; letter-spacing: 0.4px; padding: 8px 18px;
            border-radius: 999px; cursor: pointer; transition: color 0.2s, background 0.25s;
        }
        .seg button.on { background: #fff; color: #111; }

        .sec-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 34px 0 14px; }

        /* Cards + grid. */
        .grid { display: grid; gap: 14px; }
        .g2 { grid-template-columns: 1fr 1fr; }
        .g4 { grid-template-columns: 1fr 1fr; }
        .card { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: #fff; }
        .card.dark { background: #111; color: #fff; border-color: #111; }
        .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .card-t { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
        .card-d { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.6; }

        /* KPI tile. */
        .kpi-num { font-size: 30px; font-weight: 200; line-height: 1; margin-top: 12px; }
        .kpi-lbl { font-size: 10px; letter-spacing: 1.2px; color: var(--muted); margin-top: 8px; }
        /* Centre the numeric KPI tiles (cards whose direct child is a big number). */
        .card:has(> .kpi-num) { text-align: center; }
        .card:has(> .kpi-num) .delta { justify-content: center; }
        .delta { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; margin-top: 8px; }
        .delta.up { color: var(--available); }
        .delta.down { color: var(--sold); }
        .delta.flat { color: var(--muted); }

        /* Fine-line chart — one hairline column per day in the range
           (week = 7, month = 30/31, year = 365). Heights set inline. */
        .bars, .gbars { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
        :root { --graph-h: 300px; }
        .line-row { display: flex; align-items: flex-end; height: var(--graph-h); }
        .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
        .ln {
            width: 100%; max-width: 8px; min-height: 2px; background: #111;
            border-radius: 999px 999px 2px 2px;
            transition: height 0.55s cubic-bezier(0.22,1,0.36,1);
        }
        .ln.gold { background: var(--gold); }
        /* Buckets with no activity — visible light-grey baseline ticks. */
        .ln.empty { background: #cbc8c1 !important; }
        /* Stacked column (store + products) for the views comparison. */
        .ln.stack { display: flex; flex-direction: column; overflow: hidden; background: transparent; }
        .ln.stack .seg { width: 100%; display: block; }
        .ln.stack .seg.store { background: #111; }
        .ln.stack .seg.prod  { background: var(--gold); }
        /* Sparse axis under the chart. */
        .axis { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.6px; color: var(--muted); }
        .axis span { flex: 0 0 auto; }
        .legend { display: flex; gap: 16px; margin-top: 30px; font-size: 10.5px; color: var(--muted); }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

        /* Progress meter. */
        .meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 10px; }
        .meter > span { display: block; height: 100%; background: #111; border-radius: 999px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }
        .meter > span.gold { background: var(--gold); }
        .goal-row { margin-bottom: 20px; }
        .goal-row:last-child { margin-bottom: 0; }
        .goal-top { display: flex; justify-content: space-between; align-items: baseline; }
        .goal-lbl { font-size: 12px; font-weight: 600; }
        .goal-val { font-size: 11px; color: var(--muted); }

        /* Status tiles. */
        .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
        .dot.green { background: var(--available); }
        .dot.amber { background: var(--reserved); }
        .dot.red   { background: var(--sold); }
        .dot.grey  { background: var(--muted); }

        /* Product rows (top viewed / attention). */
        .prow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .prow:last-child { border-bottom: none; }
        .pthumb { width: 44px; height: 44px; border-radius: 10px; background: #f4f4f1 center/cover no-repeat; flex: none; display: grid; place-items: center; font-size: 20px; color: #c7c2b8; }
        .pmain { flex: 1; min-width: 0; }
        .pname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pmeta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
        .pval { font-size: 12px; font-weight: 600; white-space: nowrap; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 10.5px; font-weight: 500; }
        .empty { text-align: center; color: var(--muted); font-size: 11px; padding: 18px 0; }

        /* Buttons. */
        .btn {
            display: inline-flex; align-items: center; gap: 8px; justify-content: center;
            padding: 12px 20px; border-radius: 999px; border: 1.4px solid #111; background: #fff;
            color: #111; font-family: inherit; font-size: 11px; letter-spacing: 0.5px; font-weight: 500;
            cursor: pointer; min-height: 44px; text-decoration: none; transition: background 0.2s, color 0.2s;
        }
        .btn:hover { background: #111; color: #fff; }
        .btn.wide { width: 100%; margin-top: 16px; }
    </style>

    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->

        <div class="ph-name" role="heading" aria-level="1">Statistics</div>
        <a class="ph-back" href="seller-area.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>

    <div class="wrap">
        <div class="st-head">
            <h1 class="st-title" style="display:none">My statistics</h1>
        </div>

        <!-- Store-management dashboard, merged in as the overview at the top of the
             Statistics view. Auto-sized via a postMessage height handshake. -->
        <iframe id="dashEmbed" class="dash-embed" data-src="seller-dashboard.html?embed=1" title="Store management dashboard" scrolling="no"></iframe>
    </div>

    <script>
    // Load the embedded dashboard with a cache-buster so it is always the freshest deploy.
    (function () {
        var f = document.getElementById('dashEmbed');
        if (f && !f.src && f.dataset.src) f.src = f.dataset.src + '&_ts=' + Date.now();
    })();
    // Auto-size the embedded store-management dashboard to its content.
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.type !== 'vero-embed-height' || d.page !== 'seller-dashboard') return;
        var f = document.getElementById('dashEmbed');
        if (f && d.h) f.style.height = d.h + 'px';
    });
    </script>
