<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/motion.js?v=2"></script>

<!-- Phone-only presentation: opened as a top-level window this page hands off to
     phone-frame.html. Inside a frame (window.top !== self) the check is skipped. -->
<script>
  if (window.self === window.top && !/[?&]embed=1/.test(location.search)) {
    var pf = location.pathname.split('/').pop() || 'index';
    if (!/\.html$/.test(pf)) pf += '.html';
    location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
  }
</script>
<meta name="description" content="moravchick — straight fashion. A curated marketplace for pre-loved fashion and art.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<title>moravchick — Counter offer</title>
<script src="vero-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<!--
  counter.html — one piece's negotiation, three screens:
    ?id=<negotiation>            Counter: the piece's card, the price offered, your counter price.
    ?id=<negotiation>&view=accepted  After accepting the offered price.
    ?id=<negotiation>&view=sent      After sending a counter — the price you sent.
  Reached from the Counter / Accept buttons on offers.html. Data: negotiation.js (VeroNego).
-->
<style>
  :root { --ink: #111; --muted: #6b665c; --faint: #8a857b; --line: #e6e3dc; --ground: #F2F2F2; --red: #c62828; --green: #2f6b3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); font-family: 'Raleway', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 20px calc(40px + env(safe-area-inset-bottom, 0px)); }

  /* The piece's card — the same as on the negotiation page. */
  .pc { margin-top: 6px; }
  .pc-pic { position: relative; aspect-ratio: 1 / 1.05; background: var(--ground); overflow: hidden; }
  .pc-pic img { position: absolute; inset: 10%; width: 80%; height: 80%; object-fit: contain; }
  .pc-ic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 64px; }
  .pc-ic svg { width: 70px; height: 70px; }
  .pc-r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 14px; }
  .pc-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 300; font-size: 17px; letter-spacing: 0.2px; text-transform: uppercase; }
  .pc-ask { flex: none; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; }
  .pc-who { margin-top: 4px; font-weight: 500; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #333; }

  /* Price rows: hairline above and below, label · % off asking · price. */
  .row { display: flex; align-items: baseline; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--ink); }
  .row.first { margin-top: 16px; border-top: 1px solid var(--ink); }
  .row .l { flex: 1; font-size: 13px; text-transform: uppercase; }
  .row .l small { display: block; margin-top: 3px; font-size: 9.5px; letter-spacing: 0.8px; color: var(--faint); text-transform: none; }
  .row .pct { font-family: 'Poppins', sans-serif; font-size: 12px; color: var(--red); }
  .row .pct.up { color: var(--green); }
  .row .p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px; }

  /* Your counter: a big price you can type or step, a slider in the allowed band. */
  .ctr { padding: 18px 0 6px; }
  .ctr-l { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; text-transform: uppercase; }
  .ctr-l .pct { font-family: 'Poppins', sans-serif; font-size: 12px; color: var(--red); text-transform: none; }
  .amt { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0 6px; }
  .step { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
  .step:active { border-color: var(--ink); }
  .amt label { display: inline-flex; align-items: baseline; gap: 2px; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 44px; }
  .amt input { width: 4.2ch; border: 0; border-bottom: 1px solid var(--ink); background: none; font: inherit; text-align: center; color: var(--ink); padding: 0; -moz-appearance: textfield; }
  .amt input::-webkit-outer-spin-button, .amt input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amt input:focus { outline: none; }
  input[type=range] { width: 100%; margin: 14px 0 4px; accent-color: var(--ink); }
  .band { display: flex; justify-content: space-between; font-family: 'Poppins', sans-serif; font-size: 10.5px; color: var(--faint); }
  .picks { display: flex; gap: 6px; margin-top: 14px; }
  .picks button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 0; font: 500 10.5px 'Raleway', sans-serif; cursor: pointer; color: var(--ink); }
  .picks button.on { border-color: var(--ink); }
  .opt { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .opt input { width: 18px; height: 18px; accent-color: var(--ink); }
  .note { width: 100%; margin-top: 12px; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; font: 400 13px 'Raleway', sans-serif; color: var(--ink); background: none; }
  .note:focus { outline: none; border-bottom-color: var(--ink); }
  .err { min-height: 18px; margin-top: 10px; font-size: 11.5px; color: var(--red); }

  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; height: 46px; border-radius: 999px; border: 1px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
    font: 500 10.5px 'Raleway', sans-serif; letter-spacing: 0.8px; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn.dk { background: var(--ink); color: #fff; }
  .btn.wide { flex: 1.5; }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* Done screens: a mark, a line, the piece small, the price, what comes next. */
  .done { text-align: center; padding-top: 18px; }
  .mark { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; }
  .mark svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mark.out { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  .done h2 { margin: 18px 0 6px; font-weight: 400; font-size: 24px; letter-spacing: 0.2px; }
  .done p.sub { margin: 0 auto; max-width: 300px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .mini { display: flex; align-items: center; gap: 14px; margin: 26px 0 0; padding: 14px 0; border-top: 1px solid var(--ink); text-align: left; }
  .mini .pic { position: relative; flex: none; width: 70px; height: 84px; background: var(--ground); overflow: hidden; }
  .mini .pic img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; }
  .mini .pic .pc-ic { font-size: 30px; } .mini .pic .pc-ic svg { width: 32px; height: 32px; }
  .mini .x { flex: 1; min-width: 0; }
  .mini .n { font-weight: 300; font-size: 15px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .w { margin-top: 4px; font-weight: 500; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #333; }
  .big { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .big .l { font-size: 13px; text-transform: uppercase; }
  .big .p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 30px; }
  .big + .row { border-top: 0; }
  .done .row, .done .big { text-align: left; }
  .next { margin-top: 16px; font-size: 12px; line-height: 1.55; color: var(--muted); text-align: left; }
  .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
  .stack .btn { flex: none; width: 100%; }
  .empty { padding: 70px 10px; text-align: center; color: var(--faint); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) {
    .mark { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
<link rel="stylesheet" href="assets/page-header.css?v=20261003e">
<script src="assets/page-header.js?v=20261117e"></script>

</head>
<body>
  <header class="page-header">
    <div class="ph-name" role="heading" aria-level="1" id="phName">Counter</div>
    <a class="ph-back" id="phBack" href="offers.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </header>
  <main class="wrap ctr-page" id="main"></main>

  <script src="negotiation.js?v=1"></script>
  <script>
  (function counterPage() {
    'use strict';
    var N = window.VeroNego, main = document.getElementById('main');
    var q = new URLSearchParams(location.search), id = q.get('id'), view = q.get('view') || '';
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var nis = function (n) { return '₪' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
    var left = function (ms) { var h = Math.max(0, Math.round(ms / 36e5)); return h >= 48 ? Math.round(h / 24) + ' days' : h + 'h'; };
    var pct = function (v, ask) { if (!ask || !v) return ''; var p = (v - ask) / ask * 100; return Math.abs(p) < 0.01 ? '' : (p > 0 ? '+' : '') + p.toFixed(2) + '%'; };
    var go = function (url) { location.href = url; };

    var n = N && id ? N.get(id) : null;
    if (N) N.refresh();
    var side = n ? n.side : (q.get('side') || 'selling');
    var listUrl = 'offers.html?side=' + side;
    document.getElementById('phBack').href = listUrl;
    if (!n) { main.innerHTML = '<div class="empty">This negotiation could not be found.</div><div class="stack"><a class="btn dk" href="' + listUrl + '">Back to negotiations</a></div>'; return; }

    var selling = side === 'selling', them = selling ? 'buyer' : 'seller', Them = selling ? 'Buyer' : 'Seller';
    var ask = Number(n.item.ask) || 0;
    var pic = function () { return n.item.cover ? '<img src="' + esc(n.item.cover) + '" alt="">' : '<span class="pc-ic">' + esc(n.item.icon || '🛍️') + '</span>'; };
    var card = function () {
      return '<div class="pc"><div class="pc-pic">' + pic() + '</div>' +
        '<div class="pc-r1"><span class="pc-name">' + esc(n.item.name) + '</span><span class="pc-ask">' + (ask ? nis(ask) : '') + '</span></div>' +
        '<div class="pc-who">' + Them + ' · ' + esc(n.party) + '</div></div>';
    };
    var mini = function () {
      return '<div class="mini"><div class="pic">' + pic() + '</div><div class="x"><div class="n">' + esc(n.item.name) + '</div><div class="w">' + Them + ' · ' + esc(n.party) + (ask ? ' · asking ' + nis(ask) : '') + '</div></div></div>';
    };
    var chatUrl = 'chats.html' + (selling ? '?from=seller' : '');

    /* ---------- After accepting ---------- */
    function paintAccepted() {
      document.getElementById('phName').textContent = 'Accepted';
      var price = n.agreed || (N.state(n).last || {}).amount || 0;
      main.innerHTML = '<div class="done">' +
        '<div class="mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<h2>Offer accepted</h2>' +
        '<p class="sub">You accepted ' + esc(n.party) + '’s offer. The ' + them + ' is told right away.</p>' +
        mini() +
        '<div class="big"><span class="l">Agreed price</span><span class="p">' + nis(price) + '</span></div>' +
        (ask && price !== ask ? '<div class="row"><span class="l">Asking price</span><span class="p">' + nis(ask) + '</span></div>' : '') +
        '<p class="next">Next: agree on a place and time to meet in the chat. The sale is completed in person — mark it as sold once the ' + them + ' has the piece.</p>' +
        '<div class="stack"><a class="btn dk" href="' + chatUrl + '">Arrange the pickup in chat</a><a class="btn" href="' + listUrl + '">Back to negotiations</a></div></div>';
    }

    /* ---------- After sending a counter ---------- */
    function paintSent() {
      document.getElementById('phName').textContent = 'Counter sent';
      var st = N.state(n), mine = st.mine ? st.mine.amount : 0, theirs = st.theirs ? st.theirs.amount : 0;
      main.innerHTML = '<div class="done">' +
        '<div class="mark out"><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg></div>' +
        '<h2>Counter offer sent</h2>' +
        '<p class="sub">' + esc(n.party) + ' has ' + left(st.msLeft) + ' to accept it, counter it or decline.</p>' +
        mini() +
        '<div class="big"><span class="l">Your counter' + (st.mine && st.mine.final ? ' · final' : '') + '</span><span class="p">' + nis(mine) + '</span></div>' +
        (theirs ? '<div class="row"><span class="l">' + Them + '’s offer</span><span class="pct">' + pct(theirs, ask) + '</span><span class="p">' + nis(theirs) + '</span></div>' : '') +
        (ask ? '<div class="row"><span class="l">Asking price</span><span class="p">' + nis(ask) + '</span></div>' : '') +
        (st.mine && st.mine.note ? '<p class="next">Your note: “' + esc(st.mine.note) + '”</p>' : '') +
        '<div class="stack"><a class="btn dk" href="' + listUrl + '">Back to negotiations</a><a class="btn" href="' + chatUrl + '">Open the chat</a></div></div>';
    }

    /* ---------- Counter ---------- */
    function paintCounter() {
      var st = N.state(n);
      if (!st.open || st.turn !== 'me') {             // nothing to answer here right now
        document.getElementById('phName').textContent = 'Negotiation';
        var why = !st.open ? ({ accepted: 'Agreed at ' + nis(n.agreed) + '.', declined: 'This negotiation was declined.', withdrawn: 'The offer was withdrawn.', expired: 'The offer expired.' }[n.status] || 'This negotiation is closed.')
                           : 'Your counter of ' + nis(st.mine ? st.mine.amount : 0) + ' is with the ' + them + '. They have ' + left(st.msLeft) + ' to answer.';
        main.innerHTML = card() + '<div class="row first"><span class="l">' + (st.theirs ? Them + '’s offer' : 'Price') + '</span><span class="pct">' + pct(st.price, ask) + '</span><span class="p">' + nis(st.theirs ? st.theirs.amount : st.price) + '</span></div>' +
          '<p class="next">' + why + '</p><div class="stack"><a class="btn dk" href="' + listUrl + '">Back to negotiations</a></div>';
        return;
      }
      var bid = st.last.amount, lo = st.min, hi = st.max;
      var start = Math.max(lo, Math.min(hi, Math.round((bid + (st.mine ? st.mine.amount : ask)) / 2)));
      var picks = [['Meet halfway', start], ['−5% of asking', Math.round(ask * 0.95)], ['−10% of asking', Math.round(ask * 0.9)]]
        .filter(function (p, i, a) { return p[1] >= lo && p[1] <= hi && a.findIndex(function (x) { return x[1] === p[1]; }) === i; });
      main.innerHTML = card() +
        '<div class="row first"><span class="l">' + Them + '’s offer<small>' + (st.rounds > 1 ? 'Round ' + st.rounds + ' of ' + N.MAX_OFFERS : 'Offered ' + left(Date.now() - (st.last.at || Date.now())) + ' ago') + (st.last.final ? ' · final offer' : '') + '</small></span>' +
          '<span class="pct">' + pct(bid, ask) + '</span><span class="p">' + nis(bid) + '</span></div>' +
        (st.mine ? '<div class="row"><span class="l">Your last counter</span><span class="p">' + nis(st.mine.amount) + '</span></div>' : '') +
        (st.canCounter
          ? '<div class="ctr"><div class="ctr-l"><span>Your counter</span><span class="pct" id="cPct"></span></div>' +
              '<div class="amt"><button type="button" class="step" data-step="-5" aria-label="Lower">−</button>' +
              '<label>₪<input id="cAmt" type="number" inputmode="numeric" min="' + lo + '" max="' + hi + '" value="' + start + '" aria-label="Your counter price"></label>' +
              '<button type="button" class="step" data-step="5" aria-label="Higher">+</button></div>' +
              '<input type="range" id="cRange" min="' + lo + '" max="' + hi + '" value="' + start + '" aria-label="Counter price">' +
              '<div class="band"><span>' + nis(lo) + '</span><span>' + nis(hi) + '</span></div>' +
              (picks.length ? '<div class="picks">' + picks.map(function (p) { return '<button type="button" data-v="' + p[1] + '">' + p[0] + '</button>'; }).join('') + '</div>' : '') +
              '<label class="opt"><input type="checkbox" id="cFinal">Make this my final offer</label>' +
              '<input class="note" id="cNote" type="text" maxlength="200" placeholder="Add a note (optional)">' +
              '<div class="err" id="cErr"></div></div>' +
            '<div class="acts"><button type="button" class="btn" id="bAccept">Accept ' + nis(bid) + '</button><button type="button" class="btn dk wide" id="bSend">Send counter</button></div>'
          : '<p class="next">' + (st.last.final ? 'This is the ' + them + '’s final offer — accept it or decline.' : 'No more counters are possible here.') + '</p>' +
            '<div class="acts"><button type="button" class="btn" id="bDecline">Decline</button><button type="button" class="btn dk wide" id="bAccept">Accept ' + nis(bid) + '</button></div>');

      var amt = document.getElementById('cAmt'), range = document.getElementById('cRange'), pctEl = document.getElementById('cPct'), err = document.getElementById('cErr');
      function set(v, from) {
        v = Math.round(Number(v) || 0);
        if (from !== amt) amt.value = v;
        if (from !== range) range.value = Math.max(lo, Math.min(hi, v));
        pctEl.textContent = pct(v, ask) ? pct(v, ask) + ' of asking' : '';
        main.querySelectorAll('.picks button').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-v') === v); });
        err.textContent = v && (v < lo || v > hi) ? 'Choose between ' + nis(lo) + ' and ' + nis(hi) + '.' : '';
      }
      if (amt) {
        set(start);
        amt.addEventListener('input', function () { set(amt.value, amt); });
        range.addEventListener('input', function () { set(range.value, range); });
        main.addEventListener('click', function (e) {
          var s = e.target.closest('[data-step]'); if (s) { set(Math.max(lo, Math.min(hi, (+amt.value || start) + +s.getAttribute('data-step')))); return; }
          var p = e.target.closest('.picks [data-v]'); if (p) set(p.getAttribute('data-v'));
        });
        document.getElementById('bSend').addEventListener('click', function () {
          var r = N.act(n.id, 'offer', { amount: amt.value, note: document.getElementById('cNote').value, final: document.getElementById('cFinal').checked });
          if (!r.ok) { err.textContent = r.error; return; }
          N.simulate(true);
          go('counter.html?id=' + encodeURIComponent(n.id) + '&view=' + (r.accepted ? 'accepted' : 'sent'));
        });
      }
      document.getElementById('bAccept').addEventListener('click', function () {
        var r = N.act(n.id, 'accept');
        if (!r.ok) { if (err) err.textContent = r.error; else alert(r.error); return; }
        go('counter.html?id=' + encodeURIComponent(n.id) + '&view=accepted');
      });
      var dec = document.getElementById('bDecline');
      if (dec) dec.addEventListener('click', function () { var r = N.act(n.id, 'decline'); if (r.ok) go(listUrl); });
    }

    if (view === 'accepted') paintAccepted();
    else if (view === 'sent') paintSent();
    else paintCounter();
  })();
  </script>
  <script src="assets/line-icons.js"></script>
</body>
</html>
