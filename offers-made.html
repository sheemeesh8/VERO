<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — My Offers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }
        .page-cover { display: none; }
        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10.00px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }
        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }
        .side-image { display: none; }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 12.50px; color: #6b6b66; letter-spacing: 0.5px; }

        .offers-head { display: flex; align-items: baseline; gap: 14px; margin: 52px 0 26px; }
        .card-label { font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; }
        .offers-head .card-label { font-size: 16.67px; letter-spacing: 3px; color: #1c1c1c; }
        @media (max-width: 600px) { .offers-head .card-label { font-size: 13.33px; } }
        .offers-note { font-size: 10.00px; letter-spacing: 0.5px; color: #9a9a95; }

        /* ===== Depop-style offer cubes (identical to Offers Received) ===== */
        .offers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 720px) { .offers-grid { grid-template-columns: 1fr; } }
        .oc-date { color: #9a9a95; }
        .offer-cube { border: 1px solid #000; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
        .oc-top { display: flex; gap: 16px; align-items: center; }
        .oc-img {
            width: 66px; height: 66px; flex: 0 0 auto; border: 1px solid #000;
            display: flex; align-items: center; justify-content: center; font-size: 28.33px;
            background: #f4f4f2; overflow: hidden;
        }
        .oc-img img { width: 100%; height: 100%; object-fit: cover; }
        .oc-info { min-width: 0; flex: 1; }
        .oc-name { font-size: 13.33px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .oc-prices { display: flex; gap: 16px; margin-top: 10px; }
        .oc-ask { font-size: 10.83px; color: #6b6b66; }
        .oc-your { font-size: 10.83px; font-weight: 600; color: #1c1c1c; }
        .oc-your b { font-weight: 600; }

        .oc-others { border-top: 1px solid #eee; padding-top: 12px; }
        .oc-others-label { font-size: 8.33px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a9a95; margin-bottom: 8px; }
        .oc-other { display: flex; justify-content: space-between; font-size: 10.83px; color: #6b6b66; padding: 3px 0; }
        .oc-other .amt { font-weight: 500; color: #1c1c1c; }
        .oc-other.top .amt { color: #1f8f4e; }

        .offers-empty { font-size: 11.67px; color: #9a9a95; padding: 8px 0; }

        .oc-actions { display: flex; gap: 10px; }
        .oc-accept, .oc-decline {
            border: 1px solid #000; cursor: pointer; font-family: inherit;
            font-size: 9.17px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 20px; border-radius: 999px; transition: background 0.2s, color 0.2s, opacity 0.2s;
        }
        .oc-accept { background: #000; color: #fff; }
        .oc-accept:hover { opacity: 0.82; }
        .oc-decline { background: #fff; color: #1c1c1c; }
        .oc-decline:hover { background: #f0f0f0; }
        .oc-resolved {
            align-self: flex-start; font-size: 9.17px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 18px; border-radius: 999px;
        }
        .oc-resolved.accepted { background: #e8f5ec; color: #1f8f4e; border: 1px solid #bfe4cd; }
        .oc-resolved.declined { background: #f4eaea; color: #b23b3b; border: 1px solid #e6cccc; }
        .oc-resolved.countered { background: #f3efe6; color: #9a7d2e; border: 1px solid #e6dcc2; }
        .oc-openchat { display: inline-block; margin-top: 10px; font-size: 10.5px; letter-spacing: 0.5px;
            color: #1c1c1c; text-decoration: none; border-bottom: 1px solid #1c1c1c; padding-bottom: 2px; }
        .oc-openchat:hover { opacity: 0.6; }
        .oc-buyer { font-size: 10.83px; color: #6b6b66; }
        .oc-buyer b { font-weight: 600; color: #1c1c1c; }
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
    <script src="assets/footer.js"></script>
    <style id="heading-font-override">
      h1:not(#zzzz):not(#zzzz):not(#zzzz), h2:not(#zzzz):not(#zzzz):not(#zzzz), [class*="title"]:not(#zzzz):not(#zzzz):not(#zzzz), [class*="Title"]:not(#zzzz):not(#zzzz):not(#zzzz) { font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif !important; }
    </style>
    <style id="aharoni-headings">h1:not(#zz):not(#zz):not(#zz),h2:not(#zz):not(#zz):not(#zz),[class*="title"]:not(#zz):not(#zz):not(#zz),[class*="Title"]:not(#zz):not(#zz):not(#zz){font-family:'Aharoni CLM','Segoe UI',sans-serif !important;}</style>
</head>
<body>
    <!-- Embedded inside profile.html (?embed=1): the page title + back button are
         hidden — the title is shown in the profile hero instead. -->
    <script>if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');</script>
    <style>
        html.embed .back, html.embed .head-title, html.embed .head-sub { display: none !important; }
        html.embed .wrap { padding-top: 40px; }
        /* Minimal redesign (soft hairline cards, quiet chrome) — same as Offers Received. */
        .offer-cube {
            border: 1px solid #ecebe7; border-radius: 18px; padding: 22px;
            background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 10px 34px rgba(0,0,0,0.045);
        }
        .offer-cube img, .offer-cube .offer-thumb, .offer-cube [class*="thumb"] { border-color: #ecebe7 !important; border-radius: 12px; }
        .offer-cube button { border-radius: 999px; }
        @media (max-width: 720px) { .offers-grid { gap: 16px; } }
        html.is-embed .sticky-head, html.embed .sticky-head { display: none !important; }
    </style>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back old-back" href="index.html">&#8592; Back</a>
    <style id="sticky-page-head">
        .old-back { display: none !important; }
        .sticky-head { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px; padding: calc(env(safe-area-inset-top, 0px) + 54px) 20px 20px; background: rgba(255,255,255,0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #ececea; }
        .sh-back { width: 44px; height: 44px; border: 1px solid #e2e0da; border-radius: 50%; background: none; display: grid; place-items: center; cursor: pointer; color: #111; flex: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
        .sh-back svg { width: 22px; height: 22px; }
        .sh-back:hover { background: #111; color: #fff; border-color: #111; }
        .sh-title { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; color: #1b1916; }
    </style>
    <header class="sticky-head">
        <button class="sh-back" type="button" aria-label="Back" onclick="(window.history.length > 1 ? window.history.back() : (location.href='index.html'))">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="sh-title">Negotiation</span>
    </header>

    <div class="wrap">
        <h1 class="head-title" style="display:none">My Offers</h1>
        <p class="head-sub">Pieces you've made an offer on — track and negotiate.</p>

        <div class="offers-head">
            <div class="card-label" style="margin:0;">Your offers</div>
            <div class="offers-note" id="madeNote">Offers you've sent to sellers</div>
        </div>
        <div class="offers-grid" id="madeGrid"></div>
    </div>

    <script>
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const nis = n => '₪' + Math.round(n).toLocaleString('en-US');
        const H = 3600 * 1000, D = 24 * H;
        const timeAgo = ms => {
            if (!ms) return '';
            const d = Math.floor((Date.now() - ms) / 1000);
            if (d < 60) return 'now';
            if (d < 3600) return Math.floor(d / 60) + 'm';
            if (d < 86400) return Math.floor(d / 3600) + 'h';
            return Math.floor(d / 86400) + 'd';
        };
        const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

        // ===== Offers you've sent — your side of the negotiation =====
        // Persisted to vero_sent_offers so counter/withdraw decisions stick.
        let myOffers = readJSON('vero_sent_offers', null);
        if (!Array.isArray(myOffers) || !myOffers.length) {
            myOffers = [
                { name: 'Wool coat',    icon: '🧥', seller: 'Maya L.',   askPrice: 269, offer: 230, at: Date.now() - 4 * H, status: 'pending' },
                { name: 'Raw denim',    icon: '👖', seller: 'Omer T.',   askPrice: 129, offer: 100, at: Date.now() - 9 * H, status: 'pending' },
                { name: 'Silk scarf',   icon: '🧣', seller: 'Noa B.',    askPrice: 210, offer: 175, at: Date.now() - 1 * D, status: 'countered', counter: 195 },
                { name: 'Leather tote', icon: '👜', seller: 'Daniel K.', askPrice: 540, offer: 480, at: Date.now() - 2 * D, status: 'accepted' },
                { name: 'Knit sweater', icon: '🧶', seller: 'Shira P.',  askPrice: 180, offer: 120, at: Date.now() - 3 * D, status: 'declined' },
            ];
        }
        const madeGrid = document.getElementById('madeGrid');
        const saveMade = () => { try { localStorage.setItem('vero_sent_offers', JSON.stringify(myOffers)); } catch (e) {} };

        function render() {
            const pending = myOffers.filter(o => o.status === 'pending' || o.status === 'countered').length;
            document.getElementById('madeNote').textContent =
                `${myOffers.length} offer${myOffers.length === 1 ? '' : 's'} · ${pending} in progress`;
            if (!myOffers.length) {
                madeGrid.innerHTML = '<div class="offers-empty">You haven\'t made any offers yet.</div>';
                return;
            }
            madeGrid.innerHTML = myOffers.map((o, i) => {
                const pct = o.askPrice ? Math.round((o.offer / o.askPrice) * 100) : 0;
                let action;
                if (o.status === 'pending') {
                    action = `<div class="oc-actions">
                            <button class="oc-accept" data-mact="counter" data-i="${i}">Counter offer</button>
                            <button class="oc-decline" data-mact="withdraw" data-i="${i}">Withdraw</button>
                        </div>`;
                } else if (o.status === 'countered') {
                    action = `<div class="oc-resolved countered">Seller countered ${nis(o.counter)}</div>
                        <div class="oc-actions" style="margin-top:2px">
                            <button class="oc-accept" data-mact="acceptcounter" data-i="${i}">Accept ${nis(o.counter)}</button>
                            <button class="oc-decline" data-mact="counter" data-i="${i}">Counter again</button>
                        </div>`;
                } else if (o.status === 'accepted') {
                    action = `<div class="oc-resolved accepted">Accepted ✓</div>
                        <a class="oc-openchat" href="chats.html">Arrange pickup in chat →</a>`;
                } else {
                    action = `<div class="oc-resolved declined">Declined</div>`;
                }
                return `
                    <div class="offer-cube" data-i="${i}">
                        <div class="oc-top">
                            <div class="oc-img">${o.icon || '🛍️'}</div>
                            <div class="oc-info">
                                <div class="oc-name">${o.name || 'Item'}</div>
                                <div class="oc-buyer">To <b>${o.seller}</b> · ${timeAgo(o.at)} · <span class="oc-date">${fmtDate(o.at)}</span></div>
                                <div class="oc-prices">
                                    <span class="oc-ask">Asking ${nis(o.askPrice)}</span>
                                    <span class="oc-your">Your offer <b>${nis(o.offer)}</b></span>
                                </div>
                            </div>
                        </div>
                        <div class="oc-others">
                            <div class="oc-others-label">Offer strength</div>
                            <div class="oc-other${pct >= 85 ? ' top' : ''}"><span>${pct}% of the asking price</span><span class="amt">${nis(o.offer)}</span></div>
                        </div>
                        ${action}
                    </div>`;
            }).join('');
        }
        render();

        madeGrid.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-mact]');
            if (!btn) return;
            const i = Number(btn.dataset.i);
            const act = btn.dataset.mact;
            if (act === 'withdraw') { myOffers.splice(i, 1); }
            else if (act === 'acceptcounter') { myOffers[i].offer = myOffers[i].counter; myOffers[i].status = 'accepted'; }
            else if (act === 'counter') {
                const cur = myOffers[i].offer;
                const v = prompt('Your new offer (₪):', cur);
                if (v == null) return;
                const num = Number(String(v).replace(/[^\d.]/g, ''));
                if (!num) return;
                myOffers[i].offer = num; myOffers[i].status = 'pending'; myOffers[i].at = Date.now();
            }
            saveMade();
            render();
        });
    </script>
    <script src="assets/didone-hairline.js"></script>
    <script src="nav-icons.js" defer></script>
</body>
</html>
