<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Conversation Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #171716; --muted: #8a877f; --faint: #b6b3ab; --line: #ecebe6; --paper: #f7f6f2; --unread: #d99c2b; --green: #2fbf5e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; }
svg.i { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.3; fill: none; flex: none; }
.p1 { background: url('../women-hero.jpg') center 25% / cover; }
.p3 { background: url('../art-hero.jpg') center / cover; }

/* header */
.hd { background: #fff; display: flex; align-items: center; gap: 14px; padding: 48px 20px 16px; border-bottom: 1px solid var(--line); }
.av { width: 46px; height: 46px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 22px; flex: none; position: relative; }
.av.ph { border-radius: 8px; width: 42px; height: 52px; }
.av.ph.p1 { background: url('../women-hero.jpg') center 25% / cover; }
.av .on { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid #fff; }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-size: 15px; font-weight: 400; }
.who small { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }

/* feed */
.feed { flex: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.b { max-width: 72%; padding: 12px 16px; font-size: 12.5px; line-height: 1.5; border-radius: 20px; }
.b small { display: block; font-size: 8.5px; opacity: 0.5; margin-top: 5px; }
.b.s { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.b.m { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.day { align-self: center; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); margin: 4px 0; }
.sys { align-self: center; font-size: 10px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }

/* composer */
.cmp { background: #fff; display: flex; gap: 10px; align-items: center; padding: 14px 20px 30px; border-top: 1px solid var(--line); }
.cmp .in { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 13px 18px; font-size: 12px; color: var(--faint); }
.cmp .send { background: var(--ink); color: #fff; border-radius: 999px; padding: 13px 24px; font-size: 10px; letter-spacing: 1.5px; }
.cmp .rnd { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.cmp .rnd.dk { background: var(--ink); color: #fff; }
.cmp .rnd.ln { border: 1px solid var(--line); }

/* V1 current dark pill */
.pill { margin: 0 20px 12px; background: #1a1c2b; color: #fff; border-radius: 999px; display: flex; justify-content: space-around; padding: 18px 10px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

/* V2 pinned product strip */
.strip { background: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.strip .th { width: 40px; height: 50px; border-radius: 6px; flex: none; }
.strip .tx { flex: 1; font-size: 12px; } .strip .tx small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.strip .btn { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 14px; }
.dots { font-size: 20px; color: var(--ink); letter-spacing: 1px; }

/* V3 offer card */
.offer { align-self: flex-start; width: 78%; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.offer .im { height: 120px; }
.offer .bd { padding: 14px 16px; }
.offer .k { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.offer .pr { font-family: 'Bodoni Moda', serif; font-size: 28px; margin-top: 4px; }
.offer .pr s { font-family: 'Poppins'; font-size: 12px; color: var(--faint); margin-left: 8px; }
.offer .acts { display: flex; border-top: 1px solid var(--line); }
.offer .acts span { flex: 1; text-align: center; padding: 13px 0; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
.offer .acts span + span { border-left: 1px solid var(--line); }
.offer .acts .ok { background: var(--ink); color: #fff; }

/* V4 editorial */
.c4 { background: #fff; }
.c4 .hd { flex-direction: column; align-items: flex-start; gap: 4px; padding: 54px 28px 18px; border-bottom: 1px solid var(--ink); }
.c4 .hd .ttl { font-family: 'Bodoni Moda', serif; font-size: 30px; }
.c4 .hd .ttl i { font-style: italic; }
.c4 .hd .k { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); display: flex; width: 100%; justify-content: space-between; }
.c4 .feed { padding: 10px 28px; gap: 0; }
.msg { padding: 16px 0; border-bottom: 1px solid var(--line); }
.msg .n { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.msg p { font-size: 14px; line-height: 1.55; margin-top: 6px; }
.msg.me p { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 16px; }
.c4 .cmp { border-top: 1px solid var(--ink); }
.c4 .cmp .in { border: none; background: none; border-radius: 0; padding-left: 0; font-size: 14px; }
.c4 .cmp .send { background: none; color: var(--ink); padding: 0; font-size: 10px; letter-spacing: 2.5px; border-bottom: 1px solid var(--ink); border-radius: 0; }

/* V5 quick replies */
.qr { display: flex; gap: 8px; padding: 0 20px 12px; overflow: hidden; }
.qr span { flex: none; font-size: 11px; border: 1px solid #d8d3ca; background: #fff; border-radius: 999px; padding: 9px 14px; white-space: nowrap; }

/* V6 dark */
.c6 { background: #111110; color: #f2efe8; }
.c6 .hd { background: #111110; border-color: #262523; }
.c6 .av { background: #1f1e1c; } .c6 .av .on { border-color: #111110; }
.c6 .who small { color: #6f6c66; }
.c6 .b.s { background: #1f1e1c; border-color: #2a2926; color: #f2efe8; }
.c6 .b.m { background: #e8b04d; color: #111; }
.c6 .day { color: #6f6c66; }
.c6 .cmp { background: #111110; border-color: #262523; }
.c6 .cmp .in { background: #1d1c1a; border-color: #262523; color: #6f6c66; }
.c6 .cmp .rnd.dk { background: #e8b04d; color: #111; }

/* V7 icon row under header */
.iconrow { background: #fff; display: flex; justify-content: space-around; padding: 12px 10px 14px; border-bottom: 1px solid var(--line); }
.iconrow div { text-align: center; font-size: 8.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.iconrow i { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 6px; color: var(--ink); font-style: normal; }
.iconrow i svg { width: 19px; height: 19px; }
.iconrow .y i { background: var(--ink); color: #fff; border-color: var(--ink); }

/* V8 status stepper */
.step { background: #fff; padding: 14px 24px 16px; border-bottom: 1px solid var(--line); }
.step .ln { display: flex; align-items: center; }
.step .ln i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--faint); background: #fff; flex: none; }
.step .ln i.d { background: var(--ink); border-color: var(--ink); }
.step .ln i.c { border-color: var(--unread); box-shadow: 0 0 0 4px rgba(217,156,43,0.18); }
.step .ln b { flex: 1; height: 1.5px; background: var(--line); }
.step .ln b.d { background: var(--ink); }
.step .lb { display: flex; justify-content: space-between; margin-top: 8px; font-size: 8.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }
.step .lb .on { color: var(--ink); }
.step .cta { margin-top: 12px; display: flex; gap: 8px; }
.step .cta span { flex: 1; text-align: center; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 0; border-radius: 999px; border: 1px solid var(--ink); }
.step .cta span.k { background: var(--ink); color: #fff; }

/* V9 bottom sheet actions */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 14px 24px 34px; box-shadow: 0 -10px 30px rgba(0,0,0,0.12); z-index: 3; }
.sheet .g { width: 40px; height: 4px; border-radius: 2px; background: #e6e1d8; margin: 0 auto 16px; }
.sheet .r { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.sheet .r:last-child { border: none; }
.sheet .r small { margin-left: auto; color: var(--faint); font-size: 16px; }
.dim { position: absolute; inset: 0; background: rgba(20,18,14,0.35); z-index: 2; }
</style>
</head>
<body>
<h1>Chat — מסך שיחה</h1>
<p class="sub">9 עיצובים למסך השיחה עצמו (אחרי שנכנסים לצ׳אט)</p>
<div class="grid" id="grid"></div>

<script>
var CHEV = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var BACKL = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
var USER = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
var TAG = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/></svg>';
var CHECK = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
var X = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var PLUS = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var SEND = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function hd(extra, av) { return '<div class="hd">' + (av || '<div class="av">👜<span class="on"></span></div>') + '<div class="who"><b>Leather Tote</b><small>Luxe Atelier · online</small></div>' + (extra || CHEV) + '</div>'; }
var MSGS = '<div class="day">Today</div>' +
  '<div class="b s">New bags arriving this week.<small>22:07</small></div>' +
  '<div class="b m">Is the leather tote still available?<small>22:10</small></div>' +
  '<div class="b s">Yes! Only one left in tan.<small>22:12</small></div>' +
  '<div class="b m">Could you do ₪480?<small>22:13</small></div>';
function feed(inner) { return '<div class="feed">' + (inner || MSGS) + '</div>'; }
var CMP = '<div class="cmp"><span class="in">Write a message…</span><span class="send">SEND</span></div>';
var CMP2 = '<div class="cmp"><span class="rnd ln">' + PLUS + '</span><span class="in">Write a message…</span><span class="rnd dk">' + SEND + '</span></div>';
function scr(cls, inner) { return '<div class="screen ' + (cls || '') + '">' + inner + '</div>'; }

var OPTS = [
  ['V1 · הקיים', 'הדר עם אווטאר, בועות על רקע שמנת, פס כהה עם Profile / View item / Sold / Not sold מעל שדה ההודעה.',
   scr('', hd() + feed() + '<div class="pill"><span>Profile</span><span>View item</span><span>Sold ✓</span><span>Not sold</span></div>' + CMP)],

  ['V2 · המוצר נעוץ למעלה', 'פס דק מתחת להדר עם תמונת המוצר, מחיר וכפתור "View". Sold / Not sold עוברים לתפריט ⋯ בהדר. נקי יותר למטה.',
   scr('', hd('<span class="dots">⋯</span>') + '<div class="strip"><span class="th p1"></span><div class="tx">Leather Tote<small>₪540 · Luxe Atelier</small></div><span class="btn">View</span></div>' + feed() + CMP2)],

  ['V3 · כרטיס הצעה בשיחה', 'הצעת מחיר מופיעה כרטיס בתוך השיחה עם תמונה, מחיר בסריף וכפתורי Accept / Counter / Decline.',
   scr('', hd() + feed('<div class="day">Today</div><div class="b m">Is the leather tote still available?<small>22:10</small></div>' +
     '<div class="offer"><div class="im p1"></div><div class="bd"><div class="k">Counter offer</div><div class="pr">₪500<s>₪540</s></div></div><div class="acts"><span>Decline</span><span>Counter</span><span class="ok">Accept</span></div></div>') + CMP2)],

  ['V4 · מגזין', 'בלי בועות: כל הודעה שורה עם שם ושעה, ההודעות שלי בסריף נטוי. כותרת גדולה בסריף. הכי עריכתי.',
   scr('c4', '<div class="hd"><div class="k"><span>Luxe Atelier</span><span>' + 'online' + '</span></div><div class="ttl">Leather <i>Tote</i></div></div>' +
     feed('<div class="msg"><div class="n"><span>Luxe Atelier</span><span>22:07</span></div><p>New bags arriving this week.</p></div>' +
       '<div class="msg me"><div class="n"><span>You</span><span>22:10</span></div><p>Is the leather tote still available?</p></div>' +
       '<div class="msg"><div class="n"><span>Luxe Atelier</span><span>22:12</span></div><p>Yes! Only one left in tan.</p></div>' +
       '<div class="msg me"><div class="n"><span>You</span><span>22:13</span></div><p>Could you do ₪480?</p></div>') + CMP)],

  ['V5 · תשובות מהירות', 'שורת צ׳יפים מעל שדה ההודעה: "Still available?", "Make an offer", "Shipping?", "Sold ✓" — לחיצה אחת ונשלח.',
   scr('', hd() + feed() + '<div class="qr"><span>Make an offer</span><span>Shipping?</span><span>Sold ✓</span><span>Not sold</span></div>' + CMP2)],

  ['V6 · כהה', 'מצב לילה: רקע כמעט שחור, הבועות שלי בזהב, של המוכר באפור כהה.',
   scr('c6', hd() + feed() + CMP2)],

  ['V7 · אייקונים מתחת להדר', 'ארבעה עיגולים עם אייקון ותווית מתחת להדר: Profile / Item / Sold / Not sold. לא תופס מקום ליד המקלדת.',
   scr('', hd() + '<div class="iconrow"><div><i>' + USER + '</i>Profile</div><div><i>' + TAG + '</i>Item</div><div class="y"><i>' + CHECK + '</i>Sold</div><div><i>' + X + '</i>Not sold</div></div>' + feed() + CMP2)],

  ['V8 · סטטוס עסקה', 'פס התקדמות למעלה: Offer → Agreed → Paid → Shipped, עם הפעולה הבאה ככפתור. מתאים לשיחה שהיא עסקה.',
   scr('', hd('', '<div class="av ph p1"></div>') + '<div class="step"><div class="ln"><i class="d"></i><b class="d"></b><i class="c"></i><b></b><i></i><b></b><i></i></div>' +
     '<div class="lb"><span class="on">Offer</span><span class="on">Agreed</span><span>Paid</span><span>Shipped</span></div>' +
     '<div class="cta"><span>Not sold</span><span class="k">Mark as sold</span></div></div>' + feed() + CMP2)],

  ['V9 · פעולות בגיליון', 'רק כפתור + ליד שדה ההודעה. לחיצה פותחת גיליון מלמטה עם כל הפעולות: פרופיל, מוצר, הצעת מחיר, נמכר / לא נמכר.',
   scr('', hd() + feed() + CMP2 + '<div class="dim"></div><div class="sheet"><div class="g"></div>' +
     '<div class="r">' + USER + 'Seller profile<small>›</small></div><div class="r">' + TAG + 'View item<small>›</small></div>' +
     '<div class="r">₪&nbsp; Make an offer<small>›</small></div><div class="r">' + CHECK + 'Mark as sold<small>›</small></div><div class="r">' + X + 'Not sold<small>›</small></div></div>')]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
