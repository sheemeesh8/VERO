<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Personal Area</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c;
            overflow: hidden;
            background: #e6e6e3;
        }

        /* Centre the row of rectangles in the page so shrinking their height
           leaves even air above and below. */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== The four long equal rectangles, spanning the full page width ===== */
        .panels {
            display: grid;
            grid-template-columns: repeat(4, 1fr);   /* four equal columns = full width */
            width: 100%;
            height: 100vh;                           /* rectangles span the full screen height */
        }
        .panel {
            position: relative;
            height: 100%;
            background: linear-gradient(180deg, #edece9 0%, #dededa 55%, #cfcfca 100%);
            overflow: hidden;
        }
        .panel + .panel { box-shadow: -1px 0 0 rgba(0,0,0,0.10); }
        .panel:nth-child(2) { background: linear-gradient(180deg, #eae9e6 0%, #d9d9d5 55%, #cbcbc6 100%); }
        .panel:nth-child(3) { background: linear-gradient(180deg, #ecebe8 0%, #dcdcd8 55%, #cececa 100%); }
        .panel:nth-child(4) { background: linear-gradient(180deg, #e8e7e4 0%, #d6d6d2 55%, #c8c8c3 100%); }

        /* Giant thin word running off the bottom edge of every rectangle. */
        .panel-word {
            position: absolute;
            left: -2px;
            bottom: -14px;
            font-size: clamp(34px, 3.6vw, 68px);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #23231f;
            line-height: 0.9;
            white-space: nowrap;
        }

        /* Tagline at the top of the second rectangle. */
        .tagline {
            position: absolute;
            top: 22px; left: 24px; right: 24px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.35;
            color: #2a2a26;
        }

        /* ===== Centre feature, living inside the third rectangle ===== */
        .feature-img {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #dfe2df 0%, #c8ccc6 100%);
            background-size: cover;
            background-position: center;
        }
        .feature-inner {
            position: absolute;
            top: 26px; left: 22px; right: 22px;
            text-align: left;
            z-index: 2;
        }
        .feature-head {
            font-size: clamp(20px, 1.9vw, 32px);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.06;
            color: #1c1c1c;
        }
        .feature-cta {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 22px;
            border: 1.4px solid #1c1c1c;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: transparent;
            color: #1c1c1c;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        .feature-cta:hover { background: #1c1c1c; color: #fff; }
        .asterisk {
            position: absolute;
            top: 52%; right: 26%;
            font-size: 34px;
            color: #111;
            z-index: 2;
        }

        /* ===== Top bar: brand mark left, expand glyph right ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 34px;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-glyph {
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            position: relative;
        }
        .brand-glyph::after {
            content: "";
            position: absolute; top: 5px; left: 7px;
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            background: #e6e6e3;
        }
        .brand-name { font-size: 17px; font-weight: 500; letter-spacing: 0.5px; }
        .expand { width: 26px; height: 26px; cursor: pointer; color: #1c1c1c; }
        .expand svg { width: 100%; height: 100%; }

        @media (max-width: 720px) {
            body { overflow: auto; }
            .stage { position: relative; }
            .panels { grid-template-columns: 1fr; height: auto; }
            .panel { height: 40vh; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- The four long equal rectangles across the full width of the page -->
        <div class="panels">
            <div class="panel">
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <div class="tagline">Where Form<br>and Function Unite</div>
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <div class="feature-img"></div>
                <div class="feature-inner">
                    <div class="feature-head">Elevating Comfort<br>With Every Curve</div>
                    <button class="feature-cta">Explore Experience</button>
                </div>
                <div class="asterisk">&#10033;</div>
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <span class="panel-word">Our</span>
            </div>
        </div>
    </div>

    <!-- Top bar -->
    <div class="topbar">
        <div class="brand">
            <span class="brand-glyph"></span>
            <span class="brand-name">Visionary</span>
        </div>
        <div class="expand" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
            </svg>
        </div>
    </div>

    <!-- Manual edit mode (✎ button bottom-left, or Ctrl+Shift+E) — same editor as the feed. -->
    <script src="vero-editor.js"></script>
</body>
</html>
