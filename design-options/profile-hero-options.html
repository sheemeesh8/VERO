<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Hero Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --line: #e4e1dc; --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 600px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 780px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); }
.hero { background: url('../hero-beach.jpg') center / cover no-repeat; }
.av { background: url('../women-hero.jpg') 50% 30% / cover no-repeat; }
.v { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--v); color: #fff; font-size: 11px; font-weight: 700; vertical-align: middle; }
.stat b { display: block; font-size: 22px; font-weight: 700; } .stat span { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.lnk { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid currentColor; padding-bottom: 2px; }

/* A — current (full hero) */
.a .hero { position: absolute; inset: 0; }
.a .top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 2; display: flex; justify-content: space-between; align-items: center; color: #fff; }
.a .top b { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; }
.a .eye { position: absolute; top: 72px; left: 26px; z-index: 2; color: #fff; }
.a .wash { position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.75)); }
.a .info { position: absolute; left: 26px; right: 26px; bottom: 26px; z-index: 2; color: #fff; }
.a .nm { font-size: 34px; } .a .bio { font-size: 13px; opacity: 0.85; margin-top: 6px; }
.a .arow { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
.a .arow .av { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #fff; flex: none; }
.a .arow .links { display: flex; flex-direction: column; gap: 8px; color: #fff; }
.a .stats { display: flex; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.3); color: #fff; }
.a .stats .stat { flex: 1; } .a .stats .stat span { color: rgba(255,255,255,0.7); }

/* B — cover banner + white card */
.b .hero { height: 220px; position: relative; }
.b .top { position: absolute; top: 30px; left: 26px; right: 26px; display: flex; justify-content: space-between; color: #fff; }
.b .top b { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.b .av { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; position: absolute; left: 50%; transform: translateX(-50%); top: 172px; }
.b .body { text-align: center; padding: 56px 26px 0; }
.b .nm { font-size: 26px; } .b .bio { font-size: 13px; color: #555; margin-top: 6px; }
.b .btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
.b .btns span { border: 1px solid #111; padding: 10px 18px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.b .btns span.fill { background: #111; color: #fff; }
.b .stats { display: flex; margin: 24px 26px 0; padding-top: 18px; border-top: 1px solid var(--line); }
.b .stats .stat { flex: 1; text-align: center; }

/* C — centered avatar on hero */
.c .hero { position: absolute; inset: 0 0 240px 0; }
.c .wash { position: absolute; inset: 0 0 240px 0; background: rgba(0,0,0,0.25); }
.c .top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 2; display: flex; justify-content: space-between; color: #fff; }
.c .top b { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.c .av { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #fff; position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 2; }
.c .body { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; padding: 70px 26px 0; text-align: center; }
.c .nm { font-size: 28px; } .c .bio { font-size: 13px; color: #555; margin-top: 6px; }
.c .stats { display: flex; margin-top: 22px; }
.c .stats .stat { flex: 1; } .c .edit { margin-top: 22px; display: inline-block; border: 1px solid #111; padding: 12px 28px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* D — split hero + dark panel (like current but reorganised) */
.d .hero { position: absolute; inset: 0; }
.d .wash { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0,0,0,0.85)); }
.d .top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 2; display: flex; justify-content: space-between; color: #fff; }
.d .top b { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.d .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; color: #fff; padding: 0 26px 28px; }
.d .av { width: 88px; height: 88px; border-radius: 50%; border: 2px solid #fff; }
.d .row { display: flex; align-items: flex-end; gap: 16px; }
.d .nm { font-size: 30px; } .d .bio { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.d .stats { display: flex; gap: 26px; margin-top: 18px; }
.d .stats .stat b { font-size: 18px; } .d .stats .stat span { color: rgba(255,255,255,0.7); }
.d .cta { margin-top: 18px; display: flex; gap: 10px; }
.d .cta span { flex: 1; text-align: center; border: 1px solid rgba(255,255,255,0.6); padding: 12px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.d .cta span.fill { background: #fff; color: #111; border-color: #fff; }

/* E — fine line, small cover */
.e .hero { height: 150px; filter: grayscale(0.2); }
.e .top { position: absolute; top: 30px; left: 26px; right: 26px; display: flex; justify-content: space-between; color: #fff; }
.e .top b { font-size: 17px; letter-spacing: 3px; text-transform: uppercase; }
.e .av { width: 84px; height: 84px; border-radius: 50%; border: 1px solid #111; margin: -42px 26px 0; position: relative; }
.e .body { padding: 14px 26px 0; }
.e .nm { font-size: 24px; } .e .bio { font-size: 12px; color: var(--muted); margin-top: 4px; }
.e .edit { float: right; margin-top: -40px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #111; padding: 9px 16px; }
.e .stats { display: flex; margin: 22px 26px 0; padding-top: 16px; border-top: 1px solid #111; }
.e .stats .stat { flex: 1; } .e .stats .stat b { font-weight: 400; font-size: 20px; }

/* F — magazine, giant name */
.f .hero { position: absolute; inset: 0; }
.f .wash { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.8)); }
.f .top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 2; color: #fff; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; }
.f .av { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #fff; position: absolute; top: 120px; left: 26px; z-index: 2; }
.f .info { position: absolute; left: 26px; right: 26px; bottom: 30px; z-index: 2; color: #fff; }
.f .kick { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.8; }
.f .nm { font-size: 48px; line-height: 0.98; margin-top: 8px; }
.f .stats { display: flex; gap: 28px; margin-top: 20px; }
.f .stats .stat b { font-size: 18px; } .f .stats .stat span { color: rgba(255,255,255,0.7); }

/* G — blurred cover, big centered avatar */
.g .cover { position: absolute; inset: 0 0 320px 0; background: url('../hero-beach.jpg') center / cover; filter: blur(14px) brightness(0.8); transform: scale(1.1); }
.g .top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 2; display: flex; justify-content: space-between; color: #fff; }
.g .top b { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.g .av { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #fff; position: absolute; left: 50%; top: 110px; transform: translateX(-50%); z-index: 2; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
.g .body { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #fff; padding: 76px 26px 0; text-align: center; }
.g .nm { font-size: 28px; } .g .bio { font-size: 13px; color: #555; margin-top: 6px; }
.g .stats { display: flex; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
.g .stats .stat { flex: 1; }
</style>
</head>
<body>
<h1>Profile — פרופיל עם הירו</h1>
<p class="sub">עמוד הפרופיל · 7 כיווני עיצוב (A = הקיים)</p>
<div class="grid" id="grid"></div>

<script>
var EYE = '<svg class="ic" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
var ARR = '<svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var statsW = '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div>';

var OPTS = [
  ['A · הירו מלא (הקיים)', 'תמונת רקע על כל המסך, השם והסטטיסטיקות למטה מעליה, אווטאר וקישורי שינוי. לנקודת השוואה.',
   '<div class="screen a"><div class="hero"></div><div class="wash"></div>' +
   '<div class="top"><b>My Profile</b>' + ARR + '</div><div class="eye">' + EYE + '</div>' +
   '<div class="info"><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div>' +
   '<div class="arow"><span class="av"></span><div class="links"><span class="lnk">Change background</span><span class="lnk">Change profile picture</span></div></div>' +
   statsW + '</div></div>'],

  ['B · באנר + כרטיס לבן', 'באנר קאבר קצר למעלה, אווטאר עגול חוצה אותו, והשם/ביו/כפתורים ממורכזים על רקע לבן. סגנון רשת חברתית מוכר.',
   '<div class="screen b"><div class="hero"><div class="top"><b>My Profile</b>' + ARR + '</div></div><span class="av"></span>' +
   '<div class="body"><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div>' +
   '<div class="btns"><span class="fill">Edit profile</span><span>Share</span></div></div>' + statsW + '</div>'],

  ['C · אווטאר ממורכז', 'קאבר למעלה, אווטאר גדול ממורכז שחוצה אותו, והכול מתחתיו ממורכז עם כפתור Edit. נקי וסימטרי.',
   '<div class="screen c"><div class="hero"></div><div class="wash"></div><div class="top"><b>My Profile</b>' + ARR + '</div>' +
   '<span class="av"></span><div class="body"><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div>' + statsW + '<span class="edit lnk" style="border-bottom:none">Edit profile</span></div></div>'],

  ['D · הירו + פאנל כהה', 'קרוב לקיים אבל מסודר: אווטאר ושם בשורה אחת, סטטיסטיקות בשורה, ושני כפתורים (Edit / Share) בתחתית.',
   '<div class="screen d"><div class="hero"></div><div class="wash"></div><div class="top"><b>My Profile</b>' + ARR + '</div>' +
   '<div class="panel"><div class="row"><span class="av"></span><div><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div></div></div>' +
   '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div>' +
   '<div class="cta"><span class="fill">Edit profile</span><span>Share</span></div></div></div>'],

  ['E · קו דק', 'קאבר נמוך, אווטאר קטן בקו דק, כפתור Edit בצד, וסטטיסטיקות על קו דק. מינימלי ו"גלריה".',
   '<div class="screen e"><div class="hero"><div class="top"><b>My Profile</b>' + ARR + '</div></div><span class="av"></span>' +
   '<div class="body"><span class="edit">Edit</span><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div></div>' +
   '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div></div>'],

  ['F · מגזין, שם ענק', 'השם ענק בתחתית ההירו, אווטאר קטן בפינה, וסטטיסטיקות כשורה. דרמטי ואופנתי.',
   '<div class="screen f"><div class="hero"></div><div class="wash"></div><div class="top">My Profile</div><span class="av"></span>' +
   '<div class="info"><div class="kick">Seller · Verified</div><div class="nm">My<br>Profile</div>' +
   '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div></div></div>'],

  ['G · קאבר מטושטש + אווטאר גדול', 'רקע מטושטש, אווטאר גדול מאוד ממורכז עם צל, והפרטים על כרטיס לבן. מדגיש את תמונת הפרופיל.',
   '<div class="screen g"><div class="cover"></div><div class="top"><b>My Profile</b>' + ARR + '</div><span class="av"></span>' +
   '<div class="body"><div class="nm">My Profile <span class="v">v</span></div><div class="bio">A short line about you.</div>' + statsW + '</div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
