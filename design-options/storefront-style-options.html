<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Archivo+Black&family=Special+Elite&family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Rubik:wght@400;600;800&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 36px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 284px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.sw { display: flex; gap: 5px; margin-top: 8px; direction: ltr; justify-content: flex-end; }
.sw i { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }

.phone { width: 284px; height: 740px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 1040px; transform: scale(0.7); transform-origin: 0 0; position: relative; overflow: hidden; }
.th { display: block; background: #ddd center / cover no-repeat; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 70px; padding: 32px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; z-index: 4; }
.money { font-variant-numeric: tabular-nums; }

/* ===== S1 · Minimal Noir ===== */
.s1 { background: #fff; color: #111; font-family: 'Inter', sans-serif; }
.s1 .hero { height: 520px; position: relative; color: #fff; }
.s1 .hero .th { position: absolute; inset: 0; filter: grayscale(1) contrast(1.05); }
.s1 .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.75)); }
.s1 .hero .in { position: absolute; left: 22px; right: 22px; bottom: 22px; z-index: 1; }
.s1 .nm { font-weight: 200; font-size: 40px; letter-spacing: 1px; }
.s1 .bio { font-size: 12px; opacity: 0.8; margin: 4px 0 16px; }
.s1 .row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 14px; font-size: 11px; letter-spacing: 1px; }
.s1 .row b { font-weight: 600; font-size: 15px; display: block; }
.s1 .fol { border: 1px solid #fff; border-radius: 999px; padding: 8px 20px; font-size: 10px; letter-spacing: 3px; }
.s1 .tabs { display: flex; gap: 22px; padding: 20px 22px 12px; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #999; border-bottom: 1px solid #eee; }
.s1 .tabs b { color: #111; font-weight: 400; }
.s1 .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-top: 2px; }
.s1 .g .th { aspect-ratio: 3/4; filter: grayscale(1); }

/* ===== S2 · Editorial ===== */
.s2 { background: #f6f1e8; color: #2a251d; font-family: 'Cormorant Garamond', Georgia, serif; }
.s2 .mast { padding: 84px 22px 0; text-align: center; }
.s2 .k { font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 4px; text-transform: uppercase; color: #9a7d52; }
.s2 .nm { font-family: 'Bodoni Moda', Didot, serif; font-size: 52px; line-height: 0.95; margin: 10px 0 8px; font-weight: 400; }
.s2 .nm i { font-style: italic; }
.s2 .bio { font-style: italic; font-size: 17px; color: #6b5f4d; }
.s2 .rule { height: 1px; background: #2a251d; margin: 18px 22px; position: relative; }
.s2 .rule::after { content: '✦'; position: absolute; left: 50%; top: -9px; margin-left: -9px; background: #f6f1e8; padding: 0 6px; font-size: 11px; color: #9a7d52; }
.s2 .feat { margin: 0 22px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.s2 .feat .th { height: 300px; filter: sepia(0.15); }
.s2 .feat .tx { align-self: end; }
.s2 .feat .tx h3 { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
.s2 .feat .tx p { font-size: 14px; color: #6b5f4d; margin: 8px 0; line-height: 1.35; }
.s2 .feat .tx .p { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 1px; }
.s2 .g2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 22px 22px 0; }
.s2 .g2 .th { aspect-ratio: 3/4; filter: sepia(0.15); }
.s2 .g2 .c { font-size: 14px; margin-top: 6px; } .s2 .g2 .c span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; color: #9a7d52; }

/* ===== S3 · Atelier (arched, warm) ===== */
.s3 { background: #efe6da; color: #3b2f25; font-family: 'Cormorant Garamond', Georgia, serif; }
.s3 .mono { width: 84px; height: 84px; border-radius: 50%; border: 1px solid #3b2f25; margin: 90px auto 0; display: flex; align-items: center; justify-content: center; font-family: 'Bodoni Moda', serif; font-size: 34px; font-style: italic; }
.s3 .nm { text-align: center; font-size: 30px; letter-spacing: 6px; text-transform: uppercase; margin-top: 14px; font-weight: 500; }
.s3 .est { text-align: center; font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: #8c7560; margin-top: 4px; }
.s3 .bio { text-align: center; font-style: italic; font-size: 16px; margin: 12px 40px 0; color: #6b5848; }
.s3 .btns { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
.s3 .btns span { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; padding: 11px 20px; border: 1px solid #3b2f25; border-radius: 999px; }
.s3 .btns span.f { background: #3b2f25; color: #efe6da; }
.s3 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; margin: 28px 22px 0; }
.s3 .g .th { aspect-ratio: 3/4; border-radius: 999px 999px 4px 4px; filter: sepia(0.2); }
.s3 .g .c { text-align: center; font-size: 15px; margin-top: 8px; } .s3 .g .c span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 1px; color: #8c7560; }

/* ===== S4 · Street drop ===== */
.s4 { background: #fff; color: #111; font-family: 'Inter', sans-serif; }
.s4 .bar { position: absolute; top: 70px; left: 0; right: 0; height: 30px; background: #ff5a1f; color: #fff; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 12px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; }
.s4 .nm { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 66px; line-height: 0.88; text-transform: uppercase; padding: 120px 18px 0; letter-spacing: -1px; }
.s4 .meta { display: flex; gap: 10px; padding: 14px 18px 0; align-items: center; }
.s4 .av { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #111; }
.s4 .meta small { font-size: 11px; font-weight: 600; flex: 1; }
.s4 .fol { background: #111; color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 12px; padding: 10px 18px; text-transform: uppercase; transform: rotate(-2deg); }
.s4 .drop { margin: 20px 18px 0; border: 3px solid #111; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 6px 6px 0 #111; }
.s4 .drop b { font-family: 'Archivo Black', sans-serif; font-size: 20px; text-transform: uppercase; }
.s4 .drop .cd { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff5a1f; font-variant-numeric: tabular-nums; }
.s4 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 24px 18px 0; }
.s4 .c { position: relative; border: 3px solid #111; }
.s4 .c .th { aspect-ratio: 1/1.15; }
.s4 .c:nth-child(odd) { transform: rotate(-1.5deg); } .s4 .c:nth-child(even) { transform: rotate(1.5deg); margin-top: 16px; }
.s4 .c .p { position: absolute; left: -6px; bottom: 10px; background: #ff5a1f; color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 14px; padding: 4px 10px; }
.s4 .c .st { position: absolute; right: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: #111; color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 9px; display: flex; align-items: center; justify-content: center; transform: rotate(14deg); text-align: center; line-height: 1; }

/* ===== S5 · Vintage thrift ===== */
.s5 { background: #e8dcc6; color: #3a2e22; font-family: 'Special Elite', 'Courier New', monospace;
  background-image: radial-gradient(rgba(80,60,30,0.08) 1px, transparent 1px); background-size: 5px 5px; }
.s5 .sign { margin: 92px 22px 0; border: 2px solid #3a2e22; padding: 14px; text-align: center; position: relative; }
.s5 .sign::before { content: ''; position: absolute; inset: 4px; border: 1px dashed #3a2e22; }
.s5 .nm { font-size: 25px; letter-spacing: 2px; }
.s5 .sign small { display: block; font-size: 11px; margin-top: 6px; }
.s5 .stamp { position: absolute; right: -16px; top: -34px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid #b5452f; color: #b5452f; font-size: 9px; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(16deg); line-height: 1.2; background: rgba(232,220,198,0.8); }
.s5 .note { font-family: 'Caveat', cursive; font-size: 24px; text-align: center; margin: 16px 30px 0; transform: rotate(-2deg); color: #5a4632; }
.s5 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; margin: 24px 22px 0; }
.s5 .pol { background: #fbf8f1; padding: 8px 8px 30px; box-shadow: 0 6px 14px rgba(0,0,0,0.18); position: relative; }
.s5 .pol:nth-child(odd) { transform: rotate(-3deg); } .s5 .pol:nth-child(even) { transform: rotate(2.5deg); }
.s5 .pol .th { aspect-ratio: 1/1.1; filter: sepia(0.45) contrast(0.95); }
.s5 .pol .cap { position: absolute; left: 10px; bottom: 6px; font-family: 'Caveat', cursive; font-size: 19px; }
.s5 .pol .tag { position: absolute; right: -8px; top: 22px; background: #c8a77d; padding: 3px 8px 3px 12px; font-size: 12px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
.s5 .tape { position: absolute; left: 50%; top: -9px; width: 60px; height: 18px; margin-left: -30px; background: rgba(255,250,235,0.65); transform: rotate(-4deg); }

/* ===== S6 · Gallery ===== */
.s6 { background: #fafaf8; color: #222; font-family: 'Inter', sans-serif; }
.s6 .nm { font-weight: 200; font-size: 22px; letter-spacing: 8px; text-transform: uppercase; text-align: center; padding-top: 96px; }
.s6 .bio { text-align: center; font-size: 10px; letter-spacing: 2px; color: #999; margin-top: 8px; text-transform: uppercase; }
.s6 .navs { display: flex; justify-content: center; gap: 22px; font-size: 10px; letter-spacing: 2px; color: #999; text-transform: uppercase; margin-top: 26px; }
.s6 .navs b { color: #222; font-weight: 400; }
.s6 .work { margin: 40px 50px 0; }
.s6 .work .th { height: 360px; box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 14px 30px rgba(0,0,0,0.08); border: 10px solid #fff; }
.s6 .label { margin-top: 18px; font-size: 11px; line-height: 1.7; color: #555; }
.s6 .label b { font-weight: 600; color: #222; font-size: 12px; display: block; }
.s6 .label .p { margin-top: 6px; display: flex; justify-content: space-between; color: #222; }
.s6 .label .p span:last-child { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #222; }
.s6 .num { text-align: center; font-size: 10px; letter-spacing: 3px; color: #bbb; margin-top: 36px; }

/* ===== S7 · Playful Y2K ===== */
.s7 { background: linear-gradient(170deg, #f6e9ff 0%, #ffe3f1 45%, #e8f0ff 100%); color: #2b2147; font-family: 'Rubik', sans-serif; }
.s7 .card { margin: 86px 18px 0; background: rgba(255,255,255,0.7); border-radius: 28px; padding: 18px; text-align: center; box-shadow: 0 10px 30px rgba(123,92,214,0.15); position: relative; }
.s7 .av { width: 82px; height: 82px; border-radius: 50%; margin: -54px auto 0; border: 4px solid #fff; box-shadow: 0 0 0 3px #b28cff; }
.s7 .nm { font-weight: 800; font-size: 30px; margin-top: 8px; background: linear-gradient(90deg, #7b5cd6, #ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; }
.s7 .bio { font-size: 13px; color: #6a5d8a; margin-top: 2px; }
.s7 .pills { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
.s7 .pills span { background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.s7 .fol { display: block; margin-top: 14px; background: linear-gradient(90deg, #7b5cd6, #ff5fa2); color: #fff; border-radius: 999px; padding: 12px; font-weight: 600; font-size: 14px; }
.s7 .stk { position: absolute; font-size: 26px; }
.s7 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 18px 0; }
.s7 .c { background: #fff; border-radius: 22px; padding: 8px; box-shadow: 0 6px 16px rgba(123,92,214,0.12); position: relative; }
.s7 .c .th { aspect-ratio: 1/1.05; border-radius: 16px; }
.s7 .c .l { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 2px; font-size: 13px; font-weight: 600; }
.s7 .c .l span:last-child { background: #f1eaff; color: #7b5cd6; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
.s7 .c .hrt { position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #ff5fa2; }

/* ===== S8 · Luxe dark ===== */
.s8 { background: #0f2419; color: #efe9da; font-family: 'Cormorant Garamond', Georgia, serif; }
.s8 .hero { height: 380px; position: relative; }
.s8 .hero .th { position: absolute; inset: 0; filter: grayscale(0.4) brightness(0.55) sepia(0.3); }
.s8 .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,36,25,0) 40%, #0f2419); }
.s8 .id { text-align: center; margin-top: -90px; position: relative; z-index: 1; }
.s8 .crest { width: 54px; height: 54px; margin: 0 auto; border: 1px solid #c8a24a; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; }
.s8 .crest span { transform: rotate(-45deg); color: #c8a24a; font-family: 'Bodoni Moda', serif; font-size: 22px; font-style: italic; }
.s8 .nm { font-family: 'Bodoni Moda', serif; font-size: 36px; letter-spacing: 4px; margin-top: 16px; font-weight: 400; }
.s8 .bio { font-style: italic; font-size: 16px; color: #b9b19c; margin-top: 2px; }
.s8 .gold { height: 1px; background: linear-gradient(90deg, transparent, #c8a24a, transparent); margin: 18px 50px; }
.s8 .stats { display: flex; justify-content: center; gap: 34px; font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #b9b19c; text-align: center; }
.s8 .stats b { display: block; font-family: 'Bodoni Moda', serif; font-size: 20px; color: #efe9da; font-weight: 400; letter-spacing: 0; }
.s8 .fol { display: block; width: 150px; margin: 18px auto 0; text-align: center; border: 1px solid #c8a24a; color: #c8a24a; font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; padding: 12px; }
.s8 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; margin: 28px 22px 0; }
.s8 .g .th { aspect-ratio: 3/4; filter: grayscale(0.3) sepia(0.2); outline: 1px solid rgba(200,162,74,0.4); outline-offset: 4px; }
.s8 .g .c { text-align: center; margin-top: 12px; font-size: 16px; } .s8 .g .c span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; color: #c8a24a; margin-top: 2px; }
</style>
</head>
<body>
<h1>Storefront — סגנונות עיצוב</h1>
<p class="sub">8 סגנונות לחנות של המוכר: צבעים, טיפוגרפיה ואופן הצגת המוצרים · כל מוכר יוכל לבחור את הסגנון שמתאים לו</p>

<div class="grid" id="opts"></div>

<script>
var IM = {
  men: { img: '../men-hero.jpg', pos: '50% 30%' }, women: { img: '../women-hero.jpg', pos: '30% 40%' },
  cloth: { img: '../clothing-hero.jpg', pos: '50% 50%' }, beach: { img: '../hero-beach.jpg', pos: '50% 50%' },
  gal: { img: '../gallery-hero.jpg', pos: '50% 50%' }, mag: { img: '../magazine-hero.jpg', pos: '50% 50%' },
  art: { img: '../art-hero.jpg', pos: '50% 50%' }
};
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var L = [IM.men, IM.women, IM.cloth, IM.beach, IM.gal, IM.mag, IM.art, IM.men, IM.women];
var N = [['Wool Coat', 380], ['Linen Shirt', 120], ['Leather Bag', 240], ['Silk Scarf', 90], ['Denim Jacket', 210], ['Knit Vest', 140]];
var topBar = (c) => '<div class="top" style="color:' + c + '"><span>‹ Back</span><span>Share</span></div>';

var OPTS = [
  ['S1 · מינימל נואר', 'שחור-לבן נקי: תמונת קאבר בשחור לבן, שם דק, וגריד צפוף של 3 בשורה כמו אינסטגרם. הכי קרוב למה שיש היום, רק מלוטש.', ['#111', '#fff', '#888'],
   '<div class="screen s1">' + topBar('#fff') + '<div class="hero"><span class="th" ' + bg(IM.beach) + '></span><div class="in"><div class="nm">Studio Vero</div><div class="bio">Slow fashion, sourced in Tel Aviv.</div><div class="row"><div style="display:flex;gap:26px"><div><b>1.2k</b>Followers</div><div><b>42</b>Items</div><div><b>4.9</b>Rating</div></div><span class="fol">FOLLOW</span></div></div></div>' +
   '<div class="tabs"><b>Shop</b><span>Sold</span><span>Reviews</span><span>About</span></div><div class="g">' + L.map(i => '<span class="th" ' + bg(i) + '></span>').join('') + '</div></div>'],

  ['S2 · עריכתי', 'רקע קרם, כותרת Bodoni גדולה עם נטוי, ופריט "בכתבה" עם טקסט לצד התמונה. החנות נקראת כמו מגזין אופנה.', ['#f6f1e8', '#2a251d', '#9a7d52'],
   '<div class="screen s2">' + topBar('#2a251d') + '<div class="mast"><div class="k">The shop of</div><div class="nm">Studio <i>Vero</i></div><div class="bio">Slow fashion, sourced in Tel Aviv</div></div><div class="rule"></div>' +
   '<div class="feat"><span class="th" ' + bg(IM.women) + '></span><div class="tx"><div class="k">Piece of the week</div><h3>The Linen Shirt</h3><p>Worn twice, washed soft. The one you keep for summers.</p><div class="p">₪120 · Size M</div></div></div>' +
   '<div class="g2">' + N.slice(0, 3).map((n, k) => '<div><span class="th" ' + bg(L[k + 2]) + '></span><div class="c">' + n[0] + '<span>₪' + n[1] + '</span></div></div>').join('') + '</div></div>'],

  ['S3 · אטלייה', 'בז׳ חם, מונוגרמה בעיגול, שם באותיות רווחות ו"Est. 2019", ותמונות מוצר בצורת קשת. מרגיש כמו בוטיק קטן ומוקפד.', ['#efe6da', '#3b2f25', '#8c7560'],
