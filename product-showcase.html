<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
<script src="assets/motion.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="moravchick — straight fashion. A curated marketplace for pre-loved fashion and art. Discover unique pieces, chat with sellers and complete every sale safely in person.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Product</title>
    <script src="vero-theme.js"></script>
    <style>
        :root{
            --bg:#F0F0F0;        /* match the product-card gray ground */
            --sand:#F0F0F0;        /* section 1 tone (requested) */
            --panel:#ffffff;
            --ink:#1b1916;
            --muted:#44403b;
            --line:#ece8e1;
            --sale:#9a7d52;
            --hdr-h:64px;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html{scroll-behavior:smooth;scroll-snap-type:y mandatory;}
        html,body{height:100%;}
        body{
            background:var(--bg);
            color:var(--ink);
            font-family:'Arimo', 'Inter', sans-serif;
            -webkit-font-smoothing:antialiased;
            line-height:1.5;
        }
        .page{
            width:100%;max-width:480px;margin:0 auto;min-height:100%;
            background:var(--bg);position:relative;
        }

        /* ---------- sticky header ---------- */
        .topbar{
            position:fixed;top:0;left:50%;transform:translateX(-50%);
            width:100%;max-width:480px;z-index:80;height:var(--hdr-h);
            display:flex;align-items:center;justify-content:space-between;
            /* sits below the phone camera / status bar */
            padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 0;
            background:transparent;
            transition:background .3s ease, box-shadow .3s ease, border-color .3s ease;
            border-bottom:1px solid transparent;
        }
        /* becomes a solid "sticker" header once the page is scrolled */
        .topbar.stuck{
            background:rgba(255,255,255,.86);
            -webkit-backdrop-filter:saturate(180%) blur(14px);
            backdrop-filter:saturate(180%) blur(14px);
            border-bottom-color:var(--line);
            box-shadow:0 2px 14px rgba(0,0,0,.05);
        }
        .tb-ico{
            width:42px;height:42px;flex:0 0 auto;
            display:flex;align-items:center;justify-content:center;
            border:none;background:none;color:var(--ink);cursor:pointer;
            transition:opacity .2s;
        }
        .tb-ico:active{opacity:.5;}
        .tb-ico svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.25;fill:none;
            stroke-linecap:round;stroke-linejoin:round;}
        .tb-group{display:flex;align-items:center;gap:2px;}
        .tb-ico.heart.active svg{fill:var(--ink);}

        /* ---------- SECTION 1 — stacked image reveal ---------- */
        .hero{
            position:relative;background:var(--sand);overflow:hidden;
            height:100svh;height:100vh;
            scroll-snap-align:start;scroll-snap-stop:always;
        }
        /* the images are stacked absolutely; a transparent scroller on top drives
           each one sliding over the previous (smooth, transform-based) */
        .hero-stack{position:absolute;inset:0;z-index:1;}
        .st-slide{
            position:absolute;inset:0;background:var(--sand);
            display:flex;align-items:center;justify-content:center;
            will-change:transform;
        }
        .st-slide img{
            width:100%;height:100%;object-fit:cover;display:block;
            -webkit-user-drag:none;user-select:none;pointer-events:none;
        }
        /* slide 1: the product centered/pasted on the #F0F0F0 ground */
        .st-slide.on-sand{padding:8%;}
        .st-slide.on-sand img{
            width:auto;height:auto;max-width:80%;max-height:56svh;max-height:56vh;
            object-fit:contain;filter:drop-shadow(0 22px 30px rgba(0,0,0,.12));
        }
        /* transparent horizontal scroller that captures the swipe and provides the
           snap points; it sits above the images (which show through) */
        .hero-scroll{
            position:absolute;inset:0;z-index:6;
            display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
            scrollbar-width:none;-webkit-overflow-scrolling:touch;
            touch-action:pan-x pan-y;overscroll-behavior-x:contain;
        }
        .hero-scroll::-webkit-scrollbar{display:none;}
        .snap-cell{flex:0 0 100%;height:100%;scroll-snap-align:start;}

        /* info overlay — over the first image; fades out on the other slides so
           the photos show clean. pointer-events:none lets swipes pass through. */
        .hero-overlay{
            position:absolute;inset:0;z-index:5;pointer-events:none;
            transition:opacity .45s ease;
        }
        .hero-overlay.faded{opacity:0;}
        /* brand, name, then two facts and the price on one line — centred, and
           set by the script exactly midway between the header and the piece */
        .ov-main{
            position:absolute;left:22px;right:22px;
            top:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 9vh);transform:translateY(-50%);
            display:flex;flex-direction:column;align-items:center;text-align:center;
        }
        .brand-sub{
            font-size: 7.65px;font-weight:400;letter-spacing:3.4px;text-transform:uppercase;color:#3c3935;line-height:1.2;
        }
        .brand-name{
            margin-top:16px;font-family:'Archivo', 'Poppins', sans-serif;
            font-size: clamp(17px,5.27vw,22.1px);font-weight:300;letter-spacing:2.4px;
            text-transform:uppercase;line-height:1.15;color:var(--ink);
        }
        /* beat aharoni.css's site-wide font rule so the titles use the hero face */
        .brand-name:not(#zzzz):not(#zzzz):not(#zzzz),
        .det-brand:not(#zzzz):not(#zzzz):not(#zzzz){
            font-family:'Archivo', 'Poppins', sans-serif !important;
        }
        /* one quiet line: the facts and the price, spaced apart — no dots, no badge */
        .hero-specs{margin-top:20px;display:flex;align-items:baseline;justify-content:center;gap:8px 22px;flex-wrap:wrap;}
        .ov-spec{font-size: 8.5px;font-weight:400;letter-spacing:2.2px;text-transform:uppercase;color:#3c3935;line-height:1;white-space:nowrap;}
        .ov-spec:empty{display:none;}
        .ov-price{color:var(--ink);font-size: 9.78px;letter-spacing:1.6px;}
        .ov-price .was{color:var(--muted);text-decoration:line-through;margin-inline-start:8px;}
        .ov-price .off{display:none;}

        /* which photo is showing: a thin track with a dark mark (the product
           card's own indicator) and a small count; they stay on every slide */
        .hero-bar{position:absolute;z-index:7;left:22px;right:22px;bottom:calc(64px + env(safe-area-inset-bottom,0px));
            height:2px;background:rgba(27,25,22,.14);overflow:hidden;pointer-events:none;}
        .hero-bar span{display:block;height:100%;background:var(--ink);transition:transform .25s ease;}
        .hero-count{position:absolute;z-index:7;right:22px;bottom:calc(74px + env(safe-area-inset-bottom,0px));
            font-size: 8.5px;letter-spacing:2px;color:#6b665c;font-variant-numeric:tabular-nums;pointer-events:none;}
        .hero-count:empty{display:none;}

        /* scroll-to-details cue, centred at the very bottom */
        .scroll-cue{
            position:absolute;z-index:8;left:50%;transform:translateX(-50%);
            bottom:calc(14px + env(safe-area-inset-bottom,0px));
            display:inline-flex;align-items:center;gap:8px;padding:8px 10px;
            background:none;border:none;cursor:pointer;color:var(--ink);font-family:inherit;
            font-size: 8.5px;letter-spacing:2.4px;text-transform:uppercase;
            transition:opacity .2s;pointer-events:auto;
        }
        .scroll-cue:active{opacity:.55;}
        .scroll-cue svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.4;fill:none;
            stroke-linecap:round;stroke-linejoin:round;animation:bob 1.8s ease-in-out infinite;}
        @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

        /* ---------- SECTION 2 — the details ----------
           The same quiet hand as the first page: a centred heading, wide
           spacing, light type, hairlines only where they separate facts. */
        .details{
            background:#ffffff;
            min-height:100svh;min-height:100vh;
            padding:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 88px) 26px 44px;
            text-align:left;
            scroll-snap-align:start;
            display:flex;flex-direction:column;gap:38px;
        }
        .det-head{display:flex;flex-direction:column;align-items:center;text-align:center;}
        .det-sub{font-size: 7.65px;font-weight:400;letter-spacing:3.4px;text-transform:uppercase;color:#3c3935;}
        .det-brand{
            margin-top:16px;font-family:'Archivo', 'Poppins', sans-serif;
            font-size: clamp(17px,5.27vw,22.1px);font-weight:300;letter-spacing:2.4px;text-transform:uppercase;line-height:1.15;
        }
        .det-price{margin-top:20px;font-size: 9.78px;font-weight:400;letter-spacing:1.6px;color:var(--ink);}
        .det-price .was{color:var(--muted);text-decoration:line-through;margin-inline-start:8px;}
        .det-price .off{display:none;}
        .det-desc{font-size: 11.05px;line-height:1.9;letter-spacing:.3px;color:#6b665c;font-weight:300;text-align:center;}

        /* the facts: what it is on the left, the value on the right, a faint line between rows */
        .spec-table{display:flex;flex-direction:column;}
        .spec-row{
            display:flex;align-items:baseline;justify-content:space-between;gap:16px;
            padding:15px 0;border-bottom:1px solid #f1eee9;
        }
        .spec-row:last-child{border-bottom:0;}
        .spec-row.is-empty .sv{color:#9a958c;}
        .spec-row .sk{font-size: 7.65px;letter-spacing:2.6px;text-transform:uppercase;color:#44403b;}
        .spec-row .sv{font-size: 10.2px;letter-spacing:.6px;color:var(--ink);text-align:right;font-weight:300;}

        /* the two things to do */
        .det-cta{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .cta{
            height:48px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;
            font-size: 8.5px;font-weight:400;letter-spacing:2.6px;text-transform:uppercase;
            transition:background .2s,color .2s,opacity .2s;
        }
        .cta:active{opacity:.6;}
        .cta-solid{background:var(--ink);color:#fff;}

        /* seller: round picture, name, rating — the whole row opens the store */
        .det-seller{
            display:flex;align-items:center;gap:16px;margin-top:auto;padding:0;
            color:var(--ink);text-decoration:none;font-size: 11.05px;
        }
        .det-seller .s-avatar{width:46px;height:46px;flex:0 0 auto;border-radius:50%;object-fit:cover;background:#2a2a2a;}
        .det-seller .s-info{display:flex;flex-direction:column;gap:6px;min-width:0;}
        .det-seller .s-label{color:#44403b;letter-spacing:2.6px;font-size: 7.65px;text-transform:uppercase;}
        .det-seller .s-name{font-size: 11.05px;font-weight:400;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .det-seller .s-rating{margin-inline-start:auto;flex:none;font-size: 9.35px;letter-spacing:1px;color:#6b665c;white-space:nowrap;}
        .det-seller .s-chev{flex:none;color:#4d4b46;font-size: 13.6px;line-height:1;}

        /* ---------- SECTION 3 — more to look at ----------
           Three rows of the site's product card, each a sideways slider:
           similar pieces, recommended, and more from this seller. */
        .more{
            background:#ffffff;scroll-snap-align:start;
            min-height:100svh;min-height:100vh;
            padding:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 26px) 0 70px;
            display:flex;flex-direction:column;gap:44px;
        }
        .more[hidden], .more-part[hidden]{display:none;}
        .more-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 22px;margin-bottom:16px;}
        .more-h{font-size: 9.35px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink);}
        .more-n{font-size: 8.5px;letter-spacing:1.4px;color:var(--muted);}
        .more-rail{display:flex;gap:12px;overflow-x:auto;padding:0 22px;scroll-padding-left:22px;
            scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
        .more-rail::-webkit-scrollbar{display:none;}
        .more-rail > .product-card{flex:0 0 44%;width:44%;min-width:0;margin:0;scroll-snap-align:start;}

        /* ---------- secondary header — a bar under the topbar with the actions as
             text labels (matches the personal-area sub-nav) ---------- */
        .action-bar{
            position:fixed;left:0;right:0;top:calc(var(--hdr-h) + env(safe-area-inset-top,0px));z-index:60;
            display:flex;align-items:flex-end;justify-content:center;gap:28px;direction:ltr;
            padding:12px 16px 10px;box-sizing:border-box;overflow-x:auto;scrollbar-width:none;
            background:rgba(255,255,255,0.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
            border-bottom:1px solid #ececec;
            /* hidden until the details section is in view; slides down into place */
            opacity:0;transform:translateY(-100%);pointer-events:none;
            transition:opacity .3s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .action-bar::-webkit-scrollbar{display:none;}
        .action-bar.show{opacity:1;transform:none;pointer-events:auto;}
        .action-item{
            flex:none;position:relative;background:none;border:0;cursor:pointer;white-space:nowrap;
            color:#3c3935;font-family:inherit;font-weight:600;font-size: 10.2px;letter-spacing:1.4px;text-transform:uppercase;
            padding:0 2px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;
            transition:color .2s,border-color .2s;
        }
        .action-item svg{display:none;}
        .action-item:hover{color:#1b1916;}
        .action-item.primary{color:#1b1916;border-bottom-color:#1b1916;}
        .action-item.wish.active{color:#1b1916;}

        /* ---------- overlays / popups (unchanged) ---------- */
        /* ---------- dark glass-morphism popups ---------- */
        .overlay{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(8,8,8,.5);}
        .overlay.show{display:flex;animation:fade .2s ease;}
        @keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{
            width:100%;max-width:480px;color:#f2f0ee;
            background:rgba(22,20,19,.66);
            -webkit-backdrop-filter:saturate(160%) blur(26px);
            backdrop-filter:saturate(160%) blur(26px);
            border:1px solid rgba(255,255,255,.14);border-bottom:none;
            border-radius:24px 24px 0 0;
            box-shadow:0 -14px 44px rgba(0,0,0,.45);
            padding:26px 24px calc(26px + env(safe-area-inset-bottom));
            transform:translateY(100%);animation:rise .34s cubic-bezier(.2,.8,.2,1) forwards;}
        @keyframes rise{to{transform:translateY(0)}}
        .sheet-grip{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 20px;}
        .sheet h3{font-size: 13.6px;font-weight:400;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;text-align:left;color:#fff;}
        .sheet p.sub{font-size: 10.62px;color:rgba(255,255,255,.58);margin-bottom:20px;}
        .confirm-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;}
        .confirm-icon svg{width:26px;height:26px;stroke:#fff;stroke-width:1.25;fill:none;}
        .sheet.center{text-align:center;}
        .mini-card{display:flex;align-items:center;gap:12px;text-align:start;padding:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:20px;}
        .mini-card .mc-img{width:52px;height:60px;object-fit:contain;flex:0 0 auto;background:rgba(255,255,255,.06);border-radius:6px;}
        .mini-card .mc-name{font-weight:700;font-size: 11.9px;color:#fff;}
        .mini-card .mc-price{font-size: 11.05px;color:rgba(255,255,255,.6);margin-top:3px;}
        .field{display:flex;align-items:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:12px;padding:0 16px;height:54px;margin-bottom:14px;}
        .field .cur{color:rgba(255,255,255,.5);font-size: 14.45px;margin-inline-end:8px;}
        .field input{border:none;outline:none;background:transparent;font-family:inherit;font-size: 14.45px;font-weight:700;width:100%;color:#fff;}
        .field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.4);}
        textarea.field{height:auto;min-height:96px;padding:14px 16px;resize:none;font-size: 12.32px;font-weight:400;line-height:1.6;display:block;color:#fff;}
        .offer-quick{display:flex;gap:8px;margin-bottom:18px;}
        .offer-quick button{flex:1;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:transparent;font-family:inherit;font-size: 10.2px;font-weight:700;cursor:pointer;color:#f2f0ee;transition:background .2s,color .2s;}
        .offer-quick button:active{background:#fff;color:#141312;}
        .sheet-actions{display:flex;gap:11px;margin-top:4px;}
        .btn{width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;cursor:pointer;font-family:inherit;font-size: 10.2px;letter-spacing:2px;text-transform:uppercase;font-weight:400;border:1.2px solid rgba(255,255,255,.28);transition:background .2s,color .2s,opacity .2s;}
        .btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.25;fill:none;}
        .btn-primary{background:#fff;color:#141312;border-color:#fff;}
        .btn-primary:active{opacity:.8;}
        .btn-outline{background:transparent;color:#fff;}
        .btn-outline:active{background:rgba(255,255,255,.16);color:#fff;}
        .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:8px;}
        .share-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:inherit;color:#f2f0ee;}
        .share-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);}
        .share-ic svg{width:24px;height:24px;}
        /* keep the near-black brand marks (X, copy) visible on the dark glass */
        .share-ic svg [fill="#111010"]{fill:#f2f0ee;}
        .share-ic svg [stroke="#111010"]{stroke:#f2f0ee;}
        .share-item span{font-size: 9.35px;letter-spacing:.5px;color:rgba(255,255,255,.72);}
        .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size: 10.2px;letter-spacing:1px;z-index:400;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
        .toast.show{opacity:1;transform:translate(-50%,0);}
    </style>

<style id="vero-global-type">
/* VERO global typography: main titles in Bodoni, sub-headings + descriptions in serif.
   Buttons/nav keep their own fonts. */
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Playfair+Display:wght@400;500;600;700&display=swap');
h1, h2, [class*="-title"], [class*="Title"], .title {
  font-family: 'Archivo', 'Poppins', sans-serif !important;
}
h3, h4, h5, h6, p,
[class*="-desc"], [class*="Desc"], [class*="-sub"], [class*="subtitle"], [class*="Subtitle"] {
  font-family: 'Archivo', 'Poppins', sans-serif !important;
}
</style>
<style id="aharoni-headings">h1:not(#zz):not(#zz):not(#zz),h2:not(#zz):not(#zz):not(#zz),h3:not(#zz):not(#zz):not(#zz),h4:not(#zz):not(#zz):not(#zz),h5:not(#zz):not(#zz):not(#zz),h6:not(#zz):not(#zz):not(#zz),[class*="title"]:not(#zz):not(#zz):not(#zz),[class*="Title"]:not(#zz):not(#zz):not(#zz),[class*="heading"]:not(#zz):not(#zz):not(#zz),[class*="Heading"]:not(#zz):not(#zz):not(#zz),[class*="headline"]:not(#zz):not(#zz):not(#zz),[class*="Headline"]:not(#zz):not(#zz):not(#zz){font-family:'Arimo', 'Inter', sans-serif !important;}</style>

<body>
<div class="page">

    <!-- sticky header: back arrow + wishlist / cart / share -->
    <div class="topbar" id="topbar">
        <button class="tb-ico" onclick="openSheet('shareSheet')" aria-label="Share">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
        <button class="tb-ico" onclick="goBack()" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
    </div>

    <!-- ============ SECTION 1 — THE PIECE (cut-out first, then its photos) ============ -->
    <section class="hero">
        <div class="hero-stack" id="heroStack"></div>

        <!-- over the first image; fades out on the other slides -->
        <div class="hero-overlay" id="heroOverlay">
            <div class="ov-main" id="heroInfo">
                <div class="brand-sub" id="heroBrand">Company</div>
                <h1 class="brand-name" id="heroName">Product name</h1>
                <div class="hero-specs">
                    <span class="ov-spec" id="heroSize"></span>
                    <span class="ov-spec ov-mid" id="heroCond"></span>
                    <span class="ov-spec ov-price" id="heroPrice">—</span>
                </div>
            </div>
        </div>

        <div class="hero-count" id="heroCount" aria-hidden="true"></div>
        <div class="hero-bar" aria-hidden="true"><span id="heroMark"></span></div>
        <button class="scroll-cue" id="scrollCue" aria-label="See details">
            Details<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="hero-scroll" id="heroScroll"></div>
    </section>

    <!-- ============ SECTION 2 — THE DETAILS ============ -->
    <section class="details" id="details">
        <div class="det-part det-head">
            <div class="det-sub" id="detBrand">Company</div>
            <h2 class="det-brand" id="detName">Product name</h2>
            <div class="det-price" id="detPrice">₪0</div>
        </div>

        <p class="det-desc" id="detDesc"></p>

        <!-- The facts the listing has; rows are written by the script. -->
        <div class="det-part spec-table" id="specTable"></div>

        <div class="det-cta">
            <button class="cta cta-solid" type="button" onclick="addToCart()">Add to bag</button>
            <button class="cta" type="button" onclick="openSheet('offerSheet')">Make an offer</button>
        </div>

        <a class="det-seller" id="sellerRow" href="#">
            <img class="s-avatar" id="sellerAvatar" alt="" />
            <span class="s-info">
                <span class="s-label">Seller</span>
                <span class="s-name" id="sellerName">moravchick</span>
            </span>
            <span class="s-rating" id="sellerRating"></span>
            <span class="s-chev" aria-hidden="true">›</span>
        </a>
    </section>

    <!-- ============ SECTION 3 — MORE TO LOOK AT ============ -->
    <section class="more" id="more" hidden>
        <div class="more-part" id="moreSimilar" hidden>
            <div class="more-head"><h3 class="more-h">Similar pieces</h3><span class="more-n"></span></div>
            <div class="more-rail"></div>
        </div>
        <div class="more-part" id="moreRec" hidden>
            <div class="more-head"><h3 class="more-h">Recommended for you</h3><span class="more-n"></span></div>
            <div class="more-rail"></div>
        </div>
        <div class="more-part" id="moreSeller" hidden>
            <div class="more-head"><h3 class="more-h">More from <span id="moreSellerName"></span></h3><span class="more-n"></span></div>
            <div class="more-rail"></div>
        </div>
    </section>

    <!-- floating dark action pill -->
    <div class="action-bar">
        <button class="action-item wish" id="heartBtn" onclick="toggleWishlist()" aria-label="Add to wishlist">
            <svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>
            <span>Save</span>
        </button>
        <button class="action-item primary" onclick="addToCart()" aria-label="Add to bag">
            <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
            <span>Bag</span>
        </button>
        <button class="action-item" onclick="openSheet('offerSheet')" aria-label="Make an offer">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
            <span>Offer</span>
        </button>
        <button class="action-item" onclick="openSheet('msgSheet')" aria-label="Ask the seller">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Ask</span>
        </button>
    </div>
</div>

            <button class="btn btn-outline" onclick="closeSheet('confirmSheet')">Keep browsing</button>

    <div class="sheet">
        <div class="sheet-grip"></div>
        <h3>Share</h3>
        <p class="sub">Share this item with friends</p>
        <div class="share-grid" id="shareGrid"></div>
    </div>

<div class="toast" id="toast"></div>

<script>
    const params = new URLSearchParams(location.search);
    let product = { name:'Product name', price:120, desc:'', seller:'moravchick' };
    try{
        const raw = params.get('product');
        if(raw) product = Object.assign(product, JSON.parse(decodeURIComponent(raw)));
    }catch(e){ console.error(e); }

    if(window.veroApplyOverride) product = window.veroApplyOverride(product);

    const toNum = v => { const n = parseFloat(String(v==null?'':v).replace(/[^\d.]/g,'')); return isNaN(n)?0:n; };
    const fmt = p => '₪' + Number(toNum(p)).toFixed(2);

    const company    = product.company || product.brand || product.seller || 'moravchick';
    const sellerName = product.seller || 'moravchick';
    const rating     = Number(product.rating) || 4.5;
    const priceNum   = toNum(product.price);
    const isArt      = product.type === 'art';
    // The link that opened this page carries only the basics. The rest — the
    // description, size, fabric, colour, style and the piece's other photos —
    // is read from the catalogue when this piece is in it.
    const VC = window.veroCollections;
    let catalogue = [];
    try { catalogue = VC ? VC.allProducts() : []; } catch (e) {}
    const self = catalogue.find(p => p.name === product.name && p.seller === sellerName) || null;
    // The listing behind this piece; any field it lacks is filled from the demo
    // details by name (assets/demo-details.js), so the cart / wishlist's demo pieces
    // show a full spec table too. A real listing's own values always win.
    const listing = Object.assign({}, (self && self._raw) || {});
    // A piece you listed yourself shows exactly what you entered; a demo piece (or one
    // not in the catalogue) gets a full set: its own details, else worked-out ones.
    // Yours = in your listings or drafts (uploaded on product-upload), by id or name —
    // then only what you filled in shows; nothing is added.
    // Opened from My products: _own names the exact entry (vero_listings / vero_drafts + index).
    const ownRef = (() => {
        const o = product._own; if (!o || !/^vero_(listings|drafts)$/.test(o.k)) return null;
        try { const v = JSON.parse(localStorage.getItem(o.k)); return Array.isArray(v) && v[o.i] ? v[o.i] : null; } catch (e) { return null; }
    })();
    const ownListing = (() => {
        if (ownRef) return true;
        if (self && self._raw && !self._raw.demo) return true;
        if (/^l_/.test(String(product.id || listing.id || ''))) return true;
        const read = k => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
        return read('vero_listings').concat(read('vero_drafts')).some(l => l && ((product.id && l.id === product.id) || (l.title || l.name) === product.name));
    })();
    // Your own piece: show its upload exactly (its listing, not the catalogue's fill-ins).
    if (ownListing && !(self && self._raw && !self._raw.demo)) {
        const read = k => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
        const mine = ownRef || read('vero_listings').concat(read('vero_drafts')).find(l => l && ((product.id && l.id === product.id) || (l.title || l.name) === product.name));
        if (mine) Object.keys(listing).forEach(k => delete listing[k]), Object.assign(listing, mine);
    }
    // No made-up values: only a demo piece's own details (assets/demo-details.js).
    const demoFill = ownListing ? {} : ((window.veroDemoDetails || {})[product.name] || {});
    Object.keys(demoFill).forEach(k => { const v = listing[k]; if (v == null || v === '' || (Array.isArray(v) && !v.length)) listing[k] = demoFill[k]; });
    const desc = product.desc || product.description || listing.description || '';
    // A piece on sale shows its original price too.
    if (self && !product.onSale) {
        try { const d = VC.discountOf(listing); if (d.onSale) { product.onSale = true; product.originalPrice = d.original; } } catch (e) {}
    }

    const AUDIENCE = { men:'Men', women:'Women', kids:'Kids', unisex:'Unisex',
                       Men:'Men', Women:'Women', Kids:'Kids', Unisex:'Unisex' };
    const audience = AUDIENCE[(product.audience||product.gender||listing.gender||'').toString().toLowerCase()]
                     || product.audience || '';

    // Temporary placeholder icon (a simple garment) shown centered on the sand
    // ground when a product has no cover photo yet.
    const TEMP_ICON = 'data:image/svg+xml,' + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>" +
        "<path d='M23 7 L8 15 L13 26 L20 22 L20 57 L44 57 L44 22 L51 26 L56 15 L41 7 C41 13 23 13 23 7 Z' " +
        "fill='none' stroke='#c7c0b5' stroke-width='2' stroke-linejoin='round'/></svg>");
    const seed = encodeURIComponent(product.name || 'vero');
    // On-brand, deterministic placeholder slide (no network, no layout jump) used
    // when a listing has no extra photos — replaces the old random stock images.
    function placeholderSlide(label, tone) {
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 1200'>" +
            "<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'>" +
            "<stop offset='0' stop-color='" + (tone === 1 ? '#f4f2ee' : '#eceae4') + "'/>" +
            "<stop offset='1' stop-color='" + (tone === 1 ? '#e7e4dd' : '#dedbd3') + "'/>" +
            "</linearGradient></defs>" +
            "<rect width='900' height='1200' fill='url(#g)'/>" +
            "<path d='M340 300 L210 405 L275 520 L360 470 L360 940 L540 940 L540 470 L625 520 L690 405 L560 300 " +
            "C560 355 340 355 340 300 Z' fill='none' stroke='#c7c0b5' stroke-width='6' stroke-linejoin='round'/>" +
            "<text x='450' y='1050' text-anchor='middle' font-family='Poppins,Arial,sans-serif' " +
            "font-size='30' letter-spacing='6' fill='#b3ac9f'>" +
            String(label || 'MORAVCHICK').toUpperCase().replace(/[<>&]/g, '') + "</text></svg>";
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }

    // A circular seller avatar placeholder: the seller's initial on a dark
    // disc, legible against the black seller card.
    function avatarPlaceholder(name) {
        var ch = (String(name || 'M').trim()[0] || 'M').toUpperCase().replace(/[<>&]/g, '');
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'>" +
            "<defs><linearGradient id='av' x1='0' y1='0' x2='0' y2='1'>" +
            "<stop offset='0' stop-color='#4a4a4a'/><stop offset='1' stop-color='#262626'/>" +
            "</linearGradient></defs>" +
            "<rect width='96' height='96' fill='url(#av)'/>" +
            "<text x='48' y='63' text-anchor='middle' font-family='Poppins,Arial,sans-serif' " +
            "font-size='42' font-weight='400' fill='#eceae6'>" + ch + "</text></svg>";
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    // Your own piece's photos stay in storage (too big for the link): read them from its listing.
    const ownPhotos = ownListing ? listing : {};
    const rawPhotos = product.photos || ownPhotos.photos || {};
    const photoObj = Array.isArray(rawPhotos) ? { cover: rawPhotos[0], detail: rawPhotos[1], label: rawPhotos[2], angle: rawPhotos[3] } : rawPhotos;
    const uploaded = ['cover', 'detail', 'label', 'angle'].map(k => photoObj[k]).filter(Boolean);
    const cover = product.processed_cover || product.image || product.cover
        || product.original_cover || product.img || product.imageUrl || product.photo
        || ownPhotos.processed_cover || ownPhotos.image || ownPhotos.cover || ownPhotos.original_cover
        || photoObj.cover || null;
    const extra = (product.images && product.images.length) ? product.images : [];
    // Slide 1 = the product on the #F0F0F0 ground (the cover cut-out, or the
    // placeholder icon). The remaining slides are the other uploaded shots,
    // shown full-bleed; sample shots stand in when a product has none.
    const firstImg = cover || TEMP_ICON;
    const rest = [];
    [...uploaded, ...extra, ...((self && self.gallery) || [])].forEach(s => { if (s && s !== cover && !rest.includes(s)) rest.push(s); });
    if (!rest.length) {
        rest.push(placeholderSlide(product.seller || 'moravchick', 1),
                  placeholderSlide(product.category || 'Detail', 2));
    }
    const images = [firstImg, ...rest];
    const firstIsProduct = true; // slide 0 always uses the on-sand product treatment

    // ---- The facts this listing really has (nothing is filled in for it) ----
    const styleList  = [].concat(product.style || listing.style || []).filter(Boolean);
    const sSize      = product.size || listing.size || '';
    const sCondition = product.condition || listing.condition || '';
    const capW = t => String(t || '').replace(/(^|[\s-])([a-z])/g, (m, p, c) => p + c.toUpperCase());
    const rawCol = (product.collection || listing.collection || '').toString().trim();
    const sCollection = rawCol ? capW(rawCol) + (/collection$/i.test(rawCol) ? '' : ' Collection') : '';
    const sSeason = capW((product.season || listing.season || '').toString().trim());
    const sFabric    = product.fabric || product.material || listing.fabric || listing.material || '';
    const sColor     = product.color || listing.color || '';
    const sCategory  = (product.category && !/^(clothing|art)$/i.test(product.category)) ? product.category : (listing.itemType || '');

    // ---- SECTION 1 ----
    document.getElementById('heroBrand').textContent = company;
    document.getElementById('heroName').textContent  = product.name;
    // Hero price: shekel suffix, no decimals.
    let heroPriceHTML;
    if(product.onSale && product.originalPrice){
        const was = toNum(product.originalPrice), now = priceNum;
        const off = was>0 ? Math.round((1-now/was)*100) : 0;
        heroPriceHTML = (off>0?`<span class="off">-${off}%</span>`:'') +
            `${Math.round(now)}₪<span class="was">${Math.round(was)}₪</span>`;
    } else {
        heroPriceHTML = `${Math.round(priceNum)}₪`;
    }
    document.getElementById('heroPrice').innerHTML = heroPriceHTML;
    // Chevron scrolls down to the details section.
    document.getElementById('scrollCue').addEventListener('click', ()=>{
        document.getElementById('details').scrollIntoView({behavior:'smooth'});
    });
    // Section-1 stacked image reveal: a transparent scroller drives each image
    // sliding over the previous one (smooth, transform-based).
    const heroStack   = document.getElementById('heroStack');
    const heroScroll  = document.getElementById('heroScroll');
    const heroMark    = document.getElementById('heroMark');
    const heroCount   = document.getElementById('heroCount');
    const heroOverlay = document.getElementById('heroOverlay');
    heroStack.innerHTML = images.map((src,i)=>
        `<div class="st-slide${i===0?' on-sand':''}" style="z-index:${i}"><img src="${src}" alt="${i===0?product.name:''}" loading="${i===0?'eager':'lazy'}"></div>`).join('');
    heroScroll.innerHTML = images.map(()=>`<div class="snap-cell"></div>`).join('');
    heroMark.style.width = (100 / images.length) + '%';
    const stSlides = Array.prototype.slice.call(heroStack.children);
    function renderStack(){
        const w = heroScroll.clientWidth || 1;
        const p = heroScroll.scrollLeft / w;      // 0 .. images.length-1
        stSlides.forEach((el,i)=>{
            if(i===0) return;                     // base slide stays put
            const t = Math.min(1, Math.max(0, i - p));   // 1 = off right, 0 = covering
            el.style.transform = 'translateX(' + (t*100) + '%)';
        });
        const idx = Math.round(p);
        heroMark.style.transform = 'translateX(' + (Math.min(images.length-1, Math.max(0,p)) * 100) + '%)';
        heroCount.textContent = images.length>1 ? (idx+1) + ' / ' + images.length : '';
        heroOverlay.classList.toggle('faded', idx!==0);
    }
    renderStack();
    // The info block sits exactly midway between the header and the top of the piece.
    function placeInfo(){
        const info = document.getElementById('heroInfo');
        const img = heroStack.querySelector('.st-slide.on-sand img');
        const hero = heroStack.parentElement;
        if(!info || !img || !hero) return;
        const top = hero.getBoundingClientRect().top;
        const hdr = document.getElementById('topbar').getBoundingClientRect().height;
        const piece = img.getBoundingClientRect();
        if(!piece.height) return;
        const pieceTop = piece.top - top;
        if(pieceTop > hdr) info.style.top = (hdr + (pieceTop - hdr) / 2) + 'px';
    }
    placeInfo();
    (function(){ const img = heroStack.querySelector('.st-slide.on-sand img'); if(img) img.addEventListener('load', placeInfo); })();
    window.addEventListener('resize', placeInfo);
    window.addEventListener('load', placeInfo);
    let heroRaf=false;
    heroScroll.addEventListener('scroll',()=>{
        if(heroRaf) return; heroRaf=true;
        requestAnimationFrame(()=>{ heroRaf=false; renderStack(); });
    },{passive:true});
    window.addEventListener('resize', renderStack);
    // Two facts under the name: the first two the listing has.
    const heroFacts = [sSize && (isArt ? sSize : 'Size ' + sSize), sCondition, sFabric, sColor].filter(Boolean);
    document.getElementById('heroSize').textContent = heroFacts[0] || '';
    document.getElementById('heroCond').textContent = heroFacts[1] || '';

    // ---- SECTION 2 ----
    document.getElementById('detBrand').textContent = company;
    document.getElementById('detName').textContent  = product.name;
    const descEl = document.getElementById('detDesc');
    descEl.textContent = desc; descEl.hidden = !desc;

    let priceHTML;
    if(product.onSale && product.originalPrice){
        const was = toNum(product.originalPrice), now = priceNum;
        const off = was>0 ? Math.round((1-now/was)*100) : 0;
        priceHTML = (off>0?`<span class="off">-${off}%</span>`:'') +
            `${fmt(now)}<span class="was">${fmt(was)}</span>`;
    } else {
        priceHTML = fmt(priceNum);
    }
    document.getElementById('detPrice').innerHTML  = heroPriceHTML;

    const escHTML = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // Everything the seller filled in on upload (product-upload.html / product-upload-art.html).
    const listJoin = v => [].concat(v || []).filter(Boolean).join(', ');
    const sBrand  = (product.brand || listing.brand || '').toString().trim();
    const sCombo  = listJoin(product.colorCombo || listing.colorCombo);
    const sYear   = (product.year || listing.year || '').toString().trim();
    const sEdition = (product.edition || listing.edition || '').toString().trim();
    const sSigned = capW((product.signed || listing.signed || '').toString().trim());
    const specs = [[isArt ? 'Artist' : 'Brand', sBrand], ['Category', sCategory], ['Size', sSize],
                   [isArt ? 'Material' : 'Fabric', sFabric], ['Colour', listJoin(sColor)], ['Colour combination', sCombo],
                   ['Style', styleList.join(', ')], ['Condition', sCondition], ['For', audience],
                   // The collection and the season, under For.
                   ['Collection', sCollection], ['Season', sSeason],
                   ['Year', sYear]].concat(isArt ? [['Edition', sEdition], ['Signed', sSigned]] : [])
                   .filter(r => !(isArt && (r[0] === 'For' || r[0] === 'Season')));
    // All the details always show, as before; one that wasn't filled in reads "—".
    const specTable = document.getElementById('specTable');
    specTable.innerHTML = specs.map(r => `<div class="spec-row${r[1] ? '' : ' is-empty'}"><span class="sk">${r[0]}</span><span class="sv">${r[1] ? escHTML(r[1]) : '\u2014'}</span></div>`).join('');
    specTable.hidden = false;

    // seller row — the whole row opens the seller's pieces
    document.getElementById('sellerName').textContent = sellerName;
    document.getElementById('sellerRow').href = `index.html?seller=${encodeURIComponent(sellerName)}`;
    const sAvatar = document.getElementById('sellerAvatar');
    if (sAvatar) {
        const sellerPhoto = product.sellerPhoto || product.sellerAvatar || product.sellerIcon || product.storeLogo || null;
        sAvatar.src = sellerPhoto || avatarPlaceholder(sellerName);
        sAvatar.alt = sellerName;
    }
    document.getElementById('sellerRating').innerHTML = `★ ${rating.toFixed(1)}`;

    // ---- SECTION 3 — similar pieces, recommended, more from this seller ----
    (function more(){
        if (!VC || !catalogue.length) return;
        const artOf = p => !!((p._raw && p._raw.type === 'art') || p.collection === 'interiors');
        const kindOf = p => { const c = (p._raw && p._raw.itemType) || p.category || ''; return /^(clothing|art)$/i.test(c) ? '' : c; };
        const stylesOf = p => [].concat((p._raw && p._raw.style) || []);
        const others = catalogue.filter(p => p !== self && !(p.name === product.name && p.seller === sellerName));
        const sameWorld = others.filter(p => artOf(p) === isArt);
        const near = (a, b) => Math.abs(toNum(a.price) - priceNum) - Math.abs(toNum(b.price) - priceNum);

        // More from this seller.
        const fromSeller = others.filter(p => p.seller === sellerName);
        // Similar: the same kind of piece; when there are too few, the closest in price.
        let similar = sCategory ? sameWorld.filter(p => kindOf(p) === sCategory) : [];
        if (similar.length < 2) {
            const fill = sameWorld.filter(p => !similar.includes(p)).sort(near);
            similar = similar.concat(fill.slice(0, 6 - similar.length));
        }
        // Recommended: pieces that share a style, a fabric or a colour, best match
        // first — never ones already shown as similar.
        const score = p => {
            const r = p._raw || {};
            return stylesOf(p).filter(x => styleList.includes(x)).length * 2
                 + (sFabric && (r.fabric || r.material) === sFabric ? 1 : 0)
                 + (sColor && r.color === sColor ? 1 : 0)
                 + (audience && r.gender === audience ? 1 : 0)
                 + (p.promoted ? 0.5 : 0);
        };
        const recommended = sameWorld.filter(p => !similar.includes(p))
            .sort((a, b) => score(b) - score(a) || (b.createdAt || 0) - (a.createdAt || 0));

        const put = (id, list) => {
            const part = document.getElementById(id); if (!part) return 0;
            list = list.slice(0, 8);
            part.hidden = !list.length;
            if (!list.length) return 0;
            part.querySelector('.more-rail').innerHTML = list.map(p => VC.cardHTML(p)).join('');
            part.querySelector('.more-n').textContent = list.length + (list.length === 1 ? ' piece' : ' pieces');
            return list.length;
        };
        document.getElementById('moreSellerName').textContent = sellerName;
        const shown = put('moreSimilar', similar) + put('moreRec', recommended) + put('moreSeller', fromSeller);
        document.getElementById('more').hidden = !shown;
    })();

    // ---- sticky header state ----
    const topbar = document.getElementById('topbar');
    function onScroll(){ topbar.classList.toggle('stuck', window.scrollY > 24); }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();

    // ---- reveal the floating action bar only while section 2 is in view ----
    (function(){
        const bar = document.querySelector('.action-bar');
        const details = document.getElementById('details');
        if(!bar || !details) return;
        if('IntersectionObserver' in window){
            const io = new IntersectionObserver(es=>{
                es.forEach(e=> bar.classList.toggle('show', e.isIntersecting && e.intersectionRatio >= 0.35));
            }, {threshold:[0,0.35,0.6,1]});
            io.observe(details);
        } else {
            const check=()=>bar.classList.toggle('show', details.getBoundingClientRect().top < window.innerHeight*0.6);
            window.addEventListener('scroll', check, {passive:true}); check();
        }
    })();

    // ---------- sheets ----------
    function openSheet(id){
        const s = document.getElementById(id);
        s.querySelector('.sheet').style.animation='none';
        s.offsetHeight; s.querySelector('.sheet').style.animation='';
        s.classList.add('show');
        if(id==='offerSheet') setTimeout(()=>document.getElementById('offerInput').focus(),300);
    }
    function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
    window.openSheet=openSheet; window.closeSheet=closeSheet;
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show')); });

    function toast(msg){
        const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
        clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
    }

    function goBack(){ if(typeof goBackToStore==='function') return goBackToStore();
        if(document.referrer && history.length>1) history.back(); else location.href='index.html'; }
    window.goBack=goBack;
    function goCart(){ location.href='index.html?open=cart'; }
    window.goCart=goCart;

    // ---------- cart ----------
    const HOLD = 48*60*60*1000;
    function addToCart(){
        const cart = JSON.parse(localStorage.getItem('vero_cart')||'[]');
        const id = `${product.name}|${product.price}`;
        const now = Date.now();
        const ex = cart.find(i=>i.id===id);
        if(ex){ ex.qty+=1; ex.addedAt=now; ex.expiresAt=now+HOLD; }
        else cart.push({ id, name:product.name, price:product.price, seller:sellerName,
            icon:product.icon, category:product.category, type:product.type, rating:product.rating,
            qty:1, addedAt:now, expiresAt:now+HOLD });
        localStorage.setItem('vero_cart', JSON.stringify(cart));
        document.getElementById('confirmIcon').innerHTML='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
        document.getElementById('confirmTitle').textContent='Added to bag';
        document.getElementById('confirmSub').textContent='Held for you for 48 hours';
        document.getElementById('confirmImg').src=images[0];
        document.getElementById('confirmName').textContent=product.name;
        document.getElementById('confirmPrice').textContent=fmt(priceNum);
        document.getElementById('confirmCta').textContent='View bag';
        document.getElementById('confirmCta').onclick=goCart;
        openSheet('confirmSheet');
    }
    window.addToCart=addToCart;

    // ---------- wishlist ----------
    function isWished(){
        const wl=JSON.parse(localStorage.getItem('vero_wishlist')||'[]');
        return wl.some(i=>i.id===`${product.name}|${product.price}`);
    }
    function reflectWish(){
        const b=document.getElementById('heartBtn');
        if(b) b.classList.toggle('active', isWished());
    }
    function toggleWishlist(){
        const wl=JSON.parse(localStorage.getItem('vero_wishlist')||'[]');
        const id=`${product.name}|${product.price}`;
        const idx=wl.findIndex(i=>i.id===id);
        if(idx>=0){ wl.splice(idx,1); localStorage.setItem('vero_wishlist',JSON.stringify(wl));
            reflectWish(); toast('Removed from wishlist'); return; }
        wl.push({ id, name:product.name, price:product.price, seller:sellerName, icon:product.icon,
            category:product.category, type:product.type, rating:product.rating, addedAt:Date.now() });
        localStorage.setItem('vero_wishlist',JSON.stringify(wl));
        reflectWish();
        document.getElementById('confirmIcon').innerHTML='<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
        document.getElementById('confirmTitle').textContent='Added to wishlist';
        document.getElementById('confirmSub').textContent='Find it in your saved items';
        document.getElementById('confirmImg').src=images[0];
        document.getElementById('confirmName').textContent=product.name;
        document.getElementById('confirmPrice').textContent=fmt(priceNum);
        document.getElementById('confirmCta').textContent='View saved';
        document.getElementById('confirmCta').onclick=()=>location.href='saved.html';
        openSheet('confirmSheet');
    }
    window.toggleWishlist=toggleWishlist;
    reflectWish();

    // ---------- offer ----------
    document.getElementById('offerSub').textContent = `Asking ${fmt(priceNum)} · send the seller an offer`;
    const oq=document.getElementById('offerQuick');
    [0.7,0.8,0.9].forEach(f=>{
        const v=Math.max(1,Math.round(priceNum*f));
        const b=document.createElement('button');
        b.textContent=fmt(v).replace('.00','');
        b.onclick=()=>{ document.getElementById('offerInput').value=v; };
        oq.appendChild(b);
    });
    function sendOffer(){
        const input=document.getElementById('offerInput');
        const amount=parseFloat(input.value);
        if(!amount||amount<=0){ input.focus(); return; }
        const offers=JSON.parse(localStorage.getItem('vero_offers')||'[]');
        offers.push({ name:product.name, seller:sellerName, askPrice:priceNum, offer:amount, at:Date.now() });
        localStorage.setItem('vero_offers',JSON.stringify(offers));
        input.value=''; closeSheet('offerSheet');
        toast(`Offer sent: ${fmt(amount)}`);
    }
    window.sendOffer=sendOffer;

    // ---------- message the seller ----------
    document.getElementById('msgSub').textContent = `Message ${sellerName} about "${product.name}"`;
    function sendMessage(){
        const input=document.getElementById('msgInput');
        const text=(input.value||input.placeholder).trim();
        if(!text) return;
        const chats=JSON.parse(localStorage.getItem('vero_chats')||'{}');
        if(!chats[sellerName]) chats[sellerName]=[];
        chats[sellerName].push({ sender:'me', content:text, at:Date.now() });
        localStorage.setItem('vero_chats',JSON.stringify(chats));
        input.value=''; closeSheet('msgSheet');
        toast('Message sent to the seller');
    }
    window.sendMessage=sendMessage;

    // ---------- share ----------
    function shareUrl(){ return location.href; }
    const shareText = `${product.name} · ${company} — ${fmt(priceNum)} | moravchick`;
    const SHARES = [
        { key:'whatsapp', label:'WhatsApp',
          svg:'<path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.5-.3.3c-.1.1-.3.3-.1.6.1.3.7 1.1 1.4 1.8 1 .8 1.7 1.1 2 1.2.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/>',
          href:u=>`https://wa.me/?text=${encodeURIComponent(shareText+' '+u)}` },
        { key:'facebook', label:'Facebook',
          svg:'<path fill="#1877F2" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/>',
          href:u=>`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}` },
        { key:'telegram', label:'Telegram',
          svg:'<path fill="#0088cc" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 6.9l-1.6 7.6c-.1.5-.4.7-.9.4l-2.5-1.8-1.2 1.2c-.1.1-.3.2-.5.2l.2-2.6 4.7-4.2c.2-.2-.1-.3-.3-.1L8.4 13 6 12.2c-.5-.2-.5-.5.1-.8l9.3-3.6c.4-.2.8.1.6.9z"/>',
          href:u=>`https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(shareText)}` },
        { key:'x', label:'X',
          svg:'<path fill="#111010" d="M17.5 3h3l-6.6 7.5L21.7 21h-6l-4.7-6.1L5.5 21h-3l7-8L2.7 3h6.1l4.2 5.6L17.5 3zm-1 16h1.6L8.1 4.6H6.4L16.5 19z"/>',
          href:u=>`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(u)}` },
        { key:'instagram', label:'Instagram',
          svg:'<path fill="#E1306C" d="M12 7.2A4.8 4.8 0 1 0 12 16.8 4.8 4.8 0 0 0 12 7.2zm0 7.9A3.1 3.1 0 1 1 12 8.9a3.1 3.1 0 0 1 0 6.2zM17.9 6a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21 6.1c-.1-1.5-.4-2.8-1.5-3.9S17.1 1 15.6.9C14.1.8 9.9.8 8.4.9 6.9 1 5.6 1.3 4.5 2.4S3 4.5 2.9 6C2.8 7.5 2.8 11.7 2.9 13.2c.1 1.5.4 2.8 1.5 3.9s2.4 1.4 3.9 1.5c1.5.1 5.7.1 7.2 0 1.5-.1 2.8-.4 3.9-1.5s1.4-2.4 1.5-3.9c.1-1.5.1-5.7 0-7.1zm-2 8.7a3.1 3.1 0 0 1-1.8 1.8c-1.2.5-4.1.4-5.5.4s-4.3.1-5.5-.4a3.1 3.1 0 0 1-1.8-1.8c-.5-1.2-.4-4.1-.4-5.5s-.1-4.3.4-5.5a3.1 3.1 0 0 1 1.8-1.8C7.7 4 10.6 4.1 12 4.1s4.3-.1 5.5.4a3.1 3.1 0 0 1 1.8 1.8c.5 1.2.4 4.1.4 5.5s.1 4.3-.4 5.5z"/>',
          href:null },
        { key:'copy', label:'Copy link',
          svg:'<path fill="none" stroke="#111010" stroke-width="1.25" d="M9 9h9v9H9zM6 15H3V3h12v3"/>',
          href:null }
    ];
    const grid=document.getElementById('shareGrid');
    grid.innerHTML=SHARES.map((s,i)=>
        `<button class="share-item" data-i="${i}">
            <span class="share-ic"><svg viewBox="0 0 24 24">${s.svg}</svg></span>
            <span>${s.label}</span></button>`).join('');
    grid.addEventListener('click',e=>{
        const b=e.target.closest('.share-item'); if(!b) return;
        const s=SHARES[+b.dataset.i]; const u=shareUrl();
        if(s.href){ window.open(s.href(u),'_blank','noopener'); }
        else if(s.key==='instagram'){
            if(navigator.share){ navigator.share({title:product.name,text:shareText,url:u}).catch(()=>{}); }
            else { copyLink(u); toast('Link copied — paste into Instagram'); }
        } else { copyLink(u); toast('Link copied ✓'); }
    });
    function copyLink(u){
        if(navigator.clipboard) navigator.clipboard.writeText(u).catch(()=>{});
        else { const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    }
</script>
<script src="vero-editor.js"></script>
<script src="assets/didone-hairline.js"></script>
<script src="assets/line-icons.js"></script>
<script src="assets/card-flip.js?v=4" defer></script>
</body>
