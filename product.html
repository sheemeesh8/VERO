<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Product</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: white;
            direction: rtl;
            letter-spacing: 0px;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            font-style: normal;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            position: relative;
            width: 80px;
            height: 43px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 21.5px;
            padding: 3px;
            cursor: pointer;
            border: 2px solid white;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .toggle-circle {
            position: absolute;
            width: 37px;
            height: 37px;
            background: #2196F3;
            border-radius: 50%;
            transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            left: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            z-index: 1;
        }

        .toggle-switch.active-clothing .toggle-circle {
            left: 3px;
        }

        .toggle-switch.active-art .toggle-circle {
            left: 40px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .icon-wrap {
            position: relative;
            display: inline-flex;
        }

        .badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .badge.show {
            display: flex;
        }

        /* ==================== PAGE HERO (full-width) ==================== */
        .page-hero {
            width: 100vw;
            margin: 0;
            margin-left: -50vw;
            margin-right: -50vw;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            min-height: 500px;
            margin-top: 100px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            direction: rtl;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-slash {
            font-size: 48px;
            color: #004225;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 300;
            color: #000;
            margin: 0;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 1px;
        }

        .hero-description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }

        .hero-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
            border-radius: 2px;
        }

        .hero-btn:hover {
            background: #003319;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            border-radius: 4px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .container {
                padding: 0 20px;
            }
        }

        @media (max-width: 768px) {
            .header-container {
                grid-template-columns: auto 1fr auto;
                gap: 20px;
            }

            .header-left {
                display: none;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="toggle-switch active-clothing" id="categoryToggle" onclick="toggleSwitch()">
                    <div class="toggle-circle">C</div>
                </button>
                <span class="icon-wrap">
                    <button class="icon-btn" title="Wishlist" onclick="openWishlist()">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="stroke: white; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                    <span class="badge" id="wishlistBadge">0</span>
                </span>
                <span class="icon-wrap">
                    <button class="icon-btn" title="Cart" onclick="openCart()">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="stroke: white; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;">
                            <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                        </svg>
                    </button>
                    <span class="badge" id="cartBadge">0</span>
                </span>
                <button class="icon-btn" title="Profile">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="goHome()">vero</div>
            <div class="header-left">
                <button class="nav-button">Seller Area</button>
                <button class="nav-button">מגזין</button>
                <button class="nav-button">About</button>
            </div>
        </div>
    </header>

    <!-- ==================== PRODUCT PAGE ==================== -->
    <div id="productView" class="page-hero">
        <div class="hero-content">
            <div class="hero-text">
                <div class="hero-slash">/</div>
                <h1 class="hero-title" id="productName">שם המוצר</h1>
                <p class="hero-description" id="productDescription">תיאור המוצר יופיע כאן</p>
                <p class="hero-description" id="productPrice" style="font-size: 24px; font-weight: 700; color: #000;">₪0.00</p>
                <button class="hero-btn" onclick="addProductToCart()">הוסף לעגלה</button>
            </div>
            <div class="hero-image" id="productImage">🎨</div>
        </div>
    </div>

    <!-- ==================== TOASTS ==================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Cart & Wishlist State
        let cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');

        function saveState() {
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_wishlist', JSON.stringify(wishlist));
        }

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            cb.textContent = cartCount;
            cb.classList.toggle('show', cartCount > 0);
            wb.textContent = wishlist.length;
            wb.classList.toggle('show', wishlist.length > 0);
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 24px;
                left: 24px;
                background: #004225;
                color: white;
                padding: 14px 22px;
                border-radius: 6px;
                font-size: 14px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
                z-index: 300;
                animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        function addProductToCart() {
            const productName = document.getElementById('productName').textContent;
            const productPrice = document.getElementById('productPrice').textContent;
            const productIcon = document.getElementById('productImage').textContent;

            const product = {
                id: productName,
                name: productName,
                price: productPrice,
                icon: productIcon,
                category: 'מוצר',
                seller: 'Vero Store',
                rating: 4.8,
                qty: 1,
                addedAt: Date.now()
            };

            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.qty++;
                existing.addedAt = Date.now();
            } else {
                cart.push(product);
            }

            saveState();
            updateBadges();
            showToast(`נוסף לעגלה: ${productName}`);
        }

        function toggleSwitch() {
            // Placeholder for toggle functionality
        }

        function openWishlist() {
            showToast('רשימת משאלות');
        }

        function openCart() {
            window.location.href = 'index.html#cart';
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // Initialize
        updateBadges();

        // Load product from URL parameter
        const params = new URLSearchParams(window.location.search);
        const productData = params.get('product');

        if (productData) {
            try {
                const product = JSON.parse(decodeURIComponent(productData));
                document.getElementById('productName').textContent = product.name;
                document.getElementById('productDescription').textContent = product.desc || 'תיאור המוצר';
                document.getElementById('productPrice').textContent = product.price;
                document.getElementById('productImage').textContent = product.icon;
            } catch (e) {
                console.error('Error loading product:', e);
            }
        }
    </script>
</body>
</html>
