<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Specs Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #16150f; --muted: #8f8d86; --faint: #b6b3ab; --line: #e6e4de; --paper: #f6f4f0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 400px; border-radius: 26px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.12); }
.screen { width: 390px; height: 520px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 34px 26px 0; }
.ctx .brand { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 32px; line-height: 1; }
.ctx .pname { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; margin-top: 8px; }
.ctx .desc { font-size: 12.5px; line-height: 1.7; color: #6f6c66; margin-top: 14px; padding-bottom: 22px; }
.zone { position: relative; }
.zone::before { content: ''; position: absolute; left: -26px; right: -26px; top: -12px; bottom: -14px; background: rgba(217,164,65,0.06); border-top: 1px dashed rgba(217,164,65,0.45); border-bottom: 1px dashed rgba(217,164,65,0.45); pointer-events: none; }
.k { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }

/* D1 current */
.d1 div { display: flex; justify-content: space-between; padding: 11px 0; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.d1 div span:last-child { color: var(--muted); }

/* D2 label-over-value grid */
.d2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; border-top: 1px solid var(--ink); }
.d2 div { padding: 13px 0; border-bottom: 1px solid var(--line); }
.d2 div b { display: block; font-weight: 400; font-size: 15px; margin-top: 4px; }
.d2 div.full { grid-column: 1 / -1; }

/* D3 tiles */
.d3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.d3 div { background: var(--paper); border-radius: 14px; padding: 14px 12px; }
.d3 div b { display: block; font-weight: 400; font-size: 13px; margin-top: 6px; }

/* D4 chips */
.d4 { display: flex; flex-wrap: wrap; gap: 8px; }
.d4 span { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; font-size: 12px; }
.d4 span small { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* D5 icon rows */
.d5 div { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.d5 i { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; flex: none; }
.d5 i svg { width: 17px; height: 17px; stroke: var(--ink); stroke-width: 1.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.d5 b { font-weight: 400; font-size: 14px; flex: 1; }
.d5 small { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* D6 dotted leaders */
.d6 div { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; }
.d6 div small { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
.d6 div em { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-3px); }
.d6 div b { font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; font-weight: 400; font-size: 17px; }

/* D7 visual: size scale, condition meter, color swatch */
.d7 > div { padding: 11px 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.scale { display: flex; gap: 6px; }
.scale span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; color: var(--faint); border: 1px solid var(--line); }
.scale span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.meter { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.meter i { display: flex; gap: 3px; } .meter i b { width: 18px; height: 5px; border-radius: 3px; background: var(--line); } .meter i b.on { background: var(--ink); }
.sw { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.sw i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#d9a441, #c23a2e, #7aa6c2, #1f8f4e, #d9a441); }
.val { font-size: 12px; }

/* D8 serif strip */
.d8 { display: flex; gap: 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); overflow: hidden; }
.d8 div { flex: none; padding: 16px 18px 14px; text-align: left; }
.d8 div + div { border-left: 1px solid var(--line); }
.d8 div b { display: block; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; font-weight: 400; font-size: 24px; margin-top: 4px; }
.d8 div b i { font-style: normal; }
.hint { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); text-align: right; margin-top: 8px; }

/* D9 summary + expand */
.d9 .sum { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.d9 .sum b { font-weight: 400; font-size: 14px; } .d9 .sum b span { color: var(--faint); margin: 0 6px; }
.d9 .sum svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.4; transform: rotate(180deg); }
.d9 .more div { display: flex; justify-content: space-between; padding: 10px 0; font-size: 12px; color: #444; }
.d9 .more div span:first-child { color: var(--muted); font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<h1>Product details — אופציות</h1>
<p class="sub">9 עיצובים רק לחלק של הנתונים (מידה, בד, מצב, מגדר, צבע) · האזור המסומן הוא מה שמשתנה</p>
<div class="grid" id="grid"></div>

<script>
var D = [['Size', 'M'], ['Fabric', 'Cotton'], ['Condition', 'Excellent'], ['Gender', 'Unisex'], ['Color', 'Multicolor']];
var IC = {
  Size: '<path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/>',
  Fabric: '<path d="M4 7c3-3 5 3 8 0s5 3 8 0M4 12c3-3 5 3 8 0s5 3 8 0M4 17c3-3 5 3 8 0s5 3 8 0"/>',
  Condition: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  Gender: '<circle cx="9" cy="9" r="4"/><circle cx="15" cy="15" r="4"/>',
  Color: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>'
};
function ctx(inner) {
  return '<div class="screen"><div class="ctx"><div class="brand">MORAVCHICK</div><div class="pname">Cocktail Dress</div><p class="desc">Cocktail Dress — a piece in excellent condition, available now.</p></div><div class="zone">' + inner + '</div></div>';
}
var OPTS = [
  ['D1 · הקיים', 'ערך משמאל באותיות גדולות מרווחות, שם השדה מימין באפור. נקי אבל קשה לקרוא מה שייך למה.',
   ctx('<div class="d1">' + D.map(function (d) { return '<div><span>' + d[1] + '</span><span>' + d[0] + '</span></div>'; }).join('') + '</div>')],

  ['D2 · שם מעל ערך, שתי עמודות', 'שם השדה קטן למעלה והערך מתחתיו, בשתי עמודות עם קווים דקים. קריא ותופס חצי מהגובה.',
   ctx('<div class="d2">' + D.map(function (d, i) { return '<div' + (i === 4 ? ' class="full"' : '') + '><span class="k">' + d[0] + '</span><b>' + d[1] + '</b></div>'; }).join('') + '</div>')],

  ['D3 · אריחים', 'כל נתון באריח אפור־בהיר מעוגל, שלושה בשורה. מרגיש כמו אפליקציה, קל לסרוק.',
   ctx('<div class="d3">' + D.map(function (d) { return '<div><span class="k">' + d[0] + '</span><b>' + d[1] + '</b></div>'; }).join('') + '</div>')],

  ['D4 · צ׳יפים', 'כל נתון כקפסולה עם קו דק: הערך ולידו שם השדה הקטן. הכי קומפקטי.',
   ctx('<div class="d4">' + D.map(function (d) { return '<span>' + d[1] + '<small>' + d[0] + '</small></span>'; }).join('') + '</div>')],

  ['D5 · אייקונים', 'שורה לכל נתון עם אייקון בעיגול, הערך, ושם השדה בצד. הכי ברור למי שלא קורא אנגלית טוב.',
   ctx('<div class="d5">' + D.map(function (d) { return '<div><i><svg viewBox="0 0 24 24">' + IC[d[0]] + '</svg></i><b>' + d[1] + '</b><small>' + d[0] + '</small></div>'; }).join('') + '</div>')],

  ['D6 · תפריט עם נקודות', 'שם השדה משמאל, קו נקודות, והערך גדול מימין — כמו תפריט במסעדה יוקרתית.',
   ctx('<div class="d6">' + D.map(function (d) { return '<div><small>' + d[0] + '</small><em></em><b>' + d[1] + '</b></div>'; }).join('') + '</div>')],

  ['D7 · ויזואלי', 'המידה כסולם XS–XL עם M מסומן, המצב כמד של 5 פסים, והצבע עם עיגול צבעוני. מראה במקום לכתוב.',
   ctx('<div class="d7">' +
     '<div><span class="k">Size</span><span class="scale"><span>XS</span><span>S</span><span class="on">M</span><span>L</span><span>XL</span></span></div>' +
     '<div><span class="k">Condition</span><span class="meter"><i><b class="on"></b><b class="on"></b><b class="on"></b><b class="on"></b><b></b></i>Excellent</span></div>' +
     '<div><span class="k">Fabric</span><span class="val">Cotton</span></div>' +
     '<div><span class="k">Gender</span><span class="val">Unisex</span></div>' +
     '<div><span class="k">Color</span><span class="sw"><i></i>Multicolor</span></div></div>')],

  ['D8 · פס נגלל', 'הנתונים בשורה אחת אופקית באותיות גדולות בין שני קווים שחורים, וגוללים לצד. מגזיני ושונה.',
   ctx('<div class="d8">' + D.map(function (d) { return '<div><span class="k">' + d[0] + '</span><b>' + d[1].replace(/^(\w)(\w+)$/, '$1<i>$2</i>') + '</b></div>'; }).join('') + '</div><div class="hint">swipe →</div>')],

  ['D9 · שורת סיכום + פירוט', 'שורה אחת "M · Cotton · Excellent" עם חץ, ובלחיצה נפתח הפירוט המלא. חוסך מקום לתיאור ולמחיר.',
   ctx('<div class="d9"><div class="sum"><b>M<span>·</span>Cotton<span>·</span>Excellent</b><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="more">' +
     D.map(function (d) { return '<div><span>' + d[0] + '</span><span>' + d[1] + '</span></div>'; }).join('') + '</div></div>')]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
