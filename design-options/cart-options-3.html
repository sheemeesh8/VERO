<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Options 3</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #efede9; --ink: #111; --muted: #77736c; --line: #e4e1dc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.phone > img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: #111; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 44px 24px 14px; }
.ph b { font-size: 24px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.ph svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.k { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
.th { background: #ddd center / cover no-repeat; filter: grayscale(1); }
.btn { display: block; text-align: center; background: #111; color: #fff; padding: 17px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }
.money { font-variant-numeric: tabular-nums; }
.x { width: 18px; height: 18px; stroke: #999; stroke-width: 1.3; fill: none; }

.c2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
.chk { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; display: grid; place-items: center; }
.chk svg { width: 13px; height: 13px; fill: none; stroke-width: 2.4; }
.rm { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; }
.rm svg { width: 15px; height: 15px; fill: none; stroke-width: 1.5; }
.pill { position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: center; background: #111; color: #fff; border-radius: 40px; padding: 6px 6px 6px 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
.pill div { flex: 1; font-size: 11px; color: #aaa; } .pill div b { display: block; color: #fff; font-size: 17px; font-weight: 400; }
.pill span { background: #fff; color: #111; border-radius: 30px; padding: 15px 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.tot { display: flex; justify-content: space-between; align-items: baseline; margin: 0 20px 14px; padding-bottom: 12px; border-bottom: 1px solid #111; }
.tot b { font-size: 26px; font-weight: 400; }

.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.ph .acts { display: flex; gap: 20px; align-items: center; }
.th { position: relative; }
.nm2 { font-size: 13px; margin-top: 7px; display: flex; justify-content: space-between; }
.sl2 { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.rmw svg { stroke: #fff; }

/* Q — chips row */
.q .chips { display: flex; gap: 8px; padding: 0 20px 14px; overflow: hidden; }
.q .chips span { flex: none; font-size: 11px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 20px; }
.q .chips span.on { background: #111; color: #fff; border-color: #111; }
.q .th { aspect-ratio: 3/4; }

/* R — toolbar row */
.r .tools { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 14px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.r .tools span { display: flex; align-items: center; gap: 8px; } .r .tools .ico { width: 17px; height: 17px; }
.r .tools i { width: 1px; height: 18px; background: var(--line); }
.r .card { border: 1px solid var(--line); }
.r .th { aspect-ratio: 1/1.05; }
.r .cb { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; }
.r .cb b { font-weight: 400; font-size: 13px; } .r .cb small { display: block; font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.r .cb .ico { width: 16px; height: 16px; stroke: #999; }

/* S — round icon buttons + sort */
.s .ph .acts span { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.s .ph .acts .ico { width: 18px; height: 18px; }
.s .sort { display: flex; justify-content: space-between; margin: 0 20px 12px; font-size: 12px; color: var(--muted); }
.s .sort b { color: #111; font-weight: 400; }
.s .th { aspect-ratio: 1/1; }
.s .tag { position: absolute; left: 0; bottom: 0; background: #fff; padding: 5px 9px; font-size: 13px; }

/* T — tools in the pill */
.t .th { aspect-ratio: 3/4; }
.t .pill2 { position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 8px; }
.t .pill2 .ib { width: 54px; height: 54px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
.t .pill2 .ib .ico { width: 19px; height: 19px; }
.t .pill2 .go { flex: 1; background: #111; color: #fff; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.t .pill2 .go b { font-size: 15px; font-weight: 400; letter-spacing: 0; }

/* U — big title + square icons, wishlist heart */
.u .big { padding: 6px 20px 4px; display: flex; justify-content: space-between; align-items: flex-end; }
.u .big b { font-size: 40px; font-weight: 400; line-height: 1; }
.u .big .sq { display: flex; gap: 8px; } .u .big .sq span { width: 40px; height: 40px; border: 1px solid #111; display: grid; place-items: center; } .u .big .sq .ico { width: 18px; height: 18px; }
.u .cnt { padding: 0 20px 16px; font-size: 12px; color: var(--muted); }
.u .th { aspect-ratio: 3/4; }
.u .hrt { position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.u .hrt svg { width: 14px; height: 14px; fill: none; stroke: #111; stroke-width: 1.6; }

/* V — active filters */
.v .badge { position: relative; } .v .badge em { position: absolute; top: -6px; right: -8px; width: 16px; height: 16px; border-radius: 50%; background: #111; color: #fff; font-size: 9px; font-style: normal; display: grid; place-items: center; }
.v .act { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 6px; }
.v .act span { font-size: 11px; padding: 7px 10px 7px 12px; background: #f1efeb; display: flex; gap: 8px; align-items: center; }
.v .act span::after { content: '×'; color: #888; }
.v .res { padding: 6px 20px 14px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; } .v .res u { color: #111; }
.v .th { aspect-ratio: 3/4; }

/* W — share-a-look banner */
.w .look { margin: 0 20px 16px; background: #111; color: #fff; display: flex; align-items: center; gap: 14px; padding: 12px; }
.w .look .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 64px; flex: none; }
.w .look .mini div { aspect-ratio: 1/1; background: #444 center / cover; filter: grayscale(1); }
.w .look p { flex: 1; font-size: 13px; line-height: 1.4; } .w .look p small { display: block; font-size: 9px; letter-spacing: 3px; color: #999; text-transform: uppercase; margin-bottom: 4px; }
.w .look .sh { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; } .w .look .sh .ico { width: 18px; height: 18px; }
.w .th { aspect-ratio: 1/1.1; }

/* X — clothing/art toggle + seller line */
.xx .seg { display: flex; margin: 0 20px 16px; border: 1px solid #111; }
.xx .seg span { flex: 1; text-align: center; padding: 11px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.xx .seg span.on { background: #111; color: #fff; }
.xx .th { aspect-ratio: 3/4; }
.xx .who { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 10px; color: var(--muted); }
.xx .who i { width: 16px; height: 16px; border-radius: 50%; background: #111; }
</style>
</head>
<body>
<h1>Cart — עם סינון ושיתוף</h1>
<p class="sub">סבב שלישי · Q עד X · שני כרטיסים בשורה, ובכל אחד אייקוני סינון ושיתוף במיקום אחר</p>
<div class="grid" id="grid"></div>
<script>
var IT = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      sz: 'M',  pos: '50% 30%' },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', sz: '42', pos: '50% 60%' },
  { n: 'Linen Overshirt', s: 'Atelier Nord', p: 340, img: '../women-hero.jpg',    sz: 'S',  pos: '20% 40%' },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    sz: 'OS', pos: '50% 50%' }
];
var TOTAL = 2860;
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var bg = function (i) { return 'style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"'; };
var FIL = '<svg class="ico" viewBox="0 0 24 24"><path d="M4 3h16l-8 9-8-9z"/><path d="M12 12v8"/><path d="M8 21h8"/></svg>';
var SHR = '<svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var BIN = '<svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
var BACK = '<svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
var RM = '<span class="rm rmw"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
var head = function (t, acts) { return '<div class="ph"><b>' + t + '</b><span class="acts">' + acts + BACK + '</span></div>'; };
var pill = function (lbl, v) { return '<div class="pill"><div>' + lbl + '<b class="money">' + m(v) + '</b></div><span>Checkout →</span></div>'; };
var basic = function (i) { return '<div><div class="th" ' + bg(i) + '>' + RM + '</div><div class="nm2"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div><div class="sl2">' + i.s + '</div></div>'; };

var OPTS = [
  ['Q · צ׳יפים של קטגוריות', 'סינון ושיתוף בהדר, ומתחת שורת צ׳יפים לקטגוריה (All / Coats / Shoes…) לסינון מהיר בלחיצה אחת.',
   '<div class="screen q">' + head('Cart', FIL + SHR) + '<div class="chips"><span class="on">All · 4</span><span>Coats</span><span>Shoes</span><span>Shirts</span><span>Accessories</span></div><div class="c2">' + IT.map(basic).join('') + '</div>' + pill('4 items', TOTAL) + '</div>'],

  ['R · סרגל כלים', 'שורה עם Filter ו-Share במילים ובאייקונים מתחת לכותרת. הכרטיס עם מסגרת דקה, ופח למטה.',
   '<div class="screen r">' + head('Cart · 4', '') + '<div class="tools"><span>' + FIL + 'Filter</span><i></i><span>Sort: Newest</span><i></i><span>' + SHR + 'Share</span></div><div class="c2">' + IT.map(function (i) { return '<div class="card"><div class="th" ' + bg(i) + '></div><div class="cb"><span><b class="money">' + m(i.p) + '</b><small>' + i.n + '</small></span>' + BIN + '</div></div>'; }).join('') + '</div>' + pill('4 items', TOTAL) + '</div>'],

  ['S · כפתורים עגולים + מיון', 'סינון ושיתוף בעיגולים בהדר, שורת מיון לפי מחיר, ותווית מחיר על התמונה.',
   '<div class="screen s">' + head('Cart', '<span>' + FIL + '</span><span>' + SHR + '</span>') + '<div class="sort"><span>4 items</span><span>Sort by <b>Price ↓</b></span></div><div class="c2">' + IT.map(function (i) { return '<div><div class="th" ' + bg(i) + '>' + RM + '<span class="tag money">' + m(i.p) + '</span></div><div class="nm2"><span>' + i.n + '</span></div><div class="sl2">' + i.s + ' · ' + i.sz + '</div></div>'; }).join('') + '</div>' + pill('Total', TOTAL) + '</div>'],

  ['T · הכלים ליד כפתור התשלום', 'סינון ושיתוף בעיגולים צפים ליד כפתור התשלום, בהישג האגודל. ההדר נשאר נקי.',
   '<div class="screen t">' + head('Cart', '') + '<div class="tot"><span class="k">Total · 4 pieces</span><b class="money">' + m(TOTAL) + '</b></div><div class="c2">' + IT.map(basic).join('') + '</div><div class="pill2"><span class="ib">' + FIL + '</span><span class="ib">' + SHR + '</span><span class="go">Checkout<b class="money">' + m(TOTAL) + '</b></span></div></div>'],

  ['U · כותרת גדולה + לב', 'כותרת "Cart" ענקית, סינון ושיתוף בריבועים, ועל כל כרטיס לב להעברה לרשימת המשאלות.',
   '<div class="screen u"><div class="ph"><span></span>' + BACK + '</div><div class="big"><b>Cart</b><span class="sq"><span>' + FIL + '</span><span>' + SHR + '</span></span></div><div class="cnt">4 pieces from 3 sellers</div><div class="c2">' + IT.map(function (i) { return '<div><div class="th" ' + bg(i) + '><span class="hrt"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>' + RM + '</div><div class="nm2"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div>'; }).join('') + '</div>' + pill('4 items', TOTAL) + '</div>'],

  ['V · סינון פעיל', 'כשיש סינון, מספר על האייקון ותגיות של הסינונים הפעילים עם X. ברור מיד למה רואים רק חלק.',
   '<div class="screen v">' + head('Cart', '<span class="badge">' + FIL + '<em>2</em></span>' + SHR) + '<div class="act"><span>Atelier Nord</span><span>Under ₪1,000</span></div><div class="res"><span>Showing 2 of 4</span><u>Clear all</u></div><div class="c2">' + [IT[0], IT[2]].map(basic).join('') + '</div>' + pill('2 shown', 1320) + '</div>'],

  ['W · שתף את הלוק', 'באנר שחור "Share this look" עם קולאז׳ קטן של הפריטים וכפתור שיתוף. השיתוף נהיה פיצ׳ר ולא רק אייקון.',
   '<div class="screen w">' + head('Cart', FIL) + '<div class="look"><span class="mini">' + IT.map(function (i) { return '<div style="background-image:url(\'' + i.img + '\')"></div>'; }).join('') + '</span><p><small>Your look</small>Share this cart with a friend</p><span class="sh">' + SHR + '</span></div><div class="c2">' + IT.map(basic).join('') + '</div>' + pill('4 items', TOTAL) + '</div>'],

  ['X · בגדים / אמנות', 'סינון ושיתוף בהדר, ומתחת מתג Clothing / Art כמו היום, בצורת לשוניות. בכל כרטיס עיגול עם שם המוכר.',
   '<div class="screen xx">' + head('Cart', FIL + SHR) + '<div class="seg"><span class="on">Clothing · 4</span><span>Art · 2</span></div><div class="c2">' + IT.map(function (i) { return '<div><div class="th" ' + bg(i) + '>' + RM + '</div><div class="who"><i></i>' + i.s + '</div><div class="nm2"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div>'; }).join('') + '</div>' + pill('4 items', TOTAL) + '</div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
