<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Personal Area</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c;
            overflow: hidden;
            /* Dark backdrop so the white rectangles rise over it — no blank
               white screen showing through while they climb up one by one. */
            background: #0d0d0d;
        }

        /* Centre the row of rectangles in the page so shrinking their height
           leaves even air above and below. */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Full-width bar sitting over the rectangles — header height,
           held a little below the top edge of the screen (not flush). ===== */
        .top-bar {
            position: fixed;
            top: 24px; left: 0; right: 0;
            height: 66px;
            background: #ffffff;
            border: 1px solid #000;
            z-index: 15;
            transform: translateY(calc(-100% - 24px));
            animation: barDrop 0.55s cubic-bezier(0.65, 0.05, 0.1, 1) 0.15s both;
        }
        @keyframes barDrop {
            from { transform: translateY(calc(-100% - 24px)); }
            to   { transform: translateY(0); }
        }

        /* ===== The four long equal rectangles, spanning the full page width ===== */
        .panels {
            display: grid;
            grid-template-columns: repeat(5, 1fr);   /* five equal columns = full width */
            width: 100%;
            height: 100vh;                           /* rectangles span the full screen height */
        }
        .panel {
            position: relative;
            height: 100%;
            background: #ffffff;              /* white rectangles */
            border: 1px solid #000;           /* thin black frame */
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.5s ease;
            /* Entry: the exact same slide as the search overlay (.vsp-overlay) —
               same easing and duration — sliding down from the top. */
            transform: translateY(-100%);
            animation: panelFly 0.55s cubic-bezier(0.65, 0.05, 0.1, 1) 0.15s both;
        }
        @keyframes panelFly {
            from { transform: translateY(-100%); }
            to   { transform: translateY(0); }
        }
        /* Black backdrop fades in before the image rises over it. */
        .panel:hover { background-color: #000; }
        /* Collapse the shared edge so adjacent frames read as one thin line. */
        .panel + .panel { margin-left: -1px; }

        /* Black-and-white image that slides up on hover and keeps sliding up on exit. */
        .panel-media {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: grayscale(1);
            transform: translateY(100%);
            transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
            /* Fade the top of the image into the black backdrop for a soft blend. */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 22%);
        }
        /* Scrims at top and bottom so the title (top) and description (bottom)
           stay readable over the photo. */
        .panel-media::after {
            content: "";
            position: absolute; inset: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 28%,
                rgba(0,0,0,0) 68%, rgba(0,0,0,0.5) 100%);
        }
        .panel:hover .panel-media { transform: translateY(0); }   /* slide up in, slide down out */
        .panel-head, .panel-desc { transition: color 0.3s; }
        .panel:hover .panel-head { color: #fff; }
        .panel:hover .panel-desc { color: #fff; }

        /* Giant thin word running off the bottom edge of every rectangle. */
        .panel-word {
            position: absolute;
            left: -2px;
            bottom: -14px;
            font-size: clamp(34px, 3.6vw, 68px);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #23231f;
            line-height: 0.9;
            white-space: nowrap;
        }

        /* ===== Each rectangle's label block — same design line as the feature:
           a big thin heading with a pill-outline button beneath it. ===== */
        .panel-inner {
            position: absolute;
            top: 40px; left: 20px; right: 20px;   /* raised to the top of each rectangle */
            z-index: 2;
        }
        .panel-head {
            width: 100%;
            font-size: clamp(24px, 2.4vw, 40px);
            font-weight: 300;              /* light, not bold */
            letter-spacing: 0.5px;
            line-height: 1.1;
            color: #1c1c1c;
            margin: 0;
            text-align: left;              /* pinned to the left of each rectangle */
        }
        .panel-desc {
            position: absolute;
            bottom: 40px; left: 20px; right: 20px;   /* moved down to the base of each rectangle */
            margin: 0;
            font-size: 13px;
            font-weight: 600;                        /* bold */
            line-height: 1.5;
            letter-spacing: 0.3px;
            color: #4a4a46;
            text-align: left;
            z-index: 2;
        }
        .panel-cta {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 24px;
            border: 1.4px solid #1c1c1c;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            background: transparent;
            color: #1c1c1c;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.25s, color 0.25s;
        }
        .panel-cta:hover { background: #1c1c1c; color: #fff; }

        /* ===== Top bar: brand mark left, expand glyph right ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 34px;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-glyph {
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            position: relative;
        }
        .brand-glyph::after {
            content: "";
            position: absolute; top: 5px; left: 7px;
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            background: #e6e6e3;
        }
        .brand-name { font-size: 17px; font-weight: 500; letter-spacing: 0.5px; }
        .expand { width: 26px; height: 26px; cursor: pointer; color: #1c1c1c; }
        .expand svg { width: 100%; height: 100%; }

        /* ===== Page-transition tile: grows from the clicked rectangle to fill
           the screen, then the target page loads (same expand feel as the video). */
        .panel-transition {
            position: fixed;
            background: #ffffff;
            border: 1px solid #000;
            z-index: 60;
            transition: left 0.6s cubic-bezier(0.76, 0, 0.24, 1),
                        top 0.6s cubic-bezier(0.76, 0, 0.24, 1),
                        width 0.6s cubic-bezier(0.76, 0, 0.24, 1),
                        height 0.6s cubic-bezier(0.76, 0, 0.24, 1);
        }
        .panel-transition.grow { left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; }

        @media (max-width: 720px) {
            body { overflow: auto; }
            .stage { position: relative; }
            .panels { grid-template-columns: 1fr; height: auto; }
            .panel { height: 40vh; }
        }
    </style>
</head>
<body>
    <!-- Full-width bar over the rectangles, at header height, offset from the top. -->
    <div class="top-bar"></div>

    <div class="stage">
        <!-- The four long equal rectangles across the full width of the page -->
        <div class="panels">
            <div class="panel" onclick="goPanel('profile.html', this)">
                <div class="panel-media" style="background-image:url('https://loremflickr.com/800/1200/portrait,fashion,studio?lock=7')"></div>
                <div class="panel-inner">
                    <h2 class="panel-head">My Profile</h2>
                </div>
                <p class="panel-desc">Your details, preferences<br>and account settings.</p>
            </div>
            <div class="panel" onclick="goPanel('products.html', this)">
                <div class="panel-media" style="background-image:url('https://loremflickr.com/800/1200/fashion,clothing,rail')"></div>
                <div class="panel-inner">
                    <h2 class="panel-head">My Products</h2>
                </div>
                <p class="panel-desc">The pieces you've<br>purchased and followed.</p>
            </div>
            <div class="panel" onclick="goPanel('expenses.html', this)">
                <div class="panel-media" style="background-image:url('https://loremflickr.com/800/1200/minimal,beige,still')"></div>
                <div class="panel-inner">
                    <h2 class="panel-head">My Expenses</h2>
                </div>
                <p class="panel-desc">A summary of your<br>purchases and spending.</p>
            </div>
            <div class="panel" onclick="goPanel('cart.html', this)">
                <div class="panel-media" style="background-image:url('https://loremflickr.com/800/1200/shopping,bag,fashion')"></div>
                <div class="panel-inner">
                    <h2 class="panel-head">My Cart</h2>
                </div>
                <p class="panel-desc">The items you've gathered,<br>ready to check out.</p>
            </div>
            <div class="panel" onclick="goPanel('chats.html', this)">
                <div class="panel-media" style="background-image:url('https://loremflickr.com/800/1200/conversation,people,minimal')"></div>
                <div class="panel-inner">
                    <h2 class="panel-head">My Chats</h2>
                </div>
                <p class="panel-desc">Your conversations<br>with sellers and buyers.</p>
            </div>
        </div>
    </div>

    <script>
        // Click a rectangle → it expands from its own position to fill the screen,
        // then the matching page loads (the expand transition seen in the video).
        function goPanel(url, el) {
            const r = el.getBoundingClientRect();
            const tile = document.createElement('div');
            tile.className = 'panel-transition';
            tile.style.left = r.left + 'px';
            tile.style.top = r.top + 'px';
            tile.style.width = r.width + 'px';
            tile.style.height = r.height + 'px';
            // Expand THROUGH the panel's own image: the growing tile carries the
            // same grayscale photo, so the transition flows into the page's side image.
            const media = el.querySelector('.panel-media');
            if (media && media.style.backgroundImage) {
                tile.style.backgroundImage = media.style.backgroundImage;
                tile.style.backgroundSize = 'cover';
                tile.style.backgroundPosition = 'center';
                tile.style.filter = 'grayscale(1)';
            }
            document.body.appendChild(tile);
            // Force layout, then trigger the grow on the next frame.
            requestAnimationFrame(() => requestAnimationFrame(() => tile.classList.add('grow')));
            setTimeout(() => { window.location.href = url; }, 640);
        }
    </script>

    <!-- Manual edit mode (✎ button bottom-left, or Ctrl+Shift+E) — same editor as the feed. -->
    <script src="vero-editor.js"></script>
</body>
</html>
