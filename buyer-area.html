<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Personal Area</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c;
            overflow: hidden;
            background: #e6e6e3;
        }

        /* Centre the row of rectangles in the page so shrinking their height
           leaves even air above and below. */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== The four long equal rectangles, spanning the full page width ===== */
        .panels {
            display: grid;
            grid-template-columns: repeat(4, 1fr);   /* four equal columns = full width */
            width: 100%;
            height: 100vh;                           /* rectangles span the full screen height */
        }
        .panel {
            position: relative;
            height: 100%;
            background: linear-gradient(180deg, #edece9 0%, #dededa 55%, #cfcfca 100%);
            overflow: hidden;
        }
        .panel + .panel { box-shadow: -1px 0 0 rgba(0,0,0,0.10); }
        .panel:nth-child(2) { background: linear-gradient(180deg, #eae9e6 0%, #d9d9d5 55%, #cbcbc6 100%); }
        .panel:nth-child(3) { background: linear-gradient(180deg, #ecebe8 0%, #dcdcd8 55%, #cececa 100%); }
        .panel:nth-child(4) { background: linear-gradient(180deg, #e8e7e4 0%, #d6d6d2 55%, #c8c8c3 100%); }

        /* Giant thin word running off the bottom edge of every rectangle. */
        .panel-word {
            position: absolute;
            left: -2px;
            bottom: -14px;
            font-size: clamp(34px, 3.6vw, 68px);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #23231f;
            line-height: 0.9;
            white-space: nowrap;
        }

        /* ===== Each rectangle's label block — same design line as the feature:
           a big thin heading with a pill-outline button beneath it. ===== */
        .panel-inner {
            position: absolute;
            top: 34px; left: 26px; right: 26px;
            z-index: 2;
        }
        .panel-head {
            font-size: clamp(22px, 2vw, 34px);
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.08;
            color: #1c1c1c;
            margin: 0;
        }
        .panel-cta {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 24px;
            border: 1.4px solid #1c1c1c;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            background: transparent;
            color: #1c1c1c;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.25s, color 0.25s;
        }
        .panel-cta:hover { background: #1c1c1c; color: #fff; }

        /* ===== Top bar: brand mark left, expand glyph right ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 34px;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-glyph {
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            position: relative;
        }
        .brand-glyph::after {
            content: "";
            position: absolute; top: 5px; left: 7px;
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            background: #e6e6e3;
        }
        .brand-name { font-size: 17px; font-weight: 500; letter-spacing: 0.5px; }
        .expand { width: 26px; height: 26px; cursor: pointer; color: #1c1c1c; }
        .expand svg { width: 100%; height: 100%; }

        @media (max-width: 720px) {
            body { overflow: auto; }
            .stage { position: relative; }
            .panels { grid-template-columns: 1fr; height: auto; }
            .panel { height: 40vh; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- The four long equal rectangles across the full width of the page -->
        <div class="panels">
            <div class="panel">
                <div class="panel-inner">
                    <h2 class="panel-head">הפרופיל<br>שלי</h2>
                    <button class="panel-cta">כניסה</button>
                </div>
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <div class="panel-inner">
                    <h2 class="panel-head">המוצרים<br>שלי</h2>
                    <button class="panel-cta">כניסה</button>
                </div>
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <div class="panel-inner">
                    <h2 class="panel-head">ההוצאות<br>שלי</h2>
                    <button class="panel-cta">כניסה</button>
                </div>
                <span class="panel-word">Our</span>
            </div>
            <div class="panel">
                <div class="panel-inner">
                    <h2 class="panel-head">עגלת<br>הקניות</h2>
                    <button class="panel-cta">כניסה</button>
                </div>
                <span class="panel-word">Our</span>
            </div>
        </div>
    </div>

    <!-- Manual edit mode (✎ button bottom-left, or Ctrl+Shift+E) — same editor as the feed. -->
    <script src="vero-editor.js"></script>
</body>
</html>
