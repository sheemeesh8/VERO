<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="stylesheet" href="design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — Card Flight Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <link rel="stylesheet" href="assets/page-header.css?v=20261003e">
    <link rel="stylesheet" href="product-card.css">
    <script src="assets/page-header.js?v=20261003e"></script>
    <style>
        :root { --ink: #111; --mute: #6b6b6b; --faint: #9a9a9a; --bg: #fafafa;
                --sans: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); padding: 0 32px 120px; }
        body > .page-header { margin: 0 -32px 44px; width: auto; }

        .fl-head { max-width: 1200px; margin: 0 auto 36px; }
        .fl-title { font-size: 40px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 14px; }
        .fl-title span { color: var(--faint); }
        .fl-sub { font-size: 13px; line-height: 1.6; color: var(--mute); max-width: 520px; }
        .fl-all { margin-top: 20px; }

        .fl-grid { max-width: 1200px; margin: 0 auto; display: grid; gap: 26px;
                   grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        .fl-opt { background: #fff; border: 1px solid #ececec; border-radius: 18px; overflow: hidden; }

        /* Same blurred trees film as the upload flow's last step. */
        .fl-stage { position: relative; height: 430px; overflow: hidden; display: flex;
                    align-items: center; justify-content: center; isolation: isolate; }
        .fl-stage::before { content: ''; position: absolute; inset: -30px; z-index: -2;
                    background: url('assets/hero/art-section-poster.jpg') center / cover; filter: blur(16px) saturate(1.05); }
        .fl-stage::after { content: ''; position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,0.22); }

        .fl-card { width: 210px; box-shadow: 0 18px 40px rgba(0,0,0,0.18) !important; cursor: default;
                   will-change: transform, opacity, filter; }
        .fl-card:hover { transform: none; }
        .fl-card .product-image { background: linear-gradient(160deg, #e9e3d8, #cfc4b3); font-size: 64px; }

        /* Little "Listed" toast that lands once the card is gone. */
        .fl-done { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.9);
                   color: #fff; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
                   opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; text-align: center; }
        .fl-done b { display: block; font-family: 'Bodoni Moda', serif; font-size: 30px; letter-spacing: 0; text-transform: none; font-weight: 500; margin-bottom: 4px; }
        .fl-stage.is-done .fl-done { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Feed target used by "Into the feed" — a mini grid at the top. */
        .fl-feed { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
                   display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; opacity: 0; transition: opacity .3s; }
        .fl-feed i { height: 44px; border-radius: 5px; background: rgba(255,255,255,0.28); }
        .fl-feed i.slot { background: rgba(255,255,255,0.08); outline: 1px dashed rgba(255,255,255,0.6); }
        .fl-feed i.slot.filled { background: linear-gradient(160deg, #e9e3d8, #cfc4b3); outline-color: transparent; }
        .fl-stage.show-feed .fl-feed { opacity: 1; }

        /* Sparkle dots for "Toss". */
        .fl-spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; pointer-events: none; }

        .fl-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; }
        .fl-name { font-size: 14px; font-weight: 500; }
        .fl-name small { display: block; font-size: 12px; font-weight: 400; color: var(--mute); margin-top: 3px; line-height: 1.45; }
        .fl-btn { flex: none; border: 1px solid #111; background: #111; color: #fff; border-radius: 999px;
                  padding: 10px 20px; font: 500 13px var(--sans); cursor: pointer; }
        .fl-btn.ghost { background: transparent; color: #111; }

        @media (max-width: 560px) {
            body { padding: 0 16px 80px; }
            body > .page-header { margin: 0 -16px 32px; }
            .fl-title { font-size: 30px; }
            .fl-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="fl-head">
        <h1 class="fl-title">Card flight <span>— on Publish</span></h1>
        <p class="fl-sub">Six ways the listing card can take off when the seller taps Publish on the last step of the upload flow. Tap Publish under each one to watch it; tap again to replay. Pick a number and it goes into the real flow.</p>
        <button class="fl-btn ghost fl-all" type="button" id="flAll">Play all</button>
    </header>

    <main class="fl-grid" id="flGrid"></main>

    <template id="flTpl">
        <div class="fl-opt">
            <div class="fl-stage">
                <div class="fl-feed"><i></i><i></i><i></i><i class="slot"></i><i></i><i></i></div>
                <div class="product-card fl-card">
                    <div class="product-image">👜</div>
                    <div class="product-info">
                        <div class="pc-left"><div class="product-price">₪480</div></div>
                        <div class="pc-right">
                            <div class="product-seller">Vintage</div>
                            <div class="product-name">Leather shoulder bag</div>
                        </div>
                    </div>
                </div>
                <div class="fl-done"><b>Listed</b>Your item is live</div>
            </div>
            <div class="fl-foot">
                <div class="fl-name"></div>
                <button class="fl-btn" type="button">Publish</button>
            </div>
        </div>
    </template>

    <script>
    (function cardFlightLab() {
        var ease = { out: 'cubic-bezier(.22,1,.36,1)', in: 'cubic-bezier(.55,0,.75,.2)', inOut: 'cubic-bezier(.65,0,.35,1)' };

        // Each option: the card's keyframes + timing, and an optional extra for the stage.
        var OPTIONS = [
            {
                name: '1 · Lift-off',
                note: 'A small crouch, then the card rises straight up and out of frame.',
                run: function (card) {
                    return card.animate([
                        { transform: 'translateY(0) scale(1)', opacity: 1 },
                        { transform: 'translateY(14px) scale(0.97)', opacity: 1, offset: 0.18, easing: ease.in },
                        { transform: 'translateY(-560px) scale(0.92)', opacity: 0.9 }
                    ], { duration: 950, easing: 'linear', fill: 'forwards' });
                }
            },
            {
                name: '2 · Paper plane',
                note: 'Tilts, shrinks and glides off on an arc to the top-right.',
                run: function (card) {
                    return card.animate([
                        { transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 },
                        { transform: 'translate(-20px,10px) rotate(-8deg) scale(0.95)', opacity: 1, offset: 0.2, easing: ease.in },
                        { transform: 'translate(120px,-120px) rotate(18deg) scale(0.6)', opacity: 1, offset: 0.6 },
                        { transform: 'translate(420px,-380px) rotate(32deg) scale(0.25)', opacity: 0 }
                    ], { duration: 1200, easing: 'linear', fill: 'forwards' });
                }
            },
            {
                name: '3 · Into the feed',
                note: 'A mini feed fades in and the card shrinks into its empty slot.',
                stage: true,
                run: function (card, stage) {
                    stage.classList.add('show-feed');
                    var slot = stage.querySelector('.slot');
                    var c = card.getBoundingClientRect(), s = slot.getBoundingClientRect();
                    var dx = (s.left + s.width / 2) - (c.left + c.width / 2);
                    var dy = (s.top + s.height / 2) - (c.top + c.height / 2);
                    var k = s.width / c.width;
                    var a = card.animate([
                        { transform: 'translate(0,0) scale(1)', opacity: 1 },
                        { transform: 'translate(0,-12px) scale(1.04)', opacity: 1, offset: 0.2 },
                        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')', opacity: 0.9 }
                    ], { duration: 1050, delay: 250, easing: ease.inOut, fill: 'forwards' });
                    a.finished.then(function () { slot.classList.add('filled'); card.style.opacity = 0; });
                    return a;
                },
                reset: function (stage) {
                    stage.classList.remove('show-feed');
                    stage.querySelector('.slot').classList.remove('filled');
                }
            },
            {
                name: '4 · Flip away',
                note: 'A full 3D turn while it recedes into the trees.',
                run: function (card) {
                    card.parentNode.style.perspective = '900px';
                    return card.animate([
                        { transform: 'translateZ(0) rotateY(0) scale(1)', opacity: 1, filter: 'blur(0)' },
                        { transform: 'translateZ(-200px) rotateY(180deg) scale(0.8)', opacity: 1, filter: 'blur(0)', offset: 0.5 },
                        { transform: 'translateZ(-900px) rotateY(360deg) scale(0.4)', opacity: 0, filter: 'blur(4px)' }
                    ], { duration: 1300, easing: ease.inOut, fill: 'forwards' });
                }
            },
            {
                name: '5 · Toss',
                note: 'Pulled back like a throw, then launched up with a trail of sparks.',
                run: function (card, stage) {
                    var a = card.animate([
                        { transform: 'translateY(0) rotate(0) scale(1)', opacity: 1 },
                        { transform: 'translateY(26px) rotate(-6deg) scale(0.96)', opacity: 1, offset: 0.25, easing: ease.out },
                        { transform: 'translateY(-600px) rotate(10deg) scale(0.85)', opacity: 1 }
                    ], { duration: 1000, easing: ease.in, fill: 'forwards' });
                    setTimeout(function () { sparks(stage, 14); }, 300);
                    return a;
                }
            },
            {
                name: '6 · Whoosh',
                note: 'Stretches sideways and shoots off to the right with a motion blur.',
                run: function (card) {
                    return card.animate([
                        { transform: 'translateX(0) scaleX(1) skewX(0)', opacity: 1, filter: 'blur(0)' },
                        { transform: 'translateX(-24px) scaleX(0.94) skewX(4deg)', opacity: 1, filter: 'blur(0)', offset: 0.22, easing: ease.in },
                        { transform: 'translateX(520px) scaleX(1.35) skewX(-14deg)', opacity: 0, filter: 'blur(8px)' }
                    ], { duration: 820, easing: 'linear', fill: 'forwards' });
                }
            }
        ];

        function sparks(stage, n) {
            var r = stage.getBoundingClientRect();
            for (var i = 0; i < n; i++) {
                var d = document.createElement('span');
                d.className = 'fl-spark';
                d.style.left = (r.width / 2 + (Math.random() - 0.5) * 120) + 'px';
                d.style.top = (r.height / 2 + 40) + 'px';
                stage.appendChild(d);
                var dx = (Math.random() - 0.5) * 160, dy = -120 - Math.random() * 220;
                d.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 0.95 },
                    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2)', opacity: 0 }
                ], { duration: 700 + Math.random() * 500, delay: Math.random() * 250, easing: ease.out, fill: 'forwards' })
                    .finished.then(function (el) { return function () { el.remove(); }; }(d));
            }
        }

        var grid = document.getElementById('flGrid');
        var tpl = document.getElementById('flTpl');
        var players = [];

        OPTIONS.forEach(function (opt) {
            var node = tpl.content.firstElementChild.cloneNode(true);
            var stage = node.querySelector('.fl-stage');
            var card = node.querySelector('.fl-card');
            var btn = node.querySelector('.fl-btn');
            node.querySelector('.fl-name').innerHTML = opt.name + '<small>' + opt.note + '</small>';
            var anim = null, busy = false;

            function reset() {
                if (anim) anim.cancel();
                card.style.opacity = '';
                stage.classList.remove('is-done');
                if (opt.reset) opt.reset(stage);
            }
            function play() {
                if (busy) return;
                reset();
                busy = true; btn.textContent = '…';
                anim = opt.run(card, stage);
                anim.finished.then(function () {
                    stage.classList.add('is-done');
                    setTimeout(function () { busy = false; btn.textContent = 'Replay'; }, 300);
                });
            }
            btn.addEventListener('click', play);
            players.push(play);
            grid.appendChild(node);
        });

        document.getElementById('flAll').addEventListener('click', function () {
            players.forEach(function (p) { p(); });
        });
    })();
    </script>
</body>
</html>
