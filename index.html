<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; }
        .hero-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .hero-copy {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: clamp(60px, 14vh, 160px);
            color: #fff;
            font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        }
        .hero-welcome {
            font-size: clamp(22px, 6vw, 40px);
            font-weight: 300;
            letter-spacing: 0.02em;
        }
        .hero-welcome b {
            font-weight: 700;
        }
        .hero-slogan {
            margin-top: 14px;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <video class="hero-video" src="assets/hero/unisex.mp4" poster="assets/hero/autumn-hero.jpg"
           autoplay muted loop playsinline></video>
    <div class="hero-copy">
        <div class="hero-welcome">welcome to <b>moravchick</b></div>
        <div class="hero-slogan">straight elegance</div>
    </div>
</body>
</html>
