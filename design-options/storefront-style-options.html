<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Archivo+Black&family=Special+Elite&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Rubik:wght@400;600;800&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 8px; direction: rtl; }
.note { text-align: center; color: var(--muted); font-size: 12px; margin: 0 auto 34px; direction: rtl; max-width: 640px; line-height: 1.6; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 284px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.swr { display: flex; gap: 5px; margin-top: 8px; direction: ltr; justify-content: flex-end; }
.swr i { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }

.phone { width: 284px; height: 960px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 1360px; transform: scale(0.7); transform-origin: 0 0; position: relative; overflow: hidden;
  background: var(--bg); color: var(--ink); font-family: var(--fb); }
.th { display: block; background: #ddd center / cover no-repeat; filter: var(--imgf, none); }
.money { font-variant-numeric: tabular-nums; }

/* top chrome over the hero */
.top { position: absolute; top: 0; left: 0; right: 0; height: 70px; padding: 32px 20px 0; display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase; z-index: 5; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-family: 'Inter', sans-serif; }

/* 1 — hero */
.hero { height: 360px; position: relative; }
.hero .th { position: absolute; inset: 0; }

/* 2 — caption below the hero */
.cap { padding: 20px 22px 0; }
.cap .k { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); }
.cap .nm { font-family: var(--fh); font-size: 40px; line-height: 1; margin: 9px 0 7px; color: var(--ink); font-weight: 400; }
.cap .bio { font-size: 14px; color: var(--sub); line-height: 1.35; }
.cap .meta { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
.cap .fol { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 22px; border: 1px solid var(--accent); color: var(--accent); border-radius: var(--btr, 999px); }
.cap .fol.fill { background: var(--accent); color: var(--onacc, #fff); }
.cap .stats { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 1px; color: var(--sub); }
.cap .stats b { color: var(--ink); }

/* section header */
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px; margin: 28px 0 13px; }
.sh b { font-family: var(--fh); font-weight: 400; font-size: 21px; color: var(--ink); }
.sh span { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }

/* 3 — product slider */
.slider { display: flex; gap: 13px; overflow: hidden; padding: 0 22px; }
.pc { width: 134px; flex: none; }
.pc .th { aspect-ratio: 3/4; border-radius: var(--pr, 0); }
.pc .l { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; }
.pc .s { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sub); margin-top: 2px; }

/* 4 — gender selection */
.gen { display: flex; gap: 11px; padding: 0 22px; }
.gen .g { flex: 1; text-align: center; }
.gen .g .th { height: 108px; border-radius: var(--gr, 0); }
.gen .g span { font-family: 'Inter', sans-serif; display: block; font-size: 11px; letter-spacing: 1px; margin-top: 8px; color: var(--ink); }
.gen .g.on span { color: var(--accent); font-weight: 600; }
.gen .g.on .th { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 5 — clothing categories */
.cats { display: flex; flex-wrap: wrap; gap: 9px; padding: 0 22px 40px; }
.chip { font-family: 'Inter', sans-serif; border: 1px solid var(--line); border-radius: var(--btr, 999px); padding: 10px 16px; font-size: 12px; color: var(--ink); background: transparent; }
.chip.on { background: var(--accent); color: var(--onacc, #fff); border-color: var(--accent); }

/* bottom nav (app chrome) */
.nav { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 58px; border-radius: 29px; background: #141a24; display: flex; align-items: center; justify-content: space-around; z-index: 6; }
.nav i { width: 19px; height: 19px; border: 1.5px solid rgba(255,255,255,0.7); border-radius: 5px; display: block; }
.nav i.on { border-color: #ff5d5d; }
.nav i.plus { border: none; position: relative; }
.nav i.plus::before, .nav i.plus::after { content: ''; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,0.7); }
.nav i.plus::before { width: 15px; height: 1.5px; margin: -0.75px 0 0 -7.5px; } .nav i.plus::after { width: 1.5px; height: 15px; margin: -7.5px 0 0 -0.75px; }

/* ===== per-style flourishes ===== */
.s1 .cap .nm { font-weight: 200; letter-spacing: 1px; }
.s2 .cap .nm i { font-style: italic; }
.s3 .cap { text-align: center; } .s3 .cap .nm { letter-spacing: 5px; text-transform: uppercase; font-size: 30px; }
.s3 .cap .meta { justify-content: center; }
.s3 .pc .th { border-radius: 999px 999px 6px 6px; } .s3 .gen .g .th { border-radius: 999px 999px 6px 6px; }
.s3 .cats { justify-content: center; } .s3 .pc .l { display: block; text-align: center; } .s3 .pc .l .money { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
.s4 .mar { background: #ff5a1f; color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; height: 28px; display: flex; align-items: center; margin-top: 16px; }
.s4 .cap { padding-top: 10px; } .s4 .cap .nm { font-size: 58px; line-height: 0.88; text-transform: uppercase; letter-spacing: -1px; }
.s4 .pc .th { border: 3px solid #111; } .s4 .pc:nth-child(even) { margin-top: 10px; }
.s4 .gen .g .th { border: 3px solid #111; }
.s4 .chip.on { transform: rotate(-2deg); }
.s5 .cap { text-align: center; } .s5 .cap .nm { letter-spacing: 1px; } .s5 .cap .bio { font-family: 'Caveat', cursive; font-size: 20px; transform: rotate(-1.5deg); }
.s5 .pc { background: #fbf8f1; padding: 7px 7px 26px; box-shadow: 0 6px 14px rgba(0,0,0,0.16); }
.s5 .pc:nth-child(odd) { transform: rotate(-2.5deg); } .s5 .pc:nth-child(even) { transform: rotate(2deg); }
.s5 .pc .th { aspect-ratio: 1/1.1; } .s5 .pc .l { font-family: 'Caveat', cursive; font-size: 18px; } .s5 .pc .s { display: none; }
.s5 .slider { padding-top: 6px; padding-bottom: 6px; }
.s5 .gen .g .th { box-shadow: 0 4px 10px rgba(0,0,0,0.14); }
.s6 .cap { text-align: center; } .s6 .cap .nm { font-family: 'Inter', sans-serif; font-weight: 200; font-size: 24px; letter-spacing: 8px; text-transform: uppercase; }
.s6 .cap .bio { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
.s6 .cap .meta { justify-content: center; }
.s6 .pc .th { border: 8px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 10px 22px rgba(0,0,0,0.08); }
.s7 .cap .nm { font-family: 'Rubik', sans-serif; font-weight: 800; background: linear-gradient(90deg, #7b5cd6, #ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; }
.s7 .pc .th { border-radius: 18px; } .s7 .gen .g .th { border-radius: 18px; }
.s7 .sh b { font-weight: 600; }
.s8 .cap { text-align: center; margin-top: -70px; position: relative; z-index: 1; }
.s8 .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,36,25,0) 45%, #0f2419); }
.s8 .cap .nm { letter-spacing: 4px; text-transform: uppercase; font-size: 30px; }
.s8 .cap .meta { justify-content: center; }
.s8 .gold { height: 1px; background: linear-gradient(90deg, transparent, #c8a24a, transparent); margin: 16px 40px 0; }
.s8 .pc .th, .s8 .gen .g .th { outline: 1px solid rgba(200,162,74,0.45); outline-offset: 4px; }
.s8 .pc .s { color: #c8a24a; }
</style>
</head>
<body>
<h1>Storefront — סגנונות עיצוב</h1>
<p class="sub">8 סגנונות לחנות של המוכר · צבעים, טיפוגרפיה והצגת מוצרים</p>
<p class="note">כולם חולקים את אותו מבנה: הירו עם כיתוב מתחתיו · סליידר של 5 מוצרים · בחירת מגדר · בחירת קטגוריית לבוש. כל סגנון מלביש את המבנה הזה אחרת.</p>

<div class="grid" id="opts"></div>

<script>
var IM = {
  men: { img: '../men-hero.jpg', pos: '50% 30%' }, women: { img: '../women-hero.jpg', pos: '30% 40%' },
  cloth: { img: '../clothing-hero.jpg', pos: '50% 50%' }, beach: { img: '../hero-beach.jpg', pos: '50% 50%' },
  gal: { img: '../gallery-hero.jpg', pos: '50% 50%' }, mag: { img: '../magazine-hero.jpg', pos: '50% 50%' },
  art: { img: '../art-hero.jpg', pos: '50% 50%' }
};
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var PRD = [['Wool Coat', 380, IM.men], ['Linen Shirt', 120, IM.women], ['Leather Bag', 240, IM.cloth], ['Silk Scarf', 90, IM.beach], ['Denim Jacket', 210, IM.gal]];
var GEN = [['Women', IM.women], ['Men', IM.men], ['Kids', IM.cloth], ['Unisex', IM.beach]];
var CAT = ['Dresses', 'Coats', 'Shirts', 'Knitwear', 'Denim', 'Shoes', 'Bags', 'Accessories'];

var NAV = '<div class="nav"><i class="on"></i><i></i><i class="plus"></i><i></i><i></i></div>';
var topBar = '<div class="top"><span>‹ Back</span><span>Share</span></div>';

function store(cfg) {
  var s = cfg.store;
  var slider = '<div class="slider">' + PRD.map(p =>
    '<div class="pc"><span class="th" ' + bg(p[2]) + '></span><div class="l"><span>' + p[0] + '</span><span class="money">₪' + p[1] + '</span></div><div class="s">' + s.name + '</div></div>').join('') + '</div>';
  var gen = '<div class="gen">' + GEN.map((g, k) =>
    '<div class="g' + (k === 0 ? ' on' : '') + '"><span class="th" ' + bg(g[1]) + '></span><span>' + g[0] + '</span></div>').join('') + '</div>';
  var cats = '<div class="cats">' + CAT.map((c, k) => '<span class="chip' + (k === 0 ? ' on' : '') + '">' + c + '</span>').join('') + '</div>';
  var cap = '<div class="cap">' +
      (cfg.id === 's8' ? '' : '<div class="k">' + (s.kicker || 'The shop of') + '</div>') +
      '<div class="nm">' + s.nm + '</div>' +
      '<div class="bio">' + s.bio + '</div>' +
      (cfg.id === 's8' ? '<div class="gold"></div>' : '') +
      '<div class="meta"><span class="fol' + (cfg.folFill ? ' fill' : '') + '">Follow</span><span class="stats"><b>' + s.f + '</b> followers · <b>' + s.it + '</b> items · ★ <b>' + s.r + '</b></span></div></div>';
  return '<div class="screen ' + cfg.id + '" style="' + cfg.vars + '">' + topBar +
    '<div class="hero"><span class="th" ' + bg(s.hero) + '></span></div>' +
    (cfg.id === 's4' ? '<div class="mar">&nbsp;★ NEW DROP FRIDAY ★ FREE SHIPPING OVER ₪200 ★ NEW DROP FRIDAY ★ FREE SHIPPING</div>' : '') +
    cap +
    '<div class="sh"><b>New in</b><span>See all</span></div>' + slider +
    '<div class="sh"><b>Shop by</b><span>Gender</span></div>' + gen +
    '<div class="sh"><b>Clothing</b><span>8 categories</span></div>' + cats + NAV + '</div>';
}

var V = (o) => Object.keys(o).map(k => '--' + k + ':' + o[k]).join(';');
var OPTS = [
  ['S1 · מינימל נואר', 'שחור-לבן נקי, שם דק ותמונות בגווני אפור. מלוטש ומינימלי.', ['#111', '#fff', '#8a857d'], {
    id: 's1', vars: V({ bg: '#fff', ink: '#111', sub: '#8a857d', accent: '#111', line: '#e6e3dd', fh: "'Inter',sans-serif", fb: "'Inter',sans-serif", imgf: 'grayscale(1)' }),
    folFill: true, store: { nm: 'Studio Vero', bio: 'Slow fashion, sourced in Tel Aviv.', hero: IM.beach, name: 'Studio Vero', f: '1.2k', it: 42, r: '4.9', kicker: 'The shop of' } }],
  ['S2 · עריכתי', 'קרם עם Bodoni ונטוי, כמו מגזין אופנה.', ['#f6f1e8', '#2a251d', '#9a7d52'], {
    id: 's2', vars: V({ bg: '#f6f1e8', ink: '#2a251d', sub: '#6b5f4d', accent: '#9a7d52', line: '#ddd3c2', fh: "'Bodoni Moda',serif", fb: "'Cormorant Garamond',serif", imgf: 'sepia(0.15)' }),
    store: { nm: 'Studio <i>Vero</i>', bio: 'Slow fashion, sourced in Tel Aviv.', hero: IM.women, name: 'Studio Vero', f: '1.2k', it: 42, r: '4.9', kicker: 'The shop of' } }],
  ['S3 · אטלייה', 'בז׳ חם, שם רווח, ותמונות בצורת קשת. בוטיק מוקפד.', ['#efe6da', '#3b2f25', '#8c7560'], {
    id: 's3', vars: V({ bg: '#efe6da', ink: '#3b2f25', sub: '#8c7560', accent: '#8c7560', line: '#d8cab5', fh: "'Cormorant Garamond',serif", fb: "'Cormorant Garamond',serif", imgf: 'sepia(0.2)' }),
    store: { nm: 'Atelier Nord', bio: 'Hand-picked, mended with care.', hero: IM.men, name: 'Atelier Nord', f: 980, it: 28, r: '4.8', kicker: 'Est. 2019 · Tel Aviv' } }],
  ['S4 · סטריט / דרופ', 'שם ענק, פס כתום רץ וכרטיסים עם מסגרת עבה. אנרגטי.', ['#fff', '#ff5a1f', '#111'], {
    id: 's4', vars: V({ bg: '#fff', ink: '#111', sub: '#555', accent: '#ff5a1f', onacc: '#fff', line: '#111', btr: '0', fh: "'Archivo Black',sans-serif", fb: "'Inter',sans-serif", imgf: 'none' }),
    folFill: true, store: { nm: 'Denim Lab', bio: '@denimlab · drops every Friday.', hero: IM.gal, name: 'Denim Lab', f: '3.4k', it: 36, r: '4.8', kicker: 'Drop 07 · live now' } }],
  ['S5 · וינטג׳', 'נייר, כתב מכונת כתיבה, ומוצרים כפולארויד עקום.', ['#e8dcc6', '#3a2e22', '#b5452f'], {
    id: 's5', vars: V({ bg: '#e8dcc6', ink: '#3a2e22', sub: '#5a4632', accent: '#b5452f', line: '#3a2e22', fh: "'Special Elite',monospace", fb: "'Special Elite',monospace", imgf: 'sepia(0.4) contrast(0.95)' }),
    store: { nm: 'Vintage Vault', bio: 'every piece has a story ♡', hero: IM.mag, name: 'vintage vault', f: 640, it: 55, r: '4.7', kicker: 'second hand · since 1998' } }],
  ['S6 · גלריה', 'הרבה לבן, שם רווח, ותמונות ממוסגרות. לאמנות ומעצבים.', ['#fafaf8', '#222', '#999'], {
    id: 's6', vars: V({ bg: '#fafaf8', ink: '#222', sub: '#999', accent: '#222', line: '#e3e3e0', fh: "'Inter',sans-serif", fb: "'Inter',sans-serif", imgf: 'none' }),
    store: { nm: 'Gallery Nine', bio: 'Contemporary works · Jaffa', hero: IM.art, name: 'Gallery Nine', f: 820, it: 18, r: '5.0', kicker: 'Est. 2016' } }],
  ['S7 · צבעוני / Y2K', 'גרדיאנט לבנדר-ורוד וכרטיסים מעוגלים. צעיר ושובב.', ['#f6e9ff', '#7b5cd6', '#ff5fa2'], {
    id: 's7', vars: V({ bg: 'linear-gradient(170deg,#f6e9ff,#ffe3f1 50%,#e8f0ff)', ink: '#2b2147', sub: '#6a5d8a', accent: '#ff5fa2', onacc: '#fff', line: '#e7ddf5', fh: "'Rubik',sans-serif", fb: "'Rubik',sans-serif", imgf: 'none' }),
    folFill: true, store: { nm: 'Pastel Works', bio: 'thrifted cuties, packed with love 💌', hero: IM.women, name: 'Pastel Works', f: '2.1k', it: 60, r: '4.9', kicker: 'ships in 24h' } }],
  ['S8 · יוקרה כהה', 'ירוק עמוק עם זהב ומסגרות מוזהבות. לשעונים ותכשיטים.', ['#0f2419', '#c8a24a', '#efe9da'], {
    id: 's8', vars: V({ bg: '#0f2419', ink: '#efe9da', sub: '#b9b19c', accent: '#c8a24a', line: 'rgba(200,162,74,0.4)', fh: "'Bodoni Moda',serif", fb: "'Cormorant Garamond',serif", imgf: 'grayscale(0.3) sepia(0.2) brightness(0.92)' }),
    store: { nm: 'Luxe Atelier', bio: 'Rare pieces, quietly kept.', hero: IM.cloth, name: 'Luxe Atelier', f: '2.1k', it: 36, r: '5.0' } }]
];

document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + store(o[3]) + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span><div class="swr">' + o[2].map(c => '<i style="background:' + c + '"></i>').join('') + '</div></div></div>').join('');
</script>
</body>
</html>
