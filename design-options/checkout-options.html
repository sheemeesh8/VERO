<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #efede9; --ink: #111; --muted: #77736c; --line: #e4e1dc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: #111; }
/* Dimmed cart behind a sheet. */
.behind { position: absolute; inset: 0; background: #fff; }
.behind .bh { padding: 44px 24px 12px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
.behind .bg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 24px; }
.behind .bc { aspect-ratio: 3/4; background: #f1efeb center / cover no-repeat; filter: grayscale(1); }
.scrim { position: absolute; inset: 0; background: rgba(20,18,14,0.5); }
.money { font-variant-numeric: tabular-nums; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 12px 24px 28px; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: #ddd; margin: 0 auto 16px; }
.s-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 18px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row .th { width: 46px; height: 58px; flex: none; background: #eee center / cover no-repeat; filter: grayscale(1); }
.row .nm { flex: 1; min-width: 0; } .row .nm b { font-weight: 400; font-size: 14px; display: block; } .row .nm small { color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.row .pr { font-size: 14px; }
.sums { padding: 14px 0 4px; } .sums p { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
.sums p.t { color: #111; font-size: 18px; margin: 10px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.cta { display: block; text-align: center; background: #111; color: #fff; padding: 17px; margin-top: 18px; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.cta.pill { border-radius: 40px; }

/* B — full screen */
.b .top { display: flex; align-items: center; justify-content: space-between; padding: 44px 24px 16px; }
.b .top b { font-size: 24px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
.b .top .x { font-size: 24px; color: #999; }
.b .sec { padding: 8px 24px; } .b .sec h4 { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin: 14px 0 10px; }
.b .opt2 { display: flex; gap: 8px; } .b .opt2 span { flex: 1; text-align: center; padding: 13px; border: 1px solid var(--line); font-size: 11px; letter-spacing: 1px; } .b .opt2 span.on { border-color: #111; background: #111; color: #fff; }
.b .pay { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); padding: 14px; font-size: 13px; } .b .pay i { width: 34px; height: 22px; background: #111; border-radius: 3px; flex: none; }
.b .bar { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 14px 24px 28px; display: flex; align-items: center; gap: 16px; }
.b .bar div { flex: 1; } .b .bar .k { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); } .b .bar b { font-size: 22px; font-weight: 400; }
.b .bar .go { flex: none; background: #111; color: #fff; padding: 16px 26px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* C — by seller */
.c .top { padding: 44px 24px 6px; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
.c .note { margin: 0 24px 14px; font-size: 12px; color: var(--muted); }
.c .grp { border: 1px solid var(--line); margin: 0 24px 12px; }
.c .gh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.c .gh b { font-size: 13px; font-weight: 400; display: flex; align-items: center; gap: 8px; } .c .gh b::before { content: ''; width: 20px; height: 20px; border-radius: 50%; background: #111; }
.c .gh span { font-size: 10px; color: var(--muted); }
.c .gr { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 12px; } .c .gr small { color: var(--muted); }
.c .gf { display: flex; justify-content: space-between; padding: 9px 14px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--muted); }
.c .bar { position: absolute; left: 0; right: 0; bottom: 0; background: #111; color: #fff; padding: 16px 24px 30px; display: flex; align-items: center; }
.c .bar div { flex: 1; } .c .bar .k { font-size: 9px; letter-spacing: 2px; color: #aaa; text-transform: uppercase; } .c .bar b { font-size: 20px; font-weight: 400; }
.c .bar span { background: #fff; color: #111; padding: 14px 22px; border-radius: 30px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* D — centered modal */
.d .scrim { background: rgba(20,18,14,0.55); }
.d .card { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); background: #fff; padding: 28px 24px; text-align: center; }
.d .card .k { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
.d .card .big { font-size: 46px; font-weight: 400; margin: 10px 0 4px; }
.d .card .cnt { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.d .thumbs { display: flex; justify-content: center; gap: 6px; margin-bottom: 22px; }
.d .thumbs div { width: 44px; height: 54px; background: #eee center / cover no-repeat; filter: grayscale(1); }
.d .card p { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 16px; }

/* E — receipt confirmation */
.e { background: #e9e6e0; }
.e .slip { position: absolute; left: 26px; right: 26px; top: 60px; background: #fbfaf7; padding: 26px 22px 30px; font-family: 'Courier New', monospace; font-size: 12px; color: #222;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; }
.e .tick { width: 46px; height: 46px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; margin: 0 auto 12px; font-size: 22px; }
.e .slip h4 { font-family: 'Aharoni CLM', sans-serif; font-weight: 700; font-size: 20px; text-align: center; letter-spacing: 1px; }
.e .slip .s { text-align: center; font-size: 10px; letter-spacing: 2px; color: #777; margin-top: 4px; }
.e hr { border: 0; border-top: 1px dashed #aaa; margin: 14px 0; }
.e .ln { display: flex; gap: 6px; margin: 7px 0; } .e .ln span:nth-child(2) { flex: 1; border-bottom: 1px dotted #bbb; transform: translateY(-4px); }
.e .ln.t { font-weight: 700; font-size: 14px; }
.e .no { text-align: center; font-size: 10px; letter-spacing: 3px; color: #777; margin-top: 12px; }
.e .cta { position: absolute; left: 26px; right: 26px; bottom: 30px; }

/* F — dark sheet */
.f .behind { background: #f1efeb; }
.f .sheet { background: #0d0d0d; color: #f2efea; }
.f .grip { background: #444; }
.f .s-title { color: #8a857d; }
.f .row { border-color: #262626; }
.f .row .nm small { color: #8a857d; }
.f .sums p.t { border-color: #333; }
.f .cta { background: #f2efea; color: #111; }
</style>
</head>
<body>
<h1>Checkout — אופציות</h1>
<p class="sub">חלונית הצ׳קאאוט עם רשימת המוצרים · 6 כיוונים</p>
<div class="grid" id="grid"></div>

<script>
var IT = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      pos: '50% 30%' },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    pos: '50% 50%' }
];
var SUB = 1880, SHIP = 40, TOTAL = SUB + SHIP;
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var bg = function (i) { return 'style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"'; };
var behind = '<div class="behind"><div class="bh">Cart</div><div class="bg">' +
  IT.concat(IT).slice(0,4).map(function(i){return '<div class="bc" '+bg(i)+'></div>';}).join('') + '</div></div>';
var rows = IT.map(function (i) { return '<div class="row"><div class="th" ' + bg(i) + '></div><div class="nm"><b>' + i.n + '</b><small>' + i.s + '</small></div><div class="pr money">' + m(i.p) + '</div></div>'; }).join('');
var sums = '<div class="sums"><p><span>Subtotal</span><span class="money">' + m(SUB) + '</span></p><p><span>Shipping</span><span class="money">' + m(SHIP) + '</span></p><p class="t"><span>Total</span><span class="money">' + m(TOTAL) + '</span></p></div>';

var OPTS = [
  ['A · גיליון קלאסי', 'גיליון שעולה מעל העגלה המעומעמת: רשימת המוצרים, סכום־ביניים, משלוח וסה״כ, וכפתור "Place order". הכי מוכר ובטוח.',
   '<div class="screen">' + behind + '<div class="scrim"></div><div class="sheet"><div class="grip"></div><div class="s-title">Checkout · 3 items</div>' + rows + sums + '<span class="cta">Place order</span></div></div>'],

  ['B · מסך מלא, הזמנה', 'מסך סקירה מלא: פריטים, בחירת משלוח / איסוף, אמצעי תשלום, ופס סה״כ + "Place order" קבוע למטה. הכי מפורט.',
   '<div class="screen b"><div class="top"><b>Review order</b><span class="x">&times;</span></div><div class="sec">' +
   rows.replace(/padding: 10px 0/g,'') + '</div><div class="sec"><h4>Delivery</h4><div class="opt2"><span class="on">Shipping</span><span>Pickup</span></div></div>' +
   '<div class="sec"><h4>Payment</h4><div class="pay"><i></i>Visa ending 4242</div></div>' +
   '<div class="bar"><div><div class="k">Total</div><b class="money">' + m(TOTAL) + '</b></div><span class="go">Place order</span></div></div>'],

  ['C · לפי מוכר', 'מתאים למרקטפלייס: הפריטים מקובצים לכל מוכר עם הסכום והמשלוח שלו, והערה שתפתח שיחה עם כל מוכר. גלולה שחורה למטה.',
   '<div class="screen c"><div class="top">Checkout</div><div class="note">You’ll place 3 orders and start a chat with each seller.</div>' +
   [['Atelier Nord',[IT[0]],'₪25'],['Sole Society',[IT[1]],'Free'],['Studio Vero',[IT[2]],'₪15']].map(function(g){
     return '<div class="grp"><div class="gh"><b>'+g[0]+'</b><span>'+g[1].length+' item</span></div>'+
       g[1].map(function(i){return '<div class="gr"><span>'+i.n+'</span><span class="money">'+m(i.p)+'</span></div>';}).join('')+
       '<div class="gf"><span>Shipping</span><span>'+g[2]+'</span></div></div>';}).join('') +
   '<div class="bar"><div><div class="k">Total incl. shipping</div><b class="money">'+m(1880+40)+'</b></div><span>Place orders</span></div></div>'],

  ['D · חלונית קטנה במרכז', 'מודאל קטן ממורכז: הסכום הגדול, קולאז׳ זעיר של הפריטים ומשפט שמסביר שתיפתח שיחה עם המוכרים. מהיר ולא עמוס.',
   '<div class="screen"><div class="behind"><div class="bh">Cart</div><div class="bg">' + IT.concat(IT).slice(0,4).map(function(i){return '<div class="bc" '+bg(i)+'></div>';}).join('') + '</div></div><div class="d"><div class="scrim"></div><div class="card"><div class="k">Checkout</div><div class="big money">' + m(TOTAL) + '</div><div class="cnt">3 items · incl. shipping</div><div class="thumbs">' + IT.map(function(i){return '<div '+bg(i)+'></div>';}).join('') + '</div><span class="cta">Confirm &amp; message sellers</span><p>You’ll chat with each seller to arrange pickup or delivery.</p></div></div></div>'],

  ['E · קבלה (אישור)', 'אחרי אישור: פתק קבלה עם וי, פירוט ההנחות והסה״כ וברקוד. ממשיך את שפת הקבלה מהסייל, ומתאים כמסך "ההזמנה נקלטה".',
   '<div class="screen e"><div class="slip"><div class="tick">&#10003;</div><h4>Order placed</h4><div class="s">moravchick · 04.10.26</div><hr>' +
   IT.map(function(i){return '<div class="ln"><span>'+i.n.toUpperCase()+'</span><span></span><span>'+i.p+'</span></div>';}).join('') +
   '<hr><div class="ln"><span>SHIPPING</span><span></span><span>'+SHIP+'</span></div><div class="ln t"><span>TOTAL ₪</span><span></span><span>'+TOTAL.toLocaleString('en-US')+'</span></div><div class="no">* VIEW IN CHATS *</div></div><span class="cta">Go to chats</span></div>'],

  ['F · גיליון כהה', 'אותו גיליון כמו A, אבל שחור עם טקסט בהיר וכפתור לבן. מתאים לסרגל הניווט הכהה וללוק יוקרתי.',
   '<div class="screen f">' + behind + '<div class="scrim"></div><div class="sheet"><div class="grip"></div><div class="s-title">Checkout · 3 items</div>' + rows + sums + '<span class="cta pill">Place order &#8594;</span></div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
