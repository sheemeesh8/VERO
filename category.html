<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse a moravchick category — its hero and a grid of pieces.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Category</title>
    <script src="vero-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Arimo:wght@400;500;600;700&family=Poppins:wght@200;300;400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="product-card.css?v=10">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: auto; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; direction: ltr;
            font-family: 'Archivo','Inter',system-ui,sans-serif; }

        /* ===== Category hero — full-screen image, white band over its base ===== */
        .cat-hero { position: relative; width: 100%; height: 100vh; height: 100svh; min-height: 480px; overflow: hidden; background: #000;
            /* Band (search + "most liked" slider) ~1/3; image keeps the top 2/3. */
            --band-h: max(33svh, 300px); }
        .cat-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .cat-hero::after { content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.45) 100%); }
        /* Title sits just above the white band at the base of the full-screen image. */
        .cat-hero-copy { position: absolute; left: 0; right: 0; bottom: 33svh; bottom: var(--band-h); z-index: 1;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 0 20px 24px; color: #fff; }
        .cat-eyebrow { font-family: 'Arimo','Inter',sans-serif; font-size: 9.35px; letter-spacing: 3px;
            text-transform: uppercase; opacity: 0.85; margin-bottom: 10px; }
        .cat-title { font-family: 'Poppins','Inter',sans-serif; font-weight: 300; margin: 0;
            font-size: clamp(25.5px, 6.8vw, 47.6px); letter-spacing: 0.01em; }
        .cat-sub { margin: 12px 0 0; font-size: clamp(10.2px, 2.89vw, 12.75px); font-weight: 400;
            letter-spacing: 0.5px; opacity: 0.92; max-width: 560px; }

        /* The white band floats over the base of the full-screen image: search +
           a "Most liked" slider. It rises into view (slide-in) after settling. */
        .cat-intro { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
            height: 33svh; height: var(--band-h); background: #fff;
            display: flex; flex-direction: column; align-items: stretch; justify-content: center;
            gap: 14px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%); opacity: 0;
            animation: catIntroRise .72s cubic-bezier(.2,.75,.25,1) .5s forwards; }
        @keyframes catIntroRise { to { transform: translateY(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .cat-intro { transform: none; opacity: 1; animation: none; }
        }
        .cat-search { width: 100%; max-width: 520px; margin: 0 auto; }
        .cat-search input { width: 100%; height: 48px; border: 1px solid #d9d7d2; border-radius: 999px;
            padding: 0 22px; font-size: 11.9px; font-family: 'Arimo','Inter',sans-serif; color: #1b1916;
            background: #fff; outline: none; transition: border-color .2s; }
        .cat-search input:focus { border-color: #1b1916; }

        /* "Most liked" slider inside the band (transparent product cards). */
        .cat-rail-head { font-family: 'Arimo','Inter',sans-serif; font-size: 9.35px; letter-spacing: 1.5px;
            text-transform: uppercase; color: #3c3935; text-align: center; margin: 0; }
        .rail-trans { display: flex; gap: 16px; overflow-x: auto; padding: 2px 0; margin: 0 -4px;
            scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
        .rail-trans::-webkit-scrollbar { display: none; }
        /* Two pieces per view, snapping — matches the feed sliders. */
        .rt-card { flex: 0 0 calc(50% - 8px); width: calc(50% - 8px); scroll-snap-align: start; text-decoration: none; color: #1b1916; }
        .rt-img { position: relative; width: 100%; aspect-ratio: 1.1; background: transparent;
            display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .rt-img img { width: 100%; height: 100%; object-fit: contain; }
        .rt-emoji { font-size: 39.1px; opacity: .5; }
        .rt-pct { position: absolute; top: 4px; right: 8px; z-index: 3; height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 5px; background: #B3433B; color: #fff; font-family: 'Archivo',sans-serif; font-size: 8.5px; font-weight: 800; }
        .rt-cap { text-align: center; margin-top: 6px; }
        .rt-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 9.35px; letter-spacing: 1px; text-transform: uppercase; color: #3c3935; }
        .rt-name { font-family: 'Archivo','Inter',sans-serif; font-size: 10.2px; letter-spacing: .4px; text-transform: uppercase; color: #1b1916; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rt-price { font-family: 'Archivo','Inter',sans-serif; font-size: 10.2px; color: #1b1916; margin-top: 3px; }
        .rt-card.is-sale .rt-price { color: #B3433B; }
        .rt-was { font-family: 'Arimo',sans-serif; font-size: 8.92px; color: #44423d; text-decoration: line-through; margin-right: 5px; }

        /* ===== Grid ===== */
        .cat-wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
        .cat-count { font-family: 'Arimo','Inter',sans-serif; font-size: 10.2px; letter-spacing: 1.5px;
            text-transform: uppercase; color: #3c3935; margin: 0 0 12px; }
        .cat-grid { display: grid; gap: 14px 14px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        @media (min-width: 680px) { .cat-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
        .cat-empty { text-align: center; color: #3c3935; padding: 60px 0; font-size: 11.9px; letter-spacing: 0.4px; }
        /* ===== Under the hero: search + filter (fine line, as on the cart / wishlist) ===== */
        .cat-controls { display: flex; align-items: flex-end; gap: 16px; margin: 6px 0 18px; }
        .cc-search { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 0 11px; border-bottom: 1px solid #1b1916; cursor: text; }
        .cc-search svg, .cc-filter svg { flex: none; fill: none; stroke: #1b1916; stroke-linecap: round; stroke-linejoin: round; }
        .cc-search svg { width: 16px; height: 16px; stroke-width: 1.3; }
        .cc-search input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: none; font-size: 11.05px; letter-spacing: 0.3px; color: #1b1916; -webkit-appearance: none; }
        .cc-search input::placeholder { color: #413e39; }
        .cc-filter { position: relative; flex: none; display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; transform: translateY(-4px); transition: opacity .2s; }
        .cc-filter svg { width: 21px; height: 21px; stroke-width: 1; }   /* smaller and lighter */
        .cc-filter:hover { opacity: .55; }
        .cc-dot { position: absolute; top: 2px; right: 0; width: 7px; height: 7px; border-radius: 50%; background: #B3433B; }
        .cc-dot[hidden] { display: none; }
        .cc-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(20,18,14,0.4); display: flex; align-items: flex-end; justify-content: center; }
        .cc-overlay[hidden] { display: none; }
        .cc-sheet { width: 100%; max-width: 560px; background: #fff; padding: 20px 22px calc(26px + env(safe-area-inset-bottom, 0px)); animation: ccRise .34s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes ccRise { from { transform: translateY(100%); } to { transform: none; } }
        .cc-grip { width: 40px; height: 3px; background: #e6e1d8; margin: 0 auto 16px; }
        .cc-h { margin: 0 0 6px; font-size: 11.9px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
        .cc-k { margin: 18px 0 9px; font-size: 7.8px; letter-spacing: 2px; text-transform: uppercase; color: #45423d; }
        .cc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .cc-chip { padding: 9px 13px; border: 1px solid #d8d3ca; background: #fff; color: #16150f; cursor: pointer; font-size: 9.35px; letter-spacing: .4px; }
        .cc-chip.on { background: #16150f; border-color: #16150f; color: #fff; }
        .cc-acts { display: flex; gap: 10px; margin-top: 24px; }
        .cc-clear, .cc-go { flex: 1; min-height: 46px; cursor: pointer; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
        .cc-clear { flex: 0 0 34%; background: #fff; border: 1px solid #16150f; color: #16150f; }
        .cc-go { background: #16150f; border: 1px solid #16150f; color: #fff; }
        /* The hero title in the site's Bodoni (above the universal Raleway rule in site-font.css). */
        .cat-title:not(#bmz):not(#bmz):not(#bmz):not(#bmz):not(#bmz) { font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif !important; font-weight: 400; }
        /* ===== Hero like the home page's: three quarters of the screen, the words low
           on the left — eyebrow, a large Bodoni title, the line — over a deeper foot shade. ===== */
        .cat-hero:not(#zz) { height: 75vh; height: 75svh; min-height: 460px; }
        .cat-hero::after { background: linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 46%, rgba(0,0,0,0.62) 100%); }
        .cat-hero-copy:not(#zz) { left: 22px; right: 22px; bottom: 30px; align-items: flex-start; text-align: left; padding: 0; }
        .cat-eyebrow { font-size: 8.5px; letter-spacing: 3px; margin-bottom: 12px; opacity: 0.92; text-shadow: 0 1px 10px rgba(0,0,0,0.4); }
        .cat-title:not(#bmz):not(#bmz):not(#bmz):not(#bmz):not(#bmz) { font-weight: 500; font-size: clamp(40px, 12.3vw, 56px); line-height: 0.95; letter-spacing: 0;
            max-width: 290px; text-shadow: 0 2px 22px rgba(0,0,0,0.35); }
        .cat-sub { margin-top: 12px; max-width: 270px; font-size: 11.5px; font-weight: 300; line-height: 1.55; letter-spacing: 0.2px; opacity: 0.9; text-shadow: 0 1px 12px rgba(0,0,0,0.4); }
        /* The slider sits in the page now, under the search row (no white band over the photo). */
        .cat-intro:not(#zz) { position: static; height: auto; transform: none; opacity: 1; animation: none; padding: 0; margin: 4px 0 30px; gap: 14px; }
        .cat-controls { margin-top: 10px; }
        /* Over the photo the site header reads white, as on the home page; dark once scrolled. */
        body #siteHeader:not(.scrolled) .logo,
        body #siteHeader:not(.scrolled) .logo-script,
        body #siteHeader:not(.scrolled) .icon-btn { color: #fff !important; }
        body #siteHeader:not(.scrolled) .icon-btn svg { stroke: #fff !important; }
        body #siteHeader:not(.scrolled) .vero-hamburger span { background: #fff !important; }
    </style>
    <link rel="stylesheet" href="assets/site-font.css?v=3">
</head>
<body>
    <!-- Transparent header over the hero, solid once scrolled past it. -->
    <script>
        window.veroHeaderScrolled = function () { return window.scrollY > (window.innerHeight * 0.62); };
    </script>
    <script src="header.js?v=20261117e"></script>

    <section class="cat-hero" id="catHero">
        <img class="cat-hero-img" id="catHeroImg" alt="" />
        <div class="cat-hero-copy">
            <div class="cat-eyebrow" id="catEyebrow">moravchick</div>
            <h1 class="cat-title" id="catTitle">Collection</h1>
            <p class="cat-sub" id="catSub"></p>
        </div>
    </section>

    <main class="cat-wrap" id="catWrap">
        <!-- Under the hero: search + filter, the same fine-line row as the cart and wishlist. -->
        <div class="cat-controls">
            <label class="cc-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" id="catSearch" placeholder="Search&hellip;" autocomplete="off" aria-label="Search this collection">
            </label>
            <button class="cc-filter" type="button" id="catFilterBtn" aria-label="Filters" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24"><path d="M4 3h16l-8 9-8-9z"></path><path d="M12 12v8"></path><path d="M8 21h8"></path></svg>
                <i class="cc-dot" id="catFilterDot" hidden></i>
            </button>
        </div>
        <!-- As on the home page: the slider under the search row. -->
        <section class="cat-intro">
            <p class="cat-rail-head">Most liked</p>
            <div class="rail-trans" id="catRail"></div>
        </section>
        <p class="cat-count" id="catCount"></p>
        <div class="cat-grid" id="catGrid"></div>
    </main>

    <!-- Filters: sort, item type, on sale only. -->
    <div class="cc-overlay" id="catFilters" role="dialog" aria-modal="true" aria-label="Filters" hidden>
        <div class="cc-sheet">
            <div class="cc-grip"></div>
            <h3 class="cc-h">Filters</h3>
            <p class="cc-k">Sort</p>
            <div class="cc-chips" data-group="sort">
                <button type="button" class="cc-chip on" data-v="new">Newest</button>
                <button type="button" class="cc-chip" data-v="low">Price: low to high</button>
                <button type="button" class="cc-chip" data-v="high">Price: high to low</button>
            </div>
            <p class="cc-k">Item type</p>
            <div class="cc-chips" data-group="type" id="catTypes"></div>
            <p class="cc-k">Price</p>
            <div class="cc-chips" data-group="sale">
                <button type="button" class="cc-chip" data-v="sale">On sale only</button>
            </div>
            <div class="cc-acts"><button type="button" class="cc-clear" id="catFilterClear">Clear</button><button type="button" class="cc-go" id="catFilterGo">Show pieces</button></div>
        </div>
    </div>

    <div id="siteFooter"></div>

    <script src="collections.js"></script>
    <script src="footer.js"></script>
    <script>
    (function () {
        // ---- Category definitions. Each maps a circle to its hero + products.
        var CATS = {
            autumn: {
                eyebrow: 'The season', title: 'Autumn Collection',
                sub: 'This season’s edit — warm layers, soft wools and earthy tones.',
                hero: 'clothing-hero.jpg',
                pick: function (vc) { return vc.byCollection('autumn'); }
            },
            sale: {
                eyebrow: 'Up to 50% off', title: 'Sale',
                sub: 'Marked-down pieces across the shop — deepest cuts first.',
                hero: 'sale-hero.jpg',
                pick: function (vc) { return vc.onSale(); }
            },
            'new': {
                eyebrow: 'Just in', title: 'New Arrivals',
                sub: 'The latest pieces to land, fresh from our sellers.',
                hero: 'gallery-hero.jpg',
                pick: function (vc) {
                    return vc.allProducts().slice().sort(function (a, b) {
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    });
                }
            },
            gender: {
                eyebrow: 'Shop by', title: 'Gender',
                sub: 'Women, men, unisex and kids — the full moravchick wardrobe.',
                hero: 'women-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            },
            magazine: {
                eyebrow: 'Editorial', title: 'Magazine',
                sub: 'Stories, shoots and the pieces behind them.',
                hero: 'magazine-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            },
            events: {
                eyebrow: 'What’s on', title: 'Events',
                sub: 'Drops, pop-ups and moravchick happenings — and what to wear to them.',
                hero: 'art-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            }
        };

        function param(name) {
            try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
        }

        var key = (param('cat') || 'autumn').toLowerCase();
        var cfg = CATS[key] || CATS.autumn;

        document.title = 'moravchick — ' + cfg.title;
        document.getElementById('catHeroImg').src = cfg.hero;
        document.getElementById('catHeroImg').alt = cfg.title;
        document.getElementById('catEyebrow').textContent = cfg.eyebrow;
        document.getElementById('catTitle').textContent = cfg.title;
        document.getElementById('catSub').textContent = cfg.sub;

        var searchEl = document.getElementById('catSearch');
        searchEl.placeholder = 'Search ' + cfg.title + '\u2026';

        var allItems = null; // cached full list once collections.js is ready
        var railDrawn = false;

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

        // Transparent product card for the "Most liked" slider (no background).
        function transCard(vc, p) {
            var d = vc.discountOf(p._raw);
            var pct = d && d.onSale ? '<span class="rt-pct">-' + d.percent + '%</span>' : '';
            var inner = p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '" loading="lazy">'
                                : '<span class="rt-emoji">' + esc(p.icon || '🛍️') + '</span>';
            var price = d && d.onSale
                ? '<span class="rt-was">' + vc.money(d.original) + '</span>' + vc.money(d.price)
                : vc.money(p.price);
            var productData = JSON.stringify({ name: p.name, price: vc.toNum(d.onSale ? d.price : d.original),
                icon: p.icon, cover: p.cover || '', category: p.category || '', seller: p.seller });
            var href = 'product-showcase.html?product=' + encodeURIComponent(productData);
            return '<a class="rt-card' + (d && d.onSale ? ' is-sale' : '') + '" href="' + esc(href) + '" title="' + esc(p.name) + '">' +
                '<div class="rt-img">' + pct + inner + '</div>' +
                '<div class="rt-cap"><div class="rt-brand">' + esc(p.seller) + '</div>' +
                '<div class="rt-name">' + esc(p.name) + '</div>' +
                '<div class="rt-price">' + price + '</div></div></a>';
        }

        // Fill the "Most liked" slider — the category's most popular pieces
        // (by rating when available), newest as a tie-break.
        function drawRail(vc) {
            if (railDrawn) return;
            var rail = document.getElementById('catRail');
            if (!rail || !allItems) return;
            var liked = allItems.slice().sort(function (a, b) {
                var ra = (a._raw && a._raw.rating) || 0, rb = (b._raw && b._raw.rating) || 0;
                if (rb !== ra) return rb - ra;
                return (b.createdAt || 0) - (a.createdAt || 0);
            }).slice(0, 10);
            if (liked.length) { rail.innerHTML = liked.map(function (p) { return transCard(vc, p); }).join(''); railDrawn = true; }
        }

        function draw() {
            var vc = window.veroCollections;
            var grid = document.getElementById('catGrid');
            var count = document.getElementById('catCount');
            if (!vc) { grid.innerHTML = '<div class="cat-empty">Loading…</div>'; return false; }
            if (!allItems) {
                try { allItems = cfg.pick(vc) || []; } catch (e) { allItems = []; }
            }
            drawRail(vc);
            var q = (searchEl.value || '').trim().toLowerCase();
            drawTypes();
            var items = allItems.filter(function (p) {
                if (q && ((p.name || '') + ' ' + (p.seller || '') + ' ' + (p.category || '')).toLowerCase().indexOf(q) === -1) return false;
                if (flt.types.length && flt.types.indexOf(p.category || '') === -1) return false;
                if (flt.sale && !((vc.discountOf(p._raw) || {}).onSale)) return false;
                return true;
            });
            var priceOf = function (p) { var d = vc.discountOf(p._raw) || {}; return vc.toNum(d.onSale ? d.price : (d.original != null ? d.original : p.price)) || 0; };
            if (flt.sort === 'low') items = items.slice().sort(function (a, b) { return priceOf(a) - priceOf(b); });
            else if (flt.sort === 'high') items = items.slice().sort(function (a, b) { return priceOf(b) - priceOf(a); });
            document.getElementById('catFilterDot').hidden = !(flt.types.length || flt.sale || flt.sort !== 'new');
            var now = Date.now();
            if (!items.length) {
                grid.innerHTML = '<div class="cat-empty">' +
                    (q ? 'No pieces match “' + q + '”.' : 'Nothing here yet — check back soon.') +
                    '</div>';
                count.textContent = '';
                return true;
            }
            count.textContent = items.length + (items.length === 1 ? ' piece' : ' pieces');
            grid.innerHTML = items.map(function (p) { return vc.cardHTML(p, now); }).join('');
            return true;
        }

        searchEl.addEventListener('input', function () { if (allItems) draw(); });

        // ---- Filters: sort, item type (from the pieces themselves), on sale only ----
        var flt = { sort: 'new', types: [], sale: false }, typesDrawn = false;
        function drawTypes() {
            if (typesDrawn || !allItems) return;
            var seen = {}; allItems.forEach(function (p) { if (p.category) seen[p.category] = (seen[p.category] || 0) + 1; });
            var keys = Object.keys(seen).sort(function (a, b) { return seen[b] - seen[a]; });
            var host = document.getElementById('catTypes');
            host.innerHTML = keys.length ? keys.map(function (k) { return '<button type="button" class="cc-chip" data-v="' + esc(k) + '">' + esc(k) + '</button>'; }).join('') : '<span class="cc-k" style="margin:0">—</span>';
            typesDrawn = true;
        }
        var sheet = document.getElementById('catFilters');
        function openFilters(on) { sheet.hidden = !on; }
        document.getElementById('catFilterBtn').addEventListener('click', function () { drawTypes(); openFilters(true); });
        sheet.addEventListener('click', function (e) {
            if (e.target === sheet) { openFilters(false); return; }
            var c = e.target.closest('.cc-chip'); if (!c) return;
            var g = c.parentNode.getAttribute('data-group'), v = c.getAttribute('data-v');
            if (g === 'sort') { flt.sort = v; [].forEach.call(c.parentNode.children, function (x) { x.classList.toggle('on', x === c); }); }
            else if (g === 'type') { var i = flt.types.indexOf(v); if (i === -1) flt.types.push(v); else flt.types.splice(i, 1); c.classList.toggle('on', i === -1); }
            else if (g === 'sale') { flt.sale = !flt.sale; c.classList.toggle('on', flt.sale); }
            if (allItems) draw();
        });
        document.getElementById('catFilterGo').addEventListener('click', function () { openFilters(false); document.getElementById('catWrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        document.getElementById('catFilterClear').addEventListener('click', function () {
            flt = { sort: 'new', types: [], sale: false };
            [].forEach.call(sheet.querySelectorAll('.cc-chip'), function (x) { x.classList.toggle('on', x.getAttribute('data-v') === 'new'); });
            if (allItems) draw();
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openFilters(false); });

        // collections.js may load a tick later; retry briefly until it's ready.
        if (!draw()) {
            var tries = 0;
            var iv = setInterval(function () {
                if (draw() || ++tries > 40) clearInterval(iv);
            }, 80);
        }
    })();
    </script>
</body>
</html>
