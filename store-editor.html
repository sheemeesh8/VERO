<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phone-only presentation: opened as a top-level window this page hands off to
         phone-frame.html. Inside a frame (window.top !== self) the check is skipped. -->
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
      }
    </script>
    <title>moravchick — Edit store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-templates.css">
    <style>
        :root { --ink:#1c1c1c; --muted:#7a7a75; --line:#e9e9e6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff; direction: ltr; color: var(--ink);
            overflow-x: hidden; font-size: 14px; line-height: 1.5;
        }
        .back {
            position: fixed; top: 22px; left: 22px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10px; letter-spacing: 1.5px; text-decoration: none; color: var(--ink);
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }
        html.is-embed .back { display: none !important; }

        .wrap { max-width: 1080px; margin: 0 auto; padding: 74px 20px 110px; animation: fade 0.5s ease both; }
        html.is-embed .wrap { padding: 22px 16px 90px; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .head { text-align: center; margin-bottom: 8px; }
        .head h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 200; letter-spacing: 0.5px; }
        .head .sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
        .head p { max-width: 34em; margin: 10px auto 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

        .sec-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 34px 0 14px; }

        /* Accent override row */
        .accent-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .accent-row .lbl { font-size: 12px; color: var(--muted); }
        .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; transition: transform 0.15s; }
        .swatch:hover { transform: scale(1.12); }
        .swatch.on { box-shadow: 0 0 0 2px #111; }

        /* Layout selector — arrangement presets for the storefront. */
        .layout-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 560px) { .layout-row { grid-template-columns: 1fr 1fr; } }
        .lay {
            border: 1.5px solid var(--line); border-radius: 16px; background: #fff; cursor: pointer;
            padding: 14px; text-align: left; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .lay:hover { border-color: #bdbdb8; transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.07); }
        .lay.on { border-color: #111; box-shadow: 0 0 0 1.5px #111; }
        .lay-mock { height: 62px; border-radius: 8px; background: #f2f0ef; margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; padding: 9px; overflow: hidden; }
        .lay-mock i { display: block; background: #cfcbc4; border-radius: 3px; height: 7px; }
        .lay-mock .m-tiles { display: grid; gap: 4px; margin-top: auto; }
        .lay-mock .m-tiles i { height: 16px; }
        .lay[data-lay="l1"] .lay-mock i.m-name { width: 55%; align-self: center; }
        .lay[data-lay="l1"] .lay-mock .m-tiles { grid-template-columns: 1fr 1fr 1fr; }
        .lay[data-lay="l2"] .lay-mock i.m-name { width: 45%; }
        .lay[data-lay="l2"] .lay-mock .m-tiles { grid-template-columns: 1fr 1fr; }
        .lay[data-lay="l3"] .lay-mock i.m-name { width: 70%; align-self: center; }
        .lay[data-lay="l3"] .lay-mock .m-tiles { grid-template-columns: 1fr 1fr 1fr 1fr; }
        .lay-name { font-size: 13px; font-weight: 600; }
        .lay-desc { font-size: 11px; color: var(--muted, #7a7a75); margin-top: 3px; line-height: 1.5; }

        /* Template grid */
        .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
        @media (max-width: 560px) { .tpl-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
        .tpl {
            border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer;
            background: #fff; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; position: relative;
        }
        .tpl:hover { border-color: #bdbdb8; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .tpl.on { border-color: #111; box-shadow: 0 0 0 2px #111; }
        .tpl .sfp { border-radius: 0; }
        .tpl-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; }
        .tpl-name { font-size: 13px; font-weight: 600; }
        .tpl-desc { font-size: 10.5px; color: var(--muted); }
        .tpl .check {
            position: absolute; top: 10px; inset-inline-start: 10px; width: 26px; height: 26px; border-radius: 50%;
            background: #111; color: #fff; display: none; place-items: center; font-size: 14px; z-index: 3;
        }
        .tpl.on .check { display: grid; }

        /* Sticky save/preview bar */
        .actionbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; gap: 12px; justify-content: center; align-items: center;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
        }
        html.is-embed .actionbar { position: sticky; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: 999px; border: 1.4px solid #111; background: #fff; color: #111;
            font-family: inherit; font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer;
            min-height: 46px; text-decoration: none; transition: background 0.2s, color 0.2s;
        }
        .btn:hover { background: #111; color: #fff; }
        .btn.primary { background: #111; color: #fff; }
        .btn.primary:hover { background: #000; }
        .saved-note { font-size: 11px; color: #1f8f4e; opacity: 0; transition: opacity 0.3s; }
        .saved-note.show { opacity: 1; }
    </style>
<style id="vero-global-type">
/* VERO global typography: main titles in Bodoni, sub-headings + descriptions in serif.
   Buttons/nav keep their own fonts. */
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Playfair+Display:wght@400;500;600;700&display=swap');
h1, h2, [class*="-title"], [class*="Title"], .title {
  font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif !important;
}
h3, h4, h5, h6, p,
[class*="-desc"], [class*="Desc"], [class*="-sub"], [class*="subtitle"], [class*="Subtitle"] {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif !important;
}
</style>
<link rel="stylesheet" href="assets/fonts/aharoni.css">
<style id="aharoni-headings">h1:not(#zz):not(#zz):not(#zz),h2:not(#zz):not(#zz):not(#zz),h3:not(#zz):not(#zz):not(#zz),h4:not(#zz):not(#zz):not(#zz),h5:not(#zz):not(#zz):not(#zz),h6:not(#zz):not(#zz):not(#zz),[class*="title"]:not(#zz):not(#zz):not(#zz),[class*="Title"]:not(#zz):not(#zz):not(#zz),[class*="heading"]:not(#zz):not(#zz):not(#zz),[class*="Heading"]:not(#zz):not(#zz):not(#zz),[class*="headline"]:not(#zz):not(#zz):not(#zz),[class*="Headline"]:not(#zz):not(#zz):not(#zz){font-family:'Aharoni CLM','Segoe UI',sans-serif !important;}</style>
</head>
<body>
    <a class="back" href="seller-area.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        to the store
    </a>

    <main class="wrap">
        <header class="head">
            <div class="sub">Store design</div>
            <h1>Edit store</h1>
            <p>Choose the template that gives your-storefront your own unique look. You can also adjust the accent color.</p>
        </header>

        <div class="sec-title">Accent color</div>
        <div class="accent-row" id="accentRow">
            <span class="lbl">Choose a color:</span>
        </div>

        <div class="sec-title">Choose a template</div>
        <div class="tpl-grid" id="tplGrid"></div>

        <div class="sec-title">Layout</div>
        <div class="layout-row" id="layoutRow"></div>
    </main>

    <div class="actionbar">
        <span class="saved-note" id="savedNote">Saved ✓</span>
        <button class="btn" id="viewStore">Preview storefront</button>
        <button class="btn primary" id="applyBtn">Save design</button>
    </div>

    <script src="assets/footer.js"></script>
    <script>
    (function storeEditor() {
        try { localStorage.setItem('vero_active_account', 'seller'); } catch (e) {}
        if (new URLSearchParams(location.search).get('embed') === '1') {
            document.documentElement.classList.add('is-embed');
        }

        const KEY = 'vero_store_config';
        const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
        const write = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
        let cfg = read();

        // The ten templates (id + Hebrew name + one-line description). Their visual
        // tokens live in store-templates.css, keyed by the same id.
        const TEMPLATES = [
            { id: 't1',  name: 'Minimal',   desc: 'Clean white, Signature red' },
            { id: 't2',  name: 'Editorial', desc: 'Warm cream, Gold, Bodoni' },
            { id: 't3',  name: 'Noir',     desc: 'Dark and bold, Silver' },
            { id: 't4',  name: 'Blush',     desc: 'Soft pink, Elegant serif' },
            { id: 't5',  name: 'Street',    desc: 'Bold orange, Uppercase letters' },
            { id: 't6',  name: 'Luxe',     desc: 'Deep green, Gold' },
            { id: 't7',  name: 'Lavender',    desc: 'Soft purple, Rounded corners' },
            { id: 't8',  name: 'Gallery',    desc: 'Airy gray, Monochrome' },
            { id: 't9',  name: 'Classic',    desc: 'Navy, Traditional serif' },
            { id: 't10', name: 'Coast',     desc: 'Fresh turquoise' }
        ];

        // Accent colours the seller can override on top of a template.
        const ACCENTS = ['#EB2323', '#9a7d52', '#d46a7e', '#ff5a1f', '#c8a24a', '#7b5cd6', '#1f3a5f', '#1f9c8f', '#111111'];

        // Storefront layout presets (arrangement / positions), stored as cfg.layout.
        const LAYOUTS = [
            { id: 'l1', name: 'Editorial', desc: 'Centered name, 3-up grid' },
            { id: 'l2', name: 'Boutique',  desc: 'Left-aligned, roomy 2-up' },
            { id: 'l3', name: 'Gallery',   desc: 'Centered, dense 4-up grid' }
        ];

        let selected = cfg.template || 't1';
        let accent = cfg.accent || '';
        let layout = cfg.layout || 'l1';

        // ---- Build the template preview grid. ----
        const grid = document.getElementById('tplGrid');
        grid.innerHTML = TEMPLATES.map(t => `
            <div class="tpl${t.id === selected ? ' on' : ''}" data-id="${t.id}">
                <span class="check">✓</span>
                <div class="sfp" data-store-template="${t.id}"${accent ? ` style="--sf-accent:${accent}"` : ''}>
                    <div class="sfp-hero"><div class="sfp-name">My Store</div></div>
                    <div class="sfp-body">
                        <div class="sfp-row"><span class="sfp-cat">Items for sale</span><span class="sfp-btn">Follow</span></div>
                        <div class="sfp-tiles"><i class="sfp-tile"></i><i class="sfp-tile"></i><i class="sfp-tile"></i></div>
                    </div>
                </div>
                <div class="tpl-foot"><span class="tpl-name">${t.name}</span><span class="tpl-desc">${t.desc}</span></div>
            </div>`).join('');

        grid.addEventListener('click', (e) => {
            const card = e.target.closest('.tpl');
            if (!card) return;
            selected = card.dataset.id;
            grid.querySelectorAll('.tpl').forEach(c => c.classList.toggle('on', c === card));
            // Persist immediately so the storefront always reflects the chosen template.
            save();
        });

        // ---- Accent swatches. ----
        const accentRow = document.getElementById('accentRow');
        accentRow.insertAdjacentHTML('beforeend',
            `<button class="swatch${!accent ? ' on' : ''}" data-accent="" title="The template default" style="background:conic-gradient(#EB2323,#c8a24a,#1f9c8f,#7b5cd6,#EB2323)"></button>` +
            ACCENTS.map(c => `<button class="swatch${accent === c ? ' on' : ''}" data-accent="${c}" style="background:${c}"></button>`).join(''));
        accentRow.addEventListener('click', (e) => {
            const sw = e.target.closest('.swatch'); if (!sw) return;
            accent = sw.dataset.accent || '';
            accentRow.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === sw));
            // Live-update the previews' accent.
            grid.querySelectorAll('.sfp').forEach(el => {
                if (accent) el.style.setProperty('--sf-accent', accent);
                else el.style.removeProperty('--sf-accent');
            });
            // Persist immediately so the storefront always reflects the chosen accent.
            save();
        });

        // ---- Layout presets. ----
        const layoutRow = document.getElementById('layoutRow');
        layoutRow.innerHTML = LAYOUTS.map(l => `
            <button type="button" class="lay${l.id === layout ? ' on' : ''}" data-lay="${l.id}">
                <span class="lay-mock"><i class="m-name"></i><span class="m-tiles"><i></i><i></i><i></i><i></i></span></span>
                <span class="lay-name">${l.name}</span>
                <span class="lay-desc">${l.desc}</span>
            </button>`).join('');
        layoutRow.addEventListener('click', (e) => {
            const b = e.target.closest('.lay'); if (!b) return;
            layout = b.dataset.lay;
            layoutRow.querySelectorAll('.lay').forEach(x => x.classList.toggle('on', x === b));
            save();
        });

        // ---- Save + preview. ----
        function save() {
            cfg = read();
            cfg.template = selected;
            cfg.layout = layout;
            if (accent) cfg.accent = accent; else delete cfg.accent;
            write(cfg);
            const note = document.getElementById('savedNote');
            note.classList.add('show');
            setTimeout(() => note.classList.remove('show'), 1600);
        }
        document.getElementById('applyBtn').addEventListener('click', save);
        document.getElementById('viewStore').addEventListener('click', () => {
            save();
            location.href = 'buyer-profile.html';
        });
    })();
    </script>
</body>
</html>
