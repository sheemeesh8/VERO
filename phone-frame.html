<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        /* Black "no phone" area on the sides. */
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        /* The phone: a fixed narrow column that fills the screen height, centered,
           with a soft shadow so it reads as a device against the black. */
        .phone {
            position: relative;
            width: 430px;
            max-width: 100%;
            height: 100%;
            max-height: 100vh;
            background: #fff;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }
        .phone iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* On a real phone (narrow screen) drop the frame entirely — the site just fills
           the screen, no black bars. */
        @media (max-width: 460px) {
            .phone { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="phone">
        <!-- The whole site lives in here. index.html detects it is framed and renders
             the real homepage instead of bouncing back to this frame. -->
        <iframe src="index.html" title="VERO"></iframe>
    </div>
</body>
</html>
