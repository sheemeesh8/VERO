<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Two-Part Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #1c1c1c; --muted: #9a958c; --line: #ecebe7; --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.col { display: flex; flex-direction: column; gap: 40px; align-items: center; }
.opt { width: 500px; max-width: 100%; }
.pair { display: flex; gap: 18px; justify-content: center; }
.opt-label { direction: rtl; margin-top: 14px; text-align: center; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 230px; height: 498px; border-radius: 26px; overflow: hidden; position: relative; background: #111; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.5897); transform-origin: top left; position: relative; overflow: hidden; }
.money { font-variant-numeric: tabular-nums; }
.imgbg { background: #e7e4dd center / cover no-repeat; }
.ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.v { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--v); color: #fff; font-size: 10px; font-weight: 700; vertical-align: middle; }
.bar { display: flex; align-items: center; justify-content: space-between; padding: 40px 26px 0; }
.caplabel { text-align: center; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; direction: rtl; }

/* ---- shared hero screen ---- */
.hero { position: absolute; inset: 0; color: #fff; }
.hero .img { position: absolute; inset: 0; background: url('../hero-beach.jpg') center / cover no-repeat; }
.hero .wash { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,0.78)); }
.hero .bar { position: relative; z-index: 2; }
.hero .bar .t { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }
.hero .info { position: absolute; left: 26px; right: 26px; bottom: 54px; z-index: 2; }
.hero .nm { font-size: 34px; } .hero .bio { font-size: 12px; opacity: 0.85; margin-top: 6px; }
.hero .stats { display: flex; gap: 26px; margin-top: 20px; }
.hero .stats .st b { font-size: 18px; } .hero .stats .st span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; display: block; }
.hero .swipe { position: absolute; left: 0; right: 0; bottom: 24px; z-index: 2; text-align: center; font-size: 8.5px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8; }
.hero .av { display: block; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #fff; margin-bottom: 14px; }

/* ---- items screen ---- */
.items { position: absolute; inset: 0; background: #fff; color: var(--ink); overflow: hidden; }
.items .hd { display: flex; align-items: center; justify-content: space-between; padding: 40px 26px 0; }
.items .hd b { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.items .ttabs { display: flex; gap: 22px; padding: 18px 26px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.items .ttabs span.on { color: var(--ink); }
.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; padding: 20px 26px; }
.pc .im { aspect-ratio: 3/4; } .pc .nm { font-size: 12px; margin-top: 8px; } .pc .pr { font-size: 11px; color: var(--muted); margin-top: 2px; }
/* data grid variant */
.datagrid { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.datagrid .d { padding: 16px 4px; text-align: center; border-right: 1px solid var(--line); }
.datagrid .d:last-child { border-right: none; }
.datagrid .d b { font-size: 15px; font-weight: 400; display: block; } .datagrid .d span { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 3px; display: block; }
</style>
</head>
<body>
<h1>Storefront — שני מסכים מלאים</h1>
<p class="sub">מסך 1: הירו · מסך 2: פריטים — שניהם מלאים, כמו היום · 3 כיוונים</p>
<div class="col" id="col"></div>

<script>
var P = [
  { n: 'Wool Overcoat', p: 980, img: '../men-hero.jpg', pos: '50% 30%' },
  { n: 'Chelsea Boots', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Linen Overshirt', p: 340, img: '../women-hero.jpg', pos: '20% 40%' },
  { n: 'Silk Scarf', p: 210, img: '../hero-beach.jpg', pos: '50% 50%' }
];
var m = v => '₪' + v.toLocaleString('en-US');
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var SHR = '<svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var back = '<span style="font-size:22px">&#8249;</span>';
var avbeach = 'class="av imgbg" style="background-image:url(\'../women-hero.jpg\');background-position:50% 24%"';
function pgrid() { return '<div class="pg">' + P.map(i => '<div class="pc"><div class="im imgbg" ' + bg(i) + '></div><div class="nm">' + i.n + '</div><div class="pr money">' + m(i.p) + '</div></div>').join('') + '</div>'; }
var ttabs = '<div class="ttabs"><span class="on">Items · 32</span><span>Sold</span><span>About</span></div>';
function phone(inner) { return '<div class="phone"><div class="screen">' + inner + '</div></div>'; }

// Hero variants
function heroA() { return '<div class="hero"><div class="img"></div><div class="wash"></div><div class="bar">' + back + '<span class="t">Studio Vero</span>' + SHR + '</div>' +
  '<div class="info"><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion · Tel Aviv</div>' +
  '<div class="stats"><div class="st"><b>248</b><span>Followers</span></div><div class="st"><b>32</b><span>Items</span></div><div class="st"><b>4.9★</b><span>Rating</span></div></div></div>' +
  '<div class="swipe">Swipe up for items ↑</div></div>'; }
function heroB() { return '<div class="hero"><div class="img"></div><div class="wash"></div><div class="bar">' + back + SHR + '</div>' +
  '<div class="info" style="text-align:center;left:0;right:0"><span ' + avbeach + ' style="margin:0 auto 14px"></span><div class="nm" style="font-size:30px">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion</div>' +
  '<div class="stats" style="justify-content:center"><div class="st"><b>248</b><span>Followers</span></div><div class="st"><b>32</b><span>Items</span></div><div class="st"><b>4.9★</b><span>Rating</span></div></div></div>' +
  '<div class="swipe">Swipe up for items ↑</div></div>'; }

// Items variants
function itemsA() { return '<div class="items"><div class="hd"><b>Studio Vero</b>' + SHR + '</div>' + ttabs + pgrid() + '</div>'; }
function itemsData() { return '<div class="items"><div class="hd"><b>Studio Vero</b>' + SHR + '</div>' +
  '<div class="datagrid"><div class="d"><b>248</b><span>Followers</span></div><div class="d"><b>32</b><span>Items</span></div><div class="d"><b>120</b><span>Sold</span></div><div class="d"><b>4.9★</b><span>Rating</span></div></div>' + pgrid() + '</div>'; }

var OPTS = [
  ['A · הירו קלאסי → פריטים', 'מסך 1: הירו מלא עם השם, הביו, הנתונים ורמז "החלק למעלה". מסך 2: כותרת החנות, לשוניות וגריד פריטים. נקי וברור.',
   heroA(), itemsA()],
  ['B · הירו ממורכז → פריטים', 'מסך 1: הירו מלא עם אווטאר ושם ממורכזים. מסך 2: אותו גריד פריטים נקי. מאוזן ואוורירי.',
   heroB(), itemsA()],
  ['C · הירו → פריטים עם דף נתונים', 'מסך 1: הירו מלא. מסך 2: נפתח בשורת נתונים (Followers / Items / Sold / Rating) כמו דף הסטטיסטיקות, ואז הגריד. מחבר בין החנות לנתונים.',
   heroA(), itemsData()]
];
document.getElementById('col').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="pair">' +
    '<div><div class="caplabel">מסך 1 · הירו</div>' + phone(o[2]) + '</div>' +
    '<div><div class="caplabel">מסך 2 · פריטים</div>' + phone(o[3]) + '</div>' +
    '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
