<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
        }

        /* Entry: white cover lifts away — same as the other personal-area pages. */
        .page-cover {
            position: fixed; inset: 0; background: #fff; z-index: 50;
            animation: coverOut 0.6s cubic-bezier(0.76, 0, 0.24, 1) 0.05s forwards;
        }
        @keyframes coverOut { to { transform: translateY(-100%); } }

        .back {
            position: fixed; top: 26px; left: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }

        /* Same image as the My Profile rectangle, at the rectangle's own dimensions:
           full height, one-rectangle wide (20vw), on the right. */
        .side-image {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 20vw;
            background: url('https://loremflickr.com/800/1200/portrait,fashion,studio?lock=7') center / cover no-repeat;
            filter: grayscale(1);
            border-left: 1px solid #000;
            z-index: 0;
            animation: fadeInImg 0.9s ease 0.35s both;
        }
        @keyframes fadeInImg { from { opacity: 0; } to { opacity: 1; } }
        @media (min-width: 1001px) { .wrap { padding-right: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }
        @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 15px; color: #6b6b66; letter-spacing: 0.5px; }

        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            margin-top: 52px;
        }

        /* Thin black framed cards — same language as the rectangles. */
        .card { border: 1px solid #000; padding: 34px; }

        .avatar {
            width: 78px; height: 78px; border-radius: 50%;
            border: 1.5px solid #000; display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: 300; text-transform: uppercase; margin-bottom: 18px;
        }
        .card-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; margin-bottom: 8px; }

        .field { margin-bottom: 22px; }
        .field:last-child { margin-bottom: 0; }
        .field input, .field textarea {
            width: 100%; border: none; border-bottom: 1px solid #d9d9d4;
            background: transparent; font-family: inherit; font-size: 16px; font-weight: 400;
            color: #1c1c1c; padding: 6px 0; resize: none; transition: border-color 0.2s;
        }
        .field input:focus, .field textarea:focus { outline: none; border-bottom-color: #000; }

        .prefs { display: flex; flex-wrap: wrap; gap: 12px; }
        .pref-chip {
            border: 1px solid #000; border-radius: 999px; padding: 9px 20px;
            font-size: 12px; letter-spacing: 1px;
        }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
        .stat {
            border: 1px solid #000; padding: 30px 24px; text-decoration: none; color: #1c1c1c;
            display: block; transition: background 0.25s, color 0.25s;
        }
        .stat:hover { background: #000; color: #fff; }
        .stat-num { font-size: 46px; font-weight: 200; line-height: 1; }
        .stat-name { margin-top: 12px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

        .save-note {
            margin-top: 26px; font-size: 12px; letter-spacing: 1px; color: #9a9a95;
        }
        .col-right { display: flex; flex-direction: column; }
        .divider { height: 1px; background: #eee; margin: 26px 0; }

        @media (max-width: 780px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back" href="buyer-area.html">&#8592; חזרה</a>

    <div class="wrap">
        <h1 class="head-title">My Profile</h1>
        <p class="head-sub">Your details, preferences and account at a glance.</p>

        <div class="grid">
            <!-- Identity card (editable, saved to localStorage) -->
            <div class="card">
                <div class="avatar" id="avatar">V</div>
                <div class="field">
                    <div class="card-label">Name</div>
                    <input id="pf-name" type="text" placeholder="Your name">
                </div>
                <div class="field">
                    <div class="card-label">Email</div>
                    <input id="pf-email" type="email" placeholder="you@email.com">
                </div>
                <div class="field">
                    <div class="card-label">Location</div>
                    <input id="pf-location" type="text" placeholder="City, Country">
                </div>
                <div class="field">
                    <div class="card-label">About</div>
                    <textarea id="pf-bio" rows="3" placeholder="A short line about you"></textarea>
                </div>
                <div class="save-note" id="saveNote">Changes save automatically.</div>
            </div>

            <!-- Right column: preferences + live stats from the site -->
            <div class="col-right">
                <div class="card">
                    <div class="card-label">Shopping preferences</div>
                    <div class="prefs" id="prefs"></div>
                    <div class="divider"></div>
                    <div class="card-label">Member since</div>
                    <div id="since" style="font-size:16px;">—</div>
                </div>

                <div class="stats">
                    <a class="stat" href="cart.html">
                        <div class="stat-num" id="stat-cart">0</div>
                        <div class="stat-name">In Cart</div>
                    </a>
                    <a class="stat" href="products.html">
                        <div class="stat-num" id="stat-wish">0</div>
                        <div class="stat-name">Saved</div>
                    </a>
                    <a class="stat" href="products.html">
                        <div class="stat-num" id="stat-listings">0</div>
                        <div class="stat-name">Listings</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---- Read whatever the site already stores ----
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const cart     = readJSON('vero_cart', []);
        const wishlist = readJSON('vero_wishlist', []);
        const drafts   = readJSON('vero_drafts', []);
        const prefs    = readJSON('userPreferences', {});
        const profile  = readJSON('vero_profile', {});

        // Live counts pulled from the site's own data.
        document.getElementById('stat-cart').textContent     = Array.isArray(cart) ? cart.length : 0;
        document.getElementById('stat-wish').textContent     = Array.isArray(wishlist) ? wishlist.length : 0;
        document.getElementById('stat-listings').textContent = Array.isArray(drafts) ? drafts.length : 0;

        // Preferences → readable chips.
        const catMap = { clothing: 'Fashion', art: 'Art', both: 'Fashion & Art' };
        const purposeMap = { buy: 'Buying', sell: 'Selling', both: 'Buying & Selling' };
        const chips = [];
        if (prefs.category) chips.push(catMap[prefs.category] || prefs.category);
        if (prefs.purpose)  chips.push(purposeMap[prefs.purpose] || prefs.purpose);
        const prefsEl = document.getElementById('prefs');
        prefsEl.innerHTML = chips.length
            ? chips.map(c => `<span class="pref-chip">${c}</span>`).join('')
            : '<span class="pref-chip">Not set yet</span>';

        // Member-since: set once on first visit, then remembered.
        if (!profile.since) { profile.since = Date.now(); localStorage.setItem('vero_profile', JSON.stringify(profile)); }
        document.getElementById('since').textContent =
            new Date(profile.since).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

        // ---- Editable identity fields, persisted to vero_profile ----
        const fields = { name: 'pf-name', email: 'pf-email', location: 'pf-location', bio: 'pf-bio' };
        Object.entries(fields).forEach(([key, id]) => {
            const el = document.getElementById(id);
            if (profile[key]) el.value = profile[key];
        });

        // Circle avatar shows the first letter of the name (falls back to V).
        function refreshAvatar() {
            const n = (profile.name || '').trim();
            document.getElementById('avatar').textContent = n ? n[0] : 'V';
        }
        refreshAvatar();

        let saveTimer;
        Object.entries(fields).forEach(([key, id]) => {
            document.getElementById(id).addEventListener('input', (e) => {
                profile[key] = e.target.value;
                localStorage.setItem('vero_profile', JSON.stringify(profile));
                if (key === 'name') refreshAvatar();
                const note = document.getElementById('saveNote');
                note.textContent = 'Saved ✓';
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => { note.textContent = 'Changes save automatically.'; }, 1400);
            });
        });

        // Exit = same upward white-cover wipe as the entry animation.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const cover = document.createElement('div');
            cover.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:60;transform:translateY(100%);transition:transform .6s cubic-bezier(.76,0,.24,1)';
            document.body.appendChild(cover);
            requestAnimationFrame(() => requestAnimationFrame(() => { cover.style.transform = 'translateY(0)'; }));
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 620);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
