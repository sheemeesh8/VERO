<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro I4</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --d: 6s; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 18px; direction: rtl; }
.replay { display: block; margin: 0 auto 34px; background: #111; color: #fff; border: none; border-radius: 999px; padding: 11px 26px; font: inherit; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; }
.opt { width: 280px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 280px; height: 590px; border-radius: 30px; overflow: hidden; position: relative; background: #000; box-shadow: 0 16px 36px rgba(0,0,0,0.18); border: 6px solid #0d0d0d; }
.app { position: absolute; inset: 0; background: url('intro-home.png') center top / cover no-repeat; }
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mark { width: 200px; display: block; line-height: 0; position: relative; }
.mark img { width: 100%; display: block; }
.black img { filter: invert(1); }
.phone * { animation-duration: var(--d); animation-iteration-count: infinite; animation-fill-mode: both; }

/* ===== I1 · current: zoom in → hold → zoom out ===== */
.i1 .layer { background: #000; animation-name: i1panel; animation-timing-function: ease; }
@keyframes i1panel { 0%, 32% { opacity: 1; } 43%, 96% { opacity: 0; } 100% { opacity: 1; } }
.i1 .mark { animation-name: i1mark; animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1); }
@keyframes i1mark { 0% { transform: scale(2.1); opacity: 0; } 10%, 32% { transform: scale(1); opacity: 1; } 43%, 100% { transform: scale(2.1); opacity: 0; } }
.shine { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,0.95) 50%, transparent 58%); background-size: 260% 100%; background-repeat: no-repeat;
  -webkit-mask: url('../moravchick-letters.png') center / contain no-repeat; mask: url('../moravchick-letters.png') center / contain no-repeat; mix-blend-mode: screen; animation-name: i1shine; animation-timing-function: ease-in-out; }
@keyframes i1shine { 0%, 13% { background-position: 130% 0; opacity: 0; } 16% { opacity: 1; } 26% { background-position: -30% 0; opacity: 1; } 29%, 100% { background-position: -30% 0; opacity: 0; } }

/* ===== I2 · letters wipe in, panel lifts away ===== */
.i2 .layer { background: #000; flex-direction: column; gap: 14px; animation-name: i2panel; animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
@keyframes i2panel { 0%, 36% { transform: translateY(0); } 48%, 98% { transform: translateY(-100%); } 99%, 100% { transform: translateY(0); } }
.i2 .mark { animation-name: i2wipe; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }
@keyframes i2wipe { 0%, 4% { clip-path: inset(0 100% 0 0); } 20%, 100% { clip-path: inset(0 0 0 0); } }
.i2 .line { width: 200px; height: 1px; background: rgba(255,255,255,0.7); transform-origin: left; animation-name: i2line; animation-timing-function: ease; }
@keyframes i2line { 0%, 16% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }
.i2 .tagline { color: rgba(255,255,255,0.85); font-size: 9px; letter-spacing: 4px; text-transform: uppercase; animation-name: i2tag; }
@keyframes i2tag { 0%, 24% { opacity: 0; transform: translateY(6px); } 32%, 100% { opacity: 1; transform: none; } }

/* ===== I3 · curtain split through the wordmark ===== */
.i3 .half { position: absolute; left: 0; right: 0; height: calc(50% + 1px); background: #000; overflow: hidden; animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
.i3 .top { top: 0; animation-name: i3top; } .i3 .bot { bottom: 0; animation-name: i3bot; }
@keyframes i3top { 0%, 34% { transform: translateY(0); } 48%, 98% { transform: translateY(-100%); } 99%, 100% { transform: translateY(0); } }
@keyframes i3bot { 0%, 34% { transform: translateY(0); } 48%, 98% { transform: translateY(100%); } 99%, 100% { transform: translateY(0); } }
.i3 .half .mark { position: absolute; left: 50%; margin-left: -100px; animation-name: i3fade; }
.i3 .top .mark { bottom: 0; transform: translateY(50%); }
.i3 .bot .mark { top: 0; transform: translateY(-50%); }
@keyframes i3fade { 0% { opacity: 0; } 12%, 100% { opacity: 1; } }

/* ===== I4 · editorial montage ===== */
.i4 .layer { animation-name: i4out; }
@keyframes i4out { 0%, 38% { opacity: 1; } 48%, 98% { opacity: 0; } 100% { opacity: 1; } }
.i4 .ph { position: absolute; inset: 0; background: center / cover no-repeat; filter: grayscale(0.4) brightness(0.55); opacity: 0; animation-timing-function: steps(1, end); }
.i4 .ph:nth-child(1) { background-image: url('../women-hero.jpg'); animation-name: i4p1; }
.i4 .ph:nth-child(2) { background-image: url('../men-hero.jpg'); animation-name: i4p2; }
.i4 .ph:nth-child(3) { background-image: url('../hero-beach.jpg'); animation-name: i4p3; }
.i4 .ph:nth-child(4) { background-image: url('../clothing-hero.jpg'); animation-name: i4p4; animation-timing-function: ease; }
@keyframes i4p1 { 0% { opacity: 1; } 8%, 100% { opacity: 0; } }
@keyframes i4p2 { 0%, 8% { opacity: 0; } 8.01% { opacity: 1; } 16%, 100% { opacity: 0; } }
@keyframes i4p3 { 0%, 16% { opacity: 0; } 16.01% { opacity: 1; } 24%, 100% { opacity: 0; } }
@keyframes i4p4 { 0%, 24% { opacity: 0; transform: scale(1.12); } 24.01% { opacity: 1; transform: scale(1.12); } 44% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
.i4 .mark { animation-name: i4mark; }
@keyframes i4mark { 0% { opacity: 0; } 6%, 100% { opacity: 1; } }

/* ===== I5 · quiet white ===== */
.i5 .layer { background: #fff; flex-direction: column; gap: 16px; animation-name: i5panel; animation-timing-function: ease; }
@keyframes i5panel { 0%, 34% { opacity: 1; } 46%, 96% { opacity: 0; } 100% { opacity: 1; } }
.i5 .mark { animation-name: i5mark; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes i5mark { 0% { opacity: 0; transform: translateY(18px); filter: blur(6px); } 16%, 100% { opacity: 1; transform: none; filter: blur(0); } }
.i5 .line { width: 26px; height: 1px; background: #111; animation-name: i5line; animation-timing-function: ease; }
@keyframes i5line { 0%, 14% { transform: scaleX(0); } 26%, 100% { transform: scaleX(1); } }

/* ===== I6 · iris opens from the centre ===== */
.i6 .layer.bk { background: #000; }
.i6 .mark { animation-name: i6mark; animation-timing-function: ease; }
@keyframes i6mark { 0% { opacity: 0; transform: scale(0.94); } 12%, 30% { opacity: 1; transform: scale(1); } 42%, 100% { opacity: 0; transform: scale(1.08); } }
.i6 .app { animation-name: i6iris; animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
@keyframes i6iris { 0%, 30% { clip-path: circle(0% at 50% 50%); } 46%, 98% { clip-path: circle(80% at 50% 50%); } 100% { clip-path: circle(0% at 50% 50%); } }
.i6 .ring { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1px solid rgba(255,255,255,0.7); border-radius: 50%; animation-name: i6ring; animation-timing-function: ease-out; }
@keyframes i6ring { 0%, 22% { transform: scale(0); opacity: 0; } 24% { opacity: 1; } 32%, 100% { transform: scale(22); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { .phone * { animation: none !important; } }

.solo { display: flex; justify-content: center; }
.solo .phone { width: 340px; height: 716px; border-radius: 36px; }
.solo .mark { width: 240px; }
.desc { direction: rtl; text-align: center; max-width: 420px; margin: 22px auto 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.steps { direction: rtl; max-width: 420px; margin: 18px auto 0; font-size: 12.5px; line-height: 1.9; color: #55514a; }
.steps b { color: #111; font-weight: 700; }
</style>
</head>
<body>
<h1>Intro — I4 · מונטאז׳ אופנה</h1>
<p class="sub">מתנגן בלופ ונגמר על מסך הבית האמיתי</p>
<button class="replay" onclick="replay()">Replay</button>
<div class="solo" id="opts"></div>
<div class="steps">
<div><b>0.0–1.4 שנ׳</b> · שלוש תמונות אופנה מתחלפות מהר מאחורי הלוגו</div>
<div><b>1.4–2.6 שנ׳</b> · התמונה הרביעית נעצרת ומתרחקת לאט (zoom out)</div>
<div><b>2.3–2.9 שנ׳</b> · הכול נמוג לדף הבית</div>
</div>
<script>
var W = '<span class="mark"><img src="../moravchick-letters.png" alt="moravchick"></span>';
function render() {
  document.getElementById('opts').innerHTML = '<div class="phone i4"><div class="app"></div><div class="layer"><span class="ph"></span><span class="ph"></span><span class="ph"></span><span class="ph"></span>' + W + '</div></div>';
}
function replay() { document.getElementById('opts').innerHTML = ''; requestAnimationFrame(render); }
render();
</script>
</body>
</html>
