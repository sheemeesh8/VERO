<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — My Drafts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        .page-cover { display: none; }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10.00px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }

        .side-image {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 20vw;
            background: #2a2a28 url('assets/products-hero.jpg') center / cover no-repeat;
            filter: grayscale(1);
            border-right: 1px solid #000;
            z-index: 5;
        }
        @media (min-width: 1001px) { .wrap { padding-left: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 12.50px; color: #6b6b66; letter-spacing: 0.5px; }

        .section { margin-top: 44px; }
        .section-head {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 1px solid #000; padding-bottom: 14px;
        }
        .section-title { font-size: 10.83px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .section-note { font-size: 10.00px; letter-spacing: 0.5px; color: #9a9a95; }

        .prod-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px; margin-top: 26px;
        }
        .prod { border: 1px solid #000; display: flex; flex-direction: column; background: #fff; }
        .prod-img {
            aspect-ratio: 3 / 4; background: #ececea center / cover no-repeat; position: relative;
            border-bottom: 1px solid #000;
        }
        .prod-img .placeholder {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 33.33px; color: #b8b8b3;
        }
        .badge {
            position: absolute; top: 12px; left: 12px;
            padding: 6px 12px; border-radius: 999px; font-size: 8.33px; letter-spacing: 1.5px;
            text-transform: uppercase; font-weight: 500; border: 1px dashed #8a8a85; background: #fff; color: #8a8a85;
        }
        .prod-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .prod-name { font-size: 12.50px; font-weight: 500; line-height: 1.3; }
        .prod-meta { font-size: 10.00px; color: #9a9a95; letter-spacing: 0.3px; }
        .prod-price { font-size: 15.00px; font-weight: 400; margin-top: 2px; }
        .prod-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 14px; }
        .p-btn {
            flex: 1; border: 1px solid #000; background: #fff; cursor: pointer; font-family: inherit;
            border-radius: 999px; padding: 9px 10px; font-size: 8.33px; letter-spacing: 1px; text-transform: uppercase;
            color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .p-btn:hover { background: #000; color: #fff; }
        .p-btn.danger:hover { background: #b23b3b; border-color: #b23b3b; color: #fff; }

        .empty {
            margin-top: 26px; padding: 40px; border: 1px dashed #cfcfca; text-align: center;
            color: #9a9a95; font-size: 11.67px; letter-spacing: 0.3px;
        }

        @media (max-width: 780px) {
            /* Two product cards per row on phones. */
            .prod-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            /* Uniform 14px side inset so cards match every other page. */
            .wrap { padding-left: 14px; padding-right: 14px; }
        }

        /* Draft badge riding on the shared feed card. */
        .draft-card { cursor: pointer; position: relative; }
        .draft-card .draft-badge {
            position: absolute; top: 12px; left: 12px; z-index: 3;
            padding: 6px 12px; border-radius: 999px; font-size: 8.33px; letter-spacing: 1.5px;
            text-transform: uppercase; font-weight: 500;
            border: 1px dashed #8a8a85; background: #fff; color: #8a8a85;
            font-family: 'Oswald', 'Segoe UI', sans-serif !important;
        }

        /* Draft cell = card + a publish button beneath it. */
        .draft-cell { display: flex; flex-direction: column; gap: 12px; }
        /* Edit pencil, top-right, same as the My Products cards. */
        .draft-card .pe-edit {
            position: absolute; top: 12px; right: 12px; z-index: 4;
            width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center; padding: 0;
            border: none; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.15s, background 0.2s;
        }
        .draft-card .pe-edit:hover { transform: scale(1.08); background: #fff; }
        .draft-card .pe-edit svg {
            width: 17px; height: 17px; fill: none; stroke: #1c1c1c;
            stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
        }
        .publish-btn {
            width: 100%; border: 1.4px solid #000; background: #1c1c1c; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 9.17px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 12px 14px; border-radius: 999px; transition: background 0.2s, color 0.2s;
        }
        .publish-btn:hover { background: #fff; color: #1c1c1c; }
    </style>
    <!-- The shared product card: drafts render as the same object as the feed. -->
    <link rel="stylesheet" href="product-card.css">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
    <script src="assets/footer.js"></script>
</head>
<body>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back" href="products.html">&#8592; חזרה</a>

    <div class="wrap">
        <h1 class="head-title">My Drafts</h1>
        <p class="head-sub">Unfinished listings you saved from the upload page — pick up right where you left off.</p>

        <div class="section">
            <div class="section-head">
                <div class="section-title">Saved drafts</div>
                <div class="section-note" id="draftNote">0 drafts</div>
            </div>
            <div class="prod-grid" id="draftGrid"></div>
            <div class="empty" id="draftEmpty" style="display:none;">
                No drafts saved yet. When you tap “Save as draft” on the upload page, it will appear here.
            </div>
        </div>
    </div>

    <script>
        // Drafts always returns to My Listings; keep the seller flag so we stay in
        // the seller area rather than crossing into the buyer one.
        if (new URLSearchParams(location.search).get('from') === 'seller') {
            const back = document.querySelector('.back');
            if (back) back.setAttribute('href', 'products.html?from=seller');
        }

        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        const nis = n => n != null && n !== '' ? '₪' + (Number(n) || 0).toLocaleString('en-US') : 'No price yet';

        let drafts = readJSON('vero_drafts', []);
        if (!Array.isArray(drafts)) drafts = [];

        function imgOf(p) {
            return p.image || p.processed_cover || p.original_cover
                || (Array.isArray(p.photos) ? p.photos.find(Boolean) : null) || null;
        }
        function fmtDate(ts) {
            return ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        }
        function titleOf(p) {
            return [p.brand, p.itemType].filter(Boolean).join(' ') || 'Untitled draft';
        }

        function card(p, i) {
            const src = imgOf(p);
            const cat = p.category === 'art' ? 'Art' : p.category === 'clothing' ? 'Clothing' : '—';
            const icon = p.category === 'art' ? '🖼️' : '🛍️';
            const fig = src ? `<img src="${src}" alt="">` : icon;
            // The same object as the feed card — click (or the pencil) to continue,
            // trash to delete, and a Publish button beneath to send it to the feed.
            return `
                <div class="draft-cell">
                    <div class="product-card draft-card" data-i="${i}" role="button" tabindex="0" title="Continue this draft">
                        <div class="product-image">${fig}
                            <span class="draft-badge">Draft</span>
                            <span class="pe-edit" data-act="edit" data-i="${i}" title="Edit draft" aria-label="Edit draft">
                                <svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z"></path><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"></line></svg>
                            </span>
                            <button class="product-icon remove" title="Delete draft" data-act="delete" data-i="${i}">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="product-info">
                            <div class="pc-left">
                                <div class="product-price"><span class="vprice">${nis(p.price)}</span></div>
                            </div>
                            <div class="pc-right">
                                <div class="product-seller">${p.brand || 'Draft'}</div>
                                <div class="product-name">${p.itemType || cat}</div>
                                <div class="product-rating">Saved · ${fmtDate(p.savedAt)}</div>
                            </div>
                        </div>
                    </div>
                    <button class="publish-btn" data-act="publish" data-i="${i}">Publish to feed ↑</button>
                </div>`;
        }

        // Move a draft into the live listings (vero_listings) and drop it from drafts.
        function publishDraft(i) {
            const d = drafts[i];
            if (!d) return;
            let listings = readJSON('vero_listings', []);
            if (!Array.isArray(listings)) listings = [];
            listings.unshift({
                id: 'l' + Date.now(),
                name: titleOf(d),
                seller: d.brand || 'You',
                brand: d.brand || '',
                category: d.itemType || (d.category === 'art' ? 'Art' : 'Clothing'),
                price: Number(d.price) || 0,
                image: imgOf(d) || null,
                icon: d.category === 'art' ? '🖼️' : '🛍️',
                description: d.description || '',
                status: 'active',
                listedAt: Date.now(),
            });
            save('vero_listings', listings);
            drafts.splice(i, 1);
            save('vero_drafts', drafts);
            render();
        }

        function render() {
            const grid = document.getElementById('draftGrid');
            grid.innerHTML = drafts.map((p, i) => card(p, i)).join('');
            document.getElementById('draftNote').textContent = `${drafts.length} draft${drafts.length === 1 ? '' : 's'}`;
            document.getElementById('draftEmpty').style.display = drafts.length ? 'none' : 'block';
        }

        document.querySelector('.wrap').addEventListener('click', (e) => {
            // Trash icon → delete the draft.
            const del = e.target.closest('[data-act="delete"]');
            if (del) {
                e.preventDefault(); e.stopPropagation();
                const i = Number(del.dataset.i);
                if (!drafts[i]) return;
                drafts.splice(i, 1);
                save('vero_drafts', drafts);
                render();
                return;
            }
            // Publish button → push the draft to the live feed.
            const pub = e.target.closest('[data-act="publish"]');
            if (pub) {
                e.preventDefault(); e.stopPropagation();
                publishDraft(Number(pub.dataset.i));
                return;
            }
            // Click anywhere else on the card (incl. the edit pencil) → continue it.
            const card = e.target.closest('.product-card');
            if (!card) return;
            const i = Number(card.dataset.i);
            if (!drafts[i]) return;
            save('vero_resume_draft', drafts[i]);
            window.location.href = 'index.html';
        });

        render();

        // Exit mirrors the entry: image static, data slides back out to the left.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.55s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            wrap.style.opacity = '0';
            wrap.style.transform = 'translateX(-18vw)';
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
