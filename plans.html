<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>VERO · חבילות DME</title>
<script src="vero-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --ink:#1c1c1c; --line:#e6e6e3; --muted:#6b6b66; --soft:#8c8c86;
        --dot:#f5c518; --gold:#9a7d52;
        --f-sans:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;
        --f-serif:'Playfair Display',Georgia,serif;
        --f-label:'Oswald','Segoe UI',sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;margin:0;}
    html,body{height:100%;}
    body{font-family:var(--f-sans);color:var(--ink);background:#faf9f7;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;
        background:linear-gradient(rgba(250,249,247,.88),rgba(250,249,247,.95)),url('gallery-hero.jpg') center/cover no-repeat fixed;}
    .wrap{position:relative;z-index:1;width:100%;max-width:400px;margin:0 auto;
        padding:max(40px,calc(env(safe-area-inset-top,0px) + 20px)) 22px 46px;}

    /* back */
    .back{position:absolute;top:max(38px,calc(env(safe-area-inset-top,0px) + 18px));inset-inline-start:18px;
        width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--ink);cursor:pointer;}
    .back svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none;}
    .back:active{opacity:.5;}

    /* masthead — matches signup */
    .brand{text-align:center;font-family:var(--f-serif);font-size:30px;letter-spacing:8px;font-weight:500;margin-bottom:6px;}
    .tagline{text-align:center;font-family:var(--f-label);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:30px;}
    h1{font-family:var(--f-serif);font-size:25px;font-weight:500;text-align:center;letter-spacing:.3px;margin-bottom:6px;}
    .sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:26px;}

    /* billing toggle */
    .toggle{display:flex;justify-content:center;margin-bottom:28px;}
    .toggle-inner{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;}
    .tg-opt{border:none;background:none;cursor:pointer;font-family:var(--f-label);font-size:11px;letter-spacing:1.5px;
        text-transform:uppercase;color:var(--muted);padding:9px 18px;border-radius:999px;transition:.25s;display:flex;align-items:center;gap:7px;}
    .tg-opt.on{color:#fff;background:#000;}
    .tg-save{font-family:var(--f-sans);font-size:8.5px;letter-spacing:.3px;padding:2px 7px;border-radius:999px;background:#f0ece4;color:var(--gold);text-transform:none;}
    .tg-opt.on .tg-save{background:rgba(255,255,255,.22);color:#fff;}

    /* cards */
    .cards{display:flex;flex-direction:column;gap:16px;}
    .card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;transition:transform .35s cubic-bezier(.22,1,.36,1);}
    .card:active{transform:scale(.99);}
    .card.reco{border:1.5px solid var(--ink);box-shadow:0 14px 40px rgba(28,28,28,.08);}
    .card.reco::after{content:'';position:absolute;top:16px;inset-inline-start:16px;width:8px;height:8px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 2px #fff;}
    .ribbon{position:absolute;top:-11px;inset-inline-end:22px;background:#000;color:#fff;
        font-family:var(--f-label);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:5px 13px;border-radius:999px;}

    .c-name{font-family:var(--f-serif);font-size:22px;font-weight:600;letter-spacing:.5px;}
    .c-price{margin-top:12px;display:flex;align-items:baseline;gap:6px;}
    .c-cur{font-family:var(--f-serif);font-size:17px;}
    .c-amount{font-family:var(--f-serif);font-size:42px;font-weight:600;line-height:1;}
    .c-per{font-family:var(--f-label);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
    .c-sub{margin-top:9px;font-size:11px;color:var(--muted);min-height:14px;}
    .c-sub .save{color:var(--gold);font-weight:600;}

    .c-cta{width:100%;margin-top:20px;padding:13px;border:1px solid #000;background:#fff;color:#000;
        font-family:var(--f-sans);font-size:12.5px;font-weight:600;letter-spacing:.5px;cursor:pointer;border-radius:999px;transition:opacity .2s;}
    .c-cta:active{opacity:.7;}
    .card.reco .c-cta{background:#000;color:#fff;}
    .card.current .c-cta{background:none;color:var(--muted);border-color:var(--line);pointer-events:none;}

    .c-feats{list-style:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:13px;}
    .c-feats li{display:flex;align-items:flex-start;gap:11px;font-size:13px;color:#3a3a35;line-height:1.5;}
    .c-feats .ck{flex:0 0 auto;width:15px;height:15px;margin-top:2px;stroke:var(--ink);stroke-width:1.9;fill:none;}
    .c-feats li.muted{color:var(--soft);}
    .c-feats li.muted .ck{stroke:#c9c7c1;}

    .foot{text-align:center;margin-top:30px;font-size:11px;letter-spacing:.3px;color:var(--muted);line-height:1.9;}
</style>
<link rel="stylesheet" href="assets/fonts/aharoni.css">
</head>
<body>
<div class="wrap">
    <button class="back" id="backBtn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="brand">VERO</div>
    <div class="tagline">מנוע ההתאמה החכם</div>
    <h1>בחרו את חבילת ה-DME שלכם</h1>
    <div class="sub">שלב 1 מתוך 2 · ביטול בכל עת</div>

    <div class="toggle">
        <div class="toggle-inner" id="billToggle">
            <button class="tg-opt on" data-bill="yearly">שנתי <span class="tg-save">חיסכון 17%</span></button>
            <button class="tg-opt" data-bill="monthly">חודשי</button>
        </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="foot">התשלום מאובטח · ללא התחייבות<br>DME לומד את הטעם שלך ומשתפר ככל שאתה חוזר.</div>
</div>

<script>
(function(){
    'use strict';
    var PLANS=[
        {id:'free',name:'Free',monthly:0,yearly:0,reco:false,feats:[
            {t:'גילוי פריטים וחנויות',on:true},
            {t:'יומן עסקאות בסיסי',on:true},
            {t:'התראות ומרכז פעילות',on:true},
            {t:'DME מלא — התאמה לפי מידה וסגנון',on:false},
            {t:'מאמן מיקוח ואוצרות אישית',on:false}
        ]},
        {id:'premium',name:'Premium',monthly:39,yearly:390,reco:true,feats:[
            {t:'כל מה שבחינם, ובנוסף:',on:true},
            {t:'DME מלא — פריטים שמתאימים לך בול',on:true},
            {t:'מציאות "במיוחד בשבילך" בפיד',on:true},
            {t:'מאמן מיקוח + עגלה חכמה',on:true},
            {t:'אנליטיקה ומפת גילוי עם פילטרים',on:true}
        ]},
        {id:'luxury',name:'Luxury',monthly:89,yearly:890,reco:false,feats:[
            {t:'כל מה שב-Premium, ובנוסף:',on:true},
            {t:'אוצרות אישית ו-Concierge Hunt',on:true},
            {t:'מציאות נדירות + גישה מוקדמת',on:true},
            {t:'גרפים ותובנות עשירים',on:true},
            {t:'5 קידומי מוצר בחודש — חינם',on:true}
        ]}
    ];
    var bill='yearly';
    var current=(function(){try{return localStorage.getItem('vero_dme')==='1'?null:'free';}catch(e){return null;}})();
    function nis(n){return '₪'+n.toLocaleString('he-IL');}
    function ck(){return '<svg class="ck" viewBox="0 0 24 24"><path d="M5 12l4 4 10-11"/></svg>';}

    function cardHTML(p){
        var isCurrent=(p.id==='free'&&current==='free');
        var price,per,sub;
        if(p.monthly===0){price=0;per='לתמיד';sub='ללא תשלום, לנצח';}
        else if(bill==='yearly'){var mo=Math.round(p.yearly/12);price=mo;per='לחודש';
            var full=p.monthly*12,save=Math.round((1-p.yearly/full)*100);
            sub='<span class="save">חסכו '+save+'%</span> · '+nis(p.yearly)+' לשנה';}
        else{price=p.monthly;per='לחודש';sub='חיוב חודשי · '+nis(p.monthly*12)+' לשנה';}
        var feats=p.feats.map(function(f){return '<li class="'+(f.on?'':'muted')+'">'+ck()+'<span>'+f.t+'</span></li>';}).join('');
        var cta=isCurrent?'החבילה הנוכחית שלך':(p.id==='free'?'המשיכו בחינם':'בחרו ב-'+p.name);
        return '<div class="card'+(p.reco?' reco':'')+(isCurrent?' current':'')+'" data-id="'+p.id+'">'+
            (p.reco?'<span class="ribbon">הכי מומלץ</span>':'')+
            '<div class="c-name">'+p.name+'</div>'+
            '<div class="c-price"><span class="c-cur">₪</span><span class="c-amount">'+price+'</span><span class="c-per">'+per+'</span></div>'+
            '<div class="c-sub">'+sub+'</div>'+
            '<button class="c-cta">'+cta+'</button>'+
            '<ul class="c-feats">'+feats+'</ul></div>';
    }
    function render(){document.getElementById('cards').innerHTML=PLANS.map(cardHTML).join('');}
    render();

    document.getElementById('billToggle').addEventListener('click',function(e){
        var b=e.target.closest('.tg-opt');if(!b)return;bill=b.dataset.bill;
        this.querySelectorAll('.tg-opt').forEach(function(o){o.classList.toggle('on',o.dataset.bill===bill);});
        render();
    });
    document.getElementById('cards').addEventListener('click',function(e){
        var cta=e.target.closest('.c-cta');if(!cta)return;
        var card=e.target.closest('.card');var id=card&&card.dataset.id;if(!id)return;
        var dme=(id!=='free');
        if(window.veroSetTier)window.veroSetTier(dme?'dme':'free');
        else{try{localStorage.setItem('vero_dme',dme?'1':'0');}catch(e){}}
        // Confirm, then enter the app (completes the signup/upgrade flow).
        cta.textContent=dme?'הופעל ✓ ממשיכים…':'ממשיכים…';
        cta.style.opacity='.7';
        setTimeout(function(){
            if(window.top!==window){try{window.top.location.hash='#page=index.html';return;}catch(e){}}
            location.href='index.html';
        },700);
    });
    document.getElementById('backBtn').addEventListener('click',function(){
        if(window.top!==window){try{window.top.location.hash='#page=index.html';return;}catch(e){}}
        location.href='index.html';
    });
})();
</script>
</body>
</html>
