<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Fashion & Art Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: white;
            direction: rtl;
            letter-spacing: 0px;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            font-style: normal;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px;
        }

        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 18px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .hero {
            width: 100vw;
            aspect-ratio: 7 / 3;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            color: rgba(255, 255, 255, 0.1);
            margin: 0;
            padding: 0;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -24px;
            padding-top: 50px;
        }

        /* ==================== GRID ==================== */
        .grid-section {
            width: 100vw;
            padding: 50px 40px 50px 40px;
            display: grid;
            grid-template-columns: 0.65fr 0.65fr 0.65fr 2.05fr;
            gap: 20px;
            height: 720px;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        .grid-item {
            background: #f8f8f8;
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: rgba(0, 66, 37, 0.08);
        }

        /* ==================== CATEGORIES ==================== */
        .categories-section {
            padding: 40px 40px;
            background: white;
            border-top: 1px solid #eee;
            margin-top: 0;
        }

        .section-title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #000;
            display: none;
        }

        .categories-wrapper {
            position: relative;
        }

        .categories-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0;
            scrollbar-width: none;
        }

        .categories-grid::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            background: #f8f8f8;
            border: none;
            border-radius: 8px;
            padding: 0;
            display: flex;
            flex-direction: column;
            aspect-ratio: 9 / 12;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
            flex: 0 0 calc(25% - 15px);
            min-width: 220px;
        }

        .category-card:hover {
            transform: translateY(-4px);
            background: #f0f0f0;
        }

        .category-text {
            position: absolute;
            bottom: 16px;
            right: 16px;
            left: 16px;
            background: white;
            padding: 12px;
            text-align: right;
            z-index: 2;
            border-radius: 6px;
        }

        .category-text h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0;
            color: #000;
            letter-spacing: 0px;
        }

        .category-text p {
            font-size: 13px;
            color: #999;
            margin-bottom: 0;
            display: none;
        }

        .category-btn {
            display: none;
        }

        .category-icon {
            font-size: 140px;
            color: rgba(0, 66, 37, 0.06);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .category-nav:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .category-nav svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
        }

        .category-nav.prev {
            left: 20px;
        }

        .category-nav.next {
            right: 20px;
        }

        /* ==================== FEED ==================== */
        .feed-section {
            padding: 45px 0;
            background: white;
        }

        /* Feed uses the full page width so the 5-up product grid can breathe;
           the 30px horizontal padding matches the grid gap for even edges. */
        .feed-section .container {
            max-width: none;
            padding: 0;
        }

        .feed-block {
            background: white;
            margin-bottom: 30px;
            padding: 20px 65px;
            border-radius: 0;
        }

        .featured-product {
            display: grid;
            grid-template-columns: minmax(0, 850px) minmax(0, 850px);
            justify-content: center;
            gap: 90px;
            align-items: center;
            margin-bottom: 60px;
            padding-bottom: 60px;
        }

        .featured-product.flipped {
            grid-template-columns: 1fr 1fr;
            direction: ltr;
        }

        .featured-product.flipped .featured-image {
            order: -1;
        }

        .featured-text {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .featured-brand {
            font-size: 20px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .featured-text h3 {
            font-size: 82px;
            font-weight: 700;
        }

        .featured-category {
            font-size: 33px;
            color: #004225;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .featured-text p {
            font-size: 33px;
            color: #666;
            line-height: 1.6;
        }

        .featured-price {
            font-size: 45px;
            color: #000;
            font-weight: 700;
        }

        .featured-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
        }

        .featured-btn:hover {
            background: #003319;
        }

        .featured-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 340px;
            color: rgba(0, 66, 37, 0.1);
        }

        .products-label {
            font-size: 24px;
            margin: 45px 0 30px 0;
            font-weight: 400;
        }

        /* ==================== PROMO SLIDER (Ferrari-style) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 20px 0 70px 0;
            padding: 20px 0 0 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 70px;
            padding: 20px 40px 40px 40px;
        }

        .promo-image {
            width: 100%;
            max-width: 930px;
            aspect-ratio: 1 / 1;
            margin-inline: auto;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 470px;
            color: rgba(0, 66, 37, 0.12);
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 33px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 69px;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.12;
            letter-spacing: 0.5px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 26px;
            line-height: 1.65;
            color: #444;
            max-width: 620px;
            margin: 0;
        }

        .promo-readmore {
            display: inline-flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111;
            font-family: 'Segoe UI', sans-serif;
            padding: 0;
            margin-top: 12px;
            font-size: 19px;
        }

        .promo-readmore .circle {
            width: 64px;
            height: 64px;
            border: 1px solid #c4c4c4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: #111;
        }

        .promo-readmore:hover .circle {
            background: #111;
            border-color: #111;
            color: #fff;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 34px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #d40000;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #d40000;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        .promo-viewall {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            color: #111;
            cursor: pointer;
        }

        .promo-viewall .line {
            width: 64px;
            height: 1px;
            background: #111;
            display: inline-block;
        }

        @media (max-width: 900px) {
            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }
            .promo-viewport { margin: 0 50px; }
            .promo-title { font-size: 32px; }
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 20px;
        }

        .product-card {
            background: white;
            border: none;
            overflow: hidden;
            transition: transform 0.5s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .product-card:hover {
            transform: none;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: #F0F0F0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            top: 18px;
            padding: 0;
        }

        .product-icon:hover {
            transform: scale(1.1);
        }

        .product-icon.cart {
            right: 18px;
        }

        .product-icon.heart {
            right: 84px;
        }

        .product-icon svg {
            width: 33px;
            height: 33px;
            stroke: #1a1a1a;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .product-icon.heart svg {
            fill: none;
        }

        .product-info {
            padding: 18px 18px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 5;
            border-radius: 2px;
        }

        .product-name-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 6px;
        }

        .product-seller {
            font-size: 16.5px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 9px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-name {
            font-size: 21px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .product-rating {
            font-size: 16.5px;
            color: #666;
            margin-top: 0;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-label {
            display: none;
        }

        .product-price {
            font-size: 21px;
            color: #000;
            font-weight: 700;
            margin-bottom: 0;
            text-align: left;
            position: static;
        }

        .product-footer {
            display: none;
        }

        .product-btn {
            display: none;
        }

        .product-heart {
            display: none;
        }

        .load-more {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* ==================== ICON BADGES ==================== */
        .icon-wrap {
            position: relative;
            display: inline-flex;
        }

        .badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .badge.show {
            display: flex;
        }

        .product-heart.active {
            background: #fdecea;
            border-color: #c0392b;
        }

        /* ==================== PAGE HERO (full-width, blended with header) ==================== */
        .page-hero {
            width: 100vw;
            margin: 0;
            margin-left: -50vw;
            margin-right: -50vw;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            min-height: 500px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            direction: rtl;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-slash {
            font-size: 48px;
            color: #004225;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 300;
            color: #000;
            margin: 0;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 1px;
        }

        .hero-description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }

        .hero-checkout-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
            border-radius: 2px;
        }

        .hero-checkout-btn:hover {
            background: #003319;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            border-radius: 4px;
        }

        /* ==================== CART CATEGORY TABS (borderless, labels only) ==================== */
        .page-hero .cart-tabs {
            width: 100%;
            max-width: 1600px;
            margin: -1px auto 0;
            padding: 0 40px 0 40px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            direction: ltr;
        }

        .cart-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            padding: 0 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 40px;
        }

        .cart-tab {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: #999;
            padding: 0;
            transition: color 0.25s;
            text-transform: uppercase;
            font-weight: 600;
        }

        .cart-tab:hover {
            color: #004225;
        }

        .cart-tab.active {
            color: #004225;
        }

        /* ==================== CART PAGE BODY ==================== */
        .cart-page-body {
            padding: 10px 0 80px 0;
        }

        .cart-group {
            margin-bottom: 40px;
        }

        .cart-group-title {
            font-size: 22px;
            font-weight: 400;
            color: #004225;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .cart-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
        }

        /* Cart & wishlist items reuse the feed product-card design (same form & size) */
        #cartContainer .container,
        #wishlistContainer .container {
            max-width: none;
            padding-left: 65px;
            padding-right: 65px;
        }

        /* Cart cards match feed cards, with a slightly taller image. */
        .cart-item .product-image {
            aspect-ratio: 3 / 4.5;
        }

        .product-icon.remove {
            right: 18px;
        }

        .product-icon.remove svg {
            stroke: #c0392b;
        }

        .cart-card {
            background: white;
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .cart-card-img {
            width: 100%;
            aspect-ratio: 3 / 4;

        .cart-card-info {
            padding: 14px;

            display: flex;
            flex-direction: column;
        }

        .cart-card-seller {
            font-size: 11px;
            color: #999;

            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-family: 'Segoe UI', sans-serif;
        }

        .cart-card-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .cart-card-rating {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;

        }

        .cart-card-price {
            font-size: 15px;
            color: #004225;
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 12px;
        }

        .cart-card-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .cart-card-controls .qty-btn {
            display: none;
        }

        .cart-card-controls .qty-num {
            display: none;
        }

        .cart-card-remove {
            background: none;
            border: none;
            color: #c0392b;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-summary {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            padding-top: 24px;
            border-top: 2px solid #004225;
        }

        .cart-summary-total {
            font-size: 24px;
            font-family: 'Segoe UI', sans-serif;
            color: #004225;
            font-weight: 700;
        }

        .cart-checkout-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
        }

        .cart-checkout-btn:hover {
            background: #003319;
        }

        /* ==================== CART HERO (5:3 full-width) ==================== */
        .cart-hero {
            width: 100%;
            max-width: 100vw;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .cart-empty {
            text-align: center;
            color: #999;
            padding: 80px 20px;
            font-size: 18px;
        }

        /* ==================== TOAST ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #004225;
            color: white;
            padding: 14px 22px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateX(-120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .grid-section {
                grid-template-columns: 1fr 1fr;
                height: auto;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .featured-product {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header-container {

            .header-left {

            }

                letter-spacing: 6px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 0 20px;
            }

        let currentCategory = 'clothing';

        // ==================== CART & WISHLIST STATE ====================
        let cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');

        function saveState() {
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_wishlist', JSON.stringify(wishlist));
        }

        function priceToNum(p) {
            return parseFloat(String(p).replace(/[^\d.]/g, '')) || 0;
        }

        function isWished(id) {
            return wishlist.some(w => w.id === id);
        }

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            cb.textContent = cartCount;
            cb.classList.toggle('show', cartCount > 0);
            wb.textContent = wishlist.length;
            wb.classList.toggle('show', wishlist.length > 0);
        }

        function cartVisible() {
            return document.getElementById('cartView').style.display !== 'none';
        }

        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            saveState();
            updateBadges();
            showToast(`נוסף לעגלה: ${item.name}`);
            if (cartVisible()) renderCartPage();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

        function toggleWishlist(item, btn) {
            if (isWished(item.id)) {
                wishlist = wishlist.filter(w => w.id !== item.id);
                if (btn) btn.classList.remove('active');
                showToast(`הוסר מהמשאלות: ${item.name}`);
            } else {
                wishlist.push(item);
                if (btn) btn.classList.add('active');
                showToast(`נוסף למשאלות: ${item.name}`);
            }
            saveState();
            updateBadges();
            document.querySelectorAll(`.product-card[data-id="${CSS.escape(item.id)}"] .product-heart`)
                .forEach(h => h.classList.toggle('active', isWished(item.id)));
        }

        // ==================== VIEW SWITCHING ====================
        function hideAllViews() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('cartHero').style.display = 'none';
            document.getElementById('cartContainer').style.display = 'none';
            document.getElementById('wishlistHero').style.display = 'none';
            document.getElementById('wishlistContainer').style.display = 'none';
        }

        function showMain() {
            hideAllViews();
            document.getElementById('mainView').style.display = 'block';
            window.scrollTo(0, 0);

        function openCart() {
            hideAllViews();
            document.getElementById('cartHero').style.display = 'block';
            document.getElementById('cartContainer').style.display = 'block';
            renderCartPage();
            window.scrollTo(0, 0);
        }

        function openWishlist() {
            hideAllViews();
            document.getElementById('wishlistHero').style.display = 'block';
            document.getElementById('wishlistContainer').style.display = 'block';
            renderWishlistPage();
            window.scrollTo(0, 0);
        }

        function wishlistVisible() {
            return document.getElementById('wishlistContainer').style.display !== 'none';
        }

        // ==================== CART PAGE RENDER ====================
        let activeCartTab = 'all';

        function cartCategories() {
            return [...new Set(cart.map(i => i.category))];
        }

        function selectCartTab(tab) {
            activeCartTab = tab;
            renderCartPage();
        }

        function renderCartPage() {
            const body = document.getElementById('cartPageBody');

            if (cart.length === 0) {
                body.innerHTML = '<div class="cart-empty">העגלה ריקה 🛒<br>חזור לדף הראשי והוסף מוצרים</div>';
                return;
            }

            // build tabs HTML
            const cats = cartCategories();
            const tabs = ['all', ...cats];
            const tabsHtml = tabs.map(tab => {
                const label = tab === 'all' ? 'הכל' : tab;
                return `<button class="cart-tab${activeCartTab === tab ? ' active' : ''}" onclick="selectCartTab('${tab.replace(/'/g, "\\'")}')">${label}</button>`;
            }).join('');

            // 'all' shows one flat grid (5 per row, like the feed); a tab filters by category
            const items = activeCartTab === 'all' ? cart : cart.filter(i => i.category === activeCartTab);
            let html = `<div class="cart-tabs">${tabsHtml}</div>`;
            html += `
                <div class="cart-group">
                    <div class="cart-cards">
                        ${items.map(cartCardHTML).join('')}
                    </div>
                </div>

            html += `
                <div class="cart-summary">
                    <span>סה"כ לתשלום</span>
                    <span class="cart-summary-total">₪${total.toFixed(2)}</span>
                    <button class="cart-checkout-btn" onclick="checkout()">מעבר לתשלום</button>
                </div>

        }

        function cartCardHTML(item) {
            const safeId = item.id.replace(/'/g, "\\'");

            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
            return `
                <div class="product-card cart-item">
                    <div class="product-image">${item.icon}
                        <button class="product-icon remove" title="הסר מהעגלה" onclick="removeFromCart('${safeId}')">

                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>

                    <div class="product-info">

                        <div class="product-name-price">

                            <div class="product-price">${item.price}</div>
                        </div>
                        <div class="product-rating">${stars} ${rating}</div>
                    </div>
                </div>
            `;
        }

        function checkout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, i) => sum + priceToNum(i.price) * i.qty, 0);
            showToast(`התשלום בסך ₪${total.toFixed(2)} התקבל! תודה 🎉`);
            cart = [];
            saveState();
            updateBadges();
            renderCartPage();
        }

        // ==================== WISHLIST PAGE RENDER ====================
        let activeWishlistTab = 'all';

        function wishlistCategories() {
            return [...new Set(wishlist.map(i => i.category))];
        }

        function selectWishlistTab(tab) {
            activeWishlistTab = tab;
            renderWishlistPage();
        }

        function removeFromWishlist(id) {
            wishlist = wishlist.filter(w => w.id !== id);
            saveState();
            updateBadges();
            renderWishlistPage();
        }

        function moveWishlistToCart() {
            if (wishlist.length === 0) return;
            wishlist.forEach(item => {
                const existing = cart.find(i => i.id === item.id);
                if (existing) existing.qty++;
                else cart.push({ ...item, qty: 1 });

            const count = wishlist.length;
            wishlist = [];
            saveState();
            updateBadges();
            showToast(`${count} מוצרים הועברו לעגלה 🛒`);
            renderWishlistPage();
        }

        function renderWishlistPage() {
            const body = document.getElementById('wishlistPageBody');

            if (wishlist.length === 0) {
                body.innerHTML = '<div class="cart-empty">רשימת המשאלות ריקה 💭<br>חזור לדף הראשי והוסף מוצרים שאתה אוהב</div>';

            const cats = wishlistCategories();

            }).join('');

            const items = activeWishlistTab === 'all' ? wishlist : wishlist.filter(i => i.category === activeWishlistTab);
            let html = `<div class="cart-tabs">${tabsHtml}</div>`;

                <div class="cart-group">
                    <div class="cart-cards">
                        ${items.map(wishlistCardHTML).join('')}

                </div>

        function wishlistCardHTML(item) {
            const safeId = item.id.replace(/'/g, "\\'");
            const rating = item.rating || 4.5;
            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');

                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>

                        <div class="product-rating">${stars} ${rating}</div>

        // ==================== TOASTS ====================
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        // Second-hand marketplace: each product is a one-off. Once someone claims
        // it (cart or wishlist), it disappears from the feed and can't be
        // claimed again by someone else.
        function addToWishlist(item) {
            if (isWished(item.id)) return;
            wishlist.push(item);
            saveState();
            updateBadges();
            showToast(`נוסף למשאלות: ${item.name}`);
            if (wishlistVisible()) renderWishlistPage();
        }

        function removeCardFromFeed(card) {
            if (!card.closest('#feedContainer')) return;
            card.style.transition = 'opacity 0.3s, transform 0.3s';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.92)';
            setTimeout(() => card.remove(), 300);
        }

        // ==================== EVENT DELEGATION (product buttons) ====================
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const card = btn.closest('.product-card');
            if (!card) return;
            const item = {
                id: card.dataset.id,
                name: card.dataset.name,
                price: card.dataset.price,
                icon: card.dataset.icon,
                category: card.dataset.category,
                seller: card.dataset.seller,
                rating: parseFloat(card.dataset.rating)
            };
            const action = btn.dataset.action;
            if (action === 'cart') {
                addToCart(item);
                removeCardFromFeed(card);
            } else if (action === 'wishlist') {
                addToWishlist(item);
                removeCardFromFeed(card);
            }
        });

        // Toggle Category
        function toggleCategory(btn, category) {
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            document.getElementById('categoryTitle').textContent =
                category === 'clothing' ? 'בחר קטגוריה: ביגוד' : 'בחר קטגוריה: אומנות';

            // Change hero image based on category
            const heroImage = document.getElementById('heroImage');
            if (category === 'clothing') {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=1600&h=600&fit=crop')";
                heroImage.style.backgroundPosition = "center";
            } else {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1561070791-2526d30994b5?w=1600&h=600&fit=crop')";
                heroImage.style.backgroundPosition = "center";
            }

            renderCategories();
            renderFeed();
        }

        // Scroll Categories Slider
        function scrollCategories(direction) {
            const grid = document.getElementById('categoriesGrid');
            const scrollAmount = 350;
            grid.scrollBy({
                left: direction > 0 ? scrollAmount : -scrollAmount,
                behavior: 'smooth'
            });
        }

        // Render Categories
        function renderCategories() {
            const categories = currentCategory === 'clothing' ? clothingCategories : artCategories;
            const html = categories.map(cat => `
                <div class="category-card">
                    <div class="category-text">
                        <h3>${cat.name}</h3>
                        <p>${cat.desc}</p>
                        <button class="category-btn">עיין</button>
                    </div>
                    <div class="category-icon">${cat.icon}</div>
                </div>
            `).join('');

            document.getElementById('categoriesGrid').innerHTML = html;
        }

        // Render Feed
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer');
            clearPromoSliders();
            feedContainer.innerHTML = '';
            feedBlocksCount = 0;
            loadMoreFeedBlocks();
        }

        // Load More Feed Blocks
        function loadMoreFeedBlocks() {
            const feedContainer = document.getElementById('feedContainer');

            // Add 2 blocks at a time, max 4 blocks
            const blocksToAdd = Math.min(2, 4 - feedBlocksCount);
            if (blocksToAdd <= 0) return;

            for (let i = 0; i < blocksToAdd; i++) {
                // Filter products based on category, and exclude any already
                // claimed (in cart or wishlist) so second-hand items never duplicate.
                const products = currentCategory === 'clothing'
                    ? clothingProducts
                    : artProducts;
                const taken = new Set([
                    ...cart.map(i => i.id),
                    ...wishlist.map(i => i.id)
                ]);
                const available = products.filter(p => !taken.has(`${p.name}|${p.price}`));

                const startIdx = feedBlocksCount * 10;
                const blockProducts = available.slice(startIdx, startIdx + 10);
                if (blockProducts.length === 0) return;

                const block = document.createElement('div');
                block.className = 'feed-block';

                let productsHtml = '';
                for (let j = 0; j < blockProducts.length; j++) {
                    const prod = blockProducts[j];
                    const pid = `${prod.name}|${prod.price}`;
                    const stars = '★'.repeat(Math.floor(prod.rating)) + (prod.rating % 1 >= 0.5 ? '☆' : '');
                    productsHtml += `
                        <div class="product-card" data-id="${pid}" data-name="${prod.name}" data-price="${prod.price}" data-icon="${prod.icon}" data-category="${prod.category}" data-seller="${prod.seller}" data-rating="${prod.rating}">
                            <div class="product-image">${prod.icon}
                                <button class="product-icon cart" data-action="cart" title="הוסף לעגלה">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                                    </svg>
                                </button>
                                <button class="product-icon heart" data-action="wishlist" title="הוסף למשאלות">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="product-info">
                                <div class="product-seller">${prod.seller}</div>
                                <div class="product-name-price">
                                    <div class="product-name">${prod.name}</div>
                                    <div class="product-price">${prod.price}</div>
                                </div>
                                <div class="product-rating">${stars} ${prod.rating}</div>
                                <div class="product-footer">
                                    <button class="product-btn" data-action="cart">הוסף לעגלה</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                block.innerHTML = `
                    <div class="products-grid">
                        ${productsHtml}
                    </div>
                `;

                // A promo slider precedes every grid (every 2 rows of products).
                const slider = createPromoSlider();
                feedContainer.appendChild(slider);
                promoGo(slider.dataset.uid, 0);

                feedContainer.appendChild(block);
                feedBlocksCount++;
            }
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                loadMoreFeedBlocks();
            }
        });

        // ==================== PROMO SLIDER (Ferrari-style, multi-instance) ====================
        const PROMO_INTERVAL = 6000;
        const promoChevron = dir => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="${dir === 'left' ? '15 6 9 12 15 18' : '9 6 15 12 9 18'}"></polyline></svg>`;
        const promoRingSVG = `<svg class="promo-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"></circle></svg>`;

        // Each slider instance keeps its own index + autoplay timer, keyed by a unique id.
        const promoState = {};
        let promoUidCounter = 0;

        function promoSlideHTML(s) {
            return `
                <div class="promo-slide">
                    <div class="promo-image">${s.icon}</div>
                    <div class="promo-text">
                        <h2 class="promo-title">${s.name}</h2>
                        <p class="promo-desc">${s.desc}</p>
                        <button class="promo-readmore" onclick="showToast('קרא עוד: ${s.name.replace(/'/g, "\\'")}')">
                            קרא עוד <span class="circle">${promoChevron('right')}</span>
                        </button>
                    </div>
                </div>`;
        }

        function promoSliderInner(uid, slides) {
            return `
                <button class="promo-arrow prev" aria-label="הקודם" onclick="promoGo('${uid}', promoState['${uid}'].index - 1)">${promoChevron('left')}</button>
                <div class="promo-viewport">
                    <div class="promo-track" id="promoTrack-${uid}">
                        ${slides.map(promoSlideHTML).join('')}
                    </div>
                </div>
                <button class="promo-arrow next" aria-label="הבא" onclick="promoGo('${uid}', promoState['${uid}'].index + 1)">${promoChevron('right')}</button>
                <div class="promo-footer">
                    <div class="promo-dots" id="promoDots-${uid}">
                        ${slides.map((s, i) => `<button class="promo-dot" aria-label="שקופית ${i + 1}" onclick="promoGo('${uid}', ${i})"></button>`).join('')}
                    </div>
                    <div class="promo-viewall" onclick="showToast('כל המוצרים המקודמים בקרוב ✨')"><span class="line"></span> VIEW ALL</div>
                </div>`;
        }

        // Build a fresh slider element (not yet mounted) and register its state.
        function createPromoSlider() {
            const uid = 'p' + (promoUidCounter++);
            const el = document.createElement('div');
            el.className = 'promo-slider';
            el.innerHTML = promoSliderInner(uid, featuredProducts);
            promoState[uid] = { index: 0, timer: null };
            el.dataset.uid = uid;
            return el;
        }

        function promoGo(uid, i) {
            const st = promoState[uid];
            const track = document.getElementById('promoTrack-' + uid);
            if (!st || !track) return;
            const n = featuredProducts.length;
            st.index = (i + n) % n;
            track.style.transform = `translateX(-${st.index * 100}%)`;
            document.querySelectorAll('#promoDots-' + uid + ' .promo-dot').forEach((dot, idx) => {
                const active = idx === st.index;
                dot.classList.toggle('active', active);
                dot.innerHTML = active ? promoRingSVG : '';
            });
            clearInterval(st.timer);
            st.timer = setInterval(() => promoGo(uid, st.index + 1), PROMO_INTERVAL);
        }

        // Stop and forget every slider (called before the feed is rebuilt).
        function clearPromoSliders() {
            Object.values(promoState).forEach(s => clearInterval(s.timer));
            for (const k in promoState) delete promoState[k];
        }

        function openSellerArea() {
            window.location.href = 'seller-area.html';
        }

        // Initialize
        renderCategories();
        renderFeed();
        updateBadges();
    </script>
</body>
</html>
