<title>Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16150f; --muted: #8f8d86; --line: #e6e4de; --line-strong: #cfccc4; --bg: #ffffff;
    --market: #9a7d52; --fair: #2b6d9a; --meetup: #1f8f4e; --popup: #b23b3b;
    --oak: #4C5A31; --oak-deep: #2E3A1E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .back {
    position: fixed; top: 20px; left: 20px; z-index: 40;
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
    border: 1px solid var(--ink); border-radius: 999px; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; text-decoration: none; color: var(--ink); background: var(--bg);
    transition: background 0.2s, color 0.2s;
  }
  .back:hover { background: var(--ink); color: #fff; }
  html.is-embed .back { display: none !important; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 24px 90px; }
  html.is-embed .wrap { padding: 22px 18px 120px; }

  .eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Bodoni Moda', 'Didot', Georgia, serif; font-weight: 500; font-size: clamp(30px, 8vw, 42px); margin: 12px 0 12px; letter-spacing: 0.5px; }
  .lede { color: var(--muted); font-size: 13px; font-weight: 300; max-width: 42ch; }

  /* ---- Featured slider: 4 upcoming events at a time, crossfading ----
     Styled like the dashboard KPI tiles: a big date, a small label beneath. */
  .evs { margin: 2px 0 30px; }
  .evs-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; }
  .evs-eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
  .evs-count { font-size: 11px; color: var(--muted); }
  .evs-stage { position: relative; }
  .evs-grid { display: grid; grid-template-columns: 1fr; gap: 30px 24px; transition: opacity 0.55s ease; }
  .evs-grid.fade { opacity: 0; }
  .evs-grid.single { grid-template-columns: 1fr; max-width: 60%; margin: 0 auto; }
  .evs-tile { text-align: center; cursor: pointer; border: none; background: none; padding: 0; margin: 0; font: inherit; width: 100%; -webkit-tap-highlight-color: transparent; }
  .evs-tile:active { opacity: 0.6; }
  .evs-tile:first-child .evs-day { color: var(--oak); }
  .evs-day { font-family: 'Bodoni Moda', 'Didot', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 0.95; letter-spacing: 0.5px; }
  .evs-mon { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-top: 7px; }
  .evs-name { font-size: 13px; font-weight: 400; margin-top: 12px; line-height: 1.35; }
  .evs-type { font-size: 10.5px; letter-spacing: 0.5px; color: var(--muted); margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; }
  .evs-type i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .evs-dots { display: flex; justify-content: center; gap: 6px; margin-top: 24px; }
  .evs-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); transition: width 0.25s, background 0.25s; cursor: pointer; }
  .evs-dots i.on { width: 18px; background: var(--ink); }
  .evs-dots { display: none; }
  /* Tap a tile → the 4 dates slide out to the right and that date's full
     info slides in to take their place (a horizontal filmstrip). */
  .evs-viewport { overflow: hidden; transition: height 0.5s cubic-bezier(0.22,1,0.36,1); }
  .evs-track { display: flex; width: 200%; height: 100%; transform: translateX(-50%);
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1); }
  .evs-track.show-detail { transform: translateX(0); }
  .evs-track > .evs-grid, .evs-track > .evs-detail { flex: 0 0 50%; width: 50%; align-self: stretch; }
  /* The slider stands ~3/4 of the screen tall; the dates spread down it and the
     open detail centres in the same space. */
  .evs-track > .evs-grid { height: 100%; align-content: space-evenly; }
  .evs-track > .evs-detail { display: flex; flex-direction: column; justify-content: center; }
  /* While open, the detail auto-advances through every event; each swap slides across. */
  .evs-detail-inner { position: relative; transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease; }
  .evs-detail-inner.d-out { transform: translateX(-24px); opacity: 0; }
  .evs-detail-inner.d-in { transform: translateX(24px); opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .evs-detail-inner { transition: none; } }
  .evs-detail-date { display: flex; align-items: baseline; gap: 10px; }
  .evs-detail-d { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1; color: var(--oak); }
  .evs-detail-m { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
  .evs-detail-name { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 20px; color: var(--ink); margin-top: 12px; line-height: 1.2; }
  .evs-detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .evs-detail-meta .evs-type { font-size: 12px; }
  .evs-detail-cta { display: inline-block; margin-top: 18px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--oak); text-decoration: none; border-bottom: 1px solid var(--oak-deep); padding-bottom: 3px; background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; font-family: inherit; }
  .evs-detail-x { position: absolute; top: 14px; right: 0; width: 30px; height: 30px; border: none; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .evs-detail-x svg { width: 16px; height: 16px; }
  @media (prefers-reduced-motion: reduce) { .evs-detail, .evs-detail-inner { transition: none; } }

  /* ---- Month navigation ---- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
  .cal-month { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 22px; letter-spacing: 0.5px; }
  .cal-arrow {
    width: 40px; height: 40px; border: 1px solid var(--line-strong); border-radius: 50%;
    background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: all 0.2s;
  }
  .cal-arrow:hover { border-color: var(--ink); background: var(--ink); color: #fff; }
  .cal-today-btn { font: inherit; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
  .cal-today-btn:hover { color: var(--ink); }

  /* ---- Calendar grid ---- */
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .cal-dow span { text-align: center; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border: 1px solid transparent; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; color: var(--ink); cursor: default; position: relative; transition: background 0.15s, border-color 0.15s;
  }
  .cal-cell.blank { visibility: hidden; }
  .cal-cell.muted { color: var(--line-strong); }
  .cal-cell.has { cursor: pointer; }
  .cal-cell.has:hover { border-color: var(--line-strong); }
  .cal-cell.today { border-color: var(--oak); color: var(--oak); font-weight: 500; }
  .cal-cell.sel { background: var(--oak); color: #fff; }
  .cal-cell.sel .dots i { background: #fff !important; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

  /* ---- Detail list ---- */
  .detail-h { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 6px; }
  .detail-t { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .detail-count { font-size: 11px; color: var(--muted); }
  .ev { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; padding: 18px 2px; border-bottom: 1px solid var(--line); }
  .ev-date { text-align: center; }
  .ev-day { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 22px; line-height: 1; }
  .ev-mon { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .ev-title { font-size: 14px; }
  .ev-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .ev-type { display: inline-flex; align-items: center; gap: 5px; }
  .ev-type i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .ev-time { font-family: 'Bodoni Moda', serif; font-size: 14px; white-space: nowrap; }
  .ev.past { opacity: 0.55; }
  /* Booth (+) control on each event, seller only. */
  .ev-join { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .ev-plus {
    width: 32px; height: 32px; border: 1px solid var(--line-strong); border-radius: 50%;
    background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: all 0.2s;
  }
  .ev-plus svg { width: 15px; height: 15px; }
  .ev-plus:hover { border-color: var(--ink); background: var(--ink); color: #fff; }
  .ev-booked { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--meetup); display: inline-flex; align-items: center; gap: 5px; }
  .ev-booked .chk { width: 6px; height: 6px; border-radius: 50%; background: var(--meetup); }

  /* Booth panel: participate + pick products. */
  .booth { grid-column: 1 / -1; max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .booth.open { max-height: 560px; }
  .booth-inner { padding: 16px 0 8px; }
  .booth-t { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .booth-lede { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 12px; padding: 8px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-strong); background: none; color: var(--ink); transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .cdot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--line-strong); }
  .chip.on { border-color: var(--oak); background: var(--oak); color: #fff; }
  .chip.on .cdot { background: #fff; border-color: #fff; }
  .booth-empty { font-size: 12px; color: var(--muted); }
  .booth-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .booth-actions .spacer { flex: 1; }
  .bbtn { font: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 10px 16px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line-strong); background: none; color: var(--ink); transition: all 0.2s; }
  .bbtn:hover { border-color: var(--ink); }
  .bbtn.save { background: var(--oak); border-color: var(--oak); color: #fff; }
  .bbtn.remove { border: none; color: var(--muted); }
  .bbtn.remove:hover { color: var(--popup); }
  .cal-cell.booth-day::after { content: ''; position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--meetup); }

  /* Public attendee list — which sellers have a booth + what they sell. */
  .ev-attend { grid-column: 1 / -1; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .ev-attend-h { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .ev-sellers { display: flex; flex-wrap: wrap; gap: 7px; }
  .seller { font-size: 11.5px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; display: inline-flex; align-items: center; text-decoration: none; color: inherit; transition: border-color 0.2s, background 0.2s; }
  .seller b { font-weight: 500; }
  .seller:hover { border-color: var(--ink); }
  .seller.you { border-color: var(--ink); }
  .seller.you:hover { background: var(--ink); color: #fff; }
  .ev-more { font-size: 11px; color: var(--muted); align-self: center; }
  /* Category selector in the booth panel. */
  .cat-sel { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .ev-empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; font-weight: 300; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; font-size: 10.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---- Seller: add-event control + form ---- */
  .add-btn {
    font: inherit; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; cursor: pointer;
    border: 1px solid var(--ink); border-radius: 999px; background: none; color: var(--ink); transition: all 0.2s;
  }
  .add-btn:hover { background: var(--oak); border-color: var(--oak); color: #fff; }
  .add-btn svg { width: 13px; height: 13px; }
  .add-form { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; border-bottom: 1px solid var(--line); }
  .add-form.open { max-height: 460px; }
  .add-inner { padding: 20px 2px 26px; display: grid; gap: 14px; }
  .fld { display: grid; gap: 6px; }
  .fld label { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .fld input, .fld select {
    font: inherit; font-size: 14px; color: var(--ink); background: none;
    border: none; border-bottom: 1px solid var(--line-strong); padding: 8px 2px; outline: none; width: 100%;
  }
  .fld input:focus, .fld select:focus { border-bottom-color: var(--ink); }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .add-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .add-actions .spacer { flex: 1; }
  .fbtn { font: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line-strong); background: none; color: var(--ink); transition: all 0.2s; }
  .fbtn:hover { border-color: var(--ink); }
  .fbtn.save { background: var(--oak); border-color: var(--oak); color: #fff; }
  .fbtn.cancel { border: none; color: var(--muted); }
</style>

<body>
    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->
    <header class="page-header">
        <div class="ph-name" role="heading" aria-level="1">Events</div>
        <a class="ph-back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </header>

  <main class="wrap">
    <!-- Featured strip: 4 upcoming events at a time, crossfading. Built by renderSlider(). -->
    <section class="evs" id="evsSlider" style="display:none">
      <div class="evs-head">
        <span class="evs-eyebrow">Coming up</span>
        <span class="evs-count" id="evsCount"></span>
      </div>
      <div class="evs-viewport" id="evsViewport">
        <div class="evs-track" id="evsTrack">
          <div class="evs-detail" id="evsDetail"></div>
          <div class="evs-grid" id="evsGrid"></div>
        </div>
      </div>
      <div class="evs-dots" id="evsDots"></div>
    </section>

    <!-- The page header carries the title; the calendar starts right below it. -->
    <div id="sellerAdd" style="display:none; margin-bottom:22px;">
      <button class="add-btn" id="addToggle" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Host an event
      </button>
      <div class="add-form" id="addForm">
        <div class="add-inner">
          <div class="fld"><label for="fTitle">Event name</label><input id="fTitle" type="text" placeholder="e.g. Neighbourhood Flea Market"></div>
          <div class="fld-row">
            <div class="fld"><label for="fDate">Date</label><input id="fDate" type="date"></div>
            <div class="fld"><label for="fTime">Time</label><input id="fTime" type="text" placeholder="10:00–18:00"></div>
          </div>
          <div class="fld-row">
            <div class="fld"><label for="fType">Type</label>
              <select id="fType"><option value="market">Market</option><option value="fair">Fair</option><option value="meetup">Meetup</option><option value="popup">Pop-up</option></select>
            </div>
            <div class="fld"><label for="fPlace">Location</label><input id="fPlace" type="text" placeholder="e.g. Dizengoff Sq, Tel Aviv"></div>
          </div>
          <div class="add-actions">
            <button class="fbtn cancel" id="fCancel" type="button">Cancel</button>
            <div class="spacer"></div>
            <button class="fbtn save" id="fSave" type="button">Create event</button>
          </div>
        </div>
      </div>
    </div>

    <div class="cal-nav">
      <button class="cal-arrow" id="prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="text-align:center">
        <div class="cal-month" id="calMonth">—</div>
        <button class="cal-today-btn" id="todayBtn">Today</button>
      </div>
      <button class="cal-arrow" id="next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="legend">
      <span><i style="background:var(--market)"></i>Market</span>
      <span><i style="background:var(--fair)"></i>Fair</span>
      <span><i style="background:var(--meetup)"></i>Meetup</span>
      <span><i style="background:var(--popup)"></i>Pop-up</span>
    </div>

    <div class="detail-h">
      <div class="detail-t" id="detailTitle">Upcoming</div>
      <div class="detail-count" id="detailCount"></div>
    </div>
    <div id="detail"></div>
  </main>

  <script>
  (function eventsPage() {
    if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('is-embed');

    var TYPE = { market: 'var(--market)', fair: 'var(--fair)', meetup: 'var(--meetup)', popup: 'var(--popup)' };
    var TYPEN = { market: 'Market', fair: 'Fair', meetup: 'Meetup', popup: 'Pop-up' };
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    var base = new Date(); base.setHours(0,0,0,0);
    function iso(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function shift(days) { var x = new Date(base); x.setDate(x.getDate()+days); return iso(x); }

    var readJSON = function (k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };
    // Curated PHYSICAL events — markets, fairs and meetups (not personal seller
    // posts). Dates are relative to today so past and upcoming months are populated.
    var EVENTS = [
      { id: 'e1', title: 'Vintage Flea Market', date: shift(-40), type: 'market', time: '10:00–18:00', place: 'Dizengoff Sq, Tel Aviv' },
      { id: 'e2', title: 'Makers Meetup',       date: shift(-19), type: 'meetup', time: '19:00',       place: 'Jaffa Port' },
      { id: 'e3', title: 'Sunday Craft Fair',   date: shift(-5),  type: 'fair',   time: '09:00–15:00', place: 'Sarona Market' },
      { id: 'e4', title: 'Rooftop Pop-up',      date: shift(3),   type: 'popup',  time: '17:00–22:00', place: 'Florentin' },
      { id: 'e5', title: 'Winter Design Market',date: shift(8),   type: 'market', time: '10:00–20:00', place: 'Habima Sq' },
      { id: 'e6', title: 'Designers Meetup',    date: shift(15),  type: 'meetup', time: '18:30',       place: 'Herzliya Marina' },
      { id: 'e7', title: 'Artisans Fair',       date: shift(26),  type: 'fair',   time: '10:00–17:00', place: 'Ramat Gan Park' },
      { id: 'e8', title: 'Vintage Flea Market', date: shift(40),  type: 'market', time: '10:00–18:00', place: 'Dizengoff Sq, Tel Aviv' }
    ];
    var CURATED = EVENTS;
    // Community-hosted events (created via "Host an event"), persisted locally.
    var userEvents = readJSON('vero_events', []);
    if (!Array.isArray(userEvents)) userEvents = [];
    var byDate = {};
    function rebuild() {
      EVENTS = CURATED.concat(userEvents);
      byDate = {};
      EVENTS.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    }
    function saveUser() { try { localStorage.setItem('vero_events', JSON.stringify(userEvents)); } catch (e) {} }
    rebuild();
    function eventById(id) { for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i]; return null; }

    // The seller's booth reservations: { eventId: { products: [names] } }.
    var BKEY = 'vero_event_booths';
    var booths = readJSON(BKEY, {}); if (!booths || typeof booths !== 'object') booths = {};
    function saveBooths() { try { localStorage.setItem(BKEY, JSON.stringify(booths)); } catch (e) {} }

    // The seller's own products (to choose which to bring to an event).
    var listings = readJSON('vero_listings', []);
    if (!Array.isArray(listings) || !listings.length) {
      listings = [
        { title: 'Oversized coat' }, { title: 'Evening dress' }, { title: 'Leather jacket' },
        { title: 'Pleated skirt' }, { title: 'Cashmere sweater' }, { title: 'Suede boots' }
      ];
    }
    var productNames = listings.map(function (p) { return p.title || p.name || 'Item'; }).filter(Boolean);

    // What a seller sells — a mixed market has several of these side by side.
    var CATEGORIES = ['Fashion boutique', 'Clothing', 'Vintage', 'Accessories', 'Footwear', 'Art & home'];
    // Demo sellers whose booths appear publicly on each event (so buyers see who's coming).
    var SELLERS = [
      { name: 'Studio Noir',  cat: 'Fashion boutique' },
      { name: 'Vintage Vault', cat: 'Vintage' },
      { name: 'Knit & Co',    cat: 'Clothing' },
      { name: 'Sole Society',  cat: 'Footwear' },
      { name: 'Atelier V',    cat: 'Fashion boutique' },
      { name: 'Bloom & Co',   cat: 'Accessories' },
      { name: 'Canvas Home',   cat: 'Art & home' }
    ];
    function hashStr(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    var myShop = readJSON('vero_store_config', {}) || {};
    var myShopName = myShop.name || 'Your shop';
    function attendeesFor(e) {
      var h = hashStr(e.id || e.title), n = 2 + (h % 3), out = [];
      for (var i = 0; i < n; i++) out.push(SELLERS[(h + i * 3) % SELLERS.length]);
      var b = booths[e.id];
      if (b) out.unshift({ name: myShopName, cat: b.category || 'Fashion boutique', you: true, items: (b.products || []).length });
      return out;
    }

    var isSeller = false;
    try { isSeller = localStorage.getItem('vero_active_account') === 'seller'; } catch (e) {}
    if (/[?&]seller=1/.test(location.search)) isSeller = true;

    var view = new Date(base.getFullYear(), base.getMonth(), 1);
    var selected = null;
    // Deep link from the storefront: ?date=YYYY-MM-DD selects that day + month.
    var qd = (location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/) || [])[1];
    if (qd) { selected = qd; view = new Date(+qd.slice(0,4), +qd.slice(5,7)-1, 1); }

    var grid = document.getElementById('calGrid');
    var monthEl = document.getElementById('calMonth');
    var detail = document.getElementById('detail');
    var detailTitle = document.getElementById('detailTitle');
    var detailCount = document.getElementById('detailCount');

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    function dot(t) { return '<i style="background:' + (TYPE[t] || 'var(--muted)') + '"></i>'; }

    function renderCal() {
      var y = view.getFullYear(), m = view.getMonth();
      monthEl.textContent = MONF[m] + ' ' + y;
      var first = new Date(y, m, 1).getDay();
      var days = new Date(y, m + 1, 0).getDate();
      var todayIso = iso(base);
      var html = '';
      for (var b = 0; b < first; b++) html += '<div class="cal-cell blank"></div>';
      for (var d = 1; d <= days; d++) {
        var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var evs = byDate[ds] || [];
        var cls = 'cal-cell';
        if (evs.length) cls += ' has';
        if (ds === todayIso) cls += ' today';
        if (ds === selected) cls += ' sel';
        if (isSeller && evs.some(function(e){ return booths[e.id]; })) cls += ' booth-day';
        var dots = evs.length ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return dot(e.type); }).join('') + '</div>' : '<div class="dots"></div>';
        html += '<div class="' + cls + '" data-d="' + ds + '"><span>' + d + '</span>' + dots + '</div>';
      }
      grid.innerHTML = html;
    }

    function evRow(e, isPast) {
      var parts = e.date.split('-'), dd = +parts[2], mm = +parts[1]-1;
      var meta = '<span class="ev-type">' + dot(e.type) + (TYPEN[e.type] || e.type) + '</span>';
      if (e.place) meta += '<span>· ' + esc(e.place) + '</span>';
      if (e.own) meta += '<span>· Hosted by you</span>';
      var booth = booths[e.id];
      // Seller: a + to book a booth, or a "booked" badge that re-opens the panel.
      var join = '';
      if (isSeller && !isPast) {
        var plusBtn = booth
          ? '<span class="ev-booked"><span class="chk"></span>Booth · ' + (booth.products ? booth.products.length : 0) + ' items</span>' +
              '<button class="ev-plus" data-booth="' + e.id + '" aria-label="Edit booth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
          : '<button class="ev-plus" data-booth="' + e.id + '" aria-label="Book a booth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
        var delBtn = e.own ? '<button class="ev-plus" data-delevent="' + e.id + '" aria-label="Cancel event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' : '';
        join = '<div class="ev-join">' + plusBtn + delBtn + '</div>';
      }
      var panel = isSeller ? boothPanel(e) : '';
      // Public attendee list: which sellers have a booth (clickable → storefront).
      var att = attendeesFor(e);
      var sellers = att.slice(0, 6).map(function (s) {
        return '<a class="seller' + (s.you ? ' you' : '') + '" href="buyer-profile.html"><b>' + esc(s.you ? 'You' : s.name) + '</b></a>';
      }).join('') + (att.length > 6 ? '<span class="ev-more">+' + (att.length - 6) + '</span>' : '');
      var attend = '<div class="ev-attend"><div class="ev-attend-h">' + att.length + ' sellers attending</div><div class="ev-sellers">' + sellers + '</div></div>';
      return '<div class="ev' + (isPast ? ' past' : '') + '" data-ev="' + e.id + '">' +
        '<div class="ev-date"><div class="ev-day">' + dd + '</div><div class="ev-mon">' + MON[mm] + '</div></div>' +
        '<div><div class="ev-title">' + esc(e.title) + '</div><div class="ev-meta">' + meta + '</div></div>' +
        '<div class="ev-time">' + esc(e.time) + join + '</div>' +
        attend +
        panel +
      '</div>';
    }

    function boothPanel(e) {
      var booth = booths[e.id], sel = (booth && booth.products) || [];
      var chips = productNames.length
        ? '<div class="chips">' + productNames.map(function (n) {
            var on = sel.indexOf(n) > -1;
            return '<button class="chip' + (on ? ' on' : '') + '" data-prod="' + esc(n) + '"><span class="cdot"></span>' + esc(n) + '</button>';
          }).join('') + '</div>'
        : '<div class="booth-empty">No products yet — add items to your shop first.</div>';
      return '<div class="booth" data-panel="' + e.id + '"><div class="booth-inner">' +
        '<div class="booth-t">Your booth · ' + esc(e.title) + '</div>' +
        '<div class="booth-lede">Pick the pieces you\'ll bring to sell at this event.</div>' +
        chips +
        '<div class="booth-actions">' +
          (booth ? '<button class="bbtn remove" data-remove="' + e.id + '">Remove booth</button>' : '') +
          '<div class="spacer"></div>' +
          '<button class="bbtn save" data-save="' + e.id + '">' + (booth ? 'Update booth' : 'Reserve booth') + '</button>' +
        '</div>' +
      '</div></div>';
    }

    function renderDetail() {
      var todayIso = iso(base);
      if (selected) {
        var evs = (byDate[selected] || []).slice().sort(function(a,b){ return a.time < b.time ? -1 : 1; });
        var pt = selected.split('-');
        detailTitle.textContent = MONF[+pt[1]-1] + ' ' + (+pt[2]);
        detailCount.textContent = evs.length + (evs.length === 1 ? ' event' : ' events');
        detail.innerHTML = evs.length ? evs.map(function(e){ return evRow(e, selected < todayIso); }).join('') : '<div class="ev-empty">No events on this day.</div>';
        return;
      }
      // No selection: show this month's events (upcoming first, then past this month).
      var y = view.getFullYear(), m = view.getMonth();
      var monthEvs = EVENTS.filter(function(e){ var p = e.date.split('-'); return +p[0] === y && (+p[1]-1) === m; })
        .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time < b.time ? -1 : 1); });
      var isCurrentMonth = (y === base.getFullYear() && m === base.getMonth());
      detailTitle.textContent = isCurrentMonth ? 'Upcoming' : (MONF[m] + ' events');
      detailCount.textContent = monthEvs.length + (monthEvs.length === 1 ? ' event' : ' events');
      if (isCurrentMonth) {
        var up = monthEvs.filter(function(e){ return e.date >= todayIso; });
        var past = monthEvs.filter(function(e){ return e.date < todayIso; });
        monthEvs = up.concat(past);
      }
      detail.innerHTML = monthEvs.length
        ? monthEvs.map(function(e){ return evRow(e, e.date < todayIso); }).join('')
        : '<div class="ev-empty">No events this month.</div>';
    }

    // ---- Featured slider: 4 upcoming events per page, crossfading. ----
    var slGrid = document.getElementById('evsGrid');
    var slDetail = document.getElementById('evsDetail');
    var slViewport = document.getElementById('evsViewport');
    var slTrack = document.getElementById('evsTrack');
    var slDots = document.getElementById('evsDots');
    var slCount = document.getElementById('evsCount');
    var slWrap = document.getElementById('evsSlider');
    var slPages = [], slPage = 0, slTimer = null, slItems = [], slOpen = null;
    function slSetH(el) { slViewport.style.height = Math.max(el.scrollHeight, Math.round(window.innerHeight * 0.75)) + 'px'; }

    function slTile(e, idx) {
      var parts = e.date.split('-'), dd = +parts[2], mm = +parts[1] - 1;
      var where = e.place ? (' · ' + esc(e.place.split(',')[0])) : '';
      return '<button type="button" class="evs-tile" data-idx="' + idx + '">' +
        '<div class="evs-day">' + dd + '</div>' +
        '<div class="evs-mon">' + MON[mm] + '</div>' +
      '</button>';
    }

    // The full-info panel that slides open under the grid.
    function slDetailHTML(e) {
      var parts = e.date.split('-'), dd = +parts[2], mm = +parts[1] - 1;
      var att = attendeesFor(e);
      return '<div class="evs-detail-inner">' +
        '<button type="button" class="evs-detail-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
        '<div class="evs-detail-date"><span class="evs-detail-d">' + dd + '</span><span class="evs-detail-m">' + MONF[mm] + ' ' + parts[0] + '</span></div>' +
        '<div class="evs-detail-name">' + esc(e.title) + '</div>' +
        '<div class="evs-detail-meta">' +
          '<span class="evs-type">' + dot(e.type) + (TYPEN[e.type] || e.type) + '</span>' +
          (e.time ? '<span>' + esc(e.time) + '</span>' : '') +
          (e.place ? '<span>' + esc(e.place) + '</span>' : '') +
          '<span>' + att.length + ' sellers attending</span>' +
        '</div>' +
        '<button type="button" class="evs-detail-cta" data-open="' + e.date + '">View on calendar &#8594;</button>' +
      '</div>';
    }

    var slDTimer = null;
    function slRenderDots() {
      slDots.innerHTML = (slOpen == null)
        ? slPages.map(function (_, i) { return '<i class="' + (i === slPage ? 'on' : '') + '" data-p="' + i + '"></i>'; }).join('')
        : slItems.map(function (_, i) { return '<i class="' + (i === slOpen ? 'on' : '') + '" data-e="' + i + '"></i>'; }).join('');
    }
    // Swap the open detail to another event, sliding the content across.
    function slSetDetail(idx, animate) {
      slOpen = (idx + slItems.length) % slItems.length;
      function swap() {
        slDetail.innerHTML = slDetailHTML(slItems[slOpen]);
        slSetH(slDetail); slRenderDots();
        if (animate) { var ni = slDetail.querySelector('.evs-detail-inner'); ni.classList.add('d-in'); void ni.offsetWidth; ni.classList.remove('d-in'); }
      }
      var old = animate && slDetail.querySelector('.evs-detail-inner');
      if (old) { old.classList.add('d-out'); setTimeout(swap, 320); } else { swap(); }
    }
    function slDStart() { if (slDTimer) clearInterval(slDTimer); if (slItems.length > 1) slDTimer = setInterval(function () { slSetDetail(slOpen + 1, true); }, 4200); }
    function slDStop() { if (slDTimer) { clearInterval(slDTimer); slDTimer = null; } }

    function slCloseDetail() {
      slDStop(); slOpen = null;
      slTrack.classList.remove('show-detail');   // dates slide back in from the right
      slRenderDots(); slSetH(slGrid);
      slStart();
    }
    function slOpenDetail(idx) {
      if (slTimer) { clearInterval(slTimer); slTimer = null; }   // pause the grid autoplay
      slSetDetail(idx, false);
      slTrack.classList.add('show-detail');       // dates slide out right, detail slides in
      slDStart();                                  // the detail now auto-cycles through every event
    }

    function slShow(i, instant) {
      if (!slPages.length) return;
      if (slOpen != null) slCloseDetail();
      slPage = (i + slPages.length) % slPages.length;
      function paint() {
        var base0 = slPage * 4;
        slGrid.innerHTML = slPages[slPage].map(function (e, k) { return slTile(e, base0 + k); }).join('');
        slGrid.classList.toggle('single', slPages[slPage].length === 1);
        slRenderDots();
        slGrid.classList.remove('fade');
        if (slOpen == null) slSetH(slGrid);
      }
      if (instant) { paint(); return; }
      slGrid.classList.add('fade');          // fade out
      setTimeout(paint, 550);                 // swap, then fade in
    }

    function slStart() {
      if (slTimer) clearInterval(slTimer);
      if (slOpen == null && slPages.length > 1) slTimer = setInterval(function () { slShow(slPage + 1); }, 4200);
    }

    function renderSlider() {
      var todayIso = iso(base);
      slItems = EVENTS.filter(function (e) { return e.date >= todayIso; })
        .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time < b.time ? -1 : 1); });
      if (!slItems.length) { slWrap.style.display = 'none'; if (slTimer) clearInterval(slTimer); return; }
      slWrap.style.display = 'block';
      slPages = [];
      for (var i = 0; i < slItems.length; i += 4) slPages.push(slItems.slice(i, i + 4));
      slCount.textContent = slItems.length + (slItems.length === 1 ? ' event' : ' events');
      if (slPage >= slPages.length) slPage = 0;
      slDStop(); slOpen = null; slTrack.classList.remove('show-detail');
      slShow(slPage, true);
      slStart();
      requestAnimationFrame(function () { if (slOpen == null) slSetH(slGrid); });
    }

    // Tap a tile → the dates slide out right and that date's full info slides in.
    slGrid.addEventListener('click', function (e) {
      var t = e.target.closest('.evs-tile'); if (!t) return;
      slOpenDetail(+t.getAttribute('data-idx'));
    });
    slDetail.addEventListener('click', function (e) {
      if (e.target.closest('.evs-detail-x')) { slCloseDetail(); return; }
      var cta = e.target.closest('[data-open]');
      if (cta) {
        var ds = cta.getAttribute('data-open');
        view = new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, 1);
        selected = ds; refresh();
        var nav = document.querySelector('.cal-nav');
        if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    slDots.addEventListener('click', function (e) {
      var g = e.target.closest('[data-p]'), d = e.target.closest('[data-e]');
      if (g) { slShow(+g.getAttribute('data-p')); slStart(); }
      else if (d) { slDStop(); slSetDetail(+d.getAttribute('data-e'), true); slDStart(); }
    });

    function refresh() { renderCal(); renderDetail(); renderSlider(); }

    grid.addEventListener('click', function (e) {
      var cell = e.target.closest('.cal-cell.has'); if (!cell) return;
      var ds = cell.getAttribute('data-d');
      selected = (selected === ds) ? null : ds;
      refresh();
    });
    document.getElementById('prev').addEventListener('click', function () { view.setMonth(view.getMonth()-1); selected = null; refresh(); });
    document.getElementById('next').addEventListener('click', function () { view.setMonth(view.getMonth()+1); selected = null; refresh(); });
    document.getElementById('todayBtn').addEventListener('click', function () { view = new Date(base.getFullYear(), base.getMonth(), 1); selected = null; refresh(); });

    // ---- Seller: host an event, book a booth, and pick which products to bring. ----
    if (isSeller) {
      // Host-an-event form.
      var addForm = document.getElementById('addForm');
      var fTitle = document.getElementById('fTitle'), fDate = document.getElementById('fDate'),
          fTime = document.getElementById('fTime'), fType = document.getElementById('fType'),
          fPlace = document.getElementById('fPlace'), addToggle = document.getElementById('addToggle');
      document.getElementById('sellerAdd').style.display = 'block';
      function openForm() { fDate.value = selected || iso(base); addForm.classList.add('open'); }
      function closeForm() { addForm.classList.remove('open'); }
      addToggle.addEventListener('click', function () { addForm.classList.contains('open') ? closeForm() : openForm(); });
      document.getElementById('fCancel').addEventListener('click', closeForm);
      document.getElementById('fSave').addEventListener('click', function () {
        var title = fTitle.value.trim(), date = fDate.value;
        if (!title || !date) { alert('Add a name and a date.'); return; }
        userEvents.push({ id: 'u' + Date.now(), title: title, date: date, type: fType.value,
          time: fTime.value.trim() || 'All day', place: fPlace.value.trim() || undefined, own: true });
        saveUser(); rebuild(); closeForm();
        fTitle.value = ''; fTime.value = ''; fPlace.value = '';
        view = new Date(+date.slice(0,4), +date.slice(5,7)-1, 1); selected = date; refresh();
      });

      // Booth booking + product picking, and cancelling your own hosted event.
      detail.addEventListener('click', function (e) {
        var plus = e.target.closest('[data-booth]');
        var chip = e.target.closest('.chip');
        var saveB = e.target.closest('[data-save]');
        var rem = e.target.closest('[data-remove]');
        var delEv = e.target.closest('[data-delevent]');
        if (delEv) {
          var eid = delEv.getAttribute('data-delevent');
          if (confirm('Cancel this event?')) {
            userEvents = userEvents.filter(function (u) { return u.id !== eid; });
            if (booths[eid]) { delete booths[eid]; saveBooths(); }
            saveUser(); rebuild(); refresh();
          }
        } else if (plus) {
          var panel = detail.querySelector('[data-panel="' + plus.getAttribute('data-booth') + '"]');
          if (panel) panel.classList.toggle('open');
        } else if (chip) {
          chip.classList.toggle('on');
        } else if (saveB) {
          var id = saveB.getAttribute('data-save');
          var panelEl = detail.querySelector('[data-panel="' + id + '"]');
          var chosen = panelEl ? Array.prototype.map.call(panelEl.querySelectorAll('.chips .chip.on'), function (c) { return c.getAttribute('data-prod'); }) : [];
          var ev = eventById(id) || {};
          booths[id] = { title: ev.title, date: ev.date, place: ev.place, type: ev.type, time: ev.time, products: chosen };
          saveBooths(); refresh();
        } else if (rem) {
          var rid = rem.getAttribute('data-remove');
          delete booths[rid]; saveBooths(); refresh();
        }
      });
    }

    refresh();
  })();
  </script>
</body>
</html>
