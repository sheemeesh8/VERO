<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promoted Slider Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; --ink: #111; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 470px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 611px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; font-family: 'Inter', sans-serif; padding-top: 30px; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.15); }
.money { font-variant-numeric: tabular-nums; }
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px; margin: 10px 0 14px; }
.sh b { font-family: 'Aharoni CLM', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.5px; }
.sh .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 3px; }
.sh span.see { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.rail { display: flex; gap: 13px; overflow: hidden; padding: 0 22px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #d6d2cb; } .dots i.on { width: 18px; border-radius: 6px; background: #111; }
.badge { position: absolute; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; z-index: 2; }
.heart { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; font-size: 13px; z-index: 2; color: #111; }

/* P1 baseline */
.p1 .c { width: 132px; flex: none; }
.p1 .c .th { aspect-ratio: 3/4; }
.p1 .c .l { display: flex; justify-content: space-between; font-size: 12px; margin-top: 7px; }
.p1 .c .s { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

/* P2 overlay price, peek */
.p2 .c { width: 160px; flex: none; position: relative; }
.p2 .c .th { aspect-ratio: 3/4; }
.p2 .c .tag { position: absolute; left: 0; bottom: 0; background: #fff; font-size: 12px; padding: 6px 11px; font-weight: 600; }
.p2 .c .nm { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-top: 7px; color: #444; }

/* P3 full-bleed hero carousel */
.p3 .hero { height: 330px; margin: 0 22px; position: relative; border-radius: 4px; overflow: hidden; color: #fff; }
.p3 .hero .th { position: absolute; inset: 0; }
.p3 .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,0.72)); }
.p3 .hero .in { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; }
.p3 .hero .nm { font-family: 'Bodoni Moda', serif; font-size: 26px; }
.p3 .hero .pr { font-size: 14px; margin-top: 2px; }
.p3 .hero .cta { display: inline-block; margin-top: 10px; background: #fff; color: #111; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 9px 16px; }

/* P4 big + two small */
.p4 .row { display: flex; gap: 12px; padding: 0 22px; }
.p4 .big { width: 190px; flex: none; position: relative; }
.p4 .big .th { height: 300px; }
.p4 .big .cap { position: absolute; left: 10px; bottom: 10px; color: #fff; z-index: 1; }
.p4 .big::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.6)); }
.p4 .big .nm { font-size: 15px; } .p4 .big .pr { font-size: 12px; }
.p4 .col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.p4 .col .s { display: flex; gap: 10px; align-items: center; }
.p4 .col .s .th { width: 54px; height: 66px; flex: none; }
.p4 .col .s b { font-weight: 400; font-size: 13px; display: block; } .p4 .col .s small { font-size: 12px; color: var(--muted); }

/* P5 numbered editorial */
.p5 .c { width: 200px; flex: none; position: relative; }
.p5 .c .num { font-family: 'Bodoni Moda', serif; font-size: 34px; position: absolute; left: 8px; top: 2px; color: #fff; z-index: 2; mix-blend-mode: difference; }
.p5 .c .th { height: 260px; }
.p5 .c .l { margin-top: 9px; } .p5 .c .nm { font-family: 'Bodoni Moda', serif; font-size: 17px; } .p5 .c .pr { font-size: 12px; color: var(--muted); }

/* P6 rounded card + price chip + heart */
.p6 .c { width: 150px; flex: none; position: relative; background: #f6f4f0; border-radius: 18px; padding: 8px; }
.p6 .c .th { aspect-ratio: 1/1; border-radius: 12px; }
.p6 .c .chip { position: absolute; left: 14px; bottom: 44px; background: #111; color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
.p6 .c .nm { font-size: 12px; padding: 8px 4px 2px; font-weight: 500; }

/* P7 portrait + seller avatar */
.p7 .c { width: 150px; flex: none; }
.p7 .c .th { aspect-ratio: 3/4; border-radius: 12px; }
.p7 .c .seller { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
.p7 .c .av { width: 24px; height: 24px; border-radius: 50%; } .p7 .c .seller small { font-size: 11px; color: #333; }
.p7 .c .l { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; }

/* P8 promoted badge + CTA */
.p8 .c { width: 230px; flex: none; position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; }
.p8 .c .th { width: 110px; flex: none; }
.p8 .c .bd { padding: 12px; display: flex; flex-direction: column; }
.p8 .c .promo { align-self: flex-start; background: #111; color: #fff; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; }
.p8 .c .nm { font-size: 15px; margin-top: 8px; } .p8 .c .s { font-size: 11px; color: var(--muted); }
.p8 .c .pr { font-size: 16px; margin-top: auto; }
.p8 .c .cta { background: #111; color: #fff; text-align: center; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 9px; border-radius: 8px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Promoted — סליידר מוצרים מקודמים</h1>
<p class="sub">8 עיצובים לסליידר · כל כרטיס עם צורה, מידע ותגית אחרת</p>

<div class="grid" id="opts"></div>

<script>
var IM = [
  { img: '../men-hero.jpg', pos: '50% 30%' }, { img: '../women-hero.jpg', pos: '30% 35%' },
  { img: '../clothing-hero.jpg', pos: '50% 50%' }, { img: '../hero-beach.jpg', pos: '50% 45%' },
  { img: '../gallery-hero.jpg', pos: '50% 50%' }, { img: '../magazine-hero.jpg', pos: '50% 50%' }
];
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var P = [['Wool Overcoat', 380, 'Atelier Nord', IM[0]], ['Linen Shirt', 120, 'Studio Vero', IM[1]], ['Leather Bag', 240, 'Milano Feet', IM[2]], ['Silk Scarf', 90, 'Denim Lab', IM[3]], ['Denim Jacket', 210, 'Denim Lab', IM[4]]];
var m = v => '₪' + v;
var head = (k, t) => '<div class="sh"><b>' + (k ? '<span class="k">' + k + '</span>' : '') + t + '</b><span class="see">See all</span></div>';

var OPTS = [
  ['P1 · הקיים', 'כרטיסים בשורה, תמונה 3:4, שם ומחיר מתחת. לנקודת השוואה.',
   '<div class="screen p1">' + head('', 'Promoted') + '<div class="rail">' + P.map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="l"><span>' + c[0] + '</span><span class="money">' + m(c[1]) + '</span></div><div class="s">' + c[2] + '</div></div>').join('') + '</div></div>'],

  ['P2 · מחיר על התמונה', 'כרטיסים גדולים יותר עם הצצה לבא, מחיר כתווית לבנה בפינה והשם מתחת. נקי וויזואלי.',
   '<div class="screen p2">' + head('', 'Promoted') + '<div class="rail">' + P.map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '><span class="tag money">' + m(c[1]) + '</span></span><div class="nm">' + c[0] + '</div></div>').join('') + '</div></div>'],

  ['P3 · קרוסלת הירו', 'פריט מקודם אחד גדול בכל סלייד עם כותרת, מחיר וכפתור. מחליקים, ונקודות למטה. הכי בולט.',
   '<div class="screen p3">' + head('Promoted', 'Featured') + '<div class="hero"><span class="th" ' + bg(IM[1]) + '></span><div class="in"><div class="nm">Wool Overcoat</div><div class="pr money">₪380 · Atelier Nord</div><span class="cta">Shop now</span></div></div><div class="dots"><i class="on"></i><i></i><i></i><i></i></div></div>'],

  ['P4 · גדול + קטנים', 'פריט מוביל גדול משמאל, ושניים קטנים לצדו. נותן היררכיה בין המקודמים.',
   '<div class="screen p4">' + head('', 'Promoted') + '<div class="row"><div class="big"><span class="th" ' + bg(IM[0]) + '></span><div class="cap"><div class="nm">Wool Overcoat</div><div class="pr money">₪380</div></div></div>' +
   '<div class="col">' + P.slice(1, 4).map(c => '<div class="s"><span class="th" ' + bg(c[3]) + '></span><div><b>' + c[0] + '</b><small class="money">' + m(c[1]) + '</small></div></div>').join('') + '</div></div></div>'],

  ['P5 · ממוספר עריכתי', 'מספרים גדולים (01, 02…) ותמונות גדולות עם שם בסריף. מרגיש כמו רשימת "בחירות העורך".',
   '<div class="screen p5">' + head('The edit', 'Promoted') + '<div class="rail">' + P.map((c, k) => '<div class="c"><span class="num">0' + (k + 1) + '</span><span class="th" ' + bg(c[3]) + '></span><div class="l"><div class="nm">' + c[0] + '</div><div class="pr money">' + m(c[1]) + '</div></div></div>').join('') + '</div></div>'],

  ['P6 · כרטיס רך + צ׳יפ מחיר', 'כרטיס מעוגל עם רקע בהיר, מחיר כצ׳יפ שחור ולב. ידידותי וצעיר.',
   '<div class="screen p6">' + head('', 'Promoted') + '<div class="rail">' + P.map(c => '<div class="c"><span class="heart">♡</span><span class="th" ' + bg(c[3]) + '></span><span class="chip money">' + m(c[1]) + '</span><div class="nm">' + c[0] + '</div></div>').join('') + '</div></div>'],

  ['P7 · עם המוכר', 'כל כרטיס מראה גם אווטאר ושם המוכר. טוב כשרוצים לקדם מוכרים לצד מוצרים.',
   '<div class="screen p7">' + head('', 'Promoted') + '<div class="rail">' + P.map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="seller"><span class="av th" ' + bg(c[3]) + '></span><small>' + c[2] + '</small></div><div class="l"><span>' + c[0] + '</span><span class="money">' + m(c[1]) + '</span></div></div>').join('') + '</div></div>'],

  ['P8 · תגית "Promoted" + CTA', 'כרטיס רחב אופקי עם תווית Promoted, פרטים וכפתור קנייה. הכי "פרסומת", מדגיש שזה מקודם.',
   '<div class="screen p8">' + head('', 'Promoted') + '<div class="rail">' + P.slice(0, 3).map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="bd"><span class="promo">Promoted</span><div class="nm">' + c[0] + '</div><div class="s">' + c[2] + '</div><div class="pr money">' + m(c[1]) + '</div><div class="cta">Shop</div></div></div>').join('') + '</div></div>']
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
