<title>VERO — Intro</title>

<!--
  ===========================================================================
  VERO  ·  Cinematic Peacock Splash  (single self-contained file)
  ---------------------------------------------------------------------------
  A luminous white heraldic peacock is revealed out of near-black by a soft
  moving light, breathes and sways as a living bird, then dissolves: the
  background lifts to pure white while the bird flattens from a shaded,
  iridescent-tailed silhouette into the crisp, solid-black VERO logo.

  STACK  Vanilla JS + inline SVG + GSAP. Path morphing uses GSAP MorphSVG when
  present, otherwise Flubber (free). No build step — just open the file.

  TIMELINE (~6.2s, then holds)
    0.0-2.6s  Entrance  dark forest vignette; a soft light + glossy sheen rake
                        the plumage; slow L->R tracking parallax; the fuller
                        "entrance" outline eases into the settled pose.
    2.6-4.0s  Alive     the bird settles and keeps breathing, its tail gently
                        swaying and a highlight drifting over the plumage.
    4.0-5.6s  Morph     bg dark->white; shading + iridescence + glow flatten;
              +reveal    plumage white->black; a soft sweep resolves the flat
                        detailed logo (eye-spots + feathering).
    5.6s+     Lock       perfectly centred static black logo on pure white.

  INTEGRATION
    - Dispatches a "vero:intro-complete" CustomEvent on `document` when done.
    - Also calls window.VeroIntro.onComplete() and posts the same message to a
      host window (used by phone-frame.html to dismiss the overlay).
    - prefers-reduced-motion -> skips straight to the locked logo.

  The silhouette layers were vectorised from the real VERO peacock logo so the
  pose matches exactly:
    ENTRANCE_PATH  fuller outer silhouette (entrance)      POSE_PATH  settled
    BODY_PATH      body + neck + head + crest + legs        TAIL_PATH  tail fan
    LOGO_PATH      detailed flat logo (eye-spots, evenodd)
  ===========================================================================
-->

  html, body { margin:0; height:100%; background:var(--bg-dark); overflow:hidden; }
  #vero-splash { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg-dark); }
  #vero-splash svg { width:min(88vmin,680px); height:min(88vmin,680px); display:block; }
  @media (prefers-reduced-motion: reduce) { html, body, #vero-splash { background:var(--paper); } }
</style>

    // Plumage white -> black.
    tl.to(darkP, { opacity:1, duration:1.0, ease:"power2.inOut" }, 4.2);
    tl.to([body, tail], { opacity:0, duration:0.9, ease:"power2.inOut" }, 4.5);

    // Resolve the detailed logo with a soft left->right sweep (reads as a morph,
    // not a crossfade): the flat vector "wipes" into place, eye-spots and all.
    tl.set(logoP, { opacity:1 }, 4.7);
    tl.fromTo(wipeRect, { attr:{ width:0 } }, { attr:{ width:800 }, duration:1.0, ease:"power2.inOut" }, 4.7);
    tl.to(darkP, { opacity:0, duration:0.5, ease:"power2.inOut" }, 5.3);

    /* 5.6s+ LOCK */
    tl.to({}, { duration:0.6 }, 5.6);
  })();
  </script>
</body>
