<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== DATA SECTION ==================== */
        .data-section {
            background: white;
            padding: 40px 0 70px;
            min-height: 600px;
        }

        /* ==================== SLIDER (mirrors the feed promo slider) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 20px 0 0 0;
            padding: 20px 0 0 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            padding: 20px 40px 40px 40px;
        }

        /* The "image" area now holds a chart, no background box */
        .promo-image {
            width: 100%;
            height: 600px;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            overflow: hidden;
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 44px;
            font-weight: 800;
            text-transform: none;
            line-height: 1.15;
            letter-spacing: 0.3px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 21px;
            line-height: 1.6;
            color: #444;
            max-width: 560px;
            margin: 0;
        }

        .promo-stat {
            font-size: 17px;
            font-weight: 700;
            color: #004225;
            background: #e8f0eb;
            padding: 10px 20px;
            border-radius: 24px;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #004225;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #004225;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        /* ==================== CHARTS ==================== */
        /* Monthly spending: vertical bars */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 12px;
        }

        .bar-value {
            font-size: 16px;
            font-weight: 700;
            color: #004225;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            max-width: 72px;
            background: linear-gradient(180deg, #0a6b3f 0%, #004225 100%);
            border-radius: 8px 8px 0 0;
            min-height: 4px;
        }

        .bar-label {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        /* ==================== COLLECTIONS ==================== */
        .collections {
            display: flex;
            gap: 48px;
            margin-top: 70px;
            align-items: flex-start;
        }

        .collection {
            flex: 1;
            min-width: 0;
        }

        .collection-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
            padding-bottom: 16px;
            border-bottom: 2px solid #004225;
        }

        .col-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #004225;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .col-title {
            font-size: 24px;
            font-weight: 700;
            color: #004225;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .mini-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            font-size: 15px;
            padding: 40px 0;
        }

        /* Product cards — identical form & size to the storefront feed */
        .product-card {
            background: #efece4;
            border: none;
            border-radius: 2px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.13);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #efece4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            color: rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
            padding: 0;
            transition: background 0.4s ease;
        }

        .product-card:hover .product-image {
            background: #e9e5db;
        }

        /* Bottom info bar: price on the left, meta on the right */
        .product-info {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            position: relative;
            background: #efece4;
        }

        .pc-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-start;
        }

        .pc-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            gap: 3px;
        }

        .product-price {
            font-size: 30px;
            color: #111;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1;
        }

        .product-seller {
            font-size: 15px;
            color: #111;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 12px;
            font-weight: 400;
            color: #8a8a8a;
            letter-spacing: 0.2px;
            line-height: 1.2;
            margin: 0;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-rating {
            font-size: 11px;
            color: #111;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .collections {
                flex-direction: column;
                gap: 40px;
            }

            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .promo-title { font-size: 30px; }
            .promo-desc { font-size: 17px; }
            .promo-image { height: 480px; }
        }

        @media (max-width: 768px) {
            .header-left { display: none; }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">הנתונים שלי</h1>
            <p class="hero-subtitle">מבט על הרגלי הקנייה, הסגנונות והחברות האהובים עליך</p>
        </div>
    </div>

    <!-- ==================== DATA IMAGE ==================== -->
    <div class="data-section">
        <div class="container">
            <div class="promo-slider">
                <div class="promo-viewport">
                    <div class="promo-image" id="dataImage"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ==================== DATA ====================
        // Monthly spending in ₪ (index 0 = January); rendered up to the current month.
        const monthlySpending = [320, 180, 540, 260, 610, 430, 290, 380, 450, 500, 340, 410];
        const monthNames = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

        // ==================== CHART BUILDERS ====================
        // Generic vertical bar chart; bars is [{ value, display, label }], heights scaled to the max.
        function barChartHTML(bars) {
            const max = Math.max(...bars.map(b => b.value));
            return `<div class="bar-chart">` + bars.map(b => {
                const height = max > 0 ? (b.value / max) * 100 : 0;
                return `
                    <div class="bar-col">
                        <div class="bar-value">${b.display}</div>
                        <div class="bar" style="height: ${height}%"></div>
                        <div class="bar-label">${b.label}</div>
                    </div>`;
            }).join('') + `</div>`;
        }

        function spendChartHTML() {
            const currentMonth = new Date().getMonth(); // up to "today"
            const data = monthlySpending.slice(0, currentMonth + 1);
            return barChartHTML(data.map((value, i) => ({
                value,
                display: `₪${value.toLocaleString()}`,
                label: monthNames[i]
            })));
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize — render only the main data image (the monthly spending chart).
        document.getElementById('dataImage').innerHTML = spendChartHTML();
    </script>
</body>
</html>
