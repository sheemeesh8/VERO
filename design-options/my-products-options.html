<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Products Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #16150f; --muted: #8f8d86; --faint: #b6b3ab; --line: #e6e4de; --paper: #f1efed; --navy: #161a2b; --red: #c23a2e; --ok: #1f8f4e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; }
svg.i { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.3; fill: none; flex: none; stroke-linecap: round; stroke-linejoin: round; }
.serif { font-family: 'Bodoni Moda', serif; }

.hd { display: flex; align-items: center; justify-content: space-between; padding: 44px 22px 16px; border-bottom: 1px solid var(--line); }
.hd b { font-size: 24px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.hd .r { display: flex; gap: 14px; align-items: center; }
.sec { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 16px 12px; border-bottom: 1px solid var(--ink); margin: 0 0 14px; }
.sec b { font-weight: 400; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; } .sec small { color: var(--muted); font-size: 11px; }
.pad { padding: 0 16px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; height: 50px; }
.cta.dk { background: #1c1c1c; color: #fff; }
.cta.ln { border: 1.4px solid var(--ink); }
.cnt { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 10px; display: grid; place-items: center; letter-spacing: 0; }
.nav { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 64px; border-radius: 999px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
.nav span.on { background: #fff; color: var(--red); border-radius: 999px; padding: 18px 22px; font-size: 11px; letter-spacing: 2px; }

/* listing card (current style) */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: var(--paper); position: relative; height: 260px; padding: 14px; }
.badge { display: inline-block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 999px; padding: 5px 12px; background: #fff; }
.badge.sold { background: var(--ink); color: #fff; }
.pen { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.pen svg { width: 16px; height: 16px; }
.emo { font-size: 74px; text-align: center; margin-top: 4px; line-height: 1.2; }
.coll { position: absolute; right: 12px; top: 150px; border: 1px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 10px; font-weight: 700; background: none; }
.meta { position: absolute; left: 14px; right: 14px; bottom: 12px; }
.meta .t { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--faint); padding-bottom: 2px; }
.meta .t b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 15px; letter-spacing: 0.5px; } .meta .t span { font-weight: 700; font-size: 12px; }
.meta .n { font-size: 11.5px; letter-spacing: 1px; margin-top: 3px; }

/* M2 list rows */
.row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.row .th { width: 64px; height: 76px; background: var(--paper); display: grid; place-items: center; font-size: 38px; flex: none; border-radius: 4px; }
.row .bd { flex: 1; min-width: 0; } .row .bd b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 14px; display: block; }
.row .bd small { display: block; font-size: 12px; margin-top: 2px; } .row .bd .st { margin-top: 6px; font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ok); display: flex; align-items: center; gap: 5px; }
.row .bd .st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.row .pr { font-size: 15px; font-weight: 700; } .row .more { color: var(--muted); font-size: 20px; letter-spacing: 1px; margin-left: 6px; }
.plus { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.chip { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; display: inline-flex; gap: 6px; align-items: center; }

/* M3 stats + tabs */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 18px 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats div { text-align: center; padding: 14px 0; } .stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-size: 22px; font-weight: 400; } .stats small { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 24px; padding: 0 16px; border-bottom: 1px solid var(--line); margin: 16px 0 16px; }
.tabs span { padding: 12px 0; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); position: relative; }
.tabs span.on { color: var(--ink); } .tabs span.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }

/* M4 segmented + FAB */
.seg { display: flex; background: var(--paper); border-radius: 999px; padding: 4px; margin: 18px 16px 16px; }
.seg span { flex: 1; text-align: center; padding: 11px 0; border-radius: 999px; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.seg span.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.fab { position: absolute; right: 22px; bottom: 104px; height: 56px; padding: 0 22px; border-radius: 999px; background: #1c1c1c; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }

/* M5 wide cards with action row */
.wcard { margin: 0 16px 16px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.wcard .top { display: flex; gap: 14px; padding: 14px; }
.wcard .th { width: 90px; height: 110px; background: var(--paper); border-radius: 10px; display: grid; place-items: center; font-size: 54px; flex: none; }
.wcard .bd b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 17px; display: block; margin-top: 8px; }
.wcard .bd small { display: block; font-size: 13px; margin-top: 2px; } .wcard .bd .p { font-size: 18px; font-weight: 700; margin-top: 10px; }
.wcard .acts { display: flex; border-top: 1px solid var(--line); }
.wcard .acts span { flex: 1; text-align: center; padding: 12px 0; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #444; }
.wcard .acts span + span { border-left: 1px solid var(--line); }

/* M6 tight 3-col grid */
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.g3 div { aspect-ratio: 3/4; background: var(--paper); display: grid; place-items: center; font-size: 44px; position: relative; }
.g3 div i { position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.g3 div small { position: absolute; left: 8px; bottom: 6px; font-size: 11px; font-weight: 700; }
.g3 div.add { background: #fff; border: 1.4px dashed var(--faint); color: var(--muted); font-size: 30px; }
.g3 div.dr { opacity: 0.45; } .g3 div.sd { filter: grayscale(1); opacity: 0.5; }
.g3 div.sd::after { content: 'SOLD'; position: absolute; font-size: 11px; letter-spacing: 3px; background: var(--ink); color: #fff; padding: 3px 8px; }
.big { padding: 30px 16px 4px; font-size: 40px; letter-spacing: 2px; text-transform: uppercase; }
.legend { display: flex; gap: 14px; padding: 6px 16px 14px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
.legend span.d::before { background: var(--faint); } .legend span.s::before { background: var(--ink); }

/* M7 stats rows */
.srow { display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.srow .th { width: 58px; height: 70px; background: var(--paper); display: grid; place-items: center; font-size: 34px; flex: none; }
.srow .bd { flex: 1; } .srow .bd .t { display: flex; justify-content: space-between; } .srow .bd b { font-weight: 400; font-size: 14px; }
.srow .bd .p { font-weight: 700; font-size: 14px; }
.ms { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: #555; }
.ms span { display: flex; align-items: center; gap: 4px; } .ms svg { width: 14px; height: 14px; stroke: var(--muted); }
.ms .hot { color: #d17a1c; }
.spark { width: 100%; height: 26px; margin-top: 6px; }

/* M8 upload tile in grid */
.cards .card.up { background: #fff; border: 1.4px dashed var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.cards .card.up .pc { width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 26px; }
.cards .card.up span { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }
.cards .card.up small { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.drline { display: flex; justify-content: space-between; align-items: center; margin: 16px 16px 0; padding: 14px 16px; background: var(--paper); border-radius: 12px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

/* M9 dark */
.c9 { background: #0f0f0e; color: #f2efe8; }
.c9 .hd { border-color: #262523; }
.c9 .cta.dk { background: #d9a441; color: #111; } .c9 .cta.ln { border-color: #3a3935; color: #f2efe8; } .c9 .cnt { background: #f2efe8; color: #111; }
.c9 .sec { border-color: #f2efe8; } .c9 .sec small { color: #8d8a83; }
.c9 .card { background: #1c1b19; } .c9 .badge { background: #0f0f0e; border-color: #3a3935; color: #f2efe8; }
.c9 .pen { background: #2a2926; color: #f2efe8; box-shadow: none; } .c9 .coll { border-color: #3a3935; color: #f2efe8; }
.c9 .meta .t { border-color: #3a3935; } .c9 .meta .t span { color: #d9a441; }
.c9 .nav { background: #1c1b19; border: 1px solid #2c2b28; } .c9 .nav span.on { color: #111; background: #d9a441; }
</style>
</head>
<body>
<h1>Products — אופציות</h1>
<p class="sub">9 עיצובים לדף המוצרים של המוכר: העלאה, טיוטות, המוצרים שלי, היסטוריה (נמכרו / הוסרו)</p>
<div class="grid" id="grid"></div>

<script>
var I = {
  chev: '<path d="M9 6l6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  bars: '<path d="M4 20h16M7 20V10M11 20V6M15 20v-8M19 20v-5"/>', trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  shop: '<path d="M4 10v10h16V10M3 6h18l-1 4H4z"/><path d="M10 20v-5h4v5"/>', chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/>', cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'
};
function ic(k) { return '<svg class="i" viewBox="0 0 24 24">' + I[k] + '</svg>'; }
var P = [
  { e: '🧥', b: 'STUDIO NOIR', n: 'Wool coat', p: 269, v: 128, l: 14, o: 2 },
  { e: '👖', b: 'STUDIO NOIR', n: 'Raw denim', p: 129, v: 64, l: 6, o: 1 },
  { e: '👜', b: 'STUDIO NOIR', n: 'Leather tote', p: 540, v: 41, l: 3, o: 0, sold: 1 }
];
function hd(r) { return '<div class="hd"><b>Products</b>' + (r || ic('chev')) + '</div>'; }
function nav() { return '<div class="nav">' + ic('bars') + ic('trend') + ic('shop') + '<span class="on">PRODUCTS</span>' + ic('chat') + '</div>'; }
function card(p) {
  return '<div class="card"><span class="badge' + (p.sold ? ' sold' : '') + '">' + (p.sold ? 'Sold' : 'Active') + '</span><span class="pen">' + ic('pen') + '</span><div class="emo">' + p.e + '</div>' +
    '<span class="coll">Collection +</span><div class="meta"><div class="t"><b>' + p.b + '</b><span>₪' + p.p + '</span></div><div class="n">' + p.n + '</div></div></div>';
}
var CTAS = '<div class="pad" style="padding-top:22px;display:flex;flex-direction:column;gap:12px"><div class="cta dk">+ &nbsp;Upload a product</div><div class="cta ln">Drafts <span class="cnt">0</span></div></div>';
function scr(cls, inner) { return '<div class="screen ' + (cls || '') + '">' + inner + nav() + '</div>'; }

var OPTS = [
  ['M1 · הקיים', 'שני כפתורים גדולים (העלאה, טיוטות), "My listings" בכרטיסים של שניים בשורה, ומתחת היסטוריה עם מיון ותאריך.',
   scr('', hd() + CTAS + '<div class="sec"><b>My listings</b><small>2 live</small></div><div class="pad cards">' + card(P[0]) + card(P[1]) + '</div>')],

  ['M2 · רשימה קומפקטית', 'העלאה עוברת ל-+ שחור בהדר וטיוטות לצ׳יפ קטן. המוצרים ברשימה עם תמונה, סטטוס, מחיר ו-⋯ לפעולות. רואים הרבה יותר מוצרים במסך.',
   scr('', hd('<span class="r"><span class="plus">' + ic('plus') + '</span>' + ic('chev') + '</span>') +
     '<div class="pad" style="padding-top:16px;display:flex;gap:8px"><span class="chip">Drafts <span class="cnt" style="width:18px;height:18px;font-size:9px">0</span></span><span class="chip">' + ic('cal').replace('class="i"', 'class="i" style="width:14px;height:14px"') + 'Any date</span><span class="chip">Newest ⌄</span></div>' +
     '<div class="sec"><b>Live</b><small>2</small></div>' + P.slice(0, 2).map(function (p) {
       return '<div class="row"><div class="th">' + p.e + '</div><div class="bd"><b>' + p.b + '</b><small>' + p.n + '</small><div class="st">Active</div></div><span class="pr">₪' + p.p + '</span><span class="more">⋯</span></div>';
     }).join('') + '<div class="sec"><b>Sold &amp; removed</b><small>1</small></div>' +
     '<div class="row" style="opacity:.55"><div class="th">👜</div><div class="bd"><b>STUDIO NOIR</b><small>Leather tote</small><div class="st" style="color:#16150f">Sold · 2d ago</div></div><span class="pr">₪540</span></div>')],

  ['M3 · מספרים וטאבים', 'פס של 4 מספרים (פעילים, טיוטות, נמכרו, צפיות), טאבים Live / Drafts / Sold במקום אזורים נפרדים, והעלאה ככפתור אחד.',
   scr('', hd() + '<div class="stats"><div><b>2</b><small>Live</small></div><div><b>0</b><small>Drafts</small></div><div><b>1</b><small>Sold</small></div><div><b>192</b><small>Views</small></div></div>' +
     '<div class="pad" style="padding-top:16px"><div class="cta dk">+ &nbsp;Upload a product</div></div>' +
     '<div class="tabs"><span class="on">Live · 2</span><span>Drafts · 0</span><span>Sold &amp; removed · 1</span></div><div class="pad cards">' + card(P[0]) + card(P[1]) + '</div>')],

  ['M4 · מתג + כפתור צף', 'מתג Live / Drafts / History למעלה, וכפתור "Upload" צף בפינה מעל הסרגל. הכי הרבה מקום למוצרים עצמם.',
   scr('', hd() + '<div class="seg"><span class="on">Live 2</span><span>Drafts 0</span><span>History 1</span></div><div class="pad cards">' + card(P[0]) + card(P[1]) + '</div>' +
     '<div class="fab">' + ic('plus') + 'Upload</div>')],

  ['M5 · כרטיס רחב עם פעולות', 'כל מוצר בכרטיס לרוחב עם תמונה, מחיר, ושורת פעולות מתחת: Edit · Collection · Share · Sold. הכול בלחיצה אחת.',
   scr('', hd() + '<div class="pad" style="padding-top:18px;display:flex;gap:10px"><div class="cta dk" style="flex:2">+ &nbsp;Upload</div><div class="cta ln" style="flex:1">Drafts <span class="cnt">0</span></div></div>' +
     '<div class="sec"><b>My listings</b><small>2 live</small></div>' + P.slice(0, 2).map(function (p) {
       return '<div class="wcard"><div class="top"><div class="th">' + p.e + '</div><div class="bd"><span class="badge">Active</span><b>' + p.b + '</b><small>' + p.n + '</small><div class="p">₪' + p.p + '</div></div></div>' +
         '<div class="acts"><span>Edit</span><span>Collection</span><span>Share</span><span>Sold</span></div></div>';
     }).join(''))],

  ['M6 · גריד של 3', 'כותרת גדולה ורשת צפופה של שלושה בשורה כמו אינסטגרם. הריבוע הראשון הוא "+" להעלאה, טיוטות שקופות, ומה שנמכר באפור עם SOLD.',
   scr('', '<div class="big" style="padding-top:60px">Products</div><div class="legend"><span>Live 2</span><span class="d">Drafts 1</span><span class="s">Sold 2</span></div>' +
     '<div class="g3"><div class="add">+</div><div>🧥<i></i><small>₪269</small></div><div>👖<i></i><small>₪129</small></div><div class="sd">👜</div><div class="sd">👗</div><div class="dr">👟</div></div>')],

  ['M7 · עם נתוני ביצועים', 'כל מוצר בשורה עם צפיות, לייקים והצעות, וגרף קטן של צפיות. ההצעות בכתום כשיש. מראה מה עובד.',
   scr('', hd() + CTAS + '<div class="sec"><b>My listings</b><small>2 live</small></div>' + P.slice(0, 2).map(function (p, k) {
       var pts = k ? '0,20 20,18 40,14 60,16 80,10 100,12 120,8' : '0,22 20,16 40,18 60,10 80,12 100,5 120,3';
       return '<div class="srow"><div class="th">' + p.e + '</div><div class="bd"><div class="t"><b>' + p.n + '</b><span class="p">₪' + p.p + '</span></div>' +
         '<div class="ms"><span>' + ic('eye') + p.v + '</span><span>' + ic('heart') + p.l + '</span><span class="' + (p.o ? 'hot' : '') + '">' + ic('tag') + p.o + ' offers</span></div>' +
         '<svg class="spark" viewBox="0 0 120 26" preserveAspectRatio="none"><polyline points="' + pts + '" fill="none" stroke="#16150f" stroke-width="1.2"/></svg></div></div>';
     }).join(''))],

  ['M8 · העלאה בתוך הגריד', 'במקום כפתורים למעלה, הכרטיס הראשון ברשת הוא "+ New piece" מסומן בקו מקווקו. טיוטות בשורה קטנה מעל.',
   scr('', hd() + '<div class="drline"><span>Drafts</span><span class="cnt">0</span></div><div class="sec"><b>My listings</b><small>2 live</small></div>' +
