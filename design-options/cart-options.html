<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #efede9; --ink: #111; --muted: #77736c; --line: #e4e1dc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.phone > img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: #111; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 44px 24px 14px; }
.ph b { font-size: 24px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.ph svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.k { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
.th { background: #ddd center / cover no-repeat; filter: grayscale(1); }
.btn { display: block; text-align: center; background: #111; color: #fff; padding: 17px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }
.money { font-variant-numeric: tabular-nums; }
.x { width: 18px; height: 18px; stroke: #999; stroke-width: 1.3; fill: none; }

/* B — list rows */
.b .row { display: flex; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.b .th { width: 86px; height: 108px; flex: none; }
.b .info { flex: 1; display: flex; flex-direction: column; }
.b .sel { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.b .nm { font-size: 16px; margin-top: 4px; }
.b .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.b .bot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.b .qty { display: flex; border: 1px solid var(--line); }
.b .qty span { width: 28px; height: 28px; display: grid; place-items: center; font-size: 13px; }
.b .pr { font-size: 15px; }
.b .sum { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 16px 24px 30px; }
.b .sum p { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.b .sum p.t { color: #111; font-size: 17px; margin: 10px 0 14px; }

/* C — editorial, one per row */
.c .tot { padding: 6px 24px 18px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: flex-end; }
.c .tot b { font-size: 42px; font-weight: 400; line-height: 1; }
.c .item { padding: 20px 24px 0; }
.c .th { height: 300px; position: relative; }
.c .th i { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.c .line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
.c .nm { font-size: 22px; }
.c .pr { font-size: 16px; }
.c .sel { margin-top: 4px; }
.c .float { position: absolute; left: 24px; right: 24px; bottom: 28px; display: flex; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
.c .float .btn { flex: 1; }
.c .float .n { background: #fff; padding: 0 18px; display: grid; place-items: center; font-size: 13px; }

/* D — grouped by seller */
.d { background: #f6f4f0; }
.d .ship { margin: 4px 24px 14px; font-size: 11px; color: var(--muted); }
.d .bar { height: 3px; background: #e2ded7; margin-top: 8px; } .d .bar i { display: block; height: 100%; width: 78%; background: #111; }
.d .grp { background: #fff; margin: 0 14px 12px; padding: 14px 14px 6px; }
.d .gh { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.d .gh b { font-size: 14px; font-weight: 400; display: flex; align-items: center; gap: 8px; }
.d .gh b::before { content: ''; width: 22px; height: 22px; border-radius: 50%; background: #111; }
.d .gh span { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.d .r { display: flex; gap: 12px; padding: 10px 0; align-items: center; }
.d .r .th { width: 54px; height: 66px; }
.d .r .nm { flex: 1; font-size: 13px; } .d .r .nm small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
.d .r .pr { font-size: 13px; }
.d .gf { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); padding: 8px 0; border-top: 1px dashed var(--line); }
.d .foot { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; padding: 14px 24px 30px; display: flex; gap: 14px; align-items: center; box-shadow: 0 -6px 20px rgba(0,0,0,0.06); }
.d .foot div { flex: none; } .d .foot div b { display: block; font-size: 18px; font-weight: 400; }
.d .foot .btn { flex: 1; }

/* E — receipt */
.e { background: #e9e6e0; }
.e .slip { margin: 6px 22px 0; background: #fbfaf7; padding: 26px 22px 30px; font-family: 'Courier New', monospace; font-size: 12.5px; color: #222;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; }
.e .slip h4 { font-family: 'Aharoni CLM', sans-serif; font-weight: 700; font-size: 22px; text-align: center; letter-spacing: 1px; }
.e .slip .s { text-align: center; font-size: 10px; letter-spacing: 2px; color: #777; margin-top: 4px; }
.e hr { border: 0; border-top: 1px dashed #aaa; margin: 14px 0; }
.e .ln { display: flex; gap: 6px; margin: 8px 0; } .e .ln span:nth-child(2) { flex: 1; border-bottom: 1px dotted #bbb; transform: translateY(-4px); }
.e .ln small { display: block; color: #888; font-size: 10px; }
.e .ln.t { font-weight: 700; font-size: 15px; }
.e .bc { height: 40px; margin: 18px 30px 6px; background: repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 4px, #222 4px 5px, transparent 5px 8px, #222 8px 11px, transparent 11px 13px); }
.e .no { text-align: center; font-size: 10px; letter-spacing: 3px; color: #777; }
.e .btn { position: absolute; left: 22px; right: 22px; bottom: 30px; }

/* F — dark */
.f { background: #0d0d0d; color: #f2efea; }
.f .k { color: #8a857d; }
.f .row { display: flex; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #222; align-items: center; }
.f .th { width: 70px; height: 88px; }
.f .nm { font-size: 15px; } .f .nm small { display: block; font-size: 9px; letter-spacing: 3px; color: #8a857d; text-transform: uppercase; margin-bottom: 5px; }
.f .grow { flex: 1; } .f .pr { font-size: 15px; }
.f .sum { position: absolute; left: 24px; right: 24px; bottom: 30px; }
.f .sum .tl { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #333; padding-top: 16px; margin-bottom: 18px; }
.f .sum .tl b { font-size: 34px; font-weight: 400; }
.f .btn { background: #f2efea; color: #111; }

/* G — carousel + bottom sheet */
.g { background: #f2f0ec; }
.g .rail { display: flex; gap: 14px; padding: 10px 24px; overflow: hidden; }
.g .card { flex: none; width: 230px; background: #fff; }
.g .card .th { height: 290px; }
.g .card div { padding: 12px 14px 14px; }
.g .card .nm { font-size: 16px; margin-top: 4px; display: flex; justify-content: space-between; }
.g .dots { display: flex; gap: 5px; justify-content: center; margin: 12px 0; }
.g .dots i { width: 5px; height: 5px; border-radius: 3px; background: #ccc; } .g .dots i.on { width: 18px; background: #111; }
.g .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 26px 26px 0 0; padding: 12px 24px 30px; box-shadow: 0 -10px 30px rgba(0,0,0,0.08); }
.g .grip { width: 38px; height: 4px; border-radius: 2px; background: #ddd; margin: 0 auto 16px; }
.g .sheet p { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.g .sheet p.t { color: #111; font-size: 20px; margin: 12px 0 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.g .btn { border-radius: 14px; }

/* H — compact grid + free shipping */
.h .prog { margin: 0 24px 16px; padding: 14px 16px; background: #f4f2ee; font-size: 12px; }
.h .prog .bar { height: 3px; background: #ddd; margin-top: 10px; } .h .prog .bar i { display: block; height: 100%; width: 88%; background: #111; }
.h .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 24px; }
.h .tile .th { aspect-ratio: 3/4; position: relative; }
.h .tile .th i { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; background: #111; display: grid; place-items: center; }
.h .tile .th i svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.4; fill: none; }
.h .tile .th.off { opacity: 0.4; } .h .tile .th.off i { background: #fff; border: 1px solid #aaa; }
.h .tile p { font-size: 11px; margin-top: 6px; display: flex; justify-content: space-between; }
.h .tile p span { color: var(--muted); }
.h .add { aspect-ratio: 3/4; border: 1px dashed #bbb; display: grid; place-items: center; text-align: center; font-size: 10px; letter-spacing: 2px; color: var(--muted); }
.h .foot { position: absolute; left: 24px; right: 24px; bottom: 30px; display: flex; align-items: center; background: #111; color: #fff; border-radius: 40px; padding: 6px 6px 6px 22px; }
.h .foot div { flex: 1; font-size: 11px; color: #aaa; } .h .foot div b { display: block; color: #fff; font-size: 17px; font-weight: 400; }
.h .foot span { background: #fff; color: #111; border-radius: 30px; padding: 15px 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
<h1>Cart — אופציות</h1>
<p class="sub">עגלת הקניות · 8 כיוונים (A הקיים) · אותם 4 פריטים לדוגמה</p>
<div class="grid" id="grid"></div>

<script>
var IT = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      sz: 'M',  pos: '50% 30%' },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', sz: '42', pos: '50% 60%' },
  { n: 'Linen Overshirt', s: 'Atelier Nord', p: 340, img: '../women-hero.jpg',    sz: 'S',  pos: '20% 40%' },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    sz: 'OS', pos: '50% 50%' }
];
var TOTAL = IT.reduce(function (a, i) { return a + i.p; }, 0);
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var th = function (i, cls) { return '<div class="th ' + (cls || '') + '" style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"></div>'; };
var X = '<svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var back = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
var head = function (t, extra) { return '<div class="ph"><b>' + t + '</b>' + (extra || back) + '</div>'; };

var OPTS = [
  ['A · הקיים', 'גריד של 2 כרטיסים עם אימוג׳י, מקובץ לפי קטגוריה. לנקודת השוואה.', null],

  ['B · רשימה קלאסית', 'שורה לכל פריט: תמונה, מוכר, מידה, כמות ומחיר. סיכום קבוע למטה עם משלוח וסה״כ. הכי מוכר וברור.',
   '<div class="screen b">' + head('Cart · 4') +
   IT.map(function (i) { return '<div class="row">' + th(i) + '<div class="info"><span class="sel">' + i.s + '</span><span class="nm">' + i.n + '</span><span class="meta">Size ' + i.sz + ' · Pre-loved</span><div class="bot"><div class="qty"><span>−</span><span>1</span><span>+</span></div><span class="pr money">' + m(i.p) + '</span></div></div></div>'; }).join('') +
   '<div class="sum"><p><span>Subtotal</span><span>' + m(TOTAL) + '</span></p><p><span>Shipping</span><span>Free</span></p><p class="t"><span>Total</span><span class="money">' + m(TOTAL) + '</span></p><span class="btn">Checkout</span></div></div>'],

  ['C · מגזיני, פריט לשורה', 'תמונה גדולה לכל פריט, הסכום ענק למעלה וכפתור צף. מרגיש כמו לגלול במגזין, הכי "אופנה".',
   '<div class="screen c">' + head('Cart') +
   '<div class="tot"><div><div class="k">Total · 4 pieces</div></div><b class="money">' + m(TOTAL) + '</b></div>' +
   IT.slice(0, 2).map(function (i) { return '<div class="item"><div class="th" style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"><i>' + X + '</i></div><div class="line"><span class="nm">' + i.n + '</span><span class="pr money">' + m(i.p) + '</span></div><div class="k sel">' + i.s + ' · Size ' + i.sz + '</div></div>'; }).join('') +
   '<div class="float"><span class="n">4</span><span class="btn">Checkout · ' + m(TOTAL) + '</span></div></div>'],

  ['D · לפי מוכר', 'מתאים למרקטפלייס: כל מוכר בכרטיס משלו עם המשלוח שלו, ופס התקדמות למשלוח חינם.',
   '<div class="screen d">' + head('Cart') +
   '<div class="ship">₪280 more for free shipping from Atelier Nord<div class="bar"><i></i></div></div>' +
   [['Atelier Nord', [IT[0], IT[2]], '₪25'], ['Sole Society', [IT[1]], 'Free'], ['Studio Vero', [IT[3]], '₪15']].map(function (g) {
     return '<div class="grp"><div class="gh"><b>' + g[0] + '</b><span>' + g[1].length + ' item' + (g[1].length > 1 ? 's' : '') + '</span></div>' +
       g[1].map(function (i) { return '<div class="r">' + th(i) + '<span class="nm">' + i.n + '<small>Size ' + i.sz + '</small></span><span class="pr money">' + m(i.p) + '</span></div>'; }).join('') +
       '<div class="gf"><span>Shipping</span><span>' + g[2] + '</span></div></div>'; }).join('') +
   '<div class="foot"><div><span class="k">Total</span><b class="money">' + m(TOTAL + 40) + '</b></div><span class="btn">Checkout</span></div></div>'],

  ['E · קבלה', 'העגלה כפתק קבלה עם קווים מנוקדים וברקוד. משחקי, ממשיך את אופציה Q מהסייל.',
   '<div class="screen e">' + head('Cart') +
   '<div class="slip"><h4>moravchick</h4><div class="s">YOUR CART · 04.10.26</div><hr>' +
   IT.map(function (i) { return '<div class="ln"><span>' + i.n.toUpperCase() + '<small>' + i.s + ' · ' + i.sz + '</small></span><span></span><span>' + i.p + '</span></div>'; }).join('') +
   '<hr><div class="ln"><span>SUBTOTAL</span><span></span><span>' + TOTAL + '</span></div><div class="ln"><span>SHIPPING</span><span></span><span>0</span></div><div class="ln t"><span>TOTAL ₪</span><span></span><span>' + TOTAL.toLocaleString('en-US') + '</span></div>' +
   '<div class="bc"></div><div class="no">* 4 ITEMS * THANK YOU *</div></div><span class="btn">Pay ' + m(TOTAL) + '</span></div>'],

  ['F · כהה ויוקרתי', 'רקע שחור, טקסט בהיר, שורות דקות וכפתור בהיר. מתאים לסרגל הניווט הכהה שכבר יש באתר.',
   '<div class="screen f">' + head('Cart') +
   '<div style="padding:0 24px 10px" class="k">4 pieces</div>' +
   IT.map(function (i) { return '<div class="row">' + th(i) + '<div class="grow nm"><small>' + i.s + '</small>' + i.n + '</div><span class="pr money">' + m(i.p) + '</span></div>'; }).join('') +
   '<div class="sum"><div class="tl"><span class="k">Total</span><b class="money">' + m(TOTAL) + '</b></div><span class="btn">Checkout</span></div></div>'],

  ['G · קרוסלה + גיליון', 'הפריטים בקרוסלה אופקית שמחליקים ביניהם, והסיכום בגיליון מעוגל שעולה מלמטה.',
   '<div class="screen g">' + head('Cart') +
   '<div class="rail">' + IT.map(function (i) { return '<div class="card">' + th(i) + '<div><span class="k">' + i.s + '</span><div class="nm"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div></div>'; }).join('') + '</div>' +
   '<div class="dots"><i class="on"></i><i></i><i></i><i></i></div>' +
   '<div class="sheet"><div class="grip"></div><p><span>4 items</span><span>' + m(TOTAL) + '</span></p><p><span>Shipping</span><span>Free</span></p><p class="t"><span>Total</span><span class="money">' + m(TOTAL) + '</span></p><span class="btn">Checkout</span></div></div>'],

  ['H · גריד קומפקטי + משלוח חינם', '3 בשורה, סימון V לבחירה לתשלום, אריח "הוסף עוד" ופס משלוח חינם. כפתור תשלום צף בצורת גלולה, כמו הסרגל הקיים.',
   '<div class="screen h">' + head('Cart') +
   '<div class="prog">Almost there — <b>₪280</b> to free shipping<div class="bar"><i></i></div></div>' +
   '<div class="g3">' + IT.map(function (i, k) { return '<div class="tile"><div class="th' + (k === 3 ? ' off' : '') + '" style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"><i><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i></div><p>' + i.n.split(' ')[0] + '<span class="money">' + m(i.p) + '</span></p></div>'; }).join('') +
   '<div class="tile"><div class="add">+<br>ADD<br>MORE</div></div></div>' +
   '<div class="foot"><div>3 selected<b class="money">' + m(TOTAL - 210) + '</b></div><span>Checkout →</span></div></div>']
];

document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + (o[2] || '<img src="cart-current.png" alt="">') + '</div>' +
    '<div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
