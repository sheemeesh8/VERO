<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  if (window.self === window.top && !/[?&]embed=1/.test(location.search)) {
    var pf = location.pathname.split('/').pop() || 'index';
    if (!/\.html$/.test(pf)) pf += '.html';
    location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
  }
</script>
<meta name="description" content="Markets, fairs, meetups and pop-ups where moravchick sellers meet buyers in person.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<title>moravchick — Event</title>
<script src="vero-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/aharoni.css">
<style>
  /* ---- One event: the events page's centred, quiet column, given room. ---- */
  :root {
    --ink: #16150f; --muted: rgba(22,21,15,0.62); --faint: rgba(22,21,15,0.42);
    --line: rgba(22,21,15,0.14); --line-strong: rgba(22,21,15,0.32);
    --navy: #2a4373; --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #fff; color: var(--ink);
         font-size: 12px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 8px 24px calc(56px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .k { font-size: 8.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

  .ev-hero { padding-top: 26px; }
  .when-rel { color: var(--muted); }
  .big-date { margin-top: 22px; }
  .big-date b { display: block; font-size: 64px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .big-date span { display: block; margin-top: 8px; font-size: 9px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .type { display: inline-flex; align-items: center; gap: 7px; margin-top: 30px; font-size: 8.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .type i { width: 7px; height: 7px; display: inline-block; }
  h1.title { margin-top: 10px; font-family: 'Inter', sans-serif !important; font-size: clamp(26px, 8vw, 32px); font-weight: 200; line-height: 1.12; letter-spacing: -0.01em; }
  .meta { margin-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
  .blurb { margin: 22px auto 0; max-width: 330px; font-size: 12px; font-weight: 300; line-height: 1.75; color: var(--muted); }

  .acts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 20px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 16px; border: 1px solid var(--ink);
         background: var(--ink); color: #fff; text-decoration: none; cursor: pointer; font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn.go-on { background: none; color: var(--ink); }
  .going-n { margin-top: 16px; font-size: 11px; color: var(--muted); }
  .going-n b { font-weight: 500; color: var(--ink); }
  .lnk { padding: 3px 0; background: none; border: 0; border-bottom: 1px solid var(--line-strong); cursor: pointer; text-decoration: none;
         font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }

  /* Sections below: a hairline, a small heading, centred content — even, medium spacing. */
  .sec { margin-top: 46px; padding-top: 34px; border-top: 1px solid var(--line); }
  .sec > .k { display: block; margin-bottom: 18px; }
  .who { display: flex; flex-direction: column; gap: 12px; }
  .who div { font-size: 13px; font-weight: 300; }
  .who small { display: block; margin-top: 2px; font-size: 8px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .who .you { color: var(--navy); font-weight: 400; }
  .place-l { font-size: 13px; font-weight: 300; }
  .place-l + .lnk { display: inline-block; margin-top: 12px; }

  .more { display: flex; flex-direction: column; }
  .more a { padding: 22px 0; border-top: 1px solid var(--line-strong); }
  .more a:last-child { border-bottom: 1px solid var(--line-strong); }
  .more a { display: block; text-decoration: none; }
  .more b { display: block; font-size: 24px; font-weight: 200; line-height: 1; }
  .more .mt { display: block; margin-top: 8px; font-size: 14px; font-weight: 400; }
  .more .mm { display: block; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
  .back { display: inline-block; margin-top: 46px; }
  .missing { padding: 80px 0; }
  .missing p { margin-top: 10px; font-size: 12px; font-weight: 300; color: var(--muted); }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 0.7s var(--ease) both; }
  .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
  html.is-embed .page-header { display: none; }
</style>
<style id="aharoni-headings">h1:not(#zz):not(#zz):not(#zz),h2:not(#zz):not(#zz):not(#zz),h3:not(#zz):not(#zz):not(#zz){font-family:'Inter','Segoe UI',sans-serif !important;}</style>
<link rel="stylesheet" href="assets/page-header.css?v=20261003e">
<script src="assets/page-header.js?v=20261117e"></script>
<link rel="stylesheet" href="assets/site-font.css">
</head>
<body>
  <header class="page-header">
    <div class="ph-name" role="heading" aria-level="1">Event</div>
    <a class="ph-back" href="events.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </header>
  <main class="wrap" id="main"></main>

  <script src="assets/events-data.js?v=2"></script>
  <script>
  (function eventPage() {
    var E = window.veroEvents, main = document.getElementById('main');
    if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('is-embed');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
    var TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    var CAL = '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>';
    var isSeller = false;
    try { isSeller = localStorage.getItem('vero_active_account') === 'seller'; } catch (e) {}
    if (/[?&]seller=1/.test(location.search)) isSeller = true;

    var id = new URLSearchParams(location.search).get('id'), e = id && E.byId(id);
    if (!e) {
      main.innerHTML = '<div class="missing rise"><p class="k">Event</p><p>This event isn’t on the calendar any more.</p><a class="lnk back" href="events.html">All events</a></div>';
      return;
    }
    var d = E.parse(e.date), T = E.TYPES[e.type] || { name: 'Event', color: 'var(--muted)' };
    var n = Math.round((d - E.today()) / 864e5);
    var rel = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n > 1 ? 'In ' + n + ' days' : n === -1 ? 'Yesterday' : (-n) + ' days ago';
    document.title = 'moravchick — ' + e.title;

    var people = E.attendees(e);
    var others = E.upcoming().filter(function (x) { return x.id !== e.id; }).slice(0, 3);
    var booth = !!E.booths()[e.id];

    main.innerHTML =
      '<section class="ev-hero rise">' +
        '<p class="k when-rel">' + esc(rel) + '</p>' +
        '<div class="big-date"><b>' + d.getDate() + '</b><span>' + E.DOWF[d.getDay()] + ' · ' + E.MONF[d.getMonth()] + ' ' + d.getFullYear() + '</span></div>' +
        '<div class="type"><i style="background:' + T.color + '"></i>' + esc(T.name) + '</div>' +
        '<h1 class="title">' + esc(e.title) + '</h1>' +
        '<p class="meta">' + esc(e.time || 'All day') + (e.place ? '<br>' + esc(e.place) : '') + (e.own ? '<br>Hosted by you' : '') + '</p>' +
        (e.blurb ? '<p class="blurb">' + esc(e.blurb) + '</p>' : '') +
        '<p class="going-n" id="goingN"></p>' +
        '<div class="acts">' +
          (n >= 0 && !e.own ? '<button type="button" class="btn" id="going"></button>' : '') +
          '<button type="button" class="lnk" id="ics">Add to calendar</button>' +
          (e.place ? '<a class="lnk" href="' + esc(E.mapsUrl(e)) + '" target="_blank" rel="noopener">Directions</a>' : '') +
          (isSeller && n >= 0 ? '<a class="lnk" href="events.html?date=' + e.date + '">' + (booth ? 'Your booth' : 'Book a booth') + '</a>' : '') +
        '</div>' +
      '</section>' +
      (people.length ? '<section class="sec rise d1"><span class="k">' + people.length + ' sellers coming</span><div class="who">' +
        people.map(function (p) { return '<div class="' + (p.you ? 'you' : '') + '">' + esc(p.you ? 'You · ' + p.name : p.name) + (p.cat ? '<small>' + esc(p.cat) + '</small>' : '') + '</div>'; }).join('') +
        '</div></section>' : '') +
      (e.place ? '<section class="sec rise d1"><span class="k">Where</span><p class="place-l">' + esc(e.place) + '</p>' +
        '<a class="lnk" href="' + esc(E.mapsUrl(e)) + '" target="_blank" rel="noopener">Open in maps</a></section>' : '') +
      (others.length ? '<section class="sec rise d2"><span class="k">Also coming up</span><div class="more">' +
        others.map(function (o) { var od = E.parse(o.date);
          return '<a href="event.html?id=' + encodeURIComponent(o.id) + '"><b>' + od.getDate() + ' ' + E.MON[od.getMonth()] + '</b>' +
            '<span class="mt">' + esc(o.title) + '</span><span class="mm">' + esc(o.time || 'All day') + (o.place ? ' · ' + esc(o.place) : '') + '</span></a>'; }).join('') +
        '</div></section>' : '') +
      '<a class="lnk back" href="events.html?date=' + e.date + '">All events</a>';

    // "I'm going" — and the count beside it.
    function paintGoing() {
      var on = E.isGoing(e.id), c = E.goingCount(e), b = document.getElementById('going');
      document.getElementById('goingN').innerHTML = '<b>' + c + '</b> going' + (on ? ' · including you' : e.own ? ' · your event' : '');
      if (b) { b.className = 'btn' + (on ? ' go-on' : ''); b.setAttribute('aria-pressed', on); b.innerHTML = on ? TICK + 'Going' : 'I’m going'; }
    }
    var gb = document.getElementById('going');
    if (gb) gb.addEventListener('click', function () { E.setGoing(e.id, !E.isGoing(e.id)); paintGoing(); });
    paintGoing();
    document.getElementById('ics').addEventListener('click', function () { E.downloadIcs(e); });
  })();
  </script>
  <script src="assets/line-icons.js"></script>
</body>
</html>
