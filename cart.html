<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — עגלת הקניות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow: hidden;
        }
        /* White cover that lifts away on load — continues the expand from the panel. */
        .page-cover {
            position: fixed; inset: 0; background: #fff; z-index: 50;
            animation: coverOut 0.6s cubic-bezier(0.76, 0, 0.24, 1) 0.05s forwards;
        }
        @keyframes coverOut { to { transform: translateY(-100%); } }

        .split { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
        .col { position: relative; overflow: hidden; }
        .text {
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 clamp(40px, 6vw, 120px);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
        .p-title {
            font-size: clamp(44px, 6vw, 96px); font-weight: 200;
            letter-spacing: 1px; line-height: 0.98; text-transform: none;
        }
        .p-sub {
            margin-top: 22px; font-size: 15px; font-weight: 400;
            letter-spacing: 1px; color: #6b6b66;
        }
        .media {
            background-size: cover; background-position: center;
            border-left: 1px solid #000;
            animation: fadeIn 0.9s ease 0.3s both;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .back {
            position: fixed; top: 26px; left: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }
        @media (max-width: 720px) {
            .split { grid-template-columns: 1fr; }
            .media { border-left: none; border-top: 1px solid #000; }
        }
    </style>
</head>
<body>
    <div class="page-cover"></div>
    <a class="back" href="buyer-area.html">&#8592; חזרה</a>
    <div class="split">
        <div class="col text">
            <h1 class="p-title">עגלת<br>הקניות</h1>
            <p class="p-sub">הפריטים שאספת — מוכנים לרכישה.</p>
        </div>
        <div class="col media" style="background-image:url('https://loremflickr.com/1200/1600/shopping,bag,fashion')"></div>
    </div>
    <script src="vero-editor.js"></script>
</body>
</html>
