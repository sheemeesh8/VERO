<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
<script src="assets/motion.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
      }
    </script>
    <meta name="description" content="moravchick — straight fashion. A curated marketplace for pre-loved fashion and art. Discover unique pieces, chat with sellers and complete every sale safely in person.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Listing saved</title>
    <script src="vero-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=Arimo:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <link rel="stylesheet" href="product-card.css?v=noguides1">
    <style>
        /* Confirmation after Publish / Save as draft. Same black-on-white look as
           the rest of the listing flow: centred, hairline type, one solid call to action. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        :root {
            --f-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --ink: #111; --muted: rgba(17,17,17,0.62); --line: rgba(17,17,17,0.22);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }
        body { font-family: var(--f-sans); color: var(--ink); background: #fff; display: flex; flex-direction: column; }
        body > .page-header { flex: none; }
        .ld {
            flex: 1 1 auto; min-height: 0; width: 100%; max-width: 460px; margin: 0 auto; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 10px 30px calc(22px + env(safe-area-inset-bottom, 0px));
        }
        .ld-mark { width: 46px; height: 46px; color: var(--ink); }
        .ld-mark svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
        .ld-eyebrow { margin-top: 18px; font-size: 9.35px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
        .ld-title { margin-top: 10px; font-family: var(--f-sans) !important; font-weight: 200; font-size: clamp(23.8px, 7vw, 28.9px); letter-spacing: 0.01em; color: var(--ink); }
        .ld-text { margin-top: 10px; max-width: 300px; font-size: 11.05px; font-weight: 300; line-height: 1.65; color: var(--muted); }
        .ld-card { width: 132px; max-width: 62%; margin: 22px auto 0; }
        .ld-card .product-card { width: 100%; cursor: default; }
        .ld-card .product-card:hover { transform: none; }
        .ld-actions { width: 100%; margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; gap: 12px; }
        .ld-btn {
            display: block; width: 100%; padding: 17px; border: 1.4px solid var(--ink); text-align: center; text-decoration: none;
            font-family: var(--f-sans); font-size: 11.05px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer;
            transition: opacity 0.2s;
        }
        .ld-btn:active { opacity: 0.7; }
        .ld-solid { background: var(--ink); color: #fff; }
        .ld-outline { background: #fff; color: var(--ink); border-color: var(--line); }
        /* Entrance: the mark draws, then the copy rises in. */
        @keyframes ldRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @keyframes ldDraw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
        .anim { opacity: 0; animation: ldRise 0.9s var(--ease) both; }
        .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.45s; } .d4 { animation-delay: 0.65s; }
        .ld-mark .tick { stroke: #1f8f4e; stroke-width: 1.6; }   /* every tick is green */
        .ld-mark .draw { stroke-dasharray: 60; animation: ldDraw 0.7s 0.35s var(--ease) both; }
        @media (prefers-reduced-motion: reduce) { .anim { animation: none; opacity: 1; } .ld-mark .draw { animation: none; } }

        /* ---- Sold: confetti, then the page ---- */
        .ld-confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
        .ld-confetti i { position: absolute; display: block; opacity: 0; will-change: transform, opacity; }
        .ld-confetti .burst { top: 30%; left: 50%; animation: ldBurst var(--d, 1.5s) cubic-bezier(0.12, 0.75, 0.3, 1) var(--w, 0s) forwards; }
        .ld-confetti .rain  { top: -24px; animation: ldFall var(--d, 3s) cubic-bezier(0.35, 0.1, 0.65, 1) var(--w, 0s) forwards; }
        @keyframes ldBurst {
            0%   { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(0.6); }
            70%  { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1); }
        }
        @keyframes ldFall {
            0%   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
            85%  { opacity: 1; }
            100% { opacity: 0; transform: translate3d(var(--x), 105vh, 0) rotate(var(--r)); }
        }
        body.is-sold .ld-title { font-size: clamp(36px, 11vw, 48px); font-weight: 200; letter-spacing: -0.01em; }
        body.is-sold .ld-card { width: 112px; margin-top: 18px; }   /* room for the price line, with both buttons still on screen */
        .ld-price { margin-top: 8px; font-size: 13px; font-weight: 400; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
        .ld-price[hidden] { display: none; }
        .ld-card .pc-sold { position: absolute; z-index: 5; top: 10px; left: 10px; padding: 5px 8px; background: var(--ink); color: #fff;
                            font-size: 7.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
        @media (prefers-reduced-motion: reduce) { .ld-confetti { display: none; } }
        /* ---- Event hosted: the event as the calendar shows it ---- */
        .ld-ev { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ld-ev-date { width: 64px; padding: 9px 0 8px; border: 1px solid rgba(27,25,22,0.32); }
        .ld-ev-date b { display: block; font-size: 28px; font-weight: 300; line-height: 1; }
        .ld-ev-date span { display: block; margin-top: 5px; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #48443e; }
        .ld-ev-type { margin-top: 14px; font-size: 8.5px; letter-spacing: 2.2px; text-transform: uppercase; font-weight: 600; }
        .ld-ev-type i { display: inline-block; width: 7px; height: 7px; margin-right: 7px; vertical-align: 1px; }
        .ld-ev-name { margin-top: 8px; font-size: 17px; line-height: 1.25; }
        .ld-ev-meta { margin-top: 6px; font-size: 11px; font-weight: 300; line-height: 1.6; color: #48443e; }
    </style>
    <link rel="stylesheet" href="assets/page-header.css?v=20261003e">
    <script src="assets/page-header.js?v=20261117e"></script>
    <link rel="stylesheet" href="assets/site-font.css?v=3">
</head>
<body>
    <header class="page-header">
        <div class="ph-name" role="heading" aria-level="1">List an item</div>
        <a class="ph-back" href="seller-area.html" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </header>

    <main class="ld">
        <div class="ld-mark anim" id="ldMark" aria-hidden="true"></div>
        <p class="ld-eyebrow anim d1" id="ldEyebrow"></p>
        <h1 class="ld-title anim d1" id="ldTitle"></h1>
        <p class="ld-price anim d1" id="ldPrice" hidden></p>
        <p class="ld-text anim d2" id="ldText"></p>
        <div class="ld-card anim d3" id="ldCard"></div>
        <div class="ld-actions anim d4">
            <a class="ld-btn ld-solid" id="ldPrimary" href="#"></a>
            <a class="ld-btn ld-outline" id="ldSecondary" href="upload-start.html">List another item</a>
        </div>
    </main>

    <script>
    (function () {
        var state = (location.search.match(/[?&]state=(live|draft|deleted|sold|event)\b/) || [])[1] || 'live';
        var draft = state === 'draft', deleted = state === 'deleted', sold = state === 'sold', hosted = state === 'event';

        // The item that was just saved: the newest entry in its list. (A deleted one
        // was never stored, so there is no card to show.)
        var item = null;
        if (sold) {
            // The piece that sold, by its id (or name) — still in the listings, now marked sold.
            var sq = new URLSearchParams(location.search), sid = sq.get('id'), sname = sq.get('name');
            try { item = (JSON.parse(localStorage.getItem('vero_listings')) || []).filter(function (p) {
                return (sid && p.id === sid) || (!sid && sname && (p.name === sname || p.title === sname));
            })[0] || null; } catch (e) {}
        } else if (hosted) {
            // The event just hosted (event-host.html), by its id in vero_events.
            var hid = new URLSearchParams(location.search).get('id');
            try { item = (JSON.parse(localStorage.getItem('vero_events')) || []).filter(function (e) { return e.id === hid; })[0] || null; } catch (e) {}
        } else if (!deleted) try { item = (JSON.parse(localStorage.getItem(draft ? 'vero_drafts' : 'vero_listings')) || [])[0] || null; } catch (e) {}

        var MARKS = {
            // A tick inside a circle — live.
            live: '<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25.5"/><path class="draw tick" d="M17 27.5l7 7 13-14"/></svg>',
            // A folded page — kept as a draft.
            draft: '<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25.5"/><path class="draw" d="M21 16h9l5 5v17H21z M30 16v5h5 M24.5 28h7 M24.5 32h5"/></svg>',
            // A price tag — sold.
            sold: '<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25.5"/><path class="draw" d="M17.5 27.5l10-10h9v9l-10 10z M31.5 22.5h.01 M22 29l4 4"/></svg>',
            // A calendar — an event hosted.
            event: '<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25.5"/><path class="draw" d="M18 19h18v17H18z M18 24h18 M22.5 16.5v4.5 M31.5 16.5v4.5"/><path class="draw tick" d="M23 30l3 3 5.5-5.5"/></svg>',
            // A bin — deleted.
            deleted: '<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25.5"/><path class="draw" d="M18 20h18 M23.5 20v-2.5h7V20 M20.5 20l1.3 16h10.4l1.3-16 M25 24.5v7.5 M29 24.5v7.5"/></svg>'
        };
        // A deletion can come from anywhere a product is deleted (assets/go-deleted.js):
        // what was deleted, its name, and the page to go back to.
        var qp = new URLSearchParams(location.search);
        var what = qp.get('what') || 'upload', pname = (qp.get('name') || '').trim();
        var back = qp.get('back') || '';
        if (!/^[\w-]+\.html(\?[^#<>"']*)?$/.test(back)) back = '';        // only a page of this site
        var quoted = pname ? '\u201c' + pname + '\u201d' : 'Your listing';
        var DELETED = {
            upload:  { eyebrow: 'Listing deleted', title: 'Your listing was deleted',
                       text: 'Everything you entered for it \u2014 photos, details and price \u2014 has been removed. Nothing was published.',
                       primary: ['List another item', 'upload-start.html'], secondary: ['Back to my store', 'seller-area.html'] },
            draft:   { eyebrow: 'Draft deleted', title: 'The draft was deleted',
                       text: (pname ? quoted + ' was' : 'The draft was') + ' deleted from your drafts, with its photos and details.',
                       primary: ['Back to my drafts', back || 'drafts.html'], secondary: ['List another item', 'upload-start.html'] },
            listing: { eyebrow: 'Listing deleted', title: 'The listing was deleted',
                       text: (pname ? quoted + ' was' : 'The listing was') + ' deleted for good \u2014 it\u2019s no longer on moravchick.',
                       primary: ['Back to my listings', back || 'my-products.html?from=seller'], secondary: ['List another item', 'upload-start.html'] },
            removed: { eyebrow: 'Listing removed', title: 'The listing was removed',
                       text: (pname ? quoted + ' is' : 'It is') + ' off the feed now. You\u2019ll find it in your history, and you can relist it any time.',
                       primary: ['Back to my listings', back || 'my-products.html?from=seller'], secondary: ['List another item', 'upload-start.html'] }
        };
        // Sold: from the chat, the product editor or the listings page (sold-celebration.js /
        // veroGoSold). The amount is what it sold for; "Back" returns where the seller was.
        var soldAmt = Math.round(parseFloat(qp.get('amount')) || 0);
        var SOLD = {
            eyebrow: 'Congratulations',
            title: 'Sold!',
            text: (pname ? quoted + ' has' : 'Your piece has') + ' found a new home. It\u2019s moved to your sales history \u2014 nice work.',
            primary: ['View my sales', 'my-products.html?from=seller'],
            secondary: back ? ['Back', back] : ['List another item', 'upload-start.html']
        };
        var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var evName = item && hosted ? '\u201c' + item.title + '\u201d' : 'Your event';
        var HOSTED = {
            eyebrow: 'Event published',
            title: 'Your event is on!',
            text: evName + ' is on the moravchick calendar. Buyers can add it to their calendar and sellers can book a booth.',
            primary: ['View on the calendar', 'events.html' + (item && item.date ? '?date=' + item.date : '')],
            secondary: ['Host another event', 'event-host.html']
        };
        var COPY = hosted ? HOSTED : sold ? SOLD : deleted ? (DELETED[what] || DELETED.upload) : draft ? {
            eyebrow: 'Saved to drafts',
            title: 'Saved as a draft',
            text: 'Your listing is waiting in your drafts. Pick it up whenever you’re ready and publish it in one tap.',
            primary: ['Go to my drafts', 'drafts.html']
        } : {
            eyebrow: 'Listing live',
            title: 'Your item is live',
            text: 'Buyers can now find it on moravchick. We’ll let you know as soon as someone sends an offer or a message.',
            primary: ['View my listings', 'my-products.html?from=seller']
        };

        document.getElementById('ldMark').innerHTML = MARKS[state];
        if (state === 'live') confetti();   // a new listing is a small celebration too
        if (hosted) {
            confetti();
            if (item) {
                var TY = { market: ['Market', '#9a7d52'], fair: ['Fair', '#2b6d9a'], meetup: ['Meetup', '#1f8f4e'], popup: ['Pop-up', '#b23b3b'] }[item.type] || ['Event', '#48443e'];
                var p = String(item.date).split('-'), dd = new Date(+p[0], +p[1] - 1, +p[2]);
                var e2 = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
                document.getElementById('ldCard').innerHTML = '<div class="ld-ev">' +
                    '<div class="ld-ev-date"><b>' + dd.getDate() + '</b><span>' + MONS[dd.getMonth()] + '</span></div>' +
                    '<div class="ld-ev-type"><i style="background:' + TY[1] + '"></i>' + TY[0] + '</div>' +
                    '<div class="ld-ev-name">' + e2(item.title) + '</div>' +
                    '<div class="ld-ev-meta">' + e2(item.time || '') + (item.place ? '<br>' + e2(item.place) : '') + '</div></div>';
            }
        }
        // The header names where the seller is: the upload flow, a sale, or their products.
        var phName = document.querySelector('.page-header .ph-name');
        if (phName) phName.textContent = hosted ? 'Host an event' : sold ? 'Sold' : (deleted && what !== 'upload') ? 'My products' : 'List an item';
        if (sold) {
            document.body.classList.add('is-sold');
            var priceEl = document.getElementById('ldPrice');
            if (soldAmt) { priceEl.textContent = 'Sold for \u20AA' + soldAmt.toLocaleString('en-US'); priceEl.hidden = false; }
            confetti();
        }
        document.getElementById('ldEyebrow').textContent = COPY.eyebrow;
        document.getElementById('ldTitle').textContent = COPY.title;
        document.getElementById('ldText').textContent = COPY.text +
            (/[?&]trimmed=1\b/.test(location.search) ? ' This device was short on space, so only the cover photo was kept.' : '');
        var primary = document.getElementById('ldPrimary');
        primary.textContent = COPY.primary[0];
        primary.href = COPY.primary[1];
        if (COPY.secondary) {
            var secondary = document.getElementById('ldSecondary');
            secondary.textContent = COPY.secondary[0];
            secondary.href = COPY.secondary[1];
        }
        document.title = 'moravchick — ' + COPY.title;

        // A burst from behind the mark, then a light rain from the top — about three
        // seconds, then it is gone and the page stays. Squares and slivers in the
        // site's palette; nothing at all for reduced motion.
        function confetti() {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var COL = ['#16150f', '#2a4373', '#c9a24a', '#b23b3b', '#1f8f4e', '#e8e3d8', '#7aa6c2'];
            var box = document.createElement('div'); box.className = 'ld-confetti'; box.setAttribute('aria-hidden', 'true');
            var r = function (a, b) { return a + Math.random() * (b - a); }, html = '', i;
            for (i = 0; i < 46; i++) {
                var a = r(0, Math.PI * 2), d = r(110, 260), w = r(5, 9), h = i % 3 ? r(8, 14) : w;
                html += '<i class="burst" style="width:' + w.toFixed(0) + 'px;height:' + h.toFixed(0) + 'px;background:' + COL[i % COL.length] +
                    ';--x:' + (Math.cos(a) * d).toFixed(0) + 'px;--y:' + (Math.sin(a) * d - 40).toFixed(0) + 'px;--r:' + r(-540, 540).toFixed(0) +
                    'deg;--d:' + r(1.1, 1.7).toFixed(2) + 's;--w:' + r(0.05, 0.25).toFixed(2) + 's"></i>';
            }
            for (i = 0; i < 70; i++) {
                var w2 = r(5, 9), h2 = i % 3 ? r(9, 15) : w2;
                html += '<i class="rain" style="left:' + r(0, 100).toFixed(1) + '%;width:' + w2.toFixed(0) + 'px;height:' + h2.toFixed(0) + 'px;background:' + COL[(i + 3) % COL.length] +
                    ';--x:' + r(-60, 60).toFixed(0) + 'px;--r:' + r(-720, 720).toFixed(0) + 'deg;--d:' + r(2.2, 3.4).toFixed(2) + 's;--w:' + r(0.3, 1.2).toFixed(2) + 's"></i>';
            }
            box.innerHTML = html; document.body.appendChild(box);
            setTimeout(function () { box.remove(); }, 4800);
        }

        // The card buyers will see — the same feed card as everywhere else.
        if (!item) { document.getElementById('ldCard').remove(); return; }
        if (hosted) return;
        var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var nis = function (n) { return '₪' + Math.round(n); };
        var pr = parseFloat(item.price) || 0, off = parseFloat(item.salePercent) || 0, sale = off > 0 && pr > 0;
        var fig = item.cover ? '<img class="pc-photo" src="' + esc(item.cover) + '" alt="">' : (item.category === 'art' ? '🖼️' : '🛍️');
        var price = sale
            ? '<span class="vprice-wrap"><span class="vprice-off">-' + Math.round(off) + '%</span><span class="vprice-was">' + nis(pr) + '</span><span class="vprice vprice-sale">' + nis(pr * (1 - off / 100)) + '</span></span>'
            : '<span class="vprice">' + nis(pr) + '</span>';
        document.getElementById('ldCard').innerHTML =
            '<div class="product-card' + (sale ? ' is-sale' : '') + '">' +
                '<div class="product-image">' + fig + (sold ? '<span class="pc-sold">Sold</span>' : '') + '</div>' +
                '<div class="product-info">' +
                    '<div class="pc-left"><div class="product-price">' + price + '</div></div>' +
                    '<div class="pc-right">' +
                        '<div class="product-name">' + esc(item.title || 'Item') + '</div>' +
                        '<div class="product-seller">' + esc(item.brand || 'Your store') + '</div>' +
                    '</div>' +
                '</div>' +
            '</div>';

        // The card grows into whatever height is spare above the buttons — as
        // large as the screen allows, with both buttons still in view.
        function fitCard() {
            var card = document.getElementById('ldCard'), acts = document.querySelector('.ld-actions'), ld = document.querySelector('.ld');
            if (!card || !acts || !ld) return;
            card.style.width = ''; card.style.maxWidth = '';
            var r = card.getBoundingClientRect();
            var spare = acts.getBoundingClientRect().top - r.bottom - 8;
            if (!r.height) return;
            if (spare > 0) {
                var w = Math.min(r.width + spare * r.width / r.height, ld.clientWidth - 40, 400);
                if (w > r.width) { card.style.maxWidth = 'none'; card.style.width = Math.floor(w) + 'px'; }
            }
            // Never push the buttons off the screen: give back whatever overflows.
            for (var i = 0; i < 4; i++) {
                var over = ld.scrollHeight - ld.clientHeight;
                if (over <= 0) break;
                var c = card.getBoundingClientRect();
                card.style.maxWidth = 'none';
                card.style.width = Math.max(120, Math.floor(c.width - (over + 2) * c.width / c.height)) + 'px';
            }
        }
        var imgEl = document.querySelector('#ldCard img');
        if (imgEl && !imgEl.complete) imgEl.addEventListener('load', fitCard);
        requestAnimationFrame(fitCard);
        window.addEventListener('resize', fitCard);
    })();
    </script>
    <script src="assets/line-icons.js"></script>
</body>
</html>
