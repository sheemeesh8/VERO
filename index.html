<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick</title>
    <style>
        html, body { margin: 0; padding: 0; background: #000; }
        * { box-sizing: border-box; }
        /* Scroll room so the overlay has a distance to fade in across. */
        .scroll-space { height: 200vh; }

        /* ===== Full-screen hero video (fixed background) ===== */
        .hero { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; z-index: 0; }
        .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .hero-copy {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding-top: clamp(60px, 14vh, 160px);
            color: #fff; font-family: 'Poppins', 'Inter', system-ui, sans-serif;
        }
        .hero-welcome { font-size: clamp(22px, 6vw, 40px); font-weight: 300; letter-spacing: 0.02em; }
        .hero-welcome b { font-weight: 700; }
        .hero-slogan { margin-top: 14px; font-size: clamp(12px, 3vw, 16px); font-weight: 400; letter-spacing: 3px; text-transform: uppercase; opacity: 0.9; }

        /* ===== White gender-slider screen — a fixed overlay that fades in OVER the
           hero as you scroll down (opacity driven by scroll position). ===== */
        .pick {
            position: fixed; inset: 0; z-index: 2; background: #fff;
            display: flex; align-items: center; justify-content: center; padding: 10vh 20px;
            opacity: 0; pointer-events: none;
        }
        .pick-inner { width: 100%; max-width: 560px; margin: 0 auto; }

        /* ===== Coverflow gender carousel (ported from coverflow-carousel.tsx) ===== */
        #genderCover { position: relative; margin: 0 -20px 14px; --gc-card: clamp(260px, 82vw, 430px); }
        #genderCover .gc-head { font-family: 'Poppins','Inter',sans-serif; font-weight: 300; letter-spacing: 0.01em; font-size: 15px; color: #111; text-align: center; margin: 0 0 2px; }
        #genderCover .gc-sub { font-family: 'Poppins','Inter',sans-serif; font-weight: 400; font-size: 12px; color: #6b6a64; text-align: center; margin: 0 0 4px; min-height: 16px; }
        #genderCover .gc-rel { position: relative; }
        #genderCover .gc-frame { perspective: calc(var(--gc-card) * 3); overflow: hidden; padding: 34px 0 30px; outline: none; cursor: grab; touch-action: pan-y; }
        #genderCover .gc-frame:active { cursor: grabbing; }
        #genderCover .gc-stage { position: relative; height: var(--gc-card); transform-style: preserve-3d; }
        #genderCover .gc-card { position: absolute; left: 50%; top: 0; width: var(--gc-card); height: var(--gc-card); border-radius: 18px; overflow: hidden; background: #efede8; box-shadow: 0 18px 40px rgba(0,0,0,0.28); will-change: transform; }
        #genderCover .gc-card img, #genderCover .gc-card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; pointer-events: none; }
        #genderCover .gc-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 54%, rgba(0,0,0,0.42)); }
        #genderCover .gc-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 200; width: 38px; height: 38px; padding: 0; border: none; border-radius: 9999px; background: rgba(255,255,255,0.82); color: #111; display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 6px 16px rgba(0,0,0,0.16); cursor: pointer; transition: background .2s ease; }
        #genderCover .gc-nav:hover { background: #fff; }
        #genderCover .gc-prev { left: 10px; }
        #genderCover .gc-next { right: 10px; }
        #genderCover .gc-nav svg { width: 20px; height: 20px; }
        #genderCover .gc-cap { display: flex; flex-direction: column; align-items: center; margin-top: 2px; }
        #genderCover .gc-cap .gc-name { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: -0.3px; color: #111; }
        #genderCover .gc-cap .gc-shop { margin-top: 4px; font-family: 'Arimo','Inter',sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #111; border-bottom: 1px solid #111; padding-bottom: 2px; text-decoration: none; }
        #genderCover .gc-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
        #genderCover .gc-dots button { width: 8px; height: 8px; padding: 0; border: none; border-radius: 9999px; background: #111; opacity: 0.25; cursor: pointer; transition: opacity .25s ease, width .25s ease; }
        #genderCover .gc-dots button.on { opacity: 1; width: 22px; }

        /* ===== Shared step button ===== */
        .step-btn {
            display: inline-block; margin: 30px auto 0;
            font-family: 'Archivo','Poppins',sans-serif; font-weight: 700; font-size: 12px;
            letter-spacing: 1.6px; text-transform: uppercase; color: #fff; background: #111;
            border: none; padding: 16px 44px; cursor: pointer; transition: opacity .25s ease, transform .2s ease;
        }
        .step-btn:hover { transform: translateY(-2px); }
        .step-btn.locked { opacity: 0.3; pointer-events: none; }
        .pick-inner, .screen-inner { text-align: center; }

        /* ===== Stacked full-screen step overlays — each fades IN over the previous ===== */
        .screen {
            position: fixed; inset: 0; background: #fff;
            display: flex; align-items: center; justify-content: center; padding: 10vh 20px;
            opacity: 0; pointer-events: none; transition: opacity 1.5s cubic-bezier(0.83, 0, 0.17, 1); overflow-y: auto;
        }
        .screen.show { opacity: 1; pointer-events: auto; }
        #scrProduct { z-index: 3; }
        #scrStyle { z-index: 4; }
        #scrFeed { z-index: 5; }
        .screen-inner { width: 100%; max-width: 620px; margin: 0 auto; }
        .scr-kicker { font-family: 'Archivo','Inter',sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #8a857c; }
        .scr-q { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: clamp(28px, 7vw, 46px); line-height: 1.03; letter-spacing: -0.02em; color: #111; margin: 14px 0 32px; }
        .scr-opts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .chip { font-family: 'Arimo','Inter',sans-serif; font-size: 15px; letter-spacing: 0.3px; color: #111; background: #fff; border: 1.5px solid #111; border-radius: 999px; padding: 13px 22px; cursor: pointer; transition: background .2s ease, color .2s ease, transform .2s ease; }
        .chip:hover { transform: translateY(-2px); }
        .chip.sel { background: #111; color: #fff; }

        /* ===== Feed top strip — 6 matched products ===== */
        .feed-head { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: clamp(22px,5vw,32px); color: #111; margin: 0 0 6px; letter-spacing: -0.02em; }
        .feed-note { font-family: 'Arimo','Inter',sans-serif; font-size: 14px; color: #666; margin: 0 0 26px; }
        .feed-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        @media (min-width: 620px) { .feed-grid { grid-template-columns: repeat(3, 1fr); } }
        .fcard { display: block; text-decoration: none; color: #111; }
        .fcard-img { position: relative; width: 100%; aspect-ratio: 0.8; background: #f0eee9; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .fcard-img img { width: 100%; height: 100%; object-fit: cover; }
        .fcard-name { font-family: 'Arimo','Inter',sans-serif; font-size: 13px; margin: 8px 0 0; }
        .fcard-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; color: #777; }
        .fcard-price { font-family: 'Archivo','Inter',sans-serif; font-weight: 800; font-size: 13px; margin-top: 2px; }
        .feed-enter { display: inline-block; margin-top: 30px; }

        /* ===== Entrance animations ===== */
        /* Hero copy rises in on load. */
        @keyframes heroIn { from { opacity: 0; transform: translateY(26px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
        .hero-welcome { opacity: 0; animation: heroIn 1.3s cubic-bezier(.16,1,.3,1) .35s forwards; }
        .hero-slogan { opacity: 0; animation: heroIn 1.3s cubic-bezier(.16,1,.3,1) .6s forwards; }

        /* Step screens: inner blocks stagger up once the screen shows. */
        .screen .scr-kicker, .screen .scr-q, .screen .step-btn,
        .screen .feed-head, .screen .feed-note, .screen .feed-grid,
        .screen .scr-opts .chip {
            opacity: 0; transform: translateY(22px);
            transition: opacity .85s cubic-bezier(.16,1,.3,1), transform .85s cubic-bezier(.16,1,.3,1);
        }
        .screen.show .scr-kicker, .screen.show .scr-q, .screen.show .step-btn,
        .screen.show .feed-head, .screen.show .feed-note, .screen.show .feed-grid,
        .screen.show .scr-opts .chip { opacity: 1; transform: none; }

        /* Stagger order per screen. */
        .screen.show .scr-kicker { transition-delay: .35s; }
        .screen.show .scr-q { transition-delay: .5s; }
        /* Chips start slightly scaled down, settle to full size. */
        .screen .scr-opts .chip { transform: translateY(16px) scale(.96); }
        .screen.show .scr-opts .chip { transform: none; }
        .screen.show .scr-opts .chip:nth-child(1) { transition-delay: .62s; }
        .screen.show .scr-opts .chip:nth-child(2) { transition-delay: .69s; }
        .screen.show .scr-opts .chip:nth-child(3) { transition-delay: .76s; }
        .screen.show .scr-opts .chip:nth-child(4) { transition-delay: .83s; }
        .screen.show .scr-opts .chip:nth-child(5) { transition-delay: .90s; }
        .screen.show .scr-opts .chip:nth-child(6) { transition-delay: .97s; }
        .screen.show .step-btn { transition-delay: 1.1s; }

        /* Feed screen reveal order + per-card stagger. */
        .screen.show .feed-head { transition-delay: .3s; }
        .screen.show .feed-note { transition-delay: .4s; }
        .screen.show .feed-grid { transition-delay: .5s; }
        .feed-grid .fcard { opacity: 0; transform: translateY(20px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
        .screen.show .feed-grid .fcard { opacity: 1; transform: none; }
        .screen.show .feed-grid .fcard:nth-child(1) { transition-delay: .60s; }
        .screen.show .feed-grid .fcard:nth-child(2) { transition-delay: .68s; }
        .screen.show .feed-grid .fcard:nth-child(3) { transition-delay: .76s; }
        .screen.show .feed-grid .fcard:nth-child(4) { transition-delay: .84s; }
        .screen.show .feed-grid .fcard:nth-child(5) { transition-delay: .92s; }
        .screen.show .feed-grid .fcard:nth-child(6) { transition-delay: 1.0s; }
        .screen.show .feed-enter { transition-delay: 1.15s; }

        @media (prefers-reduced-motion: reduce) {
            .hero-welcome, .hero-slogan { opacity: 1; animation: none; }
            .screen .scr-kicker, .screen .scr-q, .screen .step-btn,
            .screen .feed-head, .screen .feed-note, .screen .feed-grid,
            .screen .scr-opts .chip, .feed-grid .fcard {
                opacity: 1; transform: none; transition: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HERO ===== -->
    <section class="hero">
        <video class="hero-video" src="assets/hero/unisex.mp4" poster="assets/hero/autumn-hero.jpg"
               autoplay muted loop playsinline></video>

    <!-- Scroll room so the overlay has distance to fade in across -->

    <!-- ===== STEP · PICK A PRODUCT ===== -->

    <!-- ===== STEP · PICK A STYLE ===== -->
    <section class="screen" id="scrStyle" aria-label="What is your style">
        <div class="screen-inner">
            <span class="scr-kicker">Step 03</span>
            <h2 class="scr-q">What's your<br>style?</h2>
            <div class="scr-opts" data-key="style">
                <button type="button" class="chip" data-val="minimal">Minimal</button>
                <button type="button" class="chip" data-val="elegant">Elegant</button>
                <button type="button" class="chip" data-val="streetwear">Streetwear</button>

    <!-- ===== STEP · FEED (top 6 matched products) ===== -->
    <section class="screen" id="scrFeed" aria-label="Your feed">
        <div class="screen-inner">
            <h2 class="feed-head">Your edit</h2>
            <p class="feed-note" id="feedNote">Picked for you</p>
            <div class="feed-grid" id="feedGrid"></div>
            <a class="step-btn feed-enter" id="enterFeed" href="products.html">Explore the full feed</a>

    <!-- White overlay fades IN over the hero as you scroll down -->
    <script>
    (function () {
        var sec = document.getElementById('pick');
        if (!sec) return;
        function onScroll() {
            var vh = window.innerHeight || 1;
            var t = Math.min(1, Math.max(0, window.pageYOffset / vh));
            sec.style.opacity = String(t);
            sec.style.pointerEvents = t > 0.6 ? 'auto' : 'none';
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        onScroll();
    })();
    </script>

    <!-- Gender coverflow carousel -->
    <script>
    (function () {
        var root = document.getElementById('genderCover');
        if (!root) return;
        var frame = root.querySelector('.gc-frame');
        var cards = [].slice.call(root.querySelectorAll('.gc-card'));
        var count = cards.length;
        if (!count) return;
        var sub = root.querySelector('.gc-sub');
        var nameEl = root.querySelector('.gc-cap .gc-name');
        var shopEl = root.querySelector('.gc-cap .gc-shop');
        var dotsWrap = root.querySelector('.gc-dots');
        var prevBtn = root.querySelector('.gc-prev');
        var nextBtn = root.querySelector('.gc-next');

        var ROTATE = 44, DEPTH = 0.6, FALLOFF = 0.56, FADE = 0.1, GAP = 0.08, LOOP = true;
        var pos = 0, target = 0, width = 0, rafId = null, selected = 0, drag = null;

        dotsWrap.innerHTML = cards.map(function (c, i) {
            return '<button type="button" class="' + (i ? '' : 'on') + '" aria-label="Go to ' + (c.getAttribute('data-name') || ('slide ' + (i + 1))) + '"></button>';
        }).join('');
        var dots = [].slice.call(dotsWrap.querySelectorAll('button'));

        function indexAt(p) { return ((Math.round(p) % count) + count) % count; }
        function sign(n) { return n < 0 ? -1 : (n > 0 ? 1 : 0); }

        function paint() {
            if (!width) return;
            var pitch = width * (1 + GAP);
            for (var i = 0; i < count; i++) {
                var card = cards[i];
                var offset = i - pos;
                if (LOOP) { offset = ((offset % count) + count) % count; if (offset > count / 2) offset -= count; }
                var dist = Math.abs(offset);
                var ramp = Math.pow(dist, FALLOFF);
                var tilt = Math.min(ROTATE * ramp, 82) * sign(offset);
                card.style.transform = 'translateX(calc(-50% + ' + (offset * pitch) + 'px)) translateZ(' + (-DEPTH * width * ramp) + 'px) rotateY(' + (-tilt) + 'deg)';
                var edge = LOOP ? Math.min(1, Math.max(0, count / 2 - dist)) : 1;
                card.style.opacity = String(Math.max(0, 1 - FADE * dist) * edge);
                card.style.zIndex = String(100 - Math.round(dist));
            }
        }

        function render() {
            var a = indexAt(target);
            selected = a;
            dots.forEach(function (d, i) { d.classList.toggle('on', i === a); });
            var card = cards[a];
            var nm = card.getAttribute('data-name') || '';
            var href = card.getAttribute('data-href') || '#';
            if (sub) sub.textContent = card.getAttribute('data-sub') || nm;
            if (nameEl) nameEl.textContent = nm;
            if (shopEl) { shopEl.textContent = 'Shop ' + nm; shopEl.setAttribute('href', href); }
            cards.forEach(function (c, i) {
                var v = c.querySelector('video'); if (!v) return;
                v.muted = true; v.defaultMuted = true;
                if (i === a) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
                else { try { v.pause(); } catch (x) {} }
            });
        }

        function clampPos(p) { return LOOP ? p : Math.max(0, Math.min(count - 1, p)); }

        function settle(t) {
            if (rafId !== null) cancelAnimationFrame(rafId);
            target = t; render();
            function step() {
                var remaining = target - pos;
                if (Math.abs(remaining) < 0.0004) { pos = target; paint(); rafId = null; return; }
                pos += remaining * 0.16; paint();
                rafId = requestAnimationFrame(step);
            }
            rafId = requestAnimationFrame(step);
        }

        function goTo(index) {
            var t = LOOP ? index + Math.round((target - index) / count) * count : index;
            settle(clampPos(t));
        }
        function nudge(by) { settle(clampPos(Math.round(target) + by)); }

        frame.addEventListener('pointerdown', function (e) {
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
            try { frame.setPointerCapture(e.pointerId); } catch (x) {}
            target = pos;
            drag = { id: e.pointerId, x: e.clientX, pos: pos, v: 0, t: performance.now(), moved: false };
        });
        frame.addEventListener('pointermove', function (e) {
            if (!drag || drag.id !== e.pointerId) return;
            var pitch = width * (1 + GAP); if (!pitch) return;
            var now = performance.now(), prev = pos;
            pos = clampPos(drag.pos - (e.clientX - drag.x) / pitch);
            if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
            drag.v = ((pos - prev) / Math.max(now - drag.t, 1)) * 1000; drag.t = now;
            var idx = indexAt(pos); if (idx !== selected) { selected = idx; render(); }
            paint();
        });
        function endDrag(e) {
            if (!drag || drag.id !== e.pointerId) return;
            var startIdx = Math.round(drag.pos);
            var moved = pos - drag.pos;
            var dir = moved > 0 ? 1 : (moved < 0 ? -1 : 0);
            var dest = startIdx;
            if (Math.abs(moved) > 0.12 || (Math.abs(drag.v) > 0.5 && Math.abs(moved) > 0.03)) dest = startIdx + dir;
            dest = Math.max(startIdx - 1, Math.min(startIdx + 1, dest));
            frame.__moved = drag.moved; drag = null;
            settle(clampPos(dest));
        }
        frame.addEventListener('pointerup', endDrag);
        frame.addEventListener('pointercancel', endDrag);

        cards.forEach(function (card, i) {
            card.addEventListener('click', function () {
                if (frame.__moved) { frame.__moved = false; return; }
                if (indexAt(target) === i) { window.location.href = card.getAttribute('data-href'); }
                else goTo(i);
            });
        });

        frame.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(1); }
        });
        if (prevBtn) prevBtn.addEventListener('click', function () { nudge(-1); });
        if (nextBtn) nextBtn.addEventListener('click', function () { nudge(1); });
        dots.forEach(function (d, i) { d.addEventListener('click', function () { goTo(i); }); });

        function measure() { width = cards[0] ? cards[0].offsetWidth : 0; paint(); }
        if (window.ResizeObserver) { try { new ResizeObserver(measure).observe(frame); } catch (x) {} }
        window.addEventListener('resize', measure);
        cards.forEach(function (c) { var im = c.querySelector('img'); if (im && !im.complete) im.addEventListener('load', measure); });

        function init() { measure(); render(); paint(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
    </script>

    <!-- Step navigation + matched feed -->
    <script>
    (function () {
        var sel = {};
        function show(id) {
            var el = document.getElementById(id);
            if (el) { el.classList.add('show'); el.scrollTop = 0; }
        }
        // Chip single-select; unlock that screen's Continue button.
        [].slice.call(document.querySelectorAll('.scr-opts')).forEach(function (group) {
            var key = group.getAttribute('data-key');
            var chips = [].slice.call(group.querySelectorAll('.chip'));
            chips.forEach(function (ch) {
                ch.addEventListener('click', function () {
                    chips.forEach(function (c) { c.classList.remove('sel'); });
                    ch.classList.add('sel');
                    sel[key] = ch.getAttribute('data-val');
                    var scr = ch.closest('.screen');
                    var btn = scr && scr.querySelector('.step-btn');
                    if (btn) btn.classList.remove('locked');
                });
            });
        });

        // Gender → product
        var toProduct = document.getElementById('toProduct');
        if (toProduct) toProduct.addEventListener('click', function () {
            if (window.__gcGender) sel.gender = window.__gcGender.gender;
            show('scrProduct');
        });
        // Product → style
        var toStyle = document.getElementById('toStyle');
        if (toStyle) toStyle.addEventListener('click', function () { show('scrStyle'); });
        // Style → feed (build the 6 matched products)
        var toFeed = document.getElementById('toFeed');
        if (toFeed) toFeed.addEventListener('click', function () { buildFeed(); show('scrFeed'); });

        // Map the shopper's product choice onto the demo catalogue's categories.
        var CAT_MAP = {
            clothing: ['shirts', 'dresses', 'knitwear', 'sets', 'tops'],
            shoes: ['shoes'],
            bags: ['bags', 'totes'],
            accessories: ['accessories'],
            jewelry: ['jewelry'],
            outerwear: ['outerwear']
        };
        function money(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-US') + ' ₪'; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

        function buildFeed() {
            var grid = document.getElementById('feedGrid');
            var note = document.getElementById('feedNote');
            if (!grid) return;
            var all = (window.veroCollections && window.veroCollections.allProducts) ? window.veroCollections.allProducts() : [];
            // Clothing / fashion only (drop the interior-design art pieces).
            all = all.filter(function (p) { return !(p._raw && p._raw.type === 'art'); });
            var wanted = CAT_MAP[sel.product] || null;
            var matched = all;
            if (wanted) {
                matched = all.filter(function (p) {
                    return wanted.indexOf(String(p.category || '').toLowerCase()) !== -1;
                });
            }
            if (matched.length < 6) {
                // Top up with the rest so there are always 6.
                all.forEach(function (p) { if (matched.indexOf(p) === -1) matched.push(p); });
            }
            var six = matched.slice(0, 6);
            grid.innerHTML = six.map(function (p) {
                var inner = p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '" loading="lazy">' : esc(p.icon || '🛍️');
                return '<a class="fcard" href="products.html">' +
                    '<div class="fcard-img">' + inner + '</div>' +
                    '<div class="fcard-name">' + esc(p.name) + '</div>' +
                    '<div class="fcard-brand">' + esc(p.seller) + '</div>' +
                    '<div class="fcard-price">' + money(p.price) + '</div>' +
                '</a>';
            }).join('');
            if (note) {
                var bits = [];
                if (sel.gender) bits.push(sel.gender);
                if (sel.style) bits.push(sel.style);
                if (sel.product) bits.push(sel.product);
                note.textContent = bits.length ? ('Matched to: ' + bits.join(' · ')) : 'Picked for you';
            }
            // Carry the selections into the full feed.
            var enter = document.getElementById('enterFeed');
            if (enter) {
                var q = [];
                if (sel.gender) q.push('gender=' + encodeURIComponent(sel.gender));
                if (sel.product) q.push('category=' + encodeURIComponent(sel.product));
                if (sel.style) q.push('style=' + encodeURIComponent(sel.style));
                enter.setAttribute('href', 'products.html' + (q.length ? ('?' + q.join('&')) : ''));
            }
        }
    })();
    </script>

</body>
</html>
