<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse a moravchick category — its hero and a grid of pieces.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Category</title>
    <script src="vero-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Arimo:wght@400;500;600;700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="product-card.css">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: auto; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; direction: ltr;
            font-family: 'Archivo','Inter',system-ui,sans-serif; }

        /* ===== Category hero ===== */
        .cat-hero { position: relative; width: 100%; height: 56vh; min-height: 360px; overflow: hidden; background: #000; }
        .cat-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .cat-hero::after { content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.45) 100%); }
        .cat-hero-copy { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 0 20px 44px; color: #fff; }
        .cat-eyebrow { font-family: 'Arimo','Inter',sans-serif; font-size: 11px; letter-spacing: 3px;
            text-transform: uppercase; opacity: 0.85; margin-bottom: 10px; }
        .cat-title { font-family: 'Poppins','Inter',sans-serif; font-weight: 300; margin: 0;
            font-size: clamp(30px, 8vw, 56px); letter-spacing: 0.01em; }
        .cat-sub { margin: 12px 0 0; font-size: clamp(12px, 3.4vw, 15px); font-weight: 400;
            letter-spacing: 0.5px; opacity: 0.92; max-width: 560px; }

        /* ===== Grid ===== */
        .cat-wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 72px; }
        .cat-count { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; letter-spacing: 1.5px;
            text-transform: uppercase; color: #8a857c; margin: 0 0 18px; }
        .cat-grid { display: grid; gap: 22px 16px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        @media (min-width: 680px) { .cat-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
        .cat-empty { text-align: center; color: #8a857c; padding: 60px 0; font-size: 14px; letter-spacing: 0.4px; }
    </style>
</head>
<body>
    <!-- Transparent header over the hero, solid once scrolled past it. -->
    <script>
        window.veroHeaderScrolled = function () { return window.scrollY > (window.innerHeight * 0.45); };
    </script>
    <script src="header.js?v=60"></script>

    <section class="cat-hero" id="catHero">
        <img class="cat-hero-img" id="catHeroImg" alt="" />
        <div class="cat-hero-copy">
            <div class="cat-eyebrow" id="catEyebrow">moravchick</div>
            <h1 class="cat-title" id="catTitle">Collection</h1>
            <p class="cat-sub" id="catSub"></p>
        </div>
    </section>

    <main class="cat-wrap">
        <p class="cat-count" id="catCount"></p>
        <div class="cat-grid" id="catGrid"></div>
    </main>

    <div id="siteFooter"></div>

    <script src="collections.js"></script>
    <script src="footer.js"></script>
    <script>
    (function () {
        // ---- Category definitions. Each maps a circle to its hero + products.
        var CATS = {
            autumn: {
                eyebrow: 'The season', title: 'Autumn Collection',
                sub: 'This season’s edit — warm layers, soft wools and earthy tones.',
                hero: 'clothing-hero.jpg',
                pick: function (vc) { return vc.byCollection('autumn'); }
            },
            sale: {
                eyebrow: 'Up to 50% off', title: 'Sale',
                sub: 'Marked-down pieces across the shop — deepest cuts first.',
                hero: 'sale-hero.jpg',
                pick: function (vc) { return vc.onSale(); }
            },
            'new': {
                eyebrow: 'Just landed', title: 'New In',
                sub: 'The latest pieces added to the shop.',
                hero: 'gallery-hero.jpg',
                pick: function (vc) {
                    return vc.allProducts().slice().sort(function (a, b) {
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    });
                }
            },
            gender: {
                eyebrow: 'Shop by', title: 'Gender',
                sub: 'Women, men, unisex and kids — the full moravchick wardrobe.',
                hero: 'women-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            },
            magazine: {
                eyebrow: 'Editorial', title: 'Magazine',
                sub: 'Stories, shoots and the pieces behind them.',
                hero: 'magazine-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            },
            events: {
                eyebrow: 'What’s on', title: 'Events',
                sub: 'Drops, pop-ups and moravchick happenings — and what to wear to them.',
                hero: 'art-hero.jpg',
                pick: function (vc) { return vc.allProducts(); }
            }
        };

        function param(name) {
            try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
        }

        var key = (param('cat') || 'autumn').toLowerCase();
        var cfg = CATS[key] || CATS.autumn;

        document.title = 'moravchick — ' + cfg.title;
        document.getElementById('catHeroImg').src = cfg.hero;
        document.getElementById('catHeroImg').alt = cfg.title;
        document.getElementById('catEyebrow').textContent = cfg.eyebrow;
        document.getElementById('catTitle').textContent = cfg.title;
        document.getElementById('catSub').textContent = cfg.sub;

        function render() {
            var vc = window.veroCollections;
            var grid = document.getElementById('catGrid');
            var count = document.getElementById('catCount');
            if (!vc) { grid.innerHTML = '<div class="cat-empty">Loading…</div>'; return false; }
            var items = [];
            try { items = cfg.pick(vc) || []; } catch (e) { items = []; }
            var now = Date.now();
            if (!items.length) {
                grid.innerHTML = '<div class="cat-empty">Nothing here yet — check back soon.</div>';
                count.textContent = '';
                return true;
            }
            count.textContent = items.length + (items.length === 1 ? ' piece' : ' pieces');
            grid.innerHTML = items.map(function (p) { return vc.cardHTML(p, now); }).join('');
            return true;
        }

        // collections.js may load a tick later; retry briefly until it's ready.
        if (!render()) {
            var tries = 0;
            var iv = setInterval(function () {
                if (render() || ++tries > 40) clearInterval(iv);
            }, 80);
        }
    })();
    </script>
</body>
</html>
