<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The moravchick feed — one place for every piece. Browse pre-loved fashion and art, and open any item to chat with the seller.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Feed</title>
    <script src="vero-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Arimo:wght@400;500;600;700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; direction: ltr; }

        /* ===== Feed shell — nothing but the cards =====
           The top padding is set from JS so the grid clears the header plus the
           attached Art/Fashion bar (both fixed). This value is only a fallback. */
        .feed-wrap { max-width: 720px; margin: 0 auto; padding: 132px 20px 120px; }

        /* The site header already carries its own Art/Fashion toggle on the right.
           On the feed we present that control as an attached bar instead, so hide
           the in-header pill here to avoid a duplicate. */
        #siteHeader .hdr-mode-pair { display: none !important; }

        /* ===== Art / Fashion bar — attached to the bottom edge of the header =====
           Fixed, full-width, a continuation of the header: same white ground, a
           hairline divider below, a centred segmented toggle. */
        .feed-modebar {
            position: fixed; left: 0; right: 0; top: 64px; z-index: 99;
            display: flex; justify-content: center; align-items: center;
            padding: 7px 12px;
            background: rgba(255,255,255,0.92);
            -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid #ececec;
        }
        .feed-mode { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9999px; background: #f2f0ef; border: 1px solid #e4e0d6; }
        .feed-mode button { appearance: none; border: 0; background: transparent; cursor: pointer;
            font-family: 'Archivo','Poppins',sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
            color: #6b6b6b; padding: 7px 22px; border-radius: 9999px; transition: background .25s, color .25s; }
        .feed-mode button.on { background: var(--oak, #2A331B); color: #fff; }
        .feed-mode button:not(.on):hover { color: #1b1916; }

        /* ===== Product grid (the home-feed editorial card) ===== */
        .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 8px; margin: 0 -4px; }
        .cv-card { text-decoration: none; color: #1b1916; display: block; min-width: 0; text-align: left; }
        .cv-card-img { position: relative; width: 100%; aspect-ratio: 0.82; background: #F2F2F2; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cv-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .cv-card-img::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 3; background: linear-gradient(to right, #111 0 34%, rgba(0,0,0,0.12) 34% 100%); }
        .cv-card-emoji { font-size: 48px; opacity: 0.45; }
        .cv-card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 16px; }
        .cv-card-name { font-family: 'Archivo','Inter',sans-serif; font-size: 13px; line-height: 1.3; font-weight: 400; letter-spacing: 0.4px; text-transform: uppercase; color: #1b1916; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; }
        .cv-card-price { font-family: 'Archivo','Inter',sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.3px; color: #1b1916; white-space: nowrap; flex: 0 0 auto; }
        .cv-card-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; color: #8a857c; margin-top: 2px; }
        .cv-card.is-sale .cv-card-price { color: #B3433B; }
        .cv-card-was { font-family: 'Arimo','Inter',sans-serif; font-size: 11.5px; color: #a3a298; text-decoration: line-through; margin-right: 6px; }
        .cv-card-pct { position: absolute; top: 10px; right: 10px; z-index: 4; height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 5px; background: #B3433B; color: #fff; font-family: 'Archivo','Inter',sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; }

        /* Per-card entrance */
        .cv-card { opacity: 0; transform: translateY(20px); animation: cardIn .7s cubic-bezier(.16,1,.3,1) forwards; }
        @keyframes cardIn { to { opacity: 1; transform: none; } }

        .feed-empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #8a857c;
            font-family: 'Arimo','Inter',sans-serif; font-size: 14px; }

        @media (min-width: 560px) {
            .feed-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) {
            .cv-card { opacity: 1; transform: none; animation: none; }
        }
    </style>
</head>
<body>
    <!-- Shared site header (single source: header.js). It injects #siteHeader. -->
    <script src="header.js?v=60"></script>
    <script>
        // Keep the header in its solid/sticky look over the white feed.
        (function () { var h = document.getElementById('siteHeader'); if (h) h.classList.add('sticky-look'); })();
    </script>

    <!-- Art / Fashion — attached to the bottom of the header. -->
    <div class="feed-modebar" id="feedModeBar">
        <div class="feed-mode" id="feedMode" role="tablist" aria-label="Browse fashion or art">
            <button type="button" data-mode="art" role="tab">Art</button>
            <button type="button" data-mode="fashion" role="tab">Fashion</button>
        </div>
    </div>

    <!-- The feed: product cards only. -->
    <main class="feed-wrap">
        <div class="feed-grid" id="feedGrid" aria-live="polite"></div>
    </main>

    <!-- Product data layer (shared across the site). -->
    <script src="collections.js"></script>

    <!-- The one feed: filtering (via URL only) + rendering. -->
    <script>
    (function () {
        'use strict';
        var VC = window.veroCollections;
        if (!VC) return;

        // ----- State -------------------------------------------------------
        // The grid shows every piece. Optional deep-links still work so the
        // footer / 404 shortcuts land on a filtered view, but the feed itself
        // carries no visible controls beyond the header's Art/Fashion toggle.
        var params = new URLSearchParams(location.search);
        var urlMode = params.get('mode');                 // art | fashion (optional)
        if (urlMode === 'art' || urlMode === 'fashion') {
            try { localStorage.setItem('vero_category', urlMode === 'art' ? 'art' : 'clothing'); } catch (e) {}
        }
        var state = {
            mode: ((urlMode === 'art' || urlMode === 'fashion') ? urlMode
                   : (localStorage.getItem('vero_category') === 'art' ? 'art' : 'fashion')),
            view: params.get('view') || 'all',            // all | new | sale
            gender: params.get('gender') || ''            // women | men | unisex | kids | ''
        };
        if (params.get('sort') === 'recent') state.view = 'new';

        // ----- Helpers -----------------------------------------------------
        function money(n) { return (Math.round(Number(n) || 0)).toLocaleString('en-US') + ' ₪'; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
        function isArt(p) { return !!(p._raw && (p._raw.type === 'art' || p.collection === 'interiors')); }
        function genderOf(p) {
            var g = (p._raw && (p._raw.gender || p._raw.audience)) || '';
            return String(g).toLowerCase();
        }

        function hrefOf(p, d) {
            var priceNum = VC.toNum(d && d.onSale ? d.price : (d ? d.original : p.price));
            var payload = JSON.stringify({
                name: p.name, price: priceNum, icon: p.icon, cover: p.cover || '',
                category: p.category || '', seller: p.seller, rating: (p._raw && p._raw.rating) || 4.5,
                type: isArt(p) ? 'art' : 'clothing'
            });
            return 'product-showcase.html?product=' + encodeURIComponent(payload);
        }

        function card(p) {
            var d = VC.discountOf(p._raw);
            var inner = p.cover
                ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.name) + '" loading="lazy">'
                : '<span class="cv-card-emoji">' + esc(p.icon || '🛍️') + '</span>';
            var priceHTML, pct = '';
            if (d && d.onSale) {
                pct = '<span class="cv-card-pct">-' + d.percent + '%</span>';
                priceHTML = '<span class="cv-card-was">' + money(d.original) + '</span>' + money(d.price);
            } else {
                priceHTML = money(p.price);
            }
            return '<a class="cv-card' + (d && d.onSale ? ' is-sale' : '') + '" href="' + esc(hrefOf(p, d)) + '" title="' + esc(p.name) + '">' +
                '<div class="cv-card-img">' + pct + inner + '</div>' +
                '<div class="cv-card-row"><span class="cv-card-name">' + esc(p.name) + '</span>' +
                '<span class="cv-card-price">' + priceHTML + '</span></div>' +
                '<div class="cv-card-brand">' + esc(p.seller) + '</div>' +
            '</a>';
        }

        // ----- Render ------------------------------------------------------
        var gridEl = document.getElementById('feedGrid');

        function render() {
            var list;
            if (state.view === 'sale') {
                list = VC.onSale();                         // deepest cut first
            } else {
                list = VC.allProducts();
                if (state.view === 'new') {
                    list = list.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
                }
            }

            var art = (state.mode === 'art');
            list = list.filter(function (p) { return art ? isArt(p) : !isArt(p); });

            if (state.gender) {
                var byGender = list.filter(function (p) { return genderOf(p) === state.gender; });
                if (byGender.length) list = byGender;
            }

            gridEl.innerHTML = list.length
                ? list.map(card).join('')
                : '<div class="feed-empty">Nothing here yet.</div>';

            syncMode();
        }

        // ----- Art / Fashion toggle ---------------------------------------
        var modeEl = document.getElementById('feedMode');
        function syncMode() {
            [].slice.call(modeEl.querySelectorAll('button')).forEach(function (b) {
                b.classList.toggle('on', b.dataset.mode === state.mode);
            });
        }
        modeEl.addEventListener('click', function (e) {
            var b = e.target.closest ? e.target.closest('button') : null;
            if (!b) return;
            state.mode = b.dataset.mode;
            try { localStorage.setItem('vero_category', state.mode === 'art' ? 'art' : 'clothing'); } catch (err) {}
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ----- Keep the bar glued to the header's bottom edge -------------
        var modeBar = document.getElementById('feedModeBar');
        var wrap = document.querySelector('.feed-wrap');
        function placeBar() {
            var hdr = document.getElementById('siteHeader');
            if (!hdr || !modeBar) return;
            var hb = hdr.getBoundingClientRect().bottom;      // header is fixed at top
            if (hb < 0) hb = 0;
            modeBar.style.top = hb + 'px';
            if (wrap) wrap.style.paddingTop = (hb + modeBar.offsetHeight + 18) + 'px';
        }
        var raf;
        function schedulePlace() { cancelAnimationFrame(raf); raf = requestAnimationFrame(placeBar); }
        window.addEventListener('scroll', schedulePlace, { passive: true });
        window.addEventListener('resize', schedulePlace);
        if (window.ResizeObserver) {
            var hdrEl = document.getElementById('siteHeader');
            if (hdrEl) { try { new ResizeObserver(schedulePlace).observe(hdrEl); } catch (e) {} }
        }
        var tries = 0;
        (function settle() { placeBar(); if (++tries < 40) setTimeout(settle, 100); })();

        render();
    })();
    </script>

    <!-- Shared footer + reveal, as on the rest of the site. -->
    <script src="footer.js"></script>
    <script src="reveal.js" defer></script>
</body>
</html>
