<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — My Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        /* Entry: the image holds static on the left while the content slides in
           from the left — nothing covers the image on load. */
        .page-cover { display: none; }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            /* The data slides in from the left, out from behind the static image. */
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }

        /* Image on the left, at one-rectangle width, matching My Profile. */
        .side-image {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 20vw;
            background: #2a2a28 url('assets/chats-hero.jpg') center / cover no-repeat;
            filter: grayscale(1);
            border-right: 1px solid #000;
            /* Sits above the content so the data slides out from behind it. */
            z-index: 5;
        }
        @media (min-width: 1001px) { .wrap { padding-left: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 15px; color: #6b6b66; letter-spacing: 0.5px; }

        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            margin-top: 52px;
        }

        /* Thin black framed cards — same language as the rectangles. */
        .card { border: 1px solid #000; padding: 34px; }
        .card-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95; margin-bottom: 8px; }

        .total-num { font-size: 60px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
        .total-sub { margin-top: 6px; font-size: 12px; letter-spacing: 1px; color: #9a9a95; }

        .field { margin-bottom: 22px; }
        .field:last-child { margin-bottom: 0; }
        .field-val { font-size: 18px; font-weight: 400; }

        .divider { height: 1px; background: #eee; margin: 26px 0; }
        .col-right { display: flex; flex-direction: column; }

        /* Conversation threads list. */
        .chat-list { display: flex; flex-direction: column; }
        .chat-row {
            display: flex; align-items: center; gap: 16px;
            padding: 18px 0; border-bottom: 1px solid #eee;
        }
        .chat-row:last-child { border-bottom: none; }
        .chat-avatar {
            width: 50px; height: 50px; flex: 0 0 auto; border-radius: 50%;
            border: 1px solid #000; display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .chat-body { min-width: 0; flex: 1; }
        .chat-name { font-size: 15px; font-weight: 500; }
        .chat-preview {
            font-size: 13px; color: #6b6b66; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-time { margin-left: auto; font-size: 12px; color: #9a9a95; white-space: nowrap; align-self: flex-start; padding-top: 4px; }
        .chat-empty { font-size: 14px; color: #9a9a95; padding: 8px 0; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
        .stat { border: 1px solid #000; padding: 30px 24px; }
        .stat-num { font-size: 40px; font-weight: 200; line-height: 1; }
        .stat-name { margin-top: 12px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

        .chat-row { cursor: pointer; transition: background 0.15s; }
        .chat-row:hover { background: #fafafa; }

        /* Search bar beside the My Chats title. */
        .head-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .chat-search {
            border: 1.4px solid #000; background: #fff; border-radius: 999px;
            font-family: inherit; font-size: 14px; padding: 12px 20px; min-width: 260px;
            color: #1c1c1c;
        }
        .chat-search::placeholder { color: #9a9a95; letter-spacing: 0.5px; }
        .chat-search:focus { outline: none; }

        /* Conversations as a horizontal slider — exactly 5 per slide. */
        .chat-list { display: flex; overflow: hidden; }
        .chat-track { display: flex; transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); width: 100%; }
        .chat-slide { flex: 0 0 100%; display: flex; flex-direction: column; }
        .chat-list .chat-row { height: 88px; }
        .chat-nav { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
        .chat-arrow {
            width: 34px; height: 34px; border: 1.4px solid #000; border-radius: 999px; background: #fff;
            cursor: pointer; font-size: 15px; line-height: 1; color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .chat-arrow:hover:not(:disabled) { background: #000; color: #fff; }
        .chat-arrow:disabled { opacity: 0.3; cursor: default; }
        .chat-dots { display: flex; gap: 7px; margin-left: 4px; }
        .chat-dots .d { width: 7px; height: 7px; border-radius: 50%; background: #ddd; border: none; cursor: pointer; padding: 0; transition: background 0.2s; }
        .chat-dots .d.on { background: #111; }

        /* ===== My offers — Depop-style cubes below the chats ===== */
        /* Two columns below the chat list: offers you made | offers you received. */
        .offers-split { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; margin-top: 44px; }
        @media (max-width: 900px) { .offers-split { grid-template-columns: 1fr; gap: 30px; } }
        .offers-split .offers-sec { margin-top: 0; }
        .offers-split .offers-grid { grid-template-columns: 1fr; }
        .offers-sec { margin-top: 44px; }
        .offers-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
        /* Larger section titles for the two offers columns. */
        .offers-head .card-label { font-size: 20px; letter-spacing: 3px; color: #1c1c1c; }
        @media (max-width: 600px) { .offers-head .card-label { font-size: 16px; } }
        .offers-note { font-size: 12px; letter-spacing: 0.5px; color: #9a9a95; }
        .offers-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }
        .offer-cube { border: 1px solid #000; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
        .oc-top { display: flex; gap: 16px; align-items: center; }
        .oc-img {
            width: 66px; height: 66px; flex: 0 0 auto; border: 1px solid #000;
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            background: #f4f4f2; overflow: hidden;
        }
        .oc-img img { width: 100%; height: 100%; object-fit: cover; }
        .oc-info { min-width: 0; flex: 1; }
        .oc-name { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .oc-seller { font-size: 12px; color: #9a9a95; letter-spacing: 0.5px; margin-top: 2px; }
        .oc-prices { display: flex; gap: 16px; margin-top: 10px; }
        .oc-ask { font-size: 13px; color: #6b6b66; }
        .oc-your { font-size: 13px; font-weight: 600; color: #1c1c1c; }
        .oc-your b { font-weight: 600; }

        .oc-others { border-top: 1px solid #eee; padding-top: 12px; }
        .oc-others-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a9a95; margin-bottom: 8px; }
        .oc-other { display: flex; justify-content: space-between; font-size: 13px; color: #6b6b66; padding: 3px 0; }
        .oc-other .amt { font-weight: 500; color: #1c1c1c; }
        .oc-other.top .amt { color: #1f8f4e; }

        .oc-edit {
            align-self: flex-start; border: 1px solid #000; background: #fff; cursor: pointer;
            font-family: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 20px; border-radius: 999px; transition: background 0.2s, color 0.2s;
        }
        .oc-edit:hover { background: #000; color: #fff; }
        .oc-editbox { display: none; flex-direction: column; gap: 10px; }
        .oc-editbox.open { display: flex; }
        .oc-input {
            border: none; border-bottom: 1.4px solid #000; background: transparent;
            font-family: inherit; font-size: 18px; padding: 8px 2px; color: #1c1c1c;
        }
        .oc-input:focus { outline: none; }
        .oc-submit {
            align-self: flex-start; border: 1px solid #000; background: #000; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 11px 22px; border-radius: 999px; transition: opacity 0.2s;
        }
        .oc-submit:hover { opacity: 0.8; }
        .offers-empty { font-size: 14px; color: #9a9a95; padding: 8px 0; }

        /* Received-offer actions: accept / decline + resolved state. */
        .oc-actions { display: flex; gap: 10px; }
        .oc-accept, .oc-decline {
            border: 1px solid #000; cursor: pointer; font-family: inherit;
            font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 20px; border-radius: 999px; transition: background 0.2s, color 0.2s, opacity 0.2s;
        }
        .oc-accept { background: #000; color: #fff; }
        .oc-accept:hover { opacity: 0.82; }
        .oc-decline { background: #fff; color: #1c1c1c; }
        .oc-decline:hover { background: #f0f0f0; }
        .oc-resolved {
            align-self: flex-start; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 18px; border-radius: 999px;
        }
        .oc-resolved.accepted { background: #e8f5ec; color: #1f8f4e; border: 1px solid #bfe4cd; }
        .oc-resolved.declined { background: #f4eaea; color: #b23b3b; border: 1px solid #e6cccc; }
        .oc-buyer { font-size: 13px; color: #6b6b66; }
        .oc-buyer b { font-weight: 600; color: #1c1c1c; }

        /* ===== Slide-in chat panel — one conversation with a seller ===== */
        .chat-panel {
            position: fixed; inset: 0; z-index: 70;
            background: #fff; display: flex; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.45s cubic-bezier(0.65, 0.05, 0.1, 1);
        }
        .chat-panel.open { transform: translateX(0); }
        .cp-head {
            display: flex; align-items: center; gap: 16px;
            padding: 20px clamp(20px, 5vw, 60px); border-bottom: 1px solid #000;
        }
        .cp-back {
            border: 1.4px solid #000; border-radius: 999px; background: #fff; cursor: pointer;
            font-family: inherit; font-size: 12px; letter-spacing: 1.5px; padding: 10px 18px;
            transition: background 0.2s, color 0.2s;
        }
        .cp-back:hover { background: #000; color: #fff; }
        .cp-avatar {
            width: 46px; height: 46px; border-radius: 50%; border: 1px solid #000;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .cp-who { line-height: 1.2; }
        .cp-name { font-size: 17px; font-weight: 500; }
        .cp-status { font-size: 12px; color: #9a9a95; letter-spacing: 0.3px; }
        .cp-feed {
            flex: 1; overflow-y: auto; background: #fafafa;
            padding: 30px clamp(20px, 5vw, 60px);
            display: flex; flex-direction: column; gap: 12px;
        }
        .cp-bubble {
            max-width: 68%; padding: 12px 16px; font-size: 14px; line-height: 1.5;
            border: 1px solid #000; animation: bubbleIn 0.35s ease both;
        }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .cp-bubble.seller { align-self: flex-start; background: #fff; color: #1c1c1c; }
        .cp-bubble.buyer  { align-self: flex-end; background: #000; color: #fff; border-color: #000; }
        .cp-time { display: block; margin-top: 6px; font-size: 10px; letter-spacing: 0.5px; opacity: 0.55; }
        .cp-input-row {
            display: flex; gap: 12px; padding: 20px clamp(20px, 5vw, 60px);
            border-top: 1px solid #000; background: #fff;
        }
        .cp-input {
            flex: 1; border: 1px solid #000; background: #fff; font-family: inherit;
            font-size: 14px; padding: 13px 16px;
        }
        .cp-input:focus { outline: none; }
        .cp-send {
            border: 1px solid #000; background: #000; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 12px; letter-spacing: 1.5px; padding: 0 26px;
            transition: opacity 0.2s;
        }
        .cp-send:hover { opacity: 0.75; }

        @media (max-width: 780px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr; }
            .cp-bubble { max-width: 82%; }
        }
    </style>
</head>
<body>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back" href="buyer-area.html">&#8592; חזרה</a>

    <div class="wrap">
        <div class="head-row">
            <h1 class="head-title">My Chats</h1>
            <input class="chat-search" id="chatSearch" type="text" placeholder="Search sellers…" autocomplete="off">
        </div>
        <p class="head-sub">Your conversations with sellers and buyers.</p>

        <div class="grid">
            <!-- Left: conversation overview -->
            <div class="card">
                <div class="card-label">Active chats</div>
                <div class="total-num" id="activeNum">0</div>
                <div class="total-sub" id="activeSub">with 0 sellers</div>

                <div class="divider"></div>

                <div class="field">
                    <div class="card-label">Threads</div>
                    <div class="field-val" id="threadCount">0</div>
                </div>
                <div class="field">
                    <div class="card-label">Sellers</div>
                    <div class="field-val" id="sellerCount">0</div>
                </div>
                <div class="field">
                    <div class="card-label">Last active</div>
                    <div class="field-val" id="lastActive">—</div>
                </div>
            </div>

            <!-- Right: thread list + stats -->
            <div class="col-right">
                <div class="card">
                    <div class="card-label">Conversations</div>
                    <div class="chat-list" id="chatList"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Slide-in chat panel — one conversation with a seller. -->
    <div class="chat-panel" id="chatPanel">
        <div class="cp-head">
            <button class="cp-back" id="cpBack">&#8594; חזרה</button>
            <div class="cp-avatar" id="cpAvatar">💬</div>
            <div class="cp-who">
                <div class="cp-name" id="cpName">Seller</div>
                <div class="cp-status">Usually replies within a day</div>
            </div>
        </div>
        <div class="cp-feed" id="cpFeed"></div>
        <div class="cp-input-row">
            <input class="cp-input" id="cpInput" type="text" placeholder="Write a message…" autocomplete="off">
            <button class="cp-send" id="cpSend">SEND</button>
        </div>
    </div>

    <script>
        // Route "back" to whichever area we arrived from — seller or buyer.
        if (new URLSearchParams(location.search).get('from') === 'seller') {
            document.querySelector('.head-title').textContent = 'Buyer Chats';
            const back = document.querySelector('.back');
            if (back) back.setAttribute('href', 'seller-area.html');
        }

        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const cart   = readJSON('vero_cart', []);
        const offers = readJSON('vero_offers', []);
        const items  = Array.isArray(cart) ? cart : [];
        const offs   = Array.isArray(offers) ? offers : [];
        const nis = n => '₪' + Math.round(n).toLocaleString('en-US');

        // Build one conversation thread per seller, drawn from offers first
        // (they carry a real message + timestamp) then any cart items.
        const threads = new Map();
        const touch = (seller, name, icon, at, preview) => {
            const key = seller || 'VERO';
            const t = threads.get(key) || { seller: key, icon: icon || '💬', at: 0, preview: '' };
            if (icon) t.icon = icon;
            if (at && at >= t.at) { t.at = at; t.preview = preview; }
            if (!t.preview) t.preview = preview;
            threads.set(key, t);
        };
        offs.forEach(o => touch(o.seller, o.name, '💬', o.at,
            `You offered ${nis(o.offer)}${o.askPrice ? ` · asking ${nis(o.askPrice)}` : ''} — ${o.name || 'item'}`));
        items.forEach(it => touch(it.seller, it.name, it.icon, it.addedAt,
            `About “${it.name || 'item'}” in your cart`));

        // A few standing conversations so the inbox always has sellers to browse.
        const H = 3600 * 1000, D = 24 * H;
        const DEMO = [
            { seller: 'Designer Collection', icon: '👗', at: Date.now() - 2 * H,  preview: 'The cocktail dress is still available.' },
            { seller: 'Vintage Vault',       icon: '🧥', at: Date.now() - 5 * H,  preview: 'I can hold the denim jacket for you.' },
            { seller: 'Studio Vero',         icon: '🏺', at: Date.now() - 1 * D,  preview: 'Thanks for your purchase! 🌿' },
            { seller: 'Luxe Atelier',        icon: '👜', at: Date.now() - 2 * D,  preview: 'New bags arriving this week.' },
            { seller: 'Art House',           icon: '🎨', at: Date.now() - 3 * D,  preview: 'The painting ships tomorrow.' },
            { seller: 'Sole Society',        icon: '👟', at: Date.now() - 4 * D,  preview: 'Size 42 is back in stock.' },
        ];
        DEMO.forEach(d => touch(d.seller, d.seller, d.icon, d.at, d.preview));

        // Conversations created elsewhere (e.g. checkout in the cart) live in
        // vero_chats — surface each of those sellers with their latest message.
        const chatStore = readJSON('vero_chats', {});
        Object.entries(chatStore).forEach(([seller, msgs]) => {
            if (Array.isArray(msgs) && msgs.length) {
                const lastM = msgs[msgs.length - 1];
                touch(seller, seller, '💬', lastM.at || Date.now(), lastM.content);
            }
        });

        const list = [...threads.values()].sort((a, b) => b.at - a.at);
        const sellers = list.length;

        const timeAgo = ms => {
            if (!ms) return '';
            const d = Math.floor((Date.now() - ms) / 1000);
            if (d < 60) return 'now';
            if (d < 3600) return Math.floor(d / 60) + 'm';
            if (d < 86400) return Math.floor(d / 3600) + 'h';
            return Math.floor(d / 86400) + 'd';
        };
        const lastAt = list.reduce((m, t) => Math.max(m, t.at || 0), 0);

        document.getElementById('activeNum').textContent  = sellers;
        document.getElementById('activeSub').textContent  = `with ${sellers} seller${sellers === 1 ? '' : 's'}`;
        document.getElementById('threadCount').textContent = list.length;
        document.getElementById('sellerCount').textContent = sellers;
        document.getElementById('lastActive').textContent  = lastAt ? (timeAgo(lastAt) + ' ago') : '—';

        const el = document.getElementById('chatList');
        let chatSlide = 0;
        const CHATS_PER_SLIDE = 5;
        function renderList(query = '') {
            const q = query.trim().toLowerCase();
            // Only sellers that exist in the chat inbox are searchable.
            const rows = list
                .map((t, i) => ({ t, i }))
                .filter(({ t }) => !q || t.seller.toLowerCase().includes(q));
            const oldNav = document.getElementById('chatNav');
            if (oldNav) oldNav.remove();
            if (!list.length) {
                el.innerHTML = '<div class="chat-empty">No conversations yet — start one from any product page.</div>';
                return;
            }
            if (!rows.length) {
                el.innerHTML = `<div class="chat-empty">No sellers match “${query}”.</div>`;
                return;
            }
            // Exactly five conversations per slide.
            const slides = [];
            for (let i = 0; i < rows.length; i += CHATS_PER_SLIDE) slides.push(rows.slice(i, i + CHATS_PER_SLIDE));
            if (chatSlide >= slides.length) chatSlide = 0;
            el.innerHTML = '<div class="chat-track" id="chatTrack">' + slides.map(group =>
                '<div class="chat-slide">' + group.map(({ t, i }) => `
                    <div class="chat-row" data-i="${i}">
                        <div class="chat-avatar">${t.icon}</div>
                        <div class="chat-body">
                            <div class="chat-name">${t.seller}</div>
                            <div class="chat-preview">${t.preview}</div>
                        </div>
                        <div class="chat-time">${timeAgo(t.at)}</div>
                    </div>`).join('') + '</div>').join('') + '</div>';

            const track = document.getElementById('chatTrack');
            let nav = null;
            function go(n) {
                chatSlide = Math.max(0, Math.min(slides.length - 1, n));
                track.style.transform = `translateX(-${chatSlide * 100}%)`;
                if (nav) {
                    nav.querySelector('.prev').disabled = chatSlide === 0;
                    nav.querySelector('.next').disabled = chatSlide === slides.length - 1;
                    nav.querySelectorAll('.chat-dots .d').forEach((d, j) => d.classList.toggle('on', j === chatSlide));
                }
            }
            if (slides.length > 1) {
                nav = document.createElement('div');
                nav.className = 'chat-nav'; nav.id = 'chatNav';
                nav.innerHTML = `
                    <button class="chat-arrow prev" aria-label="Previous">&#8249;</button>
                    <button class="chat-arrow next" aria-label="Next">&#8250;</button>
                    <div class="chat-dots">${slides.map((_, i) => `<button class="d${i === 0 ? ' on' : ''}" aria-label="Slide ${i + 1}"></button>`).join('')}</div>`;
                el.after(nav);
                nav.querySelector('.prev').addEventListener('click', () => go(chatSlide - 1));
                nav.querySelector('.next').addEventListener('click', () => go(chatSlide + 1));
                nav.querySelectorAll('.chat-dots .d').forEach((d, i) => d.addEventListener('click', () => go(i)));
            }
            go(chatSlide);
        }
        renderList();
        el.addEventListener('click', (e) => {
            const row = e.target.closest('.chat-row');
            if (row) openChat(+row.dataset.i);
        });
        // Search sellers — restricted to those already in the chat inbox.
        document.getElementById('chatSearch').addEventListener('input', (e) => renderList(e.target.value));

        // ===== Chat with a seller — persisted to vero_chats, works like the deal room =====
        const CHATS = readJSON('vero_chats', {});   // { sellerName: [ {sender, content, at} ] }
        const saveChats = () => localStorage.setItem('vero_chats', JSON.stringify(CHATS));
        const panel = document.getElementById('chatPanel');
        const feedEl = document.getElementById('cpFeed');
        const inputEl = document.getElementById('cpInput');
        let openSeller = null;

        // Canned seller replies, cycled for a life-like conversation.
        const SELLER_LINES = [
            'Hi! Thanks for reaching out — how can I help?',
            'Yes, it\'s still available. Would you like to arrange a pickup?',
            'I can hold it for you until tomorrow evening.',
            'The condition is excellent, barely worn. Happy to send more photos.',
            'Sure, let me check and get back to you shortly.',
        ];

        const timeShort = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

        function seedThread(t) {
            // First time opening: seed with the thread's preview as a seller message.
            if (!CHATS[t.seller] || !CHATS[t.seller].length) {
                CHATS[t.seller] = [{ sender: 'seller', content: t.preview || `Hi, this is ${t.seller}. How can I help?`, at: t.at || Date.now() }];
                saveChats();
            }
        }

        function renderFeed() {
            const msgs = CHATS[openSeller] || [];
            feedEl.innerHTML = msgs.map(m => `
                <div class="cp-bubble ${m.sender}">${m.content}
                    <span class="cp-time">${timeShort(m.at)}</span>
                </div>`).join('');
            feedEl.scrollTop = feedEl.scrollHeight;
        }

        function openChat(i) {
            const t = list[i];
            openSeller = t.seller;
            seedThread(t);
            document.getElementById('cpName').textContent = t.seller;
            document.getElementById('cpAvatar').textContent = t.icon || '💬';
            renderFeed();
            panel.classList.add('open');
            setTimeout(() => inputEl.focus(), 300);
        }

        function closeChat() { panel.classList.remove('open'); openSeller = null; }

        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !openSeller) return;
            CHATS[openSeller].push({ sender: 'buyer', content: text, at: Date.now() });
            saveChats();
            inputEl.value = '';
            renderFeed();
            // Seller auto-reply, so the conversation feels alive.
            const reply = SELLER_LINES[CHATS[openSeller].filter(m => m.sender === 'seller').length % SELLER_LINES.length];
            setTimeout(() => {
                if (openSeller && CHATS[openSeller]) {
                    CHATS[openSeller].push({ sender: 'seller', content: reply, at: Date.now() });
                    saveChats();
                    renderFeed();
                }
            }, 900);
        }

        document.getElementById('cpBack').addEventListener('click', closeChat);
        document.getElementById('cpSend').addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('open')) closeChat(); });

        // Exit mirrors the entry: the image holds static while the data slides
        // back out to the left, then the personal area loads.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.55s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            wrap.style.opacity = '0';
            wrap.style.transform = 'translateX(-18vw)';
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
