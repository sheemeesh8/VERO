<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Centered Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: #8a877f; font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: #8a877f; line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 600px; border-radius: 28px; overflow: hidden; position: relative; background: #111; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 780px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #111; color: #fff; }
.hero { position: absolute; inset: 0; background: url('../hero-beach.jpg') center / cover no-repeat; }
.wash { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.8)); }
.top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 3; display: flex; justify-content: space-between; align-items: center; }
.top b { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; }
.top svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.4; }
.center { position: absolute; left: 26px; right: 26px; top: 50%; transform: translateY(-50%); z-index: 2; text-align: center; }
.avimg { display: block; background: url('../women-hero.jpg') 50% 26% / cover no-repeat; }
.av { display: block; width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 16px; }
.av .avimg { width: 100%; height: 100%; border-radius: 50%; }
.kick { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.85; }
.nm { font-size: 30px; margin-top: 4px; }
.v { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--v); color: #fff; font-size: 11px; font-weight: 700; vertical-align: middle; }
.bio { font-size: 13px; opacity: 0.8; margin-top: 6px; }
.stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
.stat b { display: block; font-size: 19px; font-weight: 700; } .stat span { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }

/* S1 — clean thin ring */
.s1 .av { border: 3px solid #fff; }

/* S2 — verified gradient ring */
.s2 .av { padding: 5px; background: conic-gradient(var(--v), #f0a, var(--v)); }
.s2 .av .avimg { border: 3px solid #111; }

/* S3 — double hairline ring */
.s3 .av { border: 1px solid rgba(255,255,255,0.6); padding: 7px; }
.s3 .av .avimg { border: 2px solid #fff; }

/* S4 — soft, no ring, big shadow */
.s4 .av { box-shadow: 0 16px 40px rgba(0,0,0,0.5); }

/* S5 — name above, avatar below */
.s5 .center { }
.s5 .nm { font-size: 34px; margin-bottom: 18px; }
.s5 .av { border: 3px solid #fff; }
.s5 .stats { margin-top: 20px; }

/* S6 — fine line */
.s6 .av { width: 140px; height: 140px; border: 1px solid #fff; }
.s6 .kick { letter-spacing: 5px; }
.s6 .nm { font-weight: 400; letter-spacing: 6px; text-transform: uppercase; font-size: 20px; margin-top: 10px; }
.s6 .stats { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.3); }
.s6 .stat b { font-weight: 400; }

/* S7 — avatar in a soft white disc card */
.s7 .center { background: rgba(255,255,255,0.08); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.18); border-radius: 24px; padding: 30px 24px; }
.s7 .av { border: 3px solid #fff; }

/* S8 — light card bottom, avatar overlaps centre */
.s8 .hero { bottom: 300px; }
.s8 .wash { bottom: 300px; background: rgba(0,0,0,0.25); }
.s8 .card { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #fff; color: #111; text-align: center; padding: 86px 26px 0; }
.s8 .av { position: absolute; left: 50%; top: 330px; transform: translateX(-50%); border: 4px solid #fff; z-index: 3; }
.s8 .nm { color: #111; } .s8 .bio { color: #555; opacity: 1; }
.s8 .stats { margin-top: 22px; } .s8 .stat span { color: #8a877f; opacity: 1; }
</style>
</head>
<body>
<h1>Profile — תמונה במרכז</h1>
<p class="sub">אווטאר ממורכז · 8 סגנונות</p>
<div class="grid" id="grid"></div>

<script>
var ARR = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var top = '<div class="top"><b>My Profile</b>' + ARR + '</div>';
var av = '<span class="av"><span class="avimg"></span></span>';
var stats = '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div>';
var name = '<div class="nm">My Profile <span class="v">v</span></div>';
var bioEl = '<div class="bio">A short line about you.</div>';

function base(cls, inner) { return '<div class="screen ' + cls + '"><div class="hero"></div><div class="wash"></div>' + top + inner + '</div>'; }
var std = function (cls) { return base(cls, '<div class="center">' + av + name + bioEl + stats + '</div>'); };

var OPTS = [
  ['S1 · טבעת לבנה נקייה', 'אווטאר ממורכז עם טבעת לבנה דקה, שם וביו מתחתיו וסטטיסטיקות בשורה. נקי וקלאסי.', std('s1')],
  ['S2 · טבעת מאומתת', 'טבעת בצבע כתום-ורוד (gradient) מסביב לאווטאר, בסגנון "מאומת/חם". מדגיש שהפרופיל פעיל.', std('s2')],
  ['S3 · טבעת כפולה דקה', 'שתי טבעות דקות סביב האווטאר. עדין ומוקפד, תחושת פרימיום.', std('s3')],
  ['S4 · רך בלי טבעת', 'בלי מסגרת בכלל, רק צל רך גדול מתחת לאווטאר. מודרני ומינימלי.', std('s4')],
  ['S5 · שם מעל התמונה', 'השם הגדול למעלה, האווטאר ממורכז מתחתיו, והסטטיסטיקות בתחתית. הטיפוגרפיה מובילה.',
   base('s5', '<div class="center">' + name + av + stats + '</div>')],
  ['S6 · קו דק', 'טבעת 1px, שם מרווח באותיות גדולות, וסטטיסטיקות על קו דק. "גלריה", הכי מאופק.', std('s6')],
  ['S7 · כרטיס זכוכית', 'האווטאר והפרטים בתוך כרטיס מטושטש שקוף במרכז. מרגיש כמו אפליקציה מודרנית.', std('s7')],
  ['S8 · חצי עליון תמונה, חצי תחתון לבן', 'הירו למעלה, כרטיס לבן למטה, והאווטאר חוצה את הקו במרכז. ניגוד נקי בין התמונה למידע.',
   '<div class="screen s8"><div class="hero"></div><div class="wash"></div>' + top + '<span class="av"><span class="avimg"></span></span><div class="card">' + name + bioEl + stats + '</div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
