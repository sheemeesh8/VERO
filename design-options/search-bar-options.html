<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Bar Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #9a9a9a; --line: #e4e1dc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: #77736c; font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: #77736c; line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 420px; border-radius: 26px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 546px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); padding: 0 28px; }
.x { position: absolute; top: 30px; right: 28px; width: 22px; height: 22px; stroke: #111; stroke-width: 1.6; fill: none; }
.lab { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 4px; }
.mag { width: 22px; height: 22px; stroke: #111; stroke-width: 1.3; fill: none; flex: none; }
.ph { color: var(--muted); font-size: 16px; font-weight: 500; }
.stack { padding-top: 84px; display: flex; flex-direction: column; gap: 22px; }

/* A — current pill */
.a .f { display: flex; align-items: center; gap: 14px; border: 1.5px solid #111; border-radius: 999px; height: 64px; padding: 0 26px; }
.a .f .ph { flex: 1; }

/* B — underline */
.b .f { display: flex; align-items: center; gap: 14px; border-bottom: 1.5px solid #111; height: 54px; padding: 0 2px; }
.b .f .ph { flex: 1; }
.b .mag { stroke-width: 1.2; }

/* C — soft filled */
.c .f { display: flex; align-items: center; gap: 14px; background: #f4f2ee; border-radius: 16px; height: 62px; padding: 0 22px; }
.c .f .ph { flex: 1; }

/* D — floating label, icon left */
.d .f { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 20px; position: relative; }
.d .f .fl { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.d .f .ir { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.d .f .ir .ph { flex: 1; }

/* E — segmented one bar */
.e .seg { display: flex; border: 1.5px solid #111; border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.e .seg span { flex: 1; text-align: center; padding: 13px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
.e .seg span.on { background: #111; color: #fff; }
.e .f { display: flex; align-items: center; gap: 14px; border: 1.5px solid #111; border-radius: 999px; height: 64px; padding: 0 26px; }
.e .f .ph { flex: 1; }

/* F — fine line */
.f2 .f { display: flex; align-items: center; gap: 14px; border: 1px solid #111; border-radius: 999px; height: 56px; padding: 0 24px; }
.f2 .f .ph { flex: 1; font-weight: 400; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
.f2 .mag { stroke-width: 1; }

/* G — boxed rounded-rect, icon left, soft shadow */
.g .f { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; height: 60px; padding: 0 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.05); }
.g .f .ph { flex: 1; }

/* H — oversized editorial */
.h .f { border-bottom: 1px solid #111; padding: 0 2px 12px; }
.h .f .ph { font-size: 30px; font-weight: 400; letter-spacing: -0.5px; color: #c9c6c0; }
.h .f small { display: block; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
</style>
</head>
<body>
<h1>Search — שורות חיפוש</h1>
<p class="sub">מסך החיפוש (מוצר + משתמשים) · 8 כיווני עיצוב</p>
<div class="grid" id="grid"></div>

<script>
var MAG = '<svg class="mag" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
var X = '<svg class="x" viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

var OPTS = [
  ['A · גלולה (הקיים)', 'מסגרת שחורה מלאה בצורת גלולה, אייקון מימין. לנקודת השוואה.',
   '<div class="screen a">' + X + '<div class="stack"><div class="f"><span class="ph">Search for a product</span>' + MAG + '</div><div class="f"><span class="ph">Search users</span>' + MAG + '</div></div></div>'],

  ['B · קו תחתון', 'בלי תיבה — רק קו דק מתחת לטקסט. נקי, מינימלי ו"גלריה". אייקון מימין.',
   '<div class="screen b">' + X + '<div class="stack"><div class="f"><span class="ph">Search for a product</span>' + MAG + '</div><div class="f"><span class="ph">Search users</span>' + MAG + '</div></div></div>'],

  ['C · מילוי רך', 'רקע אפור בהיר במקום מסגרת, פינות מעט מעוגלות. רך ומודרני, פחות "כבד".',
   '<div class="screen c">' + X + '<div class="stack"><div class="f">' + MAG + '<span class="ph">Search for a product</span></div><div class="f">' + MAG + '<span class="ph">Search users</span></div></div></div>'],

  ['D · תווית צפה', 'תווית קטנה מעל כל שדה (Product / Users) ואייקון משמאל. הכי ברור מה כל שדה מחפש.',
   '<div class="screen d">' + X + '<div class="stack"><div class="f"><div class="fl">Product</div><div class="ir">' + MAG + '<span class="ph">Search for a product</span></div></div><div class="f"><div class="fl">Users</div><div class="ir">' + MAG + '<span class="ph">Search users</span></div></div></div></div>'],

  ['E · מתג + שדה אחד', 'מתג Products / Users למעלה, ושדה חיפוש אחד שמתחלף לפי הבחירה. חוסך מקום, שדה אחד בכל רגע.',
   '<div class="screen e">' + X + '<div class="stack" style="padding-top:70px"><div><div class="seg"><span class="on">Products</span><span>Users</span></div><div class="f"><span class="ph">Search for a product</span>' + MAG + '</div></div></div></div>'],

  ['F · קו דק', 'כמו הגלולה אבל בקו דק (1px) ונמוך יותר, עם placeholder מרווח באותיות גדולות. תואם לקו הדק שבאתר.',
   '<div class="screen f2">' + X + '<div class="stack"><div class="f"><span class="ph">Product</span>' + MAG + '</div><div class="f"><span class="ph">Users</span>' + MAG + '</div></div></div>'],

  ['G · תיבה מרובעת', 'מלבן מעוגל עם צל רך ואייקון משמאל, בסגנון אפליקציה מוכר. ידידותי ונוח ללחיצה.',
   '<div class="screen g">' + X + '<div class="stack"><div class="f">' + MAG + '<span class="ph">Search for a product</span></div><div class="f">' + MAG + '<span class="ph">Search users</span></div></div></div>'],

  ['H · ענק עריכתי', 'בלי תיבה, placeholder ענק עם תווית קטנה וקו תחתון. דרמטי ו"מגזין", מתאים למסך חיפוש מלא.',
   '<div class="screen h">' + X + '<div class="stack" style="gap:34px"><div class="f"><small>Product</small><span class="ph">Search…</span></div><div class="f"><small>Users</small><span class="ph">Search…</span></div></div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
