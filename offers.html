<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16150f; --muted:#8f8d86; --line:#e6e4de; --soft:#f6f5f2; --accent:#b23b3b; --ok:#1f8f4e; --wait:#b7791f; --bg:#fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 84px 18px 90px; }
  html.is-embed .wrap { padding: 16px 16px 120px; }

  /* ---- Top row: side switch + rules ---- */
  .toprow { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; color: var(--muted); padding: 8px 15px; min-height: 38px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; }
  .toprow .grow { flex: 1; }
  .rules { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 14px; min-height: 38px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .rules svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

  /* ---- Numbers ---- */
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; }
  .nums div { padding: 14px 8px; text-align: center; }
  .nums div + div { border-left: 1px solid var(--line); }
  .nums b { display: block; font-family: 'Bodoni Moda', Georgia, serif; font-size: 24px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .nums span { font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 14px; min-height: 36px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--muted); }
  .tab.on { border-color: var(--ink); color: var(--ink); font-weight: 500; }
  .tab i { font-style: normal; opacity: 0.6; margin-left: 4px; }

  /* ---- Negotiation card ---- */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: #fff; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
  .card:hover { border-color: #cfccc4; box-shadow: 0 8px 26px rgba(0,0,0,0.06); }
  .card.mine { border-color: var(--ink); }
  .c-top { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
  .thumb { width: 52px; height: 64px; border-radius: 10px; background: var(--soft) center / cover; display: grid; place-items: center; font-size: 26px; overflow: hidden; }
  .c-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-who { font-size: 11.5px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .chip.me { background: var(--ink); color: #fff; }
  .chip.them { background: #fbf3e2; color: var(--wait); }
  .chip.accepted { background: #e6f4ec; color: var(--ok); }
  .chip.declined, .chip.expired, .chip.withdrawn { background: #f7e9e8; color: var(--accent); }
  .c-price { text-align: right; }
  .c-price b { display: block; font-family: 'Bodoni Moda', Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .c-price s { font-size: 11px; color: var(--muted); }

  /* ---- Price track: where each side stands between the floor and the ask ---- */
  .track { position: relative; height: 34px; margin: 14px 4px 2px; }
  .track::before { content: ''; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 999px; background: var(--soft); }
  .track .fill { position: absolute; top: 9px; height: 4px; border-radius: 999px; background: #d8d5cd; }
  .track .pin { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--ink); background: #fff; }
  .track .pin.me { background: var(--ink); }
  .track .pin.deal { background: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
  .track .pin span { position: absolute; top: 17px; left: 50%; transform: translateX(-50%); font-size: 9.5px; white-space: nowrap; color: var(--muted); }
  .track .pin.edge-l span { left: 0; transform: none; }
  .track .pin.edge-r span { left: auto; right: 0; transform: none; }
  .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .c-foot .urgent { color: var(--accent); font-weight: 500; }
  .quick { display: flex; gap: 8px; margin-top: 12px; }
  .btn { border: 1px solid var(--ink); background: #fff; border-radius: 999px; padding: 0 16px; min-height: 42px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.quiet { border-color: var(--line); color: var(--muted); }
  .btn.grow { flex: 1; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .empty { border: 1px dashed #cfccc4; border-radius: 18px; padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---- Deal room (bottom sheet) ---- */
  .veil { position: fixed; inset: 0; z-index: 70; background: rgba(20,18,16,0.45); display: none; align-items: flex-end; justify-content: center; }
  .veil.open { display: flex; animation: fade 0.2s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .room { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up 0.28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes up { from { transform: translateY(26px); } to { transform: none; } }
  .r-top { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .r-top .thumb { width: 44px; height: 54px; font-size: 22px; }
  .x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; line-height: 1; }
  .r-body { overflow-y: auto; padding: 14px 16px; flex: 1; -webkit-overflow-scrolling: touch; }
  .r-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .thread { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .ev { max-width: 80%; padding: 10px 13px; border-radius: 16px; font-size: 13px; background: var(--soft); align-self: flex-start; border-bottom-left-radius: 4px; }
  .ev.me { align-self: flex-end; background: var(--ink); color: #fff; border-radius: 16px; border-bottom-right-radius: 4px; }
  .ev .who { display: block; font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px; }
  .ev .amt { font-family: 'Bodoni Moda', Georgia, serif; font-size: 20px; font-weight: 500; line-height: 1.2; }
  .ev .tag { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; margin-left: 6px; opacity: 0.75; vertical-align: middle; }
  .ev .note { display: block; margin-top: 3px; opacity: 0.85; }
  .ev time { display: block; font-size: 10px; opacity: 0.5; margin-top: 3px; }
  .ev.sys { align-self: center; max-width: 100%; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .ev.sys.good { border-color: #bfe0cc; color: var(--ok); background: #f1f9f4; }
  .typing { align-self: flex-start; font-size: 11.5px; color: var(--muted); padding: 4px 2px; }
  .typing::after { content: '…'; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  .r-foot { flex: none; border-top: 1px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .r-actions { display: flex; gap: 8px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .err { font-size: 12px; color: var(--accent); margin-top: 8px; min-height: 0; }

  /* ---- Counter composer ---- */
  .comp-amt { display: flex; align-items: baseline; justify-content: center; gap: 4px; font-family: 'Bodoni Moda', Georgia, serif; }
  .comp-amt span { font-size: 22px; }
  .comp-amt input { width: 150px; border: 0; outline: none; text-align: center; font: inherit; font-size: 40px; font-weight: 500; color: var(--ink); background: none; -moz-appearance: textfield; }
  .comp-amt input::-webkit-outer-spin-button, .comp-amt input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .comp-sub { text-align: center; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .comp input[type="range"] { width: 100%; accent-color: var(--ink); }
  .comp-ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 12px; min-height: 34px; font-size: 11.5px; cursor: pointer; }
  .chips button:hover { border-color: var(--ink); }
  .comp-note { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 13px; outline: none; margin-bottom: 10px; }
  .comp-note:focus { border-color: var(--ink); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 12px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--ink); }

  /* ---- Rules sheet ---- */
  .rule { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rule:last-child { border-bottom: 0; }
  .rule-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rule-top b { font-size: 13.5px; font-weight: 500; }
  .rule p { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .rule input[type="range"] { width: 100%; accent-color: var(--ink); margin-top: 10px; }
  .sw { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #d9d7d1; position: relative; cursor: pointer; transition: background 0.2s; flex: none; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .sw:checked { background: var(--ink); }
  .sw:checked::after { transform: translateX(18px); }
</style>

<body>
    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->
    <header class="page-header">
        <div class="ph-name" role="heading" aria-level="1">Negotiation</div>
        <a class="ph-back" id="phBack" href="seller-area.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </header>

  <main class="wrap">
    <div class="toprow">
      <div class="seg" id="sideSeg">
        <button type="button" data-side="selling">Selling</button>
        <button type="button" data-side="buying">Buying</button>
      </div>
      <span class="grow"></span>
      <button class="rules" id="rulesBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Rules</button>
    </div>

    <div class="nums">
      <div><b id="nMine">0</b><span>Your move</span></div>
      <div><b id="nWait">0</b><span>Waiting</span></div>
      <div><b id="nDeal">₪0</b><span>Agreed</span></div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </main>

  <!-- Deal room: the whole thread for one negotiation, and the moves you can make. -->
  <div class="veil" id="veil">
    <div class="room" role="dialog" aria-modal="true" aria-label="Negotiation">
      <div class="r-top" id="rTop"></div>
      <div class="r-body" id="rBody"></div>
      <div class="r-foot" id="rFoot"></div>
    </div>
  </div>

  <script src="negotiation.js?v=1"></script>
  <script>
  (function negotiationPage() {
    'use strict';
    var N = window.VeroNego, qs = new URLSearchParams(location.search);
    var embed = qs.get('embed') === '1';
    if (embed) document.documentElement.classList.add('is-embed');

    var side = qs.get('side');
    if (side !== 'selling' && side !== 'buying') {
      var acct = ''; try { acct = localStorage.getItem('vero_active_account') || ''; } catch (e) {}
      side = (qs.get('from') === 'seller' || acct === 'seller') ? 'selling' : 'buying';
    }
    // Embedded in the seller area or the buyer profile, the page shows one side only.
    var locked = embed && (qs.get('from') === 'seller' || qs.has('side'));

    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var nis = function (n) { return '₪' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
    var ago = function (ts) {
      var s = (Date.now() - ts) / 1000;
      if (s < 60) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm ago';
      if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago';
    };
    var left = function (ms) {
      if (ms <= 0) return 'expired';
      var h = ms / 36e5; return h >= 24 ? Math.round(h / 24) + 'd left' : h >= 1 ? Math.round(h) + 'h left' : Math.max(1, Math.round(ms / 6e4)) + 'm left';
    };
    var thumb = function (it) {
      return it.cover ? '<div class="thumb" style="background-image:url(&quot;' + esc(encodeURI(it.cover)) + '&quot;)"></div>' : '<div class="thumb">' + esc(it.icon || '🛍️') + '</div>';
    };

    var filter = 'mine', openId = null, composing = false, sheet = null;
    var them = function () { return side === 'selling' ? 'buyer' : 'seller'; };

    function group(n) { var st = N.state(n); return !st.open ? 'closed' : st.turn === 'me' ? 'mine' : 'wait'; }
    function chip(n) {
      var st = N.state(n);
      if (st.open) return st.turn === 'me' ? '<span class="chip me">Your move</span>' : '<span class="chip them">Waiting for ' + them() + '</span>';
      var label = { accepted: 'Deal agreed', declined: 'Declined', withdrawn: 'Withdrawn', expired: 'Expired' }[n.status];
      return '<span class="chip ' + n.status + '">' + label + '</span>';
    }

    // The price line: both sides' latest numbers placed between the lowest figure and the ask.
    function track(n) {
      var st = N.state(n), ask = n.item.ask;
      var vals = n.events.filter(function (e) { return e.amount; }).map(function (e) { return e.amount; }).concat(ask);
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
      lo = Math.max(0, lo - (hi - lo) * 0.35 - 1);
      var at = function (v) { return Math.min(100, Math.max(0, (v - lo) / (hi - lo || 1) * 100)); };
      var edge = function (p) { return p < 14 ? ' edge-l' : p > 86 ? ' edge-r' : ''; };
      var pins = '';
      if (n.status === 'accepted') {
        var p = at(n.agreed); pins = '<i class="pin deal' + edge(p) + '" style="left:' + p + '%"><span>Agreed ' + nis(n.agreed) + '</span></i>';
      } else {
        var mineLabel = side === 'selling' ? 'You' : 'Your offer', theirLabel = side === 'selling' ? 'Buyer' : 'Seller';
        if (st.theirs) { var a = at(st.theirs.amount); pins += '<i class="pin' + edge(a) + '" style="left:' + a + '%"><span>' + theirLabel + ' ' + nis(st.theirs.amount) + '</span></i>'; }
        if (st.mine) { var b = at(st.mine.amount); pins += '<i class="pin me' + edge(b) + '" style="left:' + b + '%"><span>' + mineLabel + ' ' + nis(st.mine.amount) + '</span></i>'; }
      }
      var from = st.theirs && st.mine ? Math.min(at(st.theirs.amount), at(st.mine.amount)) : at(st.price);
      var to = st.theirs && st.mine && n.status !== 'accepted' ? Math.max(at(st.theirs.amount), at(st.mine.amount)) : 100;
      return '<div class="track"><span class="fill" style="left:' + from + '%;width:' + Math.max(0, to - from) + '%"></span>' + pins + '</div>';
    }

    /* ------------------------------- List ------------------------------- */
    function paint() {
      N.refresh();
      var all = N.bySide(side), by = { mine: [], wait: [], closed: [] };
      all.forEach(function (n) { by[group(n)].push(n); });
      $('nMine').textContent = by.mine.length;
      $('nWait').textContent = by.wait.length;
      $('nDeal').textContent = nis(all.reduce(function (s, n) { return s + (n.status === 'accepted' ? n.agreed : 0); }, 0));
      $('sideSeg').style.display = locked ? 'none' : '';
      $('sideSeg').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-side') === side); });
      $('rulesBtn').style.display = side === 'selling' ? '' : 'none';
      $('phBack').setAttribute('href', side === 'selling' ? 'seller-area.html' : 'profile.html');

      var TABS = [['mine', 'Your move', by.mine.length], ['wait', 'Waiting', by.wait.length], ['closed', 'Closed', by.closed.length], ['all', 'All', all.length]];
      $('tabs').innerHTML = TABS.map(function (t) { return '<button type="button" class="tab' + (filter === t[0] ? ' on' : '') + '" data-f="' + t[0] + '">' + t[1] + '<i>' + t[2] + '</i></button>'; }).join('');

      var rows = filter === 'all' ? all : by[filter];
      if (!rows.length) {
        var msg = { mine: 'Nothing is waiting on you.', wait: 'No offers are waiting on the other side.', closed: 'No closed negotiations yet.',
                    all: side === 'selling' ? 'No offers on your pieces yet.' : 'You have not made any offers yet. Tap "Make an offer" on any item.' }[filter];
        $('list').innerHTML = '<div class="empty">' + msg + '</div>';
      } else {
        $('list').innerHTML = rows.map(function (n) {
          var st = N.state(n), mine = st.turn === 'me';
          var foot = st.open
            ? '<span>Round ' + st.rounds + ' of ' + N.MAX_OFFERS + '</span><span class="' + (st.msLeft < 6 * 36e5 ? 'urgent' : '') + '">' + left(st.msLeft) + '</span>'
            : '<span>' + st.rounds + ' offer' + (st.rounds === 1 ? '' : 's') + ' exchanged</span><span>' + ago(n.updatedAt) + '</span>';
          var quick = mine
            ? '<div class="quick"><button type="button" class="btn grow" data-go="counter"' + (st.canCounter ? '' : ' disabled') + '>Counter</button>' +
              '<button type="button" class="btn ok grow" data-go="accept">Accept ' + nis(st.last.amount) + '</button></div>' : '';
          return '<article class="card' + (mine ? ' mine' : '') + '" data-id="' + n.id + '">' +
            '<div class="c-top">' + thumb(n.item) +
              '<div style="min-width:0"><div class="c-name">' + esc(n.item.name) + '</div><div class="c-who">' + esc(n.party) + ' · ' + ago(n.updatedAt) + '</div>' + chip(n) + '</div>' +
              '<div class="c-price"><b>' + nis(st.price) + '</b><s>' + nis(n.item.ask) + '</s></div></div>' +
            track(n) + '<div class="c-foot">' + foot + '</div>' + quick + '</article>';
        }).join('');
      }
      if (openId && !composing) paintRoom(false);   // never repaint over a counter being typed
      N.simulate(false);
    }

    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('[data-f]'); if (t) { filter = t.getAttribute('data-f'); paint(); } });
    $('sideSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-side]'); if (b) { side = b.getAttribute('data-side'); filter = 'mine'; paint(); } });
    $('list').addEventListener('click', function (e) {
      var card = e.target.closest('.card'); if (!card) return;
      var id = card.getAttribute('data-id'), go = e.target.closest('[data-go]');
      if (go && go.getAttribute('data-go') === 'accept') { move(id, 'accept'); return; }
      openRoom(id, !!go);
    });

    /* ----------------------------- Deal room ----------------------------- */
    function openRoom(id, compose) { sheet = 'room'; openId = id; composing = !!compose; $('veil').classList.add('open'); document.body.style.overflow = 'hidden'; paintRoom(true); }
    function closeRoom() { openId = null; sheet = null; composing = false; $('veil').classList.remove('open'); document.body.style.overflow = ''; }
    $('veil').addEventListener('click', function (e) { if (e.target === this || e.target.closest('[data-close]')) closeRoom(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeRoom(); });

    function line(n, ev) {
      var who = ev.by === 'me' ? 'You' : esc(n.party), cls = ev.by === 'me' ? ' me' : '';
      var t = '<time>' + ago(ev.at) + '</time>';
      if (ev.type === 'offer') {
        var first = n.events.indexOf(ev) === 0;
        return '<div class="ev' + cls + '"><span class="who">' + who + ' · ' + (first ? 'offer' : 'counter') + '</span><span class="amt">' + nis(ev.amount) + '</span>' +
          (ev.final ? '<span class="tag">Final</span>' : '') + (ev.note ? '<span class="note">' + esc(ev.note) + '</span>' : '') + t + '</div>';
      }
      if (ev.type === 'accept') return '<div class="ev sys good">' + who + ' accepted ' + nis(ev.amount) + (ev.auto ? ' · by your auto-accept rule' : '') + '</div>';
      if (ev.type === 'decline') return '<div class="ev sys">' + who + ' declined' + (ev.auto ? ' · by your auto-decline rule' : '') + '</div>';
      if (ev.type === 'withdraw') return '<div class="ev sys">' + who + ' withdrew the offer</div>';
      return '<div class="ev sys">The offer expired with no answer</div>';
    }

    function paintRoom(scroll) {
      if (sheet !== 'room') return;
      var n = N.get(openId); if (!n) { closeRoom(); return; }
      var st = N.state(n);
      $('rTop').innerHTML = thumb(n.item) + '<div style="min-width:0"><div class="c-name">' + esc(n.item.name) + '</div><div class="c-who">' +
        (side === 'selling' ? 'Buyer' : 'Seller') + ' · ' + esc(n.party) + ' · asking ' + nis(n.item.ask) + '</div></div><button type="button" class="x" data-close aria-label="Close">×</button>';
      $('rBody').innerHTML = chip(n) + track(n) +
        '<div class="r-meta"><span>' + (st.open ? 'Round ' + st.rounds + ' of ' + N.MAX_OFFERS : st.rounds + ' offers exchanged') + '</span><span>' + (st.open ? left(st.msLeft) : ago(n.updatedAt)) + '</span></div>' +
        '<div class="thread">' + n.events.map(function (ev) { return line(n, ev); }).join('') +
        (st.turn === 'them' ? '<div class="typing">' + esc(n.party) + ' is deciding</div>' : '') + '</div>';
      if (scroll !== false) $('rBody').scrollTop = $('rBody').scrollHeight;

      var foot = '';
      if (!st.open) {
        composing = false;
        foot = n.status === 'accepted'
          ? '<div class="hint">Agreed at <b>' + nis(n.agreed) + '</b>. Arrange the pickup in the chat.</div><div class="r-actions"><a class="btn dark grow" target="_top" href="chats.html' + (side === 'selling' ? '?from=seller' : '') + '">Open chat</a></div>'
          : '<div class="hint">This negotiation is closed.</div><div class="r-actions"><button type="button" class="btn grow" data-close>Close</button></div>';
      } else if (st.turn === 'them') {
        composing = false;
        foot = '<div class="hint">Your ' + (side === 'selling' ? 'counter' : 'offer') + ' of <b>' + nis(st.mine.amount) + '</b> is with the ' + them() + '. They have ' + left(st.msLeft).replace(' left', '') + ' to answer.</div>' +
          '<div class="r-actions"><button type="button" class="btn quiet grow" data-move="' + (side === 'selling' ? 'decline' : 'withdraw') + '">' + (side === 'selling' ? 'End negotiation' : 'Withdraw offer') + '</button></div>';
      } else if (composing && st.canCounter) {
        var mid = Math.round((st.min + st.max) / 2 / 5) * 5; mid = Math.min(st.max, Math.max(st.min, mid));
        var chips = side === 'selling'
          ? [['Meet halfway', mid], ['Asking −5%', Math.round(n.item.ask * 0.95)], ['Asking −10%', Math.round(n.item.ask * 0.9)]]
          : [['Meet halfway', mid], ['+5%', Math.round(st.mine.amount * 1.05)], ['+10%', Math.round(st.mine.amount * 1.1)]];
        chips = chips.filter(function (c) { return c[1] >= st.min && c[1] <= st.max; });
        foot = '<div class="comp" data-min="' + st.min + '" data-max="' + st.max + '">' +
          '<div class="comp-amt"><span>₪</span><input type="number" inputmode="numeric" id="cAmt" value="' + mid + '" aria-label="Your counter"></div>' +
          '<div class="comp-sub" id="cSub"></div>' +
          '<input type="range" id="cRange" min="' + st.min + '" max="' + st.max + '" value="' + mid + '" aria-label="Counter amount">' +
          '<div class="comp-ends"><span>' + nis(st.min) + '</span><span>' + nis(st.max) + '</span></div>' +
          '<div class="chips">' + chips.map(function (c) { return '<button type="button" data-amt="' + c[1] + '">' + c[0] + ' · ' + nis(c[1]) + '</button>'; }).join('') + '</div>' +
          '<input class="comp-note" id="cNote" type="text" maxlength="200" placeholder="Add a note (optional)">' +
          '<label class="check"><input type="checkbox" id="cFinal"' + (st.roundsLeft <= 1 ? ' checked disabled' : '') + '>This is my final offer</label>' +
          '<div class="r-actions"><button type="button" class="btn quiet" data-comp="cancel">Back</button><button type="button" class="btn dark grow" data-comp="send">Send counter</button></div>' +
          '<div class="err" id="cErr"></div></div>';
      } else {
        composing = false;
        foot = (st.last.final ? '<div class="hint">This is the ' + them() + '’s final offer — accept or decline.</div>'
              : st.canCounter ? '' : '<div class="hint">No counters left — accept or decline.</div>') +
          '<div class="r-actions"><button type="button" class="btn quiet" data-move="decline">Decline</button>' +
          '<button type="button" class="btn grow" data-comp="open"' + (st.canCounter ? '' : ' disabled') + '>Counter</button>' +
          '<button type="button" class="btn ok grow" data-move="accept">Accept ' + nis(st.last.amount) + '</button></div>';
      }
      $('rFoot').innerHTML = foot;
      syncComposer();
    }

    function syncComposer() {
      var a = $('cAmt'); if (!a) return;
      var n = N.get(openId), v = Number(a.value) || 0, pct = n.item.ask ? Math.round(v / n.item.ask * 100) : 0;
      $('cSub').textContent = pct + '% of the asking price · ' + nis(Math.abs(n.item.ask - v)) + (v <= n.item.ask ? ' below' : ' above');
    }
    $('rFoot').addEventListener('input', function (e) {
      if (e.target.id === 'cRange') $('cAmt').value = e.target.value;
      if (e.target.id === 'cAmt') $('cRange').value = e.target.value;
      if (e.target.id === 'cRange' || e.target.id === 'cAmt') { $('cErr').textContent = ''; syncComposer(); }
    });
    $('rFoot').addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-amt]'))) { $('cAmt').value = $('cRange').value = b.getAttribute('data-amt'); syncComposer(); return; }
      if ((b = e.target.closest('[data-move]'))) { move(openId, b.getAttribute('data-move')); return; }
      b = e.target.closest('[data-comp]'); if (!b) return;
      var c = b.getAttribute('data-comp');
      if (c === 'open') { composing = true; paintRoom(false); }
      else if (c === 'cancel') { composing = false; paintRoom(false); }
      else if (c === 'send') {
        var draft = { amount: $('cAmt').value, note: $('cNote').value, final: $('cFinal').checked };
        composing = false;                       // so the room repaints when the move lands
        var r = N.act(openId, 'offer', draft);
        if (!r.ok) { composing = true; $('cErr').textContent = r.error; return; }
        N.simulate(true);
      }
    });
    function move(id, action) {
      var r = N.act(id, action);
      if (!r.ok) { alert(r.error); return; }
      N.simulate(true);
    }

    /* ---------------------------- Seller rules ---------------------------- */
    function paintRules() {
      var s = N.settings();
      $('rTop').innerHTML = '<div class="thumb" style="height:44px;font-size:20px">⚖️</div><div><div class="c-name">Negotiation rules</div><div class="c-who">Applied to every new offer you receive</div></div><button type="button" class="x" data-close aria-label="Close">×</button>';
      $('rBody').innerHTML =
        '<div class="rule"><div class="rule-top"><b>Auto-accept strong offers</b><input type="checkbox" class="sw" data-rule="autoAccept" data-on="95"' + (s.autoAccept ? ' checked' : '') + '></div>' +
          '<p>' + (s.autoAccept ? 'Offers at <b>' + s.autoAccept + '%</b> of your asking price or more are accepted for you.' : 'Off — you answer every offer yourself.') + '</p>' +
          (s.autoAccept ? '<input type="range" min="70" max="100" value="' + s.autoAccept + '" data-rule="autoAccept">' : '') + '</div>' +
        '<div class="rule"><div class="rule-top"><b>Auto-decline low offers</b><input type="checkbox" class="sw" data-rule="autoDecline" data-on="50"' + (s.autoDecline ? ' checked' : '') + '></div>' +
          '<p>' + (s.autoDecline ? 'Offers under <b>' + s.autoDecline + '%</b> of your asking price are declined for you.' : 'Off — low offers still reach you.') + '</p>' +
          (s.autoDecline ? '<input type="range" min="20" max="' + Math.min(85, (s.autoAccept || 100) - 5) + '" value="' + s.autoDecline + '" data-rule="autoDecline">' : '') + '</div>' +
        '<div class="rule"><div class="rule-top"><b>Time to answer</b><div class="seg">' + [24, 48, 72].map(function (h) {
            return '<button type="button" data-hours="' + h + '"' + (s.expiryHours === h ? ' class="on"' : '') + '>' + h + 'h</button>'; }).join('') + '</div></div>' +
          '<p>An offer or counter that gets no answer in this time expires.</p></div>';
      $('rFoot').innerHTML = '<div class="r-actions"><button type="button" class="btn dark grow" data-close>Done</button></div>';
    }
    $('rulesBtn').addEventListener('click', function () { sheet = 'rules'; openId = null; $('veil').classList.add('open'); document.body.style.overflow = 'hidden'; paintRules(); });
    $('rBody').addEventListener('change', function (e) {
      var k = e.target.getAttribute('data-rule'); if (!k || sheet !== 'rules') return;
      var patch = {}; patch[k] = e.target.type === 'checkbox' ? (e.target.checked ? Number(e.target.getAttribute('data-on')) : 0) : Number(e.target.value);
      N.saveSettings(patch); paintRules();
    });
    $('rBody').addEventListener('click', function (e) {
      var b = e.target.closest('[data-hours]'); if (!b || sheet !== 'rules') return;
      N.saveSettings({ expiryHours: Number(b.getAttribute('data-hours')) }); paintRules();
    });

    N.onChange(paint);
    paint();
    setInterval(function () { if (!document.hidden && !composing && sheet !== 'rules') paint(); }, 60000);
  })();
  </script>
<script src="assets/line-icons.js"></script>
</body>
</html>
