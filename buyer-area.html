<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== DATA SECTION ==================== */
        .data-section {
            background: white;
            padding: 40px 0 70px;
            min-height: 600px;
        }

        /* ==================== SLIDER (mirrors the feed promo slider) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 20px 0 0 0;
            padding: 20px 0 0 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            padding: 20px 40px 40px 40px;
        }

        /* The "image" area now holds a chart, no background box */
        .promo-image {
            width: 100%;
            height: 600px;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            overflow: hidden;
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 44px;
            font-weight: 800;
            text-transform: none;
            line-height: 1.15;
            letter-spacing: 0.3px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 21px;
            line-height: 1.6;
            color: #444;
            max-width: 560px;
            margin: 0;
        }

        .promo-stat {
            font-size: 17px;
            font-weight: 700;
            color: #004225;
            background: #e8f0eb;
            padding: 10px 20px;
            border-radius: 0;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #004225;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #004225;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        /* ==================== CHARTS ==================== */
        /* Monthly spending: vertical bars */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 12px;
        }

        .bar-value {
            font-size: 16px;
            font-weight: 700;
            color: #004225;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            max-width: 72px;
            background: linear-gradient(180deg, #0a6b3f 0%, #004225 100%);
            border-radius: 0;
            min-height: 4px;
        }

        .bar-label {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        /* ==================== COLLECTIONS ==================== */
        .collections {
            display: flex;
            gap: 48px;
            margin-top: 70px;
            align-items: flex-start;
        }

        .collection {
            flex: 1;
            min-width: 0;
        }

        .collection-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
            padding-bottom: 16px;
            border-bottom: 2px solid #004225;
        }

        .col-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #004225;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .col-title {
            font-size: 24px;
            font-weight: 700;
            color: #004225;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .mini-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            font-size: 15px;
            padding: 40px 0;
        }

        /* Product cards — identical form & size to the storefront feed */
        .product-card {
            background: #efece4;
            border: none;
            border-radius: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
            text-decoration: none;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.13);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #efece4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            color: rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
            padding: 0;
            transition: background 0.4s ease;
        }

        .product-card:hover .product-image {
            background: #e9e5db;
        }

        /* Bottom info bar: price on the left, meta on the right */
        .product-info {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            position: relative;
            background: #efece4;
        }

        .pc-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-start;
        }

        .pc-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            gap: 3px;
        }

        .product-price {
            font-size: 30px;
            color: #111;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1;
        }

        .product-seller {
            font-size: 15px;
            color: #111;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 12px;
            font-weight: 400;
            color: #8a8a8a;
            letter-spacing: 0.2px;
            line-height: 1.2;
            margin: 0;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-rating {
            font-size: 11px;
            color: #111;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ==================== DATA LAYOUT (rectangles + image) ==================== */
        .data-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 40px;
            align-items: start;
            margin-top: 20px;
        }

        .data-rects {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Each expandable rectangle */
        .data-rect {
            background: white;
            border: 2px solid #e4e4e4;
            border-radius: 0;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .data-rect.open {
            border-color: #004225;
            box-shadow: 0 10px 30px rgba(0, 66, 37, 0.10);
        }

        .rect-head {
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 44px 30px;
            text-align: right;
        }

        .rect-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #004225;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .rect-title {
            font-size: 22px;
            font-weight: 700;
            color: #004225;
            flex-shrink: 0;
        }

        /* Inline peek of 3 products, shown on cart/wishlist rectangles */
        .rect-peek {
            display: flex;
            gap: 10px;
            margin-right: auto;
        }

        .peek-item {
            width: 54px;
            height: 54px;
            border-radius: 0;
            background: #efece4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .rect-chevron {
            margin-right: 8px;
            color: #004225;
            transition: transform 0.35s ease;
            display: flex;
            flex-shrink: 0;
        }

        .data-rect.open .rect-chevron {
            transform: rotate(180deg);
        }

        /* When a rectangle has a peek, the chevron shouldn't push it; keep chevron last */
        .rect-head .rect-peek + .rect-chevron { margin-right: 18px; }

        .rect-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .data-rect.open .rect-panel {
            max-height: 2000px;
        }

        .rect-panel-inner {
            padding: 0 26px 28px;
        }

        /* Chart height inside a panel */
        .rect-panel-inner .bar-chart {
            height: 320px;
        }

        /* Image column — flush to the left edge of the viewport, enlarged */
        .data-image {
            position: sticky;
            top: 30px;
            min-height: 640px;
            border-radius: 0;
            margin-left: calc(-50vw + 50%);
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .data-image svg {
            width: 62%;
            height: auto;
            opacity: 0.92;
        }

        @media (max-width: 900px) {
            .data-layout {
                grid-template-columns: 1fr;
            }
            .data-image {
                position: static;
                min-height: 220px;
                margin-left: 0;
                order: -1;
            }
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .collections {
                flex-direction: column;
                gap: 40px;
            }

            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .promo-title { font-size: 30px; }
            .promo-desc { font-size: 17px; }
            .promo-image { height: 480px; }
        }

        @media (max-width: 768px) {
            .header-left { display: none; }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">הנתונים שלי</h1>
            <p class="hero-subtitle">מבט על הרגלי הקנייה, הסגנונות והחברות האהובים עליך</p>
        </div>
    </div>

    <!-- ==================== DATA SECTION ==================== -->
    <div class="data-section">
        <div class="container">
            <div class="data-layout">
                <div class="data-rects" id="dataRects"></div>
                <div class="data-image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3v18h18"/>
                        <rect x="6" y="12" width="3" height="6" rx="0.6" fill="white" stroke="none"/>
                        <rect x="11" y="8" width="3" height="10" rx="0.6" fill="white" stroke="none"/>
                        <rect x="16" y="4" width="3" height="14" rx="0.6" fill="white" stroke="none"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ==================== DATA ====================
        // Monthly spending in ₪ (index 0 = January); rendered up to the current month.
        const monthlySpending = [320, 180, 540, 260, 610, 430, 290, 380, 450, 500, 340, 410];
        const monthNames = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

        const favoriteStyles = [
            { name: 'קז\'ואל', pct: 85 },
            { name: 'וינטג\'', pct: 62 },
            { name: 'ספורט', pct: 48 },
            { name: 'פורמלי', pct: 35 },
        ];
        const favoriteBrands = [
            { name: 'Basics Co', pct: 90 },
            { name: 'Denim House', pct: 70 },
            { name: 'Street Style', pct: 55 },
            { name: 'Smart Style', pct: 40 },
        ];

        // Fallback samples so the cart & wishlist always show products.
        const sampleCart = [
            { name: 'טי-שירט לבן קלאסי', price: '₪49.90', icon: '👕', category: 'קז\'ואל', seller: 'Basics Co', rating: 4.7 },
            { name: 'ג\'ינס סקיני כחול', price: '₪189.00', icon: '👖', category: 'ג\'ינס', seller: 'Denim House', rating: 4.6 },
            { name: 'סניקרס לבן קלאסי', price: '₪150.00', icon: '👟', category: 'סניקרס', seller: 'Basics Co', rating: 4.8 },
            { name: 'הודי אפור', price: '₪139.00', icon: '🧥', category: 'הודיס', seller: 'Street Style', rating: 4.6 },
            { name: 'חולצה מכופתרת תכלת', price: '₪149.00', icon: '👔', category: 'פורמלי', seller: 'Smart Style', rating: 4.6 },
            { name: 'כובע בייסבול', price: '₪89.90', icon: '🧢', category: 'כובעים', seller: 'Accessories Co', rating: 4.5 },
        ];
        const sampleWishlist = [
            { name: 'בלייזר נייבי', price: '₪320.00', icon: '👔', category: 'פורמלי', seller: 'Smart Style', rating: 4.8 },
            { name: 'ג\'קט עור', price: '₪450.00', icon: '🧥', category: 'ג\'קטים', seller: 'Leather Lab', rating: 4.8 },
            { name: 'מגפיים חום', price: '₪290.00', icon: '🥾', category: 'מגפיים', seller: 'Boots Co', rating: 4.8 },
            { name: 'סוודר צמר וינטג\'', price: '₪165.00', icon: '🧶', category: 'וינטג\'', seller: 'Vintage 90s', rating: 4.8 },
            { name: 'תיק צד עור', price: '₪290.00', icon: '👜', category: 'תיקים', seller: 'Leather Lab', rating: 4.8 },
            { name: 'שרשרת זהב', price: '₪120.00', icon: '⛓️', category: 'תכשיטים', seller: 'Jewelry Co', rating: 4.8 },
        ];

        // ==================== CHART BUILDERS ====================
        // Generic vertical bar chart; bars is [{ value, display, label }], heights scaled to the max.
        function barChartHTML(bars) {
            const max = Math.max(...bars.map(b => b.value));
            return `<div class="bar-chart">` + bars.map(b => {
                const height = max > 0 ? (b.value / max) * 100 : 0;
                return `
                    <div class="bar-col">
                        <div class="bar-value">${b.display}</div>
                        <div class="bar" style="height: ${height}%"></div>
                        <div class="bar-label">${b.label}</div>
                    </div>`;
            }).join('') + `</div>`;
        }

        function spendChartHTML() {
            const currentMonth = new Date().getMonth(); // up to "today"
            const data = monthlySpending.slice(0, currentMonth + 1);
            return barChartHTML(data.map((value, i) => ({
                value,
                display: `₪${value.toLocaleString()}`,
                label: monthNames[i]
            })));
        }

        function pctChartHTML(items) {
            return barChartHTML(items.map(item => ({
                value: item.pct,
                display: `${item.pct}%`,
                label: item.name
            })));
        }

        // ==================== PRODUCTS ====================
        function productPageUrl(item) {
            const data = {
                name: item.name, price: item.price, icon: item.icon,
                category: item.category, seller: item.seller, rating: item.rating,
                type: item.type || 'clothing'
            };
            return `product.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        function miniCardHTML(item) {
            const rating = item.rating || 4.5;
            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
            return `
                <a href="${productPageUrl(item)}" class="product-card">
                    <div class="product-image">${item.icon}</div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price">${item.price}</div>
                        </div>
                        <div class="pc-right">
                            <div class="product-seller">${item.seller || 'Vero Store'}</div>
                            <div class="product-name">${item.name}</div>
                            <div class="product-rating">${stars}</div>
                        </div>
                    </div>
                </a>`;
        }

        // The six most recent items from a store, padded with samples up to six.
        function recentItems(storageKey, fallback) {
            let items = [];
            try { items = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (e) { items = []; }
            items.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
            const seen = new Set(items.map(i => i.name + '|' + i.price));
            for (const f of fallback) {
                if (items.length >= 6) break;
                const key = f.name + '|' + f.price;
                if (!seen.has(key)) { items.push(f); seen.add(key); }
            }
            return items.slice(0, 6);
        }

        // Inline peek: the first three product icons shown on the rectangle head.
        function peekHTML(items) {
            return `<span class="rect-peek">` +
                items.slice(0, 3).map(i => `<span class="peek-item">${i.icon}</span>`).join('') +
                `</span>`;
        }

        function productGridHTML(items) {
            return `<div class="mini-grid">` + items.map(miniCardHTML).join('') + `</div>`;
        }

        // ==================== RECTANGLES ====================
        const chevronSVG = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

        function iconCircle(path) {
            return `<span class="rect-icon"><svg viewBox="0 0 24 24" width="24" height="24" style="fill:white">${path}</svg></span>`;
        }

        const chartIcon = iconCircle('<path d="M3 3v18h18v-2H5V3H3zm4 12h2v2H7v-2zm4-6h2v8h-2V9zm4-4h2v12h-2V5z"/>');
        const styleIcon = iconCircle('<path d="M16 4l-4 2-4-2-5 4 3 3 2-1v9h8v-9l2 1 3-3-5-4z"/>');
        const cartIcon = iconCircle('<path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>');
        const wishIcon = iconCircle('<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>');
        const brandIcon = iconCircle('<path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3L12 14.9 7.2 16.4l.9-5.3L4.3 7.6l5.3-.8L12 2z"/>');

        function rectHTML(icon, title, peek, body) {
            return `
                <div class="data-rect">
                    <button class="rect-head" type="button">
                        ${icon}
                        <span class="rect-title">${title}</span>
                        ${peek || ''}
                        <span class="rect-chevron">${chevronSVG}</span>
                    </button>
                    <div class="rect-panel"><div class="rect-panel-inner">${body}</div></div>
                </div>`;
        }

        function buildRects() {
            const cart = recentItems('vero_cart', sampleCart);
            const wish = recentItems('vero_wishlist', sampleWishlist);

            document.getElementById('dataRects').innerHTML = [
                rectHTML(chartIcon, 'הנתוני רכישה החודשיים', '', spendChartHTML()),
                rectHTML(styleIcon, 'הסגנונות המועדפים עליי', '', pctChartHTML(favoriteStyles)),
                rectHTML(cartIcon, 'עגלת קניות', peekHTML(cart), productGridHTML(cart)),
                rectHTML(wishIcon, 'רשימת משאלות', peekHTML(wish), productGridHTML(wish)),
                rectHTML(brandIcon, 'החברות האהובות עליי', '', pctChartHTML(favoriteBrands)),
            ].join('');

            // Accordion behaviour: clicking a head toggles that rectangle.
            document.querySelectorAll('#dataRects .data-rect').forEach(rect => {
                rect.querySelector('.rect-head').addEventListener('click', () => {
                    rect.classList.toggle('open');
                });
            });
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize
        buildRects();
    </script>
</body>
</html>
