<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Page Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #16150f; --muted: #8f8d86; --line: #e6e4de; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 44px 40px; justify-content: center; max-width: 1360px; margin: 0 auto; }
.opt { width: 620px; }
.pair { display: flex; gap: 20px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); flex: none; }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; font-family: 'Poppins', sans-serif; }
svg.i { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.2; fill: none; flex: none; }
.photo { background: url('../women-hero.jpg') center 22% / cover; }

/* ---------- base structure (shared by every option) ---------- */
.top { position: absolute; top: 34px; left: 26px; right: 26px; display: flex; justify-content: space-between; z-index: 3; }
.brand { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 46px; letter-spacing: 1px; line-height: 1; }
.pname { font-size: 13px; letter-spacing: 6px; text-transform: uppercase; margin-top: 14px; }
.price { font-size: 16px; letter-spacing: 2px; margin-top: 24px; }
.hero { text-align: center; padding-top: 128px; }
.img { margin: 40px auto 0; width: 300px; height: 380px; }
.specs { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center; gap: 30px; text-align: center; }
.specs b { display: block; font-weight: 400; font-size: 15px; letter-spacing: 3px; }
.specs small { display: block; font-size: 9px; letter-spacing: 3px; color: var(--muted); margin-top: 8px; text-transform: uppercase; }
.dots { position: absolute; bottom: 58px; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); } .dots i.on { width: 28px; border-radius: 5px; }

.det { padding: 118px 26px 0; }
.det .brand { font-size: 40px; }
.det .pname { margin-top: 10px; }
.desc { font-size: 13.5px; line-height: 1.9; color: #6f6c66; margin-top: 26px; }
.rows { margin-top: 36px; }
.rows div { display: flex; justify-content: space-between; padding: 11px 0; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.rows div span:last-child { color: var(--muted); }
.buy { display: flex; justify-content: space-between; align-items: center; margin-top: 46px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.buy .p { font-size: 22px; } .buy .o { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid currentColor; padding-bottom: 3px; }
.seller { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px; }
.seller span:first-child { color: var(--muted); } .seller u { color: var(--ink); text-underline-offset: 4px; margin-left: 6px; }
.stars { font-size: 13px; letter-spacing: 2px; } .stars small { font-size: 10px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.bar { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 64px; border-radius: 999px; background: #1a1916; color: #fff; display: flex; align-items: center; padding: 4px; }
.bar > div { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; border-radius: 999px; }
.bar > div svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.3; fill: none; }
.bar > div.on { background: #fff; color: #1a1916; }

/* ---------- P1 current ---------- */
.t1.s1 { background: #f2f0ee; }
.t1 .img.ph { display: grid; place-items: center; }
.t1 .img.ph svg { width: 210px; height: 220px; stroke: #c8c2b8; stroke-width: 1.2; }
.t1.s2 { background: #fff; }

/* ---------- P2 editorial serif ---------- */
.t2 { background: #fbfaf7; color: var(--ink); }
.t2 .hero { text-align: left; padding: 120px 30px 0; }
.t2 .brand { font-size: 13px; font-family: 'Poppins'; letter-spacing: 6px; font-weight: 400; }
.t2 .pname { font-family: 'Bodoni Moda', serif; font-size: 44px; letter-spacing: 0; text-transform: none; line-height: 1.05; margin-top: 10px; }
.t2 .pname i { font-style: italic; }
.t2 .price { font-family: 'Bodoni Moda', serif; font-size: 22px; letter-spacing: 0; margin-top: 12px; }
.t2 .img { width: auto; height: 380px; margin: 28px 0 0; }
.t2 .specs { justify-content: space-between; padding: 18px 30px 0; bottom: 70px; border-top: 1px solid var(--ink); margin: 0 30px; padding-left: 0; padding-right: 0; }
.t2 .specs b { font-family: 'Bodoni Moda', serif; font-size: 20px; letter-spacing: 0; text-transform: capitalize; }
.t2 .specs div { text-align: left; }
.t2 .dots { bottom: 36px; } .t2 .dots i { background: #d9d5cc; box-shadow: none; } .t2 .dots i.on { background: var(--ink); }
.t2 .det .brand { font-size: 12px; font-family: 'Poppins'; letter-spacing: 6px; font-weight: 400; }
.t2 .det .pname { font-family: 'Bodoni Moda', serif; font-size: 40px; letter-spacing: 0; text-transform: none; }
.t2 .desc { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 17px; line-height: 1.6; color: #4a4843; }
.t2 .rows div { border-bottom: 1px solid var(--line); padding: 14px 0; }
.t2 .rows div span:first-child { color: var(--muted); font-size: 9.5px; }
.t2 .rows div span:last-child { color: var(--ink); font-family: 'Bodoni Moda', serif; letter-spacing: 0; text-transform: capitalize; font-size: 16px; }
.t2 .rows div { flex-direction: row-reverse; }
.t2 .buy .p { font-family: 'Bodoni Moda', serif; font-size: 30px; }
.t2 .bar { left: 0; right: 0; bottom: 0; height: 84px; border-radius: 0; background: #fbfaf7; color: var(--ink); border-top: 1px solid var(--ink); padding: 0 0 14px; }
.t2 .bar > div { border-radius: 0; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.t2 .bar > div.on { background: var(--ink); color: #fff; }

/* ---------- P3 dark luxe ---------- */
.t3 { background: #0f0f0e; color: #f2efe8; }
.t3 .specs small, .t3 .rows div span:last-child, .t3 .seller span:first-child, .t3 .stars small { color: #8d8a83; }
.t3 .img { border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
.t3 .price { color: #d9a441; }
.t3 .dots i { background: #2c2b28; box-shadow: none; } .t3 .dots i.on { background: #d9a441; }
.t3 .desc { color: #a9a59c; }
.t3 .buy { border-color: #2a2926; } .t3 .buy .p { color: #d9a441; }
.t3 .seller u { color: #f2efe8; } .t3 .stars { color: #d9a441; }
.t3 .bar { background: #1d1c1a; border: 1px solid #2c2b28; }
.t3 .bar > div.on { background: #d9a441; color: #111; }

/* ---------- P4 full-bleed photo ---------- */
.t4.s1 .bg { position: absolute; inset: 0; }
.t4.s1 .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25), transparent 30%, transparent 50%, rgba(0,0,0,0.75)); }
.t4.s1 { color: #fff; }
.t4.s1 .hero { position: absolute; left: 26px; right: 26px; bottom: 150px; text-align: left; padding: 0; z-index: 2; }
.t4.s1 .brand { font-size: 38px; } .t4.s1 .price { font-size: 18px; margin-top: 12px; }
.t4.s1 .specs { z-index: 2; justify-content: flex-start; gap: 10px; left: 26px; bottom: 90px; }
.t4.s1 .specs div { border: 1px solid rgba(255,255,255,0.6); border-radius: 999px; padding: 8px 14px; display: flex; gap: 6px; align-items: baseline; }
.t4.s1 .specs b { font-size: 11px; letter-spacing: 2px; } .t4.s1 .specs small { margin: 0; color: rgba(255,255,255,0.7); font-size: 8px; }
.t4.s1 .dots { z-index: 2; bottom: 52px; } .t4.s1 .dots i { background: rgba(255,255,255,0.5); box-shadow: none; } .t4.s1 .dots i.on { background: #fff; }
.t4.s2 { background: url('../women-hero.jpg') center 22% / cover; }
.t4.s2 .sheet { position: absolute; left: 0; right: 0; top: 96px; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.2); }
.t4.s2 .sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: #e0dcd4; margin: 12px auto 0; }
.t4.s2 .det { padding-top: 26px; }
.t4.s2 .top { color: #fff; }
.t4.s2 .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; margin-top: 24px; }
.t4.s2 .rows div { flex-direction: column-reverse; gap: 4px; border-bottom: 1px solid var(--line); }
.t4.s2 .rows div span:last-child { font-size: 8.5px; }
.t4.s2 .buy { margin-top: 26px; }

/* ---------- P5 cream with spec tiles ---------- */
.t5 { background: #f4ede3; }
.t5 .img { border-radius: 200px 200px 16px 16px; width: 280px; height: 360px; }
.t5 .specs { gap: 10px; bottom: 96px; }
.t5 .specs div { background: #fff; border-radius: 14px; padding: 12px 14px; min-width: 96px; }
.t5 .specs b { font-size: 12px; letter-spacing: 2px; } .t5 .specs small { font-size: 8px; margin-top: 4px; }
.t5 .dots { bottom: 62px; } .t5 .dots i { background: #e3d8c8; box-shadow: none; } .t5 .dots i.on { background: #8a6d4b; }
.t5 .rows { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.t5 .rows div { background: #fff; border-radius: 14px; flex-direction: column-reverse; align-items: flex-start; padding: 12px; gap: 4px; font-size: 10px; letter-spacing: 1.5px; }
.t5 .rows div span:last-child { font-size: 8px; }
.t5 .buy { border-color: #e3d8c8; }
.t5 .bar { background: #fff; color: var(--ink); border: 1px solid #e3d8c8; box-shadow: 0 10px 24px rgba(138,109,75,0.15); }
.t5 .bar > div.on { background: #8a6d4b; color: #fff; }

/* ---------- P6 swiss grid ---------- */
.t6 { background: #fff; }
.t6 .hero { text-align: left; padding: 112px 22px 0; }
.t6 .brand { font-family: 'Poppins'; font-weight: 600; font-size: 40px; letter-spacing: -1.5px; text-transform: uppercase; }
.t6 .pname { letter-spacing: 1px; font-weight: 500; font-size: 15px; margin-top: 4px; }
.t6 .price { position: absolute; right: 22px; top: 166px; font-weight: 600; font-size: 18px; letter-spacing: 0; margin: 0; }
.t6 .img { width: auto; margin: 24px 22px 0; height: 400px; }
.t6 .specs { left: 22px; right: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-top: 2px solid var(--ink); text-align: left; bottom: 70px; }
.t6 .specs div { padding: 10px 0 0; } .t6 .specs div + div { border-left: 1px solid var(--line); padding-left: 10px; }
.t6 .specs b { font-weight: 600; font-size: 14px; letter-spacing: 0; } .t6 .specs small { margin-top: 2px; letter-spacing: 1px; }
.t6 .dots { justify-content: flex-start; left: 22px; bottom: 36px; } .t6 .dots i { border-radius: 0; height: 3px; width: 18px; background: var(--line); box-shadow: none; } .t6 .dots i.on { background: var(--ink); width: 18px; border-radius: 0; }
.t6 .det { padding: 110px 22px 0; }
.t6 .det .brand { font-size: 34px; }
.t6 .det .pname { margin-top: 2px; }
.t6 .desc { font-size: 13px; color: #333; }
.t6 .rows { border-top: 2px solid var(--ink); }
.t6 .rows div { border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0.5px; font-weight: 500; padding: 12px 0; }
.t6 .rows div::before { content: counter(r, decimal-leading-zero); counter-increment: r; color: var(--muted); width: 34px; font-weight: 400; }
.t6 .rows { counter-reset: r; } .t6 .rows div span:first-child { flex: 1; }
.t6 .buy .p { font-weight: 600; font-size: 26px; }
.t6 .bar { left: 0; right: 0; bottom: 0; height: 78px; border-radius: 0; background: var(--ink); padding: 0 0 12px; }
.t6 .bar > div { border-radius: 0; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }
.t6 .bar > div.on { background: #e8432b; color: #fff; }

/* ---------- P7 soft sage ---------- */
.t7 { background: #e9ece4; }
.t7 .img { border-radius: 28px; width: 320px; height: 360px; box-shadow: 0 16px 34px rgba(60,70,50,0.18); }
.t7 .brand { font-size: 36px; }
.t7 .price { display: inline-block; background: #fff; border-radius: 999px; padding: 8px 18px; font-size: 14px; }
.t7 .specs { gap: 8px; }
.t7 .specs div { display: flex; gap: 6px; align-items: baseline; background: #fff; border-radius: 999px; padding: 9px 14px; }
.t7 .specs b { font-size: 11px; letter-spacing: 1.5px; } .t7 .specs small { margin: 0; font-size: 8px; }
.t7 .dots i { background: #cfd5c6; box-shadow: none; } .t7 .dots i.on { background: #4f5d45; }
.t7.s2 { background: #fff; }
.t7 .rows { display: flex; flex-wrap: wrap; gap: 8px; }
.t7 .rows div { background: #e9ece4; border-radius: 999px; padding: 9px 14px; gap: 8px; font-size: 10px; letter-spacing: 1.5px; }
.t7 .rows div span:last-child { font-size: 8.5px; }
.t7 .bar { background: none; left: 18px; right: 18px; justify-content: space-between; padding: 0; }
.t7 .bar > div { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #e9ece4; color: #4f5d45; font-size: 9px; }
.t7 .bar > div.on { width: 140px; border-radius: 999px; background: #4f5d45; color: #fff; flex-direction: row; gap: 8px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }

/* ---------- P8 magazine split ---------- */
.t8 { background: #fff; }
.t8 .side { position: absolute; left: 22px; top: 140px; bottom: 140px; writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Bodoni Moda', serif; font-size: 54px; letter-spacing: 6px; text-align: right; }
.t8 .hero { padding: 120px 26px 0 100px; text-align: left; }
.t8 .hero .num { font-family: 'Bodoni Moda', serif; font-size: 12px; letter-spacing: 3px; color: var(--muted); }
.t8 .hero .pname { font-family: 'Bodoni Moda', serif; font-size: 30px; text-transform: none; letter-spacing: 0; font-style: italic; margin-top: 6px; }
.t8 .hero .price { margin-top: 8px; font-size: 15px; }
.t8 .img { width: 264px; height: 420px; margin: 24px 0 0; }
.t8 .specs { left: 100px; right: 26px; justify-content: space-between; text-align: left; bottom: 70px; }
.t8 .specs b { font-family: 'Bodoni Moda', serif; font-size: 18px; letter-spacing: 0; text-transform: capitalize; }
.t8 .dots { left: 100px; justify-content: flex-start; bottom: 38px; } .t8 .dots i { background: var(--line); box-shadow: none; } .t8 .dots i.on { background: var(--ink); }
.t8 .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; border-top: 1px solid var(--ink); }
.t8 .rows div { flex-direction: column-reverse; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.t8 .rows div span:first-child { font-family: 'Bodoni Moda', serif; font-size: 17px; letter-spacing: 0; text-transform: capitalize; }
.t8 .rows div span:last-child { font-size: 8.5px; }
.t8 .desc { border-left: 2px solid var(--ink); padding-left: 14px; font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 16px; line-height: 1.6; color: #333; }
.t8 .bar { background: none; color: var(--ink); left: 22px; right: 22px; gap: 10px; padding: 0; }
.t8 .bar > div { flex: none; width: 56px; height: 56px; border: 1px solid var(--line); border-radius: 50%; font-size: 0; }
.t8 .bar > div.on { flex: 1; border-radius: 999px; background: var(--ink); color: #fff; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; flex-direction: row; gap: 10px; border-color: var(--ink); }
</style>
</head>
<body>
<h1>Product — אופציות</h1>
<p class="sub">8 עיצובים לדף המוצר באותו מבנה: מסך ראשון (מותג, שם, מחיר, תמונה, 3 פרטים) · מסך שני (תיאור, פרטים, מחיר + הצעה, מוכר, סרגל פעולות)</p>
<div class="grid" id="grid"></div>

<script>
var SHARE = '<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>';
var BACK = '<svg class="i" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
var TEE = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l-5 2.5 2 4.5 2-1V21h10V9l2 1 2-4.5L16 3c0 1.5-1.8 2.5-4 2.5S8 4.5 8 3z"/></svg>';
var ICO = {
  Save: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  Bag: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  Offer: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/></svg>',
  Ask: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>'
};
function topbar(color) { return '<div class="top"' + (color ? ' style="color:' + color + '"' : '') + '>' + SHARE + BACK + '</div>'; }
function bar(label) {
  return '<div class="bar">' + ['Save', 'Bag', 'Offer', 'Ask'].map(function (k) {
    return '<div class="' + (k === 'Bag' ? 'on' : '') + '">' + ICO[k] + (k === 'Bag' && label ? label : k) + '</div>';
  }).join('') + '</div>';
}
var SPECS = '<div class="specs"><div><b>M</b><small>Size</small></div><div><b>Excellent</b><small>Condition</small></div><div><b>Cotton</b><small>Fabric</small></div></div><div class="dots"><i class="on"></i><i></i><i></i></div>';
var ROWS = '<div class="rows">' + [['M', 'Size'], ['Cotton', 'Fabric'], ['Excellent', 'Condition'], ['Unisex', 'Gender'], ['Multicolor', 'Color']].map(function (r) { return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('') + '</div>';
var DESC = '<p class="desc">Cocktail Dress — a piece in excellent condition, available now.</p>';
var BUY = '<div class="buy"><span class="p">₪180.00</span><span class="o">Make an offer</span></div>';
var SELLER = '<div class="seller"><span>Seller: <u>moravchick</u></span><span class="stars">★★★★☆<small>4.5</small></span></div>';
function hero(t, img) { return topbar() + '<div class="hero"><div class="brand">MORAVCHICK</div><div class="pname">Cocktail Dress</div><div class="price">₪180.00</div>' + (img || '<div class="img photo"></div>') + '</div>' + SPECS; }
function det(barLabel) { return topbar() + '<div class="det"><div class="brand">MORAVCHICK</div><div class="pname">Cocktail Dress</div>' + DESC + ROWS + BUY + SELLER + '</div>' + bar(barLabel); }
function pair(t, a, b) { return '<div class="pair"><div class="phone"><div class="screen ' + t + ' s1">' + a + '</div></div><div class="phone"><div class="screen ' + t + ' s2">' + b + '</div></div></div>'; }

var OPTS = [
  ['P1 · הקיים', 'רקע אפור־בהיר, הכול ממורכז, מותג בסריף ענק. במסך השני: שורות פרטים, מחיר והצעה, וסרגל שחור בתחתית.',
