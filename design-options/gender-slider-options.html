<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gender Slider Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8f8d86; --line: #e6e4de; --bg: #faf9f7; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; }
.men { background: url('../men-hero.jpg') center 30% / cover; }
.women { background: url('../women-hero.jpg') center 25% / cover; }
.kids { background: url('../clothing-hero.jpg') center 30% / cover; }
.unisex { background: url('../hero-beach.jpg') center / cover; }

/* site header */
.hdr { height: 86px; background: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 22px 16px; box-shadow: 0 1px 0 var(--line); position: relative; z-index: 5; }
.hdr .l, .hdr .r { display: flex; gap: 18px; align-items: center; }
.hdr svg { width: 20px; height: 20px; stroke: #333; stroke-width: 1.3; fill: none; stroke-linecap: round; }
.hdr .tog { width: 34px; height: 18px; border: 1.3px solid #111; border-radius: 10px; position: relative; } .hdr .tog::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #111; }
.hdr img { height: 28px; position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; }

.eb { display: block; padding: 0 20px; font-size: 8.5px; letter-spacing: 4px; text-transform: uppercase; color: rgba(17,17,17,0.55); }
.hd { padding: 6px 20px 20px; font-size: 32px; font-weight: 400; }
.top { padding-top: 28px; }
.cap { position: absolute; left: 22px; right: 22px; bottom: 22px; color: #fff; z-index: 2; }
.kick { display: block; font-size: 7.5px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.9; }
.nm { display: block; font-size: 28px; margin-top: 6px; line-height: 1; }
.shade::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.62)); z-index: 1; }
.dots { display: flex; gap: 5px; padding: 16px 20px 0; }
.dots i { width: 5px; height: 5px; border-radius: 3px; background: #d6d4cf; } .dots i.on { width: 18px; background: #111; }
.btn { margin: 18px 20px 0; background: #111; color: #fff; text-align: center; padding: 15px; font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; }

/* G1 current */
.g1 .card { margin: 0 20px; height: 486px; position: relative; }

/* G2 peek */
.g2 .rail { display: flex; gap: 12px; padding: 0 20px; }
.g2 .card { flex: none; width: 270px; height: 400px; position: relative; border-radius: 18px; overflow: hidden; }
.g2 .card .nm { font-size: 26px; }
.g2 .arrow { position: absolute; right: 16px; bottom: 18px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 16px; }
.g2 .row2 { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 0; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.g2 .row2 b { color: var(--ink); font-weight: 400; }

/* G3 text tabs + one image */
.g3 .tabs { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.g3 .tabs span { padding: 0 0 12px; font-size: 15px; color: #b5b2aa; position: relative; }
.g3 .tabs span.on { color: var(--ink); } .g3 .tabs span.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.g3 .card { margin: 0 20px; height: 470px; position: relative; }
.g3 .shopln { position: absolute; left: 22px; bottom: 22px; z-index: 2; color: #fff; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid #fff; padding-bottom: 3px; }

/* G4 stacked bands */
.g4 .band { height: 128px; margin: 0 20px 8px; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; color: #fff; overflow: hidden; }
.g4 .band::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.32); }
.g4 .band b { position: relative; font-weight: 400; font-size: 30px; } .g4 .band span { position: relative; font-size: 18px; }
.g4 .band.on { outline: 2px solid #111; outline-offset: 3px; }

/* G5 2x2 */
.g5 .q { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
.g5 .q div { height: 240px; position: relative; overflow: hidden; }
.g5 .q div .cap { left: 14px; bottom: 14px; } .g5 .q div .nm { font-size: 22px; }

/* G6 circles + card */
.g6 .circ { display: flex; justify-content: space-between; padding: 0 20px 18px; }
.g6 .circ div { text-align: center; font-size: 11px; }
.g6 .circ i { display: block; width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 3px var(--bg); }
.g6 .circ div.on i { border-color: #111; } .g6 .circ div:not(.on) { color: var(--muted); }
.g6 .card { margin: 0 20px; height: 410px; position: relative; }

/* G7 big type + counter */
.g7 .full { position: absolute; left: 0; right: 0; top: 86px; bottom: 0; }
.g7 .full::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.15), transparent 30%, rgba(0,0,0,0.7)); }
.g7 .ov { position: absolute; left: 24px; right: 24px; bottom: 120px; z-index: 2; color: #fff; }
.g7 .ov .no { font-size: 11px; letter-spacing: 3px; opacity: 0.85; }
.g7 .ov .big { font-size: 92px; line-height: 0.95; margin-top: 8px; }
.g7 .ov .ln { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.g7 .ov .ln span:last-child { width: 44px; height: 44px; border: 1px solid #fff; border-radius: 50%; display: grid; place-items: center; font-size: 18px; letter-spacing: 0; }
.g7 .prog { position: absolute; left: 24px; right: 24px; bottom: 100px; z-index: 2; display: flex; gap: 6px; }
.g7 .prog i { flex: 1; height: 2px; background: rgba(255,255,255,0.35); } .g7 .prog i.on { background: #fff; }

/* G8 glass segmented over full card */
.g8 .card { margin: 0 20px; height: 540px; position: relative; overflow: hidden; border-radius: 22px; }
.g8 .seg { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 3; display: flex; background: rgba(255,255,255,0.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 4px; }
.g8 .seg span { flex: 1; text-align: center; padding: 10px 0; border-radius: 999px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; }
.g8 .seg span.on { background: #fff; color: #111; }
.g8 .cta { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 3; background: #fff; border-radius: 999px; padding: 15px; text-align: center; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.g8 .cap { bottom: 84px; }

/* G9 coverflow */
.g9 .flow { position: relative; height: 470px; margin-top: 8px; perspective: 900px; }
.g9 .flow div { position: absolute; top: 30px; width: 220px; height: 330px; left: 50%; margin-left: -110px; box-shadow: 0 16px 30px rgba(0,0,0,0.25); }
.g9 .flow .c { top: 0; width: 260px; height: 400px; margin-left: -130px; z-index: 3; }
.g9 .flow .l { transform: translateX(-128px) scale(0.82) rotateY(28deg); z-index: 2; opacity: 0.7; }
.g9 .flow .r { transform: translateX(128px) scale(0.82) rotateY(-28deg); z-index: 2; opacity: 0.7; }
.g9 .flow .c .cap { text-align: center; }
.g9 .ttl { text-align: center; } .g9 .eb { text-align: center; }
.g9 .dots { justify-content: center; padding-top: 0; }
</style>
</head>
<body>
<h1>Gender slider — אופציות</h1>
<p class="sub">9 עיצובים לסליידר "Shop by / Categories" (Men / Women / Kids / Unisex) בראש הפיד</p>
<div class="grid" id="grid"></div>

<script>
var HDR = '<div class="hdr"><span class="l"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="tog"></span></span><img src="../peacock-logo.png" alt=""><span class="r"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span></div>';
var G = [['men', 'Men', 'Sharp, timeless, easy'], ['women', 'Women', 'Elegance, every day'], ['kids', 'Kids', 'Playful, made to last'], ['unisex', 'Unisex', 'No labels, all yours']];
var HEAD = '<div class="top"><span class="eb">Shop by</span><div class="hd">Categories</div></div>';
function cap(g) { return '<span class="cap"><span class="kick">' + g[2] + '</span><span class="nm">' + g[1] + '</span></span>'; }
var DOTS = '<div class="dots"><i class="on"></i><i></i><i></i><i></i></div>';
function scr(cls, inner) { return '<div class="screen ' + cls + '">' + HDR + inner + '</div>'; }

var OPTS = [
  ['G1 · הקיים', 'כותרת "Categories", כרטיס אחד ברוחב מלא עם וידאו, נקודות, וכפתור שחור "Shop Men".',
   scr('g1', HEAD + '<div class="card shade men">' + cap(G[0]) + '</div>' + DOTS + '<div class="btn">Shop Men</div>')],

  ['G2 · רואים את הבא', 'כרטיסים מעוגלים קצת יותר צרים, כך שרואים את קצה הכרטיס הבא — מזמין לגלול. חץ לבן בפינה במקום כפתור.',
   scr('g2', HEAD + '<div class="rail">' + G.slice(0, 2).map(function (g) { return '<div class="card shade ' + g[0] + '">' + cap(g) + '<span class="arrow">→</span></div>'; }).join('') + '</div>' +
     '<div class="row2"><span><b>01</b> / 04</span><span>Swipe</span></div>')],

  ['G3 · טאבים מעל התמונה', 'Men / Women / Kids / Unisex כטאבים טקסט עם קו תחתון, ותמונה אחת גדולה שמתחלפת. קישור "Shop" עדין בתוך התמונה.',
   scr('g3', HEAD + '<div class="tabs"><span class="on">Men</span><span>Women</span><span>Kids</span><span>Unisex</span></div>' +
     '<div class="card shade men"><span class="cap" style="bottom:56px"><span class="kick">Sharp, timeless, easy</span></span><span class="shopln">Shop men →</span></div>')],

  ['G4 · רצועות', 'ארבע רצועות תמונה אחת מתחת לשנייה, כל אחת עם השם וחץ. רואים את כל האפשרויות בבת אחת, בלי לגלול לצד.',
   scr('g4', HEAD + G.map(function (g, i) { return '<div class="band ' + g[0] + (i === 0 ? ' on' : '') + '"><b>' + g[1] + '</b><span>→</span></div>'; }).join(''))],

  ['G5 · ריבועים 2×2', 'ארבע תמונות בגריד של שניים על שניים, עם השם על כל אחת. קומפקטי ונקי.',
   scr('g5', HEAD + '<div class="q">' + G.map(function (g) { return '<div class="shade ' + g[0] + '">' + cap(g) + '</div>'; }).join('') + '</div>')],

  ['G6 · עיגולים + כרטיס', 'שורת עיגולים כמו סטוריז לבחירה, והכרטיס הגדול מתחת מתעדכן לפי מה שנבחר.',
   scr('g6', HEAD + '<div class="circ">' + G.map(function (g, i) { return '<div' + (i === 0 ? ' class="on"' : '') + '><i class="' + g[0] + '"></i>' + g[1] + '</div>'; }).join('') + '</div>' +
     '<div class="card shade men">' + cap(G[0]) + '</div>')],

  ['G7 · מסך מלא + טיפוגרפיה', 'התמונה ממלאת את כל המסך מתחת להדר, השם בגדול מאוד, "01 / 04" ופס התקדמות. הכי דרמטי.',
   scr('g7', '<div class="full men"></div><div class="ov"><div class="no">01 / 04 · Shop by</div><div class="big">Men</div><div class="ln"><span>Sharp, timeless, easy</span><span>→</span></div></div>' +
     '<div class="prog"><i class="on"></i><i></i><i></i><i></i></div>')],

  ['G8 · מתג זכוכית', 'כרטיס מעוגל גדול עם מתג Men / Women / Kids / Unisex שקוף מעל התמונה, וכפתור לבן בתחתית.',
   scr('g8', HEAD + '<div class="card shade men"><div class="seg"><span class="on">Men</span><span>Women</span><span>Kids</span><span>Unisex</span></div>' + cap(G[0]) + '<div class="cta">Shop Men</div></div>')],

  ['G9 · קרוסלה תלת־ממדית', 'הכרטיס הנבחר במרכז גדול, והשכנים קטנים ומוטים בצדדים. מרגיש כמו גלריה.',
   scr('g9', '<div class="top ttl"><span class="eb">Shop by</span><div class="hd">Categories</div></div><div class="flow"><div class="l women shade"></div><div class="r kids shade"></div><div class="c men shade">' + cap(G[0]) + '</div></div>' + DOTS)]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
