<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oak Green — darker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Pinyon+Script&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Poppins',sans-serif; background:#f4f3ef; color:#16150f; padding:30px 20px 60px; }
  h1 { font-family:'Bodoni Moda',serif; font-weight:500; font-size:28px; margin-bottom:4px; }
  .lede { color:#8f8d86; font-size:12px; margin-bottom:24px; }
  .row { display:grid; grid-template-columns:1fr; gap:16px; max-width:560px; margin:0 auto; }
  .opt { border:1px solid #e6e4de; border-radius:4px; background:#fff; overflow:hidden; }
  .head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #eee; }
  .sw { width:30px; height:30px; border-radius:6px; }
  .name { font-family:'Bodoni Moda',serif; font-weight:500; font-size:14px; }
  .hex { font-size:11px; color:#8f8d86; margin-left:auto; letter-spacing:0.5px; }
  .demo { display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:18px 16px; }
  .logo { font-family:'Pinyon Script',cursive; font-size:30px; line-height:1; }
  .btn { height:40px; padding:0 20px; display:inline-flex; align-items:center; color:#fff; font-size:9.5px; letter-spacing:2.5px; text-transform:uppercase; }
  .tag { font-size:9px; letter-spacing:3px; text-transform:uppercase; }
  .nav { height:40px; border-radius:999px; flex:1; min-width:120px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:9px; letter-spacing:2px; text-transform:uppercase; }
  .curr { font-size:9px; color:#b23b3b; letter-spacing:1px; text-transform:uppercase; margin-left:6px; }
</style></head>
<body>
  <h1>Oak Green — darker shades</h1>
  <p class="lede">The current oak and three deeper shades, on the logo, a button, a label and the nav bar. Pick one and I'll apply it site-wide.</p>
  <div class="row" id="row"></div>
<script>
  var shades = [
    { n:'Current', hex:'#4C5A31', cur:true },
    { n:'Darker',  hex:'#3E4A28' },
    { n:'Deep',    hex:'#333D21' },
    { n:'Deepest', hex:'#2A331B' }
  ];
  document.getElementById('row').innerHTML = shades.map(function(s){
    return '<div class="opt">' +
      '<div class="head"><span class="sw" style="background:'+s.hex+'"></span>' +
        '<span class="name">'+s.n+(s.cur?'<span class="curr">current</span>':'')+'</span>' +
        '<span class="hex">'+s.hex+'</span></div>' +
      '<div class="demo">' +
        '<span class="logo" style="color:'+s.hex+'">moravchick</span>' +
        '<span class="btn" style="background:'+s.hex+'">Upload a product</span>' +
        '<span class="tag" style="color:'+s.hex+'">In season</span>' +
      '</div>' +
      '<div class="demo" style="padding-top:0"><span class="nav" style="background:'+s.hex+'">Nav bar</span></div>' +
    '</div>';
  }).join('');
</script>
</body></html>
