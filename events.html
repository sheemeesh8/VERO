<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (window.self === window.top && !/[?&]embed=1/.test(location.search)) {
    var pf = location.pathname.split('/').pop() || 'index';
    if (!/\.html$/.test(pf)) pf += '.html';
    location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
  }
</script>
<title>Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16150f; --muted: #8f8d86; --line: #e6e4de; --line-strong: #cfccc4; --bg: #ffffff;
    --sale: #b23b3b; --drop: #16150f; --live: #b28a3b; --meetup: #1f8f4e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .back {
    position: fixed; top: 20px; left: 20px; z-index: 40;
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
    border: 1px solid var(--ink); border-radius: 999px; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; text-decoration: none; color: var(--ink); background: var(--bg);
    transition: background 0.2s, color 0.2s;
  }
  .back:hover { background: var(--ink); color: #fff; }
  html.is-embed .back { display: none !important; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 84px 24px 90px; }
  html.is-embed .wrap { padding: 22px 18px 120px; }

  .eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Bodoni Moda', 'Didot', Georgia, serif; font-weight: 500; font-size: clamp(30px, 8vw, 42px); margin: 12px 0 12px; letter-spacing: 0.5px; }
  .lede { color: var(--muted); font-size: 13px; font-weight: 300; max-width: 42ch; }

  /* ---- Month navigation ---- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 14px; border-top: 1px solid var(--line); padding-top: 22px; }
  .cal-month { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 22px; letter-spacing: 0.5px; }
  .cal-arrow {
    width: 40px; height: 40px; border: 1px solid var(--line-strong); border-radius: 50%;
    background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: all 0.2s;
  }
  .cal-arrow:hover { border-color: var(--ink); background: var(--ink); color: #fff; }
  .cal-today-btn { font: inherit; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; }
  .cal-today-btn:hover { color: var(--ink); }

  /* ---- Calendar grid ---- */
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .cal-dow span { text-align: center; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border: 1px solid transparent; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; color: var(--ink); cursor: default; position: relative; transition: background 0.15s, border-color 0.15s;
  }
  .cal-cell.blank { visibility: hidden; }
  .cal-cell.muted { color: var(--line-strong); }
  .cal-cell.has { cursor: pointer; }
  .cal-cell.has:hover { border-color: var(--line-strong); }
  .cal-cell.today { border-color: var(--ink); font-weight: 500; }
  .cal-cell.sel { background: var(--ink); color: #fff; }
  .cal-cell.sel .dots i { background: #fff !important; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

  /* ---- Detail list ---- */
  .detail-h { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 6px; }
  .detail-t { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .detail-count { font-size: 11px; color: var(--muted); }
  .ev { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; padding: 18px 2px; border-bottom: 1px solid var(--line); }
  .ev-date { text-align: center; }
  .ev-day { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 22px; line-height: 1; }
  .ev-mon { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .ev-title { font-size: 14px; }
  .ev-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .ev-type { display: inline-flex; align-items: center; gap: 5px; }
  .ev-type i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .ev-time { font-family: 'Bodoni Moda', serif; font-size: 14px; white-space: nowrap; }
  .ev.past { opacity: 0.55; }
  .ev-tools { display: flex; gap: 4px; justify-content: flex-end; margin-top: 8px; }
  .ev-tool { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: all 0.2s; }
  .ev-tool svg { width: 14px; height: 14px; }
  .ev-tool:hover { border-color: var(--ink); color: var(--ink); }
  .ev-tool[data-del]:hover { border-color: var(--sale); color: var(--sale); }
  .ev-empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; font-weight: 300; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; font-size: 10.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---- Seller: add-event control + form ---- */
  .add-btn {
    font: inherit; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; cursor: pointer;
    border: 1px solid var(--ink); border-radius: 999px; background: none; color: var(--ink); transition: all 0.2s;
  }
  .add-btn:hover { background: var(--ink); color: #fff; }
  .add-btn svg { width: 13px; height: 13px; }
  .add-form { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; border-bottom: 1px solid var(--line); }
  .add-form.open { max-height: 460px; }
  .add-inner { padding: 20px 2px 26px; display: grid; gap: 14px; }
  .fld { display: grid; gap: 6px; }
  .fld label { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .fld input, .fld select {
    font: inherit; font-size: 14px; color: var(--ink); background: none;
    border: none; border-bottom: 1px solid var(--line-strong); padding: 8px 2px; outline: none; width: 100%;
  }
  .fld input:focus, .fld select:focus { border-bottom-color: var(--ink); }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .add-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .add-actions .spacer { flex: 1; }
  .fbtn { font: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line-strong); background: none; color: var(--ink); transition: all 0.2s; }
  .fbtn:hover { border-color: var(--ink); }
  .fbtn.save { background: var(--ink); border-color: var(--ink); color: #fff; }
  .fbtn.cancel { border: none; color: var(--muted); }
</style>
</head>
<body>
  <a class="back" href="index.html">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back
  </a>

  <main class="wrap">
    <div class="eyebrow">What's on</div>
    <h1>Events</h1>
    <p class="lede">Drops, sales and live sessions. Browse the months to see what's coming — and what already happened.</p>

    <div id="sellerAdd" style="display:none; margin-top:22px;">
      <button class="add-btn" id="addToggle" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add event
      </button>
      <div class="add-form" id="addForm">
        <div class="add-inner">
          <div class="fld"><label for="fTitle">Title</label><input id="fTitle" type="text" placeholder="e.g. Winter Capsule Drop"></div>
          <div class="fld-row">
            <div class="fld"><label for="fDate">Date</label><input id="fDate" type="date"></div>
            <div class="fld"><label for="fTime">Time</label><input id="fTime" type="text" placeholder="18:00 / All day"></div>
          </div>
          <div class="fld-row">
            <div class="fld"><label for="fType">Type</label>
              <select id="fType"><option value="drop">Drop</option><option value="sale">Sale</option><option value="live">Live</option><option value="meetup">Meetup</option></select>
            </div>
            <div class="fld"><label for="fPlace">Place (optional)</label><input id="fPlace" type="text" placeholder="Online / Tel Aviv"></div>
          </div>
          <div class="add-actions">
            <button class="fbtn cancel" id="fCancel" type="button">Cancel</button>
            <div class="spacer"></div>
            <button class="fbtn save" id="fSave" type="button">Save event</button>
          </div>
        </div>
      </div>
    </div>

    <div class="cal-nav">
      <button class="cal-arrow" id="prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="text-align:center">
        <div class="cal-month" id="calMonth">—</div>
        <button class="cal-today-btn" id="todayBtn">Today</button>
      </div>
      <button class="cal-arrow" id="next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="legend">
      <span><i style="background:var(--drop)"></i>Drop</span>
      <span><i style="background:var(--sale)"></i>Sale</span>
      <span><i style="background:var(--live)"></i>Live</span>
      <span><i style="background:var(--meetup)"></i>Meetup</span>
    </div>

    <div class="detail-h">
      <div class="detail-t" id="detailTitle">Upcoming</div>
      <div class="detail-count" id="detailCount"></div>
    </div>
    <div id="detail"></div>
  </main>

  <script>
  (function eventsPage() {
    if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('is-embed');

    var TYPE = { drop: 'var(--drop)', sale: 'var(--sale)', live: 'var(--live)', meetup: 'var(--meetup)' };
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    var base = new Date(); base.setHours(0,0,0,0);
    function iso(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function shift(days) { var x = new Date(base); x.setDate(x.getDate()+days); return iso(x); }

    var readJSON = function (k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };
    var EKEY = 'vero_events';

    // Live demo events (always current, relative to today) …
    var DEMO = [
      { title: 'End of Season Sale',   date: shift(-46), type: 'sale',   time: 'All day' },
      { title: 'Vintage Vault Drop',   date: shift(-31), type: 'drop',   time: '18:00' },
      { title: 'Styling Live',         date: shift(-12), type: 'live',   time: '20:00' },
      { title: 'Members Flea Market',  date: shift(-4),  type: 'meetup', time: '11:00', place: 'Tel Aviv' },
      { title: 'Autumn New Arrivals',  date: shift(2),   type: 'drop',   time: '10:00' },
      { title: 'Members Preview Night',date: shift(6),   type: 'live',   time: '19:30' },
      { title: 'Weekend Flash Sale',   date: shift(11),  type: 'sale',   time: '09:00' },
      { title: 'Designer Q&A',         date: shift(23),  type: 'live',   time: '20:30' },
      { title: 'Winter Capsule Drop',  date: shift(38),  type: 'drop',   time: '10:00' }
    ];
    // … merged with the seller's own saved events (persisted in localStorage).
    var userEvents = readJSON(EKEY, []);
    if (!Array.isArray(userEvents)) userEvents = [];
    var EVENTS = [], byDate = {};
    function rebuild() {
      EVENTS = DEMO.concat(userEvents);
      byDate = {};
      EVENTS.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    }
    function saveUser() { try { localStorage.setItem(EKEY, JSON.stringify(userEvents)); } catch (e) {} }
    rebuild();

    var isSeller = false;
    try { isSeller = localStorage.getItem('vero_active_account') === 'seller'; } catch (e) {}
    if (/[?&]seller=1/.test(location.search)) isSeller = true;

    var view = new Date(base.getFullYear(), base.getMonth(), 1);
    var selected = null;
    // Deep link from the storefront: ?date=YYYY-MM-DD selects that day + month.
    var qd = (location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/) || [])[1];
    if (qd) { selected = qd; view = new Date(+qd.slice(0,4), +qd.slice(5,7)-1, 1); }

    var grid = document.getElementById('calGrid');
    var monthEl = document.getElementById('calMonth');
    var detail = document.getElementById('detail');
    var detailTitle = document.getElementById('detailTitle');
    var detailCount = document.getElementById('detailCount');

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    function dot(t) { return '<i style="background:' + (TYPE[t] || 'var(--muted)') + '"></i>'; }

    function renderCal() {
      var y = view.getFullYear(), m = view.getMonth();
      monthEl.textContent = MONF[m] + ' ' + y;
      var first = new Date(y, m, 1).getDay();
      var days = new Date(y, m + 1, 0).getDate();
      var todayIso = iso(base);
      var html = '';
      for (var b = 0; b < first; b++) html += '<div class="cal-cell blank"></div>';
      for (var d = 1; d <= days; d++) {
        var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var evs = byDate[ds] || [];
        var cls = 'cal-cell';
        if (evs.length) cls += ' has';
        if (ds === todayIso) cls += ' today';
        if (ds === selected) cls += ' sel';
        var dots = evs.length ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return dot(e.type); }).join('') + '</div>' : '<div class="dots"></div>';
        html += '<div class="' + cls + '" data-d="' + ds + '"><span>' + d + '</span>' + dots + '</div>';
      }
      grid.innerHTML = html;
    }

    function evRow(e, isPast) {
      var parts = e.date.split('-'), dd = +parts[2], mm = +parts[1]-1;
      var meta = '<span class="ev-type">' + dot(e.type) + e.type.charAt(0).toUpperCase() + e.type.slice(1) + '</span>';
      if (e.place) meta += '<span>· ' + esc(e.place) + '</span>';
      // Seller-owned events get edit / delete controls.
      var own = isSeller && e.own, uidx = own ? userEvents.indexOf(e) : -1;
      var controls = (own && uidx > -1)
        ? '<div class="ev-tools">' +
            '<button class="ev-tool" data-edit="' + uidx + '" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>' +
            '<button class="ev-tool" data-del="' + uidx + '" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' +
          '</div>'
        : '';
      return '<div class="ev' + (isPast ? ' past' : '') + '">' +
        '<div class="ev-date"><div class="ev-day">' + dd + '</div><div class="ev-mon">' + MON[mm] + '</div></div>' +
        '<div><div class="ev-title">' + esc(e.title) + '</div><div class="ev-meta">' + meta + '</div></div>' +
        '<div class="ev-time">' + esc(e.time) + controls + '</div>' +
      '</div>';
    }

    function renderDetail() {
      var todayIso = iso(base);
      if (selected) {
        var evs = (byDate[selected] || []).slice().sort(function(a,b){ return a.time < b.time ? -1 : 1; });
        var pt = selected.split('-');
        detailTitle.textContent = MONF[+pt[1]-1] + ' ' + (+pt[2]);
        detailCount.textContent = evs.length + (evs.length === 1 ? ' event' : ' events');
        detail.innerHTML = evs.length ? evs.map(function(e){ return evRow(e, selected < todayIso); }).join('') : '<div class="ev-empty">No events on this day.</div>';
        return;
      }
      // No selection: show this month's events (upcoming first, then past this month).
      var y = view.getFullYear(), m = view.getMonth();
      var monthEvs = EVENTS.filter(function(e){ var p = e.date.split('-'); return +p[0] === y && (+p[1]-1) === m; })
        .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time < b.time ? -1 : 1); });
      var isCurrentMonth = (y === base.getFullYear() && m === base.getMonth());
      detailTitle.textContent = isCurrentMonth ? 'Upcoming' : (MONF[m] + ' events');
      detailCount.textContent = monthEvs.length + (monthEvs.length === 1 ? ' event' : ' events');
      if (isCurrentMonth) {
        var up = monthEvs.filter(function(e){ return e.date >= todayIso; });
        var past = monthEvs.filter(function(e){ return e.date < todayIso; });
        monthEvs = up.concat(past);
      }
      detail.innerHTML = monthEvs.length
        ? monthEvs.map(function(e){ return evRow(e, e.date < todayIso); }).join('')
        : '<div class="ev-empty">No events this month.</div>';
    }

    function refresh() { renderCal(); renderDetail(); }

    grid.addEventListener('click', function (e) {
      var cell = e.target.closest('.cal-cell.has'); if (!cell) return;
      var ds = cell.getAttribute('data-d');
      selected = (selected === ds) ? null : ds;
      refresh();
    });
    document.getElementById('prev').addEventListener('click', function () { view.setMonth(view.getMonth()-1); selected = null; refresh(); });
    document.getElementById('next').addEventListener('click', function () { view.setMonth(view.getMonth()+1); selected = null; refresh(); });
    document.getElementById('todayBtn').addEventListener('click', function () { view = new Date(base.getFullYear(), base.getMonth(), 1); selected = null; refresh(); });

    // ---- Seller: add / edit / delete events (only in the seller account). ----
    if (isSeller) {
      var addForm = document.getElementById('addForm');
      var fTitle = document.getElementById('fTitle'), fDate = document.getElementById('fDate'),
          fTime = document.getElementById('fTime'), fType = document.getElementById('fType'),
          fPlace = document.getElementById('fPlace'), fSaveBtn = document.getElementById('fSave'),
          addToggle = document.getElementById('addToggle');
      document.getElementById('sellerAdd').style.display = 'block';
      var editIdx = -1;

      function openForm(ev) {
        editIdx = ev ? userEvents.indexOf(ev) : -1;
        fTitle.value = ev ? ev.title : '';
        fDate.value  = ev ? ev.date : (selected || iso(base));
        fTime.value  = ev ? (ev.time || '') : '';
        fType.value  = ev ? ev.type : 'drop';
        fPlace.value = ev ? (ev.place || '') : '';
        fSaveBtn.textContent = ev ? 'Update event' : 'Save event';
        addToggle.lastChild.textContent = ev ? ' Edit event' : ' Add event';
        addForm.classList.add('open');
      }
      function closeForm() { addForm.classList.remove('open'); editIdx = -1; fSaveBtn.textContent = 'Save event'; addToggle.lastChild.textContent = ' Add event'; }
      addToggle.addEventListener('click', function () { addForm.classList.contains('open') ? closeForm() : openForm(null); });
      document.getElementById('fCancel').addEventListener('click', closeForm);

      fSaveBtn.addEventListener('click', function () {
        var title = fTitle.value.trim(), date = fDate.value;
        if (!title || !date) { alert('Add a title and a date.'); return; }
        var rec = { title: title, date: date, type: fType.value, time: fTime.value.trim() || 'All day', place: fPlace.value.trim() || undefined, own: true };
        if (editIdx > -1 && userEvents[editIdx]) userEvents[editIdx] = rec; else userEvents.push(rec);
        saveUser(); rebuild(); closeForm();
        view = new Date(+date.slice(0,4), +date.slice(5,7)-1, 1); selected = date; refresh();
      });

      // Edit / delete from a row's tools.
      detail.addEventListener('click', function (e) {
        var ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
        if (ed) { var ie = +ed.getAttribute('data-edit'); if (userEvents[ie]) { openForm(userEvents[ie]); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
        else if (del) {
          var idl = +del.getAttribute('data-del');
          if (userEvents[idl] && confirm('Delete "' + userEvents[idl].title + '"?')) { userEvents.splice(idl, 1); saveUser(); rebuild(); refresh(); }
        }
      });
    }

    refresh();
  })();
  </script>
</body>
</html>
