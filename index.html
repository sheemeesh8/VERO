<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="moravchick — a curated marketplace for pre-loved fashion and art.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick</title>
    <!-- The site now has a single feed. The home page opens straight onto it. -->
    <link rel="canonical" href="feed.html">
    <meta http-equiv="refresh" content="0; url=feed.html">
    <script>
        // Carry any segment/gender hint from an old link onto the feed, then go.
        (function () {
            try {
                var p = new URLSearchParams(location.search);
                var seg = p.get('seg') || p.get('gender');
                var q = (seg ? ('?gender=' + encodeURIComponent(seg)) : '') + location.hash;
                location.replace('feed.html' + q);
            } catch (e) {
                location.replace('feed.html');
            }
        })();
    </script>
    <style>
        html, body { margin: 0; height: 100%; background: #fff; color: #111;
            font-family: 'Arimo', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        .redir { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
        .redir a { color: #111; text-decoration: underline; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
        .redir p { color: #8a857c; font-size: 13px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <!-- Fallback for clients that neither run JS nor honour the meta refresh. -->
    <div class="redir">
        <p>Taking you to the feed…</p>
        <a href="feed.html">Open the feed</a>
    </div>
</body>
</html>
