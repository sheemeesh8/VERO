<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — Sale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        .wrap {
            max-width: none; margin: 0; padding: 0;
            /* Fade in — matches the wishlist. */
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft { from { opacity: 0; } to { opacity: 1; } }

        /* ===== HERO SECTION ===== */
        .sale-hero {
            position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
            background: #201d1a url('sale-hero.jpg') center / cover no-repeat;
            color: #fff; overflow: hidden;
        }
        /* Dark wash so the white text reads over any image. */
        .sale-hero::after {
            content: ''; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.12) 42%, rgba(0,0,0,0.78) 100%);
        }
        .sale-hero > * { position: relative; z-index: 2; }
        /* Top bar over the hero — icons in white. */

        /* Centred editorial layout — identical to the home page hero overlay. */
        .sh-inner {
            position: absolute; inset: 0; padding: 96px 28px 78px; direction: ltr;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,0.45);
        }
        .sh-top { display: flex; flex-direction: column; align-items: center; }
        .sh-mid { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 20px; }

        /* Kicker "Welcome to"–style. */
        .sh-eyebrow {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 8.5px; font-weight: 300; letter-spacing: 5px; text-transform: uppercase;
            color: rgba(255,255,255,0.8); margin-bottom: 14px;
        }
        /* Oversized Bodoni display title — same face and scale as the home hero. */
        .sh-title {
            font-size: clamp(42px, 13vw, 72px) !important; font-weight: 500 !important;
            line-height: 1.02 !important; letter-spacing: 0.5px !important; text-transform: uppercase;
            margin: 0 0 16px !important; color: #fff !important; direction: ltr;
        }
        .sh-title::first-letter { color: #fff; }
        /* Secondary heading — slider-overline scale. */
        .sh-heading {
            direction: ltr; display: block;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 9px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            line-height: 1.9; margin: 0 0 12px; max-width: 280px; color: #fff;
        }
        /* Plain "swipe" hint — text only, not a button. */
        .sh-cta {
            margin-top: 22px; display: inline-block;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 10px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(255,255,255,0.85);
        }
        /* Quick category links beneath the CTA. */
        .sh-links {
            margin-top: 22px; display: flex; flex-direction: column; gap: 7px;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 9px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(255,255,255,0.72);
        }
        /* Scroll indicator at the bottom-centre. */
        .sh-bottom {
            position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .sh-swipe {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 8.5px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            color: rgba(255,255,255,0.72);
        }
        .sh-scrollline { position: relative; width: 1px; height: 40px; background: rgba(255,255,255,0.4); overflow: hidden; }
        .sh-scrollline::after {
            content: ''; position: absolute; left: 0; top: -16px; width: 1px; height: 16px; background: #fff;
            animation: shScrollDot 1.9s cubic-bezier(0.65,0,0.35,1) infinite;
        }
        @keyframes shScrollDot { 0% { top: -16px; opacity: 0; } 25% { opacity: 1; } 100% { top: 40px; opacity: 0; } }

        /* ===== STICKY NAV BAR — two titled halves: categories | discount ===== */
        /* A transparent wrapper: the two halves are now separate capsules. */
        .sale-catbar {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80;
            display: flex; align-items: stretch; gap: 10px;
            width: min(94vw, 620px);
            color: #fff;
        }
        /* Each half is its own rounded capsule that opens its own popup. */
        .cb-part {
            flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 5px;
            align-items: center;
            padding: 12px 18px; cursor: pointer; text-align: center;
            background: rgba(18,18,18,0.94);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.16); border-radius: 22px;
            box-shadow: 0 10px 34px rgba(0,0,0,0.32);
            transition: opacity 0.2s;
        }
        .cb-part:active { opacity: 0.6; }
        .cb-sep { display: none; }
        .cb-title {
            font-family: 'Bodoni Moda', 'Didot', Georgia, serif;
            font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase;
            color: rgba(255,255,255,0.6); white-space: nowrap;
        }
        .cb-value {
            font-family: 'Bodoni Moda', 'Didot', Georgia, serif;
            font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== Popups that open above each half of the nav bar ===== */
        .cb-pop {
            position: fixed; z-index: 85; display: none;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px) + 78px);
            width: min(86vw, 320px); max-height: 46vh; overflow-y: auto;
            background: rgba(18,18,18,0.97);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.16); border-radius: 18px;
            padding: 14px; box-shadow: 0 14px 44px rgba(0,0,0,0.42);
            animation: cbPopIn 0.2s cubic-bezier(0.22,1,0.36,1) both;
        }
        .cb-pop.open { display: block; }
        @keyframes cbPopIn { from { opacity: 0; transform: translate(var(--cb-tx, -50%), 8px); } to { opacity: 1; transform: translate(var(--cb-tx, -50%), 0); } }
        .cb-pop-title { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 12px; font-family: 'Bodoni Moda', Georgia, serif; }
        /* Option chips (categories + discount steps) — a vertical stack, one
           full-width option per row. */
        .catbar-chips, .cb-disc-opts { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
        .catbar-chips button, .cb-disc-opts button {
            width: 100%; border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #d9d9d4; cursor: pointer;
            font-family: 'Bodoni Moda', 'Didot', Georgia, serif;
            font-size: 12.5px; letter-spacing: 1px; text-transform: uppercase;
            padding: 11px 16px; border-radius: 999px; white-space: nowrap; text-align: center;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .catbar-chips button:hover, .cb-disc-opts button:hover { border-color: #fff; color: #fff; }
        .catbar-chips button.on, .cb-disc-opts button.on { background: #fff; color: #111; border-color: #fff; }

        /* ===== Shared header over the dark sale hero =====
           header.js already makes the toggle white here; the logo + icons need the
           same white treatment while the header floats over the hero image. Once
           scrolled past the hero, header.js flips everything back to dark. */
        #siteHeader.sticky-look:not(.scrolled) .header-left > a,
        #siteHeader.sticky-look:not(.scrolled) .logo { color: #fff; }
        #siteHeader.sticky-look:not(.scrolled) .icon-btn { color: #fff; }
        #siteHeader.sticky-look:not(.scrolled) .icon-btn svg { stroke: #fff !important; }
        #siteHeader.sticky-look:not(.scrolled) .icon-btn svg[data-fill] { fill: #fff !important; stroke: none; }

        /* ===== BODY (cards) ===== */
        .page-body { padding: 30px clamp(20px,5vw,40px) 140px; }
        @media (max-width: 768px) {
            .page-body { padding-left: 14px; padding-right: 14px; }
        }

        /* ---- Sticky top bar — transparent over the hero, solid once scrolled ---- */
        .cart-topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 90;
            display: flex; align-items: center; justify-content: space-between;
            padding: max(10px, env(safe-area-inset-top,0px)) clamp(16px,5vw,34px) 12px;
            background: transparent; border-bottom: 1px solid transparent;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .cart-topbar.scrolled {
            background: rgba(255,255,255,0.94);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border-bottom-color: rgba(0,0,0,0.08); box-shadow: 0 1px 12px rgba(0,0,0,0.05);
        }
        .cart-topbar .tb-right { display: flex; align-items: center; gap: 4px; }
        .tb-ico {
            width: 42px; height: 42px; flex: none; border: none; background: none;
            color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s, color 0.3s ease; text-decoration: none;
        }
        .tb-ico svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4)); }
        .cart-topbar.scrolled .tb-ico { color: #16150f; }
        .cart-topbar.scrolled .tb-ico svg { filter: none; }
        .tb-ico:active { opacity: 0.5; }
        .tb-ico svg { width: 23px; height: 23px; stroke: currentColor; stroke-width: 1.25; fill: none; }

        /* Left-aligned header: kicker · title · subtitle, all flush left. */
        .head-row {
            display: flex; flex-direction: column; align-items: flex-end; text-align: left; gap: 8px;
        }
        /* Eyebrow — the hero's line + spaced uppercase label. */
        .head-kicker {
            display: inline-flex; align-items: center; gap: 12px; order: -1;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #EB2323;
        }
        .head-kicker::before { content: ''; width: 24px; height: 1px; background: currentColor; display: inline-block; }

        /* Title — the same face as the hero collection title: Bodoni Moda 500. */
        .head-title {
            font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
            font-size: clamp(28px, 6vw, 52px); font-weight: 500; line-height: 1.05;
            letter-spacing: 0.5px; text-transform: uppercase; direction: ltr;
        }
        .head-title::first-letter { color: #b8b8b8; }
        .head-sub { margin-top: 8px; font-size: 12.5px; color: #6b6b66; letter-spacing: 0.5px; text-align: left; max-width: 40em; }
        .head-desc {
            margin-top: 14px; direction: ltr; text-align: right;
            font-size: 13px; line-height: 1.7; color: #6b6b66; max-width: 46em;
        }

        /* Full-width clothing-type filter across the whole page. */
        .type-chips {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        }
        .type-chips button {
            flex: 0 0 auto; font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer; font-family: inherit;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 9px 18px; border-radius: 999px;
            transition: background 0.2s, color 0.2s, border-color 0.2s; white-space: nowrap;
        }
        .type-chips button:hover { border-color: #111; }
        .type-chips button.on { background: #111; color: #fff; border-color: #111; }

        /* Sort control (in the sheet). */
        .s-sort { display: flex; flex-direction: column; gap: 8px; }
        .s-sort button {
            font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: right;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 13px 16px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s, background 0.2s;
        }
        .s-sort button:hover { border-color: #111; }
        .s-sort button.on { border-color: #EB2323; background: #fff5f5; }
        .s-sort button .chk { color: #EB2323; font-weight: 700; opacity: 0; }
        .s-sort button.on .chk { opacity: 1; }

        /* Summary ticker — one stat at a time, fading (same as the cart / wishlist). */
        .cart-ticker {
            position: relative; width: 100%; height: 34px;
            border-bottom: 1px solid #16150f; margin: 30px 0 16px;
        }
        .cart-stat {
            position: absolute; left: 0; right: 0; top: 50%;
            transform: translateY(-50%) translateY(10px);
            opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
            display: flex; flex-direction: row-reverse; align-items: center;
            justify-content: space-between;
            pointer-events: none; white-space: nowrap;
        }
        .cart-stat.is-active { opacity: 1; transform: translateY(-50%); }
        .cart-stat .cs-num { font-size: 18px; font-weight: 300; letter-spacing: 2px; line-height: 1; color: #16150f; }
        .cart-stat .cs-lbl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: #a8a399; }

        /* The thin black line, reborn as a 0–100 discount slider. */
        .disc-line { margin: 30px 0 16px; }
        .disc-line-top {
            display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;
        }
        .disc-line .dl-lbl { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #9a9a95; font-weight: 700; }
        .disc-line .dl-val { font-size: 20px; font-weight: 300; color: #16150f; letter-spacing: 1px; }
        .disc-line input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 1px; margin: 0;
            background: #16150f; outline: none; cursor: pointer;
        }
        .disc-line input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #16150f; cursor: pointer; margin-top: 0;
        }
        .disc-line input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border: none; border-radius: 50%; background: #16150f; cursor: pointer;
        }

        /* Product grid — the feed's grid, so feed-card.css / feed-card.js
           (both scoped to .prod-grid) style and drive the cards exactly as
           they do in the feed. */
        .prod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
        }
        @media (max-width: 768px) {
            .prod-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
        /* ===== Sale cards laid out one-to-one like the feed cards: brand + price
           on the top row (hairline beneath), the product name below, and no sale
           frame. ===== */
        .prod-grid .product-card.is-sale::before { display: none !important; }   /* drop the red frame */
        .prod-grid .product-seller { grid-column: 1 / 2 !important; grid-row: 1 !important; align-self: baseline !important; }
        .prod-grid .product-price,
        .prod-grid .product-card.is-sale .product-price {
            grid-column: 2 / 3 !important; grid-row: 1 !important;
            justify-self: end !important; align-self: baseline !important; height: auto !important;
        }
        .prod-grid .product-name { grid-column: 1 / -1 !important; grid-row: 3 !important; }
        /* Sale price on one line: current price with the old one struck beside it. */
        .prod-grid .product-card.is-sale .vprice-wrap {
            flex-direction: row !important; align-items: baseline !important; gap: 6px !important; height: auto !important;
        }
        .prod-grid .product-card.is-sale .vprice-sale { height: auto !important; }
        .prod-grid .product-card.is-sale .vprice-was { height: auto !important; order: 2; }
        .cart-empty {
            margin-top: 52px; border: 1px solid #ecebe7; border-radius: 18px; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 10px 34px rgba(0,0,0,0.045);
            padding: 60px 40px; font-size: 12.5px; color: #9a9a95; text-align: center;
        }

        /* ---- Filters bottom-sheet — same as the cart / wishlist ---- */
        .cart-sheet-overlay {
            position: fixed; inset: 0; background: rgba(20,18,14,0.4);
            display: none; align-items: flex-end; justify-content: center; z-index: 300;
        }
        .cart-sheet-overlay.show { display: flex; }
        .cart-sheet {
            width: 100%; max-width: 560px; background: #fff; border-radius: 20px 20px 0 0;
            padding: 22px 24px calc(28px + env(safe-area-inset-bottom,0px));
            transform: translateY(100%); animation: cartSheetRise 0.34s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes cartSheetRise { to { transform: translateY(0); } }
        .cart-sheet .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #e6e1d8; margin: 0 auto 18px; }
        .cart-sheet h3 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; text-align: center; }

        /* Search + discount filter live inside the sheet. */
        .s-search { position: relative; margin-bottom: 22px; }
        .s-search input {
            width: 100%; height: 52px; border: 1.5px solid #111; background: transparent;
            padding: 0 18px 0 52px; font-size: 15px; color: #111; border-radius: 0; font-family: inherit;
        }
        .s-search input::placeholder { color: #9a9a95; }
        .s-search svg { position: absolute; top: 50%; left: 18px; transform: translateY(-50%); width: 20px; height: 20px; stroke: #111; fill: none; stroke-width: 1.25; }

        .s-filter-lbl { display: block; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #9a9a95; font-weight: 700; text-align: center; margin-bottom: 12px; }
        .s-disc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .s-disc button {
            font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer; font-family: inherit;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 9px 16px; border-radius: 999px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .s-disc button:hover { border-color: #111; }
        .s-disc button.on { background: #EB2323; color: #fff; border-color: #EB2323; }
        /* Header removed from the sales page by request. */
        #siteHeader { display: none !important; }

        /* ===== Feed-style floating nav bar (ALL + categories + Filters) ===== */
        .sale-catbar, .cb-pop { display: none !important; }   /* retire the old catbar */
        .feed-nav {
            position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%;
            /* Hidden (slid down) over the hero; rises up once .in is added on scroll. */
            transform: translateX(-50%) translateY(26px); opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
            z-index: 900; display: flex; align-items: stretch; gap: 4px; direction: ltr;
            /* Shared bottom-bar size (feed / sale / seller area / personal area): 94vw up to 460px wide, 62px tall, 24px above the bottom edge. */
            width: 94vw; max-width: 460px; height: 62px; box-sizing: border-box; overflow: hidden;
            background: rgba(7,12,28,0.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 5px;
            box-shadow: 0 6px 26px rgba(0,0,0,0.28);
        }
        .feed-nav.in { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            .feed-nav { transition: none; opacity: 1; transform: translateX(-50%); }
        }
        .feed-nav-tab {
            position: relative; z-index: 1; flex: none; border: none; background: transparent;
            font-family: inherit; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
            color: #b5b5b0; padding: 9px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }
        .feed-nav-tab.is-active { color: #EB2323; background: #fff; }
        .feed-nav-filter {
            position: relative; flex: none; border: none; background: transparent; color: #b5b5b0;
            padding: 0 12px; border-radius: 999px; cursor: pointer; display: flex; align-items: center;
        }
        .feed-nav-filter svg { width: 17px; height: 17px; }
        .feed-nav-filter.has::after {
            content: ''; position: absolute; top: 5px; right: 7px; width: 6px; height: 6px;
            border-radius: 50%; background: #EB2323;
        }
        .feed-nav-sep { width: 1px; align-self: stretch; margin: 5px 3px; background: rgba(255,255,255,0.22); flex: none; }
        .feed-nav-view {
            flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 30px, #000 100%);
                    mask-image: linear-gradient(to right, transparent 0, #000 30px, #000 100%);
        }
        .feed-nav-view::-webkit-scrollbar { display: none; }
        .feed-nav-track { display: flex; width: max-content; gap: 6px; }
        /* Match the feed bar's typeface (Arimo, uppercase) — beats aharoni.css. */
        .feed-nav:not(#zzzz):not(#zzzz):not(#zzzz),
        .feed-nav-tab:not(#zzzz):not(#zzzz):not(#zzzz),
        .feed-nav *:not(#zzzz):not(#zzzz):not(#zzzz) {
            font-family: 'Arimo', 'Segoe UI', Arial, sans-serif !important;
            text-transform: uppercase !important;
        }

        /* ===== Discount-slider sheet (black Gucci style, like the feed) ===== */
        .sl-scrim {
            position: fixed; inset: 0; z-index: 100000; background: rgba(20,20,20,0.28);
            -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); touch-action: none;
            opacity: 0; visibility: hidden; pointer-events: none;
            /* Close: quick, smooth fade. */
            transition: opacity 0.24s ease, visibility 0s linear 0.24s;
        }
        .sl-scrim.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.4s ease; }
        .sl-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100001; width: 100%;
            height: 42vh; height: 42svh; box-sizing: border-box; color: #fff;
            background: #070c1c; border-top: 1px solid rgba(255,255,255,0.14); border-radius: 26px 26px 0 0;
            display: flex; flex-direction: column;
            opacity: 1; visibility: hidden; pointer-events: none; transform: translateY(100%);
            /* Close: quick slide-out with a smooth ease. */
            transition: transform 0.26s cubic-bezier(0.4,0,0.2,1), visibility 0s linear 0.26s;
        }
        .sl-sheet.open { visibility: visible; pointer-events: auto; transform: translateY(0);
            transition: transform 0.42s cubic-bezier(0.22,1,0.36,1); }
        @media (prefers-reduced-motion: reduce) {
            .sl-sheet, .sl-sheet.open, .sl-scrim, .sl-scrim.open { transition: none; }
        }
        .sl-sheet-body { flex: 1 1 auto; min-height: 0; padding: 26px 26px 10px; display: flex; flex-direction: column; }
        .sl-step { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
        .sl-step[hidden] { display: none; }
        .sl-step-label { flex: none; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.55); }
        /* Step 1: a scrollable list of product-type options. */
        .sl-cats { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
        .sl-cat {
            display: block; width: 100%; border: none; background: transparent; text-align: left;
            cursor: pointer; padding: 12px 2px; font-family: inherit;

        input.sl-range { width: 100%; -webkit-appearance: none; appearance: none; height: 2px; background: rgba(255,255,255,0.28); outline: none; border-radius: 2px; }
        input.sl-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; cursor: pointer; }
        input.sl-range::-moz-range-thumb { width: 24px; height: 24px; border: none; border-radius: 50%; background: #fff; cursor: pointer; }

        /* Full-width wizard buttons with small side gutters. */

        .sl-next, .sl-back, .sl-done { flex: 1; font-size: 14px; letter-spacing: 1px; padding: 16px 0; text-align: center; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; cursor: pointer; background: transparent; color: #fff; }

    <script>

        window.openFilters = function () { var o = document.getElementById('filterOverlay'); if (o) { o.classList.add('show'); var q = document.getElementById('q'); if (q) setTimeout(function () { q.focus(); }, 250); } };
        window.closeFilters = function () { var o = document.getElementById('filterOverlay'); if (o) o.classList.remove('show'); };
        window.shareSale = function () {

            if (navigator.share) { navigator.share({ title: 'moravchick', text: 'moravchick — The Best Sales', url: url }).catch(function(){}); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});

    <script src="product-overrides.js"></script>
    <script src="collections.js"></script>
    <script>
        (function () {
            var VC = window.veroCollections;
            var all = VC.onSale();               // already sorted deepest-cut first
            var cat = 'all', sortDir = 'desc', term = '', minPct = 0;

            var body = document.getElementById('cartBody');
            var qEl = document.getElementById('q');
            var sortFilter = document.getElementById('sortFilter');

            // ---- Feed-style nav bar: ALL + a scrolling row of category tabs. ----
            var track = document.getElementById('slTrack');
            var allTab = document.querySelector('.feed-nav-tab[data-cat="all"]');
            var cats = [];
            all.forEach(function (p) { if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
            track.innerHTML = cats.map(function (c) {
                return '<button type="button" class="feed-nav-tab" data-cat="' + c.replace(/"/g, '') + '">' + c + '</button>';
            }).join('');
            // Keep the nav-bar tab and the sheet's step-1 list in sync on the value.
            function syncCat() {
                document.querySelectorAll('.feed-nav-tab').forEach(function (x) { x.classList.toggle('is-active', x.dataset.cat === cat); });
                document.querySelectorAll('.sl-cat').forEach(function (x) { x.classList.toggle('on', x.dataset.cat === cat); });
            }
            function setCat(v) { cat = v; syncCat(); render(); }
            document.getElementById('slNav').addEventListener('click', function (e) {
                var b = e.target.closest('.feed-nav-tab'); if (b) setCat(b.dataset.cat);
            });

            // Sort direction — highest → lowest discount, or the reverse.
            sortFilter.addEventListener('click', function (e) {
                var b = e.target.closest('button[data-sort]');
                if (!b) return;
                sortDir = b.dataset.sort;
                sortFilter.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
                render();
            });

            function matches(p) {
                if ((p._d.percent || 0) < minPct) return false;
                if (cat !== 'all' && p.category !== cat) return false;
                if (term) {
                    var hay = (p.name + ' ' + p.seller + ' ' + p.category).toLowerCase();
                    if (hay.indexOf(term) === -1) return false;
                }
                return true;
            }

            function render() {
                var items = all.filter(matches).slice().sort(function (a, b) {
                    return sortDir === 'asc'
                        ? a._d.percent - b._d.percent
                        : b._d.percent - a._d.percent;
                });

                if (!items.length) {
                    body.innerHTML = '<div class="cart-empty">No items at ' + minPct + '% off or more — try a lower discount.</div>';
                    return;
                }

                body.innerHTML =
                    '<div class="prod-grid">' + items.map(function (p) { return VC.cardHTML(p); }).join('') + '</div>';
            }

            // ---- Two-step filter sheet: 1) product type, 2) discount slider. ----
            var scrim = document.getElementById('slScrim');
            var sheet = document.getElementById('slSheet');
            var range = document.getElementById('slRange');
            var discVal = document.getElementById('slDiscVal');
            var filterBtn = document.getElementById('slFilterBtn');
            var step1 = document.getElementById('slStep1');
            var step2 = document.getElementById('slStep2');
            var backBtn = document.getElementById('slBack');
            var nextBtn = document.getElementById('slNext');
            var doneBtn = document.getElementById('slDone');

            // Step 1 list: All + each product type on sale.
            var sheetCats = document.getElementById('slSheetCats');
            sheetCats.innerHTML =
                '<button type="button" class="sl-cat on" data-cat="all">All</button>' +
                cats.map(function (c) {
                    return '<button type="button" class="sl-cat" data-cat="' + c.replace(/"/g, '') + '">' + c + '</button>';
                }).join('');
            sheetCats.addEventListener('click', function (e) {
                var b = e.target.closest('.sl-cat'); if (b) setCat(b.dataset.cat);
            });

            function setDisc(v) {
                minPct = parseInt(v, 10) || 0;
                discVal.textContent = minPct + '%';
                filterBtn.classList.toggle('has', minPct > 0 || cat !== 'all');
                render();
            }
            // Show a given step (1 or 2) and swap the footer buttons.
            var step = 1;
            function showStep(n) {
                step = n;
                step1.hidden = n !== 1;
                step2.hidden = n !== 2;
                backBtn.hidden = n === 1;
                nextBtn.hidden = n === 2;
                doneBtn.hidden = n === 1;
            }
            var sheetOpen = false;
            function openSheet() {
                range.value = minPct;
                discVal.textContent = minPct + '%';
                syncCat();
                showStep(1);
                requestAnimationFrame(function () { scrim.classList.add('open'); sheet.classList.add('open'); });
                sheetOpen = true;
            }
            function closeSheet() {
                scrim.classList.remove('open'); sheet.classList.remove('open'); sheetOpen = false;
            }
            filterBtn.addEventListener('click', function (e) { e.stopPropagation(); sheetOpen ? closeSheet() : openSheet(); });
            scrim.addEventListener('click', closeSheet);
            scrim.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
            range.addEventListener('input', function () { setDisc(range.value); });
            nextBtn.addEventListener('click', function () { showStep(2); });
            backBtn.addEventListener('click', function () { showStep(1); });
            doneBtn.addEventListener('click', closeSheet);
            document.getElementById('slClose').addEventListener('click', closeSheet);

            // Free-text search (inside the top-bar sheet).
            var t;
            if (qEl) qEl.addEventListener('input', function () {
                clearTimeout(t);
                t = setTimeout(function () { term = qEl.value.trim().toLowerCase(); render(); }, 120);
            });

            render();
        })();

        // Reveal the nav bar on scroll: hidden over the full-screen sale hero, it
        // slides up the moment you scroll down past the hero into the products.
        (function () {
            var bar = document.querySelector('.feed-nav');
            var hero = document.querySelector('.sale-hero');
            if (!bar) return;
            function updateBar() {
                if (!hero) { bar.classList.add('in'); return; }
                var bottom = hero.getBoundingClientRect().bottom;
                bar.classList.toggle('in', bottom <= window.innerHeight * 0.35);
            }
            window.addEventListener('scroll', updateBar, { passive: true });
            window.addEventListener('resize', updateBar);
            updateBar();
        })();
    </script>
