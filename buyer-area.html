<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== DATA SECTION ==================== */
        .data-section {
            background: white;
            padding: 40px 0 70px;
            min-height: 600px;
        }

        /* ==================== SLIDER (mirrors the feed promo slider) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 20px 0 0 0;
            padding: 20px 0 0 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            padding: 20px 40px 40px 40px;
        }

        /* The "image" area now holds a chart, no background box */
        .promo-image {
            width: 100%;
            height: 600px;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            overflow: hidden;
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 44px;
            font-weight: 800;
            text-transform: none;
            line-height: 1.15;
            letter-spacing: 0.3px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 21px;
            line-height: 1.6;
            color: #444;
            max-width: 560px;
            margin: 0;
        }

        .promo-stat {
            font-size: 17px;
            font-weight: 700;
            color: #004225;
            background: #e8f0eb;
            padding: 10px 20px;
            border-radius: 24px;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #004225;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #004225;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        /* ==================== CHARTS ==================== */
        /* Monthly spending: vertical bars */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 12px;
        }

        .bar-value {
            font-size: 16px;
            font-weight: 700;
            color: #004225;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            max-width: 72px;
            background: linear-gradient(180deg, #0a6b3f 0%, #004225 100%);
            border-radius: 8px 8px 0 0;
            min-height: 4px;
        }

        .bar-label {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        /* ==================== COLLECTIONS ==================== */
        .collections {
            display: flex;
            gap: 48px;
            margin-top: 70px;
            align-items: flex-start;
        }

        .collection {
            flex: 1;
            min-width: 0;
        }

        .collection-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
            padding-bottom: 16px;
            border-bottom: 2px solid #004225;
        }

        .col-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #004225;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .col-title {
            font-size: 24px;
            font-weight: 700;
            color: #004225;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .mini-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            font-size: 15px;
            padding: 40px 0;
        }

        /* Product cards (match the storefront feed) */
        .product-card {
            background: white;
            border: none;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            text-decoration: none;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: #F0F0F0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 5;
        }

        .product-seller {
            font-size: 14px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 7px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-name-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 5px;
            gap: 10px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .product-price {
            font-size: 17px;
            color: #000;
            font-weight: 700;
            text-align: left;
            flex-shrink: 0;
        }

        .product-rating {
            font-size: 14px;
            color: #666;
            font-weight: 400;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .collections {
                flex-direction: column;
                gap: 40px;
            }

            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .promo-title { font-size: 30px; }
            .promo-desc { font-size: 17px; }
            .promo-image { height: 480px; }
        }

        @media (max-width: 768px) {
            .header-left { display: none; }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">הנתונים שלי</h1>
            <p class="hero-subtitle">מבט על הרגלי הקנייה, הסגנונות והחברות האהובים עליך</p>
        </div>
    </div>

    <!-- ==================== DATA SLIDER ==================== -->
    <div class="data-section">
        <div class="container">
            <div class="promo-slider" id="dataSlider">
                <button class="promo-arrow prev" aria-label="הקודם" onclick="sliderGo(sliderIndex - 1)"></button>
                <div class="promo-viewport">
                    <div class="promo-track" id="sliderTrack"></div>
                </div>
                <button class="promo-arrow next" aria-label="הבא" onclick="sliderGo(sliderIndex + 1)"></button>
                <div class="promo-footer">
                    <div class="promo-dots" id="sliderDots"></div>
                </div>
            </div>

            <!-- ==================== COLLECTIONS (cart right, wishlist left) ==================== -->
            <div class="collections">
                <div class="collection">
                    <div class="collection-header">
                        <span class="col-icon">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                                <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                            </svg>
                        </span>
                        <span class="col-title">העגלה שלי</span>
                    </div>
                    <div class="mini-grid" id="cartGrid"></div>
                </div>

                <div class="collection">
                    <div class="collection-header">
                        <span class="col-icon">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </span>
                        <span class="col-title">רשימת המשאלות</span>
                    </div>
                    <div class="mini-grid" id="wishGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ==================== DATA ====================
        // Monthly spending in ₪ (index 0 = January); rendered up to the current month.
        const monthlySpending = [320, 180, 540, 260, 610, 430, 290, 380, 450, 500, 340, 410];
        const monthNames = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

        const favoriteStyles = [
            { name: 'קז\'ואל', pct: 85 },
            { name: 'וינטג\'', pct: 62 },
            { name: 'ספורט', pct: 48 },
            { name: 'פורמלי', pct: 35 },
        ];
        const favoriteBrands = [
            { name: 'Basics Co', pct: 90 },
            { name: 'Denim House', pct: 70 },
            { name: 'Street Style', pct: 55 },
            { name: 'Smart Style', pct: 40 },
        ];

        // ==================== CHART BUILDERS ====================
        // Generic vertical bar chart; bars is [{ value, display, label }], heights scaled to the max.
        function barChartHTML(bars) {
            const max = Math.max(...bars.map(b => b.value));
            return `<div class="bar-chart">` + bars.map(b => {
                const height = max > 0 ? (b.value / max) * 100 : 0;
                return `
                    <div class="bar-col">
                        <div class="bar-value">${b.display}</div>
                        <div class="bar" style="height: ${height}%"></div>
                        <div class="bar-label">${b.label}</div>
                    </div>`;
            }).join('') + `</div>`;
        }

        function spendChartHTML() {
            const currentMonth = new Date().getMonth(); // up to "today"
            const data = monthlySpending.slice(0, currentMonth + 1);
            return barChartHTML(data.map((value, i) => ({
                value,
                display: `₪${value.toLocaleString()}`,
                label: monthNames[i]
            })));
        }

        function pctChartHTML(items) {
            return barChartHTML(items.map(item => ({
                value: item.pct,
                display: `${item.pct}%`,
                label: item.name
            })));
        }

        function spendTotal() {
            const currentMonth = new Date().getMonth();
            return monthlySpending.slice(0, currentMonth + 1).reduce((s, v) => s + v, 0);
        }

        // ==================== SLIDES ====================
        // Each slide: an explanation (text area) + a chart (image area).
        const slides = [
            {
                title: 'הצריכה החודשית שלי',
                desc: 'כמה הוצאת בכל חודש, מתחילת השנה ועד היום. עקוב אחרי מגמת ההוצאות שלך לאורך החודשים.',
                stat: () => `סה"כ מתחילת השנה · ₪${spendTotal().toLocaleString()}`,
                chart: spendChartHTML,
            },
            {
                title: 'הסגנונות המועדפים עליי',
                desc: 'פילוח הרכישות שלך לפי סגנון לבוש — הסגנונות שאתה הכי אוהב לקנות.',
                stat: () => `הסגנון המוביל · ${favoriteStyles[0].name}`,
                chart: () => pctChartHTML(favoriteStyles),
            },
            {
                title: 'החברות האהובות עליי',
                desc: 'המותגים שמהם קנית הכי הרבה. אלה החברות שחוזרות אצלך שוב ושוב.',
                stat: () => `המותג המוביל · ${favoriteBrands[0].name}`,
                chart: () => pctChartHTML(favoriteBrands),
            },
        ];

        // ==================== SLIDER ENGINE (mirrors the feed promo slider) ====================
        const SLIDER_INTERVAL = 6000;
        const chevron = dir => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="${dir === 'left' ? '15 6 9 12 15 18' : '9 6 15 12 9 18'}"></polyline></svg>`;
        const ringSVG = `<svg class="promo-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"></circle></svg>`;
        let sliderIndex = 0;
        let sliderTimer = null;

        function buildSlider() {
            document.querySelector('.promo-arrow.prev').innerHTML = chevron('left');
            document.querySelector('.promo-arrow.next').innerHTML = chevron('right');

            document.getElementById('sliderTrack').innerHTML = slides.map(s => `
                <div class="promo-slide">
                    <div class="promo-image">${s.chart()}</div>
                    <div class="promo-text">
                        <h2 class="promo-title">${s.title}</h2>
                        <p class="promo-desc">${s.desc}</p>
                        <span class="promo-stat">${s.stat()}</span>
                    </div>
                </div>`).join('');

            document.getElementById('sliderDots').innerHTML = slides.map((s, i) =>
                `<button class="promo-dot" aria-label="שקופית ${i + 1}" onclick="sliderGo(${i})"></button>`).join('');
        }

        function sliderGo(i) {
            const n = slides.length;
            sliderIndex = (i + n) % n;
            document.getElementById('sliderTrack').style.transform = `translateX(-${sliderIndex * 100}%)`;
            document.querySelectorAll('#sliderDots .promo-dot').forEach((dot, idx) => {
                const active = idx === sliderIndex;
                dot.classList.toggle('active', active);
                dot.innerHTML = active ? ringSVG : '';
            });
            clearInterval(sliderTimer);
            sliderTimer = setInterval(() => sliderGo(sliderIndex + 1), SLIDER_INTERVAL);
        }

        // ==================== COLLECTIONS (cart & wishlist) ====================
        // Fallback samples so the grids always show six products.
        const sampleCart = [
            { name: 'טי-שירט לבן קלאסי', price: '₪49.90', icon: '👕', category: 'קז\'ואל', seller: 'Basics Co', rating: 4.7 },
            { name: 'ג\'ינס סקיני כחול', price: '₪189.00', icon: '👖', category: 'ג\'ינס', seller: 'Denim House', rating: 4.6 },
            { name: 'סניקרס לבן קלאסי', price: '₪150.00', icon: '👟', category: 'סניקרס', seller: 'Basics Co', rating: 4.8 },
            { name: 'הודי אפור', price: '₪139.00', icon: '🧥', category: 'הודיס', seller: 'Street Style', rating: 4.6 },
            { name: 'חולצה מכופתרת תכלת', price: '₪149.00', icon: '👔', category: 'פורמלי', seller: 'Smart Style', rating: 4.6 },
            { name: 'כובע בייסבול', price: '₪89.90', icon: '🧢', category: 'כובעים', seller: 'Accessories Co', rating: 4.5 },
        ];
        const sampleWishlist = [
            { name: 'בלייזר נייבי', price: '₪320.00', icon: '👔', category: 'פורמלי', seller: 'Smart Style', rating: 4.8 },
            { name: 'ג\'קט עור', price: '₪450.00', icon: '🧥', category: 'ג\'קטים', seller: 'Leather Lab', rating: 4.8 },
            { name: 'מגפיים חום', price: '₪290.00', icon: '🥾', category: 'מגפיים', seller: 'Boots Co', rating: 4.8 },
            { name: 'סוודר צמר וינטג\'', price: '₪165.00', icon: '🧶', category: 'וינטג\'', seller: 'Vintage 90s', rating: 4.8 },
            { name: 'תיק צד עור', price: '₪290.00', icon: '👜', category: 'תיקים', seller: 'Leather Lab', rating: 4.8 },
            { name: 'שרשרת זהב', price: '₪120.00', icon: '⛓️', category: 'תכשיטים', seller: 'Jewelry Co', rating: 4.8 },
        ];

        function productPageUrl(item) {
            const data = {
                name: item.name, price: item.price, icon: item.icon,
                category: item.category, seller: item.seller, rating: item.rating,
                type: item.type || 'clothing'
            };
            return `product.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        function miniCardHTML(item) {
            const rating = item.rating || 4.5;
            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
            return `
                <a href="${productPageUrl(item)}" class="product-card">
                    <div class="product-image">${item.icon}</div>
                    <div class="product-info">
                        <div class="product-seller">${item.seller || 'Vero Store'}</div>
                        <div class="product-name-price">
                            <div class="product-name">${item.name}</div>
                            <div class="product-price">${item.price}</div>
                        </div>
                        <div class="product-rating">${stars} ${rating}</div>
                    </div>
                </a>`;
        }

        // The six most recent items from a store, padded with samples up to six.
        function recentItems(storageKey, fallback) {
            let items = [];
            try { items = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (e) { items = []; }
            items.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
            const seen = new Set(items.map(i => i.name + '|' + i.price));
            for (const f of fallback) {
                if (items.length >= 6) break;
                const key = f.name + '|' + f.price;
                if (!seen.has(key)) { items.push(f); seen.add(key); }
            }
            return items.slice(0, 6);
        }

        function renderCollections() {
            document.getElementById('cartGrid').innerHTML =
                recentItems('vero_cart', sampleCart).map(miniCardHTML).join('');
            document.getElementById('wishGrid').innerHTML =
                recentItems('vero_wishlist', sampleWishlist).map(miniCardHTML).join('');
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize
        buildSlider();
        sliderGo(0);
        renderCollections();
    </script>
</body>
