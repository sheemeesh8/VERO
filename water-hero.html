<style>
    /* ---- Reset / page ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0a1417;
        color: #fff;
        -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       WATER HERO — component styles (copy this block + water-hero.js)
       ============================================================ */
    .wh-hero {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 560px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;            /* keep the canvas behind the content */
    }
    .wh-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
    }
    /* Fallback if WebGL is unavailable: a calm static teal gradient. */
    .wh-hero.wh-nogl {
        background:
            radial-gradient(120% 80% at 50% 40%, #1a4a52 0%, #0d2a30 55%, #071a1f 100%);
    }

    .wh-content {
        position: relative;
        z-index: 1;
        max-width: 720px;
        padding: 0 24px;
        text-align: center;
        /* the text "floats" above the water */
        animation: whRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes whRise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .wh-eyebrow {
        font-size: 10.83px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.72);
        margin-bottom: 22px;
    }
    .wh-title {
        font-size: clamp(40px, 7vw, 84px);
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.45);
    }
    .wh-sub {
        margin: 22px auto 0;
        max-width: 500px;
        font-size: clamp(15px, 2.2vw, 19px);
        line-height: 1.6;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    /* Glassmorphism CTA */
    .wh-cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 38px;
        padding: 15px 30px;
        font-size: 12.50px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #fff;
        text-decoration: none;
        cursor: pointer;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.10);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        backdrop-filter: blur(10px) saturate(140%);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                    background 0.35s ease, border-color 0.35s ease;
    }
    .wh-cta:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.45);
    }
    .wh-cta svg { width: 17px; height: 17px; transition: transform 0.35s ease; }
    .wh-cta:hover svg { transform: translateX(4px); }

    @media (prefers-reduced-motion: reduce) {
        .wh-content { animation: none; }
    }
</style>
