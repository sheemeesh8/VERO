<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Screen Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 36px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 284px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

/* Tall phones show more of the scroll: a 390 × 1040 screen at 0.7. */
.phone { width: 284px; height: 740px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 1040px; transform: scale(0.7); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); }
.th { display: block; background: #e7e4dd center / cover no-repeat; }
.gs { filter: grayscale(0.25); }
.cap { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
.money { font-variant-numeric: tabular-nums; }

/* Header (matches the live one: menu, toggle, search, account) */
.hdr { position: absolute; top: 0; left: 0; right: 0; height: 74px; padding: 34px 22px 0; display: flex; align-items: center; gap: 16px; z-index: 5; }
.hdr.light { color: #fff; } .hdr.solid { background: #fff; position: relative; }
.hdr svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.3; fill: none; }
.hdr .tog { width: 34px; height: 18px; border: 1.3px solid currentColor; border-radius: 18px; position: relative; }
.hdr .tog::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.hdr .sp { flex: 1; }
.hdr .wm { height: 22px; }
.hdr.light .wm { filter: none; } .hdr .wm.dk { filter: invert(1); }
/* Bottom nav pill */
.nav { position: absolute; left: 16px; right: 16px; bottom: 18px; height: 60px; border-radius: 30px; background: #141a24; display: flex; align-items: center; justify-content: space-around; z-index: 6; }
.nav i { width: 20px; height: 20px; border: 1.5px solid rgba(255,255,255,0.7); border-radius: 5px; display: block; }
.nav i.on { border-color: #ff5d5d; background: rgba(255,93,93,0.1); box-shadow: 0 0 0 9px #fff; }
.nav i.plus { border: none; position: relative; } .nav i.plus::before, .nav i.plus::after { content: ''; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,0.7); }
.nav i.plus::before { width: 16px; height: 1.5px; margin: -0.75px 0 0 -8px; } .nav i.plus::after { width: 1.5px; height: 16px; margin: -8px 0 0 -0.75px; }
.btn { display: inline-block; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 13px 22px; border: 1px solid currentColor; }
.btn.fill { background: #fff; color: #111; border-color: #fff; }
.btn.dark { background: #111; color: #fff; border-color: #111; }
.sec { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px; margin: 26px 0 12px; }
.sec b { font-weight: 400; font-size: 20px; } .sec span { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* product cards */
.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
.pc .th { aspect-ratio: 3/4; }
.pc .l { display: flex; justify-content: space-between; font-size: 12px; margin-top: 7px; }
.pc .s { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.hs { display: flex; gap: 12px; overflow: hidden; padding: 0 20px; }
.hs .pc { width: 130px; flex: none; }

/* H1 current */
.h1 .hero { height: 760px; position: relative; color: #fff; }
.h1 .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.6)); }
.h1 .hero .th { position: absolute; inset: 0; }
.h1 .hero .in { position: absolute; left: 24px; right: 24px; bottom: 60px; z-index: 1; }
.h1 .hero h2 { font-weight: 400; font-size: 46px; line-height: 1.05; margin: 10px 0 12px; }
.h1 .hero p { font-size: 13px; opacity: 0.85; line-height: 1.5; margin-bottom: 22px; max-width: 85%; }
.h1 .sale { height: 280px; position: relative; color: #fff; overflow: hidden; }
.h1 .sale .th { position: absolute; inset: 0; filter: brightness(0.7); }
.h1 .sale b { position: absolute; left: 24px; top: 70px; font-size: 90px; letter-spacing: 4px; font-weight: 700; }

/* H2 editorial */
.h2 .mast { text-align: center; padding: 6px 20px 14px; border-bottom: 1px solid #111; margin: 0 20px; }
.h2 .mast .date { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.h2 .mast h2 { font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1; margin-top: 6px; font-style: italic; }
.h2 .story { margin: 18px 20px 0; position: relative; }
.h2 .story .th { height: 420px; }
.h2 .story .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-top: 12px; }
.h2 .story h3 { font-family: Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.15; margin-top: 6px; }
.h2 .story p { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.h2 .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 20px; }
.h2 .two .th { height: 150px; } .h2 .two h4 { font-family: Georgia, serif; font-weight: 400; font-size: 15px; margin-top: 8px; line-height: 1.25; }

/* H3 feed-first */
.h3 .search { margin: 4px 20px 0; height: 44px; border-radius: 22px; background: #f2f0ec; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 13px; color: #9a958c; }
.h3 .search svg { width: 16px; height: 16px; stroke: #111; stroke-width: 1.5; fill: none; }
.h3 .chips { display: flex; gap: 8px; padding: 14px 20px 0; overflow: hidden; white-space: nowrap; }
.h3 .chip { border: 1px solid #d6d2cb; border-radius: 999px; padding: 8px 14px; font-size: 11px; flex: none; }
.h3 .chip.on { background: #111; color: #fff; border-color: #111; }
.h3 .stories { display: flex; gap: 14px; padding: 18px 20px 4px; overflow: hidden; }
.h3 .st { width: 62px; flex: none; text-align: center; font-size: 9px; }
.h3 .st .ring { width: 62px; height: 62px; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); margin-bottom: 5px; }
.h3 .st .ring .th { width: 100%; height: 100%; border-radius: 50%; }
.h3 .heart { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.9); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.h3 .pc { position: relative; }

/* H4 doors */
.h4 .doors { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; }
.h4 .door { position: relative; color: #fff; overflow: hidden; }
.h4 .door .th { position: absolute; inset: 0; filter: grayscale(0.2) brightness(0.62); }
.h4 .door .in { position: absolute; left: 24px; bottom: 26px; }
.h4 .door b { display: block; font-weight: 400; font-size: 52px; letter-spacing: 1px; line-height: 1; }
.h4 .door span { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; }
.h4 .door .arr { position: absolute; right: 24px; bottom: 34px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.h4 .ribbon { position: absolute; left: 0; right: 0; top: 50%; height: 34px; margin-top: -17px; background: #ff3b1f; color: #fff; z-index: 3; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }

/* H5 bento */
.h5 .hello { padding: 0 20px; } .h5 .hello small { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.h5 .hello h2 { font-weight: 400; font-size: 32px; line-height: 1.1; margin-top: 4px; }
.h5 .bento { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 118px; gap: 10px; padding: 18px 20px 0; }
.h5 .b { border-radius: 18px; overflow: hidden; position: relative; padding: 14px; color: #fff; }
.h5 .b .th { position: absolute; inset: 0; filter: brightness(0.6) grayscale(0.2); }
.h5 .b .t { position: relative; font-size: 18px; } .h5 .b .k { position: relative; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; display: block; margin-top: 3px; }
.h5 .b.tall { grid-row: span 2; } .h5 .b.wide { grid-column: span 2; }
.h5 .b.red { background: #ff3b1f; } .h5 .b.cream { background: #f2eee6; color: #111; } .h5 .b.ink { background: #141a24; }
.h5 .b .big { position: absolute; right: 14px; bottom: 8px; font-size: 44px; font-weight: 700; }
.h5 .avs { position: absolute; left: 14px; bottom: 14px; display: flex; } .h5 .avs .th { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #141a24; margin-right: -8px; filter: none; }

/* H6 swipe feed */
.h6 .full { position: absolute; inset: 0; }
.h6 .full .th { position: absolute; inset: 0; }
.h6 .full::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75)); }
.h6 .tabs { position: absolute; top: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 24px; color: rgba(255,255,255,0.65); font-size: 13px; z-index: 4; }
.h6 .tabs b { color: #fff; font-weight: 400; border-bottom: 2px solid #fff; padding-bottom: 4px; }
.h6 .rail { position: absolute; right: 16px; bottom: 210px; display: flex; flex-direction: column; gap: 22px; z-index: 4; color: #fff; text-align: center; font-size: 10px; }
.h6 .rail i { display: block; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.18); backdrop-filter: blur(6px); margin-bottom: 4px; font-style: normal; font-size: 18px; line-height: 46px; }
.h6 .info { position: absolute; left: 20px; right: 90px; bottom: 110px; z-index: 4; color: #fff; }
.h6 .seller { display: flex; align-items: center; gap: 8px; font-size: 12px; } .h6 .seller .th { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #fff; }
.h6 .info h3 { font-weight: 400; font-size: 26px; margin: 10px 0 4px; } .h6 .info .p { font-size: 18px; }
.h6 .info .tags { font-size: 11px; opacity: 0.8; margin-top: 4px; }
.h6 .buy { display: inline-block; margin-top: 12px; background: #fff; color: #111; padding: 10px 20px; border-radius: 999px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
.h6 .peek { position: absolute; left: 0; right: 0; bottom: -40px; height: 60px; z-index: 3; }

/* H7 personal */
.h7 .greet { padding: 4px 20px 0; } .h7 .greet h2 { font-weight: 400; font-size: 30px; line-height: 1.1; } .h7 .greet p { font-size: 12px; color: var(--muted); margin-top: 6px; }
.h7 .pick { margin: 18px 20px 0; border-radius: 18px; overflow: hidden; position: relative; height: 300px; color: #fff; }
.h7 .pick .th { position: absolute; inset: 0; filter: brightness(0.7); }
.h7 .pick .in { position: absolute; left: 18px; right: 18px; bottom: 18px; }
.h7 .pick .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; } .h7 .pick h3 { font-weight: 400; font-size: 24px; margin: 6px 0 2px; }
.h7 .pick .why { position: absolute; left: 18px; top: 16px; background: rgba(255,255,255,0.92); color: #111; border-radius: 999px; padding: 6px 12px; font-size: 10px; }
.h7 .upd { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.h7 .upd .av { width: 42px; height: 42px; border-radius: 50%; flex: none; } .h7 .upd .tx { flex: 1; font-size: 13px; line-height: 1.35; } .h7 .upd .tx small { color: var(--muted); font-size: 11px; display: block; }
.h7 .upd .mini { width: 46px; height: 58px; flex: none; }

/* H8 shop the look */
.h8 .look { position: absolute; inset: 0; bottom: 330px; }
.h8 .look .th { position: absolute; inset: 0; }
.h8 .look::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0) 30%); }
.h8 .dot { position: absolute; z-index: 3; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 0 0 6px rgba(255,255,255,0.3); }
.h8 .pop { position: absolute; z-index: 3; background: #fff; padding: 8px 12px; font-size: 11px; box-shadow: 0 8px 18px rgba(0,0,0,0.2); white-space: nowrap; }
.h8 .pop b { display: block; font-weight: 400; font-size: 13px; }
.h8 .lk { position: absolute; left: 20px; bottom: 350px; z-index: 3; color: #fff; }
.h8 .lk .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; } .h8 .lk h3 { font-weight: 400; font-size: 30px; }
.h8 .below { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: #fff; padding-top: 4px; }
.h8 .looksdots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; } .h8 .looksdots i { width: 6px; height: 6px; border-radius: 50%; background: #d6d2cb; } .h8 .looksdots i.on { width: 18px; border-radius: 6px; background: #111; }
</style>
</head>
<body>
<h1>Home — אופציות למסך הבית</h1>
<p class="sub">8 כיוונים שונים למבנה מסך הבית · הטלפונים ארוכים כדי להראות גם מה יש בגלילה</p>

<div class="grid" id="opts"></div>

<script>
var IM = {
  men: { img: '../men-hero.jpg', pos: '50% 30%' }, women: { img: '../women-hero.jpg', pos: '30% 40%' },
  cloth: { img: '../clothing-hero.jpg', pos: '50% 50%' }, beach: { img: '../hero-beach.jpg', pos: '50% 50%' },
  gal: { img: '../gallery-hero.jpg', pos: '50% 50%' }, mag: { img: '../magazine-hero.jpg', pos: '50% 50%' },
  art: { img: '../art-hero.jpg', pos: '50% 50%' }, sale: { img: '../sale-hero.jpg', pos: '50% 50%' }
};
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var P = [
  { n: 'Wool Overcoat', s: 'Atelier Nord', p: 380, i: IM.men }, { n: 'Linen Shirt', s: 'Studio Vero', p: 120, i: IM.women },
  { n: 'Leather Bag', s: 'Milano Feet', p: 240, i: IM.cloth }, { n: 'Silk Scarf', s: 'Denim Lab', p: 90, i: IM.beach },
  { n: 'Denim Jacket', s: 'Denim Lab', p: 210, i: IM.gal }, { n: 'Knit Vest', s: 'Sole Society', p: 140, i: IM.mag }
];
var m = v => '₪' + v;
var card = c => '<div class="pc"><span class="th gs" ' + bg(c.i) + '></span><div class="l"><span>' + c.n + '</span><span class="money">' + m(c.p) + '</span></div><div class="s">' + c.s + '</div></div>';
var SV = {
  menu: '<svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  bag: '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>'
};
var hdr = (cls, mid) => '<div class="hdr ' + cls + '">' + SV.menu + (mid || '<span class="tog"></span>') + '<span class="sp"></span>' + SV.search + SV.user + '</div>';
var WM = (dark) => '<img class="wm' + (dark ? ' dk' : '') + '" src="../moravchick-letters.png" alt="">';
var NAV = '<div class="nav"><i class="on"></i><i></i><i class="plus"></i><i></i><i></i></div>';

var OPTS = [
  ['H1 · הקיים', 'Hero בגובה מסך מלא עם "Autumn Collection", אחריו באנר SALE, סליידר קטגוריות וגריד מוצרים. לנקודת השוואה.',
   '<div class="screen h1">' + hdr('light') +
   '<div class="hero"><span class="th" ' + bg(IM.cloth) + '></span><div class="in"><span class="cap" style="color:#fff">In season</span><h2>Autumn<br>Collection</h2><p>Warm textures and golden tones — coats, knitwear and boots.</p><span class="btn fill">Upload a product</span> <span class="btn" style="margin-left:8px">Magazine</span></div></div>' +
   '<div class="sale"><span class="th" ' + bg(IM.sale) + '></span><b>SALE</b></div>' + NAV + '</div>'],

  ['H2 · מגזין', 'נפתח כמו שער של מגזין: תאריך, כותרת גדולה, כתבה ראשית אחת עם תמונה גדולה, ואז "New in" נגלל לצד ושתי כתבות קטנות. הכי עריכתי.',
   '<div class="screen h2">' + hdr('solid', WM(true)) +
   '<div class="mast"><div class="date">Monday · 5 October · Issue 42</div><h2>The Edit</h2></div>' +

   '<div class="sec"><b>New in</b><span>See all</span></div><div class="hs">' + P.slice(0, 4).map(card).join('') + '</div>' + NAV + '</div>'],

  ['H3 · פיד קודם כל', 'בלי Hero: שורת חיפוש, צ׳יפים של קטגוריות, עיגולי סטורי של מוכרים, ומיד גריד מוצרים עם לב. כמו Depop/Vinted — הכי מהיר לקנות.',
   '<div class="screen h3">' + hdr('solid', WM(true)) +
   '<div class="search">' + SV.search + 'Search coats, brands, sellers</div>' +
   '<div class="chips"><span class="chip on">For you</span><span class="chip">Women</span><span class="chip">Men</span><span class="chip">Sale</span><span class="chip">Vintage</span><span class="chip">Art</span></div>' +
   '<div class="stories">' + [IM.men, IM.women, IM.beach, IM.gal, IM.mag].map((i, k) => '<div class="st"><div class="ring"><span class="th" ' + bg(i) + '></span></div>' + ['Atelier', 'Studio V', 'Denim Lab', 'Sole', 'Milano'][k] + '</div>').join('') + '</div>' +
   '<div class="sec" style="margin-top:14px"><b>Fresh today</b><span>124 new</span></div><div class="pg">' + P.slice(0, 4).map(c => card(c).replace('<div class="pc">', '<div class="pc"><span class="heart">♡</span>')).join('') + '</div>' + NAV + '</div>'],

  ['H4 · שתי דלתות', 'המסך מחולק לשניים — Women ו-Men — כל חצי תמונה מלאה עם חץ כניסה. פס SALE רץ באמצע. בחירה אחת ונכנסים לעולם שלך.',
   '<div class="screen h4"><div class="doors">' +
   '<div class="door"><span class="th" ' + bg(IM.women) + '></span><div class="in"><span>1,240 pieces</span><b>Women</b></div><span class="arr">→</span></div>' +
   '<div class="door"><span class="th" ' + bg(IM.men) + '></span><div class="in"><span>860 pieces</span><b>Men</b></div><span class="arr">→</span></div></div>' +
   '<div class="ribbon">&nbsp;Sale up to 70% · End of season · Sale up to 70% · End of season · Sale up to 70%</div>' + hdr('light') + NAV + '</div>'],

  ['H5 · בנטו', 'ברכה קצרה ואז רשת אריחים בגדלים שונים: Sale גדול באדום, New in, נשים/גברים, מגזין, אירועים, ומוכרים שאתה עוקב אחריהם. הכל במבט אחד.',
   '<div class="screen h5">' + hdr('solid', WM(true)) +
   '<div class="hello"><small>Good evening</small><h2>What are we<br>finding today?</h2></div>' +
   '<div class="bento">' +
   '<div class="b red tall"><span class="t">Sale</span><span class="k">End of season</span><span class="big">70%</span></div>' +
   '<div class="b"><span class="th" ' + bg(IM.women) + '></span><span class="t">Women</span></div>' +
