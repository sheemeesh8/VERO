<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick - Demo Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F2F0EF;
            color: #1c1c1c;
            -webkit-font-smoothing: antialiased;
        }
        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10.00px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #F2F0EF; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .showcase {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.3fr);
            align-items: center;
            gap: 56px;
            max-width: 1500px;
            margin: 0 auto;
            padding: 48px 56px;
        }

        /* ==================== LEFT: the data ==================== */
        .info { max-width: 540px; }
        .info-price { font-size: 20.83px; font-weight: 400; letter-spacing: 0.5px; margin-bottom: 22px; }
        .info-title { font-size: clamp(52px, 6vw, 88px); font-weight: 200; line-height: 1; letter-spacing: 1px; margin-bottom: 12px; }
        .info-subtitle { font-size: 15.00px; font-weight: 400; letter-spacing: 2.5px; text-transform: uppercase; color: #8a857c; margin-bottom: 26px; }

        .info-seller {
            display: flex; align-items: center; gap: 12px;
            padding-bottom: 22px; margin-bottom: 24px; border-bottom: 1px solid #e0ddd6;
            font-size: 11.67px; color: #3a352e;
        }
        .info-seller .s-name { color: #1c1c1c; font-weight: 500; letter-spacing: 0.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
        .info-seller .s-name:hover { color: #000; }
        .info-seller .s-rating { color: #1c1c1c; letter-spacing: 2px; font-size: 12.50px; }
        .info-seller .s-rating .num { color: #8a857c; letter-spacing: 0; font-size: 10.00px; margin-inline-start: 4px; }

        .info-desc { font-size: 15.42px; font-weight: 300; line-height: 1.85; color: #3a352e; margin-bottom: 32px; }

        .info-specs {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
            padding: 22px 0; margin-bottom: 30px;
            border-top: 1px solid #e0ddd6; border-bottom: 1px solid #e0ddd6;
        }
        .spec-label { display: block; font-size: 10.42px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #9a958c; margin-bottom: 10px; }
        .spec-value { font-size: 18.33px; font-weight: 400; color: #1c1c1c; }

        .btn-buy {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; height: 62px; background: #000; color: #fff;
            border: 1.4px solid #000; border-radius: 0;
            font-family: inherit; font-size: 11.67px; font-weight: 500; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; margin-bottom: 14px; transition: opacity 0.2s;
        }
        .btn-buy:hover { opacity: 0.78; }

        .btn-save {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; height: 62px; background: transparent; color: #1c1c1c;
            border: 1.4px solid #000; border-radius: 0;
            font-family: inherit; font-size: 11.67px; font-weight: 500; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .btn-save:hover { background: #000; color: #fff; }
        .btn-save svg { width: 15px; height: 17px; stroke: currentColor; stroke-width: 1.6; fill: none; }
        .btn-save.active { background: #000; color: #fff; }
        .btn-save.active svg { fill: #fff; }

        /* ==================== RIGHT: the 3 images ==================== */
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .gallery-main {
            width: 100%; aspect-ratio: 4 / 4.7;
            /* No frame — the cut-out floats straight on the page background. */
            background: transparent;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .gallery-main img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .gallery-thumbs { display: flex; gap: 16px; width: 100%; }
        .gallery-thumb {
            width: 118px; height: 118px; background: transparent; border: none;
            padding: 0; cursor: pointer; overflow: hidden; opacity: 0.7;
            transition: opacity 0.2s;
        }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-thumb:hover { opacity: 1; }
        .gallery-thumb.active { opacity: 1; border-color: #000; }

        @media (max-width: 900px) {
            .showcase { grid-template-columns: 1fr; gap: 44px; padding: 40px 22px; }
            .gallery { order: -1; }
            .info { max-width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
    <script src="assets/footer.js"></script>
</head>
<body>
    <a class="back" href="index.html">&#8592; חזרה</a>
    <div class="showcase">
        <!-- LEFT column: the data -->
        <div class="info">
            <div class="info-price">₪220.00</div>
            <h1 class="info-title">Studio Noir</h1>
            <div class="info-subtitle">חולצת אוקספורד</div>

            <div class="info-seller">
                <span>מוכר:</span>
                <a class="s-name" href="index.html?seller=Studio%20Noir">Studio Noir</a>
                <span class="s-rating">★★★★☆ <span class="num">4.7</span></span>
            </div>

            <p class="info-desc">חולצת אוקספורד קלאסית בגזרה נקייה, תפורה מכותנה 100% נושמת. פריט בסיס שמתאים ליומיום ולערב, במצב מעולה.</p>

            <div class="info-specs">
                <div><span class="spec-label">בד</span><span class="spec-value">כותנה 100%</span></div>
                <div><span class="spec-label">צבע</span><span class="spec-value">לבן</span></div>
                <div><span class="spec-label">מידה</span><span class="spec-value">M</span></div>
            </div>

            <button class="btn-buy" onclick="addToCart()">
                <span>הוסף לעגלת קניות</span>
                <span>— ₪220.00</span>
            </button>
            <button class="btn-save" onclick="toggleWishlist()" id="saveBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
                <span id="saveLabel">שמור לאחר כך</span>
            </button>
        </div>

        <!-- RIGHT column: 3 real product images (main auto cut-out) -->
        <div class="gallery">
            <div class="gallery-main"><img id="mainImg" alt="Studio Noir חולצת אוקספורד"></div>
            <div class="gallery-thumbs" id="thumbs"></div>
        </div>
    </div>

    <script>
        // Real product — a white Oxford shirt, shot on plain backdrops (Unsplash).
        const product = { name: 'חולצת אוקספורד לבנה', price: 220, seller: 'Studio Noir' };
        const images = [
            'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=900&q=80',
            'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=900&q=80',
            'https://images.unsplash.com/photo-1620012253295-c15cc3e65df4?auto=format&fit=crop&w=900&q=80'
        ];

        // ---- Same client-side background remover the upload page uses ----
        function loadImage(src, cors) {
            return new Promise((resolve, reject) => {
                const im = new Image();
                if (cors) im.crossOrigin = 'anonymous';
                im.onload = () => resolve(im);
                im.onerror = reject;
                im.src = src;
            });
        }
        async function removeBackground(src, tolerance = 46) {
            const img = await loadImage(src, true);
            const MAX = 1200;
            const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const image = ctx.getImageData(0, 0, w, h); // throws if the image is CORS-tainted
            const px = image.data;
            const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];
            let br = 0, bg = 0, bb = 0;
            corners.forEach(([x, y]) => { const i = (y * w + x) * 4; br += px[i]; bg += px[i + 1]; bb += px[i + 2]; });
            br /= 4; bg /= 4; bb /= 4;
            const tol2 = tolerance * tolerance * 3;
            const visited = new Uint8Array(w * h), stack = [];
            const consider = (x, y) => {
                if (x < 0 || y < 0 || x >= w || y >= h) return;
                const idx = y * w + x; if (visited[idx]) return;
                const i = idx * 4, dr = px[i] - br, dg = px[i + 1] - bg, db = px[i + 2] - bb;
                if (dr * dr + dg * dg + db * db <= tol2) { visited[idx] = 1; px[i + 3] = 0; stack.push(idx); }
                else visited[idx] = 2;
            };
            for (let x = 0; x < w; x++) { consider(x, 0); consider(x, h - 1); }
            for (let y = 0; y < h; y++) { consider(0, y); consider(w - 1, y); }
            while (stack.length) { const idx = stack.pop(), x = idx % w, y = (idx / w) | 0; consider(x + 1, y); consider(x - 1, y); consider(x, y + 1); consider(x, y - 1); }
            ctx.putImageData(image, 0, 0);
            return canvas.toDataURL('image/png');
        }

        // Main image: try to auto-remove the background; fall back to the plain photo.
        const mainImg = document.getElementById('mainImg');
        (async () => {
            try { mainImg.src = await removeBackground(images[0]); }
            catch (e) { mainImg.src = images[0]; }
        })();

        // Thumbnails — click to swap the main image (kept as plain photos).
        const thumbs = document.getElementById('thumbs');
        thumbs.innerHTML = images.map((src, i) =>
            `<button class="gallery-thumb${i === 0 ? ' active' : ''}" onclick="showImg(${i})" aria-label="תמונה ${i + 1}">
                <img src="${src}" alt="" loading="lazy">
             </button>`).join('');
        async function showImg(i) {
            document.querySelectorAll('.gallery-thumb').forEach((t, idx) => t.classList.toggle('active', idx === i));
            try { mainImg.src = await removeBackground(images[i]); }
            catch (e) { mainImg.src = images[i]; }
        }

        // Cart + save-for-later, same stores as the rest of the site.
        function addToCart() {
            const cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
            const id = `${product.name}|${product.price}`, now = Date.now(), HOLD = 48 * 60 * 60 * 1000;
            const ex = cart.find(i => i.id === id);
            if (ex) { ex.qty += 1; ex.addedAt = now; ex.expiresAt = now + HOLD; }
            else cart.push({ id, name: product.name, price: product.price, seller: product.seller, icon: '👕', category: 'Shirts', type: 'clothing', rating: 4.7, qty: 1, addedAt: now, expiresAt: now + HOLD });
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            location.href = 'index.html?open=cart';
        }
        function toggleWishlist() {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            const id = `${product.name}|${product.price}`;
            const btn = document.getElementById('saveBtn'), label = document.getElementById('saveLabel');
            const idx = wl.findIndex(i => i.id === id);
            if (idx >= 0) { wl.splice(idx, 1); btn.classList.remove('active'); label.textContent = 'שמור לאחר כך'; }
            else { wl.push({ id, name: product.name, price: product.price, seller: product.seller, icon: '👕', category: 'Shirts', type: 'clothing', rating: 4.7, addedAt: Date.now() }); btn.classList.add('active'); label.textContent = 'נשמר ✓'; }
            localStorage.setItem('vero_wishlist', JSON.stringify(wl));
        }
        (function () {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            if (wl.some(i => i.id === `${product.name}|${product.price}`)) { document.getElementById('saveBtn').classList.add('active'); document.getElementById('saveLabel').textContent = 'נשמר ✓'; }
        })();
    </script>
    <!-- Manual edit mode (✎ button bottom-left) — same editor as the rest of the site. -->
    <script src="vero-editor.js"></script>
</body>
</html>
