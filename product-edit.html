<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Edit Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow-x: hidden;
        }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10.00px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0; padding: 120px 40px 80px;
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }

        .side-image {
            position: fixed; top: 0; left: 0; bottom: 0; width: 20vw;
            background: #2a2a28 url('assets/products-hero.jpg') center / cover no-repeat;
            filter: grayscale(1); border-right: 1px solid #000; z-index: 5;
        }
        @media (min-width: 1001px) { .wrap { padding-left: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 12.50px; color: #6b6b66; letter-spacing: 0.5px; }

        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 52px; align-items: start; }
        @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
        .card { border: 1px solid #000; padding: 30px; }
        .card-label { font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase; color: #111; margin-bottom: 8px; }

        /* Cover image with a change button. */
        .cover {
            width: 100%; aspect-ratio: 3 / 4; border: 1px solid #000; margin-bottom: 16px;
            background: #ececea center / cover no-repeat; display: grid; place-items: center;
            font-size: 38.33px; color: #b8b8b3;
        }
        .cover.has-img { color: transparent; }
        /* Cut-out preview: the item floats on the product-page background (#F2F0EF). */
        .cover.cutout {
            background-color: #F2F0EF !important;
            background-size: contain !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        /* Auto-remove-background toggle + status line. */
        .bg-toggle {
            display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
            font-size: 10.00px; letter-spacing: 0.5px; color: #1c1c1c; cursor: pointer; user-select: none;
        }
        .bg-toggle input { width: 15px; height: 15px; accent-color: #000; cursor: pointer; }
        .bg-status { min-height: 16px; margin-bottom: 12px; font-size: 9.17px; letter-spacing: 0.5px; color: #9a9a95; }
        .bg-status.working { color: #1c1c1c; }
        .change-photo {
            width: 100%; border: 1.4px solid #000; background: #fff; cursor: pointer;
            font-family: inherit; font-size: 9.17px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 11px 18px; border-radius: 999px; color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .change-photo:hover { background: #000; color: #fff; }

        .field { margin-bottom: 20px; }
        .field:last-child { margin-bottom: 0; }
        .field input, .field textarea, .field select {
            width: 100%; border: none; border-bottom: 1px solid #d9d9d4;
            background: transparent; font-family: inherit; font-size: 13.33px; font-weight: 400;
            color: #1c1c1c; padding: 6px 0; resize: none; transition: border-color 0.2s;
        }
        .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-bottom-color: #000; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 26px; }
        @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

        /* Price + discount → a live "final price" readout. */
        .price-note { margin-top: 10px; font-size: 10.83px; color: #6b6b66; }
        .price-note b { font-weight: 600; color: #1c1c1c; }
        .price-note .old { text-decoration: line-through; color: #9a9a95; margin-left: 8px; }

        /* Status segmented control. */
        .seg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .seg button {
            padding: 9px 18px; border: 1.4px solid #000; border-radius: 999px; background: #fff; color: #1c1c1c;
            font-family: inherit; font-size: 10.00px; letter-spacing: 0.5px; cursor: pointer; transition: 0.2s;
        }
        .seg button.on { background: #000; color: #fff; }

        .row-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
        .btn {
            padding: 12px 26px; border: 1.4px solid #000; border-radius: 999px; font-family: inherit;
            font-size: 10.00px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        .btn.solid { background: #000; color: #fff; }
        .btn.solid:hover { background: #fff; color: #000; }
        .btn.ghost { background: #fff; color: #1c1c1c; }
        .btn.ghost:hover { background: #f0f0f0; }
        .btn.danger { background: #fff; color: #b23b3b; border-color: #b23b3b; }
        .btn.danger:hover { background: #b23b3b; color: #fff; }

        .save-note { margin-top: 18px; font-size: 10.00px; letter-spacing: 1px; color: #9a9a95; }
        .missing { margin-top: 40px; padding: 40px; border: 1px dashed #cfcfca; text-align: center; color: #9a9a95; }
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
    <script src="assets/footer.js"></script>
</head>
<body>
    <div class="side-image"></div>
    <a class="back" href="products.html">&#8592; חזרה</a>

    <div class="wrap">
        <h1 class="head-title">Edit product</h1>
        <p class="head-sub">Everything about this listing on one page — details, price, discount and status.</p>

        <div id="editRoot"></div>
        <div class="missing" id="missing" style="display:none;">
            This listing could not be found. It may have been removed.
        </div>
    </div>

    <script>
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        const nis = n => '₪' + (Number(n) || 0).toLocaleString('en-US');

        const params = new URLSearchParams(location.search);
        const isSeller = params.get('from') === 'seller';
        const idx = Number(params.get('i'));

        // Keep the back link (and, later, the redirect) in the same area.
        const backHref = 'products.html' + (isSeller ? '?from=seller' : '');
        document.querySelector('.back').setAttribute('href', backHref);
        if (isSeller) document.querySelector('.head-title').textContent = 'Edit product';

        let listings = readJSON('vero_listings', []);
        if (!Array.isArray(listings)) listings = [];
        // Seed the same demo listings My Products uses, so opening the editor
        // directly (or before any listing exists) still shows something to edit.
        if (!listings.length) {
            const now = Date.now();
            listings = [
                { id: 'demo1', name: 'Wool coat', seller: 'Studio Noir', category: 'Outerwear', price: 269, icon: '🧥', status: 'active', listedAt: now - 2 * 864e5 },
                { id: 'demo2', name: 'Raw denim', seller: 'Studio Noir', category: 'Denim', price: 129, icon: '👖', status: 'active', listedAt: now - 5 * 864e5 },
            ];
            save('vero_listings', listings);
        }
        const p = listings[Number.isInteger(idx) && listings[idx] ? idx : 0];

        function imgOf(x) {
            return x.image || x.processed_cover || x.original_cover
                || (Array.isArray(x.photos) ? x.photos.find(Boolean) : null) || null;
        }

        const CLOTHING = ['Shirts', 'Pants', 'Dresses', 'Skirts', 'Sweaters', 'Coats', 'Jackets',
            'Outerwear', 'Knitwear', 'Denim', 'Shoes', 'Boots', 'Sneakers', 'Sandals', 'Bags'];
        const STATUSES = [['active', 'Active'], ['sold', 'Sold'], ['deleted', 'Removed']];

        // Render only after the constants above exist (avoids a temporal-dead-zone throw).
        if (!p) {
            document.getElementById('missing').style.display = 'block';
        } else {
            renderEditor(p);
        }

        function renderEditor(p) {
            const src = imgOf(p);
            const root = document.getElementById('editRoot');
            const catOptions = ['', ...CLOTHING];
            root.innerHTML = `
                <div class="grid">
                    <!-- Cover -->
                    <div class="card">
                        <div class="card-label">Cover photo</div>
                        <div class="cover ${src ? 'has-img' : ''}" id="cover" style="${src ? `background-image:url('${src}')` : ''}">${src ? '' : (p.icon || '🛍️')}</div>
                        <label class="bg-toggle"><input type="checkbox" id="removeBg" checked> הסר רקע אוטומטית לתמונה הראשית</label>
                        <div class="bg-status" id="bgStatus"></div>
                        <button type="button" class="change-photo" id="changePhoto">Change photo</button>
                        <input id="photoInput" type="file" accept="image/*" hidden>
                    </div>

                    <!-- Details -->
                    <div class="card">
                        <div class="field">
                            <div class="card-label">Product name</div>
                            <input id="f-name" type="text" placeholder="e.g. Wool coat" value="${esc(p.name)}">
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <div class="card-label">Brand / seller</div>
                                <input id="f-seller" type="text" placeholder="Brand or store" value="${esc(p.seller || p.brand)}">
                            </div>
                            <div class="field">
                                <div class="card-label">Category</div>
                                <select id="f-category">
                                    ${catOptions.map(c => `<option ${((p.category || '') === c) ? 'selected' : ''} value="${esc(c)}">${c || '—'}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <div class="card-label">Price (₪)</div>
                                <input id="f-price" type="number" inputmode="numeric" placeholder="0" value="${p.price != null ? p.price : ''}">
                            </div>
                            <div class="field">
                                <div class="card-label">Discount (%)</div>
                                <input id="f-discount" type="number" inputmode="numeric" min="0" max="99" placeholder="0" value="${p.discount != null ? p.discount : ''}">
                            </div>
                        </div>
                        <div class="price-note" id="priceNote"></div>

                        <div class="field-row" style="margin-top:20px;">
                            <div class="field">
                                <div class="card-label">Condition</div>
                                <input id="f-condition" type="text" placeholder="e.g. New with tags" value="${esc(p.condition)}">
                            </div>
                            <div class="field">
                                <div class="card-label">Size</div>
                                <input id="f-size" type="text" placeholder="e.g. M / EU 42" value="${esc(p.size)}">
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <div class="card-label">Color</div>
                                <input id="f-color" type="text" placeholder="e.g. Camel" value="${esc(p.color)}">
                            </div>
                            <div class="field">
                                <div class="card-label">Material</div>
                                <input id="f-material" type="text" placeholder="e.g. Wool blend" value="${esc(p.material)}">
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <div class="card-label">Audience</div>
                                <select id="f-audience">
                                    ${[['','—'],['women','נשים'],['men','גברים'],['kids','ילדים'],['unisex','יוניסקס']]
                                        .map(([v,l]) => `<option value="${v}" ${((p.audience||'')===v)?'selected':''}>${l}</option>`).join('')}
                                </select>
                            </div>
                            <div class="field"></div>
                        </div>
                        <div class="field">
                            <div class="card-label">Description</div>
                            <textarea id="f-description" rows="3" placeholder="A short line about the item">${esc(p.description)}</textarea>
                        </div>

                        <div class="field" style="margin-top:8px;">
                            <div class="card-label">Status</div>
                            <div class="seg" id="statusSeg">
                                ${STATUSES.map(([v, l]) => `<button type="button" data-v="${v}" class="${(p.status || 'active') === v ? 'on' : ''}">${l}</button>`).join('')}
                            </div>
                        </div>

                        <div class="row-actions">
                            <button class="btn solid" id="saveBtn" type="button">Save changes</button>
                            <button class="btn danger" id="deleteBtn" type="button">Delete permanently</button>
                        </div>
                        <div class="save-note" id="saveNote">Changes are saved when you press Save.</div>
                    </div>
                </div>`;

            wire(p);
        }

        function esc(v) { return (v == null ? '' : String(v)).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

        // ---- Automatic background removal (fully client-side, no external service) ----
        // Treats the corners/edges as the backdrop and flood-fills every connected
        // pixel within a colour tolerance to transparent, so the item floats on the
        // product-page background (#F2F0EF). Works best on studio / plain backdrops.
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const im = new Image();
                im.onload = () => resolve(im);
                im.onerror = reject;
                im.src = src;
            });
        }
        async function removeBackground(dataUrl, tolerance = 42) {
            const img = await loadImage(dataUrl);
            // Cap the working size so big phone photos stay fast.
            const MAX = 1400;
            const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const image = ctx.getImageData(0, 0, w, h);
            const px = image.data;

            // Average backdrop colour from the four corners.
            const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];
            let br = 0, bg = 0, bb = 0;
            corners.forEach(([x, y]) => { const i = (y * w + x) * 4; br += px[i]; bg += px[i + 1]; bb += px[i + 2]; });
            br /= 4; bg /= 4; bb /= 4;
            const tol2 = tolerance * tolerance * 3;

            const visited = new Uint8Array(w * h);
            const stack = [];
            const consider = (x, y) => {
                if (x < 0 || y < 0 || x >= w || y >= h) return;
                const idx = y * w + x;
                if (visited[idx]) return;
                const i = idx * 4;
                const dr = px[i] - br, dg = px[i + 1] - bg, db = px[i + 2] - bb;
                if (dr * dr + dg * dg + db * db <= tol2) {
                    visited[idx] = 1; px[i + 3] = 0; stack.push(idx);
                } else {
                    visited[idx] = 2;
                }
            };
            for (let x = 0; x < w; x++) { consider(x, 0); consider(x, h - 1); }
            for (let y = 0; y < h; y++) { consider(0, y); consider(w - 1, y); }
            while (stack.length) {
                const idx = stack.pop(), x = idx % w, y = (idx / w) | 0;
                consider(x + 1, y); consider(x - 1, y); consider(x, y + 1); consider(x, y - 1);
            }

            // Soften the boundary: kept pixels touching transparency go semi-opaque.
            const alphaAt = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : px[(y * w + x) * 4 + 3];
            const original = new Uint8ClampedArray(px);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    if (original[i + 3] === 0) continue;
                    let clear = 0;
                    if (alphaAt(x + 1, y) === 0) clear++;
                    if (alphaAt(x - 1, y) === 0) clear++;
                    if (alphaAt(x, y + 1) === 0) clear++;
                    if (alphaAt(x, y - 1) === 0) clear++;
                    if (clear >= 1) px[i + 3] = Math.min(px[i + 3], clear >= 3 ? 90 : 170);
                }
            }
            ctx.putImageData(image, 0, 0);
            return canvas.toDataURL('image/png');
        }

        function wire(p) {
            let status = p.status || 'active';

            // Cover upload — with automatic background removal for the main image.
            const cover = document.getElementById('cover');
            const photoInput = document.getElementById('photoInput');
            const bgToggle = document.getElementById('removeBg');
            const bgStatus = document.getElementById('bgStatus');

            function showCover(url, cutout) {
                cover.style.backgroundImage = `url('${url}')`;
                cover.classList.add('has-img');
                cover.classList.toggle('cutout', !!cutout);
                cover.textContent = '';
            }

            document.getElementById('changePhoto').addEventListener('click', () => photoInput.click());
            photoInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    const original = reader.result;
                    p._newImageOriginal = original;
                    if (!bgToggle.checked) {
                        p._newImage = original;
                        showCover(original, false);
                        bgStatus.textContent = '';
                        return;
                    }
                    // Preview the original immediately, then swap in the cut-out.
                    showCover(original, false);
                    bgStatus.classList.add('working');
                    bgStatus.textContent = 'מסיר רקע…';
                    try {
                        const cut = await removeBackground(original);
                        p._newImage = cut;
                        showCover(cut, true);
                        bgStatus.classList.remove('working');
                        bgStatus.textContent = 'הרקע הוסר — המוצר צף על רקע הדף ✓';
                    } catch (err) {
                        console.error(err);
                        p._newImage = original;
                        bgStatus.classList.remove('working');
                        bgStatus.textContent = 'לא ניתן היה להסיר רקע — נשמרה התמונה המקורית';
                    }
                };
                reader.readAsDataURL(file);
            });

            // Re-run (or undo) removal when the toggle changes and a photo is loaded.
            bgToggle.addEventListener('change', async () => {
                if (!p._newImageOriginal) return;
                if (!bgToggle.checked) {
                    p._newImage = p._newImageOriginal;
                    showCover(p._newImageOriginal, false);
                    bgStatus.textContent = '';
                    return;
                }
                bgStatus.classList.add('working');
                bgStatus.textContent = 'מסיר רקע…';
                try {
                    const cut = await removeBackground(p._newImageOriginal);
                    p._newImage = cut;
                    showCover(cut, true);
                    bgStatus.classList.remove('working');
                    bgStatus.textContent = 'הרקע הוסר — המוצר צף על רקע הדף ✓';
                } catch (err) { console.error(err); }
            });

            // Live final-price readout.
            const priceEl = document.getElementById('f-price');
            const discEl = document.getElementById('f-discount');
            const note = document.getElementById('priceNote');
            function refreshPrice() {
                const price = Number(priceEl.value) || 0;
                const disc = Number(discEl.value) || 0;
                if (disc > 0 && disc < 100 && price > 0) {
                    const final = Math.round(price * (1 - disc / 100));
                    note.innerHTML = `Buyers pay <b>${nis(final)}</b><span class="old">${nis(price)}</span> · ${disc}% off`;
                } else {
                    note.innerHTML = price > 0 ? `Buyers pay <b>${nis(price)}</b>` : '';
                }
            }
            priceEl.addEventListener('input', refreshPrice);
            discEl.addEventListener('input', refreshPrice);
            refreshPrice();

            // Status segmented control.
            document.getElementById('statusSeg').addEventListener('click', (e) => {
                const b = e.target.closest('button[data-v]'); if (!b) return;
                status = b.dataset.v;
                document.querySelectorAll('#statusSeg button').forEach(x => x.classList.toggle('on', x === b));
            });

            // Save.
            document.getElementById('saveBtn').addEventListener('click', () => {
                const val = id => document.getElementById(id).value.trim();
                p.name = val('f-name') || 'Untitled listing';
                const seller = val('f-seller');
                p.seller = seller; p.brand = seller;
                p.category = document.getElementById('f-category').value;
                p.price = Number(val('f-price')) || 0;
                const disc = Number(val('f-discount')) || 0;
                p.discount = (disc > 0 && disc < 100) ? disc : 0;
                p.condition = val('f-condition');
                p.size = val('f-size');
                p.color = val('f-color');
                p.material = val('f-material');
                p.audience = document.getElementById('f-audience').value;
                p.description = val('f-description');
                if (p._newImage) {
                    p.image = p._newImage;
                    p.processed_cover = p._newImage;
                    if (p._newImageOriginal) p.original_cover = p._newImageOriginal;
                    delete p._newImage; delete p._newImageOriginal;
                }

                // Status transitions keep the same timestamps the listings page reads.
                const prev = p.status || 'active';
                if (status !== prev) {
                    if (status === 'sold') { p.soldAt = Date.now(); delete p.deletedAt; }
                    else if (status === 'deleted') { p.deletedAt = Date.now(); delete p.soldAt; }
                    else { p.listedAt = Date.now(); delete p.soldAt; delete p.deletedAt; }
                }
                p.status = status;

                listings[idx] = p;
                save('vero_listings', listings);
                const n = document.getElementById('saveNote');
                n.textContent = 'Saved ✓ — returning to your products…';
                setTimeout(() => { location.href = backHref; }, 650);
            });

            // Permanent delete.
            document.getElementById('deleteBtn').addEventListener('click', () => {
                if (!confirm('Delete this listing permanently? This cannot be undone.')) return;
                listings.splice(idx, 1);
                save('vero_listings', listings);
                location.href = backHref;
            });
        }

        // Exit mirrors the entry.
        document.querySelector('.back').addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.55s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            wrap.style.opacity = '0';
            wrap.style.transform = 'translateX(-18vw)';
            setTimeout(() => { location.href = e.currentTarget.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
