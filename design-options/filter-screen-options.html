<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter Screen Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 284px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 284px; height: 800px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 1120px; transform: scale(0.7); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; font-family: 'Inter', sans-serif; }
.screen.dark { background: #14110e; color: #f3efe8; }
.th { display: block; background: #ddd center / cover no-repeat; filter: grayscale(0.2); }
.sbar { display: flex; align-items: center; gap: 12px; padding: 40px 24px 12px; border-bottom: 1.5px solid #111; margin: 0 20px; }
.dark .sbar { border-color: #f3efe8; }
.sbar .q { flex: 1; font-size: 15px; color: #9a958c; }
.sbar svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.4; fill: none; }
.hd { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; text-align: center; margin: 26px 0 16px; }
.hd.l { text-align: left; padding: 0 24px; letter-spacing: 2.5px; }
.pill { border: 1px solid #111; border-radius: 14px; padding: 15px 0; font-size: 14px; text-align: center; }
.pill.on { background: #111; color: #fff; font-weight: 700; }
.dark .pill { border-color: #4a443b; } .dark .pill.on { background: #f3efe8; color: #14110e; border-color: #f3efe8; }
/* bottom nav */
.nav { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 58px; border-radius: 29px; background: #141a24; display: flex; align-items: center; justify-content: space-around; }
.nav i { width: 19px; height: 19px; border: 1.5px solid rgba(255,255,255,0.7); border-radius: 5px; display: block; }
.nav i.on { border: none; background: #fff; position: relative; } .nav i.on::after { content: ''; position: absolute; inset: 4px; border: 1.5px solid var(--accent); border-radius: 2px; }

/* layouts for genders */
.gwrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 24px; }
.gwrap .pill { min-width: 90px; padding: 15px 22px; }
.gseg { display: flex; margin: 0 24px; border: 1px solid #111; border-radius: 14px; overflow: hidden; }
.dark .gseg { border-color: #4a443b; }
.gseg span { flex: 1; text-align: center; padding: 14px 0; font-size: 13px; }
.gseg span.on { background: #111; color: #fff; font-weight: 700; }
.dark .gseg span.on { background: #f3efe8; color: #14110e; }
.gtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
.gtiles.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
.gtile { position: relative; border-radius: 14px; overflow: hidden; height: 110px; color: #fff; }
.gtiles.four .gtile { height: 92px; }
.gtile .th { position: absolute; inset: 0; filter: grayscale(0.3) brightness(0.68); }
.gtile span { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 13px; font-weight: 600; z-index: 1; }
.gtile.on { outline: 2.5px solid #111; outline-offset: -2.5px; } .gtile.on .th { filter: grayscale(0) brightness(0.72); }
.gtabs { display: flex; justify-content: center; gap: 26px; }
.gtabs span { font-size: 15px; color: var(--muted); padding-bottom: 6px; }
.gtabs span.on { color: #111; border-bottom: 2px solid #111; font-weight: 600; }
.dark .gtabs span.on { color: #f3efe8; border-color: #f3efe8; }

/* product-type variants */
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 0 24px; }
.chips.l { justify-content: flex-start; }
.chip { border: 1px solid #111; border-radius: 12px; padding: 13px 16px; font-size: 13px; }
.dark .chip { border-color: #4a443b; }
.chips.tag .chip { border-radius: 999px; padding: 9px 15px; font-size: 12px; border-color: #cfcbc4; }
.list .row { display: flex; align-items: center; justify-content: space-between; padding: 15px 24px; border-bottom: 1px solid var(--line); font-size: 14px; }
.list .row .c { color: var(--muted); font-size: 12px; }
.list .row svg { width: 15px; height: 15px; stroke: #bbb; fill: none; stroke-width: 1.6; }
.icg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 20px; }
.icg .c { border: 1px solid var(--line); border-radius: 14px; padding: 16px 6px 11px; text-align: center; }
.icg .c svg { width: 26px; height: 26px; stroke: #333; fill: none; stroke-width: 1.3; }
.icg .c span { display: block; font-size: 10px; margin-top: 8px; letter-spacing: 0.3px; }
.thg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
.thg .c { position: relative; border-radius: 12px; overflow: hidden; height: 88px; color: #fff; }
.thg .c .th { position: absolute; inset: 0; filter: grayscale(0.25) brightness(0.65); }
.thg .c span { position: absolute; left: 12px; bottom: 10px; z-index: 1; font-size: 13px; font-weight: 600; }
.grp { padding: 0 24px; } .grp .gh { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
.grp .chips { padding: 0; justify-content: flex-start; }
</style>
</head>
<body>
<h1>Filter — מסך "למי ומה"</h1>
<p class="sub">8 עיצובים למסך בחירת מגדר + סוג מוצר</p>

<div class="grid" id="opts"></div>

<script>
var IMG = { men: '../men-hero.jpg', women: '../women-hero.jpg', kids: '../clothing-hero.jpg', uni: '../hero-beach.jpg' };
var th = (s, p) => '<span class="th" style="background-image:url(\'' + s + '\');background-position:' + (p || '50% 35%') + '"></span>';
var CATS = ['Tops', 'T-Shirts', 'Dresses', 'Skirts', 'Jeans', 'Trousers & Leggings', 'Shorts', 'Playsuits & Jumpsuits', 'Jumpers & Knitwear', 'Hoodies & Sweatshirts', 'Coats & Jackets', 'Blazers', 'Activewear', 'Swimwear', 'Lingerie & Nightwear', 'Shoes', 'Bags & Purses', 'Jewellery', 'Accessories'];
var MAG = '<svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
var CHEV = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var sbar = '<div class="sbar"><span class="q">Search users</span>' + MAG + '</div>';
var nav = '<div class="nav"><i class="on"></i><i></i><i></i><i></i><i></i></div>';
var IC = {
  Tops: '<path d="M8 4l-4 3 2 3 2-1v11h8V9l2 1 2-3-4-3-2 2-2-2z"/>', Dresses: '<path d="M9 4l3 3 3-3 2 5-2 2 2 9H7l2-9-2-2z"/>',
  Jeans: '<path d="M8 4h8v16h-4l-1-9-1 9H7z"/>', Shoes: '<path d="M3 16l1-5 5 2 6 1 6 1v2H3z"/>',
  Bags: '<path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/>', Coats: '<path d="M8 4l-3 3v13h5V9m4 0v11h5V7l-3-3-2 2-2-2z"/>',
  Jewellery: '<circle cx="12" cy="14" r="5"/><path d="M9 9l3-4 3 4"/>', Acc: '<circle cx="12" cy="12" r="7"/><path d="M12 7v5l3 2"/>', Knit: '<path d="M8 4l-4 4 2 2v10h12V10l2-2-4-4-2 2-2-2z"/>'
};
var ic = (p) => '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';

var OPTS = [
  ['A1 · הקיים', 'צ׳יפים מעוגלים ממורכזים, מגדר למעלה. לנקודת השוואה.',
   '<div class="screen">' + sbar + '<div class="hd">Who are you shopping for?</div><div class="gwrap"><span class="pill">Men</span><span class="pill on">Women</span><span class="pill">Kids</span><span class="pill" style="flex-basis:100%;max-width:150px">Unisex</span></div>' +
   '<div class="hd">Product type</div><div class="chips">' + CATS.slice(0, 13).map(c => '<span class="chip">' + c + '</span>').join('') + '</div>' + nav + '</div>'],

  ['A2 · אריחי תמונה למגדר', 'מגדר כארבע תמונות, סוגי מוצר כצ׳יפים מיושרים לשמאל. ויזואלי וברור.',
   '<div class="screen">' + sbar + '<div class="hd l">Shopping for</div><div class="gtiles four">' +
   [['Men', IMG.men], ['Women', IMG.women], ['Kids', IMG.kids], ['Unisex', IMG.uni]].map((g, k) => '<div class="gtile' + (k === 1 ? ' on' : '') + '">' + th(g[1]) + '<span>' + g[0] + '</span></div>').join('') + '</div>' +
   '<div class="hd l">Product type</div><div class="chips l">' + CATS.slice(0, 11).map(c => '<span class="chip">' + c + '</span>').join('') + '</div>' + nav + '</div>'],

  ['A3 · Segmented + רשימה', 'מגדר כ-segmented control, סוגי מוצר כרשימה מסודרת עם מספר פריטים. נקי ומהיר לסריקה.',
   '<div class="screen">' + sbar + '<div class="hd l">Shopping for</div><div class="gseg"><span>Men</span><span class="on">Women</span><span>Kids</span><span>Unisex</span></div>' +
   '<div class="hd l">Product type</div><div class="list">' + [['Dresses', '420'], ['Tops', '1.2k'], ['Jeans', '680'], ['Coats & Jackets', '340'], ['Knitwear', '510'], ['Shoes', '890'], ['Bags & Purses', '260'], ['Accessories', '430']].map(c => '<div class="row"><span>' + c[0] + '</span><span style="display:flex;align-items:center;gap:8px"><span class="c">' + c[1] + '</span>' + CHEV + '</span></div>').join('') + '</div>' + nav + '</div>'],

  ['A4 · תגיות קומפקטיות', 'הכול צ׳יפים מעוגלים וצפופים יותר, מיושר לשמאל. מראה יותר קטגוריות בפחות גלילה.',
   '<div class="screen">' + sbar + '<div class="hd l">Shopping for</div><div class="chips tag l" style="padding:0 24px"><span class="chip">Men</span><span class="chip" style="background:#111;color:#fff;border-color:#111">Women</span><span class="chip">Kids</span><span class="chip">Unisex</span></div>' +
   '<div class="hd l">Product type</div><div class="chips tag l">' + CATS.map(c => '<span class="chip">' + c + '</span>').join('') + '</div>' + nav + '</div>'],

  ['A5 · גריד אייקונים', 'סוגי מוצר כרשת כרטיסים עם אייקון קו לכל קטגוריה. שובב ונוח ללחיצה.',
   '<div class="screen">' + sbar + '<div class="hd">Shopping for</div><div class="gwrap"><span class="pill" style="min-width:76px">Men</span><span class="pill on" style="min-width:76px">Women</span><span class="pill" style="min-width:76px">Kids</span></div>' +
   '<div class="hd">Product type</div><div class="icg">' +
   [['Tops', IC.Tops], ['Dresses', IC.Dresses], ['Jeans', IC.Jeans], ['Knitwear', IC.Knit], ['Coats', IC.Coats], ['Shoes', IC.Shoes], ['Bags', IC.Bags], ['Jewellery', IC.Jewellery], ['More', IC.Acc]].map(c => '<div class="c">' + ic(c[1]) + '<span>' + c[0] + '</span></div>').join('') + '</div>' + nav + '</div>'],

  ['A6 · תמונות לקטגוריות', 'כל קטגוריה עם תמונה קטנה ברקע, 2 בשורה. הכי "אופנה" ומעורר השראה.',
   '<div class="screen">' + sbar + '<div class="hd l">Shopping for</div><div class="gseg"><span>Men</span><span class="on">Women</span><span>Kids</span><span>Unisex</span></div>' +
   '<div class="hd l">Product type</div><div class="thg">' + [['Dresses', IMG.women], ['Tops', IMG.uni], ['Jeans', IMG.men], ['Coats & Jackets', IMG.kids], ['Shoes', IMG.men], ['Bags & Purses', IMG.women]].map(c => '<div class="c">' + th(c[1]) + '<span>' + c[0] + '</span></div>').join('') + '</div>' + nav + '</div>'],

  ['A7 · מקובץ לפי משפחות', 'סוגי המוצר מחולקים לקבוצות (Tops, Bottoms, Outerwear, Shoes & bags). קל למצוא כשיש הרבה.',
   '<div class="screen">' + sbar + '<div class="hd l">Shopping for</div><div class="gseg"><span>Men</span><span class="on">Women</span><span>Kids</span><span>Unisex</span></div>' +
   '<div class="grp">' +
   [['Tops', ['Tops', 'T-Shirts', 'Shirts', 'Knitwear', 'Hoodies']], ['Bottoms', ['Jeans', 'Trousers', 'Skirts', 'Shorts']], ['Outerwear', ['Coats & Jackets', 'Blazers']], ['Shoes & bags', ['Shoes', 'Bags & Purses', 'Jewellery']]].map(g =>
     '<div class="gh">' + g[0] + '</div><div class="chips tag">' + g[1].map(c => '<span class="chip">' + c + '</span>').join('') + '</div>').join('') + '</div>' + nav + '</div>'],

  ['A8 · כהה ונועז', 'רקע כהה, טיפוגרפיה גדולה וצ׳יפים עם מילוי. דרמטי ויוקרתי.',
   '<div class="screen dark">' + sbar + '<div class="hd">Shopping for</div><div class="gwrap"><span class="pill">Men</span><span class="pill on">Women</span><span class="pill">Kids</span><span class="pill" style="flex-basis:100%;max-width:150px">Unisex</span></div>' +
   '<div class="hd">Product type</div><div class="chips">' + CATS.slice(0, 13).map((c, k) => '<span class="chip' + (k === 2 ? ' on' : '') + '" style="' + (k === 2 ? 'background:#f3efe8;color:#14110e;border-color:#f3efe8' : '') + '">' + c + '</span>').join('') + '</div>' + nav + '</div>']
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
