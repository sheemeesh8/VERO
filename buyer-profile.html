<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <script src="assets/product-link.js"></script>
    <meta charset="UTF-8">
<script src="assets/motion.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phone-only presentation: opened as a top-level window this page hands off to
         phone-frame.html, which reloads it inside a phone-width iframe. Inside that
         frame (window.top !== self) the check is skipped, so the page renders. -->
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';   // some servers serve clean URLs (no .html)
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
      }
    </script>
    <meta name="description" content="moravchick — straight fashion. A curated marketplace for pre-loved fashion and art. Discover unique pieces, chat with sellers and complete every sale safely in person.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — Profile</title>
    <script>
      /* ?embed=hero — only the top of the profile (cover → description + socials),
         shown as a live preview at the top of My Profile / My Store. */
      if (/[?&]embed=hero\b/.test(location.search)) document.documentElement.classList.add('pfx-embed');
    </script>
    <script src="vero-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow-x: hidden;
        }

        /* Sticky search — a floating round button fixed to the viewport that opens
           a search pill. Both stay put while the page scrolls. */
        .search-fab {
            position: fixed; bottom: 28px; right: 28px; z-index: 60;
            width: 54px; height: 54px; border-radius: 999px; border: none; cursor: pointer;
            background: #000; color: #fff; display: grid; place-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: transform 0.2s, opacity 0.2s;
        }
        .search-fab:hover { transform: scale(1.06); }
        .search-fab.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }
        .search-fab svg {
            width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.25;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .search-pop {
            position: fixed; bottom: 28px; right: 28px; z-index: 61;
            display: none; align-items: center; gap: 10px;
            width: min(420px, calc(100vw - 56px));
            padding: 11px 16px; border-radius: 999px;
            background: #fff; border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-pop.open { display: flex; }
        .search-pop svg {
            width: 18px; height: 18px; flex: none; fill: none; stroke: #1c1c1c;
            stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round;
        }
        .search-pop input {
            border: none; outline: none; background: none; flex: 1; min-width: 0;
            font-family: inherit; font-size: 10.62px; color: #1c1c1c;
        }
        .search-pop-close {
            border: none; background: none; cursor: pointer; flex: none;
            font-size: 17px; line-height: 1; color: #333230;
        }
        .search-pop-close:hover { color: #1c1c1c; }

        /* Back button — same pill language as the rest of the site. */
        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 12px;
            padding: 6px 4px; border: none; border-radius: 0;
            font-size: 11.9px; letter-spacing: 2px; text-decoration: none; color: #fff;
            background: none; color: #fff; mix-blend-mode: difference;
            transition: opacity 0.25s;
        }
        /* difference blend inverts the button against whatever is behind it, so it
           stays readable over the dark hero and the white feed alike. */
        .back svg, .back img { width: 22px; height: 22px; }
        .back:hover { opacity: 0.7; }

        /* The whole page slides in from the left, like every other area. */
        .wrap { animation: slideInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-6vw); }
            to   { opacity: 1; transform: none; }
        }

        /* ===================== HERO =====================
           The store's background image (set in settings), full-bleed, with the
           store name and tagline laid over a bottom scrim. No profile picture. */
        .hero {
            position: relative; width: 100%; height: 64vh; min-height: 440px;
            background: #23231f center / cover no-repeat;
            border-bottom: 1px solid #000;
            display: flex; align-items: flex-end;
        }
        .hero > video.hero-video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; pointer-events: none;
        }
        .hero::after {
            content: ""; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0.55) 100%);
        }
        /* Video background: lighter scrim so the clip isn't darkened. */
        .hero.has-video::after {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.4) 100%);
        }
        .hero-inner { position: relative; z-index: 2; padding: 0 44px 40px; color: #fff; width: 100%; }
        /* Round profile picture on the right of the hero, above the follower count. */
        .hero-avatar {
            position: absolute; z-index: 3; top: 50%; right: 44px; transform: translateY(-64%);
            width: clamp(150px, 20vw, 232px); height: auto; aspect-ratio: 1; margin: 0;
            border-radius: 50%; border: none;
            background: #f2f2ee center / cover no-repeat;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }
        /* Bottom row: name + status/follow at left, follower count at right. */
        .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; }
        .hero-lead { display: flex; align-items: flex-end; gap: 26px; min-width: 0; }
        .hero-name { font-size: clamp(39.1px, 6.8vw, 88.4px); font-weight: 200; letter-spacing: 2px; line-height: 0.82; }
        .hero-meta { display: flex; flex-direction: column; gap: 7px; padding-bottom: 8px; flex: none; }
        .hero-status { font-size: 7.79px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.85; }
        .hero-status.is-closed { opacity: 0.6; }
        .hero-followers { text-align: right; display: flex; flex-direction: column; gap: 6px; flex: none; }
        .hf-num { font-size: clamp(17px, 2.21vw, 27.2px); font-weight: 300; letter-spacing: 8px; line-height: 1; }
        .hf-lbl { font-size: 9.21px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.9; }
        @media (max-width: 700px) {
            /* ===== Dedicated mobile hero =====
               The background image fills the whole screen; a single centred column
               is pinned to its bottom — profile picture, big name, status + follow,
               then the follower count. The rest of the profile scrolls up from below. */
            .hero {
                height: 100vh; height: 100dvh; min-height: 0;
                flex-direction: column; justify-content: center; align-items: center;
            }
            /* Avatar sits in normal flow, directly above the name, centred. */
            .hero-avatar {
                position: static; transform: none; top: auto; right: auto;
                width: 150px; height: auto; aspect-ratio: 1; margin: 0 0 22px;
                box-shadow: 0 10px 34px rgba(0,0,0,0.4);
            }
            .hero-inner { padding: 0 22px 40px; width: 100%; }
            .hero-row  { flex-direction: column; align-items: center; gap: 14px; }
            /* Same order as the store profile: name → followers → OPEN / Follow.
               Dissolve the wrapper so the stat can sit between name and the meta row. */
            .hero-lead { display: contents; }
            .hero-name {
                order: 1; text-align: center; font-size: clamp(34px, 10.62vw, 49.3px);
                line-height: 0.92; letter-spacing: 1px; max-width: 100%;
            }
            /* Follower count centred, directly under the name. */
            .hero-followers { order: 2; text-align: center; align-items: center; }
            /* Status on top, then the Follow button below it, then Socials —
               a centred vertical stack under the follower count. */
            .hero-meta { order: 3; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 0; }
            .hero-socials-btn { align-self: center; }
            .hf-num { letter-spacing: 6px; }
            /* The floating verified badge is anchored to the desktop name position;
               drop it on the centred mobile layout. */
            .verified-check { display: none; }
        }
        /* Shared five-star rating (outline stars, proportional fill). */
        .vero-stars { position: relative; display: inline-flex; align-items: center; line-height: 1; font-size: 12.75px; direction: ltr; }
        .vero-stars-base, .vero-stars-fill { letter-spacing: 3px; }
        .vero-stars-base { color: #54534f; }
        .vero-stars-fill { color: #111; position: absolute; top: 0; left: 0; width: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
        .vero-stars-num { margin-left: 10px; font-size: 9.21px; color: #33322e; letter-spacing: 0.3px; }
        .hero-rating { margin-top: 14px; }
        .hero-tag  { margin-top: 14px; font-size: 10.62px; font-weight: 300; letter-spacing: 0.5px; max-width: 620px; opacity: 0.92; }
        /* Small blue verified check, floated over the hero above the name. */
        .verified-check {
            position: absolute; z-index: 3; left: 44px; bottom: calc(40px + clamp(46px, 8vw, 104px) + 14px);
            display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none;
            border-radius: 50%; background: #2f6bff; color: #fff; font-size: 8.5px; font-weight: 700;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }
        .verified-check.is-hidden { display: none; }

        /* SOCIALS — a small underlined label under Follow, in the hero-meta stack. */
        .hero-socials-btn {
            padding: 0; cursor: pointer; align-self: flex-start;
            border: none; background: none; color: #fff;
            font-family: inherit; font-size: 7.5px; letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(255,255,255,0.5);
            transition: text-decoration-color 0.2s;
        }
        .hero-socials-btn:hover { text-decoration-color: #fff; }

        /* SOCIALS popup — a small centred dialog listing each network. */
        .soc-overlay {
            position: fixed; inset: 0; z-index: 85; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
        }
        .soc-overlay.open { display: flex; }
        .soc-modal {
            width: min(360px, 100%); background: #fff; border-radius: 16px; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .soc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .soc-title { font-size: 9.21px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .soc-x {
            width: 30px; height: 30px; border: none; background: none; cursor: pointer;
            font-size: 17px; line-height: 1; color: #41403c; border-radius: 999px;
        }
        .soc-x:hover { background: #f0f0f0; color: #1c1c1c; }
        .soc-links { display: flex; flex-direction: column; gap: 10px; }
        .soc-links a {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 14px; border: 1px solid rgba(0,0,0,0.14); border-radius: 12px;
            color: #1c1c1c; text-decoration: none; font-size: 9.92px; letter-spacing: 0.4px;
            transition: background 0.2s, border-color 0.2s;
        }
        .soc-links a:hover { background: #f6f6f3; border-color: #000; }
        .soc-links svg { width: 22px; height: 22px; fill: currentColor; display: block; flex: none; }
        .hero-stat {
            position: absolute; right: 0; bottom: 0; text-align: right;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; transform: translateY(14px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }
        .hero-stat.is-active { opacity: 1; transform: translateY(0); }
        .hs-num { font-size: 41.08px; font-weight: 200; line-height: 1; }
        .hs-lbl { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        /* Follow — plain bold text beside the name (matches the mock), not a pill. */
        /* Follow — an enlarged framed pill over the hero. */
        .follow-btn {
            padding: 11px 30px; border: 1.5px solid #fff; border-radius: 999px;
            background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
            font-family: inherit; font-size: 11.05px; font-weight: 600; letter-spacing: 1.5px;
            text-transform: uppercase; text-align: center;
            transition: background 0.2s, color 0.2s;
        }
        .follow-btn:hover { background: #fff; color: #000; }
        .follow-btn.following { background: #fff; color: #000; font-weight: 600; }

        /* ===================== SLIDERS =====================
           A horizontally-scrolling row of outline chips. Two of them: the
           store's categories and the audiences it serves. Only what the seller
           offers is rendered. */
        .slider-block { padding: 26px 40px 0; }
        .slider-label { font-size: 7.79px; letter-spacing: 2px; text-transform: uppercase; color: #41403c; margin-bottom: 12px; }
        .slider {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .slider::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 10px 22px; border: 1.4px solid #000; border-radius: 999px;
            background: #fff; color: #1c1c1c; cursor: pointer; white-space: nowrap;
            font-family: inherit; font-size: 8.5px; letter-spacing: 1px;
            transition: background 0.2s, color 0.2s;
        }
        .chip:hover { background: #efefec; }
        .chip.active { background: #2A331B; color: #fff; }

        /* Featured slider — five product cards in a horizontal row. Same card
           and product-card.css as the feed; only the rail (flex + widths) lives
           here. */
        .feat-slider {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px;
            scrollbar-width: none;
        }
        .feat-slider::-webkit-scrollbar { display: none; }
        .feat-slider .product-card {
            /* Five across, matching the feed's column width. */
            flex: none; width: calc((100% - 64px) / 5);
        }
        @media (max-width: 700px) {
            .feat-slider .product-card { width: calc((100% - 14px) / 2); }
        }

        /* Per-product edit button — rides on top of the shared card (store-profile
           only; product-card.css is untouched). */
        .sp-edit {
            position: absolute; top: 10px; left: 10px; z-index: 3;
            width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center; padding: 0;
            border: none; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.15s, background 0.2s;
        }
        .sp-edit:hover { transform: scale(1.08); background: #fff; }
        .sp-edit svg { width: 17px; height: 17px; fill: none; stroke: #1c1c1c; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }

        /* Edit dialog. */
        .pe-overlay {
            position: fixed; inset: 0; z-index: 80; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
        }
        .pe-overlay.open { display: flex; }
        .pe-modal {
            width: min(400px, 100%); background: #fff; border-radius: 16px; padding: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .pe-title { font-size: 12.75px; font-weight: 500; margin-bottom: 20px; }
        .pe-field { display: block; margin-bottom: 16px; }
        .pe-field span { display: block; font-size: 7.79px; letter-spacing: 1.5px; text-transform: uppercase; color: #41403c; margin-bottom: 7px; }
        .pe-field select {
            width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.2); border-radius: 9px;
            font-family: inherit; font-size: 9.92px; background: #fff; color: #1c1c1c;
        }
        .pe-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
        .pe-btn {
            padding: 10px 22px; border-radius: 999px; font-family: inherit; font-size: 9.21px;
            letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; border: 1.4px solid #000;
        }
        .pe-btn.ghost { background: #fff; color: #1c1c1c; }
        .pe-btn.ghost:hover { background: #f0f0f0; }
        .pe-btn.solid { background: #2A331B; color: #fff; }
        .pe-btn.solid:hover { opacity: 0.85; }

        /* Audience banner — a full-bleed image slider, edge to edge of the page,
           cycling Women / Men / Kids. Same treatment as the hero. */
        .aud-banner {
            position: relative; width: 100%; height: 58vh; min-height: 420px;
            overflow: hidden; border-top: 1px solid #000; border-bottom: 1px solid #000;
        }
        .aud-slide {
            position: absolute; inset: 0; cursor: pointer;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            opacity: 0; transition: opacity 1s ease; z-index: 1;
        }
        .aud-slide.is-active { opacity: 1; z-index: 2; }
        .aud-slide::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
        }
        .aud-label {
            position: absolute; left: 40px; bottom: 34px; z-index: 3; color: #fff;
            font-size: clamp(28.9px, 4.25vw, 52.7px); font-weight: 200; letter-spacing: 1px;
            line-height: 1; pointer-events: none;
        }
        .aud-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
            width: 46px; height: 46px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid rgba(255,255,255,0.7); background: rgba(0,0,0,0.25);
            color: #fff; font-size: 14.17px; line-height: 1;
            transition: background 0.2s, border-color 0.2s;
        }
        .aud-arrow:hover { background: rgba(0,0,0,0.55); border-color: #fff; }
        .aud-arrow.prev { left: 24px; }
        .aud-arrow.next { right: 24px; }
        .aud-dots {
            position: absolute; right: 40px; bottom: 40px; z-index: 4;
            display: flex; gap: 10px;
        }
        .aud-dot {
            width: 9px; height: 9px; border-radius: 999px; padding: 0; cursor: pointer;
            border: 1px solid #fff; background: transparent; transition: background 0.3s;
        }
        .aud-dot.is-active { background: #fff; }
        @media (max-width: 700px) {
            .aud-label { left: 20px; bottom: 24px; }
            .aud-dots  { right: 20px; bottom: 28px; }
            .aud-arrow { width: 38px; height: 38px; }
            .aud-arrow.prev { left: 14px; }
            .aud-arrow.next { right: 14px; }
        }

        /* Clothing-category slider — a quarter-width info panel on the left and a
           three-quarter viewport on the right showing three cards. The leftmost
           (lead) card scales up and is the selected category. */
        .clo-block {
            /* Card size + gap drive both the track and the viewport width, so the
               viewport holds exactly three small cards; the info panel fills the
               rest of the row on the left. */
            --clo-w: 380px; --clo-gap: 8px;
            display: flex; gap: 28px; align-items: stretch;
        }
        .clo-info {
            flex: 1 1 auto; min-width: 0;
            display: flex; flex-direction: column; justify-content: center;
            padding-right: 8px;
        }
        .clo-kicker {
            font-size: 7.79px; letter-spacing: 2px; text-transform: uppercase;
            color: #41403c; margin-bottom: 14px;
        }
        .clo-info-title { font-size: 24.08px; font-weight: 300; line-height: 1.05; color: #1c1c1c; }
        .clo-info-desc {
            margin-top: 14px; font-size: 9.92px; font-weight: 300; line-height: 1.6;
            color: #55554f; max-width: 320px;
        }
        .clo-nav { display: flex; gap: 10px; margin-top: 26px; }
        .clo-arrow {
            width: 42px; height: 42px; border-radius: 999px; cursor: pointer;
            display: grid; place-items: center;
            border: 1px solid #000; background: transparent;
            color: #111; font-size: 14.17px; line-height: 1;
            transition: background 0.2s, color 0.2s;
        }
        .clo-arrow:hover { background: #2A331B; color: #fff; }

        /* The viewport is exactly three cards wide, so only three ever show. */
        .clo-slider {
            flex: 0 0 auto;
            width: calc(var(--clo-w) * 3 + var(--clo-gap) * 2);
            position: relative; overflow: hidden; padding: 18px 0;
        }
        .clo-track {
            display: flex; gap: var(--clo-gap);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .clo-card {
            /* Small equal cards, no enlargement, tight gaps. */
            flex: none; width: var(--clo-w); cursor: pointer;
            background: none; border: none; padding: 0; font-family: inherit; text-align: left;
        }
        .clo-thumb {
            width: 100%; aspect-ratio: 3 / 4; border: 1px solid #000;
            background: #23231f center / cover no-repeat; filter: grayscale(1);
            transition: filter 0.4s;
        }
        .clo-card.is-lead .clo-thumb { filter: grayscale(0); }
        .clo-cap {
            display: flex; align-items: baseline; gap: 12px; margin-top: 16px;
            font-size: 15.58px; letter-spacing: 0.5px; color: #1c1c1c;
        }
        .clo-num { font-size: 12.75px; color: #41403c; letter-spacing: 1px; }
        .clo-card.is-lead .clo-cap { font-weight: 600; }

        @media (max-width: 700px) {
            .clo-block { flex-direction: column; gap: 18px; --clo-w: 150px; --clo-gap: 8px; }
            .clo-info { flex-basis: auto; max-width: none; }
        }

        /* ===================== AD BANNER =====================
           The seller's own promo, but a FIXED size on every store profile. */
        .ad-band {
            margin: 30px 40px 0; height: 150px; border: 1px solid #000;
            background: #23231f center / cover no-repeat; position: relative;
            display: flex; align-items: center; overflow: hidden;
        }
        .ad-band::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.05) 70%);

<body>
    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->
    <header class="page-header ph-overlay ph-float" data-hero="#hero" data-stick="scroll">
        <div class="ph-name" role="heading" aria-level="1">Profile</div>
        <a class="ph-back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </header>

    <!-- STICKY SEARCH POPUP — a floating button pinned to the viewport; clicking it
         opens a search field that filters the feed live. -->
    <button class="search-fab" id="searchFab" aria-label="Search this store">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    </button>
    <div class="search-pop" id="searchPop" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
        <input type="search" id="storeSearch" placeholder="Search items…" autocomplete="off">
        <button class="search-pop-close" id="searchClose" aria-label="Close">&times;</button>
    </div>

    <div class="wrap">
        <!-- HERO — mirrors the storefront, but a buyer's page carries a round
             profile picture on the right of the hero. -->
        <!-- PROFILEFRONT — social-profile layout: a cover photo that fades into
             the page, a rounded-square profile picture overlapping it, the name
             and @handle with Message + Follow on the right, the Following /
             Followers line, the bio, then tabs over the feed. Reuses the old
             hero IDs so the populate + follow scripts keep working. -->
        <div class="pfx" id="hero">
            <!-- Top half: the cover photo, with the stats slider on it and the
                 round profile picture sitting on the line into the white half. -->
            <div class="pfx-cover dn-bg" id="dnBg">
                <a class="pfx-round pfx-back" href="javascript:history.length>1?history.back():location.href='index.html'" aria-label="Back">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                </a>
                <button class="pfx-round pfx-share" type="button" id="shareBtn" aria-label="Share">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                </button>
            </div>
            <!-- Hidden stubs kept so existing scripts still find their elements. -->
            <span id="verifiedCheck" hidden></span>
            <span id="heroAvatar" hidden></span>
            <button id="socialsBtn" hidden></button>
            <span id="storeStatus" class="is-closed" hidden>Offline</span>

            <!-- Under the cover: the round picture on the left overlapping it, the
                 name + handle with Message / Follow on the right, the Following /
                 Followers line, then the description and the social links. -->
            <div class="pfx-body">
                <div class="pfx-avatar dn-card"><img id="pfCardImg" alt=""></div>
                <div class="pfx-headrow">
                    <div class="pfx-names">
                        <div class="pfx-name">
                            <span id="storeName">Your Name</span>
                            <span id="storeLast"></span>
                        </div>
                        <span class="pfx-handle" id="dnUsername" hidden></span>
                    </div>
                    <div class="pfx-actions">
                        <button class="pfx-msg" type="button" aria-label="Message"
                            onclick="var m=document.getElementById('messageBtn');if(m)m.click();">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z" fill="currentColor" stroke="none"/><path d="M3 5l9 7 9-7" stroke="#fff"/></svg>
                        </button>
                        <button class="pfx-follow" id="pfPlus" type="button" aria-label="Follow"
                            onclick="var fb=document.getElementById('followBtn');if(fb){fb.click();var on=fb.classList.contains('following');this.classList.toggle('is-following',on);this.querySelector('.dn-follow-label').textContent=on?'Following':'Follow';}">
                            <span class="dn-follow-label">Follow</span>
                        </button>
                    </div>
                </div>
                <div class="pfx-stats">
                    <a href="follows.html#following"><b id="following">0</b> Following</a>
                    <a href="follows.html#followers"><b id="followers">0</b> Followers</a>
                    <a href="#feed"><b id="itemCount">0</b> Items</a>
                </div>
                <p class="pfx-bio" id="storeBio"></p>
                <div class="pfx-socials" id="pfxSocials" hidden></div>
            </div>
        </div>

        <!-- Sticky bottom action bar (hidden) — kept so the follow logic still runs
             through #followBtn, driven by the + button above. -->

            <button class="pf-msg" type="button" id="messageBtn">Message</button>
            <button class="follow-btn" id="followBtn">Follow</button>
        </div>

        <!-- Storefront events — the seller's upcoming events (from vero_events). -->
        <section class="sf-events" id="sfEvents" hidden>
            <div class="feed-head"><div class="feed-title">Upcoming events</div></div>
            <div class="sf-ev-list" id="sfEvList"></div>
        </section>
        <div class="feed-empty pfx-ev-empty" id="pfxEvEmpty">No upcoming events.</div>


        <!-- PROMOTED — the pieces the member pushed (listing.promoted / pushed /
             boosted), as a swipeable rail of product cards above the feed. -->
        <section class="pfx-promo" id="pfxPromo" hidden>
            <div class="pfx-promo-head"><span>Promoted</span><span class="pfx-promo-n" id="pfxPromoN"></span></div>
            <div class="feat-slider pfx-promo-rail" id="pfxPromoRail"></div>
        </section>

        <!-- FEED — just the products the buyer has uploaded. No categories or

        <div class="feed-empty" id="feedEmpty" style="display:none;">

        <!-- CATEGORIES — the item types this member lists; filters the grids too. -->
        <section class="pfx-sec pfx-cats" id="pfxCats" hidden>

            <div class="pfx-rail pfx-cats-rail" id="pfxCatsRail"></div>

        <div class="feed" id="feedMore"></div>

    <!-- SOCIALS popup — opened by the "Our Socials" button in the hero; lists the
         seller's networks to choose from. Links are built from STORE.socials. Placed
         before the main script so #socLinks exists when buildSocials runs. -->

        <div class="soc-modal" role="dialog" aria-modal="true" aria-label="Our socials">
            <div class="soc-head">
                <div class="soc-title">Our Socials</div>
                <button class="soc-x" id="socClose" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="soc-links" id="socLinks"></div>
        </div>
    </div>

    <script>
        // ===================== BUYER PROFILE DATA =====================
        // The buyer's own record. In the real build this comes from the user's
        // account + their uploaded listings. Stored as vero_buyer_config.
        const BUYER = {
            name: 'Your Name',
            tag: 'A short line about you.',
            followers: 0,
            following: 0,             // how many people this member follows
            hero: 'women-hero.jpg',   // hero background, set in My Profile
            avatar: '',               // profile picture, set in My Profile
            // Optional promo banner — only shown if the buyer turns one on. It is
            // dropped into the feed after every five items.
            banner: { enabled: false, image: 'men-hero.jpg', kicker: '', title: '' },
            socials: {},              // only the links the buyer filled in show
        };

        // Products the buyer uploaded. Empty by default — the page shows an empty
        // state until the buyer adds items in My Profile.
        let PRODUCTS = [];

        // ===================== BUYER CONFIG =====================
        // Everything the buyer set in My Profile overrides the defaults above.
        (function applyBuyerConfig() {
            let cfg; try { cfg = JSON.parse(localStorage.getItem('vero_buyer_config')); } catch (e) { cfg = null; }
            if (!cfg) return;
            if (cfg.name)   BUYER.name = cfg.name;
            if (cfg.tag)    BUYER.tag = cfg.tag;
            // The "About" typed in My Profile settings becomes the description
            // shown directly under the name (same behaviour as the store profile).
            try {
                const prof = JSON.parse(localStorage.getItem('vero_profile')) || {};
                if (prof.bio && prof.bio.trim()) BUYER.tag = prof.bio.trim();
            } catch (e) {}
            if (cfg.hero)   BUYER.hero = cfg.hero;
            if (cfg.avatar) BUYER.avatar = cfg.avatar;
            if (typeof cfg.followers === 'number') BUYER.followers = cfg.followers;
            if (typeof cfg.following === 'number') BUYER.following = cfg.following;
            if (cfg.socials) BUYER.socials = cfg.socials;
            if (cfg.banner)  BUYER.banner = Object.assign({}, BUYER.banner, cfg.banner);
            if (Array.isArray(cfg.products)) {
                PRODUCTS = cfg.products.map((p, i) => ({
                    id: i, name: p.name || 'Item',
                    icon: p.icon || '🛍️',
                    price: p.price != null ? p.price : 0,
                    rating: p.rating != null ? p.rating : '—',
                }));
            }
        })();

        // Surface the seller's uploaded items. The upload flow saves pieces to
        // vero_listings, but the store only read vero_buyer_config.products (which
        // nothing populates) — so the store looked empty after uploading. Pull the
        // active listings in so they show here too.
        (function includeUploadedListings() {
            let listings; try { listings = JSON.parse(localStorage.getItem('vero_listings')); } catch (e) { listings = null; }
            if (!Array.isArray(listings)) return;
            const active = listings.map((p, k) => p && Object.assign({}, p, { _lid: k }))
                                   .filter(p => p && (p.status === 'active' || p.status == null));
            if (!active.length) return;
            const mapped = active.map((p, i) => ({
                lid: p._lid,
                promoted: !!(p.promoted || p.pushed || p.boosted),
                gender: p.gender || p.audience || '',
                id: 'L' + i,
                name: p.name || p.title || 'Item',
                icon: p.icon || p.emoji || '🛍️',
                price: p.price != null ? p.price : 0,
                rating: p.rating != null ? p.rating : '—',
                cover: p.processed_cover || p.cover || (p.photos && (p.photos.cover || p.photos.detail)) || '',
                raw: p
            }));
            PRODUCTS = mapped.concat(PRODUCTS);
        })();

        // ===================== SYNC WITH MY PROFILE SETTINGS =====================
        // The public front mirrors exactly what was set on the profile-settings page
        // (profile.html buyer mode): identity + About + avatar live on vero_profile,
        // the hero background on vero_store_config.hero. These take precedence over
        // the older vero_buyer_config so the two views never drift apart.
        (function applyProfileSettings() {
            let prof = {}, store = {};

        function card(p) {

            const raw = p.raw || {};

            const disc = Number(raw.discount) || Number(raw.salePercent) || 0;
            const onSale = disc > 0 && disc < 100 && price > 0;
            const finalPrice = onSale ? Math.round(price * (1 - disc / 100)) : price;
            const priceHtml = onSale
                ? `<span class="vprice-wrap"><span class="vprice-off">-${disc}%</span><span class="vprice-was">${nis(price)}</span><span class="vprice vprice-sale">${nis(finalPrice)}</span></span>`
                : `<span class="vprice">${nis(price)}</span>`;

                .forEach(f => { if (raw[f] != null && raw[f] !== '' && typeof raw[f] !== 'object') data[f] = raw[f]; });

                .map(k => `<a href="${s[k]}" target="_blank" rel="noopener noreferrer">${ICON[k]||''}<span>${LABEL[k]||k}</span></a>`)
                .join('');

            // The same links, as a row of icons under the description.
            const row = document.getElementById('pfxSocials');
            if (row) {
                row.innerHTML = links.map(k => `<a class="pfx-soc" href="${String(s[k]).replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer" aria-label="${LABEL[k]||k}" title="${LABEL[k]||k}">${ICON[k]||''}</a>`).join('');
                row.hidden = !links.length;
            }
            // The "Our Socials" button opens the popup; the button hides itself if
            // the seller filled in no links at all.
            const btn = document.getElementById('socialsBtn');
            const overlay = document.getElementById('socOverlay');
            if (!links.length) { btn.style.display = 'none'; return; }
            const openPop  = () => overlay.classList.add('open');
            const closePop = () => overlay.classList.remove('open');
            btn.addEventListener('click', openPop);
            document.getElementById('socClose').addEventListener('click', closePop);
            overlay.addEventListener('click', e => { if (e.target === overlay) closePop(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
        })();

        // Sticky search popup — opens the search pill, filters the feed live.
        (function(){
            const fab = document.getElementById('searchFab');
            const pop = document.getElementById('searchPop');
            const inp = document.getElementById('storeSearch');
            const open  = () => { pop.classList.add('open'); fab.classList.add('hidden'); inp.focus(); };
            const close = () => {
                pop.classList.remove('open'); fab.classList.remove('hidden');
                inp.value = ''; searchTerm = ''; renderFeed();
            };
            fab.addEventListener('click', open);
            document.getElementById('searchClose').addEventListener('click', close);
            inp.addEventListener('input', function(){
                searchTerm = this.value.trim().toLowerCase(); renderFeed();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && pop.classList.contains('open')) close();
            });
        })();

        // Follow toggle (demo only).
        document.getElementById('followBtn').addEventListener('click', function(){
            const on = this.classList.toggle('following');
            this.textContent = on ? 'Following' : 'Follow';
            const f = document.getElementById('followers');
            f.textContent = (BUYER.followers + (on?1:0)).toLocaleString('en-US');
        });

        // Hero stats slider — rotate the visible stat every 8 seconds.
        (function(){
            const slides = document.querySelectorAll('#heroStats .hero-stat');
            if (slides.length < 2) return;
            let i = 0;
            setInterval(function(){
                slides[i].classList.remove('is-active');
                i = (i + 1) % slides.length;
                slides[i].classList.add('is-active');
            }, 8000);
        })();

    </script>

    <!-- Storefront events: the physical events this seller has a booth at
         (from vero_event_booths), with the pieces they'll bring. -->
    <script>
    (function storefrontEvents() {
        var host = document.getElementById('sfEvents'), listEl = document.getElementById('sfEvList');
        var titleEl = host && host.querySelector('.feed-title');
        if (!host || !listEl) return;
        var COLOR = { market: '#9a7d52', fair: '#2b6d9a', meetup: '#1f8f4e', popup: '#b23b3b' };
        var TYPEN = { market: 'Market', fair: 'Fair', meetup: 'Meetup', popup: 'Pop-up' };
        var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var map;
        try { map = JSON.parse(localStorage.getItem('vero_event_booths')); } catch (e) { map = null; }
        if (!map || typeof map !== 'object') return;
        var today = new Date(); today.setHours(0,0,0,0);
        var iso = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        var up = Object.keys(map).map(function (k) { return map[k]; })
                    .filter(function (e) { return e && e.date && e.date >= iso; })
                    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
                    .slice(0, 4);
        if (!up.length) return;
        if (titleEl) titleEl.textContent = 'Where to find us';
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
        listEl.innerHTML = up.map(function (e) {
            var p = e.date.split('-');
            var meta = '<span class="d" style="background:' + (COLOR[e.type] || '#888') + '"></span>' + esc(TYPEN[e.type] || e.type || '');
            if (e.place) meta += ' · ' + esc(e.place);
            var prods = (e.products && e.products.length) ? '<div class="sf-ev-prods">Bringing: ' + esc(e.products.slice(0, 4).join(' · ')) + '</div>' : '';
            return '<a class="sf-ev" href="events.html?date=' + esc(e.date) + '">' +
                '<div class="sf-ev-date"><div class="sf-ev-day">' + (+p[2]) + '</div><div class="sf-ev-mon">' + MON[+p[1]-1] + '</div></div>' +
                '<div><div class="sf-ev-title">' + esc(e.title) + '</div><div class="sf-ev-meta">' + meta + '</div>' + prods + '</div>' +
                '<div class="sf-ev-time">' + esc(e.time || '') + '</div>' +
            '</a>';
        }).join('');
        host.hidden = false;
    })();
    </script>

<script>
(function pfxEmbed() {
    if (!document.documentElement.classList.contains('pfx-embed')) return;
    // Links inside the preview open in the area page, not inside the little frame.
    document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (!a || a.getAttribute('href').charAt(0) === '#') return;
        e.preventDefault();
        try { window.parent.location.href = a.href; } catch (x) { location.href = a.href; }
    }, true);
    // Tell the parent how tall the preview is, so its frame fits exactly.
    function report() {
        var h = document.getElementById('hero');
        var px = h ? Math.ceil(h.getBoundingClientRect().height) : document.documentElement.scrollHeight;
        try { window.parent.postMessage({ type: 'pfx-embed-height', height: px }, '*'); } catch (x) {}
    }
    window.addEventListener('load', report);
    window.addEventListener('resize', report);
    if (window.ResizeObserver) { var h = document.getElementById('hero'); if (h) new ResizeObserver(report).observe(h); }
    setTimeout(report, 300); setTimeout(report, 1200);
})();
</script>
