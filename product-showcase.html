<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Product Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #F2F0EF;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        /* Whole page centred on the flat sand background. */
        .showcase {
            min-height: 100vh;
            display: grid;
            /* Data on the LEFT column, images on the RIGHT column. */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
            align-items: center;
            gap: 80px;
            max-width: 1240px;
            margin: 0 auto;
            padding: 60px 56px;
        }

        /* ==================== LEFT: the data ==================== */
        .info { max-width: 460px; }
        .info-price {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            margin-bottom: 18px;
        }

        /* Company name — the big heading. */
        .info-title {
            font-family: 'Cormorant Garamond', 'Playfair Display', serif;
            font-size: 58px;
            font-weight: 500;
            line-height: 1.02;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        /* Product type (jeans / shirt / …) — the sub-heading under the company. */
        .info-subtitle {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #8a857c;
            margin-bottom: 22px;
        }

        /* Seller + rating row. Name is a link to the seller's store. */
        .info-seller {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 22px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e0ddd6;
            font-size: 14px;
            color: #3a352e;
        }
        .info-seller .s-name {
            color: #1a1a1a;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .info-seller .s-name:hover { color: #c98a63; }
        .info-seller .s-rating { color: #c98a63; letter-spacing: 2px; font-size: 15px; }
        .info-seller .s-rating .num { color: #8a857c; letter-spacing: 0; font-size: 12px; margin-inline-start: 4px; }

        .info-desc {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.85;
            color: #3a352e;
            margin-bottom: 28px;
        }

        /* Specs — fabric / colour / size, label above value. */
        .info-specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            padding: 22px 0;
            margin-bottom: 30px;
            border-top: 1px solid #e0ddd6;
            border-bottom: 1px solid #e0ddd6;
        }
        .spec-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9a958c;
            margin-bottom: 8px;
        }
        .spec-value {
            font-size: 17px;
            font-weight: 400;
            color: #1a1a1a;
        }

        /* Buy bar */
        .btn-buy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 56px;
            background: #c98a63;
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 14px;
            transition: filter 0.2s, transform 0.2s;
        }
        .btn-buy:hover { filter: brightness(1.05); transform: translateY(-2px); }

        /* Save-for-later — outline button with a bookmark glyph. */
        .btn-save {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 56px;
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #cfcbc3;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .btn-save:hover { border-color: #1a1a1a; }
        .btn-save svg { width: 16px; height: 18px; stroke: currentColor; stroke-width: 1.6; fill: none; }
        .btn-save.active { border-color: #1a1a1a; background: #fff; }
        .btn-save.active svg { fill: #1a1a1a; }

        /* ==================== RIGHT: the 3 images ==================== */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .gallery-main {
            width: 100%;
            aspect-ratio: 4 / 4.6;
            background: #EDEBE9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-main img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-thumbs {
            display: flex;
            gap: 14px;
        }
        .gallery-thumb {
            width: 92px; height: 92px;
            background: #EDEBE9;
            border: 1px solid transparent;
            padding: 0;
            cursor: pointer;
            overflow: hidden;
            opacity: 0.82;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-thumb:hover { opacity: 1; }
        .gallery-thumb.active { opacity: 1; border-color: #c98a63; }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .showcase {
                grid-template-columns: 1fr;
                gap: 44px;
                padding: 40px 22px;
            }
            .gallery { order: -1; }
            .info { max-width: 100%; }
            .info-title { font-size: 46px; }
        }
    </style>
</head>
<body>
    <div class="showcase">
        <!-- LEFT column: the data -->
        <div class="info">
            <div class="info-price" id="price">₪120.00</div>
            <h1 class="info-title" id="title">שם החברה</h1>
            <div class="info-subtitle" id="subtitle">סוג מוצר</div>

            <div class="info-seller">
                <span>מוכר:</span>
                <a class="s-name" id="sellerName" href="#">VERO</a>
                <span class="s-rating" id="sellerRating"></span>
            </div>

            <p class="info-desc" id="desc">תיאור המוצר יופיע כאן.</p>

            <div class="info-specs">
                <div>
                    <span class="spec-label">בד</span>
                    <span class="spec-value" id="specFabric">—</span>
                </div>
                <div>
                    <span class="spec-label">צבע</span>
                    <span class="spec-value" id="specColor">—</span>
                </div>
                <div>
                    <span class="spec-label">מידה</span>
                    <span class="spec-value" id="specSize">—</span>
                </div>
            </div>

            <button class="btn-buy" onclick="addToCart()">
                <span>הוסף לעגלת קניות</span>
                <span id="buyPrice">— ₪120.00</span>
            </button>
            <button class="btn-save" onclick="toggleWishlist()" id="saveBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
                <span id="saveLabel">שמור לאחר כך</span>
            </button>
        </div>

        <!-- RIGHT column: 3 product images -->
        <div class="gallery">
            <div class="gallery-main" id="mainFrame">
                <img id="mainImg" src="" alt="">
            </div>
            <div class="gallery-thumbs" id="thumbs"></div>
        </div>
    </div>

    <script>
        // ---- Content (overridable via ?product= JSON, same shape as product.html) ----
        const params = new URLSearchParams(location.search);
        let product = { name: 'שם המוצר', price: 120, desc: '', seller: 'VERO' };
        try {
            const raw = params.get('product');
            if (raw) product = Object.assign(product, JSON.parse(decodeURIComponent(raw)));
        } catch (e) { console.error(e); }

        const seed = encodeURIComponent(product.name || 'vero');
        const images = product.images && product.images.length ? product.images : [
            `https://picsum.photos/seed/${seed}-1/900/1000`,
            `https://picsum.photos/seed/${seed}-2/900/1000`,
            `https://picsum.photos/seed/${seed}-3/900/1000`
        ];

        // Field mapping — matches what the seller fills on the upload page.
        //   company  → the brand/company heading (falls back to the seller/store name)
        //   type     → product type sub-heading (jeans, shirt…): productType|type|category
        const company     = product.company || product.brand || product.seller || 'VERO';
        const productType  = product.productType || product.category ||
                             (product.type === 'art' ? 'יצירת אמנות' : 'פריט');
        const sellerName   = product.seller || 'VERO';
        const rating       = Number(product.rating) || 4.5;
        const desc = product.desc || `${company} — ${productType}, זמין כעת בחנות.`;

        // ---- Render ----
        function fmt(p) { return '₪' + Number(p).toFixed(2); }
        document.getElementById('title').textContent = company;
        document.getElementById('subtitle').textContent = productType;
        document.getElementById('price').textContent = fmt(product.price);
        document.getElementById('desc').textContent = desc;
        document.getElementById('buyPrice').textContent = '— ' + fmt(product.price);

        // Seller row — name links to the seller's store, rating shown as stars.
        const sLink = document.getElementById('sellerName');
        sLink.textContent = sellerName;
        sLink.href = `index.html?seller=${encodeURIComponent(sellerName)}`;
        const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
        document.getElementById('sellerRating').innerHTML = `${stars} <span class="num">${rating.toFixed(1)}</span>`;

        // Specs — fabric / colour / size, from the seller's fields.
        document.getElementById('specFabric').textContent = product.fabric || product.material || (product.type === 'art' ? 'קנבס' : 'כותנה');
        document.getElementById('specColor').textContent  = product.color || 'רב-גוני';
        document.getElementById('specSize').textContent   = product.size || (product.type === 'art' ? '50×70 ס"מ' : 'M');

        // Gallery — main image + the 3 thumbnails.
        const mainImg = document.getElementById('mainImg');
        mainImg.src = images[0];
        mainImg.alt = company;
        const thumbs = document.getElementById('thumbs');
        thumbs.innerHTML = images.map((src, i) =>
            `<button class="gallery-thumb${i === 0 ? ' active' : ''}" onclick="showImg(${i})" aria-label="תמונה ${i + 1}">
                <img src="${src}" alt="" loading="lazy">
             </button>`).join('');
        function showImg(i) {
            mainImg.src = images[i];
            document.querySelectorAll('.gallery-thumb').forEach((t, idx) => t.classList.toggle('active', idx === i));
        }

        // Cart (syncs with vero_cart, same shape as the rest of the site)
        function addToCart() {
            const cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
            const id = `${product.name}|${product.price}`;
            const now = Date.now(), HOLD = 48 * 60 * 60 * 1000;
            const existing = cart.find(i => i.id === id);
            if (existing) { existing.qty += 1; existing.addedAt = now; existing.expiresAt = now + HOLD; }
            else cart.push({ id, name: product.name, price: product.price, seller: sellerName,
                             icon: product.icon, category: product.category, type: product.type,
                             rating: product.rating, qty: 1, addedAt: now, expiresAt: now + HOLD });
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            location.href = 'index.html?open=cart';
        }

        // Save for later → vero_wishlist (shared with the saved-products page)
        function toggleWishlist() {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            const id = `${product.name}|${product.price}`;
            const btn = document.getElementById('saveBtn');
            const label = document.getElementById('saveLabel');
            const idx = wl.findIndex(i => i.id === id);
            if (idx >= 0) { wl.splice(idx, 1); btn.classList.remove('active'); label.textContent = 'שמור לאחר כך'; }
            else {
                wl.push({ id, name: product.name, price: product.price, seller: sellerName,
                          icon: product.icon, category: product.category, type: product.type,
                          rating: product.rating, addedAt: Date.now() });
                btn.classList.add('active'); label.textContent = 'נשמר ✓';
            }
            localStorage.setItem('vero_wishlist', JSON.stringify(wl));
        }
        (function () {
            const wl = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            if (wl.some(i => i.id === `${product.name}|${product.price}`)) {
                document.getElementById('saveBtn').classList.add('active');
                document.getElementById('saveLabel').textContent = 'נשמר ✓';
            }
        })();
    </script>
</body>
</html>
