<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — סייל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        .wrap {
            max-width: none; margin: 0; padding: 0;
            /* Fade in — matches the wishlist. */
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft { from { opacity: 0; } to { opacity: 1; } }

        /* ===== HERO SECTION ===== */
        .sale-hero {
            position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
            background: #201d1a url('women-hero.jpg') center 30% / cover no-repeat;
            color: #fff; overflow: hidden;
        }
        /* Dark wash so the white text reads over any image. */
        .sale-hero::after {
            content: ''; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.12) 42%, rgba(0,0,0,0.78) 100%);
        }
        .sale-hero > * { position: relative; z-index: 2; }
        /* Top bar over the hero — icons in white. */
        .sale-hero .cart-topbar { padding: max(10px, env(safe-area-inset-top,0px)) clamp(16px,5vw,34px) 0; }
        .sale-hero .tb-ico { color: #fff; }
        .sale-hero .tb-ico svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4)); }

        .sh-inner {
            margin-top: auto; padding: 0 clamp(20px,5vw,40px) clamp(28px,5vw,44px);
            display: flex; flex-direction: column; align-items: flex-start; text-align: left;
        }
        .sh-eyebrow {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 9px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase;
            color: rgba(255,255,255,0.85); margin-bottom: 14px;
        }
        .sh-title { color: #fff !important; margin: 0; }
        .sh-title::first-letter { color: rgba(255,255,255,0.45); }
        .sh-desc {
            direction: rtl; text-align: right; margin-top: 16px;
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.9); max-width: 42em;
        }

        /* ===== STICKY NAV BAR with the discount slider ===== */
        .sale-navbar {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,0.94);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border-bottom: 1px solid #ececec;
            padding: 14px clamp(20px,5vw,40px) 16px;
        }
        .sale-navbar .disc-line { margin: 0; }
        .sale-navbar .disc-line-top { margin-bottom: 12px; }

        /* ===== BODY (cards) ===== */
        .page-body { padding: 30px clamp(20px,5vw,40px) 140px; }
        @media (max-width: 768px) {
            .page-body { padding-left: 14px; padding-right: 14px; }
        }

        /* ---- Clean top bar — identical language to the cart / wishlist ---- */
        .cart-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: max(8px, env(safe-area-inset-top,0px)) 4px 16px;
        }
        .cart-topbar .tb-right { display: flex; align-items: center; gap: 4px; }
        .tb-ico {
            width: 42px; height: 42px; flex: none; border: none; background: none;
            color: #16150f; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s; text-decoration: none;
        }
        .tb-ico:active { opacity: 0.5; }
        .tb-ico svg { width: 23px; height: 23px; stroke: currentColor; stroke-width: 1.6; fill: none; }

        /* Left-aligned header: kicker · title · subtitle, all flush left. */
        .head-row {
            display: flex; flex-direction: column; align-items: flex-end; text-align: left; gap: 8px;
        }
        /* Eyebrow — the hero's line + spaced uppercase label. */
        .head-kicker {
            display: inline-flex; align-items: center; gap: 12px; order: -1;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #EB2323;
        }
        .head-kicker::before { content: ''; width: 24px; height: 1px; background: currentColor; display: inline-block; }

        /* Title — the same face as the hero collection title: Bodoni Moda 500. */
        .head-title {
            font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
            font-size: clamp(28px, 6vw, 52px); font-weight: 500; line-height: 1.05;
            letter-spacing: 0.5px; text-transform: uppercase; direction: ltr;
        }
        .head-title::first-letter { color: #b8b8b8; }
        .head-sub { margin-top: 8px; font-size: 12.5px; color: #6b6b66; letter-spacing: 0.5px; text-align: left; max-width: 40em; }
        .head-desc {
            margin-top: 14px; direction: rtl; text-align: right;
            font-size: 13px; line-height: 1.7; color: #6b6b66; max-width: 46em;
        }

        /* Full-width clothing-type filter across the whole page. */
        .type-chips {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        }
        .type-chips button {
            flex: 0 0 auto; font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer; font-family: inherit;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 9px 18px; border-radius: 999px;
            transition: background 0.2s, color 0.2s, border-color 0.2s; white-space: nowrap;
        }
        .type-chips button:hover { border-color: #111; }
        .type-chips button.on { background: #111; color: #fff; border-color: #111; }

        /* Sort control (in the sheet). */
        .s-sort { display: flex; flex-direction: column; gap: 8px; }
        .s-sort button {
            font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: right;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 13px 16px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s, background 0.2s;
        }
        .s-sort button:hover { border-color: #111; }
        .s-sort button.on { border-color: #EB2323; background: #fff5f5; }
        .s-sort button .chk { color: #EB2323; font-weight: 700; opacity: 0; }
        .s-sort button.on .chk { opacity: 1; }

        /* Summary ticker — one stat at a time, fading (same as the cart / wishlist). */
        .cart-ticker {
            position: relative; width: 100%; height: 34px;
            border-bottom: 1px solid #16150f; margin: 30px 0 16px;
        }
        .cart-stat {
            position: absolute; left: 0; right: 0; top: 50%;
            transform: translateY(-50%) translateY(10px);
            opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
            display: flex; flex-direction: row-reverse; align-items: center;
            justify-content: space-between;
            pointer-events: none; white-space: nowrap;
        }
        .cart-stat.is-active { opacity: 1; transform: translateY(-50%); }
        .cart-stat .cs-num { font-size: 18px; font-weight: 300; letter-spacing: 2px; line-height: 1; color: #16150f; }
        .cart-stat .cs-lbl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: #a8a399; }

        /* The thin black line, reborn as a 0–100 discount slider. */
        .disc-line { margin: 30px 0 16px; }
        .disc-line-top {
            display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;
        }
        .disc-line .dl-lbl { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #9a9a95; font-weight: 700; }
        .disc-line .dl-val { font-size: 20px; font-weight: 300; color: #16150f; letter-spacing: 1px; }
        .disc-line input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 1px; margin: 0;
            background: #16150f; outline: none; cursor: pointer;
        }
        .disc-line input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #16150f; cursor: pointer; margin-top: 0;
        }
        .disc-line input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; border: none; border-radius: 50%; background: #16150f; cursor: pointer;
        }

        /* Product grid — the feed's grid, so feed-card.css / feed-card.js
           (both scoped to .prod-grid) style and drive the cards exactly as
           they do in the feed. */
        .prod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
        }
        @media (max-width: 768px) {
            .prod-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
        .cart-empty {
            margin-top: 52px; border: 1px solid #ecebe7; border-radius: 18px; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 10px 34px rgba(0,0,0,0.045);
            padding: 60px 40px; font-size: 12.5px; color: #9a9a95; text-align: center;
        }

        /* ---- Filters bottom-sheet — same as the cart / wishlist ---- */
        .cart-sheet-overlay {
            position: fixed; inset: 0; background: rgba(20,18,14,0.4);
            display: none; align-items: flex-end; justify-content: center; z-index: 300;
        }
        .cart-sheet-overlay.show { display: flex; }
        .cart-sheet {
            width: 100%; max-width: 560px; background: #fff; border-radius: 20px 20px 0 0;
            padding: 22px 24px calc(28px + env(safe-area-inset-bottom,0px));
            transform: translateY(100%); animation: cartSheetRise 0.34s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes cartSheetRise { to { transform: translateY(0); } }
        .cart-sheet .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #e6e1d8; margin: 0 auto 18px; }
        .cart-sheet h3 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; text-align: center; }

        /* Search + discount filter live inside the sheet. */
        .s-search { position: relative; margin-bottom: 22px; }
        .s-search input {
            width: 100%; height: 52px; border: 1.5px solid #111; background: transparent;
            padding: 0 18px 0 52px; font-size: 15px; color: #111; border-radius: 0; font-family: inherit;
        }
        .s-search input::placeholder { color: #9a9a95; }
        .s-search svg { position: absolute; top: 50%; left: 18px; transform: translateY(-50%); width: 20px; height: 20px; stroke: #111; fill: none; stroke-width: 1.8; }

        .s-filter-lbl { display: block; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #9a9a95; font-weight: 700; text-align: center; margin-bottom: 12px; }
        .s-disc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .s-disc button {
            font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer; font-family: inherit;
            border: 1px solid #dcdcd7; background: #fff; color: #111; padding: 9px 16px; border-radius: 999px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .s-disc button:hover { border-color: #111; }
        .s-disc button.on { background: #EB2323; color: #fff; border-color: #EB2323; }
    </style>
    <!-- The product card, shared by every page (single source: product-card.css). -->
    <link rel="stylesheet" href="product-card.css">
    <link rel="stylesheet" href="feed-card.css">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>

    <style id="nav-font-override">
      /* All navigation bars use the hero collection title font. */
      .cart-topbar:not(#zzzz):not(#zzzz):not(#zzzz), .cart-topbar *:not(#zzzz):not(#zzzz):not(#zzzz) { font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif !important; }
    </style>

    <style id="heading-font-override">
      /* All headings / titles use the hero collection title font. */
      h1:not(#zzzz):not(#zzzz):not(#zzzz), h2:not(#zzzz):not(#zzzz):not(#zzzz), h3:not(#zzzz):not(#zzzz):not(#zzzz), [class*="title"]:not(#zzzz):not(#zzzz):not(#zzzz), [class*="Title"]:not(#zzzz):not(#zzzz):not(#zzzz), [class*="heading"]:not(#zzzz):not(#zzzz):not(#zzzz), [class*="Heading"]:not(#zzzz):not(#zzzz):not(#zzzz) { font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- ===== HERO SECTION — image band with the texts over it ===== -->
        <section class="sale-hero">
            <!-- Top bar sits over the hero, icons in white. -->
            <div class="cart-topbar">
                <a class="back-btn tb-ico" href="index.html" aria-label="חזרה">
                    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </a>
                <div class="tb-right">
                    <button class="tb-ico" onclick="shareSale()" aria-label="שיתוף">
                        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                    </button>
                    <button class="tb-ico" onclick="openFilters()" aria-label="סינון">
                        <svg viewBox="0 0 24 24"><path d="M4 3h16l-8 9-8-9z"/><path d="M12 12v8"/><path d="M8 21h8"/></svg>
                    </button>
                </div>
            </div>

            <div class="sh-inner">
                <span class="sh-eyebrow">End of Season · moravchick</span>
                <h1 class="head-title sh-title">/The Best Sales</h1>
                <p class="sh-desc">מבחר הפריטים הכי שווים במחירי סוף עונה — הנחות של עד 70%
                    על ביגוד, אביזרים ונעליים מכל הקולקציות.</p>
            </div>
        </section>

        <!-- ===== NAV BAR — sticky, carries the discount slider ===== -->
        <nav class="sale-navbar">
            <div class="disc-line">
                <div class="disc-line-top">
                    <span class="dl-lbl">אחוז הנחה מבוקש</span>
                    <span class="dl-val" id="dlVal">הכל</span>
                </div>
                <input type="range" id="discRange" min="0" max="100" step="1" value="0" aria-label="אחוז הנחה מבוקש">
            </div>
        </nav>

        <!-- ===== BODY — all the cards ===== -->
        <div class="page-body">
            <p class="head-sub" id="headSub" hidden></p>
            <div id="cartBody"></div>
        </div>
    </div>

    <!-- Filters bottom-sheet — same as the cart / wishlist. -->
    <div class="cart-sheet-overlay" id="filterOverlay" onclick="if(event.target===this)closeFilters()">
        <div class="cart-sheet">
            <div class="sheet-grip"></div>
            <h3>סינון</h3>
            <div class="s-search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" id="q" placeholder="חיפוש — שם פריט, מותג או קטגוריה…" autocomplete="off">
            </div>
            <span class="s-filter-lbl">סנן לפי סוג פריט</span>
            <div class="type-chips" id="typeChips"></div>
            <span class="s-filter-lbl" style="margin-top:22px;">מיון לפי הנחה</span>
            <div class="s-sort" id="sortFilter">
                <button data-sort="desc" class="on">מההנחה הגבוהה לנמוכה <span class="chk">✓</span></button>
                <button data-sort="asc">מההנחה הנמוכה לגבוהה <span class="chk">✓</span></button>
            </div>
        </div>
    </div>

    <script>
        // Top-bar controls — filters sheet + share (same pattern as the wishlist).
        window.openFilters = function () { var o = document.getElementById('filterOverlay'); if (o) o.classList.add('show'); };
        window.closeFilters = function () { var o = document.getElementById('filterOverlay'); if (o) o.classList.remove('show'); };
        window.shareSale = function () {
            var url = location.href;
            if (navigator.share) { navigator.share({ title: 'moravchick', text: 'הסייל של moravchick', url: url }).catch(function(){}); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});
        };
    </script>

    <script src="product-overrides.js"></script>
    <script src="collections.js"></script>
    <script>
        (function () {
            var VC = window.veroCollections;
            var all = VC.onSale();               // already sorted deepest-cut first
            var cat = 'all', sortDir = 'desc', term = '', minPct = 0;

            var body = document.getElementById('cartBody');
            var sub = document.getElementById('headSub');
            var qEl = document.getElementById('q');
            var typeChips = document.getElementById('typeChips');
            var sortFilter = document.getElementById('sortFilter');
            var rangeEl = document.getElementById('discRange');
            var dlVal = document.getElementById('dlVal');

            // Hebrew labels for the English category keys coming from collections.js.
            var CAT_HE = {
                'Shirts': 'חולצות', 'Dresses': 'שמלות', 'Outerwear': 'מעילים',
                'Knitwear': 'סריגים', 'Accessories': 'אביזרים', 'Shoes': 'נעליים',
                'Sets': 'סטים', 'Tops': 'טופים', 'Bottoms': 'תחתונים', 'Bags': 'תיקים'
            };

            // Build the clothing-type chips from the categories actually on sale.
            var cats = [];
            all.forEach(function (p) { if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
            typeChips.innerHTML =
                '<button data-cat="all" class="on">הכל</button>' +
                cats.map(function (c) {
                    return '<button data-cat="' + c.replace(/"/g, '') + '">' + (CAT_HE[c] || c) + '</button>';
                }).join('');

            typeChips.addEventListener('click', function (e) {
                var b = e.target.closest('button[data-cat]');
                if (!b) return;
                cat = b.dataset.cat;
                typeChips.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
                render();
            });

            // Sort direction — highest → lowest discount, or the reverse.
            sortFilter.addEventListener('click', function (e) {
                var b = e.target.closest('button[data-sort]');
                if (!b) return;
                sortDir = b.dataset.sort;
                sortFilter.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
                render();
            });

            function matches(p) {
                if ((p._d.percent || 0) < minPct) return false;
                if (cat !== 'all' && p.category !== cat) return false;
                if (term) {
                    var hay = (p.name + ' ' + p.seller + ' ' + p.category).toLowerCase();
                    if (hay.indexOf(term) === -1) return false;
                }
                return true;
            }

            function render() {
                var items = all.filter(matches).slice().sort(function (a, b) {
                    return sortDir === 'asc'
                        ? a._d.percent - b._d.percent
                        : b._d.percent - a._d.percent;
                });

                if (!items.length) {
                    body.innerHTML = '<div class="cart-empty">לא נמצאו פריטים בהנחה של ' + minPct + '% ומעלה — נסו להוריד את הסליידר.</div>';
                    sub.textContent = 'אין פריטים בהנחה המבוקשת.';
                    return;
                }

                body.innerHTML =
                    '<div class="prod-grid">' + items.map(function (p) { return VC.cardHTML(p); }).join('') + '</div>';

                var count = items.length;
                sub.textContent = minPct === 0
                    ? count + ' פריטים במבצע.'
                    : count + ' פריטים בהנחה של ' + minPct + '% ומעלה.';
            }

            // The thin black line = a 0–100 discount slider driving the grid.
            if (rangeEl) rangeEl.addEventListener('input', function () {
                minPct = parseInt(rangeEl.value, 10) || 0;
                dlVal.textContent = minPct === 0 ? 'הכל' : minPct + '%+';
                render();
            });

            // Free-text search (inside the sheet).
            var t;
            qEl.addEventListener('input', function () {
                clearTimeout(t);
                t = setTimeout(function () { term = qEl.value.trim().toLowerCase(); render(); }, 120);
            });

            render();
        })();
    </script>
    <script src="footer.js"></script>
    <script src="assets/didone-hairline.js"></script>
    <script src="nav-icons.js" defer></script>
    <script src="feed-card.js" defer></script>
</body>
</html>
