<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>moravchick — Deal of the day options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root { --oak:#2A331B; --img:url('../assets/hero/art-section-poster.jpg'); --well:#f1e9dc; --wellstroke:#9a8f7e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins','Inter',sans-serif; background:#eceae6; color:#1c1c1c; padding:30px 20px 80px; }
    .page-head { max-width:1200px; margin:0 auto 6px; }
    .page-head h1 { font-family:'Bodoni Moda',Georgia,serif; font-weight:500; font-size:30px; }
    .page-head p { color:#6b6b66; font-size:14px; margin-top:8px; max-width:680px; line-height:1.6; }
    .grid { max-width:1300px; margin:28px auto 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:34px 26px; }
    .opt-label { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
    .opt-num { font-family:'Bodoni Moda',serif; font-size:17px; color:var(--oak); }
    .opt-name { font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
    .opt-desc { font-size:11.5px; color:#8a8a85; margin-top:3px; line-height:1.5; }

    .phone { position:relative; width:100%; aspect-ratio:390/748; border-radius:22px; overflow:hidden;
             background:#222 var(--img) center/cover no-repeat; color:#fff; box-shadow:0 14px 40px rgba(0,0,0,0.22); }
    .phone::after { content:''; position:absolute; inset:0; z-index:1;
        background:linear-gradient(160deg, rgba(42,51,27,0.42) 0%, rgba(20,26,14,0.3) 42%, rgba(10,12,6,0.86) 100%); }
    .phone > * { position:relative; z-index:2; }
    .mid { position:absolute; left:0; right:0; top:40%; transform:translateY(-50%); display:flex; flex-direction:column;
           align-items:center; text-align:center; gap:13px; padding:0 26px; }
    .eyebrow { font-size:8.5px; font-weight:300; letter-spacing:5px; text-transform:uppercase; color:rgba(255,255,255,0.88); }
    .title { font-family:'Bodoni Moda',serif; font-weight:500; font-size:52px; line-height:0.95; letter-spacing:1px; }
    .sub { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.86); }
    .slide { position:absolute; left:0; right:0; bottom:14px; z-index:3; text-align:center; font-size:8px; letter-spacing:5px;
        text-transform:uppercase; color:rgba(255,255,255,0.85); }
    .well { background:var(--well); display:grid; place-items:center; }
    .well svg { stroke:var(--wellstroke); fill:none; stroke-width:1.1; }

    .deal { position:absolute; z-index:3; }
    .kick { font-size:7.5px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.6); }
    .nm { font-family:'Bodoni Moda',serif; }
    .pr b { color:#fff; } .pr s { color:rgba(255,255,255,0.5); }

    /* 1 · horizontal card (current) */
    .d1 { left:20px; right:20px; bottom:42px; display:flex; align-items:center; gap:12px;
          background:rgba(16,19,10,0.8); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); padding:12px; }
    .d1 .well { width:56px; height:56px; flex:none; } .d1 .well svg { width:26px; height:26px; }
    .d1 .nm { font-size:16px; margin-top:3px; }
    .d1 .pr { margin-left:auto; text-align:right; } .d1 .pr b { font-size:15px; } .d1 .pr s { font-size:9px; display:block; }

    /* 2 · editorial line (no card) */
    .d2 { left:24px; right:24px; bottom:46px; display:flex; align-items:center; gap:12px; padding-top:14px;
          border-top:1px solid rgba(255,255,255,0.4); }
    .d2 .well { width:46px; height:46px; flex:none; } .d2 .well svg { width:22px; height:22px; }
    .d2 .nm { font-size:15px; } .d2 .pr { margin-left:auto; text-align:right; }
    .d2 .pr b { font-size:14px; } .d2 .pr s { font-size:9px; margin-left:5px; }

    /* 3 · big image, text overlaid */
    .d3 { left:20px; right:20px; bottom:42px; height:150px; overflow:hidden; }
    .d3 .well { position:absolute; inset:0; } .d3 .well svg { width:52px; height:52px; opacity:0.6; }
    .d3 .ov { position:absolute; inset:0; background:linear-gradient(to top, rgba(10,12,6,0.72), transparent 70%); }
    .d3 .tx { position:absolute; left:14px; right:14px; bottom:12px; display:flex; align-items:flex-end; justify-content:space-between; }
    .d3 .nm { font-size:18px; } .d3 .pr b { font-size:16px; } .d3 .pr s { font-size:9px; margin-left:5px; }

    /* 4 · centered, no card */
    .d4 { left:0; right:0; bottom:44px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; }
    .d4 .well { width:72px; height:72px; } .d4 .well svg { width:32px; height:32px; }
    .d4 .nm { font-size:17px; } .d4 .pr b { font-size:14px; } .d4 .pr s { font-size:9px; margin-left:5px; }

    /* 5 · price-forward */
    .d5 { left:20px; right:20px; bottom:44px; display:flex; align-items:center; gap:14px; }
    .d5 .well { width:62px; height:62px; flex:none; } .d5 .well svg { width:28px; height:28px; }
    .d5 .nm { font-size:14px; } .d5 .big { margin-left:auto; text-align:right; }
    .d5 .big b { font-family:'Bodoni Moda',serif; font-size:30px; line-height:1; display:block; }
    .d5 .big s { font-size:10px; color:rgba(255,255,255,0.5); }

    /* 6 · two deals */
    .d6 { left:16px; right:16px; bottom:44px; display:flex; gap:10px; }
    .d6 .cell { flex:1; background:rgba(16,19,10,0.78); padding:10px; }
    .d6 .well { width:100%; height:70px; } .d6 .well svg { width:30px; height:30px; }
    .d6 .nm { font-size:12px; margin-top:7px; } .d6 .pr { margin-top:2px; } .d6 .pr b { font-size:12px; } .d6 .pr s { font-size:8px; margin-left:4px; }
</style>
</head>
<body>
    <div class="page-head">
        <h1>Deal of the day — options</h1>
        <p>Six ways to feature a highlighted sale piece at the bottom of the sale panel (building on option 5). Tell me which you prefer.</p>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        var SH='<svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 4 4-3 2v10H7V9L4 7z"/></svg>';
        function base(deal){ return '<div class="mid"><span class="eyebrow">End of Season</span><span class="title">Sale</span>' +
            '<span class="sub">Up to 70% off everything</span></div>' + deal + '<div class="slide">Slide for more</div>'; }
        var DEALS = [
          ['01','Horizontal card','Thumb, label + name, price — on a dark card.',
            '<div class="deal d1"><div class="well">'+SH+'</div><div><span class="kick">Deal of the day</span><div class="nm">Wool Overcoat</div></div><div class="pr"><b>₪390</b><s>₪980</s></div></div>'],
          ['02','Editorial line','No card — just a hairline above, airy.',
            '<div class="deal d2"><div class="well">'+SH+'</div><div><span class="kick">Deal of the day</span><div class="nm">Wool Overcoat</div></div><div class="pr"><b>₪390</b><s>₪980</s></div></div>'],
          ['03','Big image','A large product image with text overlaid.',
            '<div class="deal d3"><div class="well">'+SH+'</div><div class="ov"></div><div class="tx"><div><span class="kick">Deal of the day</span><div class="nm">Wool Overcoat</div></div><div class="pr"><b>₪390</b><s>₪980</s></div></div></div>'],
          ['04','Centered','Thumb centered, name + price beneath.',
            '<div class="deal d4"><div class="well">'+SH+'</div><span class="kick">Deal of the day</span><div class="nm">Wool Overcoat</div><div class="pr"><b>₪390</b><s>₪980</s></div></div>'],
          ['05','Price-forward','The discounted price is oversized.',
            '<div class="deal d5"><div class="well">'+SH+'</div><div><span class="kick">Deal of the day</span><div class="nm">Wool Overcoat</div></div><div class="big"><b>₪390</b><s>was ₪980</s></div></div>'],
          ['06','Two deals','Two featured pieces side by side.',
            '<div class="deal d6"><div class="cell"><div class="well">'+SH+'</div><div class="nm">Wool Overcoat</div><div class="pr"><b>₪390</b><s>₪980</s></div></div>' +
            '<div class="cell"><div class="well">'+SH+'</div><div class="nm">Leather Boots</div><div class="pr"><b>₪260</b><s>₪520</s></div></div></div>']
        ];
        document.getElementById('grid').innerHTML = DEALS.map(function(o){
            return '<div class="opt"><div class="opt-label"><span class="opt-num">'+o[0]+'</span>' +
              '<span><span class="opt-name">'+o[1]+'</span><div class="opt-desc">'+o[2]+'</div></span></div>' +
              '<div class="phone">'+base(o[3])+'</div></div>';
        }).join('');
    </script>
</body>
</html>
