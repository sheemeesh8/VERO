<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Edit Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --line: #e4e1dc; --edit: #2f6bff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
h2 { font-size: 15px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: #55514a; margin: 40px 0 20px; direction: rtl; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 10px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 560px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 728px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.25); }
.cap { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* Top edit bar */
.ebar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 64px; padding: 26px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
.ebar.light { color: #fff; }
.ebar.solid { background: #fff; border-bottom: 1px solid var(--line); }
.ebar .done { background: #111; color: #fff; padding: 7px 16px; border-radius: 999px; font-size: 10px; }
.ebar.light .done { background: #fff; color: #111; }

/* ===== Mini storefront ===== */
.store { position: absolute; inset: 0; overflow: hidden; background: #fff; }
.store .grid-p { display: grid; gap: 4px; padding: 4px; }
.store .grid-p .th { aspect-ratio: 3/4; }
.store .sec-h { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); padding: 16px 16px 8px; display: flex; justify-content: space-between; }
.av { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #fff; display: block; }
.fol { border: 1px solid currentColor; border-radius: 999px; padding: 7px 18px; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; display: inline-block; }
.stats { display: flex; gap: 0; }
.stats div { flex: 1; padding: 0 12px; border-left: 1px solid rgba(255,255,255,0.25); }
.stats div:first-child { border-left: none; padding-left: 0; }
.stats b { display: block; font-size: 15px; } .stats small { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.75; }
.stats.dark div { border-color: var(--line); }

/* hero: full */
.h-full { position: relative; height: 430px; color: #fff; }
.h-full > .th { position: absolute; inset: 0; }
.pad .store { top: 64px; }
.h-full::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75)); }
.h-full .in { position: absolute; left: 22px; right: 22px; bottom: 22px; z-index: 1; }
.h-full .nm { font-size: 32px; font-weight: 400; }
.h-full .bio { font-size: 11px; opacity: 0.85; margin: 4px 0 14px; }
.h-full .row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.3); margin-bottom: 12px; }
/* hero: split */
.h-split { display: grid; grid-template-columns: 1fr 1fr; height: 260px; }
.h-split .th { height: 100%; }
.n-center { text-align: center; padding: 18px 20px 6px; }
.n-center .av { margin: -46px auto 8px; position: relative; }
.n-center .nm { font-size: 24px; }
.n-center .bio { font-size: 11px; color: var(--muted); margin: 3px 0 12px; }
/* hero: banner */
.h-banner { height: 150px; position: relative; } .h-banner .th { height: 100%; }
.n-left { padding: 0 20px 6px; display: flex; align-items: flex-end; gap: 14px; margin-top: -26px; position: relative; }
.n-left .nm { font-size: 20px; } .n-left .bio { font-size: 11px; color: var(--muted); }
.n-left .fol { margin-left: auto; margin-bottom: 4px; }
/* hero: editorial text */
.h-text { padding: 80px 22px 18px; }
.h-text .nm { font-size: 40px; line-height: 1; letter-spacing: -0.5px; }
.h-text .bio { font-size: 12px; color: var(--muted); margin: 10px 0 14px; max-width: 80%; }

/* ===== Edit-mode affordances ===== */
.ol { outline: 1.5px dashed var(--edit); outline-offset: -3px; position: relative; }
.ol.sel { outline-style: solid; outline-width: 2px; }
.tag { position: absolute; z-index: 3; background: var(--edit); color: #fff; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 9px; border-radius: 4px; display: inline-flex; gap: 8px; align-items: center; }
.tag .sw { opacity: 0.8; }
.hdl { position: absolute; z-index: 3; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #111; }

/* LA tray */
.tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 26px rgba(0,0,0,0.14); padding: 14px 0 22px; }
.tray .tabs { display: flex; gap: 22px; padding: 0 20px 12px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.tray .tabs b { color: #111; font-weight: 400; border-bottom: 1.5px solid #111; padding-bottom: 4px; }
.tray .strip { display: flex; gap: 12px; padding: 0 20px; overflow: hidden; }
.mini { width: 78px; flex: none; text-align: center; }
.mini .box { height: 110px; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 3px; background: #fff; }
.mini.on .box { border-color: #111; box-shadow: 0 0 0 1px #111; }
.mini .box i { display: block; background: #e3e0da; border-radius: 2px; }
.mini .box .g { display: grid; gap: 2px; }
.mini .box .g i { aspect-ratio: 3/4; }
.mini span { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; display: block; }

/* LB pager */
.pager { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 18px 22px 26px; background: #fff; text-align: center; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 24px rgba(0,0,0,0.08); }
.pager .nmL { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; }
.pager .ds { font-size: 11px; color: var(--muted); margin-top: 3px; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 12px 0 14px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #d6d2cb; } .dots i.on { background: #111; width: 18px; border-radius: 6px; }
.arrow { position: absolute; top: 300px; z-index: 6; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.92); box-shadow: 0 4px 14px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.cta { display: block; text-align: center; background: #111; color: #fff; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; padding: 15px; border-radius: 999px; }
.cta.ghost { background: none; color: #111; border: 1px solid #111; }
.scaled { transform: scale(0.84); transform-origin: 50% 0; border-radius: 22px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,0.18); position: absolute; left: 0; right: 0; top: 70px; height: 728px; }

/* LD block list */
.blist { position: absolute; left: 0; right: 0; bottom: 0; top: 300px; background: #fff; z-index: 6; border-top: 1px solid var(--line); padding: 8px 20px 20px; }
.blk { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.blk .grip { color: #b9b4ab; font-size: 14px; letter-spacing: -2px; width: 14px; }
.blk .bn { flex: 1; } .blk .bn b { font-weight: 400; font-size: 14px; display: block; } .blk .bn small { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.blk .eye { font-size: 12px; color: #111; }
.blk.off { opacity: 0.4; }
.blk.drag { background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,0.15); margin: 0 -10px; padding: 13px 10px; border-radius: 10px; border: none; transform: rotate(-1deg); }
.addb { border: 1px dashed #cfcbc4; text-align: center; padding: 12px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-top: 14px; border-radius: 10px; color: #55514a; }
.peek { position: absolute; top: 64px; left: 0; right: 0; height: 236px; overflow: hidden; background: #f4f2ee; }
.peek .scaledP { transform: scale(0.5); transform-origin: 50% 0; position: absolute; left: 0; right: 0; top: 12px; height: 728px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,0.16); }

/* LE compare */
.half { position: absolute; top: 0; bottom: 0; overflow: hidden; }
.divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; z-index: 6; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }
.divider b { position: absolute; top: 330px; left: -17px; width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; font-weight: 400; font-size: 13px; }
.lbl { position: absolute; top: 74px; z-index: 6; background: rgba(0,0,0,0.6); color: #fff; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
.foot2 { position: absolute; left: 20px; right: 20px; bottom: 24px; z-index: 6; display: flex; gap: 10px; }
.foot2 .cta { flex: 1; }

/* LF section sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.3); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-radius: 22px 22px 0 0; padding: 12px 22px 24px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: #d6d2cb; margin: 0 auto 14px; }
.sheet .t { display: flex; justify-content: space-between; align-items: baseline; }
.sheet .t b { font-weight: 400; font-size: 17px; letter-spacing: 3px; text-transform: uppercase; }
.sgrp { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sgrp:last-of-type { border: none; }
.sgrp .cap { display: block; margin-bottom: 10px; }
.seg { display: flex; border: 1px solid #111; border-radius: 999px; overflow: hidden; }
.seg span { flex: 1; text-align: center; padding: 9px 0; font-size: 11px; letter-spacing: 1px; }
.seg span.on { background: #111; color: #fff; }
.vrow { display: flex; gap: 10px; }
.vopt { flex: 1; text-align: center; }
.vopt .box { height: 64px; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px; display: grid; gap: 3px; }
.vopt.on .box { border-color: #111; box-shadow: 0 0 0 1px #111; }
.vopt .box i { background: #e3e0da; border-radius: 2px; }
.vopt span { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-top: 6px; }
</style>
</head>
<body>
<h1>Store — מצב עריכה (Layouts)</h1>
<p class="sub">איך המוכר מחליף את מבנה החנות · 6 אופציות, כולן מציגות את החנות האמיתית בזמן העריכה</p>

<h2>— החלפת layout שלם —</h2>
<div class="grid" id="whole"></div>

<h2>— עריכה לפי אזורים (sections) —</h2>
<div class="grid" id="parts"></div>

<script>
var IM = [
  { img: '../hero-beach.jpg', pos: '30% 40%' }, { img: '../men-hero.jpg', pos: '50% 30%' },
  { img: '../clothing-hero.jpg', pos: '50% 60%' }, { img: '../women-hero.jpg', pos: '20% 40%' },
  { img: '../gallery-hero.jpg', pos: '50% 50%' }, { img: '../magazine-hero.jpg', pos: '50% 50%' },
  { img: '../art-hero.jpg', pos: '50% 50%' }, { img: '../hero-beach.jpg', pos: '80% 50%' }
];
var bg = (o) => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var AV = IM[0];

// Mini storefront with a hero variant + grid columns. `wrap(name, html)` lets an
// option outline each section in edit mode.
function store(o, wrap) {
  wrap = wrap || ((k, h) => h);
  var hero, cols = o.cols || 3;
  var stats = (dark) => '<div class="stats' + (dark ? ' dark' : '') + '"><div><b>128</b><small>Followers</small></div><div><b>42</b><small>Items</small></div><div><b>16</b><small>Following</small></div></div>';
  if (o.hero === 'full') hero = wrap('hero', '<div class="h-full"><span class="th" ' + bg(IM[0]) + '></span><div class="in"><div class="nm">Studio Vero</div><div class="bio">Slow fashion, sourced in Tel Aviv.</div><div class="row"><span class="av th" ' + bg(IM[3]) + '></span><span class="fol">Follow</span></div>' + stats() + '</div></div>');
  if (o.hero === 'split') hero = wrap('hero', '<div class="h-split"><span class="th" ' + bg(IM[0]) + '></span><span class="th" ' + bg(IM[1]) + '></span></div>') +
    wrap('name', '<div class="n-center"><span class="av th" ' + bg(IM[3]) + '></span><div class="nm">Studio Vero</div><div class="bio">Slow fashion, sourced in Tel Aviv.</div><span class="fol">Follow</span></div>');
  if (o.hero === 'banner') hero = wrap('hero', '<div class="h-banner"><span class="th" ' + bg(IM[0]) + '></span></div>') +
    wrap('name', '<div class="n-left"><span class="av th" ' + bg(IM[3]) + '></span><div><div class="nm">Studio Vero</div><div class="bio">128 followers · 42 items</div></div><span class="fol">Follow</span></div>');
  if (o.hero === 'text') hero = wrap('hero', '<div class="h-text"><div class="nm">Studio<br>Vero</div><div class="bio">Slow fashion, sourced in Tel Aviv.</div><span class="fol">Follow</span></div>');
  var items = wrap('grid', '<div class="sec-h"><span>Items for sale</span><span>42</span></div><div class="grid-p" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
    IM.concat(IM).slice(1, 1 + cols * 3).map(i => '<span class="th" ' + bg(i) + '></span>').join('') + '</div>');
  return '<div class="store">' + hero + items + '</div>';
}

// Tiny wireframe thumbnails of each layout.
function wf(kind, cols) {
  var g = n => '<span class="g" style="grid-template-columns:repeat(' + n + ',1fr)">' + '<i></i>'.repeat(n * 2) + '</span>';
  if (kind === 'full')   return '<i style="flex:1.6"></i>' + g(cols);
  if (kind === 'split')  return '<span class="g" style="grid-template-columns:1fr 1fr;flex:1"><i style="aspect-ratio:auto"></i><i style="aspect-ratio:auto"></i></span><i style="height:5px;width:50%;margin:0 auto"></i>' + g(cols);
  if (kind === 'banner') return '<i style="height:22px"></i><i style="height:5px;width:45%"></i>' + g(cols);
  if (kind === 'text')   return '<i style="height:12px;width:70%;margin-top:8px"></i><i style="height:5px;width:40%"></i>' + g(cols);
}
var LAYS = [['full', 3, 'Cover'], ['split', 3, 'Editorial'], ['banner', 2, 'Boutique'], ['text', 4, 'Gallery'], ['full', 2, 'Story']];
var ebar = (light, left, right) => '<div class="ebar ' + (light ? 'light' : 'solid') + '"><span>' + (left || 'Cancel') + '</span><span>' + (right || 'Edit layout') + '</span><span class="done">Save</span></div>';

var WHOLE = [
  ['LA · מגש layouts מלמטה', 'החנות מוצגת במלואה, ומגש תחתון עם תמונות-מבנה של כל ה-layouts. לחיצה מחליפה מיד. לשוניות Layout / Colors / Fonts באותו מגש.',
   '<div class="screen pad">' + store({ hero: 'split', cols: 3 }) + ebar(false) +
   '<div class="tray"><div class="tabs"><b>Layout</b><span>Colors</span><span>Fonts</span></div><div class="strip">' +
   LAYS.map((l, k) => '<div class="mini' + (k === 1 ? ' on' : '') + '"><div class="box">' + wf(l[0], l[1]) + '</div><span>' + l[2] + '</span></div>').join('') + '</div></div></div>'],

  ['LB · החלקה בין layouts', 'החנות מוקטנת כמו כרטיס, ומחליקים ימינה ושמאלה בין ה-layouts. שם ה-layout ונקודות מתחת, וכפתור "Use this layout".',
   '<div class="screen" style="background:#f4f2ee">' + ebar(false, 'Cancel', '2 / 5') +
   '<div class="scaled">' + store({ hero: 'banner', cols: 2 }) + '</div>' +
   '<span class="arrow" style="left:10px">‹</span><span class="arrow" style="right:10px">›</span>' +
   '<div class="pager"><div class="nmL">Boutique</div><div class="ds">Banner · name on the left · 2-up grid</div><div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i></div><span class="cta">Use this layout</span></div></div>'],

  ['LE · לפני / אחרי', 'פס מחיצה שגוררים: משמאל ה-layout הנוכחי ומימין החדש. מרגיע לפני שמירה — רואים בדיוק מה ישתנה.',
   '<div class="screen">' +
   '<div class="half" style="left:0;width:195px"><div style="width:390px;height:728px;position:relative">' + store({ hero: 'full', cols: 3 }) + '</div></div>' +
   '<div class="half" style="left:195px;right:0"><div style="width:390px;height:728px;position:relative;margin-left:-195px">' + store({ hero: 'split', cols: 3 }) + '</div></div>' +
   '<div class="divider"><b>⇆</b></div><span class="lbl" style="left:16px">Now · Cover</span><span class="lbl" style="right:16px">New · Editorial</span>' +
   ebar(true, 'Back', 'Compare') +
   '<div class="foot2"><span class="cta ghost" style="background:#fff">Keep current</span><span class="cta">Switch</span></div></div>']
];

var PARTS = [
  ['LC · עריכה על החנות עצמה', 'כל אזור בחנות מסומן במסגרת מקווקוות עם תווית. חיצים ‹ › על התווית מחליפים את הווריאציה של אותו אזור, בלי לצאת מהדף.',
   '<div class="screen pad">' + store({ hero: 'split', cols: 3 }, (k, h) => {
     var lab = { hero: 'Cover · Split', name: 'Name · Center', grid: 'Grid · 3 columns' }[k];
     return '<div class="ol' + (k === 'name' ? ' sel' : '') + '"><span class="tag" style="left:10px;top:' + (k === 'grid' ? 10 : 10) + 'px"><span class="sw">‹</span>' + lab + '<span class="sw">›</span></span>' + (k === 'name' ? '<span class="hdl" style="top:10px">⋮</span>' : '') + h + '</div>';
   }) + ebar(false, 'Cancel', 'Editing') + '</div>'],

  ['LD · רשימת בלוקים', 'למעלה תצוגה מוקטנת חיה, מתחת רשימת האזורים: גוררים לשינוי סדר, עין להסתרה, ו"Add section" להוספה (About, Reviews, Collections…).',
   '<div class="screen">' + ebar(false, 'Cancel', 'Sections') +
   '<div class="peek"><div class="scaledP">' + store({ hero: 'banner', cols: 3 }) + '</div></div>' +
   '<div class="blist">' +
   '<div class="blk"><span class="grip">⋮⋮</span><div class="bn"><b>Cover</b><small>Banner</small></div><span class="eye">◉</span></div>' +
   '<div class="blk drag"><span class="grip">⋮⋮</span><div class="bn"><b>Name & follow</b><small>Left aligned</small></div><span class="eye">◉</span></div>' +
   '<div class="blk"><span class="grip">⋮⋮</span><div class="bn"><b>Items for sale</b><small>Grid · 3 columns</small></div><span class="eye">◉</span></div>' +
   '<div class="blk off"><span class="grip">⋮⋮</span><div class="bn"><b>Stats</b><small>Hidden</small></div><span class="eye">○</span></div>' +
   '<div class="blk"><span class="grip">⋮⋮</span><div class="bn"><b>Reviews</b><small>Carousel</small></div><span class="eye">◉</span></div>' +
   '<div class="addb">+ Add section</div></div></div>'],

  ['LF · גיליון לאזור שנבחר', 'לוחצים על אזור בחנות (כאן: הגריד) ונפתח גיליון עם האפשרויות שלו בלבד — מספר עמודות, סגנון, מרווחים. התצוגה מתעדכנת מאחור.',
   '<div class="screen">' + store({ hero: 'full', cols: 2 }, (k, h) => k === 'grid' ? '<div class="ol sel">' + h + '</div>' : h) + ebar(true, 'Cancel', 'Edit') +
   '<div class="sheet"><div class="grab"></div><div class="t"><b>Items grid</b><span class="cap">Reset</span></div>' +
   '<div class="sgrp"><span class="cap">Columns</span><div class="seg"><span>1</span><span class="on">2</span><span>3</span><span>4</span></div></div>' +
   '<div class="sgrp"><span class="cap">Style</span><div class="vrow">' +
   '<div class="vopt on"><div class="box" style="grid-template-columns:1fr 1fr"><i></i><i></i><i></i><i></i></div><span>Grid</span></div>' +
   '<div class="vopt"><div class="box" style="grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr 2fr"><i style="grid-row:span 2"></i><i></i><i style="grid-row:span 2"></i><i></i></div><span>Masonry</span></div>' +
   '<div class="vopt"><div class="box" style="grid-template-columns:1fr"><i></i><i></i></div><span>List</span></div>' +
   '<div class="vopt"><div class="box" style="grid-template-columns:2fr 1fr 1fr"><i></i><i></i><i></i></div><span>Row</span></div></div></div>' +
   '<span class="cta" style="margin-top:6px">Done</span></div></div>']
];

var render = (host, arr) => document.getElementById(host).innerHTML = arr.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
render('whole', WHOLE);
render('parts', PARTS);
</script>
</body>
