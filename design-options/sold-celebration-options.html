<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sold Celebration Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #16150f; --muted: #8f8d86; --line: #e6e4de; --paper: #f7f6f2; --gold: #d9a441; --ok: #1f8f4e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 18px; direction: rtl; }
.replay { display: block; margin: 0 auto 30px; font-family: inherit; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); background: none; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1320px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ph1 { background: url('../women-hero.jpg') center 25% / cover; }

/* shared bits */
.serif { font-family: 'Bodoni Moda', serif; }
.k { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.ttl { font-family: 'Bodoni Moda', serif; font-size: 46px; line-height: 1.05; }
.ttl i { font-style: italic; }
.amt { font-size: 15px; color: var(--muted); margin-top: 10px; }
.amt b { color: var(--ink); font-weight: 500; }
.cta { position: absolute; left: 28px; right: 28px; bottom: 40px; display: flex; flex-direction: column; gap: 10px; }
.cta span { padding: 16px 0; border-radius: 999px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); }
.cta span.d { background: var(--ink); color: #fff; }
.up { opacity: 0; animation: up 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.d1 { animation-delay: 0.5s; } .d2 { animation-delay: 0.8s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.5s; }

/* S1 confetti */
.conf { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.conf i { position: absolute; top: -20px; width: 9px; height: 14px; opacity: 0; animation: fall 2.6s ease-in forwards; }
@keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 1; transform: translateY(900px) rotate(720deg); } }
.burst i { top: 50%; left: 50%; width: 8px; height: 12px; animation: burst 1.6s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(-50%,-50%) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(540deg); } }

/* S2 check draw */
.chk { width: 130px; height: 130px; margin-bottom: 30px; }
.chk circle { fill: none; stroke: var(--ok); stroke-width: 3; stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 0.8s ease forwards; transform-origin: center; }
.chk path { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw 0.45s 0.7s ease forwards; }
.chk .fill { fill: rgba(31,143,78,0.08); stroke: none; transform: scale(0); animation: pop 0.5s 0.6s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { to { transform: scale(1); } }

/* S3 stamp */
.s3 { justify-content: flex-start; }
.s3 .photo { width: 100%; height: 520px; position: relative; }
.stamp { position: absolute; left: 50%; top: 50%; font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 50px; letter-spacing: 6px; color: #c23a2e; border: 4px solid #c23a2e; padding: 4px 20px; white-space: nowrap; border-radius: 8px; background: rgba(255,255,255,0.15);
  transform: translate(-50%,-50%) rotate(-14deg) scale(3); opacity: 0; animation: stamp 0.45s 0.4s cubic-bezier(.5,0,.75,0) forwards; mix-blend-mode: multiply; }
@keyframes stamp { 70% { opacity: 1; transform: translate(-50%,-50%) rotate(-14deg) scale(0.92); } 100% { opacity: 1; transform: translate(-50%,-50%) rotate(-14deg) scale(1); } }
.shake { animation: shake 0.35s 0.82s ease; }
@keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
.s3 .below { padding: 30px 28px 0; }

/* S4 counter */
.s4 { background: var(--paper); }
.big { font-family: 'Bodoni Moda', serif; font-size: 84px; line-height: 1; }
.coin { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe7a6, var(--gold) 55%, #9c7220); color: #6b4c12; font-size: 15px; display: grid; place-items: center; box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  bottom: -40px; opacity: 0; animation: rise 2.2s ease-out forwards; }
@keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-640px) scale(1); } }
.bal { margin-top: 26px; background: #fff; border-radius: 16px; padding: 16px 22px; display: flex; gap: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
.bal div { text-align: left; } .bal b { display: block; font-size: 18px; font-weight: 400; } .bal small { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

/* S5 peacock */
.s5 { background: #0f1412; color: #f2efe8; }
.s5 .k { color: rgba(242,239,232,0.6); }
.pea { width: 170px; height: 170px; position: relative; margin-bottom: 28px; }
.pea img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); opacity: 0; transform: scale(0.4) rotate(-20deg); animation: fan 1.1s 0.2s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes fan { to { opacity: 1; transform: none; } }
.pea::before, .pea::after { content: ''; position: absolute; inset: -20px; border-radius: 50%; border: 1px solid rgba(217,164,65,0.6); opacity: 0; animation: ring 2s 0.5s ease-out forwards; }
.pea::after { animation-delay: 0.9s; }
@keyframes ring { 0% { opacity: 1; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.8); } }
.s5 .cta span { border-color: rgba(242,239,232,0.5); } .s5 .cta span.d { background: var(--gold); color: #111; border-color: var(--gold); }
.spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0; animation: tw 1.6s ease-in-out forwards; }
@keyframes tw { 0%,100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1.4); } }

/* S6 tag swing */
.tagw { position: relative; height: 230px; width: 200px; margin-bottom: 18px; }
.nail { position: absolute; left: 50%; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink); }
.string { position: absolute; left: 50%; top: 5px; width: 1px; height: 60px; background: var(--ink); transform-origin: top; }
.tag { position: absolute; left: 50%; top: 60px; width: 150px; margin-left: -75px; height: 150px; transform-origin: 50% -55px; animation: swing 1.8s 0.2s ease-out forwards; }
.tag .card { position: absolute; inset: 0; background: var(--ink); color: #fff; clip-path: polygon(50% 0, 100% 22%, 100% 100%, 0 100%, 0 22%); display: grid; place-items: center; padding-top: 30px; }
.tag .card::before { content: ''; position: absolute; left: 50%; top: 14px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; }
.tag .card b { font-family: 'Bodoni Moda', serif; font-size: 34px; font-weight: 400; letter-spacing: 3px; }
.tag .flip { position: absolute; inset: 0; animation: flip 0.7s 0.2s ease forwards; backface-visibility: hidden; }
@keyframes swing { 0% { transform: rotate(28deg); } 30% { transform: rotate(-18deg); } 55% { transform: rotate(10deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0); } }

/* S7 fireworks */
.s7 { background: radial-gradient(circle at 50% 30%, #1d2340, #07080f 70%); color: #fff; }
.s7 .k { color: rgba(255,255,255,0.6); }
.fw { position: absolute; width: 0; height: 0; }
.fw i { position: absolute; left: 0; top: 0; width: 4px; height: 4px; border-radius: 50%; opacity: 0; animation: fw 1.4s ease-out forwards; box-shadow: 0 0 6px currentColor; background: currentColor; }
@keyframes fw { 0% { opacity: 1; transform: rotate(var(--r)) translateX(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateX(90px) translateY(20px); } }
.s7 .cta span { border-color: rgba(255,255,255,0.5); } .s7 .cta span.d { background: #fff; color: #07080f; }

/* S8 package */
.s8 { background: var(--paper); }
.box { width: 170px; height: 130px; position: relative; margin-bottom: 40px; animation: boxgo 2.4s 0.2s ease-in-out forwards; }
.box .bd { position: absolute; inset: 0; background: #c99a63; border-radius: 6px; }
.box .bd::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 22px; margin-left: -11px; background: #e9d3a8; }
.box .lid { position: absolute; left: -6px; right: -6px; top: -14px; height: 22px; background: #b88751; border-radius: 4px; transform-origin: left bottom; transform: rotate(-110deg); animation: lid 0.5s 0.6s ease forwards; }
.box .item { position: absolute; left: 50%; top: -90px; width: 70px; height: 86px; margin-left: -35px; border-radius: 6px; animation: drop 0.55s 0.1s ease-in forwards; }
@keyframes drop { to { transform: translateY(110px) scale(0.8); opacity: 0; } }
@keyframes lid { to { transform: rotate(0); } }
@keyframes boxgo { 0%, 45% { transform: none; } 60% { transform: translateX(-12px); } 100% { transform: translateX(0); } }
.road { width: 220px; height: 1px; background: var(--line); margin-top: -30px; margin-bottom: 30px; }
.steps { display: flex; gap: 10px; margin-top: 22px; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.steps span.on { color: var(--ink); }
.steps span + span::before { content: '— '; color: var(--line); }

/* S9 gold ripples editorial */
.ripple { position: absolute; left: 50%; top: 40%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1px solid var(--gold); opacity: 0; animation: rip 2.6s ease-out forwards; }
@keyframes rip { 0% { opacity: 0.9; transform: scale(0.3); } 100% { opacity: 0; transform: scale(5); } }
.s9 .ttl { font-size: 92px; }
.word { display: inline-block; opacity: 0; transform: translateY(40px); animation: up 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
.line { width: 0; height: 1px; background: var(--ink); margin: 22px auto; animation: grow 0.8s 1s ease forwards; }
@keyframes grow { to { width: 160px; } }
</style>
</head>
<body>
<h1>Sold — אופציות</h1>
<p class="sub">9 מסכי "נמכר בהצלחה" עם אנימציה, אחרי שמאשרים שהפריט נמכר · האנימציות מתנגנות מחדש כל כמה שניות</p>
<button class="replay" id="replay">↻ Replay</button>
<div class="grid" id="grid"></div>

<script>
var COLORS = ['#d9a441', '#16150f', '#e8842b', '#1f8f4e', '#c23a2e', '#7aa6c2', '#f0d9b5'];
function rnd(a, b) { return a + Math.random() * (b - a); }
function confetti(n) {
  var s = '<div class="conf">';
  for (var i = 0; i < n; i++) s += '<i style="left:' + rnd(0, 100) + '%;background:' + COLORS[i % COLORS.length] + ';animation-delay:' + rnd(0, 0.9).toFixed(2) + 's;animation-duration:' + rnd(2, 3.2).toFixed(2) + 's;border-radius:' + (i % 3 ? '2px' : '50%') + '"></i>';
  return s + '</div>';
}
function burst(n) {
  var s = '<div class="conf burst">';
  for (var i = 0; i < n; i++) { var a = rnd(0, Math.PI * 2), d = rnd(120, 260);
    s += '<i style="--x:' + Math.cos(a) * d + 'px;--y:' + Math.sin(a) * d + 'px;background:' + COLORS[i % COLORS.length] + ';animation-delay:' + rnd(0.9, 1.05).toFixed(2) + 's"></i>'; }
  return s + '</div>';
}
function coins(n) { var s = ''; for (var i = 0; i < n; i++) s += '<span class="coin" style="left:' + rnd(6, 88) + '%;animation-delay:' + rnd(0, 1.4).toFixed(2) + 's">₪</span>'; return s; }
function sparks(n) { var s = ''; for (var i = 0; i < n; i++) s += '<span class="spark" style="left:' + rnd(10, 90) + '%;top:' + rnd(15, 60) + '%;animation-delay:' + rnd(0.4, 1.8).toFixed(2) + 's"></span>'; return s; }
function fireworks() {
  var s = '', spots = [[30, 22, '#ffd36b', 0.2], [72, 18, '#ff7a6b', 0.7], [52, 34, '#8fd3ff', 1.2], [20, 40, '#c7a6ff', 1.6], [80, 38, '#9ff0b0', 2.0]];
  spots.forEach(function (p) { s += '<div class="fw" style="left:' + p[0] + '%;top:' + p[1] + '%;color:' + p[2] + '">';
    for (var k = 0; k < 16; k++) s += '<i style="--r:' + (k * 22.5) + 'deg;animation-delay:' + p[3] + 's"></i>';
    s += '</div>'; });
  return s;
}
var CTA = '<div class="cta up d4"><span class="d">Arrange shipping</span><span>Back to my items</span></div>';

var OPTS = [
  ['S1 · קונפטי', 'פיצוץ קונפטי מהמרכז ואז גשם קונפטי מלמעלה. "Sold!" בסריף גדול, שם הפריט והסכום. הכי חגיגי.',
   function () { return '<div class="screen">' + confetti(46) + burst(30) +
     '<div class="k up">Congratulations</div><div class="ttl up d1">Sold<i>!</i></div><div class="amt up d2">Leather tote · <b>₪480</b></div>' + CTA + '</div>'; }],

  ['S2 · וי מצויר', 'עיגול ירוק שנמתח ווי שמצטייר בתוכו, ואז "Sold successfully". נקי ושקט, בלי רעש.',
   function () { return '<div class="screen"><svg class="chk" viewBox="0 0 130 130"><circle class="fill" cx="65" cy="65" r="60"/><circle cx="65" cy="65" r="60" transform="rotate(-90 65 65)"/><path d="M40 67l17 17 33-37"/></svg>' +
     '<div class="ttl up d2" style="font-size:36px">Sold <i>successfully</i></div><div class="amt up d3">Leather tote · <b>₪480</b> · Daniel K.</div>' + CTA + '</div>'; }],

  ['S3 · חותמת SOLD', 'חותמת אדומה "SOLD" נוחתת על תמונת המוצר עם רעידה קטנה. כמו בחנות וינטג׳.',
   function () { return '<div class="screen s3"><div class="photo ph1 shake"><span class="stamp">SOLD</span></div>' +
     '<div class="below"><div class="k up d2">Leather tote</div><div class="ttl up d3" style="font-size:34px">Sold to Daniel K. for ₪480</div></div>' + CTA + '</div>'; }],

  ['S4 · מטבעות וסכום', 'מטבעות ₪ עולים מלמטה, והסכום רץ מ-0 עד ₪480. מתחת: כמה הרווחת החודש.',
   function () { return '<div class="screen s4">' + coins(16) + '<div class="k up">You earned</div><div class="big up d1">₪<span class="tick" data-to="480">0</span></div>' +
     '<div class="amt up d2">Leather tote is sold</div><div class="bal up d3"><div><b>₪1,940</b><small>This month</small></div><div><b>7</b><small>Items sold</small></div></div>' + CTA + '</div>'; }],

  ['S5 · הטווס', 'הלוגו של הטווס נפתח במרכז עם טבעות זהב וניצוצות, על רקע כהה. ממותג לגמרי.',
   function () { return '<div class="screen s5">' + sparks(18) + '<div class="pea"><img src="../peacock-logo.png" alt=""></div>' +
     '<div class="k up d2">It\'s official</div><div class="ttl up d3">Sold.</div><div class="amt up d3" style="color:rgba(242,239,232,0.7)">Leather tote · <b style="color:#f2efe8">₪480</b></div>' + CTA + '</div>'; }],

  ['S6 · תגית מתנדנדת', 'תגית מחיר שחורה תלויה על חוט, מתנדנדת ונרגעת, וכתוב עליה SOLD.',
   function () { return '<div class="screen"><div class="tagw"><span class="nail"></span><span class="string"></span><div class="tag"><div class="card"><b>SOLD</b></div></div></div>' +
     '<div class="ttl up d2" style="font-size:36px">Nicely <i>done</i></div><div class="amt up d3">Leather tote · <b>₪480</b></div>' + CTA + '</div>'; }],

  ['S7 · זיקוקים', 'רקע לילה וזיקוקים צבעוניים שמתפוצצים אחד אחרי השני מעל הכותרת.',
   function () { return '<div class="screen s7">' + fireworks() + '<div class="k up d2">Deal closed</div><div class="ttl up d2">Sold<i>!</i></div><div class="amt up d3" style="color:rgba(255,255,255,0.7)">Leather tote · <b style="color:#fff">₪480</b></div>' + CTA + '</div>'; }],

  ['S8 · נארז לקופסה', 'המוצר נופל לתוך קופסה, המכסה נסגר, והשלב הבא מודגש: Sold → Ship → Delivered. מכין לשלב המשלוח.',
   function () { return '<div class="screen s8"><div class="box"><div class="item ph1"></div><div class="bd"></div><div class="lid"></div></div><div class="road"></div>' +
     '<div class="ttl up d2" style="font-size:38px">Sold — <i>pack it up</i></div><div class="amt up d3">Daniel K. paid <b>₪480</b></div>' +
     '<div class="steps up d3"><span class="on">Sold</span><span>Ship</span><span>Delivered</span></div>' + CTA + '</div>'; }],

  ['S9 · אדוות זהב', 'גלים דקים בזהב מתפשטים מהמרכז, המילה "Sold." עולה בסריף ענק וקו נמתח מתחתיה. אלגנטי ועריכתי.',
   function () { return '<div class="screen s9"><span class="ripple"></span><span class="ripple" style="animation-delay:.5s"></span><span class="ripple" style="animation-delay:1s"></span>' +
     '<div class="ttl"><span class="word" style="animation-delay:.3s">Sold</span><span class="word serif" style="animation-delay:.55s">.</span></div><div class="line"></div>' +
     '<div class="k up d3">Leather tote · ₪480 · Daniel K.</div>' + CTA + '</div>'; }]
];

var grid = document.getElementById('grid');
function play() {
  grid.innerHTML = OPTS.map(function (o) {
    return '<div class="opt"><div class="phone">' + o[2]() + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
  }).join('');
  // count-up for S4
  grid.querySelectorAll('.tick').forEach(function (el) {
    var to = +el.dataset.to, t0 = performance.now() + 500;
    (function step(now) { var p = Math.min(1, Math.max(0, (now - t0) / 1400)); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
  });
}
play();
var timer = setInterval(play, 5500);
document.getElementById('replay').onclick = function () { clearInterval(timer); play(); timer = setInterval(play, 5500); };
</script>
</body>
</html>
