<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== DATA SECTION ==================== */
        .data-section {
            background: white;
            padding: 40px 0 70px;
            min-height: 600px;
        }

        /* ==================== SLIDER (mirrors the feed promo slider) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 20px 0 0 0;
            padding: 20px 0 0 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            padding: 20px 40px 40px 40px;
        }

        /* The "image" area now holds a chart */
        .promo-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #eef2ef 0%, #f7faf8 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px 34px;
            overflow: hidden;
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 44px;
            font-weight: 800;
            text-transform: none;
            line-height: 1.15;
            letter-spacing: 0.3px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 21px;
            line-height: 1.6;
            color: #444;
            max-width: 560px;
            margin: 0;
        }

        .promo-stat {
            font-size: 17px;
            font-weight: 700;
            color: #004225;
            background: #e8f0eb;
            padding: 10px 20px;
            border-radius: 24px;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #004225;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #004225;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        /* ==================== CHARTS ==================== */
        /* Monthly spending: vertical bars */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            width: 100%;
            height: 100%;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 8px;
        }

        .bar-value {
            font-size: 12px;
            font-weight: 700;
            color: #004225;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            max-width: 48px;
            background: linear-gradient(180deg, #0a6b3f 0%, #004225 100%);
            border-radius: 6px 6px 0 0;
            min-height: 4px;
        }

        .bar-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        /* Styles & brands: horizontal bars */
        .hbars {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
        }

        .hbar-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hbar-label {
            width: 104px;
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hbar-track {
            flex: 1;
            height: 16px;
            background: #e4e9e6;
            border-radius: 8px;
            overflow: hidden;
        }

        .hbar-fill {
            height: 100%;
            background: linear-gradient(90deg, #004225 0%, #0a6b3f 100%);
            border-radius: 8px;
        }

        .hbar-pct {
            width: 44px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: #004225;
            text-align: left;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .promo-title { font-size: 30px; }
            .promo-desc { font-size: 17px; }
            .promo-image { height: 320px; }
        }

        @media (max-width: 768px) {
            .header-left { display: none; }
            .hero-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">הנתונים שלי</h1>
            <p class="hero-subtitle">מבט על הרגלי הקנייה, הסגנונות והחברות האהובים עליך</p>
        </div>
    </div>

    <!-- ==================== DATA SLIDER ==================== -->
    <div class="data-section">
        <div class="container">
            <div class="promo-slider" id="dataSlider">
                <button class="promo-arrow prev" aria-label="הקודם" onclick="sliderGo(sliderIndex - 1)"></button>
                <div class="promo-viewport">
                    <div class="promo-track" id="sliderTrack"></div>
                </div>
                <button class="promo-arrow next" aria-label="הבא" onclick="sliderGo(sliderIndex + 1)"></button>
                <div class="promo-footer">
                    <div class="promo-dots" id="sliderDots"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ==================== DATA ====================
        // Monthly spending in ₪ (index 0 = January); rendered up to the current month.
        const monthlySpending = [320, 180, 540, 260, 610, 430, 290, 380, 450, 500, 340, 410];
        const monthNames = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

        const favoriteStyles = [
            { name: 'קז\'ואל', pct: 85 },
            { name: 'וינטג\'', pct: 62 },
            { name: 'ספורט', pct: 48 },
            { name: 'פורמלי', pct: 35 },
        ];
        const favoriteBrands = [
            { name: 'Basics Co', pct: 90 },
            { name: 'Denim House', pct: 70 },
            { name: 'Street Style', pct: 55 },
            { name: 'Smart Style', pct: 40 },
        ];

        // ==================== CHART BUILDERS ====================
        function spendChartHTML() {
            const currentMonth = new Date().getMonth(); // up to "today"
            const data = monthlySpending.slice(0, currentMonth + 1);
            const max = Math.max(...data);
            return `<div class="bar-chart">` + data.map((value, i) => {
                const height = max > 0 ? (value / max) * 100 : 0;
                return `
                    <div class="bar-col">
                        <div class="bar-value">₪${value.toLocaleString()}</div>
                        <div class="bar" style="height: ${height}%"></div>
                        <div class="bar-label">${monthNames[i]}</div>
                    </div>`;
            }).join('') + `</div>`;
        }

        function hbarsHTML(items) {
            return `<div class="hbars">` + items.map(item => `
                <div class="hbar-row">
                    <div class="hbar-label">${item.name}</div>
                    <div class="hbar-track"><div class="hbar-fill" style="width: ${item.pct}%"></div></div>
                    <div class="hbar-pct">${item.pct}%</div>
                </div>`).join('') + `</div>`;
        }

        function spendTotal() {
            const currentMonth = new Date().getMonth();
            return monthlySpending.slice(0, currentMonth + 1).reduce((s, v) => s + v, 0);
        }

        // ==================== SLIDES ====================
        // Each slide: an explanation (text area) + a chart (image area).
        const slides = [
            {
                title: 'הצריכה החודשית שלי',
                desc: 'כמה הוצאת בכל חודש, מתחילת השנה ועד היום. עקוב אחרי מגמת ההוצאות שלך לאורך החודשים.',
                stat: () => `סה"כ מתחילת השנה · ₪${spendTotal().toLocaleString()}`,
                chart: spendChartHTML,
            },
            {
                title: 'הסגנונות המועדפים עליי',
                desc: 'פילוח הרכישות שלך לפי סגנון לבוש — הסגנונות שאתה הכי אוהב לקנות.',
                stat: () => `הסגנון המוביל · ${favoriteStyles[0].name}`,
                chart: () => hbarsHTML(favoriteStyles),
            },
            {
                title: 'החברות האהובות עליי',
                desc: 'המותגים שמהם קנית הכי הרבה. אלה החברות שחוזרות אצלך שוב ושוב.',
                stat: () => `המותג המוביל · ${favoriteBrands[0].name}`,
                chart: () => hbarsHTML(favoriteBrands),
            },
        ];

        // ==================== SLIDER ENGINE (mirrors the feed promo slider) ====================
        const SLIDER_INTERVAL = 6000;
        const chevron = dir => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="${dir === 'left' ? '15 6 9 12 15 18' : '9 6 15 12 9 18'}"></polyline></svg>`;
        const ringSVG = `<svg class="promo-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"></circle></svg>`;
        let sliderIndex = 0;
        let sliderTimer = null;

        function buildSlider() {
            document.querySelector('.promo-arrow.prev').innerHTML = chevron('left');
            document.querySelector('.promo-arrow.next').innerHTML = chevron('right');

            document.getElementById('sliderTrack').innerHTML = slides.map(s => `
                <div class="promo-slide">
                    <div class="promo-image">${s.chart()}</div>
                    <div class="promo-text">
                        <h2 class="promo-title">${s.title}</h2>
                        <p class="promo-desc">${s.desc}</p>
                        <span class="promo-stat">${s.stat()}</span>
                    </div>
                </div>`).join('');

            document.getElementById('sliderDots').innerHTML = slides.map((s, i) =>
                `<button class="promo-dot" aria-label="שקופית ${i + 1}" onclick="sliderGo(${i})"></button>`).join('');
        }

        function sliderGo(i) {
            const n = slides.length;
            sliderIndex = (i + n) % n;
            document.getElementById('sliderTrack').style.transform = `translateX(-${sliderIndex * 100}%)`;
            document.querySelectorAll('#sliderDots .promo-dot').forEach((dot, idx) => {
                const active = idx === sliderIndex;
                dot.classList.toggle('active', active);
                dot.innerHTML = active ? ringSVG : '';
            });
            clearInterval(sliderTimer);
            sliderTimer = setInterval(() => sliderGo(sliderIndex + 1), SLIDER_INTERVAL);
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize
        buildSlider();
        sliderGo(0);
    </script>
</body>
</html>
