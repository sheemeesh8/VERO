<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VERO · כניסה</title>
<!-- Phone-mode handoff: when opened top-level, render inside the shared phone
     frame (same as index.html). Inside the frame this is skipped. -->
<script>if (window.self === window.top) { location.replace('phone-frame.html#page=login.html'); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --ink:#1c1c1c; --line:#e6e6e3; --muted:#6b6b66; --err:#b23b3b;
        --f-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        --f-serif: 'Playfair Display', Georgia, serif;
        --f-label: 'Oswald', 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: var(--f-sans); color: var(--ink);
        background: #faf9f7; display: flex; align-items: center; justify-content: center;
        padding: 32px 22px;
    }
    body::before {
        content: ''; position: fixed; inset: 0; z-index: 0;
        background: linear-gradient(rgba(250,249,247,.86), rgba(250,249,247,.94)), url('gallery-hero.jpg') center/cover no-repeat fixed;
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 380px; }
    .brand { text-align: center; font-family: var(--f-serif); font-size: 30px; letter-spacing: 8px; font-weight: 500; margin: 0 0 6px; }
    .brand span { letter-spacing: normal; }
    .tagline { text-align: center; font-family: var(--f-label); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 46px; }

    /* ---- Saved accounts (Instagram-style grid: avatar + name, 2 per row) ---- */
    .lead { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 26px; }
    .accounts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 14px; }
    .acct {
        position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px;
        cursor: pointer; padding: 2px 0; transition: transform .1s;
    }
    .acct:active { transform: scale(.97); }
    .acct .avwrap { position: relative; width: 80px; height: 80px; }
    .acct .av {
        width: 80px; height: 80px; border-radius: 50%;
        background: #eceae6 center/cover no-repeat; display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 300; color: var(--muted); overflow: hidden;
    }
    /* Business profile of the same person: a smaller circle overlapping the
       bottom of the personal avatar (its ring "cuts" into the main circle). */
    .acct .biz {
        position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
        width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
        background: #d8d4cd center/cover no-repeat; border: 3px solid #faf9f7;
        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--ink);
    }
    .acct .name {
        font-size: 13px; font-weight: 600; text-align: center; max-width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .acct .rm {
        position: absolute; top: -3px; right: calc(50% - 48px);
        width: 22px; height: 22px; border: none; border-radius: 50%;
        background: #fff; color: var(--err); font-size: 15px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 5px rgba(0,0,0,.22);
    }
    /* The "+" tile: same-size circle to add / build a new profile. */
    .acct.add .av { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-size: 32px; font-weight: 200; }

    /* Options revealed by tapping the "+" tile. */
    .add-sheet { display: none; flex-direction: column; gap: 10px; margin-top: 26px; }
    .add-sheet.show { display: flex; }
    .add-sheet .btn { text-decoration: none; text-align: center; }

    /* ---- Form ---- */
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
    .field input {
        width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff;
        padding: 13px 14px; font-size: 14px; font-family: inherit; color: var(--ink); direction: ltr; text-align: right;
    }
    .field input:focus { outline: none; border-color: var(--ink); }
    .btn {
        width: 100%; border: none; border-radius: 999px; padding: 14px; font-size: 13.5px; font-weight: 600;
        letter-spacing: .5px; cursor: pointer; background: #000; color: #fff; font-family: inherit;
        transition: opacity .2s;
    }
    .btn:hover { opacity: .82; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; margin-top: 12px; }
    .btn.ghost:hover { background: #f0efec; opacity: 1; }
    .note { min-height: 16px; margin: 10px 0 0; font-size: 11px; color: var(--err); text-align: center; }
    .foot { text-align: center; margin-top: 30px; font-size: 12.5px; color: var(--muted); }
    .foot a { color: var(--ink); font-weight: 600; text-decoration: none; }
    .hide { display: none !important; }
    .backlink { display: block; text-align: center; margin-top: 22px; font-size: 12px; color: var(--muted); text-decoration: none; }
</style>
<link rel="stylesheet" href="auth-video.css">
<link rel="stylesheet" href="assets/fonts/aharoni.css">
</head>
<body>
    <div class="wrap">
        <img src="vr-logo.png?v=1" alt="VERO" class="brand-logo" onerror="this.replaceWith(document.createTextNode('VERO'))">

        <!-- ===== SAVED ACCOUNTS (one-tap) ===== -->
        <section id="savedView" class="hide">
            <p class="lead">בחר פרופיל</p>
            <div class="accounts" id="acctList"></div>
            <div class="add-sheet" id="addSheet">
                <button class="btn ghost" onclick="showForm()">כניסה לחשבון קיים</button>
                <a class="btn" href="signup.html">בניית פרופיל חדש</a>
            </div>
        </section>

        <!-- ===== EMAIL / PASSWORD FORM ===== -->
        <section id="formView" class="hide">
            <form id="loginForm" autocomplete="on">
                <div class="field">
                    <label for="email">אימייל</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">כניסה</button>
                <p class="note" id="formNote"></p>
            </form>
            <div class="foot">אין לך חשבון? <a href="signup.html">הרשמה</a></div>
            <a class="backlink hide" id="backToSaved" href="#" onclick="showSaved();return false;">← חזרה לחשבונות שמורים</a>
        </section>
    </div>

    <script src="auth.js"></script>
    <script src="auth-video.js"></script>
    <script>
        // Already signed in? Skip straight through the guard.
        if (VeroAuth.guard('auth')) {
            var saved = VeroAuth.savedAccounts();

            function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

            function renderSaved() {
                saved = VeroAuth.savedAccounts();
                if (!saved.length) { showForm(); return; }
                var html = saved.map(function (a) {
                    var initial = (a.name || a.username || '?').trim().charAt(0).toUpperCase();
                    var av = a.avatar
                        ? '<span class="av" style="background-image:url(\'' + esc(a.avatar) + '\')"></span>'
                        : '<span class="av">' + esc(initial) + '</span>';
                    // Optional business profile of the same person → overlapping circle.
                    var biz = '';
                    if (a.bizAvatar) biz = '<span class="biz" style="background-image:url(\'' + esc(a.bizAvatar) + '\')"></span>';
                    else if (a.bizName) biz = '<span class="biz">' + esc(a.bizName.trim().charAt(0).toUpperCase()) + '</span>';
                    // Grid tile: avatar circle (+ optional biz badge) + name below.
                    return '<div class="acct" role="button" tabindex="0" onclick="tap(\'' + a.id + '\')" ' +
                        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();tap(\'' + a.id + '\')}">' +
                        '<button type="button" class="rm" title="הסר חשבון" onclick="removeAcct(event,\'' + a.id + '\')">×</button>' +
                        '<span class="avwrap">' + av + biz + '</span>' +
                        '<span class="name">' + esc(a.name) + '</span>' +
                    '</div>';
                }).join('');
                // The "+" tile — same size, opens the add / build-new options.
                html += '<div class="acct add" role="button" tabindex="0" onclick="toggleAdd()" ' +
                        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleAdd()}">' +
                        '<span class="av">+</span><span class="name">הוספת פרופיל</span></div>';
                document.getElementById('acctList').innerHTML = html;
                showSaved();
            }

            window.toggleAdd = function () {
                document.getElementById('addSheet').classList.toggle('show');
            };
            window.showSaved = function () {
                if (!VeroAuth.savedAccounts().length) { showForm(); return; }
                document.getElementById('addSheet').classList.remove('show');
                document.getElementById('savedView').classList.remove('hide');
                document.getElementById('formView').classList.add('hide');
            };
            window.showForm = function () {
                document.getElementById('addSheet').classList.remove('show');
                document.getElementById('savedView').classList.add('hide');
                document.getElementById('formView').classList.remove('hide');
                document.getElementById('backToSaved').classList.toggle('hide', !VeroAuth.savedAccounts().length);
            };

            // One-tap re-auth via stored refresh token — no password prompt.
            window.tap = function (id) {
                try {
                    var user = VeroAuth.oneTap(id);
                    location.href = VeroAuth.hasOnboarded(user.id) ? 'index.html' : 'onboarding.html';
                } catch (e) {
                    // Stale/removed token → fall back to the password form.
                    showForm();
                    document.getElementById('formNote').textContent = 'נדרשת כניסה מחדש עבור חשבון זה.';
                }
            };

            window.removeAcct = function (ev, id) {
                ev.stopPropagation();
                VeroAuth.forgetAccount(id);
                renderSaved();
            };

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var note = document.getElementById('formNote'); note.textContent = '';
                try {
                    var user = VeroAuth.login(
                        document.getElementById('email').value,
                        document.getElementById('password').value
                    );
                    location.href = VeroAuth.hasOnboarded(user.id) ? 'index.html' : 'onboarding.html';
                } catch (err) {
                    note.textContent = err.message === 'NO_USER'
                        ? 'לא נמצא חשבון עם האימייל הזה.'
                        : 'האימייל או הסיסמה שגויים.';
                }
            });

            // Start on the saved-accounts screen if the device remembers anyone.
            saved.length ? renderSaved() : showForm();
        }
    </script>
</body>
</html>
