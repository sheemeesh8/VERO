<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — מוצר</title>
    <style>
        :root{
            --bg:#ffffff;          /* page — white */
            --sand:#F2F0EF;        /* header + image tone */
            --panel:#ffffff;
            --ink:#111010;         /* near-black text */
            --muted:#8c8579;       /* label grey */
            --line:#e6e2da;        /* hairline */
            --line-strong:#111010;
            --sale:#8a6d3b;
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{
            background:var(--bg);
            color:var(--ink);
            font-family:'Aharoni CLM','Segoe UI',sans-serif;
            -webkit-font-smoothing:antialiased;
            line-height:1.5;
        }
        /* one column, phone-width; scrolls vertically inside the frame */
        .page{
            width:100%;
            max-width:480px;
            margin:0 auto;
            min-height:100%;
            background:var(--bg);
            padding-bottom:40px;
        }

        /* header + image share the sand tone; the rest of the page is white */
        .hero{background:var(--sand);}

        /* ---------- top bar ---------- */
        .topbar{
            position:sticky;top:0;z-index:30;
            display:flex;align-items:center;justify-content:space-between;
            padding:16px 20px 12px;
            background:var(--sand);
        }
        .tb-btn{
            width:42px;height:42px;flex:0 0 auto;
            display:flex;align-items:center;justify-content:center;
            border:1px solid var(--line);border-radius:50%;
            background:var(--panel);color:var(--ink);cursor:pointer;
            transition:background .2s,color .2s,border-color .2s;
        }
        .tb-btn:active{background:var(--ink);color:#fff;border-color:var(--ink);}
        .tb-btn svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.5;fill:none;}
        .tb-brand{
            font-size:13px;letter-spacing:6px;font-weight:700;text-transform:uppercase;
            padding-inline-start:6px;
        }

        /* ---------- gallery slider ---------- */
        .gallery{position:relative;padding:0 0 18px;background:var(--sand);}
        .slider{
            display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
            scrollbar-width:none;-webkit-overflow-scrolling:touch;direction:ltr;
        }
        .slider::-webkit-scrollbar{display:none;}
        .slide{
            flex:0 0 100%;scroll-snap-align:center;
            aspect-ratio:4/5;background:var(--sand);overflow:hidden;
        }
        .slide img{width:100%;height:100%;object-fit:cover;display:block;}
        .gallery-count{
            position:absolute;top:14px;inset-inline-start:14px;
            padding:5px 12px;border-radius:999px;
            background:rgba(17,16,16,.55);color:#fff;direction:ltr;
            font-size:11px;letter-spacing:1px;backdrop-filter:blur(4px);
        }
        /* navigation lines (thin bars; active one widens + darkens) */
        .nav-lines{
            position:absolute;bottom:16px;left:0;right:0;
            display:flex;gap:7px;justify-content:center;align-items:center;z-index:5;
        }
        .nav-line{
            width:20px;height:3px;border-radius:2px;padding:0;cursor:pointer;
            border:none;background:rgba(17,16,16,.22);transition:width .25s,background .25s;
        }
        .nav-line.active{width:34px;background:var(--ink);}

        /* ---------- content ---------- */
        .content{padding:22px 22px 0;}

        .eyebrow{
            font-size:11px;letter-spacing:3px;text-transform:uppercase;
            color:var(--muted);margin-bottom:10px;
        }
        .p-name{
            font-size:29px;font-weight:700;line-height:1.15;letter-spacing:.2px;
        }
        .p-company{
            margin-top:7px;font-size:12.5px;letter-spacing:3px;text-transform:uppercase;
            color:var(--muted);
        }
        .p-company a{color:inherit;text-decoration:none;}

        .p-price{
            margin-top:18px;font-size:23px;font-weight:400;letter-spacing:.5px;
        }
        .p-price .was{
            font-size:15px;color:var(--muted);text-decoration:line-through;
            margin-inline-start:10px;
        }
        .p-price .off{
            font-size:12px;color:#fff;background:var(--sale);
            padding:3px 8px;border-radius:3px;margin-inline-end:10px;letter-spacing:1px;
        }

        /* seller + rating */
        .p-seller{
            display:flex;align-items:center;gap:10px;flex-wrap:wrap;
            margin-top:18px;padding:16px 0;
            border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            font-size:13px;color:#3d382f;
        }
        .p-seller .s-label{color:var(--muted);letter-spacing:1px;}
        .p-seller .s-name{
            font-weight:700;text-decoration:underline;text-underline-offset:3px;
            color:var(--ink);
        }
        .p-seller .s-rating{margin-inline-start:auto;letter-spacing:2px;color:var(--ink);}
        .p-seller .s-rating .num{color:var(--muted);letter-spacing:0;font-size:11px;margin-inline-start:3px;}

        /* description */
        .p-desc{
            margin-top:22px;font-size:14.5px;line-height:1.9;color:#413b31;
        }

        /* spec rows — LV-style hairline detail list */
        .specs{margin-top:26px;border-top:1px solid var(--line);}
        .spec-row{
            display:flex;align-items:center;justify-content:space-between;gap:16px;
            padding:15px 2px;border-bottom:1px solid var(--line);
        }
        .spec-key{
            font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
        }
        .spec-val{font-size:14.5px;font-weight:700;text-align:end;}

        /* ---------- action buttons ---------- */
        .actions{margin-top:26px;display:flex;flex-direction:column;gap:11px;}
        .btn{
            width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:9px;
            border-radius:0;cursor:pointer;font-family:inherit;
            font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;
            border:1.4px solid var(--ink);transition:background .2s,color .2s,opacity .2s;
        }
        .btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.5;fill:none;}
        .btn-primary{background:var(--ink);color:#fff;}
        .btn-primary:active{opacity:.8;}
        .btn-primary .price-tail{font-weight:400;letter-spacing:.5px;opacity:.8;}
        .btn-outline{background:transparent;color:var(--ink);}
        .btn-outline:active{background:var(--ink);color:#fff;}
        .btn-outline.active{background:var(--ink);color:#fff;}
        .btn-outline.active svg{fill:#fff;}
        .btn-row{display:flex;gap:11px;}
        .btn-row .btn{flex:1;font-size:11px;letter-spacing:1.5px;}

        /* ---------- overlays / popups ---------- */
        .overlay{
            position:fixed;inset:0;z-index:200;display:none;
            align-items:flex-end;justify-content:center;
            background:rgba(17,16,16,.5);
        }
        .overlay.show{display:flex;animation:fade .2s ease;}
        @keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{
            width:100%;max-width:480px;background:var(--panel);
            border-radius:20px 20px 0 0;padding:26px 24px calc(26px + env(safe-area-inset-bottom));
            transform:translateY(100%);animation:rise .34s cubic-bezier(.2,.8,.2,1) forwards;
        }
        @keyframes rise{to{transform:translateY(0)}}
        .sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 20px;}
        .sheet h3{font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
        .sheet p.sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;}

        /* confirm popup (cart / wishlist) */
        .confirm-icon{
            width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            background:var(--ink);color:#fff;
        }
        .confirm-icon svg{width:26px;height:26px;stroke:#fff;stroke-width:1.6;fill:none;}
        .sheet.center{text-align:center;}
        .mini-card{
            display:flex;align-items:center;gap:12px;text-align:start;
            padding:14px;border:1px solid var(--line);margin-bottom:20px;
        }
        .mini-card .mc-img{width:52px;height:60px;object-fit:cover;flex:0 0 auto;background:var(--bg);}
        .mini-card .mc-name{font-weight:700;font-size:14px;}
        .mini-card .mc-price{font-size:13px;color:var(--muted);margin-top:3px;}

        /* offer / message inputs */
        .field{
            display:flex;align-items:center;border:1px solid var(--line);
            padding:0 16px;height:54px;margin-bottom:14px;
        }
        .field .cur{color:var(--muted);font-size:17px;margin-inline-end:8px;}
        .field input{
            border:none;outline:none;background:transparent;font-family:inherit;
            font-size:17px;font-weight:700;width:100%;color:var(--ink);
        }
        textarea.field{
            height:auto;min-height:96px;padding:14px 16px;resize:none;
            font-size:14.5px;font-weight:400;line-height:1.6;display:block;
        }
        .offer-quick{display:flex;gap:8px;margin-bottom:18px;}
        .offer-quick button{
            flex:1;height:40px;border:1px solid var(--line);background:transparent;
            font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
            transition:background .2s,color .2s;
        }
        .offer-quick button:active{background:var(--ink);color:#fff;}
        .sheet-actions{display:flex;gap:11px;margin-top:4px;}
        .sheet-actions .btn{height:52px;}

        /* share grid */
        .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:8px;}
        .share-item{
            display:flex;flex-direction:column;align-items:center;gap:8px;
            background:none;border:none;cursor:pointer;font-family:inherit;color:var(--ink);
        }
        .share-ic{
            width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            border:1px solid var(--line);
        }
        .share-ic svg{width:24px;height:24px;}
        .share-item span{font-size:11px;letter-spacing:.5px;color:#413b31;}

        .toast{
            position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
            background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;
            font-size:12px;letter-spacing:1px;z-index:400;opacity:0;pointer-events:none;
            transition:opacity .3s,transform .3s;
        }
        .toast.show{opacity:1;transform:translate(-50%,0);}
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="product-overrides.js"></script>
    <script src="assets/back-button.js"></script>
</head>
<body>
<div class="page">

  <div class="hero">
    <!-- top bar -->
    <div class="topbar">
        <button class="tb-btn" onclick="goBack()" aria-label="חזרה">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="tb-brand">VERO</span>
        <button class="tb-btn" onclick="openSheet('shareSheet')" aria-label="שיתוף">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
    </div>

    <!-- gallery slider -->
    <div class="gallery">
        <div class="slider" id="slider"></div>
        <span class="gallery-count" id="galleryCount">1 / 3</span>
        <div class="nav-lines" id="navLines"></div>
    </div>
  </div>

    <!-- content -->
    <div class="content">
        <div class="eyebrow" id="eyebrow">יד שנייה · VERO SELECT</div>
        <h1 class="p-name" id="pName">שם המוצר</h1>
        <div class="p-company"><a id="pCompany" href="#">שם החברה</a></div>

        <div class="p-price" id="pPrice">₪0.00</div>

        <div class="p-seller">
            <span class="s-label">מוכר:</span>
            <a class="s-name" id="sellerName" href="#">VERO</a>
            <span class="s-rating" id="sellerRating"></span>
        </div>

        <p class="p-desc" id="pDesc">תיאור המוצר יופיע כאן.</p>

        <!-- spec detail list -->
        <div class="specs" id="specs">
            <div class="spec-row"><span class="spec-key">מידה</span><span class="spec-val" id="specSize">—</span></div>
            <div class="spec-row"><span class="spec-key">מצב הפריט</span><span class="spec-val" id="specCondition">—</span></div>
            <div class="spec-row"><span class="spec-key">סוג הבד</span><span class="spec-val" id="specFabric">—</span></div>
            <div class="spec-row"><span class="spec-key">מתאים ל־</span><span class="spec-val" id="specAudience">—</span></div>
            <div class="spec-row"><span class="spec-key">צבע</span><span class="spec-val" id="specColor">—</span></div>
        </div>

        <!-- actions -->
        <div class="actions">
            <button class="btn btn-primary" onclick="addToCart()">
                <span>הוסף לעגלת קניות</span>
                <span class="price-tail" id="buyPrice">₪0.00</span>
            </button>
            <button class="btn btn-outline" id="wishBtn" onclick="toggleWishlist()">
                <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
                <span id="wishLabel">הוסף לרשימת המשאלות</span>
            </button>
            <div class="btn-row">
                <button class="btn btn-outline" onclick="openSheet('offerSheet')">הצע מחיר</button>
                <button class="btn btn-outline" onclick="openSheet('msgSheet')">שאל על זמינות</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ CONFIRM POPUP (cart / wishlist) ============ -->
<div class="overlay" id="confirmSheet" onclick="if(event.target===this)closeSheet('confirmSheet')">
    <div class="sheet center">
        <div class="sheet-grip"></div>
        <div class="confirm-icon" id="confirmIcon">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h3 id="confirmTitle">נוסף לעגלה</h3>
        <p class="sub" id="confirmSub">הפריט נשמר עבורך</p>
        <div class="mini-card">
            <img class="mc-img" id="confirmImg" src="" alt="">
            <div>
                <div class="mc-name" id="confirmName">—</div>
                <div class="mc-price" id="confirmPrice">—</div>
            </div>
        </div>
        <div class="sheet-actions">
            <button class="btn btn-outline" onclick="closeSheet('confirmSheet')">המשך לגלוש</button>
            <button class="btn btn-primary" id="confirmCta" onclick="goCart()">לעגלה</button>
        </div>
    </div>
</div>

<!-- ============ OFFER SHEET ============ -->
<div class="overlay" id="offerSheet" onclick="if(event.target===this)closeSheet('offerSheet')">
    <div class="sheet">
        <div class="sheet-grip"></div>
        <h3>הצעת מחיר</h3>
        <p class="sub" id="offerSub">שלח למוכר הצעה להתמקחות</p>
        <div class="field">
            <span class="cur">₪</span>
            <input type="number" id="offerInput" min="1" step="1" placeholder="0" inputmode="numeric">
        </div>
        <div class="offer-quick" id="offerQuick"></div>
        <div class="sheet-actions">
            <button class="btn btn-outline" onclick="closeSheet('offerSheet')">ביטול</button>
            <button class="btn btn-primary" onclick="sendOffer()">שלח הצעה</button>
        </div>
    </div>
</div>

<!-- ============ MESSAGE SHEET (availability) ============ -->
<div class="overlay" id="msgSheet" onclick="if(event.target===this)closeSheet('msgSheet')">
    <div class="sheet">
        <div class="sheet-grip"></div>
        <h3>שאלה למוכר</h3>
        <p class="sub" id="msgSub">שאל את המוכר על זמינות הפריט</p>
        <textarea class="field" id="msgInput" placeholder="היי, האם הפריט עדיין זמין?"></textarea>
        <div class="sheet-actions">
            <button class="btn btn-outline" onclick="closeSheet('msgSheet')">ביטול</button>
            <button class="btn btn-primary" onclick="sendMessage()">שלח הודעה</button>
        </div>
    </div>
</div>

<!-- ============ SHARE SHEET ============ -->
<div class="overlay" id="shareSheet" onclick="if(event.target===this)closeSheet('shareSheet')">
    <div class="sheet">
        <div class="sheet-grip"></div>
        <h3>שיתוף הפריט</h3>
        <p class="sub">שתפו את המוצר עם חברים</p>
        <div class="share-grid" id="shareGrid"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const params = new URLSearchParams(location.search);
    let product = { name:'שם המוצר', price:120, desc:'', seller:'VERO' };
    try{
        const raw = params.get('product');
        if(raw) product = Object.assign(product, JSON.parse(decodeURIComponent(raw)));
    }catch(e){ console.error(e); }

    // Fold in seller edits + sale price so the price matches the rest of the site.
    if(window.veroApplyOverride) product = window.veroApplyOverride(product);

    const toNum = v => { const n = parseFloat(String(v==null?'':v).replace(/[^\d.]/g,'')); return isNaN(n)?0:n; };
    const fmt = p => '₪' + Number(toNum(p)).toFixed(2);

    // ---- Field mapping (matches the seller upload fields) ----
    const company    = product.company || product.brand || product.seller || 'VERO';
    const sellerName = product.seller || 'VERO';
    const rating     = Number(product.rating) || 4.5;
    const priceNum   = toNum(product.price);
    const isArt      = product.type === 'art';
    const desc = product.desc || `${product.name} — ${isArt?'יצירת אמנות':'פריט'} במצב מעולה, זמין כעת בחנות.`;

    const AUDIENCE = { men:'גברים', women:'נשים', kids:'ילדים', unisex:'יוניסקס',
                       גברים:'גברים', נשים:'נשים', ילדים:'ילדים', יוניסקס:'יוניסקס' };
    const audience = AUDIENCE[(product.audience||product.gender||'').toString().toLowerCase()]
                     || product.audience || 'יוניסקס';

    const seed = encodeURIComponent(product.name || 'vero');
    // The FIRST slide is always the product's own background-removed cut-out.
    // The rest are different shots of the same item.
    const cover = product.processed_cover || product.image || product.cover || null;
    let extra = (product.images && product.images.length)
        ? product.images.filter(s => s && s !== cover)
        : [ `https://picsum.photos/seed/${seed}-a/900/1100`,
            `https://picsum.photos/seed/${seed}-b/900/1100` ];
    const images = cover ? [cover, ...extra]
        : [ `https://picsum.photos/seed/${seed}-1/900/1100`, ...extra ];

    // ---- Render header ----
    document.getElementById('eyebrow').textContent = (isArt?'יצירת אמנות':'יד שנייה') + ' · VERO SELECT';
    document.getElementById('pName').textContent = product.name;
    const comp = document.getElementById('pCompany');
    comp.textContent = company;
    comp.href = `index.html?seller=${encodeURIComponent(sellerName)}`;

    // Price (with sale strike-through if on sale)
    const priceEl = document.getElementById('pPrice');
    if(product.onSale && product.originalPrice){
        const was = toNum(product.originalPrice), now = priceNum;
        const off = was>0 ? Math.round((1-now/was)*100) : 0;
        priceEl.innerHTML = (off>0?`<span class="off">-${off}%</span>`:'') +
            `${fmt(now)}<span class="was">${fmt(was)}</span>`;
    } else {
        priceEl.textContent = fmt(priceNum);
    }
    document.getElementById('buyPrice').textContent = fmt(priceNum);

    // Seller row
    const sLink = document.getElementById('sellerName');
    sLink.textContent = sellerName;
    sLink.href = `index.html?seller=${encodeURIComponent(sellerName)}`;
    const stars = '★'.repeat(Math.floor(rating)) + (rating%1>=0.5?'☆':'');
    document.getElementById('sellerRating').innerHTML = `${stars} <span class="num">${rating.toFixed(1)}</span>`;

    document.getElementById('pDesc').textContent = desc;

    // Specs
    document.getElementById('specSize').textContent      = product.size || (isArt?'50×70 ס"מ':'M');
    document.getElementById('specCondition').textContent = product.condition || 'מצב מעולה';
    document.getElementById('specFabric').textContent    = product.fabric || product.material || (isArt?'קנבס':'כותנה');
    document.getElementById('specAudience').textContent  = audience;
    document.getElementById('specColor').textContent     = product.color || 'רב-גוני';

    // Gallery slider — all images in one swipeable track with nav lines.
    const slider = document.getElementById('slider');
    const countEl = document.getElementById('galleryCount');
    const navLines = document.getElementById('navLines');
    slider.innerHTML = images.map((src,i)=>
        `<div class="slide"><img src="${src}" alt="${i===0?product.name:''}" loading="${i===0?'eager':'lazy'}"></div>`).join('');
    navLines.innerHTML = images.map((_,i)=>
        `<button class="nav-line${i===0?' active':''}" data-i="${i}" aria-label="תמונה ${i+1}"></button>`).join('');
    countEl.textContent = `1 / ${images.length}`;

    function goToSlide(i){ slider.scrollTo({ left: slider.clientWidth*i, behavior:'smooth' }); }
    navLines.addEventListener('click', e=>{
        const b = e.target.closest('.nav-line'); if(b) goToSlide(+b.dataset.i);
    });
    // Reflect the current slide (from swipe or arrow) in the count + nav lines.
    let rafPending=false;
    slider.addEventListener('scroll', ()=>{
        if(rafPending) return; rafPending=true;
        requestAnimationFrame(()=>{
            rafPending=false;
            const i = Math.round(slider.scrollLeft / slider.clientWidth);
            countEl.textContent = `${i+1} / ${images.length}`;
            navLines.querySelectorAll('.nav-line').forEach((l,idx)=>l.classList.toggle('active',idx===i));
        });
    });

    // ---------- sheets ----------
    function openSheet(id){
        const s = document.getElementById(id);
        s.querySelector('.sheet').style.animation='none';
        s.offsetHeight; s.querySelector('.sheet').style.animation='';
        s.classList.add('show');
        if(id==='offerSheet') setTimeout(()=>document.getElementById('offerInput').focus(),300);
    }
    function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
    window.openSheet=openSheet; window.closeSheet=closeSheet;
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show')); });

    function toast(msg){
        const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
        clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
    }

    function goBack(){ if(typeof goBackToStore==='function') return goBackToStore();
        if(document.referrer && history.length>1) history.back(); else location.href='index.html'; }
    window.goBack=goBack;
    function goCart(){ location.href='index.html?open=cart'; }
    window.goCart=goCart;

    // ---------- cart ----------
    const HOLD = 48*60*60*1000;
    function addToCart(){
        const cart = JSON.parse(localStorage.getItem('vero_cart')||'[]');
        const id = `${product.name}|${product.price}`;
        const now = Date.now();
        const ex = cart.find(i=>i.id===id);
        if(ex){ ex.qty+=1; ex.addedAt=now; ex.expiresAt=now+HOLD; }
        else cart.push({ id, name:product.name, price:product.price, seller:sellerName,
            icon:product.icon, category:product.category, type:product.type, rating:product.rating,
            qty:1, addedAt:now, expiresAt:now+HOLD });
        localStorage.setItem('vero_cart', JSON.stringify(cart));
        // confirmation popup
        document.getElementById('confirmIcon').innerHTML='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
        document.getElementById('confirmTitle').textContent='נוסף לעגלה';
        document.getElementById('confirmSub').textContent='הפריט נשמר עבורך למשך 48 שעות';
        document.getElementById('confirmImg').src=images[0];
        document.getElementById('confirmName').textContent=product.name;
        document.getElementById('confirmPrice').textContent=fmt(priceNum);
        document.getElementById('confirmCta').textContent='לעגלה';
        document.getElementById('confirmCta').onclick=goCart;
        openSheet('confirmSheet');
    }
    window.addToCart=addToCart;

    // ---------- wishlist ----------
    function isWished(){
        const wl=JSON.parse(localStorage.getItem('vero_wishlist')||'[]');
        return wl.some(i=>i.id===`${product.name}|${product.price}`);
    }
    function toggleWishlist(){
        const wl=JSON.parse(localStorage.getItem('vero_wishlist')||'[]');
        const id=`${product.name}|${product.price}`;
        const idx=wl.findIndex(i=>i.id===id);
        if(idx>=0){ wl.splice(idx,1); localStorage.setItem('vero_wishlist',JSON.stringify(wl));
            reflectWish(); toast('הוסר מרשימת המשאלות'); return; }
        wl.push({ id, name:product.name, price:product.price, seller:sellerName, icon:product.icon,
            category:product.category, type:product.type, rating:product.rating, addedAt:Date.now() });
        localStorage.setItem('vero_wishlist',JSON.stringify(wl));
        reflectWish();
        // confirmation popup
        document.getElementById('confirmIcon').innerHTML='<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
        document.getElementById('confirmTitle').textContent='נוסף לרשימת המשאלות';
        document.getElementById('confirmSub').textContent='תוכל למצוא אותו באזור האישי';
        document.getElementById('confirmImg').src=images[0];
        document.getElementById('confirmName').textContent=product.name;
        document.getElementById('confirmPrice').textContent=fmt(priceNum);
        document.getElementById('confirmCta').textContent='לרשימה';
        document.getElementById('confirmCta').onclick=()=>location.href='saved.html';
        openSheet('confirmSheet');
    }
    function reflectWish(){
        const on=isWished();
        const btn=document.getElementById('wishBtn');
        btn.classList.toggle('active',on);
        document.getElementById('wishLabel').textContent = on?'ברשימת המשאלות ✓':'הוסף לרשימת המשאלות';
    }
    window.toggleWishlist=toggleWishlist;
    reflectWish();

    // ---------- offer ----------
    document.getElementById('offerSub').textContent = `מחיר מבוקש: ${fmt(priceNum)} · שלח למוכר הצעה`;
    const oq=document.getElementById('offerQuick');
    [0.7,0.8,0.9].forEach(f=>{
        const v=Math.max(1,Math.round(priceNum*f));
        const b=document.createElement('button');
        b.textContent=fmt(v).replace('.00','');
        b.onclick=()=>{ document.getElementById('offerInput').value=v; };
        oq.appendChild(b);
    });
    function sendOffer(){
        const input=document.getElementById('offerInput');
        const amount=parseFloat(input.value);
        if(!amount||amount<=0){ input.focus(); return; }
        const offers=JSON.parse(localStorage.getItem('vero_offers')||'[]');
        offers.push({ name:product.name, seller:sellerName, askPrice:priceNum, offer:amount, at:Date.now() });
        localStorage.setItem('vero_offers',JSON.stringify(offers));
        input.value=''; closeSheet('offerSheet');
        toast(`ההצעה נשלחה: ${fmt(amount)}`);
    }
    window.sendOffer=sendOffer;

    // ---------- message the seller (syncs to vero_chats inbox) ----------
    document.getElementById('msgSub').textContent = `שלח הודעה אל ${sellerName} על "${product.name}"`;
    function sendMessage(){
        const input=document.getElementById('msgInput');
        const text=(input.value||input.placeholder).trim();
        if(!text) return;
        const chats=JSON.parse(localStorage.getItem('vero_chats')||'{}');
        if(!chats[sellerName]) chats[sellerName]=[];
        chats[sellerName].push({ sender:'me', content:text, at:Date.now() });
        localStorage.setItem('vero_chats',JSON.stringify(chats));
        input.value=''; closeSheet('msgSheet');
        toast('ההודעה נשלחה למוכר');
    }
    window.sendMessage=sendMessage;

    // ---------- share ----------
    function shareUrl(){
        // A link back to this exact product listing.
        return location.href;
    }
    const shareText = `${product.name} · ${company} — ${fmt(priceNum)} | VERO`;
    const SHARES = [
        { key:'whatsapp', label:'WhatsApp', color:'#25D366',
          svg:'<path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.5-.3.3c-.1.1-.3.3-.1.6.1.3.7 1.1 1.4 1.8 1 .8 1.7 1.1 2 1.2.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/>',
          href:u=>`https://wa.me/?text=${encodeURIComponent(shareText+' '+u)}` },
        { key:'facebook', label:'Facebook', color:'#1877F2',
          svg:'<path fill="#1877F2" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/>',
          href:u=>`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}` },
        { key:'telegram', label:'Telegram', color:'#0088cc',
          svg:'<path fill="#0088cc" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 6.9l-1.6 7.6c-.1.5-.4.7-.9.4l-2.5-1.8-1.2 1.2c-.1.1-.3.2-.5.2l.2-2.6 4.7-4.2c.2-.2-.1-.3-.3-.1L8.4 13 6 12.2c-.5-.2-.5-.5.1-.8l9.3-3.6c.4-.2.8.1.6.9z"/>',
          href:u=>`https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(shareText)}` },
        { key:'x', label:'X', color:'#111010',
          svg:'<path fill="#111010" d="M17.5 3h3l-6.6 7.5L21.7 21h-6l-4.7-6.1L5.5 21h-3l7-8L2.7 3h6.1l4.2 5.6L17.5 3zm-1 16h1.6L8.1 4.6H6.4L16.5 19z"/>',
          href:u=>`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(u)}` },
        { key:'instagram', label:'Instagram', color:'#E1306C',
          svg:'<path fill="#E1306C" d="M12 7.2A4.8 4.8 0 1 0 12 16.8 4.8 4.8 0 0 0 12 7.2zm0 7.9A3.1 3.1 0 1 1 12 8.9a3.1 3.1 0 0 1 0 6.2zM17.9 6a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21 6.1c-.1-1.5-.4-2.8-1.5-3.9S17.1 1 15.6.9C14.1.8 9.9.8 8.4.9 6.9 1 5.6 1.3 4.5 2.4S3 4.5 2.9 6C2.8 7.5 2.8 11.7 2.9 13.2c.1 1.5.4 2.8 1.5 3.9s2.4 1.4 3.9 1.5c1.5.1 5.7.1 7.2 0 1.5-.1 2.8-.4 3.9-1.5s1.4-2.4 1.5-3.9c.1-1.5.1-5.7 0-7.1zm-2 8.7a3.1 3.1 0 0 1-1.8 1.8c-1.2.5-4.1.4-5.5.4s-4.3.1-5.5-.4a3.1 3.1 0 0 1-1.8-1.8c-.5-1.2-.4-4.1-.4-5.5s-.1-4.3.4-5.5a3.1 3.1 0 0 1 1.8-1.8C7.7 4 10.6 4.1 12 4.1s4.3-.1 5.5.4a3.1 3.1 0 0 1 1.8 1.8c.5 1.2.4 4.1.4 5.5s.1 4.3-.4 5.5z"/>',
          // Instagram has no web share intent — copy link so the user can paste into a story/DM.
          href:null },
        { key:'copy', label:'העתק קישור', color:'#111010',
          svg:'<path fill="none" stroke="#111010" stroke-width="1.6" d="M9 9h9v9H9zM6 15H3V3h12v3"/>',
          href:null }
    ];
    const grid=document.getElementById('shareGrid');
    grid.innerHTML=SHARES.map((s,i)=>
        `<button class="share-item" data-i="${i}">
            <span class="share-ic"><svg viewBox="0 0 24 24">${s.svg}</svg></span>
            <span>${s.label}</span></button>`).join('');
    grid.addEventListener('click',e=>{
        const b=e.target.closest('.share-item'); if(!b) return;
        const s=SHARES[+b.dataset.i]; const u=shareUrl();
        if(s.href){ window.open(s.href(u),'_blank','noopener'); }
        else if(s.key==='instagram'){
            if(navigator.share){ navigator.share({title:product.name,text:shareText,url:u}).catch(()=>{}); }
            else { copyLink(u); toast('הקישור הועתק — הדביקו באינסטגרם'); }
        } else { copyLink(u); toast('הקישור הועתק ✓'); }
    });
    function copyLink(u){
        if(navigator.clipboard) navigator.clipboard.writeText(u).catch(()=>{});
        else { const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    }
</script>
<!-- Manual edit mode (✎ button bottom-left) — same editor as the rest of the site. -->
<script src="vero-editor.js"></script>
</body>
