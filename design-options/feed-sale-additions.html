<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>moravchick — Feed sale additions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root { --oak:#2A331B; --img:url('../assets/hero/art-section-poster.jpg'); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins','Inter',sans-serif; background:#eceae6; color:#1c1c1c; padding:30px 20px 80px; }
    .page-head { max-width:1200px; margin:0 auto 6px; }
    .page-head h1 { font-family:'Bodoni Moda',Georgia,serif; font-weight:500; font-size:30px; }
    .page-head p { color:#6b6b66; font-size:14px; margin-top:8px; max-width:680px; line-height:1.6; }
    .grid { max-width:1300px; margin:28px auto 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:34px 26px; }
    .opt-label { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
    .opt-num { font-family:'Bodoni Moda',serif; font-size:17px; color:var(--oak); }
    .opt-name { font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
    .opt-desc { font-size:11.5px; color:#8a8a85; margin-top:3px; line-height:1.5; }

    .phone { position:relative; width:100%; aspect-ratio:390/748; border-radius:22px; overflow:hidden;
             background:#222 var(--img) center/cover no-repeat; color:#fff; box-shadow:0 14px 40px rgba(0,0,0,0.22); }
    .phone::after { content:''; position:absolute; inset:0; z-index:1;
        background:linear-gradient(160deg, rgba(42,51,27,0.42) 0%, rgba(20,26,14,0.3) 45%, rgba(10,12,6,0.82) 100%); }
    .phone > * { position:relative; z-index:2; }

    /* base centred group */
    .mid { position:absolute; left:0; right:0; top:46%; transform:translateY(-50%); display:flex; flex-direction:column;
           align-items:center; text-align:center; gap:14px; padding:0 26px; }
    .eyebrow { font-size:8.5px; font-weight:300; letter-spacing:5px; text-transform:uppercase; color:rgba(255,255,255,0.88); }
    .title { font-family:'Bodoni Moda',serif; font-weight:500; font-size:58px; line-height:0.95; letter-spacing:1px; }
    .sub { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.86); }
    .search { width:min(84%,300px); height:46px; display:flex; align-items:center; gap:9px; padding:0 14px; margin-top:4px;
        border:1px solid rgba(255,255,255,0.8); background:rgba(0,0,0,0.22); }
    .search svg { width:15px; height:15px; stroke:#fff; fill:none; opacity:0.85; }
    .search span { font-size:11px; color:rgba(255,255,255,0.7); }
    .slide { position:absolute; left:0; right:0; bottom:14px; z-index:3; text-align:center; font-size:8px; letter-spacing:5px;
        text-transform:uppercase; color:rgba(255,255,255,0.85); }

    /* ---- addition: countdown ---- */
    .add-count { position:absolute; left:0; right:0; top:15px; z-index:3; display:flex; justify-content:center; gap:10px; }
    .cd { display:flex; flex-direction:column; align-items:center; }
    .cd b { font-family:'Bodoni Moda',serif; font-weight:500; font-size:26px; line-height:1; }
    .cd small { font-size:7px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.65); margin-top:3px; }
    .cd-sep { font-family:'Bodoni Moda',serif; font-size:22px; opacity:0.6; }
    .cd-lead { width:100%; text-align:center; font-size:8px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,0.72); margin-bottom:8px; }

    /* ---- addition: category chips ---- */
    .add-chips { position:absolute; left:0; right:0; bottom:50px; z-index:3; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:0 22px; }
    .chip { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#fff; border:1px solid rgba(255,255,255,0.6);
        padding:8px 13px; background:rgba(0,0,0,0.2); }

    /* ---- addition: product strip ---- */
    .add-strip { position:absolute; left:0; right:0; bottom:44px; z-index:3; display:flex; gap:10px; padding:0 20px; justify-content:center; }
    .ps { width:84px; }
    .ps .ph { height:84px; background:#f1e9dc; display:grid; place-items:center; }
    .ps .ph svg { width:34px; height:34px; stroke:#9a8f7e; fill:none; stroke-width:1.1; }
    .ps .pp { margin-top:6px; font-size:10px; text-align:center; }
    .ps .pp s { color:rgba(255,255,255,0.5); margin-left:4px; font-size:8px; }

    /* ---- addition: count pill ---- */
    .add-pill { position:absolute; left:50%; transform:translateX(-50%); top:16px; z-index:3; font-size:8.5px; letter-spacing:3px;
        text-transform:uppercase; color:#fff; border:1px solid rgba(255,255,255,0.5); padding:7px 14px; border-radius:999px; }

    /* ---- addition: deal card ---- */
    .add-deal { position:absolute; left:20px; right:20px; bottom:42px; z-index:3; display:flex; align-items:center; gap:12px;
        background:rgba(16,19,10,0.78); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); padding:12px; }
    .add-deal .dph { width:56px; height:56px; background:#f1e9dc; flex:none; display:grid; place-items:center; }
    .add-deal .dph svg { width:26px; height:26px; stroke:#9a8f7e; fill:none; stroke-width:1.1; }
    .add-deal .dmeta b { display:block; font-size:7px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.6); }
    .add-deal .dmeta .dn { font-family:'Bodoni Moda',serif; font-size:16px; margin-top:3px; }
    .add-deal .dprice { margin-left:auto; text-align:right; }
    .add-deal .dprice b { font-size:15px; } .add-deal .dprice s { font-size:9px; color:rgba(255,255,255,0.5); display:block; }

    /* ---- addition: ribbon ---- */
    .add-ribbon { position:absolute; top:22px; left:-34px; z-index:3; transform:rotate(-45deg); background:#fff; color:#111;
        font-size:8px; letter-spacing:3px; text-transform:uppercase; font-weight:600; padding:5px 40px; }

    .shirtsvg { }
</style>
</head>
<body>
    <div class="page-head">
        <h1>Feed sale screen — additions</h1>
        <p>Six things we could add on top of the current sale panel (End of Season / Sale / search / discount slider). Each card shows one addition. Tell me which you want — you can pick more than one.</p>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        var SH = '<svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 4 4-3 2v10H7V9L4 7z"/></svg>';
        function base(extraTop, extraBottom) {
            return (extraTop||'') +
                '<div class="mid">' +
                    '<span class="eyebrow">End of Season</span>' +
                    '<span class="title">Sale</span>' +
                    '<span class="sub">Up to 70% off everything</span>' +
                    '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search the sale</span></div>' +
                '</div>' +
                (extraBottom||'') +
                '<div class="slide">Slide for more</div>';
        }
        var OPTS = [
            ['01','Countdown timer','A ticking "ends in" clock at the top — urgency.',
                '<div class="add-count"><span class="cd-lead">Sale ends in</span>' +
                '<div class="cd"><b>04</b><small>Days</small></div><span class="cd-sep">:</span>' +
                '<div class="cd"><b>12</b><small>Hrs</small></div><span class="cd-sep">:</span>' +
                '<div class="cd"><b>36</b><small>Min</small></div></div>', ''],
            ['02','Category chips','Quick links to the biggest sale categories.', '',
                '<div class="add-chips"><span class="chip">Coats</span><span class="chip">Knitwear</span><span class="chip">Boots</span><span class="chip">Bags</span></div>'],
            ['03','Items-on-sale pill','A live count — "128 pieces on sale".', '<div class="add-pill">128 pieces on sale</div>', ''],
            ['04','Featured sale strip','Three real sale pieces with their cut prices.', '',
                '<div class="add-strip">' +
                   '<div class="ps"><div class="ph">'+SH+'</div><div class="pp">₪90 <s>₪180</s></div></div>' +
                   '<div class="ps"><div class="ph">'+SH+'</div><div class="pp">₪130 <s>₪260</s></div></div>' +
                   '<div class="ps"><div class="ph">'+SH+'</div><div class="pp">₪75 <s>₪150</s></div></div>' +
                '</div>'],
            ['05','Deal of the day','One highlighted piece in a bottom card.', '',
                '<div class="add-deal"><div class="dph">'+SH+'</div><div class="dmeta"><b>Deal of the day</b><span class="dn">Wool Overcoat</span></div>' +
                '<div class="dprice"><b>₪390</b><s>₪980</s></div></div>'],
            ['06','Corner ribbon','A "Final days" ribbon across the corner.', '<div class="add-ribbon">Final days</div>', '']
        ];
        document.getElementById('grid').innerHTML = OPTS.map(function(o){
            return '<div class="opt"><div class="opt-label"><span class="opt-num">'+o[0]+'</span>' +
                '<span><span class="opt-name">'+o[1]+'</span><div class="opt-desc">'+o[2]+'</div></span></div>' +
                '<div class="phone">'+base(o[3],o[4])+'</div></div>';
        }).join('');
    </script>
</body>
</html>
