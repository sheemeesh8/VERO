<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats below card — options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@1,500&family=Oswald:wght@300;400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --oak:#2A331B; --ink:#16150f; --muted:#8f8d86; --soft:#5b5750; --page:#fff; --img:#F2F0EF; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Poppins',sans-serif;background:#f8f7f4;color:var(--ink);padding:30px 12px 70px;}
  h1{font-family:'Bodoni Moda',serif;font-weight:500;font-size:28px;max-width:520px;margin:0 auto;}
  .lede{color:var(--muted);font-size:12px;margin:6px auto 26px;max-width:520px;}
  .opt{max-width:520px;margin:0 auto 40px;}
  .opt-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;}
  .opt-n{font-family:'Bodoni Moda',serif;font-weight:500;font-size:14px;color:var(--oak);min-width:16px;}
  .opt-t{font-size:12px;font-weight:500;}
  .opt-d{font-size:10.5px;color:var(--muted);margin-left:auto;text-align:right;}
  .stage{background:var(--page);padding:12px 8px 14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* the card, as it is now minus the stats row */
  .card{position:relative;aspect-ratio:.7;background:var(--img);}
  .hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:'Oswald';font-weight:300;font-size:7.5px;letter-spacing:1.6px;color:#8a8a8a;}
  .pic{position:absolute;inset:0 0 56px 0;display:grid;place-items:center;font-size:50px;}
  .info{position:absolute;left:11px;right:11px;bottom:9px;}
  .info .r{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:5px;border-bottom:1px solid rgba(0,0,0,.22);}
  .b{font-family:'Bodoni Moda',serif;font-size:12px;text-transform:uppercase;}
  .pr{font-family:'Oswald';font-weight:300;font-size:11px;}
  .n{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:#6b6760;margin-top:5px;}

  svg{display:block;}
  .ic{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .st{display:flex;align-items:center;font-family:'Oswald';font-weight:300;font-size:10px;letter-spacing:.3px;color:var(--soft);}
  .st span{display:inline-flex;align-items:center;gap:3px;}

  /* 1 — Left, icons + numbers */
  .o1 .st{gap:12px;margin-top:7px;padding-left:2px;}
  /* 2 — Spread across the card's width */
  .o2 .st{justify-content:space-between;margin-top:7px;padding:0 4px;}
  /* 3 — Hairline above, centred */
  .o3 .st{justify-content:center;gap:16px;margin-top:6px;padding-top:6px;border-top:1px solid #e3e0d9;}
  /* 4 — Words, wide caps, no icons */
  .o4 .st{justify-content:space-between;margin-top:8px;font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);}
  .o4 .st b{font-weight:400;color:var(--ink);margin-right:3px;}
  /* 5 — Italic serif line */
  .o5 .st{margin-top:6px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:0;color:var(--soft);gap:6px;}
  .o5 .dot{width:2px;height:2px;border-radius:50%;background:#bdbab2;}
  /* 6 — Like on the right (tappable), counts on the left */
  .o6 .st{justify-content:space-between;margin-top:7px;padding:0 2px;}
  .o6 .st .l{display:flex;gap:11px;}
  .o6 .heart .ic{width:16px;height:16px;color:var(--oak);}
</style></head>
<body>
  <h1>Stats below the card — options</h1>
  <p class="lede">The saves · offers · views row moves out of the card to sit under it, on the page. The card itself goes back to just brand, price and name. Pick a number.</p>
  <div id="opts"></div>
<script>
  const H='<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
  const O='<path d="M4 5h16v11H9l-5 4V5z"/>';
  const V='<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  const ic=d=>`<svg class="ic" viewBox="0 0 24 24">${d}</svg>`;
  const items=[['Zara','₪49.90','Classic T-Shirt','👕',82,11,507],['H&amp;M','₪96.90','Modern T-Shirt','👗',18,2,139]];
  const card=i=>`<div class="card"><div class="hint">HOLD TO ADD TO</div><div class="pic">${i[3]}</div><div class="info"><div class="r"><span class="b">${i[0]}</span><span class="pr">${i[1]}</span></div><div class="n">${i[2]}</div></div></div>`;
  const rows={
    1:i=>`<div class="st"><span>${ic(H)}${i[4]}</span><span>${ic(O)}${i[5]}</span><span>${ic(V)}${i[6]}</span></div>`,
    2:i=>`<div class="st"><span>${ic(H)}${i[4]}</span><span>${ic(O)}${i[5]}</span><span>${ic(V)}${i[6]}</span></div>`,
    3:i=>`<div class="st"><span>${ic(H)}${i[4]}</span><span>${ic(O)}${i[5]}</span><span>${ic(V)}${i[6]}</span></div>`,
    4:i=>`<div class="st"><span><b>${i[4]}</b>saves</span><span><b>${i[5]}</b>offers</span><span><b>${i[6]}</b>views</span></div>`,
    5:i=>`<div class="st"><span>${i[4]} saves</span><span class="dot"></span><span>${i[5]} offers</span><span class="dot"></span><span>${i[6]} views</span></div>`,
    6:i=>`<div class="st"><span class="l"><span>${ic(O)}${i[5]}</span><span>${ic(V)}${i[6]}</span></span><span class="heart">${ic(H)}&nbsp;${i[4]}</span></div>`,
  };
  const meta=[[1,'Left row','icons + numbers, left under the card'],[2,'Spread','three marks across the card\'s width'],[3,'Hairline + centred','fine rule, then the row centred'],[4,'Wide caps','words, no icons — "82 SAVES"'],[5,'Italic line','one serif sentence, quiet'],[6,'Like on the right','counts left, the heart (save) right']];
  document.getElementById('opts').innerHTML=meta.map(([n,t,d])=>`
    <section class="opt o${n}"><div class="opt-h"><span class="opt-n">${n}</span><span class="opt-t">${t}</span><span class="opt-d">${d}</span></div>
      <div class="stage"><div class="grid">${items.map(i=>`<div>${card(i)}${rows[n](i)}</div>`).join('')}</div></div></section>`).join('');
</script>
</body></html>
