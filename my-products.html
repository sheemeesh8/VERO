<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Phone-only presentation: opened as a top-level window this page hands off to
         phone-frame.html. Inside a frame (window.top !== self) the check is skipped. -->
    <script>
      if (window.self === window.top) {
        var pf = location.pathname.split('/').pop() || 'index';
        if (!/\.html$/.test(pf)) pf += '.html';
        location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
      }
    </script>
    <title>moravchick — My Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- The shared product card — the same object the home feed uses. -->
    <link rel="stylesheet" href="product-card.css">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff; overflow-x: hidden;
        }

        /* Sticky page header — same pattern as the other personal-area pages. */
        .sticky-head {
            position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px;
            padding: calc(env(safe-area-inset-top, 0px) + 54px) 20px 20px;
            background: rgba(255,255,255,0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border-bottom: 1px solid #ececea;
        }
        .sh-back {
            width: 44px; height: 44px; border: 1px solid #e2e0da; border-radius: 50%; background: none;
            display: grid; place-items: center; cursor: pointer; color: #111; flex: none;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .sh-back svg { width: 22px; height: 22px; }
        .sh-back:hover { background: #111; color: #fff; border-color: #111; }
        .sh-title { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; color: #1b1916; }

        .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 110px; animation: fade 0.5s ease both; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .section { margin-top: 30px; }
        .section:first-child { margin-top: 8px; }
        .section-head {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 1px solid #111; padding-bottom: 12px;
        }
        .section-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        .section-note { font-size: 10px; letter-spacing: 0.5px; color: #9a9a95; }

        /* Same grid the home feed uses — two product cards per row on phones. */
        .prod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 18px; }
        @media (min-width: 620px) { .prod-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

        /* "Upload new" tile — shaped like a product card but a call to action. */
        .add-card {
            aspect-ratio: 1 / calc(1 / var(--pc-aspect, 0.7));
            border: 1.5px dashed #bdbcb6; border-radius: var(--pc-radius, 0px);
            background: var(--card-ground, #F2F0EF);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; color: #1c1c1c; cursor: pointer;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .add-card:hover { border-color: #111; transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.08); }
        .add-card .plus {
            width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #111;
            display: grid; place-items: center; font-size: 28px; font-weight: 200; line-height: 1;
        }
        .add-card .add-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

        /* Draft cell = the shared card + a publish button beneath it. */
        .draft-cell { display: flex; flex-direction: column; gap: 10px; }
        .draft-card { cursor: pointer; position: relative; }
        .draft-card .draft-badge {
            position: absolute; top: 10px; inset-inline-start: 10px; z-index: 3;
            padding: 5px 11px; border-radius: 999px; font-size: 8px; letter-spacing: 1.5px;
            text-transform: uppercase; font-weight: 500;
            border: 1px dashed #8a8a85; background: #fff; color: #8a8a85;
            font-family: 'Oswald', 'Segoe UI', sans-serif !important;
        }
        .draft-card .pe-edit {
            position: absolute; top: 10px; inset-inline-end: 10px; z-index: 4;
            width: 32px; height: 32px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; padding: 0;
            border: none; background: rgba(255,255,255,0.92); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.15s, background 0.2s;
        }
        .draft-card .pe-edit:hover { transform: scale(1.08); background: #fff; }
        .draft-card .pe-edit svg { width: 16px; height: 16px; fill: none; stroke: #1c1c1c; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
        .publish-btn {
            width: 100%; border: 1.4px solid #111; background: #111; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 11px 12px; border-radius: 999px; transition: background 0.2s, color 0.2s;
        }
        .publish-btn:hover { background: #fff; color: #111; }

        .empty {
            margin-top: 16px; padding: 34px; border: 1px dashed #cfcfca; text-align: center;
            color: #9a9a95; font-size: 11.5px; letter-spacing: 0.3px; border-radius: 12px;
        }
    </style>
</head>
<body>
    <header class="sticky-head">
        <button class="sh-back" type="button" aria-label="Back" onclick="(window.history.length > 1 ? window.history.back() : (location.href='seller-area.html'))">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="sh-title">My Products</span>
    </header>

    <main class="wrap">
        <!-- 1 · Add a new product -->
        <section class="section">
            <div class="section-head">
                <span class="section-title">Add</span>
            </div>
            <div class="prod-grid">
                <a class="add-card" href="upload-start.html">
                    <span class="plus">+</span>
                    <span class="add-label">Upload new product</span>
                </a>
            </div>
        </section>

        <!-- 2 · Drafts -->
        <section class="section">
            <div class="section-head">
                <span class="section-title">Drafts</span>
                <span class="section-note" id="draftNote">0 drafts</span>
            </div>
            <div class="prod-grid" id="draftGrid"></div>
            <div class="empty" id="draftEmpty" style="display:none;">No drafts saved yet. Tap “Save as draft” on the upload page and it will appear here.</div>
        </section>

        <!-- 3 · Published products -->
        <section class="section">
            <div class="section-head">
                <span class="section-title">My products</span>
                <span class="section-note" id="prodNote">0 items</span>
            </div>
            <div class="prod-grid" id="prodGrid"></div>
            <div class="empty" id="prodEmpty" style="display:none;">No products yet. Upload your first piece above.</div>
        </section>
    </main>

    <script src="assets/footer.js"></script>
    <script>
    (function myProducts() {
        try { localStorage.setItem('vero_active_account', 'seller'); } catch (e) {}
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]);
        const nis = n => (n != null && n !== '') ? '₪' + (Number(n) || 0).toLocaleString('en-US') : 'No price yet';
        const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        // Same image resolution the product page uses: cut-out first, then any photo.
        const imgOf = p => p.processed_cover || p.image || p.cover || p.original_cover
            || (Array.isArray(p.photos) ? p.photos.find(Boolean) : (p.photos && (p.photos.cover || p.photos.detail))) || null;

        // ---------- PUBLISHED PRODUCTS (vero_listings) ----------
        function productCard(p, idx) {
            const src = imgOf(p);
            const fig = src ? `<img class="pc-photo" src="${esc(src)}" alt="${esc(p.name || '')}" draggable="false">` : esc(p.icon || '🛍️');
            const href = `product-edit.html?i=${idx}&from=seller`;
            return `
                <a class="product-card" href="${href}" title="Edit ${esc(p.name || 'product')}">
                    <div class="product-image">${fig}</div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price"><span class="vprice">${nis(p.price)}</span></div>
                        </div>
                        <div class="pc-right">
                            <div class="product-seller">${esc(p.seller || p.brand || 'My store')}</div>
                            <div class="product-name">${esc(p.name || p.title || 'Item')}</div>
                            <div class="product-rating">${esc(p.category || '')}</div>
                        </div>
                    </div>
                </a>`;
        }
        function renderProducts() {
            let listings = readJSON('vero_listings', []);
            if (!Array.isArray(listings)) listings = [];
            const active = listings.filter(p => p && (p.status === 'active' || p.status == null));
            const grid = document.getElementById('prodGrid');
            grid.innerHTML = active.map((p) => productCard(p, listings.indexOf(p))).join('');
            document.getElementById('prodNote').textContent = `${active.length} item${active.length === 1 ? '' : 's'}`;
            document.getElementById('prodEmpty').style.display = active.length ? 'none' : 'block';
        }

        // ---------- DRAFTS (vero_drafts) ----------
        function draftCard(p, i) {
            const src = imgOf(p);
            const fig = src ? `<img class="pc-photo" src="${esc(src)}" alt="" draggable="false">` : (p.category === 'art' ? '🖼️' : '🛍️');
            const cat = p.category === 'art' ? 'Art' : p.category === 'clothing' ? 'Clothing' : '—';
            return `
                <div class="draft-cell">
                    <div class="product-card draft-card" data-i="${i}" role="button" tabindex="0" title="Continue this draft">
                        <div class="product-image">${fig}
                            <span class="draft-badge">Draft</span>
                            <span class="pe-edit" data-act="edit" data-i="${i}" title="Edit draft" aria-label="Edit draft">
                                <svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z"></path><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"></line></svg>
                            </span>
                            <button class="product-icon remove" title="Delete draft" data-act="delete" data-i="${i}">
                                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                        <div class="product-info">
                            <div class="pc-left">
                                <div class="product-price"><span class="vprice">${nis(p.price)}</span></div>
                            </div>
                            <div class="pc-right">
                                <div class="product-seller">${esc(p.brand || 'Draft')}</div>
                                <div class="product-name">${esc(p.itemType || cat)}</div>
                                <div class="product-rating">Saved · ${fmtDate(p.savedAt)}</div>
                            </div>
                        </div>
                    </div>
                    <button class="publish-btn" data-act="publish" data-i="${i}">Publish to feed ↑</button>
                </div>`;
        }
        function titleOf(d) { return [d.brand, d.itemType].filter(Boolean).join(' ') || 'Untitled draft'; }
        function renderDrafts() {
            let drafts = readJSON('vero_drafts', []);
            if (!Array.isArray(drafts)) drafts = [];
            const grid = document.getElementById('draftGrid');
            grid.innerHTML = drafts.map((p, i) => draftCard(p, i)).join('');
            document.getElementById('draftNote').textContent = `${drafts.length} draft${drafts.length === 1 ? '' : 's'}`;
            document.getElementById('draftEmpty').style.display = drafts.length ? 'none' : 'block';
        }

        // ---------- Draft actions (continue / edit / delete / publish) ----------
        document.getElementById('draftGrid').addEventListener('click', (e) => {
            let drafts = readJSON('vero_drafts', []);
            if (!Array.isArray(drafts)) drafts = [];
            const del = e.target.closest('[data-act="delete"]');
            if (del) {
                e.preventDefault(); e.stopPropagation();
                drafts.splice(Number(del.dataset.i), 1); save('vero_drafts', drafts);
                renderDrafts(); return;
            }
            const pub = e.target.closest('[data-act="publish"]');
            if (pub) {
                e.preventDefault(); e.stopPropagation();
                const i = Number(pub.dataset.i); const d = drafts[i]; if (!d) return;
                let listings = readJSON('vero_listings', []); if (!Array.isArray(listings)) listings = [];
                listings.unshift({
                    id: 'l' + Date.now(), name: titleOf(d), seller: d.brand || 'You', brand: d.brand || '',
                    category: d.itemType || (d.category === 'art' ? 'Art' : 'Clothing'),
                    price: Number(d.price) || 0, image: imgOf(d) || null,
                    icon: d.category === 'art' ? '🖼️' : '🛍️', description: d.description || '',
                    status: 'active', listedAt: Date.now(),
                });
                save('vero_listings', listings);
                drafts.splice(i, 1); save('vero_drafts', drafts);
                renderDrafts(); renderProducts(); return;
            }
            // Anywhere else on the card (incl. the pencil) → continue the draft.
            const card = e.target.closest('.product-card'); if (!card) return;
            const i = Number(card.dataset.i); if (!drafts[i]) return;
            save('vero_resume_draft', drafts[i]);
            window.location.href = 'index.html';
        });

        renderDrafts();
        renderProducts();
    })();
    </script>
</body>
</html>
