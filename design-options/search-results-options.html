<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Results Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --line: #e4e1dc; --ring: #E8842B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
h2 { font-size: 15px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: #55514a; margin: 40px 0 20px; direction: rtl; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 10px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 560px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 728px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); padding: 0 24px; }
.sbar { display: flex; align-items: center; gap: 12px; padding: 40px 0 12px; border-bottom: 1.5px solid #111; }
.sbar .q { flex: 1; font-size: 16px; }
.sbar svg { width: 20px; height: 20px; stroke: #111; stroke-width: 1.3; fill: none; }
.rhead { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 18px 0 14px; display: flex; justify-content: space-between; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.2); }
.av { display: block; }
.money { font-variant-numeric: tabular-nums; }
.stars { color: var(--ring); font-size: 11px; letter-spacing: 1px; }

/* ===== PRODUCT ===== */
/* PA current grid */
.pa .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pa .c .th { aspect-ratio: 3/4; }
.pa .c .nm { font-size: 13px; margin-top: 7px; display: flex; justify-content: space-between; }
.pa .c .sl { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

/* PB list rows */
.pb .row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.pb .row .th { width: 60px; height: 76px; flex: none; }
.pb .nm { flex: 1; } .pb .nm b { font-weight: 400; font-size: 15px; display: block; } .pb .nm small { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.pb .pr { font-size: 15px; }

/* PC editorial one per row */
.pc .item { margin-bottom: 20px; } .pc .th { height: 220px; }
.pc .line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
.pc .nm { font-size: 20px; } .pc .pr { font-size: 15px; }
.pc .sl { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

/* PD overlay price */
.pd .g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pd .c { position: relative; } .pd .c .th { aspect-ratio: 3/4; }
.pd .c .tag { position: absolute; left: 0; bottom: 0; background: #fff; font-size: 12px; padding: 4px 9px; }
.pd .c .nm { font-size: 11px; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; color: #444; }

/* ===== SELLER ===== */
/* SA current avatar circles */
.sa .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px 10px; justify-items: center; margin-top: 8px; }
.sa .u { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 74px; }
.sa .av { width: 62px; height: 62px; border-radius: 50%; padding: 3px; border: 2px solid var(--ring); }
.sa .av .th { width: 100%; height: 100%; border-radius: 50%; }
.sa .nm { font-size: 10px; letter-spacing: 0.4px; text-align: center; line-height: 1.3; }

/* SB list rows with follow */
.sb .row { display: flex; align-items: center; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.sb .av { width: 50px; height: 50px; border-radius: 50%; flex: none; } .sb .av .th { width: 100%; height: 100%; border-radius: 50%; }
.sb .bd { flex: 1; min-width: 0; } .sb .bd b { font-weight: 400; font-size: 15px; display: block; }
.sb .bd small { font-size: 11px; color: var(--muted); } .sb .bd .stars { margin-top: 2px; }
.sb .fol { border: 1px solid #111; padding: 8px 16px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }

/* SC seller cards with product peek */
.sc .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.sc .top { display: flex; align-items: center; gap: 12px; }
.sc .av { width: 46px; height: 46px; border-radius: 50%; flex: none; } .sc .av .th { width: 100%; height: 100%; border-radius: 50%; }
.sc .nm { flex: 1; } .sc .nm b { font-weight: 400; font-size: 15px; display: block; } .sc .nm small { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.sc .fol { border: 1px solid #111; padding: 7px 14px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.sc .peek { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.sc .peek .th { aspect-ratio: 1/1; }

/* SD cover cards 2-up */
.sd .g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sd .card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sd .cover { height: 76px; background: #ddd center/cover; filter: grayscale(0.3); }
.sd .mid { text-align: center; padding: 0 10px 12px; margin-top: -24px; }
.sd .av { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; margin: 0 auto; } .sd .av .th { width: 100%; height: 100%; border-radius: 50%; }
.sd .nm { font-size: 13px; margin-top: 7px; } .sd .meta { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
<h1>Search — השלב הבא (תוצאות)</h1>
<p class="sub">מה שמופיע אחרי החיפוש · 4 אופציות למוצרים + 4 למוכרים</p>

<h2>— תוצאות מוצר —</h2>
<div class="grid" id="prod"></div>

<h2>— תוצאות מוכרים —</h2>
<div class="grid" id="sell"></div>

<script>
var P = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      pos: '50% 30%' },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Linen Overshirt', s: 'Atelier Nord', p: 340, img: '../women-hero.jpg',    pos: '20% 40%' },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    pos: '50% 50%' },
  { n: 'Denim Jacket',    s: 'Denim Lab',    p: 450, img: '../gallery-hero.jpg',  pos: '50% 50%' },
  { n: 'Leather Belt',    s: 'Milano Feet',  p: 190, img: '../magazine-hero.jpg', pos: '50% 50%' }
];
var S = [
  { n: 'Atelier Nord', h: '@ateliernord', r: '4.8', it: 42, img: '../men-hero.jpg',    pos: '50% 30%' },
  { n: 'Sole Society', h: '@solesociety', r: '4.6', it: 28, img: '../clothing-hero.jpg', pos: '50% 50%' },
  { n: 'Studio Vero',  h: '@studiovero',  r: '4.9', it: 15, img: '../women-hero.jpg',  pos: '20% 40%' },
  { n: 'Denim Lab',    h: '@denimlab',    r: '4.4', it: 33, img: '../gallery-hero.jpg', pos: '50% 50%' }
];
var m = v => '₪' + v.toLocaleString('en-US');
var bg = (o) => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var MAG = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
var sbar = (q) => '<div class="sbar"><span class="q">' + q + '</span>' + MAG + '</div>';
var STAR = '★★★★☆';

var PROD = [
  ['PA · גריד (הקיים)', 'שני כרטיסי מוצר בשורה עם כותרת "Matching pieces". לנקודת השוואה.',
   '<div class="screen pa">' + sbar('coat') + '<div class="rhead"><span>Matching pieces</span><span>6</span></div><div class="g">' +
   P.slice(0,4).map(c => '<div class="c"><div class="th" ' + bg(c) + '></div><div class="nm"><span>' + c.n + '</span><span class="money">' + m(c.p) + '</span></div><div class="sl">' + c.s + '</div></div>').join('') + '</div></div>'],

  ['PB · רשימת שורות', 'שורה לכל מוצר: תמונה קטנה, שם, מוכר ומחיר. מציג יותר תוצאות במסך, מהיר לסריקה.',
   '<div class="screen pb">' + sbar('coat') + '<div class="rhead"><span>6 results</span><span>Sort ⌄</span></div>' +
   P.map(c => '<div class="row"><div class="th" ' + bg(c) + '></div><div class="nm"><b>' + c.n + '</b><small>' + c.s + '</small></div><div class="pr money">' + m(c.p) + '</div></div>').join('') + '</div>'],

  ['PC · עריכתי (אחד בשורה)', 'תמונה גדולה לכל מוצר, שם ומחיר מתחת. פחות תוצאות במסך אבל הכי "אופנה".',
   '<div class="screen pc">' + sbar('coat') + '<div class="rhead"><span>Matching pieces</span><span>6</span></div>' +
   P.slice(0,3).map(c => '<div class="item"><div class="th" ' + bg(c) + '></div><div class="line"><span class="nm">' + c.n + '</span><span class="pr money">' + m(c.p) + '</span></div><div class="sl">' + c.s + '</div></div>').join('') + '</div>'],

  ['PD · מחיר על התמונה', 'גריד צפוף יותר, מחיר כתווית לבנה בפינת התמונה והשם מתחת. ויזואלי ונקי.',
   '<div class="screen pd">' + sbar('coat') + '<div class="rhead"><span>Matching pieces</span><span>6</span></div><div class="g">' +
   P.slice(0,6).map(c => '<div class="c"><div class="th" ' + bg(c) + '><span class="tag money">' + m(c.p) + '</span></div><div class="nm">' + c.n + '</div></div>').join('') + '</div></div>']
];

var SELL = [
  ['SA · עיגולים (הקיים)', 'ארבעה אווטארים בשורה עם טבעת כתומה והשם מתחת, בסגנון סטורי. לנקודת השוואה.',
   '<div class="screen sa">' + sbar('atelier') + '<div class="rhead"><span>Sellers</span><span>4</span></div><div class="g">' +
   S.concat(S).slice(0,8).map(u => '<div class="u"><span class="av"><span class="th" ' + bg(u) + '></span></span><span class="nm">' + u.n + '</span></div>').join('') + '</div></div>'],

  ['SB · רשימה + Follow', 'שורה לכל מוכר: אווטאר, שם, @, דירוג וכפתור Follow. הכי אינפורמטיבי ופעולתי.',
   '<div class="screen sb">' + sbar('atelier') + '<div class="rhead"><span>Sellers</span><span>4</span></div>' +
   S.map(u => '<div class="row"><span class="av"><span class="th" ' + bg(u) + '></span></span><div class="bd"><b>' + u.n + '</b><small>' + u.h + ' · ' + u.it + ' items</small><div class="stars">' + STAR + ' <span style="color:#8a877f">' + u.r + '</span></div></div><span class="fol">Follow</span></div>').join('') + '</div>'],

  ['SC · כרטיס עם הצצה', 'כרטיס לכל מוכר עם אווטאר, דירוג, Follow, ושלוש תמונות מוצר שלו. נותן תחושה של החנות.',
   '<div class="screen sc">' + sbar('atelier') + '<div class="rhead"><span>Sellers</span><span>4</span></div>' +
   S.slice(0,2).map((u,k) => '<div class="card"><div class="top"><span class="av"><span class="th" ' + bg(u) + '></span></span><div class="nm"><b>' + u.n + '</b><small>' + u.h + ' · ★ ' + u.r + '</small></div><span class="fol">Follow</span></div><div class="peek">' +
     P.slice(k*3, k*3+3).map(c => '<div class="th" ' + bg(c) + '></div>').join('') + '</div></div>').join('') + '</div>'],

  ['SD · כרטיסי קאבר 2 בשורה', 'כרטיס עם תמונת קאבר, אווטאר עליה, שם, דירוג ומספר פריטים. קומפקטי ומזמין.',
   '<div class="screen sd">' + sbar('atelier') + '<div class="rhead"><span>Sellers</span><span>4</span></div><div class="g">' +
   S.map(u => '<div class="card"><div class="cover" ' + bg(u) + '></div><div class="mid"><span class="av"><span class="th" ' + bg(u) + '></span></span><div class="nm">' + u.n + '</div><div class="meta">★ ' + u.r + ' · ' + u.it + ' items</div></div></div>').join('') + '</div></div>']
];

var render = (host, arr) => document.getElementById(host).innerHTML = arr.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
render('prod', PROD);
render('sell', SELL);
</script>
</body>
</html>
