<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: #8a877f; font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; align-items: flex-start; }
.opt { width: 330px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: #8a877f; line-height: 1.5; margin-top: 4px; }

.phone { width: 330px; border-radius: 26px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; transform: scale(0.8462); transform-origin: top left; position: relative; overflow: hidden; background: #fff; color: #111; }
.ph { height: 660px; } /* phone frame height = screen height * scale; set per option via JS */
.money { font-variant-numeric: tabular-nums; }
.imgbg { background: #e7e4dd center / cover no-repeat; }
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.v { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--v); color: #fff; font-size: 10px; font-weight: 700; vertical-align: middle; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; padding: 40px 22px 0; }
.bar .t { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* product grid */
.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 22px 28px; }
.pc .im { aspect-ratio: 3/4; }
.pc .nm { font-size: 12px; margin-top: 7px; display: flex; justify-content: space-between; }
.pc .sl { font-size: 8.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #8a877f; margin-top: 2px; }

/* tabs */
.tabs { display: flex; gap: 22px; padding: 0 22px; border-bottom: 1px solid #eee; }
.tabs span { padding: 14px 0; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #9a958c; }
.tabs span.on { color: #111; border-bottom: 2px solid #111; }

/* ===== A — editorial: cover + overlapping avatar ===== */
.a .cover { height: 230px; position: relative; }
.a .cover .wash { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.5)); }
.a .cover .bar { color: #fff; position: relative; z-index: 2; }
.a .av { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; position: absolute; left: 22px; top: 182px; z-index: 3; }
.a .head { padding: 56px 22px 0; }
.a .nm { font-size: 26px; } .a .bio { font-size: 12.5px; color: #555; margin-top: 4px; }
.a .acts { display: flex; gap: 10px; margin-top: 14px; }
.a .acts span { flex: 1; text-align: center; padding: 12px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #111; }
.a .acts span.fill { background: #111; color: #fff; }
.a .stats { display: flex; margin: 18px 22px 16px; }
.a .stats .st { flex: 1; } .a .stats .st b { display: block; font-size: 18px; } .a .stats .st span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #8a877f; }

/* ===== B — magazine hero (dark) ===== */
.b { background: #111; color: #fff; }
.b .hero { height: 440px; position: relative; }
.b .hero .wash { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.05) 40%, #111); }
.b .bar { color: #fff; position: relative; z-index: 2; }
.b .av { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #fff; position: absolute; top: 90px; left: 22px; z-index: 2; }
.b .cap { position: absolute; left: 22px; right: 22px; bottom: 26px; z-index: 2; }
.b .kick { font-size: 8.5px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.8; }
.b .nm { font-size: 44px; line-height: 0.98; margin-top: 8px; }
.b .stats { display: flex; gap: 26px; margin-top: 18px; }
.b .stats .st b { font-size: 17px; } .b .stats .st span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; display: block; }
.b .tabs { border-color: #262626; } .b .tabs span { color: #777; } .b .tabs span.on { color: #fff; border-color: #fff; }
.b .pc .nm { color: #fff; } .b .pc .sl { color: #888; }

/* ===== C — fine line, centred arch avatar ===== */
.c .cover { height: 120px; }
.c .bar { color: #fff; position: relative; z-index: 2; }
.c .av { width: 120px; height: 150px; border-radius: 70px 70px 14px 14px; border: 1px solid #111; margin: -70px auto 0; position: relative; z-index: 2; }
.c .head { text-align: center; padding: 14px 22px 0; }
.c .nm { font-size: 22px; letter-spacing: 1px; } .c .bio { font-size: 12px; color: #8a877f; margin-top: 4px; }
.c .acts { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.c .acts span { padding: 10px 20px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #111; }
.c .acts span.fill { background: #111; color: #fff; }
.c .stats { display: flex; margin: 20px 22px 0; padding-top: 16px; border-top: 1px solid #111; }
.c .stats .st { flex: 1; text-align: center; } .c .stats .st b { display: block; font-size: 19px; font-weight: 400; } .c .stats .st span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #8a877f; }
.c .tabs { justify-content: center; border: none; margin-top: 14px; }

/* ===== D — social card storefront ===== */
.d { background: #f6f5f1; }
.d .cover { height: 150px; }
.d .card { background: #fff; margin: -40px 18px 0; border-radius: 18px; padding: 0 20px 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
.d .av { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; margin: -42px 0 0; }
.d .nm { font-size: 22px; margin-top: 10px; } .d .bio { font-size: 12px; color: #666; margin-top: 4px; }
.d .stats { display: flex; margin-top: 16px; }
.d .stats .st { flex: 1; } .d .stats .st b { display: block; font-size: 17px; } .d .stats .st span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #8a877f; }
.d .acts { display: flex; gap: 10px; margin-top: 16px; }
.d .acts span { flex: 1; text-align: center; padding: 11px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; border-radius: 10px; }
.d .acts span.fill { background: #111; color: #fff; } .d .acts span.out { border: 1px solid #ddd; }
.d .tabs { background: #fff; margin: 14px 18px 0; border-radius: 14px 14px 0 0; border: none; }
.d .pg { background: #fff; margin: 0 18px; border-radius: 0 0 14px 14px; }
.d .pc .im { border-radius: 10px; }
</style>
</head>
<body>
<h1>Storefront — עיצוב מחדש</h1>
<p class="sub">עמוד הפרופיל/חנות המלא · 4 כיוונים</p>
<div class="grid" id="grid"></div>

<script>
var P = [
  { n: 'Wool Overcoat', p: 980, img: '../men-hero.jpg', pos: '50% 30%' },
  { n: 'Chelsea Boots', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Linen Overshirt', p: 340, img: '../women-hero.jpg', pos: '20% 40%' },
  { n: 'Silk Scarf', p: 210, img: '../hero-beach.jpg', pos: '50% 50%' }
];
var m = v => '₪' + v.toLocaleString('en-US');
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var ARR = '<svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var SHR = '<svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var avbeach = 'class="av imgbg" style="background-image:url(\'../women-hero.jpg\');background-position:50% 24%"';
var cov = 'class="cover imgbg" style="background-image:url(\'../hero-beach.jpg\')"';
function grid(cls) { return '<div class="pg">' + P.map(i => '<div class="pc"><div class="im imgbg" ' + bg(i) + '></div><div class="nm"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div>').join('') + '</div>'; }
function statsA() { return '<div class="stats"><div class="st"><b>248</b><span>Followers</span></div><div class="st"><b>32</b><span>Items</span></div><div class="st"><b>4.9 ★</b><span>Rating</span></div></div>'; }
var tabs = '<div class="tabs"><span class="on">Items</span><span>Sold</span><span>Reviews</span><span>About</span></div>';

var OPTS = [
  ['A · עריכתי — קאבר + אווטאר', 'קאבר למעלה, אווטאר חוצה אותו, שם+ביו, כפתורי Follow/Message, סטטיסטיקות, לשוניות וגריד מוצרים. מאוזן ומוכר.',
   '<div class="screen a"><div ' + cov + '><div class="wash"></div><div class="bar"><span>&#8249;</span>' + SHR + '</div></div>' +
   '<span ' + avbeach + '></span><div class="head"><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion · Tel Aviv</div>' +
   '<div class="acts"><span class="fill">Follow</span><span>Message</span></div></div>' + statsA() + tabs + grid() + '</div>', 980],

  ['B · מגזין כהה', 'הירו מלא עם שם ענק ואווטאר קטן, סטטיסטיקות, לשוניות וגריד על רקע שחור. יוקרתי ובוטיקי.',
   '<div class="screen b"><div ' + cov.replace('cover','hero') + '><div class="wash"></div><div class="bar"><span>&#8249;</span>' + SHR + '</div>' +
   '<span ' + avbeach + '></span><div class="cap"><div class="kick">Seller · Verified · Tel Aviv</div><div class="nm">Studio<br>Vero</div>' +
   '<div class="stats"><div class="st"><b>248</b><span>Followers</span></div><div class="st"><b>32</b><span>Items</span></div><div class="st"><b>4.9★</b><span>Rating</span></div></div></div></div>' +
   tabs + grid() + '</div>', 980],

  ['C · קו דק, אווטאר קשת', 'קאבר נמוך, אווטאר בצורת קשת ממורכז, הכול מרווח בקו דק. לשוניות כטקסט וגריד. אלגנטי ומאופק.',
   '<div class="screen c"><div ' + cov + '><div class="bar"><span>&#8249;</span>' + SHR + '</div></div>' +
   '<span ' + avbeach + '></span><div class="head"><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion</div>' +
   '<div class="acts"><span class="fill">Follow</span><span>Message</span></div>' + statsA() + '</div>' + tabs + grid() + '</div>', 1010],

  ['D · כרטיס חברתי', 'קאבר, כרטיס לבן צף עם אווטאר, כפתורים מעוגלים, לשוניות וגריד בתוך כרטיס. רך ומודרני בסגנון אפליקציה.',
   '<div class="screen d"><div ' + cov + '><div class="bar" style="color:#fff"><span>&#8249;</span>' + SHR + '</div></div>' +
   '<div class="card"><span ' + avbeach + '></span><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion · Tel Aviv</div>' +
   '<div class="stats"><div class="st"><b>248</b><span>Followers</span></div><div class="st"><b>32</b><span>Items</span></div><div class="st"><b>4.9★</b><span>Rating</span></div></div>' +
   '<div class="acts"><span class="fill">Follow</span><span class="out">Message</span></div></div>' + tabs + grid() + '</div>', 1030]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone" style="height:' + Math.round(o[3] * 0.8462) + 'px"><div class="scroll">' + o[2] + '</div></div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
