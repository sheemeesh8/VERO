<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed Calendar Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Oswald:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; --ink: #111; --sage: #5c7a5c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 560px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 728px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fbfaf8; padding: 26px 24px 0; }
.screen.dark { background: #15130f; color: #efe9da; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.2); }
.kick { font-family: 'Oswald', sans-serif; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.month { font-family: 'Bodoni Moda', Georgia, serif; font-size: 34px; font-weight: 400; margin-top: 6px; }
.rule { height: 1px; background: var(--line); margin: 14px 0; } .dark .rule { background: #3a362d; }
.tag { font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; background: #e7efe4; color: var(--sage); padding: 4px 8px; border-radius: 3px; }
.ev-t { font-family: 'Bodoni Moda', Georgia, serif; font-size: 22px; } .ev-d { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.ev-meta { display: flex; gap: 18px; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1px; color: #555; margin-top: 10px; }

/* C1 month grid (current) */
.c1 .dow, .c1 .cell { text-align: center; }
.c1 .cal { display: grid; grid-template-columns: repeat(7, 1fr); direction: ltr; margin-top: 6px; }
.c1 .dow { font-family: 'Oswald', sans-serif; font-size: 9px; color: var(--muted); padding-bottom: 8px; }
.c1 .cell { font-family: 'Bodoni Moda', Georgia, serif; font-size: 13px; color: #555; padding: 9px 0; position: relative; }
.c1 .cell.today { color: #111; } .c1 .cell.today::after { content: ''; position: absolute; left: 50%; top: 46%; width: 28px; height: 28px; transform: translate(-50%,-50%); border: 1px solid #111; border-radius: 50%; }
.c1 .cell .dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* C2 week strip */
.c2 .strip { display: flex; gap: 8px; margin-top: 10px; }
.c2 .d { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line); position: relative; }
.c2 .d .dw { font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 1px; color: var(--muted); }
.c2 .d .dn { font-family: 'Bodoni Moda', serif; font-size: 18px; margin-top: 4px; }
.c2 .d.on { background: #111; color: #fff; border-color: #111; } .c2 .d.on .dw { color: rgba(255,255,255,0.7); }
.c2 .d .dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.c2 .card { margin-top: 16px; display: flex; gap: 12px; }
.c2 .card .th { width: 96px; height: 96px; border-radius: 8px; flex: none; }

/* C3 agenda list */
.c3 .row { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.c3 .date { text-align: center; width: 44px; flex: none; }
.c3 .date .dn { font-family: 'Bodoni Moda', serif; font-size: 24px; } .c3 .date .dm { font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.c3 .bd b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 17px; display: block; }
.c3 .bd small { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); display: block; margin-top: 3px; }

/* C4 event cards carousel */
.c4 .rail { display: flex; gap: 12px; overflow: hidden; margin-top: 12px; }
.c4 .c { width: 150px; flex: none; }
.c4 .c .img { height: 160px; border-radius: 8px; overflow: hidden; position: relative; }
.c4 .c .img .th { height: 100%; filter: grayscale(0.25) brightness(0.9); }
.c4 .c .badge { position: absolute; left: 10px; top: 10px; background: #fff; text-align: center; border-radius: 6px; padding: 5px 8px; z-index: 1; }
.c4 .c .badge .dn { font-family: 'Bodoni Moda', serif; font-size: 18px; line-height: 1; } .c4 .c .badge .dm { font-family: 'Oswald', sans-serif; font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.c4 .c b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 15px; display: block; margin-top: 9px; }
.c4 .c small { font-family: 'Oswald', sans-serif; font-size: 10px; color: var(--muted); }

/* C5 timeline */
.c5 .tl { margin-top: 14px; padding-left: 20px; position: relative; }
.c5 .tl::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.c5 .ev { position: relative; padding: 0 0 20px; }
.c5 .ev::before { content: ''; position: absolute; left: -20px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
.c5 .ev .dt { font-family: 'Oswald', sans-serif; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
.c5 .ev b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 18px; display: block; margin: 3px 0 2px; }
.c5 .ev small { font-size: 11px; color: var(--muted); }

/* C6 next-event spotlight + mini peek */
.c6 .spot { position: relative; height: 230px; border-radius: 10px; overflow: hidden; color: #fff; margin-top: 8px; }
.c6 .spot .th { position: absolute; inset: 0; filter: grayscale(0.2) brightness(0.62); }
.c6 .spot .in { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1; }
.c6 .spot .chip { display: inline-block; background: rgba(255,255,255,0.9); color: #111; font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.c6 .spot b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 26px; display: block; margin: 8px 0 2px; }
.c6 .spot small { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1px; opacity: 0.9; }
.c6 .next { display: flex; gap: 10px; margin-top: 14px; }
.c6 .next .n { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.c6 .next .dn { font-family: 'Bodoni Moda', serif; font-size: 16px; } .c6 .next small { font-family: 'Oswald', sans-serif; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); display: block; margin-top: 4px; }

/* C7 dark month */
.c7 .cal { display: grid; grid-template-columns: repeat(7, 1fr); direction: ltr; margin-top: 8px; }
.c7 .dow { font-family: 'Oswald', sans-serif; font-size: 9px; color: #7a756b; text-align: center; padding-bottom: 8px; }
.c7 .cell { font-family: 'Bodoni Moda', serif; font-size: 13px; color: #bbb3a5; text-align: center; padding: 9px 0; position: relative; }
.c7 .cell.today { color: #15130f; } .c7 .cell.today::after { content: ''; position: absolute; left: 50%; top: 46%; width: 28px; height: 28px; transform: translate(-50%,-50%); background: var(--accent); border-radius: 50%; z-index: -1; }
.c7 .cell .dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* C8 date pills + image event */
.c8 .pills { display: flex; gap: 8px; overflow: hidden; margin-top: 12px; }
.c8 .p { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; text-align: center; font-family: 'Oswald', sans-serif; }
.c8 .p .dn { font-size: 14px; } .c8 .p .dm { font-size: 8px; letter-spacing: 1px; color: var(--muted); }
.c8 .p.on { background: var(--accent); color: #fff; border-color: var(--accent); } .c8 .p.on .dm { color: rgba(255,255,255,0.8); }
.c8 .big { margin-top: 14px; height: 180px; border-radius: 10px; overflow: hidden; position: relative; color: #fff; }
.c8 .big .th { position: absolute; inset: 0; filter: brightness(0.7); }
.c8 .big .in { position: absolute; left: 14px; bottom: 14px; z-index: 1; }
.c8 .big b { font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: 22px; display: block; } .c8 .big small { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>Feed Calendar — אופציות</h1>
<p class="sub">8 עיצובים ללוח השנה בפיד (אירועים, דרופים, ירידים)</p>

<div class="grid" id="opts"></div>

<script>
var IM = { mkt: '../magazine-hero.jpg', beach: '../hero-beach.jpg', gal: '../gallery-hero.jpg', women: '../women-hero.jpg', men: '../men-hero.jpg' };
var th = s => '<span class="th" style="background-image:url(\'' + s + '\')"></span>';
var head = '<div class="kick"><span>Art &amp; second-hand · What’s on</span><span>2026</span></div><div class="month">October</div><div class="rule"></div>';

// month grid cells for October 2026 (starts Thu). dots on a few days.
function monthCells(cls) {
  var cells = '';
  for (var i = 0; i < 3; i++) cells += '<div class="cell ' + cls + '"></div>';
  var dots = { 3: 1, 7: 0, 12: 1, 16: 1, 21: 1, 28: 1 };
  for (var d = 1; d <= 31; d++) {
    var today = d === 7 ? ' today' : '';
    cells += '<div class="cell ' + cls + today + '">' + d + (dots[d] ? '<span class="dot"></span>' : '') + '</div>';
  }
  return cells;
}
var DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

var OPTS = [
  ['C1 · גריד חודשי (הקיים)', 'חודש מלא עם נקודות על ימים עם אירוע, והאירוע הנבחר מתחת. לנקודת השוואה.',
   '<div class="screen c1">' + head + '<div class="cal">' + DOW.map(d => '<div class="dow">' + d + '</div>').join('') + monthCells('') + '</div>' +
   '<div class="rule"></div><div style="display:flex;align-items:center;gap:10px"><div class="ev-t">Vintage Flea Market</div><span class="tag">Second-hand</span></div><div class="ev-d">Dozens of stalls of pre-loved fashion and denim.</div><div class="ev-meta"><span>10:00–17:00</span><span>Tel Aviv Port</span></div></div>'],

  ['C2 · רצועת שבוע', 'שבעה ימים בשורה להחלקה, היום הנבחר בשחור, וכרטיס אירוע עם תמונה מתחת. קומפקטי.',
   '<div class="screen c2">' + head +
   '<div class="strip">' + [['Mon', 5], ['Tue', 6], ['Wed', 7, 1], ['Thu', 8], ['Fri', 9], ['Sat', 10]].map(d => '<div class="d' + (d[2] ? ' on' : '') + '"><div class="dw">' + d[0] + '</div><div class="dn">' + d[1] + '</div>' + (d[1] === 10 ? '<span class="dot"></span>' : '') + '</div>').join('') + '</div>' +
   '<div class="card">' + th(IM.mkt) + '<div><div class="ev-t" style="font-size:19px">Vintage Flea Market</div><div class="ev-d">Pre-loved fashion &amp; denim.</div><div class="ev-meta"><span>10:00</span><span>Tel Aviv Port</span></div></div></div></div>'],

  ['C3 · רשימת אג׳נדה', 'רשימה אנכית של האירועים הקרובים, כל אחד עם תאריך בצד. קל לסרוק "מה בא".',
   '<div class="screen c3">' + head +
   [['07', 'Oct', 'Vintage Flea Market', 'Tel Aviv Port · 10:00'], ['12', 'Oct', 'Designer Sample Sale', 'Jaffa · 11:00'], ['16', 'Oct', 'Art & Print Fair', 'Gallery Nine · 18:00'], ['21', 'Oct', 'Sustainable Swap', 'Florentin · 17:00'], ['28', 'Oct', 'Night Market', 'Namal · 20:00']].map(e => '<div class="row"><div class="date"><div class="dn">' + e[0] + '</div><div class="dm">' + e[1] + '</div></div><div class="bd"><b>' + e[2] + '</b><small>' + e[3] + '</small></div></div>').join('') + '</div>'],

  ['C4 · כרטיסי אירוע', 'קרוסלת כרטיסים עם תמונה ותג תאריך בפינה. ויזואלי ומזמין, טוב לאירועים עם פוסטר.',
   '<div class="screen c4">' + head +
   '<div class="rail">' + [['07', 'Oct', 'Vintage Flea Market', 'Tel Aviv Port', IM.mkt], ['12', 'Oct', 'Sample Sale', 'Jaffa', IM.women], ['16', 'Oct', 'Art Fair', 'Gallery Nine', IM.gal]].map(e => '<div class="c"><div class="img">' + th(e[4]) + '<div class="badge"><div class="dn">' + e[0] + '</div><div class="dm">' + e[1] + '</div></div></div><b>' + e[2] + '</b><small>' + e[3] + '</small></div>').join('') + '</div></div>'],

  ['C5 · ציר זמן', 'אירועים על ציר אנכי עם נקודות. מדגיש רצף וסדר כרונולוגי.',
   '<div class="screen c5">' + head +
   '<div class="tl">' + [['Tue 7 Oct · 10:00', 'Vintage Flea Market', 'Tel Aviv Port'], ['Sun 12 Oct · 11:00', 'Designer Sample Sale', 'Jaffa'], ['Thu 16 Oct · 18:00', 'Art & Print Fair', 'Gallery Nine'], ['Tue 21 Oct · 17:00', 'Sustainable Swap', 'Florentin']].map(e => '<div class="ev"><div class="dt">' + e[0] + '</div><b>' + e[1] + '</b><small>' + e[2] + '</small></div>').join('') + '</div></div>'],

  ['C6 · זרקור + הבאים', 'כרטיס גדול לאירוע הקרוב ביותר, ומתחת שני האירועים הבאים בקטן. ממוקד פעולה.',
   '<div class="screen c6">' + head +
   '<div class="spot">' + th(IM.mkt) + '<div class="in"><span class="chip">Next · Tue 7 Oct</span><b>Vintage Flea Market</b><small>10:00–17:00 · Tel Aviv Port</small></div></div>' +
   '<div class="next"><div class="n"><div class="dn">12 Oct</div><small>Sample Sale · Jaffa</small></div><div class="n"><div class="dn">16 Oct</div><small>Art Fair · Gallery Nine</small></div></div></div>'],

  ['C7 · חודשי כהה', 'אותו גריד חודשי אבל על רקע כהה עם היום בכתום. דרמטי ויוקרתי.',
   '<div class="screen dark c7">' + head.replace('class="rule"', 'class="rule"') + '<div class="cal">' + DOW.map(d => '<div class="dow">' + d + '</div>').join('') + monthCells('') + '</div>' +
   '<div class="rule"></div><div style="display:flex;align-items:center;gap:10px"><div class="ev-t">Vintage Flea Market</div><span class="tag">Second-hand</span></div><div class="ev-d" style="color:#b7b0a2">Dozens of stalls of pre-loved fashion.</div><div class="ev-meta" style="color:#cfc7b8"><span>10:00–17:00</span><span>Tel Aviv Port</span></div></div>'],

  ['C8 · פילים + אירוע מצולם', 'שורת תאריכים כפילים צבעוניים, ומתחת כרטיס אירוע גדול מצולם. חי וצבעוני.',
   '<div class="screen c8">' + head +
   '<div class="pills">' + [['7', 'Tue', 1], ['12', 'Sun'], ['16', 'Thu'], ['21', 'Tue'], ['28', 'Tue']].map(d => '<div class="p' + (d[2] ? ' on' : '') + '"><div class="dn">' + d[0] + '</div><div class="dm">' + d[1] + '</div></div>').join('') + '</div>' +
   '<div class="big">' + th(IM.mkt) + '<div class="in"><b>Vintage Flea Market</b><small>Tue 7 Oct · 10:00 · Tel Aviv Port</small></div></div></div>']
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
