<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="stylesheet" href="design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        /* Product page fits one screen — no page scroll / scrollbar. */
        html, body { overflow: hidden; }
        body {
            font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #fff;
            color: #000;
        }

        /* Adding to cart slides the whole page out before we land on the cart. */
        body.slide-out { animation: pageSlideOut 0.45s cubic-bezier(0.65, 0.05, 0.1, 1) forwards; overflow: hidden; }
        @keyframes pageSlideOut { to { transform: translateX(-12%); opacity: 0; } }

        .product-hero {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 48px;
        }

        /* ==================================================================
           PROMO-SLIDE STYLE — the exact same component the promoted-product
           sliders use across the site, rendered here as one static product.
           Structure and type mirror index.html's .promo-slider so the product
           page reads identically to a promoted card.
           ================================================================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            width: 100%;
            max-width: 1180px;
            /* Design tokens — same values the site's promoted sliders use. */
            --promo-company: 120px;
            --pd-title-size: 32px;
            --pd-desc-size: 21px;
            --pd-price-size: 18px;
            --pd-emoji-size: 240px;
            --pd-img-w: 380px;
            --pd-img-aspect: 1.15;
            --pd-gap: 42px;
            --pd-company-color: #000;
            --pd-title-color: #000;
            --pd-desc-color: #000;
            --pd-panel-bg: #f1f1ef;
            --pd-btn-bg: #f1f1ef;
            --pd-btn-color: #111;
            --pd-btn-h: 53px;
            --pd-btn-radius: 0px;
            --pd-btn-border: transparent;
        }

        .promo-slide {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: minmax(0, 600px) minmax(0, var(--pd-img-w, 620px));
            justify-content: center;
            align-items: stretch;
            gap: var(--pd-gap, 88px);
            padding: 24px 30px;
        }
        /* Data always on the left column, image always on the right column. */
        .promo-text  { grid-column: 1; }
        .promo-image { grid-column: 2; }

        .promo-text {
            direction: ltr;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 26px;
            padding: 14px 0;
            min-height: 100%;
        }

        .promo-head, .promo-foot {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            align-self: stretch;
            gap: 8px;
        }
        .promo-foot { gap: 12px; }

        /* Company / seller name — first line, large, regular weight. */
        .promo-label {
            font-size: var(--promo-company, 46px);
            display: block;
            white-space: nowrap;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.15;
            color: var(--pd-company-color, #111);
            margin: 0;
        }
        .promo-label > span { white-space: nowrap; }

        /* Piece's own name — smaller and bold. */
        .promo-title {
            font-size: var(--pd-title-size, 36px);
            font-weight: 700;
            text-transform: uppercase;
            overflow-wrap: anywhere;
            line-height: 1.25;
            letter-spacing: 0.5px;
            color: var(--pd-title-color, #111);
            margin: 0;
        }

        .promo-desc {
            font-size: var(--pd-desc-size, 19px);
            line-height: 1.7;
            font-weight: 400;
            color: var(--pd-desc-color, #6b665e);
            max-width: 480px;
            margin: 0;
        }

        /* Buy bar: label on the left, price on the right. */
        .promo-readmore {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            height: var(--pd-btn-h, 66px);
            box-sizing: border-box;
            border-radius: var(--pd-btn-radius, 16px);
            background: var(--pd-btn-bg, #f1f1ef);
            border: 2px solid var(--pd-btn-border, transparent);
            cursor: pointer;
            font-size: var(--pd-price-size, 14px);
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--pd-btn-color, #111);
            padding: 0 24px;
            margin-top: 4px;
            transition: filter 0.25s, transform 0.25s;
        }
        .promo-readmore .promo-buyprice { font-weight: 700; letter-spacing: 0.5px; }
        .promo-readmore:hover { filter: brightness(0.96); transform: translateY(-2px); }

        /* Wishlist bar — same width, quieter (outline only). */
        .promo-wish {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: var(--pd-btn-h, 66px);
            box-sizing: border-box;
            border-radius: var(--pd-btn-radius, 16px);
            background: transparent;
            border: 1px solid #d9d7d2;
            cursor: pointer;
            font-size: var(--pd-price-size, 18px);
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #111;
            padding: 0 24px;
            transition: border-color 0.2s, background 0.2s;
        }
        .promo-wish:hover { border-color: #111; }
        .promo-wish.active { border-color: #111; background: #f1f1ef; }

        /* Make-an-offer bar — dark, like Depop's "Make Offer". */
        .promo-offer {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: var(--pd-btn-h, 66px);
            box-sizing: border-box;
            border-radius: var(--pd-btn-radius, 16px);
            background: #111;
            border: 2px solid #111;
            cursor: pointer;
            font-size: var(--pd-price-size, 18px);
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #fff;
            padding: 0 24px;
            transition: filter 0.2s, transform 0.2s;
        }
        .promo-offer:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* ---- Offer dialog ---- */
        .offer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
            direction: rtl;
        }
        .offer-overlay.show { display: flex; }
        .offer-modal {
            background: #fff;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 34px 30px 30px;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        .offer-modal h3 {
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .offer-sub { font-size: 14px; color: #8a857c; margin-bottom: 22px; }
        .offer-input-wrap {
            display: flex;
            align-items: center;
            border: 1px solid #d9d7d2;
            border-radius: 4px;
            padding: 0 16px;
            height: 56px;
            margin-bottom: 22px;
        }
        .offer-input-wrap .cur { font-size: 22px; color: #8a857c; margin-left: 8px; }
        .offer-input-wrap input {
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 22px;
            font-weight: 600;
            width: 100%;
            background: transparent;
            color: #111;
            direction: ltr;
            text-align: right;
        }
        .offer-actions { display: flex; gap: 12px; }
        .offer-send, .offer-cancel {
            flex: 1;
            height: 52px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: filter 0.2s, background 0.2s;
        }
        .offer-send { background: #111; color: #fff; border: 2px solid #111; }
        .offer-send:hover { filter: brightness(1.15); }
        .offer-cancel { background: #fff; color: #111; border: 1px solid #d9d7d2; }
        .offer-cancel:hover { border-color: #111; }

        /* Image panel — flat neutral, icon centred huge. */
        .promo-image {
            position: relative;
            width: 100%;
            max-width: var(--pd-img-w, 620px);
            aspect-ratio: 1 / var(--pd-img-aspect, 1.25);
            margin: 0;
            background: var(--pd-panel-bg, #f2f0ec);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--pd-emoji-size, 210px);
            color: rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }
        .pd-main-frame {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .pd-main-frame img { width: 100%; height: 100%; object-fit: cover; }
        .product-banner-icon { font-size: var(--pd-emoji-size, 360px); line-height: 1; }

        /* McLaren-style spec row: three columns spanning the slide, thin top rule. */
        .promo-stats {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 54px;
            padding-top: 38px;
            border-top: 1px solid rgba(0, 0, 0, 0.14);
        }
        .promo-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }
        .promo-stat-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: #9a958c;
        }
        .promo-stat-value {
            font-size: clamp(20px, 2vw, 30px);
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--pd-title-color, #111);
            line-height: 1.1;
        }

        /* The seller's other shots — small squares under the image panel. */
        .pd-thumbs {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        .pd-thumb {
            width: 78px;
            height: 78px;
            flex: 0 0 auto;
            background: #f1f1ef;
            border: 1px solid #e4e2dd;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s, opacity 0.2s;
            opacity: 0.85;
        }
        .pd-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .pd-thumb:hover { opacity: 1; }
        .pd-thumb.active { border-color: #111; opacity: 1; }
        .pd-thumb:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

        /* ==================== TOASTS ==================== */
        .toast-container { position: fixed; bottom: 24px; left: 24px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: #111; color: #fff; padding: 14px 22px; border-radius: 4px;
            font-size: 14px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateX(-120%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { transform: translateX(0); }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .product-hero { padding: 32px 18px; }
            .promo-slider { --promo-company: 64px; --pd-emoji-size: 200px; }
            .promo-slide { grid-template-columns: 1fr; gap: 24px; padding: 8px 4px; }
            .promo-image { max-width: 100%; }
            .promo-stats { margin-top: 34px; padding-top: 26px; gap: 16px; }
        }
    </style>
    <!-- Seller edits + sale prices, shared by every page (single source). -->
    <script src="product-overrides.js"></script>
    <!-- VERO manual placement — baked in from the site editor. Kept last so it wins. -->
    <style>
        /* VERO manual placement — from the site editor */
        #pdThumbs {
            transform: translate(745px, -118px) scale(1.65);
        }

        #productHero > div.promo-slider:nth-of-type(1) > div.promo-slide {

        }

        #productHero > div.promo-slider:nth-of-type(1) > div.promo-slide > div.promo-text:nth-of-type(1) > div.promo-foot:nth-of-type(2) {
            transform: translate(-161px, 145px);
        }

        #productName {
            transform: translate(-188px, 16px) scale(0.75);
        }

        #productLabel {

        }

        #pdMainImg {
            transform: translate(33px, 118px) scale(1.4);
        }

        #productHero > div.promo-slider:nth-of-type(1) > div.promo-slide > div.promo-text:nth-of-type(1) {

        }

        #wishBtn {

        }

        }

        #offerBtn {

        #pdThumbs > button.pd-thumb:nth-of-type(2) {

        }

        #pdThumbs > button.pd-thumb:nth-of-type(1) {

        }
    </style>
</head>
<body data-sticky="plain">
    <script>function goBackToStore(){ if (document.referrer && history.length > 1) history.back(); else location.href = "index.html"; }</script>

    <!-- ==================== PRODUCT (promo-slide style) ==================== -->
    <div class="product-hero" id="productHero">
        <div class="promo-slider">
            <div class="promo-slide">
                <div class="promo-text">
                    <div class="promo-head">
                        <span class="promo-label" id="productLabel">VERO SELECT</span>
                        <h1 class="promo-title" id="productName">שם המוצר</h1>
                    </div>
                    <div class="promo-foot">
                        <p class="promo-desc" id="productDesc">תיאור המוצר יופיע כאן</p>
                        <button class="promo-readmore" onclick="addProductToCart()">
                            <span class="promo-buylabel">הוסף לעגלה</span>
                            <span class="promo-buyprice" id="productPrice">₪0.00</span>
                        </button>
                        <button class="promo-offer" id="offerBtn" onclick="openOffer()">הצע מחיר</button>
                        <button class="promo-wish" id="wishBtn" onclick="toggleWishlist()">הוסף לרשימת המשאלות</button>
                    </div>
                </div>

                <div class="promo-image" id="pdMainImg">
                    <div class="pd-main-frame" id="pdMainFrame">
                        <div class="product-banner-icon" id="productIcon">🎨</div>
                    </div>
                </div>

                <div class="promo-stats" id="productSpecs">
                    <div class="promo-stat">
                        <span class="promo-stat-label">צבע</span>
                        <span class="promo-stat-value" id="specColor">—</span>
                    </div>
                    <div class="promo-stat">
                        <span class="promo-stat-label">מידה</span>
                        <span class="promo-stat-value" id="specSize">—</span>
                    </div>
                    <div class="promo-stat">
                        <span class="promo-stat-label">בד</span>
                        <span class="promo-stat-value" id="specFabric">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- the other shots, under the image panel; click to swap them in -->
        <div class="pd-thumbs" id="pdThumbs"></div>
    </div>

    <!-- ==================== OFFER DIALOG ==================== -->
    <div class="offer-overlay" id="offerOverlay" onclick="if(event.target===this)closeOffer()">
        <div class="offer-modal" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
            <h3 id="offerTitle">הצע מחיר</h3>
            <p class="offer-sub" id="offerSub">שלח למוכר הצעת מחיר להתמקחות</p>
            <div class="offer-input-wrap">
                <span class="cur">₪</span>
                <input type="number" id="offerInput" min="1" step="1" placeholder="0" inputmode="numeric">
            </div>
            <div class="offer-actions">
                <button class="offer-send" onclick="sendOffer()">שלח הצעה</button>
                <button class="offer-cancel" onclick="closeOffer()">ביטול</button>
            </div>
        </div>
    </div>

    <!-- ==================== TOASTS ==================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Cart & Wishlist State
        let cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
        let currentProduct = null;

        function saveState() {
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_wishlist', JSON.stringify(wishlist));
        }

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            if (cb) { cb.textContent = cartCount; cb.classList.toggle('show', cartCount > 0); }
            if (wb) { wb.textContent = wishlist.length; wb.classList.toggle('show', wishlist.length > 0); }
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 350); }, 2600);
        }

        // Every cart item is held for 48 hours from the moment it was added.
        const HOLD_MS = 48 * 60 * 60 * 1000;

        function addProductToCart() {
            if (!currentProduct) return;
            const id = `${currentProduct.name}|${currentProduct.price}`;
            const existing = cart.find(i => i.id === id);
            const now = Date.now();
            if (existing) {
                existing.qty++;
                existing.addedAt = now;
                existing.expiresAt = now + HOLD_MS;   // adding again restarts the hold
            } else {
                cart.push({
                    id: id, name: currentProduct.name, price: currentProduct.price,
                    icon: currentProduct.icon, category: currentProduct.category,
                    seller: currentProduct.seller, rating: currentProduct.rating,
                    qty: 1, addedAt: now, expiresAt: now + HOLD_MS
                });
            }
            saveState();
            updateBadges();
            // Slide the page out, then land straight on the cart.
            document.body.classList.add('slide-out');
            setTimeout(() => { window.location.href = 'index.html?open=cart'; }, 460);
        }

        // ---- Gallery: the icon frame plus two more shots of the same item. ----
        function galleryShots(product) {
            const seed = encodeURIComponent(product.name || 'vero');
            return [
                { icon: product.icon },
                { src: `https://picsum.photos/seed/${seed}-a/900/900` },
                { src: `https://picsum.photos/seed/${seed}-b/900/900` }
            ];
        }

        let galleryItems = [];

        function buildGallery(product) {
            galleryItems = galleryShots(product);
            const thumbs = document.getElementById('pdThumbs');
            thumbs.innerHTML = galleryItems.slice(1).map((s, i) =>
                `<button class="pd-thumb" onclick="showShot(${i + 1})" aria-label="תמונה ${i + 2}">
                    <img src="${s.src}" alt="" loading="lazy" onerror="this.remove()">
                 </button>`).join('');
            showShot(0);
        }

        function showShot(i) {
            const shot = galleryItems[i];
            if (!shot) return;
            const main = document.getElementById('pdMainFrame');
            main.innerHTML = shot.src
                ? `<img src="${shot.src}" alt="${currentProduct ? currentProduct.name : ''}">`
                : `<div class="product-banner-icon" id="productIcon">${shot.icon || '🛍️'}</div>`;
            document.querySelectorAll('.pd-thumb').forEach((t, idx) => {
                t.classList.toggle('active', idx + 1 === i);
            });
        }

        function toggleWishlist() {
            if (!currentProduct) return;
            const id = `${currentProduct.name}|${currentProduct.price}`;
            const btn = document.getElementById('wishBtn');
            const idx = wishlist.findIndex(i => i.id === id);
            if (idx >= 0) {
                wishlist.splice(idx, 1);
                btn.classList.remove('active');
                btn.textContent = 'הוסף לרשימת המשאלות';
                showToast(`הוסר מרשימת המשאלות: ${currentProduct.name}`);
            } else {
                wishlist.push({
                    id, name: currentProduct.name, price: currentProduct.price,
                    icon: currentProduct.icon, category: currentProduct.category,
                    seller: currentProduct.seller, rating: currentProduct.rating,
                    addedAt: Date.now()
                });
                btn.classList.add('active');
                btn.textContent = 'הסר מרשימת המשאלות';
                showToast(`נוסף לרשימת המשאלות: ${currentProduct.name}`);
            }
            saveState();
            updateBadges();
        }

        function goHome() { window.location.href = 'index.html'; }

        // ---- Make an offer (Depop-style) ----
        function openOffer() {
            const input = document.getElementById('offerInput');
            const sub = document.getElementById('offerSub');
            if (currentProduct) {
                sub.textContent = `מחיר מבוקש: ₪${currentProduct.price} · שלח למוכר הצעה`;
                // Pre-fill with a friendly starting offer (~90% of asking).
                input.placeholder = Math.max(1, Math.round(currentProduct.price * 0.9)).toString();
            }
            document.getElementById('offerOverlay').classList.add('show');
            setTimeout(() => input.focus(), 50);
        }
        function closeOffer() {
            document.getElementById('offerOverlay').classList.remove('show');
        }
        function sendOffer() {
            const input = document.getElementById('offerInput');
            const amount = parseFloat(input.value);
            if (!amount || amount <= 0) { input.focus(); return; }
            // Save the offer locally so the seller area can pick it up later.
            const offers = JSON.parse(localStorage.getItem('vero_offers') || '[]');
            offers.push({
                name: currentProduct ? currentProduct.name : '',
                seller: currentProduct ? currentProduct.seller : '',
                askPrice: currentProduct ? currentProduct.price : null,
                offer: amount,
                at: Date.now()
            });
            localStorage.setItem('vero_offers', JSON.stringify(offers));
            input.value = '';
            closeOffer();
            showToast(`ההצעה נשלחה: ₪${amount}`);
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOffer(); });

        // Fit the company/seller name to its column, matching the slider's fitter.
        function fitLabel() {
            const el = document.getElementById('productLabel');
            const col = el.closest('.promo-text');
            if (!el || !col || !col.clientWidth) return;
            const base = parseFloat(getComputedStyle(el.closest('.promo-slider')).getPropertyValue('--promo-company')) || 120;
            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px';
            const cs = getComputedStyle(el);
            probe.style.fontFamily = cs.fontFamily;
            probe.style.fontWeight = cs.fontWeight;
            probe.style.letterSpacing = cs.letterSpacing;
            probe.style.textTransform = cs.textTransform;
            document.body.appendChild(probe);
            probe.textContent = el.textContent.trim();
            const nameWidth = probe.getBoundingClientRect().width;
            probe.remove();
            if (!nameWidth) return;
            const maxForWidth = (col.clientWidth * 0.94 / nameWidth) * 100;
            el.style.fontSize = Math.floor(Math.min(base, maxForWidth)) + 'px';
        }
        window.addEventListener('resize', fitLabel);

        // Load product from URL parameter
        const params = new URLSearchParams(window.location.search);
        const productData = params.get('product');

        if (productData) {
            try {
                currentProduct = JSON.parse(decodeURIComponent(productData));

                // Company/seller name — large first line (same as the slider's label).
                document.getElementById('productLabel').textContent = currentProduct.seller || 'VERO SELECT';
                // Piece name — bold second line.
                document.getElementById('productName').textContent = currentProduct.name;

                // Seller edits + any discount folded in, so the price matches every card.
                currentProduct = veroApplyOverride(currentProduct);
                document.getElementById('productPrice').innerHTML = veroPriceHTML(currentProduct);
                buildGallery(currentProduct);

                document.getElementById('productDesc').textContent = currentProduct.desc ||
                    `${currentProduct.name} — פריט יד שנייה במצב מעולה, זמין כעת בחנות.`;

                // Spec row — Colour / Size / Material, like the slider.
                document.getElementById('specColor').textContent = currentProduct.color || 'רב-גוני';
                document.getElementById('specSize').textContent = currentProduct.size || (currentProduct.type === 'art' ? '50×70 ס"מ' : 'M');
                document.getElementById('specFabric').textContent = currentProduct.fabric || currentProduct.material || (currentProduct.type === 'art' ? 'קנבס' : 'כותנה');

                // Reflect whether this item is already in the wishlist.
                const wid = `${currentProduct.name}|${currentProduct.price}`;
                if (wishlist.some(i => i.id === wid)) {
                    const wb = document.getElementById('wishBtn');
                    wb.classList.add('active');
                    wb.textContent = 'הסר מרשימת המשאלות';
                }
            } catch (e) {
                console.error('Error loading product:', e);
            }
        }

        // Initialize
        updateBadges();
        fitLabel();
    </script>
    <!-- Gentle site-wide animations: page fade-in + reveal-on-scroll. -->
    <script src="vero-animations.js"></script>
    <!-- Live manual editor (✎ button, bottom-left) — move & resize any piece. -->
    <script src="vero-editor.js"></script>
</body>
</html>
