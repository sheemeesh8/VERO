<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Fine Line</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #f6f5f1; --ink: #1c1c1c; --muted: #8a877f; --line: #e2ddd4; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }
/* fine-line primitives */
.money { font-variant-numeric: tabular-nums; }
.thin { stroke-width: 1; fill: none; stroke: currentColor; }
.th { background: #e7e4dd center / cover no-repeat; filter: grayscale(1); }
/* dimmed cart behind a sheet */
.behind { position: absolute; inset: 0; background: var(--bg); }
.behind .bh { padding: 44px 24px 14px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; }
.behind .bg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 24px; }
.behind .bc { aspect-ratio: 3/4; }
.scrim { position: absolute; inset: 0; background: rgba(246,245,241,0.72); }

/* row — hairline rule, no box */
.row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row .th { width: 42px; height: 54px; flex: none; }
.row .nm { flex: 1; min-width: 0; } .row .nm b { font-weight: 400; font-size: 14px; display: block; letter-spacing: 0.3px; }
.row .nm small { color: var(--muted); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.row .pr { font-size: 14px; }
.sums { padding: 16px 0 2px; } .sums p { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 9px; letter-spacing: 0.3px; }
.sums p.t { color: var(--ink); font-size: 16px; letter-spacing: 1px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); text-transform: uppercase; }
.sums p.t b { font-weight: 400; font-size: 20px; }
/* fine-line button: thin outline, uppercase */
.cta { display: block; text-align: center; background: transparent; color: var(--ink); border: 1px solid var(--ink);
  padding: 16px; margin-top: 20px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }

/* A — sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--ink); padding: 14px 26px 30px; }
.grip { width: 34px; height: 2px; background: #cfcabf; margin: 0 auto 18px; }
.s-title { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 20px; }

/* B — full review */
.b .top { display: flex; align-items: center; justify-content: space-between; padding: 46px 26px 18px; border-bottom: 1px solid var(--line); }
.b .top b { font-size: 22px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.b .top svg { width: 20px; height: 20px; color: #999; }
.b .wrap2 { padding: 0 26px; }
.b h4 { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin: 22px 0 12px; }
.b .opt2 { display: flex; gap: 0; border: 1px solid var(--line); } .b .opt2 span { flex: 1; text-align: center; padding: 13px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); } .b .opt2 span.on { color: var(--ink); border-bottom: 1px solid var(--ink); }
.b .pay { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 13px; } .b .pay svg { width: 26px; height: 26px; flex: none; }
.b .bar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--ink); padding: 16px 26px 30px; display: flex; align-items: center; gap: 16px; }
.b .bar div { flex: 1; } .b .bar .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); } .b .bar b { font-size: 22px; font-weight: 400; }
.b .bar .go { flex: none; border: 1px solid var(--ink); padding: 15px 24px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* C — by seller */
.c .top { padding: 46px 26px 8px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; }
.c .note { margin: 0 26px 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.c .grp { padding: 0 26px; }
.c .gh { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 10px; border-bottom: 1px solid var(--ink); }
.c .gh b { font-size: 12px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 9px; } .c .gh b::before { content: ''; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--ink); }
.c .gh span { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.c .gr { display: flex; justify-content: space-between; padding: 11px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.c .gf { display: flex; justify-content: space-between; padding: 10px 0 2px; font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.c .bar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--ink); padding: 16px 26px 30px; display: flex; align-items: center; }
.c .bar div { flex: 1; } .c .bar .k { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; } .c .bar b { font-size: 20px; font-weight: 400; }
.c .bar span { border: 1px solid var(--ink); padding: 14px 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* D — centered */
.d .card { position: absolute; left: 30px; right: 30px; top: 50%; transform: translateY(-50%); background: var(--bg); border: 1px solid var(--ink); padding: 34px 26px; text-align: center; }
.d .k { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: var(--muted); }
.d .big { font-size: 46px; font-weight: 400; margin: 12px 0 4px; }
.d .cnt { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
.d .thumbs { display: flex; justify-content: center; gap: 8px; margin-bottom: 26px; }
.d .thumbs div { width: 40px; height: 50px; }
.d .card p { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 18px; }

/* E — receipt, hairline */
.e .slip { position: absolute; left: 28px; right: 28px; top: 70px; padding: 30px 4px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.e .tick { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; margin: 0 auto 14px; }
.e .tick svg { width: 20px; height: 20px; }
.e h4 { font-weight: 400; font-size: 20px; text-align: center; letter-spacing: 3px; text-transform: uppercase; }
.e .s { text-align: center; font-size: 9px; letter-spacing: 3px; color: var(--muted); margin: 6px 0 20px; text-transform: uppercase; }
.e .ln { display: flex; justify-content: space-between; padding: 9px 0; font-size: 13px; border-top: 1px solid var(--line); }
.e .ln.t { border-top: 1px solid var(--ink); margin-top: 6px; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
.e .cta { position: absolute; left: 28px; right: 28px; bottom: 32px; }

/* F — minimal list, no thumbs */
.f .top { padding: 46px 26px 18px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
.f .wrap2 { padding: 0 26px; }
.f .lr { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 0; border-bottom: 1px solid var(--line); }
.f .lr .nm { font-size: 15px; } .f .lr .nm small { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.f .lr .pr { font-size: 14px; }
.f .cta { position: absolute; left: 26px; right: 26px; bottom: 30px; margin: 0; }
.f .ftot { position: absolute; left: 26px; right: 26px; bottom: 92px; display: flex; justify-content: space-between; align-items: baseline; padding-top: 16px; border-top: 1px solid var(--ink); }
.f .ftot .k { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); } .f .ftot b { font-size: 24px; font-weight: 400; }
</style>
</head>
<body>
<h1>Checkout — Fine Line</h1>
<p class="sub">אותן 6 אופציות, בקו דק (hairline) בלי מסגרות וכפתורים מלאים</p>
<div class="grid" id="grid"></div>

<script>
var IT = [
  { n: 'Wool Overcoat', s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      pos: '50% 30%' },
  { n: 'Chelsea Boots', s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Silk Scarf',    s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    pos: '50% 50%' }
];
var SUB = 1880, SHIP = 40, TOTAL = SUB + SHIP;
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var bg = function (i) { return 'style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"'; };
var X = '<svg class="thin" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var CARD = '<svg class="thin" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M2 9h20"/></svg>';
var CHK = '<svg class="thin" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>';
var behind = '<div class="behind"><div class="bh">Cart</div><div class="bg">' +
  IT.concat(IT).slice(0,4).map(function(i){return '<div class="bc th" '+bg(i)+'></div>';}).join('') + '</div></div>';
var rows = IT.map(function (i) { return '<div class="row"><div class="th" ' + bg(i) + '></div><div class="nm"><b>' + i.n + '</b><small>' + i.s + '</small></div><div class="pr money">' + m(i.p) + '</div></div>'; }).join('');
var sums = '<div class="sums"><p><span>Subtotal</span><span class="money">' + m(SUB) + '</span></p><p><span>Shipping</span><span class="money">' + m(SHIP) + '</span></p><p class="t"><span>Total</span><b class="money">' + m(TOTAL) + '</b></p></div>';

var OPTS = [
  ['A · גיליון קלאסי', 'גיליון שעולה מעל העגלה: רשימת המוצרים בשורות קו־דק, סכום וסה״כ, וכפתור מתאר. בלי מסגרות ובלי צל.',
   '<div class="screen">' + behind + '<div class="scrim"></div><div class="sheet"><div class="grip"></div><div class="s-title">Checkout · 3 items</div>' + rows + sums + '<span class="cta">Place order</span></div></div>'],

  ['B · מסך מלא, הזמנה', 'סקירה מלאה: פריטים, משלוח / איסוף, אמצעי תשלום, ופס סה״כ קבוע למטה. הכול בקווים דקים.',
   '<div class="screen b"><div class="top"><b>Review</b>' + X + '</div><div class="wrap2">' + rows +
   '<h4>Delivery</h4><div class="opt2"><span class="on">Shipping</span><span>Pickup</span></div>' +
   '<h4>Payment</h4><div class="pay">' + CARD + 'Visa ending 4242</div></div>' +
   '<div class="bar"><div><div class="k">Total</div><b class="money">' + m(TOTAL) + '</b></div><span class="go">Place order</span></div></div>'],

  ['C · לפי מוכר', 'הפריטים מקובצים לכל מוכר, כל כותרת על קו דק, והערה שתיפתח שיחה עם כל מוכר. מתאים למבנה האמיתי של האתר.',
   '<div class="screen c"><div class="top">Checkout</div><div class="note">You’ll place 3 orders and start a chat with each seller.</div><div class="grp">' +
   [['Atelier Nord',[IT[0]],'₪25'],['Sole Society',[IT[1]],'Free'],['Studio Vero',[IT[2]],'₪15']].map(function(g){
     return '<div class="gh"><b>'+g[0]+'</b><span>'+g[1].length+' item</span></div>'+
       g[1].map(function(i){return '<div class="gr"><span>'+i.n+'</span><span class="money">'+m(i.p)+'</span></div>';}).join('')+
       '<div class="gf"><span>Shipping</span><span>'+g[2]+'</span></div>';}).join('') + '</div>' +
   '<div class="bar"><div><div class="k">Total incl. shipping</div><b class="money">'+m(1920)+'</b></div><span>Place orders</span></div></div>'],

  ['D · חלונית קטנה במרכז', 'מודאל קטן עם מסגרת דקה: הסכום הגדול, קולאז׳ זעיר של הפריטים ומשפט הסבר. נקי ומהיר.',
   '<div class="screen"><div class="behind"><div class="bh">Cart</div><div class="bg">' + IT.concat(IT).slice(0,4).map(function(i){return '<div class="bc th" '+bg(i)+'></div>';}).join('') + '</div></div><div class="scrim"></div><div class="d"><div class="card"><div class="k">Checkout</div><div class="big money">' + m(TOTAL) + '</div><div class="cnt">3 items · incl. shipping</div><div class="thumbs">' + IT.map(function(i){return '<div class="th" '+bg(i)+'></div>';}).join('') + '</div><span class="cta">Confirm &amp; message sellers</span><p>You’ll chat with each seller to arrange pickup or delivery.</p></div></div></div>'],

  ['E · קבלה (אישור)', 'מסך "ההזמנה נקלטה" כקבלה בקו דק: וי במעגל דק, פירוט על קווים, סה״כ וכפתור מתאר.',
   '<div class="screen e"><div class="slip"><div class="tick">' + CHK + '</div><h4>Order placed</h4><div class="s">moravchick · 04.10.26</div>' +
   IT.map(function(i){return '<div class="ln"><span>'+i.n+'</span><span class="money">'+m(i.p)+'</span></div>';}).join('') +
   '<div class="ln"><span>Shipping</span><span class="money">'+m(SHIP)+'</span></div><div class="ln t"><span>Total</span><span class="money">'+m(TOTAL)+'</span></div></div><span class="cta">Go to chats</span></div>'],

  ['F · רשימה מינימלית', 'בלי תמונות בכלל — רק שם, מוכר ומחיר על קווים דקים, סה״כ וכפתור מתאר למטה. הכי מופשט ו"גלריה".',
   '<div class="screen f"><div class="top">Checkout</div><div class="wrap2">' +
   IT.map(function(i){return '<div class="lr"><div class="nm">'+i.n+'<small>'+i.s+'</small></div><div class="pr money">'+m(i.p)+'</div></div>';}).join('') + '</div>' +
   '<div class="ftot"><span class="k">Total · 3 items</span><b class="money">'+m(TOTAL)+'</b></div><span class="cta">Place order</span></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
