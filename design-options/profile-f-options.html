<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile F Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 600px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 780px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #111; color: #fff; }
.hero { position: absolute; inset: 0; background: url('../hero-beach.jpg') center / cover no-repeat; }
.wash { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.05) 38%, rgba(0,0,0,0.82)); }
.av { display: block; background: url('../women-hero.jpg') 50% 28% / cover no-repeat; }
.top { position: absolute; top: 30px; left: 26px; right: 26px; z-index: 3; display: flex; justify-content: space-between; align-items: center; color: #fff; }
.top b { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; }
.top svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.4; }
.v { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--v); color: #fff; font-size: 12px; font-weight: 700; vertical-align: middle; }
.kick { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.85; }
.nm { font-size: 46px; line-height: 0.98; margin-top: 8px; }
.stats { display: flex; gap: 28px; margin-top: 20px; }
.stats .stat b { display: block; font-size: 18px; font-weight: 700; } .stats .stat span { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.info { position: absolute; left: 26px; right: 26px; bottom: 30px; z-index: 2; }

/* 1 — big avatar above the name (bottom-left) */
.o1 .av { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; margin-bottom: 20px; }

/* 2 — large avatar centred above a centred name */
.o2 .info { text-align: center; }
.o2 .av { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #fff; margin: 0 auto 20px; box-shadow: 0 12px 34px rgba(0,0,0,0.4); }
.o2 .stats { justify-content: center; }

/* 3 — big avatar beside the giant name */
.o3 .row { display: flex; align-items: flex-end; gap: 18px; }
.o3 .av { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #fff; flex: none; }
.o3 .nm { font-size: 40px; }

/* 4 — huge rounded-square avatar, name overlaid at its base */
.o4 .frame { position: absolute; left: 26px; right: 26px; top: 150px; bottom: 150px; z-index: 2; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
.o4 .frame .av { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; }
.o4 .frame::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.7)); }
.o4 .fcap { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; }
.o4 .fcap .nm { font-size: 30px; }
.o4 .stats { position: absolute; left: 26px; right: 26px; bottom: 30px; z-index: 2; }

/* 5 — full-bleed portrait as the hero itself (avatar = the background) */
.o5 .hero { background: url('../women-hero.jpg') 50% 22% / cover no-repeat; }
.o5 .wash { background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0) 35%, rgba(0,0,0,0.85)); }

/* 6 — big avatar top, name below it, all bottom-anchored */
.o6 .av { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #fff; margin-bottom: 18px; }
.o6 .nm { font-size: 38px; }
</style>
</head>
<body>
<h1>Profile F — תמונת פרופיל גדולה</h1>
<p class="sub">אופציה F עם אווטאר מוגדל · 6 וריאציות מיקום/גודל</p>
<div class="grid" id="grid"></div>

<script>
var ARR = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var top = '<div class="top"><b>My Profile</b>' + ARR + '</div>';
var stats = '<div class="stats"><div class="stat"><b>0</b><span>Followers</span></div><div class="stat"><b>3</b><span>Items</span></div><div class="stat"><b>0</b><span>Following</span></div></div>';
var nameBlock = '<div class="kick">Seller · Verified</div><div class="nm">My<br>Profile</div>';

var OPTS = [
  ['1 · אווטאר גדול מעל השם', 'אווטאר עגול גדול (120px) ממש מעל השם הענק, בפינה שמאל-תחתונה. שומר על הפריסה של F.',
   '<div class="screen o1"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="info"><span class="av"></span>' + nameBlock + stats + '</div></div>'],

  ['2 · אווטאר ענק ממורכז', 'אווטאר גדול מאוד (150px) ממורכז עם צל, והשם והסטטיסטיקות ממורכזים מתחתיו. הכי מדגיש את התמונה.',
   '<div class="screen o2"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="info"><span class="av"></span>' + nameBlock + stats + '</div></div>'],

  ['3 · אווטאר לצד השם', 'אווטאר גדול (130px) לצד השם הענק, זה לצד זה בתחתית. איזון בין התמונה לטיפוגרפיה.',
   '<div class="screen o3"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="info"><div class="row"><span class="av"></span><div>' + nameBlock + '</div></div>' + stats + '</div></div>'],

  ['4 · ריבוע ענק ממוסגר', 'תמונת הפרופיל כריבוע מעוגל גדול במרכז המסך, השם על בסיסו, והסטטיסטיקות למטה. כמו "כרטיס".',
   '<div class="screen o4"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="frame"><span class="av"></span><div class="fcap"><div class="kick">Verified</div><div class="nm">My Profile</div></div></div>' + stats + '</div>'],

  ['5 · תמונת הפרופיל היא הרקע', 'תמונת הפרופיל עצמה ממלאת את כל ההירו (במקום רקע נוף), והשם עליה. הכי אישי ואימרסיבי.',
   '<div class="screen o5"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="info">' + nameBlock + stats + '</div></div>'],

  ['6 · אווטאר ענק מעל השם', 'אווטאר הכי גדול (140px) בתחתית מעל השם, הכול מיושר לתחתית שמאל. נוכחות חזקה לתמונה.',
   '<div class="screen o6"><div class="hero"></div><div class="wash"></div>' + top +
   '<div class="info"><span class="av"></span>' + nameBlock + stats + '</div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
