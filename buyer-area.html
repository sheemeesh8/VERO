<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== DATA DASHBOARD ==================== */
        .data-section {
            background: white;
            padding: 48px 40px 60px;
            min-height: 600px;
        }

        .chart-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 28px 32px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .chart-card.full {
            margin-bottom: 32px;
        }

        .chart-title {
            font-size: 20px;
            font-weight: 700;
            color: #004225;
            margin-bottom: 4px;
        }

        .chart-subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 28px;
        }

        /* --- Monthly spending: vertical bars --- */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 18px;
            height: 280px;
            padding-top: 20px;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 10px;
        }

        .bar-value {
            font-size: 13px;
            font-weight: 700;
            color: #004225;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            max-width: 56px;
            background: linear-gradient(180deg, #0a6b3f 0%, #004225 100%);
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        /* --- Two half-width charts side by side --- */
        .charts-row {
            display: flex;
            gap: 32px;
            align-items: stretch;
        }

        .charts-row .chart-card {
            flex: 1;
            min-width: 0;
        }

        /* --- Horizontal bars (styles & brands) --- */
        .hbars {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hbar-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hbar-label {
            width: 96px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hbar-track {
            flex: 1;
            height: 14px;
            background: #f0f0f0;
            border-radius: 7px;
            overflow: hidden;
        }

        .hbar-fill {
            height: 100%;
            background: linear-gradient(90deg, #004225 0%, #0a6b3f 100%);
            border-radius: 7px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hbar-pct {
            width: 42px;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 700;
            color: #004225;
            text-align: left;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .header-left {
                display: none;
            }

            .hero-title {
                font-size: 32px;
            }

            .charts-row {
                flex-direction: column;
            }

            .bar-chart {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">הנתונים שלי</h1>
            <p class="hero-subtitle">מבט על הרגלי הקנייה, הסגנונות והחברות האהובים עליך</p>
        </div>
    </div>

    <!-- ==================== DATA DASHBOARD ==================== -->
    <div class="data-section">
        <div class="container">
            <!-- Monthly consumption (full width) -->
            <div class="chart-card full">
                <div class="chart-title">הצריכה החודשית שלי</div>
                <div class="chart-subtitle" id="spendSubtitle">מתחילת השנה ועד היום</div>
                <div class="bar-chart" id="spendChart"></div>
            </div>

            <!-- Styles (right) + Brands (left), same size -->
            <div class="charts-row">
                <div class="chart-card">
                    <div class="chart-title">הסגנונות המועדפים עליי</div>
                    <div class="chart-subtitle">לפי אחוז מהרכישות</div>
                    <div class="hbars" id="stylesChart"></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">החברות האהובות עליי</div>
                    <div class="chart-subtitle">לפי אחוז מהרכישות</div>
                    <div class="hbars" id="brandsChart"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Monthly spending in ₪ (index 0 = January). Rendered up to the current month.
        const monthlySpending = [320, 180, 540, 260, 610, 430, 290, 380, 450, 500, 340, 410];
        const monthNames = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];

        // Favorite styles and brands (percentage of purchases)
        const favoriteStyles = [
            { name: 'קז\'ואל', pct: 85 },
            { name: 'וינטג\'', pct: 62 },
            { name: 'ספורט', pct: 48 },
            { name: 'פורמלי', pct: 35 },
        ];
        const favoriteBrands = [
            { name: 'Basics Co', pct: 90 },
            { name: 'Denim House', pct: 70 },
            { name: 'Street Style', pct: 55 },
            { name: 'Smart Style', pct: 40 },
        ];

        function renderSpendChart() {
            const currentMonth = new Date().getMonth(); // 0-based; up to "today"
            const data = monthlySpending.slice(0, currentMonth + 1);
            const max = Math.max(...data);
            const chart = document.getElementById('spendChart');
            chart.innerHTML = data.map((value, i) => {
                const height = max > 0 ? (value / max) * 100 : 0;
                return `
                    <div class="bar-col">
                        <div class="bar-value">₪${value.toLocaleString()}</div>
                        <div class="bar" style="height: ${height}%"></div>
                        <div class="bar-label">${monthNames[i]}</div>
                    </div>
                `;
            }).join('');

            const total = data.reduce((s, v) => s + v, 0);
            document.getElementById('spendSubtitle').textContent =
                `מתחילת השנה ועד היום · סה"כ ₪${total.toLocaleString()}`;
        }

        function renderHBars(elId, items) {
            document.getElementById(elId).innerHTML = items.map(item => `
                <div class="hbar-row">
                    <div class="hbar-label">${item.name}</div>
                    <div class="hbar-track"><div class="hbar-fill" style="width: ${item.pct}%"></div></div>
                    <div class="hbar-pct">${item.pct}%</div>
                </div>
            `).join('');
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize
        renderSpendChart();
        renderHBars('stylesChart', favoriteStyles);
        renderHBars('brandsChart', favoriteBrands);
    </script>
</body>
</html>
