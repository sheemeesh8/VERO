<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Options 2</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #efede9; --ink: #111; --muted: #77736c; --line: #e4e1dc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.phone > img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: #111; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 44px 24px 14px; }
.ph b { font-size: 24px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.ph svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.k { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
.th { background: #ddd center / cover no-repeat; filter: grayscale(1); }
.btn { display: block; text-align: center; background: #111; color: #fff; padding: 17px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }
.money { font-variant-numeric: tabular-nums; }
.x { width: 18px; height: 18px; stroke: #999; stroke-width: 1.3; fill: none; }

.c2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
.chk { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; display: grid; place-items: center; }
.chk svg { width: 13px; height: 13px; fill: none; stroke-width: 2.4; }
.rm { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; }
.rm svg { width: 15px; height: 15px; fill: none; stroke-width: 1.5; }
.pill { position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: center; background: #111; color: #fff; border-radius: 40px; padding: 6px 6px 6px 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
.pill div { flex: 1; font-size: 11px; color: #aaa; } .pill div b { display: block; color: #fff; font-size: 17px; font-weight: 400; }
.pill span { background: #fff; color: #111; border-radius: 30px; padding: 15px 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
.tot { display: flex; justify-content: space-between; align-items: baseline; margin: 0 20px 14px; padding-bottom: 12px; border-bottom: 1px solid #111; }
.tot b { font-size: 26px; font-weight: 400; }

/* I — minimal */
.i .th { aspect-ratio: 3/4; position: relative; }
.i .chk { background: #111; } .i .chk svg { stroke: #fff; }
.i .off .th { opacity: 0.45; } .i .off .chk { background: #fff; border: 1px solid #999; } .i .off .chk svg { stroke: transparent; }
.i .rm svg { stroke: #fff; }
.i .nm { font-size: 13px; margin-top: 8px; } .i .pr { font-size: 13px; margin-top: 2px; } .i .sl { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

/* J — overlay on image */
.j .card { aspect-ratio: 3/4.2; position: relative; overflow: hidden; }
.j .card .th { position: absolute; inset: 0; }
.j .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.75)); }
.j .cap { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 12px; color: #fff; }
.j .cap .sl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8; }
.j .cap .nm { font-size: 16px; margin-top: 3px; }
.j .price { position: absolute; z-index: 2; top: 10px; left: 10px; background: #fff; font-size: 12px; padding: 4px 8px; }
.j .rm { z-index: 2; } .j .rm svg { stroke: #fff; }

/* K — framed print */
.kk { background: #f1eee9; }
.kk .card { background: #fff; padding: 10px 10px 14px; position: relative; box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
.kk .th { aspect-ratio: 1/1.15; }
.kk .nm { font-size: 14px; margin-top: 10px; text-align: center; }
.kk .row2 { display: flex; justify-content: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.kk .row2 b { color: #111; font-weight: 400; }
.kk .rm { top: 14px; right: 14px; background: #fff; border-radius: 50%; } .kk .rm svg { stroke: #111; }

/* L — seller groups */
.l .gh { display: flex; justify-content: space-between; align-items: center; margin: 4px 20px 10px; }
.l .gh b { font-size: 14px; font-weight: 400; display: flex; gap: 8px; align-items: center; } .l .gh b::before { content: ''; width: 20px; height: 20px; border-radius: 50%; background: #111; }
.l .gh span { font-size: 10px; color: var(--muted); }
.l .th { aspect-ratio: 1/1; position: relative; }
.l .rm { background: #fff; border-radius: 50%; } .l .rm svg { stroke: #111; }
.l .nm { font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; }
.l .gf { margin: 10px 20px 18px; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

/* M — info card with chips */
.m { background: #f6f5f2; }
.m .card { background: #fff; border: 1px solid var(--line); position: relative; }
.m .th { aspect-ratio: 1/1; }
.m .inf { padding: 10px 10px 12px; }
.m .nm { font-size: 13px; } .m .sl { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.m .chips { display: flex; gap: 4px; margin-top: 8px; } .m .chips span { font-size: 9px; border: 1px solid var(--line); padding: 3px 6px; letter-spacing: 1px; }
.m .pr { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.m .pr a { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-decoration: underline; }
.m .rm { background: #fff; border-radius: 50%; } .m .rm svg { stroke: #111; }

/* N — staggered */
.n .col { display: flex; flex-direction: column; gap: 14px; }
.n .col:nth-child(2) { padding-top: 46px; }
.n .th { position: relative; }
.n .nm { font-size: 13px; margin-top: 7px; display: flex; justify-content: space-between; }
.n .sl { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.n .rm svg { stroke: #fff; }

/* O — dark */
.o { background: #0d0d0d; color: #f2efea; }
.o .ph svg { stroke: #f2efea; }
.o .tot { border-color: #333; } .o .k { color: #8a857d; }
.o .card { background: #1a1a1a; position: relative; }
.o .th { aspect-ratio: 3/3.6; }
.o .inf { padding: 10px 10px 12px; }
.o .nm { font-size: 13px; } .o .sl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: #8a857d; margin-bottom: 4px; }
.o .pr { font-size: 14px; margin-top: 8px; }
.o .rm svg { stroke: #fff; }
.o .pill { background: #f2efea; color: #111; } .o .pill div { color: #666; } .o .pill div b { color: #111; } .o .pill span { background: #111; color: #fff; }

/* P — selected outline */
.p .card { position: relative; padding: 6px; border: 1.5px solid transparent; }
.p .card.on { border-color: #111; }
.p .th { aspect-ratio: 3/4; }
.p .card:not(.on) .th { opacity: 0.4; }
.p .chk { top: 14px; left: 14px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,0.2); }
.p .card.on .chk { background: #111; border-color: #111; } .p .chk svg { stroke: #fff; }
.p .nm { font-size: 12px; margin-top: 7px; display: flex; justify-content: space-between; }
.p .hint { margin: 0 20px 12px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.p .hint u { color: #111; }
</style>
</head>
<body>
<h1>Cart — שני כרטיסים בשורה</h1>
<p class="sub">סבב שני · I עד P · כולם בגריד של 2</p>
<div class="grid" id="grid"></div>
<script>
var IT = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      sz: 'M',  c: 'Like new',  pos: '50% 30%', h: 230 },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', sz: '42', c: 'Good',      pos: '50% 60%', h: 170 },
  { n: 'Linen Overshirt', s: 'Atelier Nord', p: 340, img: '../women-hero.jpg',    sz: 'S',  c: 'Like new',  pos: '20% 40%', h: 190 },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    sz: 'OS', c: 'New',       pos: '50% 50%', h: 220 },
  { n: 'Denim Jacket',    s: 'Denim Lab',    p: 450, img: '../gallery-hero.jpg',  sz: 'L',  c: 'Good',      pos: '50% 50%', h: 200 },
  { n: 'Leather Belt',    s: 'Milano Feet',  p: 190, img: '../magazine-hero.jpg', sz: '90', c: 'Very good', pos: '50% 50%', h: 160 }
];
var TOTAL = IT.reduce(function (a, i) { return a + i.p; }, 0);
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var bg = function (i) { return 'style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"'; };
var RM = '<span class="rm"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
var CK = '<span class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>';
var back = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
var head = function (t) { return '<div class="ph"><b>' + t + '</b>' + back + '</div>'; };
var pill = function (lbl, v) { return '<div class="pill"><div>' + lbl + '<b class="money">' + m(v) + '</b></div><span>Checkout →</span></div>'; };
var tot = '<div class="tot"><span class="k">Total · 6 pieces</span><b class="money">' + m(TOTAL) + '</b></div>';

var OPTS = [
  ['I · נקי ומינימלי', 'תמונה, שם ומחיר מתחת, V לבחירה ו-X להסרה. הכי קרוב לקיים, רק עם תמונות אמיתיות ופחות רעש.',
   '<div class="screen i">' + head('Cart') + tot + '<div class="c2">' + IT.slice(0, 4).map(function (i, k) { return '<div class="' + (k === 3 ? 'off' : '') + '"><div class="th" ' + bg(i) + '>' + CK + RM + '</div><div class="sl">' + i.s + '</div><div class="nm">' + i.n + '</div><div class="pr money">' + m(i.p) + '</div></div>'; }).join('') + '</div>' + pill('3 of 4 selected', TOTAL - 210 - 450 - 190) + '</div>'],

  ['J · טקסט על התמונה', 'שם ומוכר על התמונה עם הכהיה, תווית מחיר לבנה בפינה. כרטיסים גדולים ו"מגזיניים".',
   '<div class="screen j">' + head('Cart') + tot + '<div class="c2">' + IT.slice(0, 4).map(function (i) { return '<div class="card"><div class="th" ' + bg(i) + '></div><span class="price money">' + m(i.p) + '</span>' + RM + '<div class="cap"><div class="sl">' + i.s + '</div><div class="nm">' + i.n + '</div></div></div>'; }).join('') + '</div>' + pill('6 items', TOTAL) + '</div>'],

  ['K · הדפס ממוסגר', 'כל פריט בכרטיס לבן עם שוליים, על רקע נייר. השם במרכז ומתחתיו מידה ומחיר. רך ומוקפד.',
   '<div class="screen kk">' + head('Cart') + tot + '<div class="c2">' + IT.slice(0, 4).map(function (i) { return '<div class="card"><div class="th" ' + bg(i) + '></div>' + RM + '<div class="nm">' + i.n + '</div><div class="row2"><span>Size ' + i.sz + '</span>·<b class="money">' + m(i.p) + '</b></div></div>'; }).join('') + '</div>' + pill('6 items', TOTAL) + '</div>'],

  ['L · לפי מוכר, בגריד', 'מקובץ לפי מוכר כמו D, אבל בכרטיסים של 2 בשורה. מתחת לכל מוכר שורת משלוח.',
   '<div class="screen l">' + head('Cart') +
   [['Atelier Nord', [IT[0], IT[2]], '₪25'], ['Sole Society', [IT[1], IT[3]], 'Free']].map(function (g) { return '<div class="gh"><b>' + g[0] + '</b><span>' + g[1].length + ' items</span></div><div class="c2">' + g[1].map(function (i) { return '<div><div class="th" ' + bg(i) + '>' + RM + '</div><div class="nm"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div>'; }).join('') + '</div><div class="gf"><span>Shipping from ' + g[0] + '</span><span>' + g[2] + '</span></div>'; }).join('') +
   pill('Total incl. shipping', 980 + 340 + 690 + 210 + 25) + '</div>'],

  ['M · כרטיס מידע', 'מתחת לתמונה: מידה ומצב הפריט בצ׳יפים, מחיר וקישור "Save for later". הכי אינפורמטיבי.',
   '<div class="screen m">' + head('Cart') + tot + '<div class="c2">' + IT.slice(0, 4).map(function (i) { return '<div class="card"><div class="th" ' + bg(i) + '></div>' + RM + '<div class="inf"><div class="nm">' + i.n + '</div><div class="sl">' + i.s + '</div><div class="chips"><span>' + i.sz + '</span><span>' + i.c + '</span></div><div class="pr"><span class="money">' + m(i.p) + '</span><a>Save for later</a></div></div></div>'; }).join('') + '</div>' + pill('6 items', TOTAL) + '</div>'],

  ['N · מדורג (מייסונרי)', 'שני טורים בגבהים שונים, הטור הימני מוזז למטה. נראה כמו לוח השראה ולא כמו טבלה.',
   '<div class="screen n">' + head('Cart') + tot + '<div class="c2">' + [[IT[0], IT[2], IT[4]], [IT[1], IT[3], IT[5]]].map(function (col) { return '<div class="col">' + col.map(function (i) { return '<div><div class="th" style="height:' + i.h + 'px;background-image:url(\'' + i.img + '\');background-position:' + i.pos + '">' + RM + '</div><div class="nm"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div><div class="sl">' + i.s + '</div></div>'; }).join('') + '</div>'; }).join('') + '</div>' + pill('6 items', TOTAL) + '</div>'],

  ['O · כהה', 'כרטיסים כהים על רקע שחור עם טקסט בהיר. גלולת התשלום בהירה כדי לבלוט.',
   '<div class="screen o">' + head('Cart') + tot + '<div class="c2">' + IT.slice(0, 4).map(function (i) { return '<div class="card"><div class="th" ' + bg(i) + '></div>' + RM + '<div class="inf"><div class="sl">' + i.s + '</div><div class="nm">' + i.n + '</div><div class="pr money">' + m(i.p) + '</div></div></div>'; }).join('') + '</div>' + pill('6 items', TOTAL) + '</div>'],

  ['P · בחירה במסגרת', 'פריט שנבחר לתשלום מקבל מסגרת שחורה, ופריט שלא נבחר נחלש. ברור מיד מה משלמים עליו.',
   '<div class="screen p">' + head('Cart') + '<div class="hint"><span>3 of 4 selected</span><u>Select all</u></div><div class="c2">' + IT.slice(0, 4).map(function (i, k) { return '<div class="card' + (k === 2 ? '' : ' on') + '"><div class="th" ' + bg(i) + '></div>' + CK + '<div class="nm"><span>' + i.n + '</span><span class="money">' + m(i.p) + '</span></div></div>'; }).join('') + '</div>' + pill('3 selected', 980 + 690 + 210) + '</div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
