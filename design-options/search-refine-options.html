<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Refine Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --line: #e4e1dc; --ring: #E8842B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
h2 { font-size: 15px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; text-align: center; color: #55514a; margin: 40px 0 20px; direction: rtl; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 10px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 560px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 728px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); padding: 0 24px; }
.sbar { display: flex; align-items: center; gap: 12px; padding: 40px 0 12px; border-bottom: 1.5px solid #111; }
.sbar .q { flex: 1; font-size: 16px; }
.sbar svg { width: 20px; height: 20px; stroke: #111; stroke-width: 1.3; fill: none; }
.rhead { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 18px 0 14px; display: flex; justify-content: space-between; align-items: center; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.2); }
.money { font-variant-numeric: tabular-nums; }
.cap { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ico { width: 16px; height: 16px; stroke: #111; stroke-width: 1.3; fill: none; vertical-align: middle; }

/* PB rows (the chosen result style) */
.row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.row .th { width: 60px; height: 76px; flex: none; }
.row .nm { flex: 1; } .row .nm b { font-weight: 400; font-size: 15px; display: block; } .row .nm small { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.row .pr { font-size: 15px; }
.dim { opacity: 0.25; }

/* ===== REFINE ===== */
/* FA chip strip */
.chips { display: flex; gap: 8px; overflow: hidden; margin: 14px -24px 0 0; padding-bottom: 2px; white-space: nowrap; }
.chip { border: 1px solid #cfcbc4; border-radius: 999px; padding: 8px 14px; font-size: 11px; letter-spacing: 1px; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: #111; color: #fff; border-color: #111; }
.chip .x { font-size: 12px; opacity: 0.7; }

/* FB bottom sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 12px 24px 24px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: #d6d2cb; margin: 0 auto 16px; }
.sheet .t { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.sheet .t b { font-weight: 400; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.sgrp { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sgrp .cap { margin-bottom: 10px; display: block; }
.sizes { display: flex; gap: 8px; }
.sz { width: 44px; height: 36px; border: 1px solid #cfcbc4; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.sz.on { background: #111; color: #fff; border-color: #111; }
.sws { display: flex; gap: 12px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ddd; }
.sw.on { outline: 1.5px solid #111; outline-offset: 3px; }
.range { position: relative; height: 2px; background: #e4e1dc; margin: 14px 4px 10px; }
.range i { position: absolute; top: 0; height: 2px; background: #111; left: 18%; right: 35%; }
.range b { position: absolute; top: -7px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid #111; }
.rlab { display: flex; justify-content: space-between; font-size: 12px; }
.cta { display: block; text-align: center; background: #111; color: #fff; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; padding: 15px; margin-top: 18px; }
.cta.ghost { background: none; color: #111; border: 1px solid #111; }

/* FC side drawer */
.drawer { position: absolute; top: 0; bottom: 0; right: 0; width: 290px; background: #fff; padding: 44px 24px 24px; box-shadow: -10px 0 30px rgba(0,0,0,0.12); direction: ltr; }
.drawer .t { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; display: flex; justify-content: space-between; }
.acc { border-bottom: 1px solid var(--line); padding: 15px 0; display: flex; justify-content: space-between; font-size: 14px; }
.acc span { color: var(--muted); font-size: 12px; }
.acc.open { display: block; }
.acc.open .hd { display: flex; justify-content: space-between; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 12px; }
.chk i { width: 14px; height: 14px; border: 1px solid #111; display: inline-block; }
.chk i.on { background: #111; }
.chk em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11px; }
.drawer .cta { position: absolute; left: 24px; right: 24px; bottom: 28px; }

/* FD sticky bar */
.toolbar { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 14px; }
.toolbar div { flex: 1; text-align: center; padding: 13px 0; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
.toolbar div + div { border-left: 1px solid var(--line); }
.toolbar .badge { background: #111; color: #fff; border-radius: 999px; font-size: 9px; padding: 2px 6px; letter-spacing: 0; }
.applied { font-size: 11px; color: var(--muted); margin-top: 10px; letter-spacing: 0.5px; }
.applied u { color: #111; text-decoration: none; border-bottom: 1px solid #111; }
.pop { position: absolute; left: 24px; right: 24px; top: 178px; background: #fff; border: 1px solid #111; padding: 6px 18px; box-shadow: 0 14px 30px rgba(0,0,0,0.12); }
.pop div { padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.pop div:last-child { border-bottom: none; }

/* ===== EMPTY ===== */
.empty { text-align: center; padding-top: 70px; }
.empty .big { font-size: 26px; letter-spacing: 1px; margin-top: 18px; }
.empty .msg { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
.empty .circle { width: 70px; height: 70px; border-radius: 50%; border: 1px solid #cfcbc4; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
.empty .circle svg { width: 26px; height: 26px; stroke: #111; stroke-width: 1.1; fill: none; }
.tight { padding-top: 26px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
.did { font-size: 15px; margin-top: 26px; }
.did u { text-decoration: none; border-bottom: 1px solid #111; font-style: italic; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.mini .th { aspect-ratio: 3/4; }
.mini .p { font-size: 11px; margin-top: 5px; display: flex; justify-content: space-between; }
.alert { border: 1px solid #111; padding: 18px; margin-top: 26px; text-align: left; display: flex; gap: 14px; align-items: center; }
.alert svg { width: 22px; height: 22px; stroke: #111; stroke-width: 1.2; fill: none; flex: none; }
.alert b { font-weight: 400; font-size: 14px; display: block; }
.alert small { font-size: 11px; color: var(--muted); }
.tog { width: 38px; height: 22px; border-radius: 22px; background: #111; position: relative; flex: none; margin-left: auto; }
.tog::after { content: ''; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.strip { display: flex; gap: 10px; overflow: hidden; margin-right: -24px; }
.strip .c { width: 120px; flex: none; } .strip .th { height: 150px; }
.strip .p { font-size: 11px; margin-top: 5px; }
</style>
</head>
<body>
<h1>Search — המשך (סינון + אין תוצאות)</h1>
<p class="sub">מה קורה אחרי שהתוצאות מופיעות · 4 אופציות לסינון ומיון + 4 למצב "לא נמצא"</p>

<h2>— סינון ומיון התוצאות —</h2>
<div class="grid" id="refine"></div>

<h2>— כשאין תוצאות —</h2>
<div class="grid" id="empty"></div>

<script>
var P = [
  { n: 'Wool Overcoat',   s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      pos: '50% 30%' },
  { n: 'Chelsea Boots',   s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Linen Overshirt', s: 'Atelier Nord', p: 340, img: '../women-hero.jpg',    pos: '20% 40%' },
  { n: 'Silk Scarf',      s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    pos: '50% 50%' },
  { n: 'Denim Jacket',    s: 'Denim Lab',    p: 450, img: '../gallery-hero.jpg',  pos: '50% 50%' },
  { n: 'Leather Belt',    s: 'Milano Feet',  p: 190, img: '../magazine-hero.jpg', pos: '50% 50%' }
];
var m = v => '₪' + v.toLocaleString('en-US');
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var MAG = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
var FUN = '<svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>';
var SORT = '<svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>';
var BELL = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
var sbar = (q, extra) => '<div class="sbar"><span class="q">' + q + '</span>' + (extra || '') + MAG + '</div>';
var rows = (arr, cls) => arr.map(c => '<div class="row ' + (cls || '') + '"><div class="th" ' + bg(c) + '></div><div class="nm"><b>' + c.n + '</b><small>' + c.s + '</small></div><div class="pr money">' + m(c.p) + '</div></div>').join('');

var REFINE = [
  ['FA · שורת צ\'יפים', 'שורת צ\'יפים נגללת מתחת לחיפוש: מיון, מידה, צבע, מחיר. פילטר פעיל נצבע בשחור עם ×. מהיר ותמיד גלוי.',
   '<div class="screen">' + sbar('coat') +
   '<div class="chips"><span class="chip">' + SORT + ' Sort</span><span class="chip on">Size M <span class="x">×</span></span><span class="chip on">Under ₪500 <span class="x">×</span></span><span class="chip">Color</span><span class="chip">Condition</span><span class="chip">Brand</span></div>' +
   '<div class="rhead"><span>3 results</span><span>Clear all</span></div>' + rows([P[2], P[4], P[3], P[5]]) + '</div>'],

  ['FB · גיליון מלמטה', 'כפתור Filter פותח גיליון מלמטה עם כל הפילטרים במקום אחד — מידה, צבע, טווח מחיר — וכפתור "הצג 12 תוצאות".',
   '<div class="screen">' + sbar('coat', FUN) + '<div class="rhead"><span>24 results</span><span>Sort ⌄</span></div>' + rows(P.slice(0,4)) +
   '<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="t"><b>Filter</b><span class="cap">Reset</span></div>' +
   '<div class="sgrp"><span class="cap">Size</span><div class="sizes"><span class="sz">XS</span><span class="sz">S</span><span class="sz on">M</span><span class="sz">L</span><span class="sz">XL</span></div></div>' +
   '<div class="sgrp"><span class="cap">Color</span><div class="sws"><span class="sw on" style="background:#111"></span><span class="sw" style="background:#f4f1ea"></span><span class="sw" style="background:#8a6a4a"></span><span class="sw" style="background:#5b6b7d"></span><span class="sw" style="background:#7a7f5c"></span><span class="sw" style="background:#a33"></span></div></div>' +
   '<div class="sgrp" style="border:none"><span class="cap">Price</span><div class="range"><i></i><b style="left:16%"></b><b style="left:63%"></b></div><div class="rlab money"><span>₪150</span><span>₪600</span></div></div>' +
   '<span class="cta">Show 12 results</span></div></div>'],

  ['FC · מגירה מהצד', 'מגירה צדדית עם אקורדיון לכל קטגוריה ומספר הפריטים ליד כל אפשרות. מתאים כשיש הרבה פילטרים.',
   '<div class="screen">' + sbar('coat', FUN) + '<div class="rhead"><span>24 results</span><span>Sort ⌄</span></div>' + rows(P.slice(0,5)) +
   '<div class="scrim"></div><div class="drawer"><div class="t"><span>Refine</span><span style="font-size:16px">×</span></div>' +
   '<div class="acc"><b style="font-weight:400">Sort by</b><span>Newest</span></div>' +
   '<div class="acc open"><div class="hd"><b style="font-weight:400">Category</b><span>−</span></div>' +
   '<div class="chk"><i class="on"></i>Coats<em>14</em></div><div class="chk"><i></i>Jackets<em>7</em></div><div class="chk"><i></i>Blazers<em>3</em></div></div>' +
   '<div class="acc"><b style="font-weight:400">Size</b><span>M</span></div>' +
   '<div class="acc"><b style="font-weight:400">Color</b><span>Any</span></div>' +
   '<div class="acc"><b style="font-weight:400">Price</b><span>Any</span></div>' +
   '<div class="acc"><b style="font-weight:400">Condition</b><span>Any</span></div>' +
   '<span class="cta">Show 14</span></div></div>'],

  ['FD · סרגל Filter | Sort', 'סרגל דק עם שני חצאים, Filter ו-Sort. Sort נפתח כתפריט קטן במקום. שורת סיכום מראה מה מסונן כרגע.',
   '<div class="screen">' + sbar('coat') +
   '<div class="toolbar"><div>' + FUN + ' Filter <span class="badge">2</span></div><div>' + SORT + ' Sort</div></div>' +
   '<div class="applied">Size M · Under ₪500 · <u>Clear</u></div>' +
   '<div style="margin-top:8px">' + rows([P[2], P[4], P[3], P[5]], 'dim') + '</div>' +
   '<div class="pop"><div>Recommended <span>✓</span></div><div>Newest</div><div>Price: low to high</div><div>Price: high to low</div><div>Most saved</div></div></div>']
];

var EMPTY = [
  ['EA · הודעה + הצעות', 'אייקון עדין, "לא מצאנו" ושורת חיפושים פופולריים כצ\'יפים ללחיצה. מינימלי, שקט.',
   '<div class="screen">' + sbar('cashmere poncho') +
   '<div class="empty"><div class="circle">' + MAG + '</div><div class="big">No results</div><div class="msg">לא מצאנו פריטים עבור "cashmere poncho".<br>נסו מילה אחרת או אחת מהאלו:</div>' +
   '<div class="sugg"><span class="chip">Cashmere</span><span class="chip">Poncho</span><span class="chip">Knitwear</span><span class="chip">Wool coat</span><span class="chip">Scarf</span></div></div></div>'],

  ['EB · "התכוונת ל…" + דומים', 'תיקון כתיב אוטומטי ("Did you mean") ומתחת גריד של פריטים קרובים, כדי שהמסך לא יישאר ריק.',
   '<div class="screen">' + sbar('overcaot') +
   '<div class="empty tight" style="text-align:left"><div class="did">Did you mean <u>overcoat</u>?</div><div class="msg" style="margin-top:6px">אין תוצאות ל-"overcaot".</div></div>' +
   '<div class="rhead" style="margin-top:30px"><span>You might like</span><span>See all</span></div><div class="mini">' +
   P.map(c => '<div><div class="th" ' + bg(c) + '></div><div class="p"><span>' + c.n.split(' ')[0] + '</span><span class="money">' + m(c.p) + '</span></div></div>').join('') + '</div></div>'],

  ['EC · התראה כשיגיע', 'מציע לשמור את החיפוש ולקבל התראה כשמוכר יעלה פריט מתאים. הופך מבוי סתום לסיבה לחזור.',
   '<div class="screen">' + sbar('cashmere poncho') +
   '<div class="empty"><div class="big">Nothing yet</div><div class="msg">אף אחד עוד לא העלה "cashmere poncho".<br>פריטים חדשים עולים כל יום.</div>' +
   '<div class="alert">' + BELL + '<div><b>Notify me</b><small>We\'ll ping you when one lands</small></div><span class="tog"></span></div>' +
   '<span class="cta ghost" style="margin-top:14px">Browse knitwear</span></div></div>'],

  ['ED · פילטרים חוסמים', 'כשאין תוצאות בגלל הפילטרים — מראה אילו פילטרים להסיר וכמה תוצאות יופיעו. ומתחת פס של פריטים קרובים.',
   '<div class="screen">' + sbar('coat') +
   '<div class="chips"><span class="chip on">Size XS <span class="x">×</span></span><span class="chip on">Red <span class="x">×</span></span><span class="chip on">Under ₪200 <span class="x">×</span></span></div>' +
   '<div class="empty tight"><div class="big">0 results</div><div class="msg">הפילטרים צרים מדי. נסו להסיר אחד:</div></div>' +
   '<div style="margin-top:14px"><div class="row" style="padding:13px 0"><div class="nm"><b>Remove "Red"</b></div><span class="cap" style="color:#111">4 results →</span></div><div class="row" style="padding:13px 0"><div class="nm"><b>Remove "Under ₪200"</b></div><span class="cap" style="color:#111">6 results →</span></div></div>' +
   '<div class="rhead" style="margin-top:22px"><span>Close matches</span><span></span></div><div class="strip">' +
   P.slice(0,4).map(c => '<div class="c"><div class="th" ' + bg(c) + '></div><div class="p">' + c.n + '</div></div>').join('') + '</div></div>']
];

var render = (host, arr) => document.getElementById(host).innerHTML = arr.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
render('refine', REFINE);
render('empty', EMPTY);
</script>
</body>
</html>
