<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="stylesheet" href="design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Promo Studio</title>

    <!--
        A blank sheet for the promoted-product slide — the wide hero with the
        company name, the piece's name, a line of description and the Buy Now bar,
        the product standing in a flat panel beside it.

        Write the slide's markup on the left and its CSS on the right; the preview
        redraws as you type. The slide is fed the same product shape the app uses,
        and the company-name fitter runs on it exactly as it does on the site, so
        what you build here is what the real hero looks like.

        Nothing here touches the live site. When a slide is right, say so and it
        gets wired into the .promo-slider rules in index.html (and, because it is
        ONE definition, into every promoted slider on the site at once).

        Your work is kept in localStorage, so a reload holds it. "מאפס" clears the
        sheet; "הנוכחי" loads the slide the site ships today, to start from.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f6f5f3;
            color: #111;
            font-family: 'Playfair Display', Georgia, serif;
            height: 100vh;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            overflow: hidden;
        }

        /* ---- Head ---- */
        .cs-head {
            display: flex;
            align-items: baseline;
            gap: 18px;
            flex-wrap: wrap;
            padding: 16px 26px;
            background: #fff;
            border-bottom: 1px solid #e6e4de;
        }
        .cs-title {
            font-family: 'Oswald', sans-serif;
            font-size: 18.33px;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }
        .cs-title span { color: #b3b3b3; }
        .cs-sub { font-size: 10.83px; color: #8a8a8a; }
        .cs-head .cs-tools { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }

        .cs-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 9.17px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 9px 14px;
            border: 1px solid #d8d5cc;
            border-radius: 6px;
            background: #fff;
            color: #111;
            cursor: pointer;
        }
        .cs-btn:hover { background: #f0efeb; }
        .cs-btn.dark { background: #22372B; border-color: #22372B; color: #fff; }
        .cs-btn.dark:hover { background: #2E4A3A; }

        /* ---- Controls strip ---- */
        .cs-controls {
            direction: rtl;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 10px 26px;
            background: #fff;
            border-bottom: 1px solid #e6e4de;
            font-family: 'Oswald', sans-serif;
            font-size: 9.17px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #666;
        }
        .cs-controls label { display: flex; align-items: center; gap: 8px; }
        .cs-controls select, .cs-controls input[type="range"] { font: inherit; }
        .cs-controls select {
            border: 1px solid #d8d5cc;
            border-radius: 6px;
            padding: 6px 8px;
            background: #fff;
        }
        .cs-saved { color: #9a9a9a; margin-inline-start: auto; }

        /* ---- Stage: the hero is wide, so it gets the full width on top ---- */
        .cs-stage {
            direction: ltr;
            overflow: auto;
            padding: 30px 26px;
            background:
                linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px) 0 0 / 24px 24px,
                #f6f5f3;
        }
        .cs-stage.dark { background: #191919; }
        .cs-stage.dark .cs-caption { color: #777; }

        .cs-caption {
            font-family: 'Oswald', sans-serif;
            font-size: 8.33px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9a9a9a;
            margin: 0 0 14px;
        }

        /* The cut-out / photo option needs the panel to hold an image; the site's
           promo panel only ever holds an emoji, so this rule lives in the studio
           chrome and is NOT part of the CSS you copy. */
        .cs-stage .promo-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 12%;
        }

        /* ---- Editors: the two code panes, side by side under the stage ---- */
        .cs-editors {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            height: 250px;
            border-top: 1px solid #e6e4de;
            background: #fff;
            min-height: 0;
        }
        .cs-pane {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-height: 0;
            border-inline-start: 1px solid #e6e4de;
        }
        .cs-pane:first-child { border-inline-start: 0; }
        .cs-panehead {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #fafaf8;
            border-bottom: 1px solid #eceae4;
            font-family: 'Oswald', sans-serif;
            font-size: 9.17px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #555;
        }
        .cs-panehead small {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
            text-transform: none;
            color: #a0a0a0;
        }
        .cs-code {
            width: 100%;
            height: 100%;
            border: 0;
            resize: none;
            padding: 14px 16px;
            font-family: 'Consolas', 'Menlo', monospace !important;
            font-size: 10.83px;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            tab-size: 4;
            outline: none;
            background: #fff;
            color: #1b1b1b;
        }
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
</head>
<body>

<div class="cs-head">
    <h1 class="cs-title"><span>/</span> Promo Studio</h1>
    <p class="cs-sub">גיליון ריק לסליידר המוצר המקודם. כותבים למטה, רואים למעלה — שום דבר כאן לא נוגע באתר.</p>
    <div class="cs-tools">
        <button class="cs-btn" id="btnCurrent">הנוכחי</button>
        <button class="cs-btn" id="btnBlank">מאפס</button>
        <button class="cs-btn dark" id="btnCopy">העתק HTML + CSS</button>
    </div>
</div>

<div class="cs-controls">
    <label>מוצר <select id="prodSel"></select></label>
    <label>גודל שם החברה <input id="compIn" type="range" min="30" max="90" value="69"><span id="compOut">69px</span></label>
    <label>תמונה
        <select id="imgSel">
            <option value="emoji">אימוג׳י</option>
            <option value="cutout">PNG חתוך</option>
            <option value="photo">תצלום מלא</option>
        </select>
    </label>
    <label>רקע
        <select id="bgSel">
            <option value="light">בהיר</option>
            <option value="dark">כהה</option>
        </select>
    </label>
    <span class="cs-saved" id="savedOut"></span>
</div>

<div class="cs-stage" id="stage"></div>

<div class="cs-editors">
    <div class="cs-pane">
        <div class="cs-panehead">HTML <small>— {{company}} {{name}} {{desc}} {{price}} {{oldPrice}} {{discount}} {{image}}</small></div>
        <textarea class="cs-code" id="htmlIn" spellcheck="false"></textarea>
    </div>
    <div class="cs-pane">
        <div class="cs-panehead">CSS <small>— ממודר לסליידר בלבד</small></div>
        <textarea class="cs-code" id="cssIn" spellcheck="false"></textarea>
    </div>
</div>

<script>
    /* The products the studio draws with — the same shape the app's promo slider
       gets. `company` is the brand line set large across the top; `name` is the
       piece's own name, bold beneath it; `desc` is one editorial line. */
    const PRODUCTS = [
        { company: 'Ralph Lauren',   name: 'Navy Blazer',          desc: 'Tailored wool blazer, sharp shoulders, kept in mint condition.',        price: '₪320.00', oldPrice: '₪420.00', discount: '-24%', icon: '👔' },
        { company: "Levi's",         name: 'Classic Denim Jacket', desc: 'Quality denim jacket from the 90s in excellent condition. Made from thick denim with strong stitching.', price: '₪89.99',  oldPrice: '₪140.00', discount: '-36%', icon: '🧥' },
        { company: 'Vero Select',    name: 'Pants Classic',        desc: 'Wide-leg utility trousers, deep pockets, an everyday staple.',           price: '₪190.90', oldPrice: '₪250.00', discount: '-24%', icon: '👖' },
        { company: 'Watercolor Studio', name: 'Watercolor Landscape', desc: 'An original watercolour on cotton paper, signed by the artist.',      price: '₪290.00', oldPrice: '₪360.00', discount: '-19%', icon: '💧' }
    ];

    /* A blank sheet — enough structure to see the two halves, nothing decided. */
    const BLANK_HTML = `<div class="promo-slide">
    <div class="promo-text">
        <span class="promo-label">{{company}}</span>
        <h2 class="promo-title">{{name}}</h2>
        <p class="promo-desc">{{desc}}</p>
        <button class="promo-readmore">
            <span class="promo-buylabel">Buy Now</span>
            <span class="promo-buyprice">{{price}}</span>
        </button>
    </div>
    <div class="promo-image">{{image}}</div>
</div>`;

    const BLANK_CSS = `.promo-slider { --promo-company: 69px; }

.promo-slide {
    display: grid;
    grid-template-columns: minmax(0, 600px) minmax(0, 620px);
    gap: 88px;
}

.promo-image {
    aspect-ratio: 4 / 5;
    background: #f2f0ec;
    display: grid;
    place-items: center;
    font-size: 175.00px;
}`;

    /* The slide the site ships today, to start from rather than from nothing.
       This is the .promo-slide markup index.html emits (promoSlideHTML). The
       company name is split into one <span> per word by the studio, and the
       one-word class + the fitter are applied for you, exactly as on the site. */
    const CURRENT_HTML = `<div class="promo-slide">
    <div class="promo-text">
        <!-- Company name first and large, regular weight; the piece's name
             sits under it, smaller and bold. -->
        <div class="promo-head">
            <span class="promo-label">{{company}}</span>
            <h2 class="promo-title">{{name}}</h2>
        </div>
        <div class="promo-foot">
            <p class="promo-desc">{{desc}}</p>
            <!-- Buy bar: label on the left, price on the right. -->
            <button class="promo-readmore">
                <span class="promo-buylabel">Buy Now</span>
                <span class="promo-buyprice">{{price}}</span>
            </button>
        </div>
    </div>
    <div class="promo-image">{{image}}</div>
</div>`;

    const CURRENT_CSS = `/* The promoted-product slider, trimmed to what shapes the slide. The full rule
   set is in index.html under ".promo-slider — ONE definition" — edit freely,
   this copy is only a starting point. */
.promo-slider {
    direction: ltr;
    /* Company-name size; every other size below is fixed to match it. */
    --promo-company: 69px;
}
.promo-viewport { overflow: hidden; margin: 0 145px; }

.promo-slide {
    min-width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 600px) minmax(0, 620px);
    justify-content: center;      /* center the image+text pair on the page */
    align-items: stretch;         /* the copy runs the image's full height */
    gap: 88px;
    padding: 24px 30px;
}

.promo-image {
    width: 100%;
    max-width: 620px;
    aspect-ratio: 4 / 5;
    background: #f2f0ec;          /* flat, minimalist neutral */
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 175.00px;
    color: rgba(0, 0, 0, 0.10);
}

.promo-text {
    direction: ltr;
    text-align: left;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* Company name on the image's top edge, buy bar on its bottom edge. */
    justify-content: space-between;
    gap: 26px;
    min-height: 100%;
}

/* Two tight groups: company + name at the top, desc + buy bar at the bottom. */
.promo-head, .promo-foot {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
    gap: 8px;
}
.promo-foot { gap: 12px; }

/* Company name — the first line, large and in the regular weight. */
.promo-label {
    font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: var(--promo-company, 46px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: calc(var(--promo-company, 46px) * 2.2);
    overflow-wrap: normal;
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1.1;
    color: #111;
}
.promo-label > span { white-space: nowrap; }
/* A single word has no second line, so it is set at twice the size to fill the
   same block a stacked two-word name does. */
.promo-label.one-word { font-size: calc(var(--promo-company, 46px) * 2); }

/* The piece's own name — smaller than the company name, and bold. */
.promo-title {
    font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 30.00px;
    font-weight: 700;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    line-height: 1.25;
    letter-spacing: 0.5px;
    color: #111;
}

.promo-desc {
    font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 15.83px;
    line-height: 1.7;
    color: #6b665e;
    max-width: 480px;
}

/* Pale rounded bar: label on the left, the piece's price on the right. */
.promo-readmore {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    width: 100%;
    height: 66px;
    border-radius: 16px;
    background: #f1f1ef;
    border: none;
    cursor: pointer;
    font-family: 'Oswald', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11.67px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #111;
    padding: 0 24px;
    transition: background 0.25s, transform 0.25s;
}
.promo-readmore .promo-buyprice { font-weight: 700; letter-spacing: 0.5px; }
.promo-readmore:hover { background: #e6e6e3; transform: translateY(-2px); }`;

    const state = { product: 0, company: 69, images: 'emoji', bg: 'light' };
    const htmlIn = document.getElementById('htmlIn');
    const cssIn  = document.getElementById('cssIn');
    const stage  = document.getElementById('stage');

    function imageFor(p) {
        if (state.images === 'cutout') {
            return `<img src="${cutoutStandIn(p)}" alt="${p.name}">`;
        }
        if (state.images === 'photo') {
            const seed = encodeURIComponent(p.name);
            return `<img src="https://picsum.photos/seed/vero-${seed}/800/1000" alt="${p.name}"
                         style="object-fit:cover;padding:0">`;
        }
        return p.icon;
    }

    /* A stand-in for a real cut-out: the piece's emoji drawn onto a transparent
       square, exactly what cutout.js hands the panel. Cached per product. */
    const cutoutCache = {};
    function cutoutStandIn(p) {
        if (cutoutCache[p.name]) return cutoutCache[p.name];
        const c = document.createElement('canvas');
        c.width = c.height = 600;
        const ctx = c.getContext('2d');          // left transparent on purpose
        ctx.font = '460px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.icon, 300, 320);
        return (cutoutCache[p.name] = c.toDataURL('image/png'));
    }

    // The company name is set one word per line — each word its own span, the
    // same shape the site builds before the fitter measures it.
    function companyWords(company) {
        return company.trim().split(/\s+/).map(w => `<span>${w}</span>`).join('');
    }

    // The tokens are the only contract between the markup and the product.
    function fill(tpl, p) {
        return tpl
            .replace(/\{\{company\}\}/g,  companyWords(p.company))
            .replace(/\{\{name\}\}/g,     p.name)
            .replace(/\{\{desc\}\}/g,     p.desc)
            .replace(/\{\{price\}\}/g,    p.price)
            .replace(/\{\{oldPrice\}\}/g, p.oldPrice)
            .replace(/\{\{discount\}\}/g, p.discount)
            .replace(/\{\{image\}\}/g,    imageFor(p));
    }

    /* The site's own company-name fitter, run on the studio's stage. A two-word
       name stacks at the base size; a single word is set larger, then both are
       capped by what actually fits the column so no word wraps mid-way. */
    function promoFitLabels(root) {
        root.querySelectorAll('.promo-label').forEach(el => {
            const col = el.closest('.promo-text');
            if (!col || !col.clientWidth) return;
            const base = parseFloat(getComputedStyle(el).getPropertyValue('--promo-company')) || 46;
            const wanted = el.classList.contains('one-word') ? base * 2 : base;
            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:83.33px';
            probe.style.fontFamily = getComputedStyle(el).fontFamily;
            probe.style.fontWeight = getComputedStyle(el).fontWeight;
            document.body.appendChild(probe);
            let widest = 0;
            el.textContent.trim().split(/\s+/).forEach(w => {
                probe.textContent = w;
                widest = Math.max(widest, probe.getBoundingClientRect().width);
            });
            probe.remove();
            if (!widest) return;
            const maxForWidth = (col.clientWidth * 0.94 / widest) * 100;
            el.style.fontSize = Math.floor(Math.min(wanted, maxForWidth)) + 'px';
        });
    }

    function render() {
        const p = PRODUCTS[state.product];
        const slide = fill(htmlIn.value, p);

        stage.classList.toggle('dark', state.bg === 'dark');
        stage.innerHTML = `
            <style id="promoCSS">${cssIn.value}</style>
            <p class="cs-caption">Promoted slide · ${p.company}</p>
            <div class="promo-slider" style="--promo-company: ${state.company}px">
                <div class="promo-viewport">
                    <div class="promo-track">${slide}</div>
                </div>
            </div>`;

        // Mark single-word company names, then fit — exactly as the site does.
        stage.querySelectorAll('.promo-label').forEach(el => {
            if (el.children.length <= 1) el.classList.add('one-word');
        });
        promoFitLabels(stage);
        save();
    }

    /* ---- What you wrote, kept ---- */
    function save() {
        localStorage.setItem('veroPromoStudio', JSON.stringify({ html: htmlIn.value, css: cssIn.value }));
        document.getElementById('savedOut').textContent = 'נשמר ' + new Date().toLocaleTimeString('he-IL');
    }
    function load(html, css) { htmlIn.value = html; cssIn.value = css; render(); }

    const saved = JSON.parse(localStorage.getItem('veroPromoStudio') || 'null');
    load(saved ? saved.html : CURRENT_HTML, saved ? saved.css : CURRENT_CSS);

    /* ---- Wiring ---- */
    htmlIn.addEventListener('input', render);
    cssIn.addEventListener('input', render);
    window.addEventListener('resize', () => promoFitLabels(stage));

    document.getElementById('btnBlank').onclick   = () => load(BLANK_HTML, BLANK_CSS);
    document.getElementById('btnCurrent').onclick = () => load(CURRENT_HTML, CURRENT_CSS);
    document.getElementById('btnCopy').onclick = async () => {
        await navigator.clipboard.writeText(
            '<!-- HTML -->\n' + htmlIn.value + '\n\n/* CSS */\n' + cssIn.value);
        document.getElementById('savedOut').textContent = 'הועתק ללוח';
    };

    const sel = document.getElementById('prodSel');
    sel.innerHTML = PRODUCTS.map((p, i) => `<option value="${i}">${p.company} — ${p.name}</option>`).join('');
    sel.onchange = e => { state.product = +e.target.value; render(); };

    const compIn = document.getElementById('compIn');
    compIn.oninput = e => {
        state.company = +e.target.value;
        document.getElementById('compOut').textContent = state.company + 'px';
        render();
    };
    document.getElementById('imgSel').onchange = e => { state.images = e.target.value; render(); };
    document.getElementById('bgSel').onchange  = e => { state.bg = e.target.value; render(); };

    // Tab types a tab instead of leaving the pane.
    [htmlIn, cssIn].forEach(box => box.addEventListener('keydown', e => {
        if (e.key !== 'Tab') return;
        e.preventDefault();
        const s = box.selectionStart;
        box.value = box.value.slice(0, s) + '    ' + box.value.slice(box.selectionEnd);
        box.selectionStart = box.selectionEnd = s + 4;
        render();
    }));
</script>
</body>
</html>
