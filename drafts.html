<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — My Drafts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            overflow-x: hidden;
        }

        .page-cover { display: none; }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 12px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        .wrap {
            max-width: none; margin: 0;
            padding: 120px 40px 80px;
            animation: slideInLeft 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-18vw); }
            to   { opacity: 1; transform: none; }
        }

        .side-image {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 20vw;
            background: #2a2a28 url('assets/products-hero.jpg') center / cover no-repeat;
            filter: grayscale(1);
            border-right: 1px solid #000;
            z-index: 5;
        }
        @media (min-width: 1001px) { .wrap { padding-left: calc(20vw + 60px); } }
        @media (max-width: 1000px) { .side-image { display: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { margin-top: 16px; font-size: 15px; color: #6b6b66; letter-spacing: 0.5px; }

        .section { margin-top: 44px; }
        .section-head {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 1px solid #000; padding-bottom: 14px;
        }
        .section-title { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
        .section-note { font-size: 12px; letter-spacing: 0.5px; color: #9a9a95; }

        .prod-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px; margin-top: 26px;
        }
        .prod { border: 1px solid #000; display: flex; flex-direction: column; background: #fff; }
        .prod-img {
            aspect-ratio: 3 / 4; background: #ececea center / cover no-repeat; position: relative;
            border-bottom: 1px solid #000;
        }
        .prod-img .placeholder {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #b8b8b3;
        }
        .badge {
            position: absolute; top: 12px; left: 12px;
            padding: 6px 12px; border-radius: 999px; font-size: 10px; letter-spacing: 1.5px;
            text-transform: uppercase; font-weight: 500; border: 1px dashed #8a8a85; background: #fff; color: #8a8a85;
        }
        .prod-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .prod-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
        .prod-meta { font-size: 12px; color: #9a9a95; letter-spacing: 0.3px; }
        .prod-price { font-size: 18px; font-weight: 400; margin-top: 2px; }
        .prod-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 14px; }
        .p-btn {
            flex: 1; border: 1px solid #000; background: #fff; cursor: pointer; font-family: inherit;
            border-radius: 999px; padding: 9px 10px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
            color: #1c1c1c; transition: background 0.2s, color 0.2s;
        }
        .p-btn:hover { background: #000; color: #fff; }
        .p-btn.danger:hover { background: #b23b3b; border-color: #b23b3b; color: #fff; }

        .empty {
            margin-top: 26px; padding: 40px; border: 1px dashed #cfcfca; text-align: center;
            color: #9a9a95; font-size: 14px; letter-spacing: 0.3px;
        }

        @media (max-width: 780px) {
            .prod-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="page-cover"></div>
    <div class="side-image"></div>
    <a class="back" href="products.html">&#8592; חזרה</a>

    <div class="wrap">
        <h1 class="head-title">My Drafts</h1>
        <p class="head-sub">Unfinished listings you saved from the upload page — pick up right where you left off.</p>

        <div class="section">
            <div class="section-head">
                <div class="section-title">Saved drafts</div>
                <div class="section-note" id="draftNote">0 drafts</div>
            </div>
            <div class="prod-grid" id="draftGrid"></div>
            <div class="empty" id="draftEmpty" style="display:none;">
                No drafts saved yet. When you tap “Save as draft” on the upload page, it will appear here.
            </div>
        </div>
    </div>

    <script>
        // Drafts always returns to My Listings; keep the seller flag so we stay in
        // the seller area rather than crossing into the buyer one.
        if (new URLSearchParams(location.search).get('from') === 'seller') {
            const back = document.querySelector('.back');
            if (back) back.setAttribute('href', 'products.html?from=seller');
        }

        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        const nis = n => n != null && n !== '' ? '₪' + (Number(n) || 0).toLocaleString('en-US') : 'No price yet';

        let drafts = readJSON('vero_drafts', []);
        if (!Array.isArray(drafts)) drafts = [];

        function imgOf(p) {
            return p.image || p.processed_cover || p.original_cover
                || (Array.isArray(p.photos) ? p.photos.find(Boolean) : null) || null;
        }
        function fmtDate(ts) {
            return ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        }
        function titleOf(p) {
            return [p.brand, p.itemType].filter(Boolean).join(' ') || 'Untitled draft';
        }

        function card(p, i) {
            const src = imgOf(p);
            const cat = p.category === 'art' ? 'Art' : p.category === 'clothing' ? 'Clothing' : '—';
            const icon = p.category === 'art' ? '🖼️' : '🛍️';
            return `
                <div class="prod">
                    <div class="prod-img" ${src ? `style="background-image:url('${src}')"` : ''}>
                        ${src ? '' : `<div class="placeholder">${icon}</div>`}
                        <span class="badge">Draft</span>
                    </div>
                    <div class="prod-body">
                        <div class="prod-name">${titleOf(p)}</div>
                        <div class="prod-meta">${cat}</div>
                        <div class="prod-price">${nis(p.price)}</div>
                        <div class="prod-meta">Saved · ${fmtDate(p.savedAt)}</div>
                        <div class="prod-actions">
                            <button class="p-btn" data-act="continue" data-i="${i}">Continue</button>
                            <button class="p-btn danger" data-act="delete" data-i="${i}">Delete</button>
                        </div>
                    </div>
                </div>`;
        }

        function render() {
            const grid = document.getElementById('draftGrid');
            grid.innerHTML = drafts.map((p, i) => card(p, i)).join('');
            document.getElementById('draftNote').textContent = `${drafts.length} draft${drafts.length === 1 ? '' : 's'}`;
            document.getElementById('draftEmpty').style.display = drafts.length ? 'none' : 'block';
        }

        document.querySelector('.wrap').addEventListener('click', (e) => {
            const btn = e.target.closest('.p-btn');
            if (!btn) return;
            const i = Number(btn.dataset.i);
            if (!drafts[i]) return;
            if (btn.dataset.act === 'delete') {
                drafts.splice(i, 1);
                save('vero_drafts', drafts);
                render();
            } else if (btn.dataset.act === 'continue') {
                // Hand the draft to the upload page, which picks it up on load.
                save('vero_resume_draft', drafts[i]);
                window.location.href = 'index.html';
            }
        });

        render();

        // Exit mirrors the entry: image static, data slides back out to the left.
        const back = document.querySelector('.back');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const wrap = document.querySelector('.wrap');
            wrap.style.animation = 'none';
            void wrap.offsetWidth;
            wrap.style.transition = 'opacity 0.55s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            wrap.style.opacity = '0';
            wrap.style.transform = 'translateX(-18vw)';
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 560);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
