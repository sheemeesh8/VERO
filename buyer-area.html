<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Personal Area</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c;
            overflow: hidden;
            background: #e6e6e3;
        }

        /* ===== The four long equal rectangles, spanning the full page width ===== */
        .panels {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);   /* four equal columns = full width */
        }
        .panel {
            position: relative;
            height: 100%;
            /* Soft vertical band: lighter at the top, a touch deeper toward the base. */
            background: linear-gradient(180deg, #edece9 0%, #dededa 55%, #cfcfca 100%);
            overflow: hidden;
        }
        /* Thin divider line between the rectangles. */
        .panel + .panel { box-shadow: -1px 0 0 rgba(0,0,0,0.10); }

        /* Alternate the band tint slightly so the four read as distinct rectangles. */
        .panel:nth-child(2) { background: linear-gradient(180deg, #eae9e6 0%, #d9d9d5 55%, #cbcbc6 100%); }
        .panel:nth-child(3) { background: linear-gradient(180deg, #ecebe8 0%, #dcdcd8 55%, #cececa 100%); }
        .panel:nth-child(4) { background: linear-gradient(180deg, #e8e7e4 0%, #d6d6d2 55%, #c8c8c3 100%); }

        /* Giant thin word running off the bottom edge of every rectangle. */
        .panel-word {
            position: absolute;
            left: -4px;
            bottom: -18px;
            font-size: clamp(48px, 5.2vw, 92px);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #23231f;
            line-height: 0.9;
            white-space: nowrap;
        }

        /* ===== Top bar: brand mark left, expand glyph right ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 34px;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-glyph {
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            position: relative;
        }
        .brand-glyph::after {
            content: "";
            position: absolute; top: 5px; left: 7px;
            width: 34px; height: 24px;
            border: 1.6px solid #1c1c1c;
            border-radius: 6px;
            background: #e6e6e3;
        }
        .brand-name { font-size: 17px; font-weight: 500; letter-spacing: 0.5px; }
        .expand {
            width: 26px; height: 26px;
            cursor: pointer;
            color: #1c1c1c;
        }
        .expand svg { width: 100%; height: 100%; }

        /* ===== Tagline (top of the second rectangle) ===== */
        .tagline {
            position: fixed;
            top: 26px;
            left: 25%;
            transform: translateX(28px);
            font-size: 15px;
            font-weight: 400;
            line-height: 1.35;
            color: #2a2a26;
            z-index: 10;
        }

        /* ===== Centre feature, sitting over the third rectangle ===== */
        .feature {
            position: fixed;
            top: 0; bottom: 0;
            left: 50%;
            width: 25%;                 /* exactly the third rectangle's width */
            z-index: 8;
            overflow: hidden;
        }
        .feature-img {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #dfe2df 0%, #c8ccc6 100%);
            background-size: cover;
            background-position: center;
        }
        .feature-inner {
            position: absolute;
            top: 74px; left: 0; right: 0;
            padding: 0 26px;
            text-align: left;
        }
        .feature-head {
            font-size: clamp(26px, 2.5vw, 40px);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.05;
            color: #1c1c1c;
        }
        .feature-cta {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 26px;
            border: 1.4px solid #1c1c1c;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: transparent;
            color: #1c1c1c;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        .feature-cta:hover { background: #1c1c1c; color: #fff; }
        .asterisk {
            position: absolute;
            top: 46%;
            right: 30%;
            font-size: 42px;
            color: #111;
            font-weight: 400;
        }

        @media (max-width: 720px) {
            body { overflow: auto; }
            .panels { position: relative; grid-template-columns: 1fr; height: auto; }
            .panel { height: 46vh; }
            .feature { position: relative; width: 100%; left: 0; height: 60vh; }
            .tagline { position: relative; left: 0; transform: none; padding: 80px 34px 0; }
        }
    </style>
</head>
<body>
    <!-- The four long equal rectangles across the full width of the page -->
    <div class="panels">
        <div class="panel"><span class="panel-word">Our</span></div>
        <div class="panel"><span class="panel-word">Our</span></div>
        <div class="panel"><span class="panel-word">Our</span></div>
        <div class="panel"><span class="panel-word">Our</span></div>
    </div>

    <!-- Centre feature over the third rectangle -->
    <div class="feature">
        <div class="feature-img"></div>
        <div class="feature-inner">
            <div class="feature-head">Elevating Comfort<br>With Every Curve</div>
            <button class="feature-cta">Explore Experience</button>
        </div>
        <div class="asterisk">&#10033;</div>
    </div>

    <!-- Top bar -->
    <div class="topbar">
        <div class="brand">
            <span class="brand-glyph"></span>
            <span class="brand-name">Visionary</span>
        </div>
        <div class="expand" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
            </svg>
        </div>
    </div>

    <!-- Tagline -->
    <div class="tagline">Where Form<br>and Function Unite</div>
</body>
</html>
