<style>
  /* ---- My events (personal area): the events you're going to or hosting. Same
     centred, quiet column as the events pages; a clear line between events. ---- */
  :root { --ink: #16150f; --muted: rgba(22,21,15,0.62); --faint: rgba(22,21,15,0.42); --line: rgba(22,21,15,0.14); --line-strong: rgba(22,21,15,0.3); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #fff; color: var(--ink);
         font-size: 12px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 30px 24px calc(80px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .k { font-size: 8.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .figs { display: flex; justify-content: center; gap: 44px; margin-top: 18px; }
  .figs b { display: block; font-size: 28px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .figs span { display: block; margin-top: 7px; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .sec-h { margin-top: 44px; margin-bottom: 4px; }
  .me { padding: 30px 0; border-top: 1px solid var(--line-strong); }
  .me:last-of-type { border-bottom: 1px solid var(--line-strong); }
  .me.past { opacity: 0.55; }
  .me-date b { display: block; font-size: 34px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .me-date span { display: block; margin-top: 7px; font-size: 8px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .me-type { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .me-type i { width: 7px; height: 7px; display: inline-block; }
  .me-t { display: block; margin-top: 8px; font-size: 17px; font-weight: 300; line-height: 1.25; color: var(--ink); text-decoration: none; }
  .me-meta { margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.65; }
  .me-blurb { margin: 10px auto 0; max-width: 320px; font-size: 11px; font-weight: 300; line-height: 1.7; color: var(--muted); }
  .me-n { display: flex; justify-content: center; gap: 26px; margin-top: 16px; }
  .me-n div { font-size: 10px; color: var(--muted); }
  .me-n b { display: block; font-size: 17px; font-weight: 300; color: var(--ink); line-height: 1.1; }
  .me-rel { display: inline-block; margin-top: 14px; padding: 4px 9px; background: #16150f; color: #fff; font-size: 8px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
  .acts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px; margin-top: 20px; }
  .lnk { padding: 3px 0; background: none; border: 0; border-bottom: 1px solid var(--line-strong); cursor: pointer; text-decoration: none;
         font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
  .lnk.quiet { color: #9a3b2f; border-bottom-color: rgba(154,59,47,0.4); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff;
         text-decoration: none; cursor: pointer; font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .empty { padding: 46px 0 10px; }
  .empty p { margin: 10px auto 22px; max-width: 280px; font-size: 12px; font-weight: 300; line-height: 1.7; color: var(--muted); }
  .foot { margin-top: 36px; }
  html.is-embed .page-header { display: none; }
</style>
<link rel="stylesheet" href="assets/page-header.css?v=20261003e">
<script src="assets/page-header.js?v=20261117e"></script>

<body>
  <header class="page-header">
    <div class="ph-name" role="heading" aria-level="1">My events</div>
    <a class="ph-back" href="profile.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </header>
  <main class="wrap" id="main"></main>

  <script src="assets/events-data.js?v=3"></script>
  <script>
  (function myEvents() {
    var E = window.veroEvents, main = document.getElementById('main');
    if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('is-embed');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
    var todayIso = E.iso(E.today());

    // Inside the personal area this page is a panel: links open in the phone frame, not in the panel.
    function go(url) {
      if (window.top !== window) { try { window.top.location.hash = '#page=' + encodeURIComponent(url); return; } catch (e) {} }
      location.href = url;
    }
    function rel(ds) {
      var n = Math.round((E.parse(ds) - E.today()) / 864e5);
      return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n > 1 && n < 8 ? 'In ' + n + ' days' : '';
    }

    function item(e) {
      var d = E.parse(e.date), T = E.TYPES[e.type] || { name: 'Event', color: 'var(--muted)' }, past = e.date < todayIso;
      var sellers = E.attendees(e).length, r = past ? '' : rel(e.date);
      return '<article class="me' + (past ? ' past' : '') + '">' +
        '<div class="me-date"><b>' + d.getDate() + '</b><span>' + E.DOWF[d.getDay()] + ' · ' + E.MONF[d.getMonth()] + '</span></div>' +
        (r ? '<span class="me-rel">' + r + '</span><br>' : '') +
        '<span class="me-type"><i style="background:' + T.color + '"></i>' + esc(T.name) + (e.own ? ' · Hosted by you' : '') + '</span>' +
        '<a class="me-t" href="event.html?id=' + encodeURIComponent(e.id) + '" data-go="event.html?id=' + encodeURIComponent(e.id) + '">' + esc(e.title) + '</a>' +
        '<p class="me-meta">' + esc(e.time || 'All day') + (e.place ? '<br>' + esc(e.place) : '') + '</p>' +
        (e.blurb ? '<p class="me-blurb">' + esc(e.blurb) + '</p>' : '') +
        '<div class="me-n"><div><b>' + E.goingCount(e) + '</b>' + (past ? 'went' : 'going') + '</div><div><b>' + sellers + '</b>sellers with stalls</div></div>' +
        (past ? '' : '<div class="acts">' +
          '<button type="button" class="lnk" data-ics="' + esc(e.id) + '">Add to calendar</button>' +
          (e.place ? '<a class="lnk" href="' + esc(E.mapsUrl(e)) + '" target="_blank" rel="noopener">Directions</a>' : '') +
          (e.own ? '' : '<button type="button" class="lnk quiet" data-notgoing="' + esc(e.id) + '">Not going</button>') +
        '</div>') +
      '</article>';
    }

    function render() {
      var mine = E.mine(), up = mine.filter(function (e) { return e.date >= todayIso; }), past = mine.filter(function (e) { return e.date < todayIso; }).reverse();
      var hosting = mine.filter(function (e) { return e.own; }).length;
      var html = '<p class="k">Your calendar</p>' +
        '<div class="figs"><div><b>' + up.length + '</b><span>Coming up</span></div><div><b>' + (mine.length - hosting) + '</b><span>Going</span></div><div><b>' + hosting + '</b><span>Hosting</span></div></div>';
      if (!mine.length) {
        html += '<div class="empty"><p class="k">No events yet</p><p>Tap “I’m going” on a market, fair, meetup or pop-up and it will wait for you here.</p>' +
          '<a class="btn" href="events.html" data-go="events.html">Browse events</a></div>';
      } else {
        if (up.length) html += '<p class="k sec-h">Coming up</p>' + up.map(item).join('');
        else html += '<div class="empty"><p>Nothing coming up — find the next one on the calendar.</p></div>';
        if (past.length) html += '<p class="k sec-h">Been there</p>' + past.map(item).join('');
        html += '<div class="foot"><a class="lnk" href="events.html" data-go="events.html">All events</a></div>';
      }
      main.innerHTML = html;
    }

    document.addEventListener('click', function (ev) {
      var t;
      if ((t = ev.target.closest('[data-go]'))) { ev.preventDefault(); go(t.getAttribute('data-go')); return; }
      if ((t = ev.target.closest('[data-ics]'))) { var e = E.byId(t.getAttribute('data-ics')); if (e) E.downloadIcs(e); return; }
      if ((t = ev.target.closest('[data-notgoing]'))) { E.setGoing(t.getAttribute('data-notgoing'), false); render(); }
    });
    // Saying "I'm going" on another page shows up here at once.
    window.addEventListener('storage', function (ev) { if (ev.key === 'vero_event_going' || ev.key === 'vero_events') render(); });
    window.addEventListener('pageshow', render);
    render();
  })();
  </script>
  <script src="assets/line-icons.js"></script>
</body>
</html>
