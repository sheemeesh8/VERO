<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VERO — Intro</title>

<!--
  ===========================================================================
  VERO  ·  Cinematic Peacock Splash  (single self-contained file)
  ---------------------------------------------------------------------------
  A luminous white heraldic peacock is revealed out of near-black by a soft
  moving light, settles into its final one-legged pose, then dissolves: the
  background lifts to pure white while the bird flattens from a glowing white
  silhouette into the crisp, solid-black VERO logo (raised leg, S-neck,
  five-feather crest, ornate eye-spotted tail fan).

  STACK
    Vanilla JS + inline SVG + GSAP. Path morphing uses GSAP MorphSVG when the
    premium plugin is present, otherwise Flubber (free). Both tolerate
    mismatched anchor counts, so the path states only need to be visually
    compatible. No build step — just open the file.

  TIMELINE  (~6s, then holds)
    0.0-2.5s  Entrance  dark forest vignette; a moving light rakes the plumage;
                        slow L->R tracking-shot parallax; outline breathes
                        from the fuller "entrance" state to the settled pose.
    2.5-4.0s  Heraldic  eases to a full stop in the final one-legged pose.
    4.0-5.5s  Morph     bg dark->white; plumage white->black; lighting flattens;
              +dissolve  the solid silhouette resolves into the detailed flat
                        logo (eye-spots + feathering appear).
    5.5s+     Lock       perfectly centred static black logo on pure white.

  INTEGRATION
    - Dispatches a "vero:intro-complete" CustomEvent on `document` when done.
    - Also calls window.VeroIntro.onComplete() if you assign a function to it.
    - prefers-reduced-motion -> skips straight to the locked logo.

  The three silhouette states below were vectorised from the actual VERO
  peacock logo so the pose matches exactly:
    ENTRANCE_PATH  fuller/puffed outer silhouette (glowing plumage)
    POSE_PATH      exact solid outer silhouette (settled pose)
    LOGO_PATH      detailed flat logo (eye-spots + feather detail, evenodd)
  ===========================================================================
-->

<style>
  :root {
    --bg-dark: #0A0D0B;   /* near-black entrance background */
    --glow:    #FFFFFF;   /* luminous plumage              */
    --logo:    #000000;   /* final flat logo               */
    --paper:   #FFFFFF;   /* final background              */
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-dark);
    overflow: hidden;
  }

  /* Full-viewport, always-centred stage. */
  #vero-splash {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg-dark);
  }

  /* SVG scales responsively yet stays centred at every viewport size. */
  #vero-splash svg {
    width: min(88vmin, 680px);
    height: min(88vmin, 680px);
    display: block;
  }

  /* Reduced motion: paint the final frame instantly. */
  @media (prefers-reduced-motion: reduce) {
    html, body, #vero-splash { background: var(--paper); }
  }
</style>
</head>

<body>
  <div id="vero-splash" role="img" aria-label="VERO peacock logo">
    <svg id="vero-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Deep forest vignette behind the bird. -->
        <radialGradient id="vignette" cx="44%" cy="40%" r="78%">
          <stop offset="0%"   stop-color="#13271E" />
          <stop offset="46%"  stop-color="#0C1512" />
          <stop offset="100%" stop-color="#050706" />
        </radialGradient>

        <!-- Luminous plumage gradient, raked toward the light source. -->
        <linearGradient id="plumage" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" />
          <stop offset="55%"  stop-color="#EAF2ED" />
          <stop offset="100%" stop-color="#9DB3AB" />
        </linearGradient>

        <!-- Soft bloom for the low-key dramatic lighting. -->
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="8" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>

        <!-- Travelling light: a bright radial that sweeps across the bird. -->
        <radialGradient id="lightMask" cx="0" cy="0.34" r="0.42"
                        gradientUnits="objectBoundingBox">
          <stop offset="0%"   stop-color="#fff" stop-opacity="1" />
          <stop offset="68%"  stop-color="#fff" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0.06" />
        </radialGradient>
        <mask id="reveal">
          <rect x="0" y="0" width="800" height="800" fill="url(#lightMask)" />
        </mask>
      </defs>

      <!-- Background vignette (fades to white during the morph). -->
      <rect id="bg" x="0" y="0" width="800" height="800" fill="url(#vignette)" />

      <!-- The peacock, grouped so the whole bird can parallax-pan. -->
      <g id="peacock-group">
        <!-- Blurred glow copy for bloom (solid silhouette). -->
        <path id="peacock-glow" fill="url(#plumage)" filter="url(#glow)"
              opacity="0.9" mask="url(#reveal)" />
        <!-- Crisp luminous silhouette; this outline morphs/breathes. -->
        <path id="peacock" fill="url(#plumage)" mask="url(#reveal)" />
        <!-- Flat-black solid copy that darkens the bird during the morph. -->
        <path id="peacock-dark" fill="#000000" opacity="0" mask="url(#reveal)" />
        <!-- Detailed flat logo (eye-spots via evenodd holes); dissolves in. -->
        <path id="logo" fill="#000000" fill-rule="evenodd" opacity="0" />
      </g>
    </svg>
  </div>

  <!-- GSAP core (required). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Optional premium morph plugin; Flubber below is the free fallback. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flubber/0.4.2/flubber.min.js"></script>

    /* -- DOM refs ---------------------------------------------------------- */
    var splash   = document.getElementById("vero-splash");
    var bg       = document.getElementById("bg");
    var group    = document.getElementById("peacock-group");
    var peacock  = document.getElementById("peacock");
    var glowPath = document.getElementById("peacock-glow");
    var darkPath = document.getElementById("peacock-dark");
    var logoPath = document.getElementById("logo");
    var lightGrad= document.querySelector("#lightMask");

    // Seed the paths.
    peacock.setAttribute("d",  ENTRANCE_PATH);
    glowPath.setAttribute("d", ENTRANCE_PATH);
    darkPath.setAttribute("d", POSE_PATH);
    logoPath.setAttribute("d", LOGO_PATH);

    /* -- Completion signalling -------------------------------------------- */
    window.VeroIntro = window.VeroIntro || {};
    function fireComplete() {
      document.dispatchEvent(new CustomEvent("vero:intro-complete"));
      if (typeof window.VeroIntro.onComplete === "function") {
        try { window.VeroIntro.onComplete(); } catch (e) {}
      }
      // When embedded as an intro overlay (e.g. inside phone-frame.html), let the
      // host window know across the frame boundary so it can dismiss the splash.
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "vero:intro-complete" }, "*");
        }
      } catch (e) {}
    }

    /* -- Guaranteed final frame (shared by reduced-motion + onComplete) ---- */
    function lockFinalFrame() {
      splash.style.background = "var(--paper)";
      document.documentElement.style.background = "var(--paper)";
      document.body.style.background = "var(--paper)";
      bg.setAttribute("fill", "#FFFFFF");
      group.setAttribute("transform", "translate(0,0)");
      glowPath.style.display = "none";
      peacock.style.display  = "none";
      darkPath.style.display = "none";
      logoPath.setAttribute("mask", "none");
      logoPath.style.opacity = "1";
    }

    /* -- Reduced motion / no GSAP: skip to the locked logo ----------------- */
    var reduce = window.matchMedia &&
                 window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || typeof gsap === "undefined") {
      lockFinalFrame();
      requestAnimationFrame(function(){ requestAnimationFrame(fireComplete); });
      return;
    }

    /* -- Choose a morph engine -------------------------------------------- */
    var hasMorphSVG = !!window.MorphSVGPlugin;
    if (hasMorphSVG) gsap.registerPlugin(MorphSVGPlugin);
    var hasFlubber = typeof window.flubber !== "undefined";

    // Helper: morph #peacock outline from A to B over the given tween slot.
    function morphOutline(tl, fromD, toD, at, dur) {
      if (hasMorphSVG) {
        tl.to(peacock, { duration: dur, ease: "power2.inOut",
                         morphSVG: { shape: toD } }, at);
      } else if (hasFlubber) {
        var interp = flubber.interpolate(fromD, toD, { maxSegmentLength: 10 });
        var proxy = { t: 0 };
        tl.to(proxy, { t: 1, duration: dur, ease: "power2.inOut",
          onUpdate: function(){ peacock.setAttribute("d", interp(proxy.t)); } }, at);
      } else {
        tl.set(peacock, { attr: { d: toD } }, at + dur);
      }
    }

    /* -- Moving light: sweep the radial highlight across the bird ---------- */
    var lightState = { p: -0.15 };
    function applyLight() {
      lightGrad.setAttribute("cx", lightState.p.toFixed(3));
      lightGrad.setAttribute("cy", (0.34 + lightState.p * 0.10).toFixed(3));
    }
    applyLight();

    /* -- Master timeline --------------------------------------------------- */
    var tl = gsap.timeline({
      defaults: { ease: "power2.inOut" },
      onComplete: function(){ lockFinalFrame(); fireComplete(); }
    });

    /* 0.0-2.5s · ENTRANCE : reveal light sweep + parallax tracking shot */
    tl.fromTo(group,
      { x: -58, y: 6, scale: 0.965, transformOrigin: "50% 50%" },
      { x: 26,  y: 0, scale: 1.0,   duration: 2.5, ease: "power1.inOut" }, 0);

    tl.to(lightState, { p: 1.05, duration: 2.5, ease: "power1.inOut",
                        onUpdate: applyLight }, 0);

    tl.fromTo([peacock, glowPath], { opacity: 0 },
              { opacity: 1, duration: 1.3, ease: "power2.out" }, 0.1);
    tl.set(glowPath, { opacity: 0.9 }, 1.4);

    // Outline "breathes" from the fuller entrance state toward the pose.
    morphOutline(tl, ENTRANCE_PATH, POSE_PATH, 0.2, 3.2);

    /* 2.5-4.0s · HERALDIC : ease the tracking shot to a full stop */
    tl.to(group, { x: 0, y: 0, scale: 1.0, duration: 1.5, ease: "power2.inOut" }, 2.5);
    // Rest the light centred and widen it so the whole bird glows in its pose.
    tl.to(lightState, { p: 0.5, duration: 1.5, ease: "power2.inOut",
                        onUpdate: applyLight }, 2.5);
    tl.to(lightGrad, { attr: { r: 0.95 }, duration: 1.5, ease: "power2.inOut" }, 2.5);

    /* 4.0-5.5s · MORPH + DISSOLVE */
    // Background dark -> white (SVG rect + the page/stage behind it).
    tl.to(bg, { attr: { fill: "#FFFFFF" }, duration: 1.5 }, 4.0);
    tl.to([document.documentElement, document.body, splash],
          { backgroundColor: "#FFFFFF", duration: 1.5 }, 4.0);

    // Flatten the lighting: open the reveal mask fully.
    tl.to(lightGrad, { attr: { r: 1.5 }, duration: 1.2, ease: "power2.inOut" }, 4.0);

    // Fade the glow bloom away -> flat.
    tl.to(glowPath, { opacity: 0, duration: 1.0 }, 4.0);

    // Plumage white -> black: bring the solid black copy up over the gradient.
    tl.to(darkPath, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 4.2);
    tl.to(peacock,  { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 4.4);

    // Dissolve the solid black silhouette into the detailed flat logo
    // (eye-spots + feathering resolve in). This is the "morph into a clean
    // flat vector logo matching the pose exactly".
    tl.to(logoPath, { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 4.7);
    tl.to(darkPath, { opacity: 0, duration: 0.9, ease: "power2.inOut" }, 4.9);

    /* 5.5s+ · LOCK : short hold, then onComplete snaps the exact final frame */
    tl.to({}, { duration: 0.6 }, 5.5);
  })();
