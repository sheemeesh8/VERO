<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro Options 4</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --d: 6s; --paper: #e9e4dc; --kraft: #c8a77d; --cord: #8a7f6e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 18px; direction: rtl; }
.replay { display: block; margin: 0 auto 34px; background: #111; color: #fff; border: none; border-radius: 999px; padding: 11px 26px; font: inherit; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; max-width: 1260px; margin: 0 auto; }
.opt { width: 280px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

/* Inner screen: 268 × 578. */
.phone { width: 280px; height: 590px; border-radius: 30px; overflow: hidden; position: relative; background: #000; box-shadow: 0 16px 36px rgba(0,0,0,0.18); border: 6px solid #0d0d0d; }
.app { position: absolute; inset: 0; background: url('intro-home.png') center top / cover no-repeat; }
.layer { position: absolute; inset: 0; overflow: hidden; }
.bg { background: var(--paper); animation-name: bgOut; }
@keyframes bgOut { 0%, 40% { opacity: 1; } 48%, 98% { opacity: 0; } 100% { opacity: 1; } }
.mark { display: block; line-height: 0; width: 128px; }
.mark img { width: 100%; display: block; }
.black img { filter: invert(1); }
.phone * { animation-duration: var(--d); animation-iteration-count: infinite; animation-fill-mode: both; }
.tiny { font-size: 7px; letter-spacing: 3px; text-transform: uppercase; }

/* ---- Shared hang-tag rig: pivot drops in → cord → falling wrapper → flipping card ---- */
.pivot { position: absolute; left: 134px; top: 0; width: 0; height: 0; animation-name: drop; animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
@keyframes drop { 0% { transform: translateY(-440px); } 9%, 100% { transform: translateY(0); } }
.cord { position: absolute; left: -0.5px; top: 0; width: 1px; height: 170px; background: var(--cord); transform-origin: 50% 0; animation-name: cordSnap; }
@keyframes cordSnap { 0%, 36% { transform: scaleY(1); opacity: 1; } 37%, 98% { transform: scaleY(0.25); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
.fall { position: absolute; left: -80px; top: 166px; width: 160px; height: 220px; perspective: 700px; animation-name: fall; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
@keyframes fall { 0%, 36% { transform: none; } 47%, 100% { transform: translateY(700px) rotate(-18deg); } }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; animation-name: flip; animation-timing-function: cubic-bezier(0.5, 0, 0.3, 1); }
@keyframes flip { 0%, 10% { transform: rotateY(0); } 18%, 24% { transform: rotateY(180deg); } 32%, 100% { transform: rotateY(360deg); } }
.face { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; box-shadow: 0 12px 24px rgba(0,0,0,0.22); }
.face::before { content: ''; position: absolute; top: 12px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); }
.face.back { transform: rotateY(180deg); }
.dark { background: #111; color: rgba(255,255,255,0.75); }
.kraft { background: var(--kraft); color: #3b2f22; background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 4px 4px; }
.white { background: #f7f5f0; color: #55514a; }
.big { font-size: 30px; line-height: 1.05; letter-spacing: 0.5px; color: #fff; }

/* L1 · price tag */
.l1 .was { font-size: 15px; color: rgba(255,255,255,0.45); text-decoration: line-through; font-variant-numeric: tabular-nums; }
.l1 .now { font-size: 44px; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }

/* L2 · twisting spin that slows onto the logo */
.l2 .flip { animation-name: spin; animation-timing-function: cubic-bezier(0.15, 0.6, 0.25, 1); }
@keyframes spin { 0%, 6% { transform: rotateY(-180deg); } 34%, 100% { transform: rotateY(1440deg); } }
.l2 .pivot { animation-name: drop2; }
@keyframes drop2 { 0% { transform: translateY(-440px); } 7%, 100% { transform: translateY(0); } }

/* L3 · kraft tag with a handwritten note */
.l3 .note { font-family: 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', Georgia, serif; font-style: italic; font-size: 30px; line-height: 1.15; color: #2c2218; transform: rotate(-4deg); }
.l3 .face::before { background: var(--paper); }
.l3 .ring { position: absolute; top: 9px; left: 50%; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; border: 2px solid #b08a5c; }

/* L4 · flip, then the tag tears off its stub */
.l4 .stub { position: absolute; left: -80px; top: 166px; width: 160px; height: 40px; background: #111; border-radius: 6px 6px 0 0; animation-name: stubOut; }
.l4 .stub::before { content: ''; position: absolute; top: 12px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--paper); }
.l4 .stub::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: 0; border-bottom: 1.5px dashed rgba(255,255,255,0.35); }
@keyframes stubOut { 0%, 40% { opacity: 1; } 47%, 98% { opacity: 0; } 100% { opacity: 1; } }
.l4 .cord { animation-name: cordStay; }
@keyframes cordStay { 0%, 40% { opacity: 1; } 47%, 98% { opacity: 0; } 100% { opacity: 1; } }
.l4 .fall { top: 206px; height: 180px; animation-name: tear; }
@keyframes tear { 0%, 34% { transform: none; } 36% { transform: rotate(4deg) translateY(4px); } 47%, 100% { transform: translate(40px, 700px) rotate(28deg); } }
.l4 .face { border-radius: 0 0 6px 6px; }
.l4 .face::before { display: none; }

/* L5 · flips twice, the back changes word */
.l5 .flip { animation-name: flip2; }
@keyframes flip2 { 0%, 9% { transform: rotateY(0); } 13%, 17% { transform: rotateY(180deg); } 21%, 23% { transform: rotateY(360deg); } 27%, 31% { transform: rotateY(540deg); } 35%, 100% { transform: rotateY(720deg); } }
.l5 .w { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); }
.l5 .w1 { animation-name: w1; animation-timing-function: steps(1, end); }
.l5 .w2 { animation-name: w2; animation-timing-function: steps(1, end); }
@keyframes w1 { 0%, 21.9% { opacity: 1; } 22%, 100% { opacity: 0; } }
@keyframes w2 { 0%, 21.9% { opacity: 0; } 22%, 100% { opacity: 1; } }

/* L6 · flips to a photo of the home, then grows into the app */
.l6 .fall { animation-name: grow; animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); transform-origin: 50% 50%; }
@keyframes grow { 0%, 30% { transform: none; } 42%, 100% { transform: translateY(13px) scale(2.63); } }
.l6 .flip { animation-name: flipStay; }
@keyframes flipStay { 0%, 10% { transform: rotateY(0); } 20%, 100% { transform: rotateY(180deg); } }
.l6 .back { background: url('intro-home.png') center top / 100% auto no-repeat #1d1714; border-radius: 6px; }
.l6 .back::before { display: none; }
.l6 .cord { animation-name: cordFade; }
@keyframes cordFade { 0%, 28% { opacity: 1; } 34%, 98% { opacity: 0; } 100% { opacity: 1; } }
.l6 .bg { animation-name: bgOut6; }
@keyframes bgOut6 { 0%, 34% { opacity: 1; } 42%, 98% { opacity: 0; } 100% { opacity: 1; } }
.l6 .layer.top { animation-name: topOut; }
@keyframes topOut { 0%, 40% { opacity: 1; } 45%, 98% { opacity: 0; } 100% { opacity: 1; } }

/* L7 · white tag on black, hung from a safety pin */
.l7 .bg { background: #0c0c0c; }
.l7 .cord { background: #6d6a64; height: 150px; top: 20px; }
.l7 .pin { position: absolute; left: -22px; top: 0; width: 44px; height: 22px; }
.l7 .pin svg { width: 100%; height: 100%; overflow: visible; }
.l7 .fall { top: 166px; }
.l7 .face::before { background: #0c0c0c; }

@media (prefers-reduced-motion: reduce) { .phone * { animation: none !important; } }
</style>
</head>
<body>
<h1>Intro — וריאציות על K3</h1>
<p class="sub">תווית מתהפכת על חוט, בכל פעם עם צד אחורי, תנועה או יציאה אחרים · מתנגנים בלופ ונגמרים על מסך הבית</p>
<button class="replay" onclick="replay()">Replay all</button>

<div class="grid" id="opts"></div>

<script>
var IMG = '<img src="../moravchick-letters.png" alt="moravchick">';
var W = '<span class="mark">' + IMG + '</span>';
var B = '<span class="mark black">' + IMG + '</span>';
var BG = '<div class="layer bg"></div>';
var rig = (front, back, extra) => '<div class="app"></div>' + BG + '<div class="layer top"><span class="pivot">' + (extra || '') + '<span class="cord"></span><span class="fall"><span class="flip">' + front + back + '</span></span></span></div>';
var face = (cls, inner) => '<span class="face ' + cls + '">' + inner + '</span>';
var PIN = '<span class="pin"><svg viewBox="0 0 44 22"><path d="M4 11 h30 a6 6 0 1 0 -6 -6 M4 11 a4 4 0 0 1 4 -4 h22" fill="none" stroke="#bdb8ae" stroke-width="1.6" stroke-linecap="round"/><circle cx="4" cy="11" r="2.4" fill="#bdb8ae"/></svg></span>';

var OPTS = [
  ['L1 · תווית מחיר', 'התווית מתהפכת לצד של מחיר: ₪480 מחוק ו-₪120 גדול — "Same love". מסר יד-שנייה ברור בשנייה אחת.',
   'l1', rig(face('dark', W + '<span class="tiny">Curated second hand</span>'),
             face('dark back', '<span class="was">₪480</span><span class="now">₪120</span><span class="tiny">Second hand · same love</span>'))],
  ['L2 · סיבוב על החוט', 'התווית נוחתת כשהיא מסתובבת על החוט כמו תווית אמיתית שמתפתלת, מאטה בהדרגה ונעצרת בדיוק על הלוגו. ואז נופלת.',
   'l2', rig(face('dark', W + '<span class="tiny">Curated second hand</span>'),
             face('dark back', '<span class="big">Pre<br>loved</span>'))],
  ['L3 · פתק כתוב ביד', 'תווית קרטון חום עם חותמת הלוגו, ובצד השני פתק כאילו בכתב יד: "Welcome back". חם ואישי.',
   'l3', rig(face('kraft', B + '<span class="tiny">Curated second hand</span>'),
             face('kraft back', '<span class="note">Welcome<br>back</span>'))],
  ['L4 · נקרעת מהבדל', 'אחרי ההיפוך התווית נקרעת לאורך קו מנוקב: הבדל העליון נשאר על החוט והתווית עפה למטה. כמו לתלוש תווית מבגד חדש.',
   'l4', rig(face('dark', W + '<span class="tiny">Curated second hand</span>'),
             face('dark back', '<span class="big">Yours<br>now</span>'), '<span class="stub"></span>')],
  ['L5 · שתי מילים', 'התווית מתהפכת פעמיים, ובכל פעם הצד האחורי אומר מילה אחרת: "Pre-loved" ואז "Re-loved". משחק מילים קטן.',
   'l5', rig(face('dark', W + '<span class="tiny">Curated second hand</span>'),
             face('dark back', '<span class="w w1"><span class="big">Pre-<br>loved</span></span><span class="w w2"><span class="big">Re-<br>loved</span></span>'))],
  ['L6 · התווית הופכת לאפליקציה', 'בצד האחורי של התווית יש תמונה של דף הבית, והתווית גדלה עד שהיא ממלאת את המסך — ונכנסים לאפליקציה דרכה.',
   'l6', rig(face('dark', W + '<span class="tiny">Curated second hand</span>'), face('back', ''))],
  ['L7 · לבן על שחור', 'הפוך: רקע שחור, תווית לבנה שתלויה מסיכת ביטחון. ההיפוך והנפילה כמו ב-K3, באווירה ערבית ואלגנטית.',
   'l7', rig(face('white', B + '<span class="tiny">Curated second hand</span>'),
             face('white back', '<span class="tiny">Second hand</span><span class="big" style="color:#111">first<br>choice</span><span class="tiny">since 2026</span>'), PIN)]
];
function render() {
  document.getElementById('opts').innerHTML = OPTS.map(o =>
    '<div class="opt"><div class="phone ' + o[2] + '">' + o[3] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
}
function replay() { document.getElementById('opts').innerHTML = ''; requestAnimationFrame(render); }
render();
</script>
</body>
</html>
