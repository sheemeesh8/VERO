<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Minimal Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #1c1c1c; --muted: #9a958c; --line: #ecebe7; --v: #E8552B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; align-items: flex-start; }
.opt { width: 330px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.phone { width: 330px; border-radius: 26px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); }
.screen { width: 390px; transform: scale(0.8462); transform-origin: top left; position: relative; overflow: hidden; background: #fff; color: var(--ink); }
.money { font-variant-numeric: tabular-nums; }
.imgbg { background: #e7e4dd center / cover no-repeat; }
.ico { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.3; }
.v { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--v); color: #fff; font-size: 9px; font-weight: 700; vertical-align: middle; }
.bar { display: flex; align-items: center; justify-content: space-between; padding: 40px 24px 0; }
.bar .t { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }
/* minimal product grid: image + name + price in small, quiet type */
.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; padding: 22px 24px 30px; }
.pc .im { aspect-ratio: 3/4; }
.pc .nm { font-size: 12px; margin-top: 8px; } .pc .pr { font-size: 11px; color: var(--muted); margin-top: 2px; }
/* text tabs */
.ttabs { display: flex; gap: 24px; padding: 16px 24px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ttabs span.on { color: var(--ink); }

/* ===== M1 — hero kept, hairline header ===== */
.m1 .hero { height: 300px; position: relative; }
.m1 .hero .wash { position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.55)); }
.m1 .bar { color: #fff; position: relative; z-index: 2; }
.m1 .cap { position: absolute; left: 24px; right: 24px; bottom: 22px; color: #fff; z-index: 2; }
.m1 .nm { font-size: 26px; } .m1 .bio { font-size: 11px; opacity: 0.85; margin-top: 4px; letter-spacing: 0.5px; }
.m1 .data { display: flex; gap: 28px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.m1 .data .d b { font-size: 16px; font-weight: 400; } .m1 .data .d span { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; margin-top: 2px; }

/* ===== M2 — centred, tiny avatar, one-line data ===== */
.m2 { text-align: center; }
.m2 .cover { height: 92px; }
.m2 .av { display: block; width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--ink); margin: -36px auto 0; position: relative; }
.m2 .nm { font-size: 22px; margin-top: 12px; } .m2 .bio { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.5px; }
.m2 .data { font-size: 11px; color: var(--ink); margin-top: 14px; letter-spacing: 0.5px; }
.m2 .data b { font-weight: 400; } .m2 .data i { color: var(--muted); font-style: normal; margin: 0 6px; }
.m2 .ttabs { justify-content: center; border-top: 1px solid var(--line); margin-top: 16px; }

/* ===== M3 — data strip (stats page nod) ===== */
.m3 .hero { height: 260px; position: relative; }
.m3 .hero .wash { position: absolute; inset: 0; background: linear-gradient(transparent 60%, rgba(0,0,0,0.5)); }
.m3 .bar { color: #fff; position: relative; z-index: 2; }
.m3 .cap { position: absolute; left: 24px; bottom: 20px; color: #fff; z-index: 2; }
.m3 .nm { font-size: 24px; } .m3 .bio { font-size: 11px; opacity: 0.85; margin-top: 3px; }
.m3 .data { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.m3 .data .d { padding: 16px 6px; text-align: center; border-right: 1px solid var(--line); }
.m3 .data .d:last-child { border-right: none; }
.m3 .data .d b { font-size: 16px; font-weight: 400; display: block; } .m3 .data .d span { font-size: 7.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 3px; display: block; }

/* ===== M4 — gallery, name as thin display ===== */
.m4 .hero { height: 150px; position: relative; }
.m4 .bar { color: #fff; position: relative; z-index: 2; }
.m4 .head { padding: 22px 24px 0; display: flex; align-items: flex-end; justify-content: space-between; }
.m4 .nm { font-size: 30px; font-weight: 400; letter-spacing: -0.5px; } .m4 .bio { font-size: 11px; color: var(--muted); margin-top: 4px; }
.m4 .foll { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); padding: 9px 16px; }
.m4 .data { display: flex; gap: 26px; padding: 16px 24px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.m4 .data b { color: var(--ink); font-weight: 400; }
.m4 .pg { gap: 4px; padding: 6px 4px 20px; }
.m4 .pc .im { aspect-ratio: 3/4; } .m4 .pc .nm { font-size: 10px; margin: 6px 0 0 6px; } .m4 .pc .pr { display: none; }
</style>
</head>
<body>
<h1>Storefront — מינימליסטי</h1>
<p class="sub">עם ההירו ודף הנתונים · 4 כיוונים מינימליסטיים</p>
<div class="grid" id="grid"></div>

<script>
var P = [
  { n: 'Wool Overcoat', p: 980, img: '../men-hero.jpg', pos: '50% 30%' },
  { n: 'Chelsea Boots', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Linen Overshirt', p: 340, img: '../women-hero.jpg', pos: '20% 40%' },
  { n: 'Silk Scarf', p: 210, img: '../hero-beach.jpg', pos: '50% 50%' }
];
var m = v => '₪' + v.toLocaleString('en-US');
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var SHR = '<svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
var back = '<span style="font-size:20px">&#8249;</span>';
var cov = 'class="cover imgbg" style="background-image:url(\'../hero-beach.jpg\')"';
var avbeach = 'class="av imgbg" style="background-image:url(\'../women-hero.jpg\');background-position:50% 24%"';
function pgrid() { return '<div class="pg">' + P.map(i => '<div class="pc"><div class="im imgbg" ' + bg(i) + '></div><div class="nm">' + i.n + '</div><div class="pr money">' + m(i.p) + '</div></div>').join('') + '</div>'; }
var ttabs = '<div class="ttabs"><span class="on">Items</span><span>Sold</span><span>About</span></div>';

var OPTS = [
  ['M1 · הירו + שורת נתונים דקה', 'ההירו נשאר מלא עם השם והביו עליו, ומתחת שורת נתונים דקה (עוקבים / פריטים / דירוג) ולשוניות טקסט. שקט ונקי.',
   '<div class="screen m1"><div class="hero imgbg" style="background-image:url(\'../hero-beach.jpg\')"><div class="wash"></div><div class="bar">' + back + SHR + '</div>' +
   '<div class="cap"><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion · Tel Aviv</div></div></div>' +
   '<div class="data"><div class="d"><b>248</b><span>Followers</span></div><div class="d"><b>32</b><span>Items</span></div><div class="d"><b>4.9</b><span>Rating</span></div></div>' +
   ttabs + pgrid() + '</div>', 980],

  ['M2 · ממורכז, אווטאר זעיר', 'קאבר קטן, אווטאר קטן ממורכז בקו דק, השם והנתונים בשורה אחת ממורכזת. הכי מאופק ואוורירי.',
   '<div class="screen m2"><div ' + cov + '><div class="bar" style="color:#fff">' + back + SHR + '</div></div>' +
   '<span ' + avbeach + '></span><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Curated pre-loved fashion</div>' +
   '<div class="data"><b>248</b> Followers <i>·</i> <b>32</b> Items <i>·</i> <b>4.9★</b></div>' + ttabs + pgrid() + '</div>', 980],

  ['M3 · גריד נתונים (כמו דף הסטטיסטיקות)', 'ההירו עם השם, ומתחת ארבעה תאי נתונים מופרדים בקו דק — בדיוק כמו דף הנתונים של המוכר. אינפורמטיבי ונקי.',
   '<div class="screen m3"><div class="hero imgbg" style="background-image:url(\'../hero-beach.jpg\')"><div class="wash"></div><div class="bar">' + back + SHR + '</div>' +
   '<div class="cap"><div class="nm">Studio Vero <span class="v">v</span></div><div class="bio">Tel Aviv</div></div></div>' +
   '<div class="data"><div class="d"><b>248</b><span>Followers</span></div><div class="d"><b>32</b><span>Items</span></div><div class="d"><b>120</b><span>Sold</span></div><div class="d"><b>4.9★</b><span>Rating</span></div></div>' +
   ttabs + pgrid() + '</div>', 1010],

  ['M4 · גלריה, שם דק', 'קאבר נמוך, השם כטיפוגרפיה דקה וגדולה עם Follow בצד, שורת נתונים קטנה, וגריד גלריה צפוף עם כיתוב זעיר. הכי "אולפן".',
   '<div class="screen m4"><div class="hero imgbg" style="background-image:url(\'../hero-beach.jpg\')"><div class="bar" style="color:#fff">' + back + SHR + '</div></div>' +
   '<div class="head"><div><div class="nm">Studio Vero</div><div class="bio">Curated pre-loved · Tel Aviv</div></div><span class="foll">Follow</span></div>' +
   '<div class="data"><span><b>248</b> Followers</span><span><b>32</b> Items</span><span><b>4.9★</b></span></div>' + pgrid() + '</div>', 1010]
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone" style="height:' + Math.round(o[3] * 0.8462) + 'px">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
