<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moravchick — קולקציות</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; }
        .col-wrap { max-width: 1280px; margin: 0 auto; padding: clamp(90px, 12vw, 130px) clamp(20px, 5vw, 60px) 80px; }
        .col-head { text-align: center; margin-bottom: clamp(34px, 5vw, 60px); }
        .col-kicker { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: #9a9a95; font-weight: 700; }
        .col-title { font-size: clamp(34px, 6vw, 68px); font-weight: 800; letter-spacing: -1.5px; margin-top: 14px; }
        .col-lead { margin: 18px auto 0; max-width: 40em; font-size: clamp(14px, 1.5vw, 17px); line-height: 1.7; color: #55514a; }

        .col-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(16px, 2.5vw, 26px); }
        .col-card {
            position: relative; display: block; text-decoration: none; color: #fff;
            aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid #000;
        }
        .col-card .bg {
            position: absolute; inset: 0; background: #17170f center / cover no-repeat;
            filter: grayscale(0.35) contrast(1.03); transform: scale(1.04);
            transition: transform 0.9s cubic-bezier(0.22,1,0.36,1), filter 0.6s;
        }
        .col-card:hover .bg { transform: scale(1.11); filter: grayscale(0) contrast(1.05); }
        .col-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.28) 100%); }
        .col-card .body { position: absolute; inset: auto 0 0 0; z-index: 2; padding: clamp(20px, 3vw, 34px); }
        .col-card .season-emoji { font-size: clamp(30px, 4vw, 46px); line-height: 1; }
        .col-card .season-name { font-size: clamp(26px, 4vw, 46px); font-weight: 800; letter-spacing: -1px; margin-top: 6px; }
        .col-card .season-months { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; margin-top: 8px; font-weight: 600; }
        .col-card .season-count { position: absolute; top: clamp(18px, 3vw, 30px); right: clamp(18px, 3vw, 30px); z-index: 2; font-size: 12px; letter-spacing: 1px; font-weight: 600; }
        .chip-now, .chip-sale {
            display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px;
            font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
        }
        .chip-now { background: #fff; color: #111; }
        .chip-sale { background: #EB2323; color: #fff; margin-inline-start: 8px; }

        @media (max-width: 720px) { .col-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
</head>
<body>
    <div id="siteHeader"></div>
    <script src="header.js"></script>

    <div class="col-wrap">
        <div class="col-head">
            <div class="col-kicker">moravchick</div>
            <h1 class="col-title">הקולקציות שלנו</h1>
            <p class="col-lead">ארבע עונות, ארבע קולקציות — אצורות לפי חודשי השנה. גלו את מה שבעונה,
                ותפסו את מבצעי סוף העונה על מה שיוצא ממנה.</p>
        </div>
        <div class="col-grid" id="colGrid"></div>
    </div>

    <script src="product-overrides.js"></script>
    <script src="collections.js"></script>
    <script>
        (function () {
            var VC = window.veroCollections;
            var curr = VC.currentKey();
            var sale = VC.saleKey();
            var grid = document.getElementById('colGrid');
            grid.innerHTML = VC.list().map(function (c) {
                var count = VC.byCollection(c.key).length;
                var monthsHe = c.months.map(function (m) { return ['','ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'][m]; }).join(' · ');
                return '<a class="col-card" href="collection.html?c=' + c.key + '">' +
                        '<div class="bg" style="background-image:url(\'' + c.hero + '\')"></div>' +
                        '<span class="season-count">' + count + ' פריטים</span>' +
                        '<div class="body">' +
                            '<div class="season-emoji">' + c.emoji + '</div>' +
                            '<div class="season-name">' + c.he + '</div>' +
                            '<div class="season-months">' + monthsHe + '</div>' +
                            (c.key === curr ? '<span class="chip-now">בעונה עכשיו</span>' : '') +
                            (c.key === sale ? '<span class="chip-sale">סוף עונה · ' + c.eos + '%-</span>' : '') +
                        '</div>' +
                    '</a>';
            }).join('');
        })();
    </script>
    <script src="footer.js"></script>
</body>
</html>
