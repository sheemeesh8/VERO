<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chats Focus Options</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #1c1c1c; --muted: #8a877f; --line: #ecebe7; --green: #2fbf5e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; color: var(--ink); padding: 0 24px; }
.hd { display: flex; align-items: center; justify-content: space-between; padding: 44px 0 14px; }
.hd b { font-size: 24px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.hd svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.3; }
.search { font-size: 14px; color: #b2ada3; padding: 10px 0 16px; border-bottom: 1px solid var(--line); }

.row { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.av { position: relative; width: 56px; height: 56px; border-radius: 50%; background: #f1efeb; display: grid; place-items: center; font-size: 24px; flex: none; }
.dot { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--green); border: 2px solid #fff; }
.bd { flex: 1; min-width: 0; }
.tl { display: flex; justify-content: space-between; }
.nm { font-size: 16px; }
.tm { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
.pv { font-size: 12.5px; color: #555; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* Treatments on "other" rows */
.t-blur .row.other { filter: blur(3px); opacity: 0.4; }
.t-fade .row.other { opacity: 0.4; }
.t-gray .row.other { filter: grayscale(1); opacity: 0.6; }
.t-gray .row.other .av { background: #efefef; }

.divider { display: flex; align-items: center; gap: 12px; margin: 12px 0 2px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.divider span { font-size: 8.5px; letter-spacing: 3px; text-transform: uppercase; color: #b2ada3; white-space: nowrap; }

/* D — offers in a card, others plain below */
.card-band { background: #f6f5f1; border: 1px solid #e4e1dc; border-radius: 16px; padding: 4px 16px; margin-top: 8px; }
.card-band .row { border-bottom: 1px solid #e9e7e1; } .card-band .row:last-child { border-bottom: none; }

/* E — collapsed count pill */
.more { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
.more .mt { font-size: 13px; } .more .mt small { color: var(--muted); display: block; font-size: 10px; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
.more .stack { display: flex; } .more .stack i { width: 30px; height: 30px; border-radius: 50%; background: #f1efeb; border: 2px solid #fff; margin-left: -10px; display: grid; place-items: center; font-style: normal; font-size: 14px; }
.more .chev { font-size: 18px; color: var(--muted); }

/* F — accordion header */
.acc { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.acc b { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; } .acc span { color: var(--muted); font-size: 11px; }
.acc .chev { font-size: 14px; color: var(--muted); }

/* G — green accent on offers, others normal */
.t-accent .row.offer { background: linear-gradient(90deg, rgba(47,191,94,0.08), transparent 60%); margin: 0 -24px; padding-left: 24px; padding-right: 24px; border-left: 3px solid var(--green); }
.t-accent .row.other { } /* normal */
</style>
</head>
<body>
<h1>Chats — פוקוס אחרי הזמנה</h1>
<p class="sub">במקום טשטוש · איך להדגיש את צ׳אטי ההצעות ולהחליש את השאר · 7 אופציות</p>
<div class="grid" id="grid"></div>

<script>
var OFFERS = [
  { nm: 'Atelier Nord', pv: 'Order placed — Wool Overcoat', tm: 'now', ic: '🧥' },
  { nm: 'Studio Vero',  pv: 'Order placed — Silk Scarf',    tm: 'now', ic: '🧣' }
];
var OTHERS = [
  { nm: 'Gallery Nine',  pv: 'The piece is still available.', tm: '1h', ic: '💬' },
  { nm: 'Denim Lab',     pv: 'Thanks for your interest!',     tm: '2h', ic: '👖' },
  { nm: 'Vintage Vault', pv: 'I can hold the jacket for you', tm: '1d', ic: '🧥' },
  { nm: 'Art House',     pv: 'The painting ships tomorrow',   tm: '2d', ic: '🖼️' }
];
var BACK = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
var FUN = '<svg viewBox="0 0 24 24"><path d="M4 4h16l-7 8v6l-2 1v-7z"/></svg>';
function row(c, cls) {
  return '<div class="row ' + cls + '"><div class="av">' + c.ic + (cls.indexOf('offer')>=0 ? '<span class="dot"></span>' : '') + '</div>' +
    '<div class="bd"><div class="tl"><span class="nm">' + c.nm + '</span><span class="tm">' + c.tm + '</span></div>' +
    '<div class="pv">' + c.pv + '</div><div class="sl">' + c.nm + '</div></div></div>';
}
function head() { return '<div class="hd"><b>Chat</b>' + BACK + '</div><div class="search">Search sellers…</div>'; }
function offers() { return OFFERS.map(function(c){return row(c,'offer');}).join(''); }
function others() { return OTHERS.map(function(c){return row(c,'other');}).join(''); }
var divider = '<div class="divider"><span>Other chats</span></div>';

var OPTS = [
  ['A · טשטוש (הקיים)', 'השאר מטושטשים. לנקודת השוואה.',
   '<div class="screen t-blur">' + head() + offers() + divider + others() + '</div>'],

  ['B · עמעום בלבד', 'בלי blur — רק שקיפות נמוכה. עדין יותר, הטקסט עדיין קריא אם מתאמצים.',
   '<div class="screen t-fade">' + head() + offers() + divider + others() + '</div>'],

  ['C · שחור־לבן', 'השאר הופכים לאפור ודהוי (בלי צבע), וצ׳אטי ההצעות נשארים צבעוניים. מדגיש בלי להסתיר.',
   '<div class="screen t-gray">' + head() + offers() + divider + others() + '</div>'],

  ['D · ההצעות בכרטיס', 'צ׳אטי ההצעות בתוך כרטיס מודגש למעלה, והשאר רגילים לגמרי מתחת. מרים את ההצעות במקום להחליש את השאר.',
   '<div class="screen">' + head() + '<div class="card-band">' + offers() + '</div>' + divider + others() + '</div>'],

  ['E · מכווץ למספר', 'רק צ׳אטי ההצעות מוצגים, והשאר מכווצים לשורה "+6 שיחות נוספות" שאפשר לפתוח. הכי ממוקד.',
   '<div class="screen">' + head() + offers() +
   '<div class="more"><div class="mt">Other chats<small>6 conversations</small></div><div class="stack"><i>💬</i><i>👖</i><i>🖼️</i></div><div class="chev">›</div></div></div>'],

  ['F · אקורדיון', 'ההצעות למעלה, וכותרת "Other chats" סגורה שנפתחת בלחיצה. דומה ל-E אבל כקו מתקפל.',
   '<div class="screen">' + head() + offers() + '<div class="acc"><b>Other chats</b><span>6 &nbsp;⌄</span></div></div>'],

  ['G · הדגשה ירוקה', 'השאר נשארים רגילים לגמרי, וצ׳אטי ההצעות מקבלים רקע ירקרק וקו ירוק בצד. רק מדגיש, לא מחליש.',
   '<div class="screen t-accent">' + head() + offers() + divider + others() + '</div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
