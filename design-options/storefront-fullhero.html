<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront — Full Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; max-width: 640px; margin-left: auto; margin-right: auto; line-height: 1.6; }
.rowwrap { display: flex; flex-direction: column; gap: 30px; align-items: center; max-width: 1200px; margin: 0 auto; }
.pair { display: flex; gap: 20px; align-items: flex-start; }
.ttl { direction: rtl; text-align: center; margin-bottom: 4px; }
.ttl b { font-size: 16px; font-weight: 700; letter-spacing: 1px; display: block; }
.ttl span { font-size: 12.5px; color: var(--muted); }
.lab { text-align: center; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

.phone { width: 268px; height: 580px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 372px; height: 806px; transform: scale(0.6935); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--fb); }
.th { display: block; background: #ddd center / cover no-repeat; filter: var(--imgf, none); }
.money { font-variant-numeric: tabular-nums; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 64px; padding: 26px 18px 0; display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; z-index: 5; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-family: 'Inter', sans-serif; }
.top svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 1.4; fill: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }

/* ---- FULL-SCREEN HERO (the fold) ---- */
.fullhero { position: absolute; inset: 0; }
.fullhero .th { position: absolute; inset: 0; }
.fullhero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.72)); }
.fullhero .in { position: absolute; left: 24px; right: 24px; bottom: 70px; z-index: 2; color: #fff; }
.fullhero .k { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.85; }
.fullhero .nm { font-family: var(--fh); font-size: 52px; line-height: 0.98; margin: 10px 0 10px; font-weight: 400; }
.fullhero .nm i { font-style: italic; }
.fullhero .bio { font-size: 14px; opacity: 0.9; max-width: 80%; font-family: 'Inter', sans-serif; font-weight: 300; }
.fullhero .meta { display: flex; align-items: center; gap: 16px; margin-top: 16px; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 1px; }
.fullhero .fol { border: 1px solid #fff; border-radius: 999px; padding: 11px 26px; letter-spacing: 3px; text-transform: uppercase; }
.fullhero .scroll { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: #fff; font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8; z-index: 2; }
.fullhero .scroll::after { content: ''; display: block; width: 1px; height: 18px; background: rgba(255,255,255,0.7); margin: 6px auto 0; }

/* ---- SCROLLED content ---- */
.scrolled { position: absolute; inset: 0; background: var(--bg); }
.peek { height: 90px; position: relative; }
.peek .th { position: absolute; inset: 0; }
.peek::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.3), var(--bg)); }
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px; margin: 20px 0 12px; }
.sh b { font-family: var(--fh); font-weight: 400; font-size: 20px; color: var(--ink); }
.sh span { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }
.slider { display: flex; gap: 12px; overflow: hidden; padding: 0 20px; }
.pc { width: 126px; flex: none; }
.pc .th { aspect-ratio: 3/4; border-radius: var(--pr, 0); }
.pc .l { display: flex; justify-content: space-between; font-size: 12px; margin-top: 7px; }
.pc .s { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sub); margin-top: 2px; }
.gen { display: flex; gap: 10px; padding: 0 20px; }
.gen .g { flex: 1; text-align: center; }
.gen .g .th { height: 100px; border-radius: var(--gr, 0); }
.gen .g span { font-family: 'Inter', sans-serif; display: block; font-size: 10px; letter-spacing: 1px; margin-top: 7px; color: var(--ink); }
.gen .g.on span { color: var(--accent); font-weight: 600; }
.gen .g.on .th { outline: 2px solid var(--accent); outline-offset: 2px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px; }
.chip { font-family: 'Inter', sans-serif; border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 11px; color: var(--ink); }
.chip.on { background: var(--accent); color: var(--onacc, #fff); border-color: var(--accent); }
.s3 .pc .th, .s3 .gen .g .th { border-radius: 999px 999px 6px 6px; }
.s2 .nm i, .s8 .nm i { font-style: italic; }
.s8 .pc .th, .s8 .gen .g .th { outline: 1px solid rgba(200,162,74,0.45); outline-offset: 4px; }
.s8 .pc .s { color: #c8a24a; }
</style>
</head>
<body>
<h1>Storefront — הירו במסך מלא</h1>
<p class="sub">הירו תופס מסך שלם עם שם החנות עליו. גלילה חושפת את הסליידר, בחירת המגדר וקטגוריות הלבוש. לכל חנות — צבעים, פונט וסגנון משלה, כמו אתר אמיתי.</p>

<div class="rowwrap" id="opts"></div>

<script>
var IM = {
  men: { img: '../men-hero.jpg', pos: '50% 30%' }, women: { img: '../women-hero.jpg', pos: '30% 35%' },
  cloth: { img: '../clothing-hero.jpg', pos: '50% 50%' }, beach: { img: '../hero-beach.jpg', pos: '50% 45%' },
  gal: { img: '../gallery-hero.jpg', pos: '50% 50%' }, mag: { img: '../magazine-hero.jpg', pos: '50% 50%' }
};
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var PRD = [['Wool Coat', 380, IM.men], ['Linen Shirt', 120, IM.women], ['Leather Bag', 240, IM.cloth], ['Silk Scarf', 90, IM.beach], ['Denim Jacket', 210, IM.gal]];
var GEN = [['Women', IM.women], ['Men', IM.men], ['Kids', IM.cloth], ['Unisex', IM.beach]];
var CAT = ['Dresses', 'Coats', 'Shirts', 'Knitwear', 'Denim', 'Shoes', 'Bags', 'Accessories'];
var MAG = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
var MENU = '<svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>';
var topBar = '<div class="top">' + MENU + '<span>' + MAG + '</span></div>';

function foldScreen(cfg) {
  var s = cfg.store;
  return '<div class="screen ' + cfg.id + '" style="' + cfg.vars + '">' + topBar +
    '<div class="fullhero"><span class="th" ' + bg(s.hero) + '></span>' +
    '<div class="in"><div class="k">' + s.kicker + '</div><div class="nm">' + s.nm + '</div><div class="bio">' + s.bio + '</div>' +
    '<div class="meta"><span class="fol">Follow</span><span>' + s.f + ' followers · ' + s.it + ' items · ★ ' + s.r + '</span></div></div>' +
    '<div class="scroll">Scroll</div></div></div>';
}
function scrolledScreen(cfg) {
  var s = cfg.store;
  var slider = '<div class="slider">' + PRD.map(p => '<div class="pc"><span class="th" ' + bg(p[2]) + '></span><div class="l"><span>' + p[0] + '</span><span class="money">₪' + p[1] + '</span></div><div class="s">' + s.name + '</div></div>').join('') + '</div>';
  var gen = '<div class="gen">' + GEN.map((g, k) => '<div class="g' + (k === 0 ? ' on' : '') + '"><span class="th" ' + bg(g[1]) + '></span><span>' + g[0] + '</span></div>').join('') + '</div>';
  var cats = '<div class="cats">' + CAT.map((c, k) => '<span class="chip' + (k === 0 ? ' on' : '') + '">' + c + '</span>').join('') + '</div>';
  return '<div class="screen ' + cfg.id + '" style="' + cfg.vars + '"><div class="scrolled">' +
    '<div class="peek"><span class="th" ' + bg(s.hero) + '></span></div>' +
    '<div class="sh"><b>New in</b><span>See all</span></div>' + slider +
    '<div class="sh"><b>Shop by</b><span>Gender</span></div>' + gen +
    '<div class="sh"><b>Clothing</b><span>8 categories</span></div>' + cats + '</div></div>';
}
var V = (o) => Object.keys(o).map(k => '--' + k + ':' + o[k]).join(';');
var OPTS = [
  ['S1 · מינימל נואר', 'שחור-לבן נקי', {
    id: 's1', vars: V({ bg: '#fff', ink: '#111', sub: '#8a857d', accent: '#111', line: '#e6e3dd', fh: "'Inter',sans-serif", fb: "'Inter',sans-serif", imgf: 'grayscale(1)' }),
    store: { nm: 'Studio Vero', bio: 'Slow fashion, sourced in Tel Aviv.', hero: IM.beach, name: 'Studio Vero', f: '1.2k', it: 42, r: '4.9', kicker: 'The shop of' } }],
  ['S2 · עריכתי', 'קרם עם Bodoni', {
    id: 's2', vars: V({ bg: '#f6f1e8', ink: '#2a251d', sub: '#6b5f4d', accent: '#9a7d52', line: '#ddd3c2', fh: "'Bodoni Moda',serif", fb: "'Cormorant Garamond',serif", imgf: 'sepia(0.12)' }),
    store: { nm: 'Studio <i>Vero</i>', bio: 'Slow fashion, sourced in Tel Aviv.', hero: IM.women, name: 'Studio Vero', f: '1.2k', it: 42, r: '4.9', kicker: 'The shop of' } }],
  ['S8 · יוקרה כהה', 'ירוק עם זהב', {
    id: 's8', vars: V({ bg: '#0f2419', ink: '#efe9da', sub: '#b9b19c', accent: '#c8a24a', onacc: '#0f2419', line: 'rgba(200,162,74,0.4)', fh: "'Bodoni Moda',serif", fb: "'Cormorant Garamond',serif", imgf: 'grayscale(0.3) sepia(0.2) brightness(0.9)' }),
    store: { nm: 'Luxe Atelier', bio: 'Rare pieces, quietly kept.', hero: IM.cloth, name: 'Luxe Atelier', f: '2.1k', it: 36, r: '5.0', kicker: 'Est. 2014' } }]
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div><div class="ttl"><b>' + o[0] + '</b><span> · ' + o[1] + '</span></div>' +
  '<div class="pair"><div><div class="phone">' + foldScreen(o[2]) + '</div><div class="lab">מסך פתיחה</div></div>' +
  '<div><div class="phone">' + scrolledScreen(o[2]) + '</div><div class="lab">אחרי גלילה</div></div></div></div>').join('');
</script>
</body>
</html>
