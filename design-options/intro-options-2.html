<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro Options 2</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --ink: #111; --muted: #8a877f; --d: 6s; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 18px; direction: rtl; }
.replay { display: block; margin: 0 auto 34px; background: #111; color: #fff; border: none; border-radius: 999px; padding: 11px 26px; font: inherit; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; }
.grid { display: flex; flex-wrap: wrap; gap: 32px 26px; justify-content: center; max-width: 960px; margin: 0 auto; }
.opt { width: 280px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

/* Inner screen: 268 × 578 (280 × 590 minus the 6px bezel). */
.phone { width: 280px; height: 590px; border-radius: 30px; overflow: hidden; position: relative; background: #000; box-shadow: 0 16px 36px rgba(0,0,0,0.18); border: 6px solid #0d0d0d; }
.app { position: absolute; inset: 0; background: url('intro-home.png') center top / cover no-repeat; }
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mark { width: 200px; display: block; line-height: 0; position: relative; }
.mark img { width: 100%; display: block; }
.black img { filter: invert(1); }
.phone * { animation-duration: var(--d); animation-iteration-count: infinite; animation-fill-mode: both; }
.phone *::before, .phone *::after { animation-duration: var(--d); animation-iteration-count: infinite; animation-fill-mode: both; }

/* ===== J1 · pen draws the signature, panel drops ===== */
.j1 .layer { background: #000; animation-name: j1panel; animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
@keyframes j1panel { 0%, 36% { transform: translateY(0); } 48%, 98% { transform: translateY(100%); } 99%, 100% { transform: translateY(0); } }
.j1 .mark { animation-name: j1draw; animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
@keyframes j1draw { 0%, 3% { clip-path: inset(0 100% 0 0); } 27%, 100% { clip-path: inset(0 0 0 0); } }
.j1 .nib { position: absolute; top: 50%; left: 34px; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px 3px rgba(255,255,255,0.8); animation-name: j1nib; animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
@keyframes j1nib { 0%, 3% { transform: translate(0, 4px); opacity: 0; } 5% { opacity: 1; } 9% { transform: translate(40px, -8px); } 14% { transform: translate(85px, 6px); } 19% { transform: translate(130px, -6px); } 25% { transform: translate(195px, 2px); opacity: 1; } 29%, 100% { transform: translate(200px, 0); opacity: 0; } }

/* ===== J2 · photo tiles assemble, then scatter ===== */
.j2 .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, 1fr); }
.j2 .t { background: url('../women-hero.jpg') no-repeat; background-size: 268px 578px; filter: grayscale(0.4) brightness(0.55); animation-name: j2tile; animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1); }
@keyframes j2tile { 0% { transform: scale(0); opacity: 0; } 12%, 34% { transform: scale(1.02); opacity: 1; } 44%, 100% { transform: scale(0) rotate(25deg); opacity: 0; } }
.j2 .mark { position: absolute; left: 34px; top: 50%; margin-top: -24px; animation-name: j2mark; }
@keyframes j2mark { 0%, 14% { opacity: 0; letter-spacing: 0; transform: translateY(8px); } 22%, 34% { opacity: 1; transform: none; } 42%, 100% { opacity: 0; transform: scale(1.1); } }

/* ===== J3 · polaroid stack ===== */
.j3 .layer { background: #e9e4dc; animation-name: j3bg; }
@keyframes j3bg { 0%, 38% { opacity: 1; } 48%, 98% { opacity: 0; } 100% { opacity: 1; } }
.j3 .card { position: absolute; left: 50%; top: 50%; width: 150px; height: 186px; margin: -120px 0 0 -75px; background: #fff; padding: 8px 8px 30px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); animation-timing-function: cubic-bezier(0.3, 1.3, 0.5, 1); }
.j3 .card i { display: block; width: 100%; height: 100%; background: center / cover no-repeat; filter: grayscale(0.3); }
.j3 .c1 { animation-name: j3c1; } .j3 .c1 i { background-image: url('../men-hero.jpg'); }
.j3 .c2 { animation-name: j3c2; } .j3 .c2 i { background-image: url('../hero-beach.jpg'); }
.j3 .c3 { animation-name: j3c3; } .j3 .c3 i { background-image: url('../women-hero.jpg'); }
@keyframes j3c1 { 0% { transform: translateY(-460px) rotate(-20deg); } 8%, 34% { transform: rotate(-9deg); } 46%, 100% { transform: translate(-260px, -120px) rotate(-30deg); } }
@keyframes j3c2 { 0%, 6% { transform: translateY(-460px) rotate(20deg); } 14%, 34% { transform: rotate(7deg); } 46%, 100% { transform: translate(260px, -140px) rotate(30deg); } }
@keyframes j3c3 { 0%, 12% { transform: translateY(-460px) rotate(-10deg); } 20%, 34% { transform: rotate(-1deg); } 46%, 100% { transform: translate(0, -600px) rotate(-12deg); } }
.j3 .mark { position: absolute; left: 50%; top: 50%; width: 170px; margin: 100px 0 0 -85px; animation-name: j3mark; }
@keyframes j3mark { 0%, 20% { opacity: 0; transform: translateY(10px); } 27%, 36% { opacity: 1; transform: none; } 44%, 100% { opacity: 0; } }

/* ===== J4 · ink spreads, then drains into a dot ===== */
.j4 .paper { position: absolute; inset: 0; background: #f6f3ee; animation-name: j4paper; }
@keyframes j4paper { 0%, 18% { opacity: 1; } 19%, 98% { opacity: 0; } 100% { opacity: 1; } }
.j4 .blob { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: #000; animation-name: j4blob; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }
@keyframes j4blob {
  0% { transform: scale(0); border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
  10% { border-radius: 63% 37% 48% 52% / 55% 38% 62% 45%; }
  20%, 34% { transform: scale(1); border-radius: 50%; }
  40% { border-radius: 38% 62% 55% 45% / 60% 42% 58% 40%; }
  47%, 100% { transform: scale(0); border-radius: 50%; }
}
.j4 .mark { animation-name: j4mark; }
@keyframes j4mark { 0%, 14% { opacity: 0; filter: blur(4px); } 22%, 33% { opacity: 1; filter: blur(0); } 39%, 100% { opacity: 0; transform: scale(0.6); } }

/* ===== J5 · glitch + scanline ===== */
.j5 .layer { background: #000; animation-name: j5scan; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }
@keyframes j5scan { 0%, 34% { clip-path: inset(0 0 0 0); } 46%, 98% { clip-path: inset(100% 0 0 0); } 100% { clip-path: inset(0 0 0 0); } }
.j5 .line { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #fff; box-shadow: 0 0 14px 3px rgba(255,255,255,0.8); animation-name: j5line; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }
@keyframes j5line { 0%, 34% { transform: translateY(0); opacity: 0; } 35% { opacity: 1; } 46% { transform: translateY(578px); opacity: 1; } 47%, 100% { transform: translateY(578px); opacity: 0; } }
.j5 .g { position: absolute; inset: 0; mix-blend-mode: screen; }
.j5 .g.r img { filter: sepia(1) saturate(9) hue-rotate(-40deg) brightness(0.9); }
.j5 .g.c img { filter: sepia(1) saturate(9) hue-rotate(150deg) brightness(0.9); }
.j5 .g.r { animation-name: j5r; animation-timing-function: steps(1, end); }
.j5 .g.c { animation-name: j5c; animation-timing-function: steps(1, end); }
@keyframes j5r { 0% { transform: translate(-6px, 0); } 4% { transform: translate(5px, -2px); } 8% { transform: translate(-3px, 2px); } 12% { transform: translate(8px, 0); clip-path: inset(30% 0 40% 0); } 16% { transform: translate(-2px, 0); clip-path: none; } 20%, 28% { transform: none; } 29% { transform: translate(4px, 0); } 30%, 100% { transform: none; } }
@keyframes j5c { 0% { transform: translate(6px, 0); } 4% { transform: translate(-5px, 2px); } 8% { transform: translate(3px, -2px); } 12% { transform: translate(-8px, 0); clip-path: inset(55% 0 10% 0); } 16% { transform: translate(2px, 0); clip-path: none; } 20%, 28% { transform: none; } 29% { transform: translate(-4px, 0); } 30%, 100% { transform: none; } }
.j5 .mark { animation-name: j5flick; animation-timing-function: steps(1, end); }
@keyframes j5flick { 0% { opacity: 0; } 2% { opacity: 1; } 5% { opacity: 0.2; } 7% { opacity: 1; } 10% { opacity: 0.4; } 11%, 100% { opacity: 1; } }

/* ===== J6 · runway marquee ===== */
.j6 .layer { background: transparent; flex-direction: column; justify-content: center; gap: 0; }
.j6 .row { background: #000; white-space: nowrap; font-family: 'Aharoni CLM', sans-serif; font-weight: 700; font-size: 54px; line-height: 1.05; letter-spacing: 2px; text-transform: uppercase; width: 100%; overflow: hidden; }
.j6 .row span { display: inline-block; }
.j6 .row.o span { color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.55); }
.j6 .row.f span { color: #fff; }
.j6 .row.l span { animation-name: j6l; animation-timing-function: linear; }
.j6 .row.r span { animation-name: j6r; animation-timing-function: linear; }
@keyframes j6l { 0% { transform: translateX(0); } 46%, 100% { transform: translateX(-420px); } }
@keyframes j6r { 0% { transform: translateX(-420px); } 46%, 100% { transform: translateX(0); } }
.j6 .row.l { animation-name: j6outl; animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1); }
.j6 .row.r { animation-name: j6outr; animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1); }
@keyframes j6outl { 0%, 34% { transform: translateX(0); } 46%, 98% { transform: translateX(-110%); } 100% { transform: translateX(0); } }
@keyframes j6outr { 0%, 34% { transform: translateX(0); } 46%, 98% { transform: translateX(110%); } 100% { transform: translateX(0); } }
.j6 .band { display: flex; align-items: center; justify-content: center; height: 70px; background: #000; animation-name: j6band; animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1); }
@keyframes j6band { 0%, 38% { transform: scaleY(1); opacity: 1; } 46%, 98% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
.j6 .band .mark { width: 170px; }
.j6 .layer.bg { background: #000; animation-name: j6bg; }
@keyframes j6bg { 0%, 34% { opacity: 1; } 44%, 98% { opacity: 0; } 100% { opacity: 1; } }

/* ===== J7 · venetian blinds through the wordmark ===== */
.j7 .slat { position: absolute; top: 0; bottom: 0; width: 34.5px; background: #000; overflow: hidden; transform-origin: left center; animation-name: j7slat; animation-timing-function: cubic-bezier(0.7, 0, 0.3, 1); }
@keyframes j7slat { 0%, 32% { transform: scaleX(1); } 42%, 98% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.j7 .slat .mark { position: absolute; top: 50%; margin-top: -24px; animation-name: j7mark; }
@keyframes j7mark { 0% { opacity: 0; transform: translateY(14px); } 14%, 100% { opacity: 1; transform: none; } }

/* ===== J8 · swinging hang-tag ===== */
.j8 .layer { background: #e9e4dc; animation-name: j8bg; }
@keyframes j8bg { 0%, 40% { opacity: 1; } 48%, 98% { opacity: 0; } 100% { opacity: 1; } }
.j8 .swing { position: absolute; left: 50%; top: 0; width: 0; height: 0; transform-origin: 0 0; animation-name: j8swing; animation-timing-function: ease-in-out; }
@keyframes j8swing {
  0% { transform: translateY(-420px) rotate(0); } 8% { transform: translateY(0) rotate(14deg); }
  13% { transform: rotate(-10deg); } 18% { transform: rotate(6deg); } 23% { transform: rotate(-3deg); } 27%, 34% { transform: rotate(0); }
  46%, 100% { transform: translateY(700px) rotate(8deg); }
}
.j8 .string { position: absolute; left: -0.5px; top: 0; width: 1px; height: 190px; background: #8a7f6e; }
.j8 .tag { position: absolute; left: -80px; top: 186px; width: 160px; height: 220px; background: #111; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 14px 26px rgba(0,0,0,0.25); }
.j8 .tag::before { content: ''; position: absolute; top: 12px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #e9e4dc; }
.j8 .tag .mark { width: 128px; }
.j8 .tag small { color: rgba(255,255,255,0.7); font-size: 7px; letter-spacing: 3px; text-transform: uppercase; }

/* ===== J9 · dive into the wordmark ===== */
.j9 .layer { background: #000; animation-name: j9panel; }
@keyframes j9panel { 0%, 40% { opacity: 1; } 47%, 98% { opacity: 0; } 100% { opacity: 1; } }
.j9 .mark { transform-origin: 23% 62%; animation-name: j9dive; animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); }
@keyframes j9dive { 0% { opacity: 0; transform: scale(0.9); } 10%, 22% { opacity: 1; transform: scale(1); } 40%, 100% { opacity: 1; transform: scale(60); } }
.j9 .flash { position: absolute; inset: 0; background: #fff; animation-name: j9flash; }
@keyframes j9flash { 0%, 36% { opacity: 0; } 40% { opacity: 1; } 47%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { .phone *, .phone *::before, .phone *::after { animation: none !important; } }
</style>
</head>
<body>
<h1>Intro — אופציות נוספות</h1>
<p class="sub">9 כיוונים חדשים, כל אחד עם סוג אנימציה אחר · מתנגנים בלופ ונגמרים על מסך הבית</p>
<button class="replay" onclick="replay()">Replay all</button>

<div class="grid" id="opts"></div>

<script>
var IMG = '<img src="../moravchick-letters.png" alt="moravchick">';
var W = '<span class="mark">' + IMG + '</span>';
var B = '<span class="mark black">' + IMG + '</span>';

// J2: 15 tiles of one photo, each popping in with its own delay.
var tiles = '';
for (var r = 0; r < 5; r++) for (var c = 0; c < 3; c++) {
  var d = ((r + c) * 0.07).toFixed(2);
  tiles += '<span class="t" style="background-position:' + (-c * 89.33) + 'px ' + (-r * 115.6) + 'px;animation-delay:' + d + 's"></span>';
}
// J7: eight slats, each carrying its slice of the wordmark.
var slats = '';
for (var i = 0; i < 8; i++) {
  slats += '<span class="slat" style="left:' + (i * 33.5) + 'px;animation-delay:' + (i * 0.05).toFixed(2) + 's"><span class="mark" style="left:' + (34 - i * 33.5) + 'px">' + IMG + '</span></span>';
}
var word = '<span>Moravchick · Moravchick · Moravchick · Moravchick ·&nbsp;</span>';

var OPTS = [
  ['J1 · עט חותם', 'נקודת אור קטנה "כותבת" את הלוגו כמו חתימה בעט. אחר כך המסך השחור נופל למטה וחושף את דף הבית.',
   'j1', '<div class="app"></div><div class="layer">' + W + '<span class="nib"></span></div>'],
  ['J2 · פסיפס תמונה', 'תמונת אופנה נבנית מ-15 אריחים שקופצים אחד אחרי השני באלכסון. הלוגו עולה מעליה, והאריחים מתפזרים ומסתובבים החוצה.',
   'j2', '<div class="app"></div><div class="tiles">' + tiles + '</div>' + W],
  ['J3 · ערימת פולארויד', 'שלוש תמונות פולארויד נופלות מלמעלה ונערמות בזוויות, הלוגו מופיע מתחת. ואז התמונות עפות לצדדים. שובב ואישי.',
   'j3', '<div class="app"></div><div class="layer"><span class="card c1"><i></i></span><span class="card c2"><i></i></span><span class="card c3"><i></i></span>' + B + '</div>'],
  ['J4 · כתם דיו', 'דיו שחור מתפשט על נייר בהיר בצורה אורגנית, הלוגו מופיע עליו, ואז הדיו נשאב חזרה לנקודה במרכז וחושף את האפליקציה.',
   'j4', '<div class="app"></div><div class="paper"></div><div class="layer"><span class="blob"></span>' + W + '</div>'],
  ['J5 · גליץ׳ + סריקה', 'הלוגו מהבהב ונכנס עם הפרדת צבעים אדום/תכלת כמו מסך דיגיטלי. ואז קו אור סורק מלמעלה למטה וחושף את דף הבית. אדג׳י וצעיר.',
   'j5', '<div class="app"></div><div class="layer"><span class="mark"><span class="g r">' + IMG + '</span><span class="g c">' + IMG + '</span>' + IMG + '</span><span class="line"></span></div>'],
  ['J6 · מסלול / מרקיזה', 'שורות ענק של MORAVCHICK זזות לסירוגין ימינה ושמאלה (מלא / קו מתאר), והלוגו בפס באמצע. השורות נשלפות לצדדים. כמו תצוגת אופנה.',
   'j6', '<div class="app"></div><div class="layer bg"></div><div class="layer">' +
     '<div class="row o l">' + word + word + '</div><div class="row f r">' + word + word + '</div><div class="row o l">' + word + word + '</div>' +
     '<div class="band">' + W + '</div>' +
     '<div class="row o r">' + word + word + '</div><div class="row f l">' + word + word + '</div><div class="row o r">' + word + word + '</div></div>'],
  ['J7 · תריסים', 'המסך עשוי 8 פסים אנכיים והלוגו חצוי ביניהם. הפסים נסגרים אחד אחרי השני כמו תריס ונפתחים לדף הבית.',
   'j7', '<div class="app"></div>' + slats],
  ['J8 · תווית תלויה', 'תווית בגד שחורה עם הלוגו יורדת על חוט, מתנדנדת ונרגעת, ואז נופלת למטה. רמז ישיר לבגדים ולמותג יד-שנייה.',
   'j8', '<div class="app"></div><div class="layer"><span class="swing"><span class="string"></span><span class="tag">' + W + '<small>Curated second hand</small></span></span></div>'],
  ['J9 · צלילה לתוך הלוגו', 'הלוגו נעצר רגע, ואז המצלמה "צוללת" לתוך האות o — הלוגו גדל עד שממלא את המסך, הבזק לבן, ונוחתים בדף הבית.',
   'j9', '<div class="app"></div><div class="layer">' + W + '</div><div class="flash"></div>']
];
function render() {
  document.getElementById('opts').innerHTML = OPTS.map(o =>
    '<div class="opt"><div class="phone ' + o[2] + '">' + o[3] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
}
function replay() { document.getElementById('opts').innerHTML = ''; requestAnimationFrame(render); }
render();
</script>
</body>
</html>
