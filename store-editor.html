    <style>
        :root { --ink:#1c1c1c; --muted:#7a7a75; --line:#e9e9e6; --soft:#f5f4f1; --blue:#2f6bff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--soft); direction: ltr; color: var(--ink);
            overflow-x: hidden; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; color: inherit; }

        /* ---- Top bar: Build / Theme, undo, redo, presets ---- */
        .topbar {
            position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: rgba(255,255,255,0.94); border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        html:not(.is-embed) .topbar { top: 0; }
        .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; flex-wrap: wrap; }
        .seg button {
            appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer;
            padding: 8px 14px; min-height: 36px; font-size: 12px; font-weight: 600; transition: background 0.15s, color 0.15s;
        }
        .seg button.on { background: #111; color: #fff; }
        .topbar .grow { flex: 1; }
        .ib {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
            display: grid; place-items: center; cursor: pointer; flex: none;
        }
        .ib svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .ib:disabled { opacity: 0.3; cursor: default; }
        .ib:not(:disabled):hover { background: #111; color: #fff; border-color: #111; }
        .pillbtn {
            border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 13px; height: 36px;
            font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }

        .view { display: none; }
        .view.on { display: block; }

        /* ---- Canvas: the storefront itself, editable ---- */
        .stage { padding: 14px 12px 150px; }
        .cv {
            max-width: 460px; margin: 0 auto; background: var(--sf-bg, #fff); color: var(--sf-ink, #111);
            border-radius: 18px; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,0.09);
        }
        .cv-hero {
            position: relative; height: 150px; display: flex; align-items: flex-end; padding: 16px; cursor: pointer;
            background: var(--sf-hero, linear-gradient(150deg,#2c2823,#100e0c)) center / cover;
        }
        .cv-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--sf-scrim, rgba(0,0,0,.55)), transparent 70%); }
        .cv-hero .nm {
            position: relative; z-index: 1; width: 100%; color: #fff; font-size: 26px; line-height: 1;
            font-family: var(--sf-name-font); font-weight: var(--sf-name-weight);
            letter-spacing: var(--sf-name-spacing); text-transform: var(--sf-name-transform);
        }
        .cv-hero .hint {
            position: absolute; z-index: 2; top: 10px; right: 10px; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase;
            background: rgba(255,255,255,0.9); color: #111; padding: 4px 9px; border-radius: 999px; font-weight: 600;
        }

        .sw { position: relative; cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color 0.15s; }
        .sw > .ss { pointer-events: none; }
        .sw:hover { outline-color: rgba(47,107,255,0.35); }
        .sw.sel { outline-color: var(--blue); z-index: 3; }
        .sw.off > .ss { opacity: 0.28; filter: grayscale(1); }
        .sw-tag {
            position: absolute; z-index: 5; top: 6px; left: 6px; display: none; pointer-events: none;
            background: var(--blue); color: #fff; font-size: 9.5px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
            padding: 3px 8px; border-radius: 999px;
        }
        .sw.sel .sw-tag, .sw.off .sw-tag { display: block; }
        .sw.off:not(.sel) .sw-tag { background: #8b8b86; }
        .sw-bar {
            position: absolute; z-index: 6; top: 6px; right: 6px; display: none; gap: 2px; padding: 3px;
            background: #111; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }
        .sw.sel .sw-bar { display: flex; }
        .sw-bar button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: #fff; cursor: pointer; display: grid; place-items: center; }
        .sw-bar button:hover { background: rgba(255,255,255,0.18); }
        .sw-bar button:disabled { opacity: 0.3; }
        .sw-bar svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .ins { position: relative; height: 0; z-index: 4; }
        .ins button {
            position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%);
            width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; cursor: pointer;
            font-size: 17px; line-height: 1; display: grid; place-items: center; opacity: 0.0; transition: opacity 0.15s;
            box-shadow: 0 3px 10px rgba(47,107,255,0.4);
        }
        .cv:hover .ins button, .ins button:focus-visible { opacity: 1; }
        @media (hover: none) { .ins button { opacity: 0.9; } }
        .addbig {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 28px); margin: 16px 14px;
            padding: 15px; border: 1.5px dashed #b9b6ae; border-radius: 14px; background: none; cursor: pointer;
            font-size: 12.5px; font-weight: 600; color: inherit;
        }
        .addbig:hover { border-color: var(--blue); color: var(--blue); }

        /* ---- Bottom sheet (settings / add / presets) ---- */
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; margin: 0 auto; max-width: 540px;
            background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.18);
            max-height: 62vh; display: none; flex-direction: column;
        }
        .sheet.open { display: flex; animation: shUp 0.26s cubic-bezier(.2,.8,.2,1) both; }
        .sheet.tall { max-height: 84vh; }
        @keyframes shUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
        .sh-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
        .sh-name { font-size: 14px; font-weight: 600; flex: 1; }
        .sh-body { padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; }

        .f { display: block; margin-bottom: 15px; }
        .f > span, .lbl { display: block; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
        .f input[type="text"], .f textarea, .f select {
            width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 14px;
            background: #fff; color: var(--ink); outline: none;
        }
        .f textarea { min-height: 70px; resize: vertical; }
        .f input:focus, .f textarea:focus, .f select:focus { border-color: #111; }
        .f input[type="range"] { width: 100%; accent-color: #111; }
        .f .rowv { display: flex; align-items: center; gap: 10px; }
        .f .rowv output { font-size: 12px; font-weight: 600; min-width: 44px; text-align: right; }
        .tg { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; font-size: 13px; }
        .tg input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #d9d7d1; position: relative; cursor: pointer; transition: background 0.2s; flex: none; }
        .tg input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
        .tg input:checked { background: #111; }
        .tg input:checked::after { transform: translateX(18px); }

        .pos9 { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; }
        .pos9 button { height: 28px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; position: relative; }
        .pos9 button::after { content: ''; position: absolute; inset: 0; margin: auto; width: 7px; height: 7px; border-radius: 50%; background: #c9c6be; }
        .pos9 button.on { background: #111; border-color: #111; }
        .pos9 button.on::after { background: #fff; }

        .swatches { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
        .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
        .swatch.on { box-shadow: 0 0 0 2px #111; }
        .swatch.none { background: linear-gradient(135deg, #fff 45%, #e0554f 46%, #e0554f 54%, #fff 55%); }

        .imgf { display: flex; align-items: center; gap: 12px; }
        .imgf-th { position: relative; width: 68px; height: 68px; border-radius: 12px; overflow: hidden; background: var(--soft); flex: none; border: 1px solid var(--line); }
        .imgf-th .ss-media { background: var(--soft); }
        .imgf-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .sbtn { border: 1px solid #111; background: #fff; border-radius: 999px; padding: 0 14px; min-height: 38px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .sbtn.dark { background: #111; color: #fff; }
        .sbtn.quiet { border-color: var(--line); color: var(--muted); }
        .sbtn.danger { border-color: #e7c9c6; color: #b23b3b; }
        .sbtn.wide { width: 100%; }

        .sub { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .sub-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .sub-top b { flex: 1; font-size: 12.5px; }
        .mini { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1; }
        .mini:disabled { opacity: 0.3; }

        /* ---- Grid builder board ---- */
        .gb { border: 1px dashed #c9c6be; border-radius: 14px; padding: 8px; margin-bottom: 12px; background: var(--soft); }
        .gb .ss-pad { padding: 0; }
        .gb .ss-cell { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline: 2px solid transparent; outline-offset: -2px; }
        .gb .ss-cell.on { outline-color: var(--blue); }
        .gb .ss-cell.drag { opacity: 0.45; }
        .gb .ss-cell.drop { outline: 2px dashed var(--blue); }
        .gb-size { position: absolute; z-index: 4; top: 5px; left: 5px; background: rgba(17,17,17,0.78); color: #fff; font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 999px; pointer-events: none; }
        .gb-handle {
            position: absolute; z-index: 5; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize; touch-action: none;
            background: linear-gradient(135deg, transparent 50%, var(--blue) 50%); border-bottom-right-radius: inherit;
        }
        .gb-help { font-size: 11px; color: var(--muted); margin: -4px 0 12px; }
        .step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
        .step button { width: 36px; height: 36px; border: 0; background: #fff; cursor: pointer; font-size: 16px; }
        .step b { min-width: 30px; text-align: center; font-size: 13px; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* ---- Add-section library + presets ---- */
        .lib { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .lib button {
            text-align: left; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 12px; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px; transition: border-color 0.15s, transform 0.15s;
        }
        .lib button:hover { border-color: #111; transform: translateY(-2px); }
        .lib svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 4px; }
        .lib b { font-size: 13px; }
        .lib small { font-size: 11px; color: var(--muted); line-height: 1.4; }

        /* ---- Theme view ---- */
        .theme { max-width: 720px; margin: 0 auto; padding: 6px 16px 150px; }
        .sec-lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px; font-weight: 600; }
        .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (min-width: 620px) { .tpl-grid { grid-template-columns: repeat(3, 1fr); } }
        .tpl { border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; background: #fff; position: relative; text-align: left; padding: 0; }
        .tpl.on { border-color: #111; box-shadow: 0 0 0 2px #111; }
        .tpl .sfp { border-radius: 0; }
        .tpl .sfp .sfp-hero { height: 84px; }
        .tpl-foot { padding: 9px 12px 11px; display: block; }
        .tpl-foot b { font-size: 12.5px; display: block; }
        .tpl-foot small { font-size: 10.5px; color: var(--muted); }

        /* ---- Sticky publish bar ---- */
        .actionbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
            display: flex; gap: 10px; align-items: center;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
        }
        .state { flex: 1; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; min-width: 0; }
        .state i { width: 8px; height: 8px; border-radius: 50%; background: #1f8f4e; flex: none; }
        .state.dirty i { background: #e09a1f; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px;
            border: 1.4px solid #111; background: #fff; color: #111; font-family: inherit; font-size: 12px; font-weight: 600;
            cursor: pointer; min-height: 44px;
        }
        .btn.primary { background: #111; color: #fff; }
        .btn:disabled { opacity: 0.35; cursor: default; }
        .toast {
            position: fixed; left: 50%; bottom: 86px; z-index: 80; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
            background: #111; color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 999px; transition: opacity 0.25s, transform 0.25s; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>

    <script>
    (function storeBuilder() {
        'use strict';
        try { localStorage.setItem('vero_active_account', 'seller'); } catch (e) {}
        if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('is-embed');

        var V = window.VeroStore, esc = V.esc, uid = V.uid;
        var KEY = 'vero_store_config';
        var readJSON = function (k, fb) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };
        var read = function () { return readJSON(KEY, {}) || {}; };
        var write = function (o) { try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { toast('Storage is full — remove an image and try again'); return false; } };
        var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
        var $ = function (id) { return document.getElementById(id); };

        var cfg = read();

        /* ------------------------------ Data ------------------------------ */
        // First visit: carry the old "grid density" choice into a products section.
        function starter() {
            var p = V.defaults('products');
            p.cols = Math.min(3, Math.max(2, Number(cfg.grid) || 2));
            return [p];
        }
        var sections = clone(Array.isArray(cfg.sectionsDraft) ? cfg.sectionsDraft : Array.isArray(cfg.sections) ? cfg.sections : starter());
        var selId = null, cellId = null, mode = null, addAt = 0;
        var history = [JSON.stringify(sections)], hi = 0;

        // What the canvas shows as "your items": real listings, or samples.
        var products = (function () {
            var l = readJSON('vero_listings', []);
            var mine = (Array.isArray(l) ? l : []).filter(function (p) { return p && (p.status === 'active' || p.status == null); })
                .map(function (p) {
                    return { name: p.name || p.title || 'Item', price: p.price != null ? p.price : 0, icon: p.icon || p.emoji || '🛍️',
                             cover: p.processed_cover || p.cover || (p.photos && (p.photos.cover || p.photos.detail)) || '' };
                });
            if (mine.length) return mine;
            return [['Wool coat', 269, '🧥'], ['Raw denim', 129, '👖'], ['Silk scarf', 210, '🧣'], ['Leather tote', 540, '👜'], ['Knit sweater', 180, '🧶'], ['Linen shirt', 95, '👔']]

            }
            b = e.target.closest('[data-do]'); if (!b) return;
            var act = b.getAttribute('data-do'), i = +b.getAttribute('data-i');
            if (act === 'img') { pickPath = b.getAttribute('data-path'); $('filePick').value = ''; $('filePick').click(); return; }
            if (act === 'img-clear') setPath(s, b.getAttribute('data-path'), '');
            else if (act === 'slide-add') s.slides.push({ id: uid(), image: '', title: 'New slide', text: '' });
            else if (act === 'slide-del') s.slides.splice(i, 1);
            else if (act === 'slide-up') s.slides.splice(i - 1, 0, s.slides.splice(i, 1)[0]);
            else if (act === 'cell-add') { var c = { id: uid(), w: 1, h: 1, kind: 'image', image: '', title: '', text: '' }; s.cells.push(c); cellId = c.id; }
            else if (act === 'pattern') applyPattern(s, b.getAttribute('data-v'));
            else {
                var ci = -1; s.cells.forEach(function (x, k) { if (x.id === cellId) ci = k; }); if (ci < 0) return;
                if (act === 'cell-del') { s.cells.splice(ci, 1); cellId = null; }
                else if (act === 'cell-move') { var j = ci + Number(b.getAttribute('data-d')); if (j < 0 || j >= s.cells.length) return; s.cells.splice(j, 0, s.cells.splice(ci, 1)[0]); }
                else if (act === 'cell-size') {
                    var k = b.getAttribute('data-k'), max = k === 'w' ? s.cols : 4;
                    s.cells[ci][k] = Math.min(max, Math.max(1, (s.cells[ci][k] || 1) + Number(b.getAttribute('data-d'))));
                }
            }
            commit(); paint(); paintSheet();
        });

        function applyPattern(s, name) {
            var cols = s.cols, P = {
                mosaic: [[2, 2], [1, 1], [1, 1], [1, 2], [2, 1], [1, 1]],
                hero: [[cols, 2], [1, 1], [1, 1], [1, 1], [1, 1]],
                even: [[1, 1]]
            }[name];
            var need = name === 'even' ? Math.max(s.cells.length, cols * 2) : Math.max(s.cells.length, name === 'hero' ? cols + 1 : 5);
            while (s.cells.length < need) s.cells.push({ id: uid(), w: 1, h: 1, kind: 'image', image: '', title: '', text: '' });
            s.cells.forEach(function (c, i) { var z = P[i % P.length]; c.w = Math.min(cols, z[0]); c.h = z[1]; });
        }

        /* Pointer interactions on the board: select, drag-to-move, corner-resize. */
        function wireBoard(s) {
            var gb = $('gb'); if (!gb) return;
            var box = gb.querySelector('.ss-gridbox'); if (!box) return;
            gb.querySelectorAll('[data-cell]').forEach(function (el) {
                var c = s.cells.filter(function (x) { return x.id === el.getAttribute('data-cell'); })[0]; if (!c) return;
                el.classList.toggle('on', c.id === cellId);
                el.insertAdjacentHTML('beforeend', '<span class="gb-size">' + c.w + '×' + c.h + '</span><span class="gb-handle"></span>');
            });
            if (gb._wired) return; gb._wired = true;
            var drag = null;
            gb.addEventListener('pointerdown', function (e) {
                var el = e.target.closest('[data-cell]'); if (!el) return;
                var sec = sel(); if (!sec) return;
                var c = sec.cells.filter(function (x) { return x.id === el.getAttribute('data-cell'); })[0]; if (!c) return;
                var bx = gb.querySelector('.ss-gridbox'), gap = Number(sec.gap) || 0;
                drag = { el: el, c: c, x: e.clientX, y: e.clientY, resize: !!e.target.closest('.gb-handle'), moved: false,
                         unit: (bx.clientWidth - gap * (sec.cols - 1)) / sec.cols, gap: gap, w: c.w, h: c.h, sec: sec, drop: null };
                try { gb.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });
            gb.addEventListener('pointermove', function (e) {
                if (!drag) return;
                var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 7) return;
                drag.moved = true;
                if (drag.resize) {
                    var step = drag.unit + drag.gap;
                    var w = Math.min(drag.sec.cols, Math.max(1, Math.round((drag.w * step + dx) / step)));
                    var h = Math.min(4, Math.max(1, Math.round((drag.h * step + dy) / step)));
                    if (w !== drag.c.w || h !== drag.c.h) {
                        drag.c.w = w; drag.c.h = h;
                        drag.el.style.setProperty('--w', w); drag.el.style.setProperty('--h', h);
                        var tag = drag.el.querySelector('.gb-size'); if (tag) tag.textContent = w + '×' + h;
                        paint();
                    }
                } else {
                    drag.el.classList.add('drag');
                    var over = document.elementFromPoint(e.clientX, e.clientY);
                    over = over && over.closest('#gb [data-cell]');
                    if (drag.drop && drag.drop !== over) drag.drop.classList.remove('drop');
                    drag.drop = over && over !== drag.el ? over : null;
                    if (drag.drop) drag.drop.classList.add('drop');
                }
            });
            var end = function () {
                if (!drag) return;
                var d = drag; drag = null;
                if (!d.moved) { cellId = d.c.id; paintSheet(); return; }
                if (!d.resize && d.drop) {
                    var from = d.sec.cells.indexOf(d.c), to = -1, tid = d.drop.getAttribute('data-cell');
                    d.sec.cells.forEach(function (x, k) { if (x.id === tid) to = k; });
                    if (to >= 0) d.sec.cells.splice(to, 0, d.sec.cells.splice(from, 1)[0]);
                }
                cellId = d.c.id; commit(); paint(); paintSheet();
            };
            gb.addEventListener('pointerup', end);
            gb.addEventListener('pointercancel', end);
        }

        /* ------------------------------ Images ------------------------------ */
        var pickPath = null;
        function shrink(file, max, q) {
            return new Promise(function (resolve, reject) {
                var url = URL.createObjectURL(file), img = new Image();
                img.onload = function () {
                    var k = Math.min(1, max / Math.max(img.width, img.height));
                    var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    resolve(c);
                };
                img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
                img.src = url;
            });
        }
        $('filePick').addEventListener('change', function () {
            var file = this.files && this.files[0], s = sel(), path = pickPath;
            if (!file || !s || !path) return;
            shrink(file, 1400).then(function (canvas) {
                return new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', 0.84); }).then(function (blob) {
                    var key = 'sb_' + uid(), pointer = 'idb:' + key;
                    return window.veroMediaSet(key, blob).then(function () {
                        V.setMedia(pointer, URL.createObjectURL(blob)); return pointer;
                    });
                }).catch(function () {
                    // IndexedDB unavailable — keep a small inline copy instead.
                    return shrink(file, 800).then(function (c) { return c.toDataURL('image/jpeg', 0.7); });
                });
            }).then(function (pointer) {
                setPath(s, path, pointer); commit(); paint(); if (mode === 'edit') paintSheet();
            }).catch(function () { toast('That image could not be read'); });
        });

        /* ------------------------------- Theme ------------------------------- */
        var TEMPLATES = [
            ['t1', 'Minimal', 'Clean white, signature red'], ['t2', 'Editorial', 'Warm cream, gold, Bodoni'], ['t3', 'Noir', 'Dark and bold, silver'],
            ['t4', 'Blush', 'Soft pink, elegant serif'], ['t5', 'Street', 'Bold orange, uppercase'], ['t6', 'Luxe', 'Deep green, gold'],
            ['t7', 'Lavender', 'Soft purple, rounded'], ['t8', 'Gallery', 'Airy gray, monochrome'], ['t9', 'Classic', 'Navy, traditional serif'], ['t10', 'Coast', 'Fresh turquoise']
        ];
        var ACCENTS = ['#EB2323', '#9a7d52', '#d46a7e', '#ff5a1f', '#c8a24a', '#7b5cd6', '#1f3a5f', '#1f9c8f', '#111111'];
        function saveTheme(patch) {
            cfg = read();
            Object.keys(patch).forEach(function (k) { if (patch[k] === '' || patch[k] == null) delete cfg[k]; else cfg[k] = patch[k]; });
            write(cfg); paintTheme(); applyTheme(); paint(); toast('Theme saved');
        }
        function paintTheme() {
            var accent = cfg.accent || '', tpl = cfg.template || 't1';
            $('accentRow').innerHTML =
                '<button type="button" class="swatch' + (!accent ? ' on' : '') + '" data-accent="" title="The template default" style="background:conic-gradient(#EB2323,#c8a24a,#1f9c8f,#7b5cd6,#EB2323)"></button>' +
                ACCENTS.map(function (c) { return '<button type="button" class="swatch' + (accent === c ? ' on' : '') + '" data-accent="' + c + '" style="background:' + c + '"></button>'; }).join('');
            $('tplGrid').innerHTML = TEMPLATES.map(function (t) {
                return '<button type="button" class="tpl' + (t[0] === tpl ? ' on' : '') + '" data-tpl="' + t[0] + '">' +
                    '<span class="sfp" data-store-template="' + t[0] + '" style="display:block' + (accent ? ';--sf-accent:' + accent : '') + '">' +
                    '<span class="sfp-hero" style="display:flex"><span class="sfp-name">' + esc(storeName) + '</span></span>' +
                    '<span class="sfp-body" style="display:block"><span class="sfp-tiles" style="display:grid"><i class="sfp-tile"></i><i class="sfp-tile"></i><i class="sfp-tile"></i></span></span></span>' +
                    '<span class="tpl-foot"><b>' + t[1] + '</b><small>' + t[2] + '</small></span></button>';
            }).join('');
            $('namePosSeg').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-pos') === (cfg.namePos || 'left')); });
        }
        $('accentRow').addEventListener('click', function (e) { var b = e.target.closest('[data-accent]'); if (b) saveTheme({ accent: b.getAttribute('data-accent') }); });
        $('tplGrid').addEventListener('click', function (e) { var b = e.target.closest('[data-tpl]'); if (b) saveTheme({ template: b.getAttribute('data-tpl') }); });
        $('namePosSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-pos]'); if (b) saveTheme({ namePos: b.getAttribute('data-pos') }); });

        /* ------------------------------ Chrome ------------------------------ */
        function setView(v) {
            $('viewBuild').classList.toggle('on', v === 'build');
            $('viewTheme').classList.toggle('on', v === 'theme');
            $('viewSeg').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === v); });
            if (v === 'theme') closeSheet();
            window.scrollTo(0, 0);
        }
        $('viewSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) setView(b.getAttribute('data-view')); });
        $('presetBtn').addEventListener('click', function () { setView('build'); openSheet('presets'); });
        $('undoBtn').addEventListener('click', function () { travel(-1); });
        $('redoBtn').addEventListener('click', function () { travel(1); });
        $('publishBtn').addEventListener('click', function () {
            cfg = read(); cfg.sections = clone(sections); cfg.sectionsDraft = sections;
            if (write(cfg)) { paintState(); toast('Published — your storefront is live'); }
        });
        $('previewBtn').addEventListener('click', function () { saveDraft(); location.href = 'buyer-profile.html?draft=1'; });

        applyTheme(); paintTheme(); paint();
    })();
    </script>
<script src="assets/line-icons.js"></script>
