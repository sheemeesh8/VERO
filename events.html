<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  if (window.self === window.top && !/[?&]embed=1/.test(location.search)) {
    var pf = location.pathname.split('/').pop() || 'index';
    if (!/\.html$/.test(pf)) pf += '.html';
    location.replace('phone-frame.html#page=' + encodeURIComponent(pf + location.search));
  }
</script>
<meta name="description" content="Markets, fairs, meetups and pop-ups where moravchick sellers meet buyers in person.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<title>moravchick — Events</title>
<script src="vero-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/aharoni.css">
<style>
  /* ---- Events: a calm, editorial page in the site's black-on-white voice. ---- */
  :root {
    --ink: #16150f; --muted: rgba(22,21,15,0.62); --faint: rgba(22,21,15,0.42);
    --line: rgba(22,21,15,0.14); --line-strong: rgba(22,21,15,0.32); --tile: #f4f3ef;
    --navy: #2a4373; --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --market: #9a7d52; --fair: #2b6d9a; --meetup: #1f8f4e; --popup: #b23b3b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #fff; color: var(--ink);
         font-size: 12px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 8px 20px calc(56px + env(safe-area-inset-bottom, 0px)); }
  .k { font-size: 8.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }


  /* Next up — the event for the day turned to on the wheel: no card, no background,
     everything centred under the wheel. */
  .next { margin-top: 28px; padding: 8px 0 4px; background: none; color: var(--ink); text-align: center; }
  .next[hidden] { display: none; }
  .next-top { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 14px; }
  .next-date { flex: none; width: 64px; text-align: center; padding: 8px 0 7px; border: 1px solid var(--line-strong); }
  .next-date b { display: block; font-size: 30px; font-weight: 200; line-height: 1; }
  .next-date span { display: block; margin-top: 5px; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .next .ev-type .type { justify-content: center; }
  .next-title a, .ev-title a { color: inherit; text-decoration: none; }
  .next-title { font-family: 'Inter', sans-serif !important; font-size: 19px; font-weight: 300; line-height: 1.2; }
  .next-meta { margin-top: 7px; font-size: 10.5px; color: var(--muted); line-height: 1.55; }
  .next-blurb { margin: 16px auto 0; max-width: 340px; font-size: 11px; font-weight: 300; line-height: 1.65; color: var(--muted); }
  .next-when { margin-top: 14px; font-size: 8.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .next .acts { margin-top: 18px; justify-content: center; }

  /* Day wheel — the bottom of a wheel across the page (sides rise), edge to edge, above Next up.
     The vanilla wheel (assets/wheel-carousel.js, orientation: 'horizontal'); dates
     stay upright, a yellow dot marks a day with something on. */
  .ewheel { height: 160px; margin: 24px -20px 0; }
  .vwc { position: relative; display: flex; overflow: hidden; background: none; }
  .vwc-stage { position: relative; display: flex; width: 100%; height: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; outline: none; }
  .vwc-stage.is-dragging { cursor: grabbing; }
  .vwc-list { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
  .vwc-item { position: absolute; transform-origin: center top; white-space: nowrap; pointer-events: none; color: rgba(22,21,15,0.4); will-change: transform, opacity; transition: color 0.2s ease; }
  .vwc-item.is-selected { color: var(--ink); }
  .vwc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vwc-appear .vwc-stage { opacity: 0; transform: translateY(14px); }
  .vwc-appear.vwc-in .vwc-stage { opacity: 1; transform: none; transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .ew-d { width: 50px; display: flex; flex-direction: column; align-items: center; gap: 6px; line-height: 1; }
  .ew-d small { font-size: 8px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .ew-d b { font-size: 30px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .ew-dot { width: 7px; height: 7px; background: #f2c200; border-radius: 50%; }
  .ew-dot.none { visibility: hidden; }
  .vwc-item.is-selected .ew-d b { font-weight: 300; }
  .vwc-item.is-selected .ew-d::after { content: ''; width: 18px; height: 1.5px; margin-top: 2px; background: var(--ink); }
  .vwc-stage:focus-visible .vwc-item.is-selected .ew-d::after { width: 34px; }
  .ewheel + .next { margin-top: 6px; }
  .next-empty { margin-top: 10px; font-size: 11px; font-weight: 300; color: var(--muted); }

  /* Type mark */
  .type { display: inline-flex; align-items: center; gap: 6px; }
  .type i { width: 7px; height: 7px; display: inline-block; background: currentColor; }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-top: 30px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .fchip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 10px 14px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer;
           font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .fchip i { width: 6px; height: 6px; display: inline-block; }
  .fchip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* Month calendar */
  .cal { margin-top: 26px; border-top: 1px solid var(--ink); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; }
  .cal-month { font-family: 'Inter', sans-serif !important; font-size: 15px; font-weight: 300; }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-btn { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 1px solid var(--line); cursor: pointer; }
  .cal-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .cal-today { height: 36px; padding: 0 12px; background: none; border: 1px solid var(--line); cursor: pointer; font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow span { padding: 6px 0 8px; text-align: center; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .cal-grid { gap: 2px; }
  .day { position: relative; aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
         background: none; border: 0; font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--ink); cursor: default; }
  .day.blank { visibility: hidden; }
  .day.past { color: var(--faint); }
  .day.has { cursor: pointer; background: var(--tile); }
  .day.today span { border-bottom: 1.5px solid var(--ink); padding-bottom: 1px; }
  .day.sel { background: var(--ink); color: #fff; }
  .day.sel.today span { border-color: #fff; }
  .day .dots { display: flex; gap: 3px; height: 5px; }
  .day .dots i { width: 5px; height: 5px; display: block; }
  .day.sel .dots i { box-shadow: 0 0 0 1px rgba(255,255,255,0.8); }
  .day.booth::after { content: ''; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; background: var(--navy); }

  /* The list under the calendar */
  .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 30px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  .list-head h2 { font-family: 'Inter', sans-serif !important; font-size: 15px; font-weight: 300; }
  .list-head .k { white-space: nowrap; }
  .clear { background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 2px 0; cursor: pointer; font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .sub { margin-top: 22px; }
  .empty { padding: 34px 0; text-align: center; font-size: 11px; font-weight: 300; color: var(--muted); }

  /* An event */
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .ev.past { opacity: 0.55; }
  .ev-date { text-align: center; padding-top: 2px; }
  .ev-date b { display: block; font-size: 24px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .ev-date span { display: block; margin-top: 5px; font-size: 7.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .ev-type { font-size: 8px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .ev-title { margin-top: 6px; font-family: 'Inter', sans-serif !important; font-size: 15px; font-weight: 400; line-height: 1.25; }
  .ev-meta { margin-top: 5px; font-size: 10.5px; color: var(--muted); line-height: 1.55; }
  .ev-blurb { margin-top: 10px; font-size: 10.5px; font-weight: 300; line-height: 1.65; color: var(--muted); }
  .who { margin-top: 12px; font-size: 10px; color: var(--muted); line-height: 1.6; }
  .who b { font-weight: 500; color: var(--ink); }
  .who .you { color: var(--navy); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-strong);
         background: none; text-decoration: none; color: var(--ink); cursor: pointer; font-size: 8.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  .btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.quiet { border-color: transparent; padding: 0 4px; color: #9a3b2f; }

  /* Seller: the booth panel */
  .booth { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s var(--ease); }
  .booth.open { grid-template-rows: 1fr; }
  .booth > div { overflow: hidden; min-height: 0; }
  .booth-in { margin-top: 14px; padding: 16px; background: var(--tile); }
  .booth-t { font-size: 11px; font-weight: 500; }
  .booth-l { margin-top: 4px; font-size: 10px; font-weight: 300; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { padding: 8px 11px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; font-size: 9.5px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .booth .acts { margin-top: 14px; }

  /* Seller: host an event */
  .host { margin-top: 36px; }

  /* ===== Below the wheel: one centred, quiet column with even, medium spacing.
     Fewer frames and fills — type, thin lines and the kind colours do the work. ===== */
  .next, .filters, .cal, .list-head, #list, .host { text-align: center; }
  .next { margin-top: 26px; padding: 0; }
  .next-top { gap: 10px; margin-top: 18px; }
  .next-date { width: auto; padding: 0; border: 0; }
  .next-date b { font-size: 40px; }
  .next-blurb { margin-top: 14px; }
  .next .who { margin-top: 10px; }
  .next .acts { margin-top: 22px; gap: 18px; align-items: center; }
  /* Actions: one small solid button, the rest as underlined text. */
  .btn { min-height: 36px; padding: 0 16px; }
  .btn:not(.solid):not(.navy):not(.quiet):not(.go-on) { min-height: 0; padding: 3px 0; border: 0; border-bottom: 1px solid var(--line-strong); }
  .btn:not(.solid):not(.navy):not(.quiet):not(.go-on) svg { display: none; }
  .acts { justify-content: center; }

  /* Kinds: plain words with their colour dot, the chosen one underlined; they wrap, centred. */
  .filters { justify-content: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 48px; overflow: visible; }
  .fchip { padding: 6px 0; letter-spacing: 0.12em; border: 0; border-bottom: 1px solid transparent; background: none; color: var(--muted); }
  .fchip.on { background: none; color: var(--ink); border-bottom-color: var(--ink); }

  /* Calendar: ‹ Month › centred, Today beneath; days without tiles, a dot for events. */
  .cal { margin-top: 40px; border-top: 0; }
  .cal-head { display: grid; grid-template-columns: 36px 1fr 36px; grid-template-areas: "prev month next" ". today ."; align-items: center; row-gap: 4px; padding: 0 0 18px; }
  .cal-nav { display: contents; }
  #prev { grid-area: prev; } #next-m { grid-area: next; } .cal-month { grid-area: month; font-size: 17px; }
  .cal-today { grid-area: today; justify-self: center; height: auto; padding: 2px 0; border: 0; color: var(--muted); }
  .cal-btn { border: 0; }
  .day.has { background: none; }
  .day.sel { background: var(--ink); }
  .day .dots i { border-radius: 50%; }

  /* The list: a centred heading, each event a centred block between hairlines. */
  .list-head { flex-direction: column; align-items: center; gap: 6px; margin-top: 44px; padding-bottom: 0; border-bottom: 0; }
  .list-head h2 { font-size: 17px; }
  .ev { display: block; max-width: 360px; margin: 0 auto; padding: 30px 0; border-bottom: 0; border-top: 1px solid var(--line); }
  .list-head + #list .ev:first-child, #list > .ev:first-child { margin-top: 18px; }
  .ev-date { display: flex; justify-content: center; align-items: baseline; gap: 8px; padding: 0; }
  .ev-date b { font-size: 26px; }
  .ev-date span { margin: 0; }
  .ev-type { margin-top: 10px; }
  .ev-type .type { justify-content: center; }
  .ev-blurb { margin: 10px auto 0; max-width: 320px; }
  .sub { margin: 36px 0 0; }
  .empty { padding: 30px 0; }
  .booth-in { text-align: left; }
  .chips { justify-content: center; }
  .host { margin-top: 48px; }

  /* ===== Opening — like the personal area: a full-screen photo under a clear
     header, the title, a line and the figures at its foot; once it is scrolled
     past, a tab bar slides in under the header to jump between the sections. ===== */
  /* Three quarters of the screen, like the home feed's hero — the page below shows under it. */
  .evh { position: relative; height: 75vh; height: 75svh; min-height: 480px; overflow: hidden; background: #23231f; color: #fff; }
  .evh-img { position: absolute; inset: 0; background: #23231f url('assets/hero/autumn-hero.jpg') center 35% / cover no-repeat; filter: grayscale(1) contrast(1.05); }
  .evh::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0) 22%), linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.38) 34%, rgba(0,0,0,0) 62%); }
  .evh-band { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 24px 22px calc(30px + env(safe-area-inset-bottom, 0px)); }
  .evh-k { font-size: 8.5px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.8); }
  .evh-figs { display: flex; gap: 34px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.28); }
  .evh-figs b { display: block; font-size: 17px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .evh-figs span { display: block; margin-top: 6px; font-size: 8px; letter-spacing: 0.08em; color: rgba(255,255,255,0.78); }
  .evh-acts { display: flex; gap: 10px; margin-top: 18px; }
  .evh-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; text-decoration: none; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.7); background: none; color: #fff; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
  .evh-btn[hidden] { display: none; }
  .evh-btn { white-space: nowrap; }
  .evh-btn.solid { background: #fff; border-color: #fff; color: var(--ink); }
  .evh-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  /* ---- Lumina (assets/lumina-hero.css / .js): where the pieces sit in this hero ---- */
  .evh-img.lu { filter: none; }
  #evhSlides { position: relative; }
  #evhSlides .lu-count { position: absolute; right: 0; top: -22px; }
  .lu-content { min-height: 92px; margin-top: 8px; }
  #evhSlides .lu-title { font-size: clamp(30px, 9vw, 36px); font-weight: 600; line-height: 1.05; letter-spacing: -0.01em; }
  #evhSlides .lu-desc { margin-top: 10px; font-size: 11px; font-weight: 300; line-height: 1.55; }
  #evhSlides .lu-nav { margin-top: 18px; }
  /* The tab bar under the header — hidden over the photo, slides down once past it. */
  .ev-tabs { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 0; right: 0; z-index: 150;
    display: flex; justify-content: center; align-items: flex-end; gap: 26px; padding: 12px 16px 0;
    background: rgba(255,255,255,0.94); -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid #ececec; overflow-x: auto; scrollbar-width: none;
    transform: translateY(-100%); opacity: 0; pointer-events: none; transition: transform 0.45s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease; }
  .ev-tabs::-webkit-scrollbar { display: none; }
  .ev-tabs.revealed { transform: none; opacity: 1; pointer-events: auto; }
  .ev-tab { flex: none; padding: 0 2px 11px; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #3c3935; transition: color .2s, border-color .2s; }
  .ev-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }
  /* Sections land below the header and the tab bar. */
  #filters, .cal, .list-head, #host { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 120px); }
  #eWheel { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 100px); }
  .wrap { padding-top: 20px; }   /* with the wheel's margin: the photo is past the header when the wheel is in place */
  @media (prefers-reduced-motion: reduce) { .ev-tabs { transition: none; } }

  /* "I'm going" and the count */
  .btn.go-on { min-height: 36px; padding: 0 14px; border: 1px solid var(--ink); background: none; color: var(--ink); }
  .btn.go-on svg { display: inline; width: 12px; height: 12px; stroke-width: 1.8; }
  .going-n { margin-top: 12px; font-size: 10.5px; color: var(--muted); }
  .going-n b { font-weight: 500; color: var(--ink); }
  /* A clear line between one event and the next, edge to edge of the column. */
  .ev { max-width: none; border-top: 1px solid var(--line-strong); }
  .ev:last-child { border-bottom: 1px solid var(--line-strong); }
  .ev > div { max-width: 360px; margin: 0 auto; }
  /* Gentle entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 0.7s var(--ease) both; }
  .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; } .d3 { animation-delay: 0.24s; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .vwc-appear .vwc-stage { opacity: 1; transform: none; } .booth { transition: none; } }
  html.is-embed .page-header { display: none; }
</style>
<style id="aharoni-headings">h1:not(#zz):not(#zz):not(#zz),h2:not(#zz):not(#zz):not(#zz),h3:not(#zz):not(#zz):not(#zz){font-family:'Inter','Segoe UI',sans-serif !important;}</style>

<link rel="stylesheet" href="assets/page-header.css?v=20261003e">

<body>
  <header class="page-header ph-overlay ph-float" data-hero="#evHero">
    <div class="ph-name" role="heading" aria-level="1">Events</div>
    <a class="ph-back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </header>

  <!-- Opening: the personal area's full-screen photo, then a tab bar for the sections. -->
  <section class="evh" id="evHero" aria-labelledby="evhTitle">
    <div class="evh-img" id="evhLumina"></div>
    <div class="evh-band">
      <h1 class="evh-k" id="evhTitle">Calendar &amp; happenings · Coming up</h1>
      <div id="evhSlides"></div>
      <div class="evh-figs" id="evhFigs"></div>
      <div class="evh-acts">
        <button type="button" class="evh-btn solid" data-go="wheel">See what’s on</button>
        <a class="evh-btn" id="evhHost" href="event-host.html" hidden>Host an event</a>
        <button type="button" class="evh-btn" id="evhCal" data-go="cal">Calendar</button>
      </div>
    </div>
  </section>
  <nav class="ev-tabs" id="evTabs" aria-label="Sections">
    <button type="button" class="ev-tab is-active" data-go="wheel">What’s on</button>
    <button type="button" class="ev-tab" data-go="cal">Calendar</button>
    <button type="button" class="ev-tab" data-go="list">List</button>
    <button type="button" class="ev-tab" data-go="host" hidden>Host</button>
  </nav>

  <main class="wrap">

    <!-- The event coming soonest. -->
    <div class="ewheel rise d1" id="eWheel"></div>
    <section class="next rise d1" id="next" hidden aria-labelledby="nextTitle"></section>

    <!-- Filter by kind of event: drives the calendar dots and the list. -->
    <div class="filters rise d2" id="filters" role="group" aria-label="Kind of event"></div>

    <section class="cal rise d2" aria-label="Calendar">
      <div class="cal-head">
        <div class="cal-month" id="calMonth" aria-live="polite">—</div>
        <div class="cal-nav">
          <button type="button" class="cal-btn" id="prev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button type="button" class="cal-today" id="todayBtn">Today</button>
          <button type="button" class="cal-btn" id="next-m" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="cal-dow" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <section aria-labelledby="listTitle">
      <div class="list-head"><h2 id="listTitle">Upcoming</h2><span class="k" id="listCount"></span></div>
      <div id="list"></div>
    </section>

    <!-- Sellers can host an event of their own. -->
    <section class="host" id="host" hidden>
      <a class="btn solid" id="hostToggle" href="event-host.html">Host an event</a>
    </section>
  </main>

  <script src="assets/events-data.js?v=2"></script>
  <script src="assets/wheel-carousel.js?v=5"></script>
  <script src="assets/lumina-hero.js?v=2"></script>
  <script>
  (function eventsPage() {
    var E = window.veroEvents;
    if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('is-embed');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
    var ICON = {
      cal: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
      tick: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>'
    };

    var isSeller = false;
    try { isSeller = localStorage.getItem('vero_active_account') === 'seller'; } catch (e) {}
    if (/[?&]seller=1/.test(location.search)) isSeller = true;

    var todayIso = E.iso(E.today());
    var view = new Date(E.today().getFullYear(), E.today().getMonth(), 1);
    var selected = null, kind = 'all', openBooth = null;
    var wheelDay = todayIso;   // the day turned to on the wheel; Next up shows from it on
    var qd = (location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/) || [])[1];
    if (qd) { selected = qd; view = new Date(+qd.slice(0, 4), +qd.slice(5, 7) - 1, 1); }

    // The seller's own pieces, to choose what to bring to a booth.
    var products = (function () {
      var l = []; try { l = JSON.parse(localStorage.getItem('vero_listings')) || []; } catch (e) {}
      return (Array.isArray(l) ? l : []).map(function (p) { return p.title || p.name; }).filter(Boolean);
    })();

    function events() { return E.all().filter(function (e) { return kind === 'all' || e.type === kind; }); }
    function color(t) { return (E.TYPES[t] || {}).color || 'var(--muted)'; }
    function typeMark(t) { return '<span class="type" style="color:' + color(t) + '"><i></i>' + esc((E.TYPES[t] || {}).name || t) + '</span>'; }
    function dayLabel(ds) { var d = E.parse(ds); return E.DOWF[d.getDay()] + ', ' + E.MONF[d.getMonth()] + ' ' + d.getDate(); }
    function relDay(ds) {
      var n = Math.round((E.parse(ds) - E.today()) / 864e5);
      return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n > 1 ? 'In ' + n + ' days' : '';
    }
    // "I'm going": a solid button until you say yes, then a quiet "Going" you can undo.
    function goBtn(e) {
      var on = E.isGoing(e.id);
      if (e.own) return '';
      return '<button type="button" class="btn ' + (on ? 'go-on' : 'solid') + '" data-going="' + esc(e.id) + '" aria-pressed="' + on + '">' + (on ? ICON.tick + 'Going' : 'I’m going') + '</button>';
    }
    function goingLine(e) { var n = E.goingCount(e); return '<p class="going-n"><b>' + n + '</b> going' + (E.isGoing(e.id) ? ' · including you' : e.own ? ' · your event' : '') + '</p>'; }
    function who(e) {
      var a = E.attendees(e);
      var names = a.slice(0, 3).map(function (s) { return '<b class="' + (s.you ? 'you' : '') + '">' + esc(s.you ? 'You' : s.name) + '</b>'; }).join(', ');
      return '<div class="who">' + a.length + ' sellers coming · ' + names + (a.length > 3 ? ' and ' + (a.length - 3) + ' more' : '') + '</div>';
    }

    // ---- Next up ----
    function renderNext() {
      var el = document.getElementById('next');
      var e = E.upcoming().filter(function (x) { return x.date >= wheelDay && (kind === 'all' || x.type === kind); })[0];
      el.hidden = false;
      if (!e) {
        el.innerHTML = '<p class="k">' + esc(dayLabel(wheelDay)) + '</p><p class="next-empty">Nothing planned from this day on yet.</p>';
        return;
      }
      var d = E.parse(e.date);
      // On the day turned to: "Today" / "In 4 days". Otherwise say the day is free and what comes next.
      var lead = e.date === wheelDay ? (relDay(e.date) || dayLabel(e.date))
        : 'Nothing on ' + E.DOW[E.parse(wheelDay).getDay()] + ' ' + E.parse(wheelDay).getDate() + ' · next ' + (relDay(e.date) ? relDay(e.date).toLowerCase() : dayLabel(e.date));
      el.innerHTML =
        '<p class="k">' + (e.date === wheelDay ? 'Next up · ' : '') + esc(lead) + '</p>' +
        '<div class="next-top">' +
          '<div class="next-date"><b>' + d.getDate() + '</b><span>' + E.MON[d.getMonth()] + '</span></div>' +
          '<div><div class="ev-type">' + typeMark(e.type).replace('style="color:', 'style="color:var(--ink);--c:') + '</div>' +
          '<h2 class="next-title" id="nextTitle" style="margin-top:6px"><a href="event.html?id=' + encodeURIComponent(e.id) + '">' + esc(e.title) + '</a></h2>' +
          '<div class="next-meta">' + esc(E.DOWF[d.getDay()]) + (e.time ? ' · ' + esc(e.time) : '') + (e.place ? '<br>' + esc(e.place) : '') + '</div></div>' +
        '</div>' +
        (e.blurb ? '<p class="next-blurb">' + esc(e.blurb) + '</p>' : '') +
        goingLine(e) + who(e) +
        '<div class="acts">' + goBtn(e) + '<button type="button" class="btn" data-ics="' + esc(e.id) + '">' + ICON.cal + 'Add to calendar</button>' +
        (e.place ? '<a class="btn" href="' + esc(E.mapsUrl(e)) + '" target="_blank" rel="noopener">' + ICON.pin + 'Directions</a>' : '') + '</div>';
      // The type mark's swatch keeps the kind's colour; the label stays ink.
      var sw = el.querySelector('.type i'); if (sw) sw.style.background = color(e.type);
    }

    // ---- Filters ----
    function renderFilters() {
      var host = document.getElementById('filters');
      var kinds = [['all', 'All events', null]].concat(Object.keys(E.TYPES).map(function (k) { return [k, E.TYPES[k].plural, E.TYPES[k].color]; }));
      host.innerHTML = kinds.map(function (k) {
        return '<button type="button" class="fchip' + (kind === k[0] ? ' on' : '') + '" data-kind="' + k[0] + '" aria-pressed="' + (kind === k[0]) + '">' +
          (k[2] ? '<i style="background:' + k[2] + '"></i>' : '') + esc(k[1]) + '</button>';
      }).join('');
    }

    // ---- Calendar ----
    function renderCal() {
      var y = view.getFullYear(), m = view.getMonth();
      document.getElementById('calMonth').textContent = E.MONF[m] + ' ' + y;
      var byDay = {}; events().forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
      var booths = E.booths();
      var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), html = '';
      for (var b = 0; b < first; b++) html += '<div class="day blank" aria-hidden="true"></div>';
      for (var d = 1; d <= days; d++) {
        var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var evs = byDay[ds] || [], cls = 'day';
        if (evs.length) cls += ' has';
        if (ds < todayIso) cls += ' past';
        if (ds === todayIso) cls += ' today';
        if (ds === selected) cls += ' sel';
        if (isSeller && evs.some(function (e) { return booths[e.id]; })) cls += ' booth';
        var dots = evs.slice(0, 3).map(function (e) { return '<i style="background:' + color(e.type) + '"></i>'; }).join('');
        var label = dayLabel(ds) + (evs.length ? ', ' + evs.length + (evs.length === 1 ? ' event' : ' events') : '');
        html += evs.length
          ? '<button type="button" class="' + cls + '" data-d="' + ds + '" aria-label="' + esc(label) + '" aria-pressed="' + (ds === selected) + '"><span>' + d + '</span><div class="dots">' + dots + '</div></button>'
          : '<div class="' + cls + '" aria-label="' + esc(label) + '"><span>' + d + '</span><div class="dots"></div></div>';
      }
      document.getElementById('calGrid').innerHTML = html;
    }

    // ---- List ----
    function evCard(e) {
      var d = E.parse(e.date), past = e.date < todayIso, booth = E.booths()[e.id];
      var acts = '';
      if (!past) {
        acts += goBtn(e);
        acts += '<button type="button" class="btn" data-ics=""' + esc(e.id) + '">' + ICON.cal + 'Add to calendar</button>';
        if (e.place) acts += '<a class="btn" href="' + esc(E.mapsUrl(e)) + '" target="_blank" rel="noopener">' + ICON.pin + 'Directions</a>';
        if (isSeller) acts += '<button type="button" class="btn ' + (booth ? 'navy' : '') + '" data-booth="' + esc(e.id) + '" aria-expanded="' + (openBooth === e.id) + '">' +
          (booth ? 'Your booth · ' + (booth.products || []).length + ' pieces' : 'Book a booth') + '</button>';
        if (isSeller && e.own) acts += '<button type="button" class="btn quiet" data-cancel="' + esc(e.id) + '">Cancel event</button>';
      }
      var panel = '';
      if (isSeller && !past) {
        var picked = (booth && booth.products) || [];
        panel = '<div class="booth' + (openBooth === e.id ? ' open' : '') + '" data-panel="' + esc(e.id) + '"><div><div class="booth-in">' +
          '<div class="booth-t">Your booth at ' + esc(e.title) + '</div>' +
          '<div class="booth-l">Pick the pieces you’ll bring to sell there.</div>' +
          (products.length
            ? '<div class="chips">' + products.map(function (n) { var on = picked.indexOf(n) !== -1; return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-prod="' + esc(n) + '" aria-pressed="' + on + '">' + esc(n) + '</button>'; }).join('') + '</div>'
            : '<div class="booth-l" style="margin-top:12px">No pieces yet — list an item first, then come back to pick it.</div>') +
          '<div class="acts"><button type="button" class="btn solid" data-save="' + esc(e.id) + '">' + (booth ? 'Update booth' : 'Reserve booth') + '</button>' +
          (booth ? '<button type="button" class="btn quiet" data-unbook="' + esc(e.id) + '">Remove booth</button>' : '') + '</div>' +
        '</div></div></div>';
      }
      return '<article class="ev' + (past ? ' past' : '') + '">' +
        '<div class="ev-date"><b>' + d.getDate() + '</b><span>' + E.MON[d.getMonth()] + '</span><span>' + E.DOW[d.getDay()] + '</span></div>' +
        '<div>' +
          '<div class="ev-type">' + typeMark(e.type) + '</div>' +
          '<h3 class="ev-title"><a href="event.html?id=' + encodeURIComponent(e.id) + '">' + esc(e.title) + '</a></h3>' +
          '<div class="ev-meta">' + (e.time ? esc(e.time) : 'All day') + (e.place ? ' · ' + esc(e.place) : '') + (e.own ? ' · Hosted by you' : '') + '</div>' +
          (e.blurb ? '<p class="ev-blurb">' + esc(e.blurb) + '</p>' : '') +
          (past ? '' : goingLine(e)) + who(e) +
          (acts ? '<div class="acts">' + acts + '</div>' : '') +
          panel +
        '</div>' +
      '</article>';
    }
    function renderList() {
      var title = document.getElementById('listTitle'), count = document.getElementById('listCount'), list = document.getElementById('list');
      var head = function (t, n) { title.innerHTML = t; count.textContent = n + (n === 1 ? ' event' : ' events'); };
      if (selected) {
        var day = events().filter(function (e) { return e.date === selected; });
        head(esc(dayLabel(selected)) + ' <button type="button" class="clear" id="clearDay" style="margin-left:10px">Show all</button>', day.length);
        list.innerHTML = day.length ? day.map(evCard).join('') : '<p class="empty">Nothing on this day.</p>';
        return;
      }
      var y = view.getFullYear(), m = view.getMonth();
      var inMonth = events().filter(function (e) { var d = E.parse(e.date); return d.getFullYear() === y && d.getMonth() === m; });
      var up = inMonth.filter(function (e) { return e.date >= todayIso; }), past = inMonth.filter(function (e) { return e.date < todayIso; }).reverse();
      var thisMonth = y === E.today().getFullYear() && m === E.today().getMonth();
      head(thisMonth ? 'This month' : E.MONF[m] + ' ' + y, inMonth.length);
      list.innerHTML = (up.length ? up.map(evCard).join('') : (past.length ? '' : '<p class="empty">Nothing planned this month yet.</p>')) +
        (past.length ? '<p class="k sub">Earlier this month</p>' + past.map(evCard).join('') : '');
    }

    function refresh() { renderNext(); renderFilters(); renderCal(); renderList(); }

    // ---- Interaction ----
    document.getElementById('filters').addEventListener('click', function (e) {
      var b = e.target.closest('[data-kind]'); if (!b) return;
      kind = b.getAttribute('data-kind'); refresh();
    });
    document.getElementById('calGrid').addEventListener('click', function (e) {
      var c = e.target.closest('.day.has'); if (!c) return;
      var ds = c.getAttribute('data-d'); selected = selected === ds ? null : ds; refresh();
    });
    document.getElementById('prev').addEventListener('click', function () { view.setMonth(view.getMonth() - 1); selected = null; refresh(); });
    document.getElementById('next-m').addEventListener('click', function () { view.setMonth(view.getMonth() + 1); selected = null; refresh(); });
    document.getElementById('todayBtn').addEventListener('click', function () { view = new Date(E.today().getFullYear(), E.today().getMonth(), 1); selected = null; refresh(); });

    document.addEventListener('click', function (e) {
      var t;
      if ((t = e.target.closest('#clearDay'))) { selected = null; refresh(); return; }
      if ((t = e.target.closest('[data-going]'))) { var gid = t.getAttribute('data-going'); E.setGoing(gid, !E.isGoing(gid)); refresh(); return; }
      if ((t = e.target.closest('[data-ics]'))) { var ev = E.byId(t.getAttribute('data-ics')); if (ev) E.downloadIcs(ev); return; }
      if ((t = e.target.closest('[data-booth]'))) {
        var id = t.getAttribute('data-booth'); openBooth = openBooth === id ? null : id;
        document.querySelectorAll('.booth').forEach(function (p) { p.classList.toggle('open', p.getAttribute('data-panel') === openBooth); });
        document.querySelectorAll('[data-booth]').forEach(function (bt) { bt.setAttribute('aria-expanded', bt.getAttribute('data-booth') === openBooth); });
        return;
      }
      if ((t = e.target.closest('.booth .chip'))) { t.classList.toggle('on'); t.setAttribute('aria-pressed', t.classList.contains('on')); return; }
      if ((t = e.target.closest('[data-save]'))) {
        var sid = t.getAttribute('data-save'), panel = t.closest('.booth'), ev2 = E.byId(sid) || {};
        var chosen = [].map.call(panel.querySelectorAll('.chip.on'), function (c) { return c.getAttribute('data-prod'); });
        E.setBooth(sid, { title: ev2.title, date: ev2.date, place: ev2.place, type: ev2.type, time: ev2.time, products: chosen });
        openBooth = null; refresh(); return;
      }
      if ((t = e.target.closest('[data-unbook]'))) { E.setBooth(t.getAttribute('data-unbook'), null); openBooth = null; refresh(); return; }
      if ((t = e.target.closest('[data-cancel]'))) { if (confirm('Cancel this event? It will be removed from the calendar.')) { E.removeHosted(t.getAttribute('data-cancel')); refresh(); } return; }
    });

    // ---- Seller: host an event ----
    if (isSeller) {
      // Hosting is its own step-by-step page (event-host.html), like listing an item;
      // a day chosen on the calendar comes along.
      document.getElementById('host').hidden = false;
      document.getElementById('hostToggle').addEventListener('click', function () {
        if (selected && selected >= todayIso) this.href = 'event-host.html?date=' + selected;
      });
    }

    // ---- The day wheel above Next up ----
    (function dayWheel() {
      var hostEl = document.getElementById('eWheel');
      if (!window.VeroWheelCarousel || !hostEl) return;
      var has = {}; E.all().forEach(function (e) { has[e.date] = 1; });
      var last = E.all().reduce(function (m, e) { return e.date > m ? e.date : m; }, todayIso);
      var days = [], d = E.today();
      for (var i = 0; i < 400 && (i < 90 || E.iso(d) <= last); i++) { days.push(E.iso(d)); d.setDate(d.getDate() + 1); }
      var start = qd && days.indexOf(qd) > -1 ? days.indexOf(qd) : 0;
      wheelDay = days[start];
      VeroWheelCarousel(hostEl, {
        items: days, loop: false, initialIndex: start, label: 'Choose a day',
        orientation: 'horizontal', arc: 'up', apexPx: 70, radius: 250, spacing: 12.5, visibleItems: 4.5, edgeFade: false, dragSpeed: 0.018,
        render: function (ds) {
          var x = E.parse(ds);
          return '<div class="ew-d" aria-label="' + esc(dayLabel(ds)) + (has[ds] ? ', events' : '') + '">' +
            '<small>' + (ds === todayIso ? 'Today' : E.DOW[x.getDay()]) + '</small><b>' + x.getDate() + '</b><small>' + E.MON[x.getMonth()] + '</small>' +
            '<i class="ew-dot' + (has[ds] ? '' : ' none') + '"></i></div>';
        },
        onActiveChange: function (ds) { wheelDay = ds; renderNext(); },
        // A tap on the chosen day opens it in the calendar and the list below.
        onSelectedClick: function (ds) {
          selected = ds; view = new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, 1); refresh();
          document.querySelector('.cal').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    })();

    // ---- Opening: figures, the hero buttons and the tab bar ----
    (function opening() {
      var up = E.upcoming(), m = E.today().getMonth(), y = E.today().getFullYear();
      var thisMonth = up.filter(function (e) { var d = E.parse(e.date); return d.getMonth() === m && d.getFullYear() === y; }).length;
      var sellers = {}; up.forEach(function (e) { E.attendees(e).forEach(function (a) { sellers[a.name] = 1; }); });
      var fig = function (n, l) { return '<div><b>' + n + '</b><span>' + l + '</span></div>'; };
      // The photos behind the title: the next events, one slide each (assets/lumina-hero.js).
      var PICS = ['women-editorial.jpg', 'men-slide.jpg', 'autumn-hero.jpg', 'unisex-slide.jpg', 'women-slide.jpg', 'kids-slide.jpg'];
      var next = up.slice(0, 6);
      if (window.VeroLumina && next.length) {
        VeroLumina(document.getElementById('evhLumina'), {
          mount: document.getElementById('evhSlides'), mono: true, interval: 5000, duration: 2.5,
          slides: next.map(function (e, i) {
            var d = E.parse(e.date), r = Math.round((d - E.today()) / 864e5);
            return { title: e.title, href: 'event.html?id=' + encodeURIComponent(e.id), media: 'assets/hero/' + PICS[i % PICS.length],
              description: (r === 0 ? 'Today' : r === 1 ? 'Tomorrow' : E.DOWF[d.getDay()] + ' ' + d.getDate() + ' ' + E.MON[d.getMonth()]) + (e.time ? ' · ' + e.time : '') + (e.place ? ' · ' + e.place : '') };
          })
        });
      }
      document.getElementById('evhFigs').innerHTML = fig(up.length, 'Coming up') + fig(thisMonth, 'This month') + fig(Object.keys(sellers).length, 'Sellers going');
      if (isSeller) {
        document.getElementById('evhHost').hidden = false; document.getElementById('evhCal').hidden = true;
        document.querySelector('.ev-tab[data-go="host"]').hidden = false;
      }
      var T = { wheel: '#eWheel', cal: '.cal', list: '.list-head', host: '#host' };
      var tabs = document.getElementById('evTabs'), hero = document.getElementById('evHero');
      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-go]'); if (!b) return;
        var el = document.querySelector(T[b.getAttribute('data-go')]);
        if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });
      // Shown once the photo is mostly scrolled past; the active tab follows the section in view.
      function update() {
        tabs.classList.toggle('revealed', hero.getBoundingClientRect().bottom < hero.offsetHeight * 0.45);
        var cur = 'wheel', line = 140;
        ['cal', 'list', 'host'].forEach(function (k) { var el = document.querySelector(T[k]); if (el && !el.closest('[hidden]') && el.getBoundingClientRect().top < line) cur = k; });
        [].forEach.call(tabs.children, function (t) { t.classList.toggle('is-active', t.getAttribute('data-go') === cur); });
      }
      document.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    refresh();
    if (qd) setTimeout(function () { document.querySelector('.cal').scrollIntoView({ block: 'start' }); }, 50);
  })();
  </script>
  <script src="assets/line-icons.js"></script>
</body>
</html>
