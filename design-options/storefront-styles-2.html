<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront Styles 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Syne:wght@600;800&family=Poppins:wght@300;500;700&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@500;700&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --muted: #8a877f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Inter', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; font-family: 'Aharoni CLM', sans-serif; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 284px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.swr { display: flex; gap: 5px; margin-top: 8px; direction: ltr; justify-content: flex-end; }
.swr i { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }

.phone { width: 284px; height: 740px; border-radius: 30px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.16); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 1040px; transform: scale(0.7); transform-origin: 0 0; position: relative; overflow: hidden; }
.th { display: block; background: #ddd center / cover no-repeat; }
.money { font-variant-numeric: tabular-nums; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 60px; padding: 28px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 1px; z-index: 6; }

/* ===== T1 · Color block split ===== */
.t1 { background: #f24d2e; color: #fff; font-family: 'Syne', sans-serif; }
.t1 .top { color: #fff; }
.t1 .head { padding: 70px 24px 0; }
.t1 .head .nm { font-weight: 800; font-size: 56px; line-height: 0.9; letter-spacing: -1px; }
.t1 .head .bio { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px; margin-top: 12px; max-width: 70%; }
.t1 .heroimg { height: 300px; margin: 22px 0 0; position: relative; }
.t1 .heroimg .th { position: absolute; inset: 0; }
.t1 .heroimg .fol { position: absolute; left: 24px; bottom: 18px; background: #fff; color: #f24d2e; font-weight: 700; font-size: 12px; padding: 12px 22px; border-radius: 999px; }
.t1 .circs { display: flex; gap: 14px; padding: 24px 24px 0; overflow: hidden; }
.t1 .circ { text-align: center; flex: none; }
.t1 .circ .th { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #fff; }
.t1 .circ span { display: block; font-family: 'Inter', sans-serif; font-size: 11px; margin-top: 8px; }
.t1 .circ b { display: block; font-size: 13px; }

/* ===== T2 · Brutalist ===== */
.t2 { background: #f3f3ec; color: #111; font-family: 'Space Mono', monospace; }
.t2 .top { color: #111; }
.t2 .box { border: 2.5px solid #111; margin: 62px 16px 0; }
.t2 .box .th { height: 230px; border-bottom: 2.5px solid #111; filter: grayscale(1); }
.t2 .box .nm { font-size: 30px; font-weight: 700; padding: 12px 14px 2px; text-transform: uppercase; }
.t2 .box .bio { font-size: 11px; padding: 0 14px 12px; }
.t2 .box .bar { border-top: 2.5px solid #111; display: flex; }
.t2 .box .bar div { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; border-left: 2.5px solid #111; }
.t2 .box .bar div:first-child { border-left: none; }
.t2 .box .bar .fol { background: #d6fb3d; }
.t2 .g { display: grid; grid-template-columns: 1fr 1fr; margin: 16px; border: 2.5px solid #111; border-bottom: none; }
.t2 .c { border-bottom: 2.5px solid #111; border-left: 2.5px solid #111; padding: 0; }
.t2 .c:nth-child(odd) { border-left: none; }
.t2 .c .th { aspect-ratio: 1/1; filter: grayscale(1); border-bottom: 2.5px solid #111; }
.t2 .c .l { display: flex; justify-content: space-between; font-size: 10px; padding: 7px 9px; }

/* ===== T3 · Soft bubbly ===== */
.t3 { background: radial-gradient(120% 60% at 50% 0%, #ffe0ec, #e7ecff 60%, #eafbf3); color: #3a2f52; font-family: 'Poppins', sans-serif; }
.t3 .top { color: #3a2f52; }
.t3 .blob { margin: 60px auto 0; width: 300px; height: 300px; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; overflow: hidden; box-shadow: 0 18px 40px rgba(180,120,200,0.25); }
.t3 .blob .th { width: 100%; height: 100%; }
.t3 .nm { text-align: center; font-weight: 700; font-size: 34px; margin-top: 18px; }
.t3 .bio { text-align: center; font-weight: 300; font-size: 13px; margin-top: 2px; }
.t3 .fol { display: block; width: 160px; margin: 16px auto 0; background: #3a2f52; color: #fff; border-radius: 999px; text-align: center; padding: 13px; font-weight: 500; font-size: 13px; }
.t3 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 24px 22px 0; }
.t3 .c { background: rgba(255,255,255,0.65); border-radius: 26px; padding: 10px; }
.t3 .c .th { aspect-ratio: 1/1; border-radius: 20px; }
.t3 .c .l { display: flex; justify-content: space-between; align-items: center; padding: 10px 6px 2px; font-size: 13px; font-weight: 500; }
.t3 .c .l span:last-child { background: #fff; border-radius: 999px; padding: 3px 10px; }

/* ===== T4 · Fashion magazine columns ===== */
.t4 { background: #fbfaf7; color: #1a1a1a; font-family: 'Fraunces', serif; }
.t4 .top { color: #1a1a1a; font-family: 'Inter', sans-serif; }
.t4 .kicker { text-align: center; font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 5px; text-transform: uppercase; color: #999; padding-top: 70px; }
.t4 .nm { text-align: center; font-size: 60px; line-height: 0.9; margin: 10px 0; }
.t4 .nm i { font-style: italic; }
.t4 .rule { border-top: 1px solid #1a1a1a; margin: 6px 24px; }
.t4 .lead { padding: 16px 24px 0; }
.t4 .lead .th { height: 300px; filter: grayscale(0.1); }
.t4 .cols { column-count: 2; column-gap: 16px; padding: 16px 24px 0; font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.6; color: #444; }
.t4 .cols::first-letter { font-family: 'Fraunces', serif; font-size: 44px; float: left; line-height: 0.8; margin: 2px 6px 0 0; }
.t4 .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 24px 0; }
.t4 .two .th { height: 150px; } .t4 .two .cap { font-family: 'Inter', sans-serif; font-size: 11px; margin-top: 6px; display: flex; justify-content: space-between; }

/* ===== T5 · Earthy organic ===== */
.t5 { background: #e9ddc8; color: #4a3b2a; font-family: 'Fraunces', serif; position: relative; }
.t5 .top { color: #4a3b2a; font-family: 'Inter', sans-serif; }
.t5 .blobbg { position: absolute; width: 360px; height: 360px; background: #c06a3f; border-radius: 42% 58% 55% 45% / 55% 42% 58% 45%; top: 120px; left: -40px; opacity: 0.35; }
.t5 .blobbg.b2 { background: #7a8450; top: 560px; left: 160px; width: 300px; height: 300px; opacity: 0.3; }
.t5 .inner { position: relative; z-index: 1; }
.t5 .arch { width: 240px; height: 300px; margin: 70px auto 0; border-radius: 120px 120px 18px 18px; overflow: hidden; box-shadow: 0 14px 30px rgba(74,59,42,0.22); }
.t5 .arch .th { width: 100%; height: 100%; filter: sepia(0.3); }
.t5 .nm { text-align: center; font-size: 36px; margin-top: 18px; }
.t5 .bio { text-align: center; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13px; margin-top: 2px; color: #6b5844; }
.t5 .fol { display: block; width: 150px; margin: 14px auto 0; border: 1.5px solid #4a3b2a; border-radius: 999px; text-align: center; padding: 12px; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
.t5 .g { display: flex; gap: 14px; padding: 26px 22px 0; overflow: hidden; }
.t5 .c { flex: none; width: 128px; }
.t5 .c .th { height: 160px; border-radius: 64px 64px 10px 10px; filter: sepia(0.3); }
.t5 .c .l { font-family: 'Inter', sans-serif; font-size: 12px; text-align: center; margin-top: 8px; } .t5 .c .l span { display: block; color: #8c7560; font-size: 11px; }

/* ===== T6 · Tech neon dark ===== */
.t6 { background: #0b0f10; color: #e7fff6; font-family: 'Space Grotesk', sans-serif; background-image: linear-gradient(rgba(60,255,200,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(60,255,200,0.05) 1px, transparent 1px); background-size: 28px 28px; }
.t6 .top { color: #6afcd0; font-family: 'Space Mono', monospace; }
.t6 .hd { padding: 70px 22px 0; }
.t6 .tagn { font-family: 'Space Mono', monospace; font-size: 10px; color: #6afcd0; letter-spacing: 1px; }
.t6 .nm { font-weight: 700; font-size: 44px; line-height: 0.95; margin: 6px 0 10px; }
.t6 .nm b { color: #6afcd0; }
.t6 .bio { font-size: 13px; color: #9fb8b0; }
.t6 .fol { display: inline-block; margin-top: 14px; border: 1px solid #6afcd0; color: #6afcd0; padding: 10px 20px; font-family: 'Space Mono', monospace; font-size: 11px; }
.t6 .heroimg { height: 210px; margin: 20px 22px 0; position: relative; border: 1px solid rgba(106,252,208,0.4); }
.t6 .heroimg .th { position: absolute; inset: 0; filter: grayscale(1) brightness(0.8) contrast(1.1); mix-blend-mode: luminosity; }
.t6 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 18px 22px 0; }
.t6 .c { border: 1px solid rgba(106,252,208,0.25); }
.t6 .c .th { aspect-ratio: 1/1; filter: grayscale(1) brightness(0.85); }
.t6 .c .l { font-family: 'Space Mono', monospace; font-size: 10px; padding: 7px 8px; display: flex; justify-content: space-between; } .t6 .c .l span:last-child { color: #6afcd0; }

/* ===== T7 · 70s retro ===== */
.t7 { background: #efb54b; color: #3b2415; font-family: 'Syne', sans-serif; }
.t7 .top { color: #3b2415; }
.t7 .head { text-align: center; padding: 66px 24px 0; }
.t7 .head .nm { font-weight: 800; font-size: 48px; line-height: 0.92; text-transform: uppercase; color: #b5432a; }
.t7 .head .bio { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13px; margin-top: 8px; }
.t7 .heroimg { height: 260px; margin: 18px 20px 0; border-radius: 120px; overflow: hidden; border: 4px solid #3b2415; }
.t7 .heroimg .th { width: 100%; height: 100%; filter: sepia(0.4) saturate(1.3); }
.t7 .wave { height: 22px; background: radial-gradient(circle at 10px -4px, transparent 12px, #b5432a 13px) repeat-x; background-size: 24px 22px; margin-top: 18px; }
.t7 .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 20px 0; background: #b5432a; }
.t7 .g { padding-top: 18px; padding-bottom: 18px; }
.t7 .c { background: #efb54b; border-radius: 22px; padding: 8px; }
.t7 .c .th { aspect-ratio: 1/1; border-radius: 16px; filter: sepia(0.3); }
.t7 .c .l { display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; padding: 8px 4px 2px; }

/* ===== T8 · Collage / zine ===== */
.t8 { background: #f0ece3; color: #1a1a1a; font-family: 'Inter', sans-serif; background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 4px 4px; }
.t8 .top { color: #1a1a1a; }
.t8 .tapephoto { position: absolute; box-shadow: 0 8px 18px rgba(0,0,0,0.16); }
.t8 .tapephoto .th { width: 100%; height: 100%; filter: contrast(1.05); }
.t8 .tape { position: absolute; width: 56px; height: 20px; background: rgba(230,215,120,0.6); left: 50%; margin-left: -28px; top: -8px; transform: rotate(-4deg); }
.t8 .p1 { left: 24px; top: 80px; width: 180px; height: 220px; background: #fff; padding: 8px 8px 24px; transform: rotate(-4deg); }
.t8 .p2 { right: 20px; top: 190px; width: 130px; height: 160px; background: #fff; padding: 6px 6px 20px; transform: rotate(5deg); }
.t8 .nm { position: absolute; left: 22px; top: 330px; font-family: 'DM Serif Display', serif; font-size: 50px; line-height: 0.9; z-index: 2; }
.t8 .nm i { font-style: italic; color: #e0502f; }
.t8 .scr { position: absolute; left: 30px; top: 420px; font-family: 'Caveat', cursive; font-size: 26px; transform: rotate(-3deg); color: #2a52be; z-index: 2; }
.t8 .sticker { position: absolute; right: 26px; top: 380px; width: 72px; height: 72px; border-radius: 50%; background: #ffd23f; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 11px; transform: rotate(12deg); line-height: 1.1; z-index: 2; }
.t8 .g { position: absolute; left: 20px; right: 20px; top: 500px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.t8 .g .c { background: #fff; padding: 5px 5px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
.t8 .g .c:nth-child(1) { transform: rotate(-3deg); } .t8 .g .c:nth-child(2) { transform: rotate(2deg); } .t8 .g .c:nth-child(3) { transform: rotate(-2deg); }
.t8 .g .c .th { aspect-ratio: 1/1.1; }
.t8 .g .c .cap { font-family: 'Caveat', cursive; font-size: 15px; text-align: center; margin-top: 2px; }
.t8 .fol { position: absolute; left: 20px; bottom: 70px; background: #1a1a1a; color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 12px; font-weight: 600; z-index: 2; transform: rotate(-2deg); }
</style>
</head>
<body>
<h1>Storefront — צורות, צבעים ומבנים נוספים</h1>
<p class="sub">8 כיוונים חדשים, שונים מהקודמים · כל אחד עם מבנה, צורות וצבעים משלו</p>

<div class="grid" id="opts"></div>

<script>
var IMG = {
  men: '../men-hero.jpg', women: '../women-hero.jpg', cloth: '../clothing-hero.jpg',
  beach: '../hero-beach.jpg', gal: '../gallery-hero.jpg', mag: '../magazine-hero.jpg', art: '../art-hero.jpg'
};
var th = (src, pos) => '<span class="th" style="background-image:url(\'' + src + '\');background-position:' + (pos || '50% 40%') + '"></span>';
var MENU = '✦';

var OPTS = [
  ['T1 · בלוק צבע', 'חצי עליון בצבע מלא עם שם ענק, חצי תחתון תמונה, ומוצרים כעיגולים. נועז וצבעוני.', ['#f24d2e', '#fff', '#111'],
   '<div class="screen t1"><div class="top"><span>MENU</span><span>♥ · ⌕</span></div>' +
   '<div class="head"><div class="nm">Studio<br>Vero</div><div class="bio">Slow fashion, sourced in Tel Aviv.</div></div>' +
   '<div class="heroimg">' + th(IMG.women, '30% 30%') + '<span class="fol">Follow +</span></div>' +
   '<div class="circs">' + [['Coats', 380, IMG.men], ['Shirts', 120, IMG.cloth], ['Bags', 240, IMG.gal], ['Shoes', 90, IMG.beach]].map(c => '<div class="circ">' + th(c[2]) + '<span>' + c[0] + '</span><b>₪' + c[1] + '</b></div>').join('') + '</div></div>'],

  ['T2 · ברוטליסט', 'מסגרות שחורות עבות, פונט מכונת כתיבה, גריד עם קווים חדים והדגשה אחת זוהרת. גולמי ונקי.', ['#f3f3ec', '#111', '#d6fb3d'],
   '<div class="screen t2"><div class="top"><span>[MENU]</span><span>[♥] [⌕]</span></div>' +
   '<div class="box">' + th(IMG.cloth) + '<div class="nm">Studio Vero</div><div class="bio">// slow fashion, tel aviv</div>' +
   '<div class="bar"><div>1.2K FLW</div><div>42 ITEMS</div><div class="fol">+ FOLLOW</div></div></div>' +
   '<div class="g">' + [['WOOL COAT', 380, IMG.men], ['LINEN', 120, IMG.women], ['BAG', 240, IMG.beach], ['SCARF', 90, IMG.gal]].map(c => '<div class="c">' + th(c[2]) + '<div class="l"><span>' + c[0] + '</span><span>₪' + c[1] + '</span></div></div>').join('') + '</div></div>'],

  ['T3 · רך ובועתי', 'גרדיאנט פסטל, צורת בלוב לתמונה, וכרטיסים מאוד מעוגלים. נעים, צעיר ומזמין.', ['#ffe0ec', '#e7ecff', '#3a2f52'],
   '<div class="screen t3"><div class="top"><span>☰</span><span>♡ ⌕</span></div>' +
   '<div class="blob">' + th(IMG.women, '30% 30%') + '</div><div class="nm">Studio Vero</div><div class="bio">slow fashion · tel aviv ✿</div><span class="fol">Follow</span>' +
   '<div class="g">' + [['Wool Coat', 380, IMG.men], ['Linen Shirt', 120, IMG.cloth], ['Leather Bag', 240, IMG.beach], ['Silk Scarf', 90, IMG.gal]].map(c => '<div class="c">' + th(c[2]) + '<div class="l"><span>' + c[0] + '</span><span>₪' + c[1] + '</span></div></div>').join('') + '</div></div>'],

  ['T4 · מגזין אופנה', 'שער עם שם ענק בסריף, כתבה ראשית וטקסט בשתי עמודות עם אות פתיחה. הכי "מודפס".', ['#fbfaf7', '#1a1a1a', '#999'],
   '<div class="screen t4"><div class="top"><span>Menu</span><span>Search</span></div>' +
   '<div class="kicker">The shop of</div><div class="nm">Studio <i>Vero</i></div><div class="rule"></div>' +
   '<div class="lead">' + th(IMG.women, '30% 35%') + '</div>' +
   '<div class="cols">Sourced across Europe and mended by hand, each piece is chosen to last a decade longer. A quiet wardrobe of coats, knitwear and the odd perfect shirt.</div>' +
   '<div class="two">' + [['Wool Coat', 380, IMG.men], ['Leather Bag', 240, IMG.gal]].map(c => '<div>' + th(c[2]) + '<div class="cap"><span>' + c[0] + '</span><span>₪' + c[1] + '</span></div></div>').join('') + '</div></div>'],

  ['T5 · אורגני / אדמה', 'גווני טרקוטה וזית, צורות בלוב ברקע, ותמונות בצורת קשת. חמים וטבעי.', ['#e9ddc8', '#c06a3f', '#7a8450'],
   '<div class="screen t5"><span class="blobbg"></span><span class="blobbg b2"></span><div class="top"><span>☰</span><span>♡ ⌕</span></div>' +
   '<div class="inner"><div class="arch">' + th(IMG.beach, '50% 40%') + '</div><div class="nm">Atelier Nord</div><div class="bio">hand-picked · mended with care</div><span class="fol">Follow</span>' +
   '<div class="g">' + [['Wool Coat', 380, IMG.men], ['Linen', 120, IMG.women], ['Bag', 240, IMG.cloth]].map(c => '<div class="c">' + th(c[2]) + '<div class="l">' + c[0] + '<span>₪' + c[1] + '</span></div></div>').join('') + '</div></div></div>'],

  ['T6 · טק / ניאון', 'כמעט שחור עם רשת וניאון טורקיז, פונט מונוספייס ותוויות כמו קוד. אורבני וטכנולוגי.', ['#0b0f10', '#6afcd0', '#9fb8b0'],
   '<div class="screen t6"><div class="top"><span>// menu</span><span>[♥][⌕]</span></div>' +
   '<div class="hd"><div class="tagn">seller_id: 0x42 · online</div><div class="nm">DENIM<br><b>LAB</b>_</div><div class="bio">drops every friday · 03:00 GMT</div><span class="fol">+ follow</span></div>' +
   '<div class="heroimg">' + th(IMG.gal) + '</div>' +
   '<div class="g">' + [['WOOL_COAT', 380, IMG.men], ['LINEN_SH', 120, IMG.women], ['BAG_01', 240, IMG.cloth], ['SCARF_X', 90, IMG.beach]].map(c => '<div class="c">' + th(c[2]) + '<div class="l"><span>' + c[0] + '</span><span>₪' + c[1] + '</span></div></div>').join('') + '</div></div>'],

  ['T7 · רטרו 70s', 'חרדל, חלודה וקרם, קשתות מעוגלות וגל דקורטיבי. משחק ונוסטלגי.', ['#efb54b', '#b5432a', '#3b2415'],
   '<div class="screen t7"><div class="top"><span>☰</span><span>♥ ⌕</span></div>' +
