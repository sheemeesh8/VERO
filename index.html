<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Fashion & Art Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: white;
            direction: rtl;
            letter-spacing: 0px;
            color: #000;
            padding-top: 70px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: none;
            padding: 16px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
            gap: 40px;
        }

        .header-left {
            display: flex;
            gap: 30px;
            align-items: center;
            flex: 1;
        }

        .header-left > a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .header-left > a:hover {
            opacity: 0.7;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            color: white;
            font-style: normal;
            text-transform: uppercase;
            min-width: 80px;
            flex: 1;
            text-align: center;
        }

        .search-container {
            display: none;
        }

        .search-input {
            display: none;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
        }

        .toggle-category {
            display: flex;
            gap: 8px;
            align-items: center;
            background: transparent;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .toggle-category.clothing {
            color: white;
        }

        .toggle-category.art {
            color: white;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #000;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 18px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            position: relative;
            width: 80px;
            height: 43px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 21.5px;
            padding: 3px;
            cursor: pointer;
            border: 2px solid white;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .toggle-circle {
            position: absolute;
            width: 37px;
            height: 37px;
            background: #2196F3;
            border-radius: 50%;
            transition: left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            left: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            z-index: 1;
        }

        .toggle-switch.active-clothing .toggle-circle {
            left: 3px;
        }

        .toggle-switch.active-art .toggle-circle {
            left: 40px;
        }

        .toggle-btn {
            display: none;
        }

        .toggle-btn.active {
            display: none;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .hero {
            width: 100vw;
            aspect-ratio: 2 / 1;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            color: rgba(255, 255, 255, 0.1);
            margin: 0;
            padding: 0;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -24px;
            padding-top: 50px;
        }

        /* ==================== GRID ==================== */
        .grid-section {
            width: 100vw;
            box-sizing: border-box;
            padding: 30px 20px 30px 20px;
            display: grid;
            grid-template-columns: 0.45fr 0.45fr 0.45fr 2.65fr;
            gap: 16px;
            height: 780px;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        .grid-item {
            background: #f8f8f8;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: rgba(0, 66, 37, 0.08);
        }

        /* Primary filter cards (women / men / kids, or art segments). */
        .filter-card {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .filter-card:hover {
            transform: translateY(-4px);
        }

        .filter-card .category-image {
            transition: transform 0.5s;
        }

        .filter-card:hover .category-image {
            transform: scale(1.05);
        }

        .filter-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 32px;
            z-index: 2;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 45%);
        }

        .filter-label span {
            color: #fff;
            font-size: 51px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            text-align: center;
            padding: 0 12px;
        }

        .filter-card.active {
            outline: 4px solid #004225;
            outline-offset: -4px;
        }

        .filter-card.active .filter-label span {
            text-decoration: underline;
            text-underline-offset: 6px;
        }

        .magazine-card {
            position: relative;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
        }

        .magazine-card .filter-label span {
            font-size: 40px;
            letter-spacing: 3px;
        }

        /* ==================== CATEGORIES ==================== */
        .categories-section {
            padding: 40px 0;
            background: white;
            border-top: 1px solid #eee;
            margin-top: 0;
            position: relative;
        }

        .section-title {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #000;
            display: none;
        }

        .categories-wrapper {
            position: relative;
        }

        .categories-grid {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            overflow: hidden;
            box-sizing: border-box;
        }

        .categories-track {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 0 60px;
            scrollbar-width: none;
        }

        .categories-track::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            flex: 0 0 auto;
            width: 300px;
            max-width: 85vw;
            background: #f8f8f8;
            border: none;
            border-radius: 8px;
            padding: 0;
            display: flex;
            flex-direction: column;
            aspect-ratio: 3 / 4;
            scroll-snap-align: start;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-4px);
            background: #f0f0f0;
        }

        .category-text {
            position: absolute;
            bottom: 16px;
            right: 16px;
            left: 16px;
            padding: 0;
            text-align: right;
            z-index: 2;
        }

        .category-text h3 {
            font-size: 63px;
            font-weight: 800;
            margin-bottom: 0;
            color: #fff;
            letter-spacing: 0px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
        }

        .category-text p {
            font-size: 13px;
            color: #999;
            margin-bottom: 0;
            display: none;
        }

        .category-btn {
            display: none;
        }

        .category-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .category-icon {
            font-size: 140px;
            color: rgba(0, 66, 37, 0.06);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .category-nav:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .category-nav svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
        }

        .category-nav.prev {
            left: 16px;
        }

        .category-nav.next {
            right: 16px;
        }

        /* ==================== FEED ==================== */
        .feed-section {
            padding: 20px 0;
            background: white;
        }

        /* Feed uses the full page width so the 5-up product grid can breathe;
           the 30px horizontal padding matches the grid gap for even edges. */
        .feed-section .container {
            max-width: none;
            padding: 0;
        }

        .feed-block {
            background: white;
            margin-bottom: 30px;
            padding: 20px 65px;
            border-radius: 0;
        }

        .featured-product {
            display: grid;
            grid-template-columns: minmax(0, 850px) minmax(0, 850px);
            justify-content: center;
            gap: 90px;
            align-items: center;
            margin-bottom: 60px;
            padding-bottom: 60px;
        }

        .featured-product.flipped {
            grid-template-columns: 1fr 1fr;
            direction: ltr;
        }

        .featured-product.flipped .featured-image {
            order: -1;
        }

        .featured-text {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .featured-brand {
            font-size: 30px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .featured-text h3 {
            font-size: 123px;
            font-weight: 400;
        }

        .featured-category {
            font-size: 49.5px;
            color: #004225;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .featured-text p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            font-weight: 700;
        }

        .featured-price {
            font-size: 67.5px;
            color: #000;
            font-weight: 700;
        }

        .featured-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 30px 75px;
            font-size: 27px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
        }

        .featured-btn:hover {
            background: #003319;
        }

        .featured-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 340px;
            color: rgba(0, 66, 37, 0.1);
        }

        .products-label {
            font-size: 36px;
            margin: 45px 0 30px 0;
            font-weight: 400;
        }

        /* ==================== PROMO SLIDER (Ferrari-style) ==================== */
        .promo-slider {
            position: relative;
            direction: ltr;
            margin: 40px 0;
            padding: 0;
        }

        .promo-viewport {
            overflow: hidden;
            margin: 0 50px;
        }

        .promo-track {
            display: flex;
            width: 100%;
            transition: transform 0.75s cubic-bezier(0.65, 0.05, 0.1, 1);
        }

        .promo-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;
            padding: 20px 30px;
        }

        .promo-image {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            margin-inline: auto;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 300px;
            color: rgba(0, 66, 37, 0.12);
        }

        .promo-text {
            direction: rtl;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 33px;
            padding: 0 20px;
        }

        .promo-title {
            font-size: 78px;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.12;
            letter-spacing: 0.5px;
            color: #111;
            margin: 0;
        }

        .promo-desc {
            font-size: 31.5px;
            line-height: 1.65;
            color: #444;
            max-width: 540px;
            margin: 0;
        }

        .promo-readmore {
            display: inline-flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111;
            font-family: 'Segoe UI', sans-serif;
            padding: 0;
            margin-top: 12px;
            font-size: 15px;
        }

        .promo-readmore .circle {
            width: 48px;
            height: 48px;
            border: 1px solid #c4c4c4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: #111;
        }

        .promo-readmore:hover .circle {
            background: #111;
            border-color: #111;
            color: #fff;
        }

        .promo-arrow {
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            z-index: 5;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .promo-arrow:hover {
            opacity: 0.55;
        }

        .promo-arrow svg {
            width: 34px;
            height: 34px;
        }

        .promo-arrow.prev {
            left: 6px;
        }

        .promo-arrow.next {
            right: 6px;
        }

        .promo-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 22px;
        }

        .promo-dots {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .promo-dot {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bdbdbd;
            transition: background 0.3s;
        }

        .promo-dot.active::before {
            background: #d40000;
        }

        .promo-ring {
            position: absolute;
            inset: 0;
            width: 26px;
            height: 26px;
            transform: rotate(-90deg);
            fill: none;
            stroke: #d40000;
            stroke-width: 2;
        }

        .promo-ring circle {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: promoProgress 6s linear forwards;
        }

        @keyframes promoProgress {
            to { stroke-dashoffset: 0; }
        }

        .promo-viewall {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            color: #111;
            cursor: pointer;
        }

        .promo-viewall .line {
            width: 64px;
            height: 1px;
            background: #111;
            display: inline-block;
        }

        @media (max-width: 900px) {
            .promo-slide {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }
            .promo-viewport { margin: 0 50px; }
            .promo-title { font-size: 48px; }
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 45px;
            margin-bottom: 20px;
            margin-left: 60px;
            margin-right: 60px;
        }

        .product-card {
            background: white;
            border: none;
            overflow: hidden;
            transition: transform 0.5s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            transform: scale(1.15);
        }

        .product-card:hover {
            transform: scale(1.15);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #F0F0F0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            top: 18px;
            padding: 0;
        }

        .product-icon:hover {
            transform: scale(1.1);
        }

        .product-icon.cart {
            right: 18px;
        }

        .product-icon.heart {
            right: 84px;
        }

        .product-icon svg {
            width: 33px;
            height: 33px;
            stroke: #1a1a1a;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .product-icon.heart svg {
            fill: none;
        }

        .product-info {
            padding: 18px 18px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 5;
            border-radius: 2px;
        }

        .product-name-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 6px;
        }

        .product-seller {
            font-size: 24.75px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 9px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-name {
            font-size: 31.5px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .product-rating {
            font-size: 16.5px;
            color: #666;
            margin-top: 0;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-label {
            display: none;
        }

        .product-price {
            font-size: 21px;
            color: #000;
            font-weight: 700;
            margin-bottom: 0;
            text-align: left;
            position: static;
        }

        .product-footer {
            display: none;
        }

        .product-btn {
            display: none;
        }

        .product-heart {
            display: none;
        }

        .load-more {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* ==================== ICON BADGES ==================== */
        .icon-wrap {
            position: relative;
            display: inline-flex;
        }

        .badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .badge.show {
            display: flex;
        }

        .product-heart.active {
            background: #fdecea;
            border-color: #c0392b;
        }

        /* ==================== PAGE HERO (full-width, blended with header) ==================== */
        .page-hero {
            width: 100vw;
            margin: 0;
            margin-left: -50vw;
            margin-right: -50vw;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            min-height: 500px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            direction: rtl;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-slash {
            font-size: 48px;
            color: #004225;
            font-weight: 300;

        function priceToNum(p) {
            return parseFloat(String(p).replace(/[^\d.]/g, '')) || 0;

        // Build the product-page URL for any product/cart/wishlist item.
        // Infers art vs clothing from the item's type, or by looking up its category.
        function productPageUrl(item) {
            let type = item.type;
            if (!type) {
                type = artCategories.some(c => c.name === item.category) ? 'art' : 'clothing';
            }
            const data = {
                name: item.name,
                price: item.price,
                icon: item.icon,
                category: item.category,
                seller: item.seller,
                rating: item.rating,
                type: type
            };
            return `product.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        function isWished(id) {
            return wishlist.some(w => w.id === id);

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            cb.textContent = cartCount;
            cb.classList.toggle('show', cartCount > 0);
            wb.textContent = wishlist.length;
            wb.classList.toggle('show', wishlist.length > 0);
        }

        function cartVisible() {
            return document.getElementById('cartView').style.display !== 'none';

        // How long a freshly-added cart item keeps its green frame.
        const RECENT_MS = 5 * 60 * 1000;

        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) {
                existing.qty++;
                existing.addedAt = Date.now();
            } else {
                cart.push({ ...item, qty: 1, addedAt: Date.now() });
            }
            saveState();
            updateBadges();
            showToast(`Added to cart: ${item.name}`);
            if (cartVisible()) renderCartPage();
            // Re-render once the frame expires so it disappears on its own.
            setTimeout(() => { if (cartVisible()) renderCartPage(); }, RECENT_MS + 500);
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

                showToast(`Removed from wishlist: ${item.name}`);
            } else {
                wishlist.push(item);
                if (btn) btn.classList.add('active');
                showToast(`Added to wishlist: ${item.name}`);

            saveState();
            updateBadges();
            document.querySelectorAll(`.product-card[data-id="${CSS.escape(item.id)}"] .product-heart`)

        function renderCartPage() {
            const body = document.getElementById('cartPageBody');

            // 'all' shows one flat grid (5 per row, like the feed); a tab filters by category
            const items = activeCartTab === 'all' ? cart : cart.filter(i => i.category === activeCartTab);
            let html = `<div class="cart-tabs">${tabsHtml}</div>`;
            html += `
                <div class="cart-group">
                    <div class="cart-cards">
                        ${items.map(cartCardHTML).join('')}
                    </div>

            html += `

                    <span>Total to Pay</span>
                    <span class="cart-summary-total">₪${total.toFixed(2)}</span>
                    <button class="cart-checkout-btn" onclick="checkout()">Go to Checkout</button>
                </div>

        // ==================== TOASTS ====================
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        // Second-hand marketplace: each product is a one-off. Once someone claims
        // it (cart or wishlist), it disappears from the feed and can't be
        // claimed again by someone else.
        function addToWishlist(item) {
            if (isWished(item.id)) return;
            wishlist.push(item);
            saveState();
            updateBadges();
            showToast(`Added to wishlist: ${item.name}`);
            if (wishlistVisible()) renderWishlistPage();
        }

        function removeCardFromFeed(card) {
            if (!card.closest('#feedContainer')) return;
            card.style.transition = 'opacity 0.3s, transform 0.3s';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.92)';
            setTimeout(() => card.remove(), 300);
        }

        // ==================== EVENT DELEGATION (product cards & buttons) ====================
        document.addEventListener('click', (e) => {
            // Check if click is on an action button (cart or wishlist)
            const btn = e.target.closest('[data-action]');
            if (btn) {
                e.stopPropagation();
                const card = btn.closest('.product-card');
                if (!card) return;
                const item = {
                    id: card.dataset.id,
                    name: card.dataset.name,
                    price: card.dataset.price,
                    icon: card.dataset.icon,
                    category: card.dataset.category,
                    seller: card.dataset.seller,
                    rating: parseFloat(card.dataset.rating)
                };
                const action = btn.dataset.action;
                if (action === 'cart') {
                    addToCart(item);
                    removeCardFromFeed(card);
                } else if (action === 'wishlist') {
                    addToWishlist(item);
                    removeCardFromFeed(card);
                }
                return;
            }

            // Check if click is on a product card itself (not on buttons)
            const card = e.target.closest('.product-card');
            if (card && !e.target.closest('[data-action]')) {
                e.preventDefault();
                e.stopPropagation();
                if (card.dataset.product) {
                    try {
                        const product = JSON.parse(card.dataset.product);
                        const productUrl = `product.html?product=${encodeURIComponent(JSON.stringify(product))}`;
                        window.location.href = productUrl;
                    } catch (err) {
                        console.error('Error navigating to product:', err);
                    }
                }
            }
        });

        function setCategory(category) {
            const toggleBtn = document.getElementById('categoryToggleBtn');
            const label = document.getElementById('toggleLabel');
            const icon = document.getElementById('toggleIcon');

            toggleBtn.classList.remove('clothing', 'art');
            toggleBtn.classList.add(category);

            if (category === 'clothing') {
                label.textContent = 'CLOTHING';
                icon.textContent = '🔴';
            } else {
                label.textContent = 'ART';
                icon.textContent = '🟢';
            }

            currentCategory = category;

        }

        function toggleCategory(btn, category) {

        // Garment types shown in the clothing slider (art reuses artCategories).
        const clothingSliderCategories = [

        // Render the category slider as an infinite carousel: the list is repeated
        // three times so the arrows can loop endlessly, and we start centred on the
        // middle copy. scrollCategories() recentres invisibly when nearing an edge.
        function renderCategories() {
            const type = currentCategory;
            const list = type === 'clothing' ? clothingSliderCategories : artCategories;
            // Each card shows a matching photo pulled by keyword; the emoji stays as
            // a fallback behind it in case an image fails to load. Clicking a card
            // opens its dedicated category page.
            const cardHTML = (c, i) => `
                <div class="category-card" onclick="openCategory('${type}', ${i})">
                    <img class="category-image" loading="lazy" alt="${c.name}"
                         src="https://loremflickr.com/600/600/${encodeURIComponent(c.img || c.name)}?lock=${i}"
                         onerror="this.remove()">
                    <div class="category-icon">${c.icon}</div>
                    <div class="category-text"><h3>${c.name}</h3></div>
                </div>`;
            const cards = [...list, ...list, ...list]
                .map((c, i) => cardHTML(c, i % list.length))
                .join('');
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = `<div class="categories-track" id="categoriesTrack">${cards}</div>`;
            const track = document.getElementById('categoriesTrack');
            // Start in the middle copy so there is room to loop in both directions.
            track.scrollLeft = track.scrollWidth / 3 * 1.5 * carouselDir(track);
        }

        // Layout direction multiplier (-1 for RTL, where scrollLeft runs negative).
        function carouselDir(track) {
            return getComputedStyle(track).direction === 'rtl' ? -1 : 1;
        }

        // Advance the carousel by one card. dir=1 → "next" (הבא), dir=-1 → "prev".
        function scrollCategories(dir) {
            const track = document.getElementById('categoriesTrack');
            if (!track) return;
            const card = track.querySelector('.category-card');
            const step = card ? card.offsetWidth + 12 : 272;
            const rtl = carouselDir(track);
            const copyW = track.scrollWidth / 3;
            // Recentre onto the middle copy before moving; the copies are identical,
            // so this jump is invisible and keeps the loop endless.
            let sl = track.scrollLeft;
            if (rtl === -1) {
                if (sl < -2 * copyW) sl += copyW;
                else if (sl > -copyW) sl -= copyW;
            } else {
                if (sl > 2 * copyW) sl -= copyW;
                else if (sl < copyW) sl += copyW;
            }
            track.scrollLeft = sl;
            smoothScrollLeft(track, sl + dir * step * rtl);
        }

        // Animate scrollLeft to a target. Assigning scrollLeft directly is the most
        // reliable way to move an RTL container across engines, so we drive the
        // easing ourselves via a timer rather than relying on CSS scroll-behavior
        // (which some engines ignore for negative RTL offsets).
        function smoothScrollLeft(el, target) {
            const start = el.scrollLeft;
            const dist = target - start;
            if (!dist) return;
            if (el._scrollTimer) clearInterval(el._scrollTimer);
            const duration = 300, stepMs = 16, t0 = Date.now();
            el._scrollTimer = setInterval(() => {
                const p = Math.min(1, (Date.now() - t0) / duration);
                const ease = 1 - Math.pow(1 - p, 3);
                el.scrollLeft = start + dist * ease;
                if (p >= 1) { clearInterval(el._scrollTimer); el._scrollTimer = null; }
            }, stepMs);
        }

        // Build a single product card (shared by the home feed and category pages
        // so both render at identical size and form).
        function productCardHTML(prod) {
            const pid = `${prod.name}|${prod.price}`;
            const stars = '★'.repeat(Math.floor(prod.rating)) + (prod.rating % 1 >= 0.5 ? '☆' : '');
            const productData = JSON.stringify({
                name: prod.name,
                price: prod.price,
                icon: prod.icon,
                category: prod.category,
                seller: prod.seller,
                rating: prod.rating,
                type: prod.type || currentCategory
            });
            const productUrl = `product.html?product=${encodeURIComponent(productData)}`;
            return `
                <a href="${productUrl}" style="text-decoration: none;" class="product-card" data-id="${pid}" data-name="${prod.name}" data-price="${prod.price}" data-icon="${prod.icon}" data-category="${prod.category}" data-seller="${prod.seller}" data-rating="${prod.rating}" data-product='${productData}'>
                    <div class="product-image">${prod.icon}
                        <button class="product-icon cart" data-action="cart" title="Add to Cart" onclick="event.preventDefault(); event.stopPropagation();">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                            </svg>
                        </button>
                        <button class="product-icon heart" data-action="wishlist" title="Add to Wishlist" onclick="event.preventDefault(); event.stopPropagation();">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="product-info">
                        <div style="font-size: 12px; color: #999; margin-bottom: 4px;">By Seller</div>
                        <div class="product-seller" style="font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #000; cursor: pointer; text-decoration: underline;" onclick="event.preventDefault(); event.stopPropagation(); showSellerProfile('${prod.seller}');">${prod.seller}</div>
                        <div class="product-rating" style="font-size: 11px; margin-bottom: 6px;">${stars} ${prod.rating}</div>
                        <div class="product-name-price">
                            <div class="product-name">${prod.name}</div>
                            <div class="product-price">${prod.price}</div>
                        </div>
                        <div class="product-footer">
                            <button class="product-btn" data-action="cart" onclick="event.preventDefault(); event.stopPropagation();">Add to Cart</button>
                        </div>
                    </div>
                </a>
            `;
        }

        // Render Feed
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer');
            clearPromoSliders();
            feedContainer.innerHTML = '';
            feedBlocksCount = 0;
            loadMoreFeedBlocks();
        }

        // Load More Feed Blocks
        function loadMoreFeedBlocks() {
            const feedContainer = document.getElementById('feedContainer');

            // Add 2 blocks at a time, max 4 blocks
            const blocksToAdd = Math.min(2, 4 - feedBlocksCount);
            if (blocksToAdd <= 0) return;

            for (let i = 0; i < blocksToAdd; i++) {
                // Source products from the selected primary filter (or the default
                // feed), excluding any already claimed in cart/wishlist.
                const products = feedSource();
                const taken = new Set([
                    ...cart.map(i => i.id),
                    ...wishlist.map(i => i.id)
                ]);
                const available = products.filter(p => !taken.has(`${p.name}|${p.price}`));

                const startIdx = feedBlocksCount * 10;
                const blockProducts = available.slice(startIdx, startIdx + 10);
                if (blockProducts.length === 0) return;

                const block = document.createElement('div');
                block.className = 'feed-block';

                const productsHtml = blockProducts.map(productCardHTML).join('');

                block.innerHTML = `
                    <div class="products-grid">
                        ${productsHtml}
                    </div>
                `;

                // A promo slider precedes every grid (every 2 rows of products).
                // When a filter is active, promote products from that segment.
                const slides = currentSegment
                    ? segmentFeatured(currentCategory, currentSegment)
                    : featuredProducts;
                const slider = createPromoSlider(slides);
                feedContainer.appendChild(slider);
                promoGo(slider.dataset.uid, 0);

                feedContainer.appendChild(block);
                feedBlocksCount++;
            }
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                loadMoreFeedBlocks();
            }
        });

        // ==================== PROMO SLIDER (Ferrari-style, multi-instance) ====================
        const PROMO_INTERVAL = 6000;
        const promoChevron = dir => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="${dir === 'left' ? '15 6 9 12 15 18' : '9 6 15 12 9 18'}"></polyline></svg>`;
        const promoRingSVG = `<svg class="promo-ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"></circle></svg>`;

        // Each slider instance keeps its own index + autoplay timer, keyed by a unique id.
        const promoState = {};
        let promoUidCounter = 0;

        function promoSlideHTML(s) {
            const url = productPageUrl(s);
            return `
                <div class="promo-slide">
                    <a href="${url}" class="promo-image" style="text-decoration: none; color: inherit;">${s.icon}</a>
                    <div class="promo-text">
                        <h2 class="promo-title">${s.name}</h2>
                        <p class="promo-desc">${s.desc}</p>
                        <button class="promo-readmore" onclick="window.location.href='${url}'">
                            Read More <span class="circle">${promoChevron('right')}</span>
                        </button>
                    </div>
                </div>`;
        }

        function promoSliderInner(uid, slides) {
            return `
                <button class="promo-arrow prev" aria-label="Previous" onclick="promoGo('${uid}', promoState['${uid}'].index - 1)">${promoChevron('left')}</button>
                <div class="promo-viewport">
                    <div class="promo-track" id="promoTrack-${uid}">
                        ${slides.map(promoSlideHTML).join('')}
                    </div>
                </div>
                <button class="promo-arrow next" aria-label="Next" onclick="promoGo('${uid}', promoState['${uid}'].index + 1)">${promoChevron('right')}</button>
                <div class="promo-footer">
                    <div class="promo-dots" id="promoDots-${uid}">
                        ${slides.map((s, i) => `<button class="promo-dot" aria-label="Slide ${i + 1}" onclick="promoGo('${uid}', ${i})"></button>`).join('')}
                    </div>
                    <div class="promo-viewall" onclick="showToast('Featured products coming soon ✨')"><span class="line"></span> VIEW ALL</div>
                </div>`;
        }

        // Build a fresh slider element (not yet mounted) and register its state.
        // Pass a custom slide list (e.g. per-category) or default to featuredProducts.
        function createPromoSlider(slides = featuredProducts) {
            const uid = 'p' + (promoUidCounter++);
            const el = document.createElement('div');
            el.className = 'promo-slider';
            el.innerHTML = promoSliderInner(uid, slides);
            promoState[uid] = { index: 0, timer: null, slides };
            el.dataset.uid = uid;
            return el;
        }

        function promoGo(uid, i) {
            const st = promoState[uid];
            const track = document.getElementById('promoTrack-' + uid);
            if (!st || !track) return;
            const n = st.slides.length;
            st.index = (i + n) % n;
            track.style.transform = `translateX(-${st.index * 100}%)`;
            document.querySelectorAll('#promoDots-' + uid + ' .promo-dot').forEach((dot, idx) => {
                const active = idx === st.index;
                dot.classList.toggle('active', active);
                dot.innerHTML = active ? promoRingSVG : '';
            });
            clearInterval(st.timer);
            st.timer = setInterval(() => promoGo(uid, st.index + 1), PROMO_INTERVAL);
        }

        // Stop and forget every slider (called before the feed is rebuilt).
        function clearPromoSliders() {
            Object.values(promoState).forEach(s => clearInterval(s.timer));
            for (const k in promoState) delete promoState[k];
        }

        function openSellerArea() {
            window.location.href = 'seller-area.html';
        }

        function openBuyerArea() {
            window.location.href = 'buyer-area.html';
        }

        // ==================== CATEGORY PAGE ====================
        // Sellers/descriptors used to synthesise varied products per category.
        const catSellers = {
            clothing: ['Zara', 'H&M', 'COS', 'Mango', 'Pull&Bear', 'Levi\'s', 'Bershka', 'Nike', 'Adidas', 'Vero Moda'],
            art: ['Modern Art', 'Classical Art', 'Studio Vero', 'Gallery One', 'Atelier', 'Print House', 'Ceramics', 'Mixed Media', 'Digital Arts', 'Deco Style']
        };
        const catAdjectives = ['Classic', 'Modern', 'Vintage', 'Elegant', 'Luxury', 'Designed', 'Basic', 'Premium', 'Oversized', 'Limited', 'Minimalist', 'Sporty', 'Festive', 'Casual', 'Trendy'];
        const catBrands = {
            clothing: ['Vero Select', 'Urban Edit', 'Signature Line', 'Runway', 'Icon Collection'],
            art: ['Gallery Vero', 'Fine Art', 'Atelier Prime', 'Curated', 'Masters Edition']
        };

        // ==================== PRIMARY FILTER (the four rectangles) ====================
        // The three filter cards per mode, ordered right → middle → left (RTL DOM order).
        // The fourth (magazine) card is rendered separately.
        const filterSegments = {
            clothing: [
                { key: 'men', name: 'Men', img: 'mens,fashion,man' },
                { key: 'kids', name: 'Kids', img: 'kids,children,fashion' },
                { key: 'women', name: 'Women', img: 'womens,fashion,woman' }
            ],
            art: [
                { key: 'paintings', name: 'Paintings', img: 'painting,canvas,art' },
                { key: 'sculptures', name: 'Sculptures', img: 'sculpture,statue,art' },
                { key: 'home', name: 'Design Your Home with VERO', img: 'interior,homedecor,design' }
            ]
        };

        // Garment / art "types" used to synthesise a segment's product feed.
        const artSegmentTypes = {
            paintings: [
                { name: 'Acrylic Painting', icon: '🎨' }, { name: 'Oil Painting', icon: '🖼️' },
                { name: 'Watercolor', icon: '💧' }, { name: 'Abstract Painting', icon: '🌀' },
                { name: 'Digital Illustration', icon: '💻' }, { name: 'Pastel Painting', icon: '🌈' },
                { name: 'Gouache Painting', icon: '🖌️' }, { name: 'Art Print', icon: '📸' }
            ],
            sculptures: [
                { name: 'Stone Sculpture', icon: '🗿' }, { name: 'Metal Sculpture', icon: '⚙️' },
                { name: 'Bronze Sculpture', icon: '🏛️' }, { name: 'Ceramics', icon: '🏺' },
                { name: 'Wood Sculpture', icon: '🪵' }, { name: 'Epoxy Art', icon: '✨' },
                { name: 'Modern Sculpture', icon: '🗿' }
            ],
            home: [
                { name: 'Designed Vase', icon: '🏺' }, { name: 'Decorative Pillow', icon: '🛋️' },
                { name: 'Rug', icon: '🧶' }, { name: 'Design Lamp', icon: '💡' },
                { name: 'Wall Art', icon: '🖼️' }, { name: 'Designer Mirror', icon: '🪞' },
                { name: 'Candle Holder', icon: '🕯️' }, { name: 'Wall Clock', icon: '🕰️' },
                { name: 'Armchair', icon: '🪑' }, { name: 'Decorative Plant', icon: '🪴' }
            ]
        };
        const clothingSegmentSuffix = { men: 'for Men', women: 'for Women', kids: 'for Kids' };

        // Which segment is currently selected (null = default, unfiltered feed).
        let currentSegment = null;

        // Build a large, deterministic product feed for a given segment.
        function buildSegmentProducts(category, segKey) {
            const sellers = catSellers[category];
            let types, suffix = '';
            if (category === 'clothing') {
                types = clothingSliderCategories;
                suffix = clothingSegmentSuffix[segKey] || '';
            } else {
                types = artSegmentTypes[segKey] || [];
            }
            if (!types.length) return [];
            const reps = Math.max(3, Math.ceil(45 / types.length));
            const items = [];
            let n = 0;
            types.forEach((t, ti) => {
                for (let r = 0; r < reps; r++) {
                    const adj = catAdjectives[(ti + r) % catAdjectives.length];
                    const name = category === 'clothing'
                        ? `${t.name} ${adj} ${suffix}`
                        : `${t.name} ${adj}`;
                    items.push({
                        name,
                        category: t.name,
                        price: catPrice(category, n),
                        icon: t.icon,
                        seller: sellers[n % sellers.length],
                        rating: parseFloat((4.4 + ((n * 3) % 6) / 10).toFixed(1)),
                        type: category
                    });
                    n++;
                }
            });
            return items;
        }

        // Promo slides for the active segment (falls back to the generic featured).
        function segmentFeatured(category, segKey) {
            const label = category === 'clothing' ? 'ביגוד' : 'אומנות';
            const brands = catBrands[category];
            const base = buildSegmentProducts(category, segKey).slice(0, 5);
            if (!base.length) return featuredProducts;
            return base.map((p, i) => ({
                brand: brands[i % brands.length],
                name: p.name,
                category: `${p.category} | ${label}`,
                desc: category === 'clothing'
                    ? `${p.name} — Curated item in excellent condition, from leading brands.`
                    : `${p.name} — Selected artwork that will elevate any space in your home.`,
                price: p.price,
                icon: p.icon,
                type: category
            }));
        }

        // The product list that feeds the home feed right now.
        function feedSource() {
            if (currentSegment) return buildSegmentProducts(currentCategory, currentSegment);
            return currentCategory === 'clothing' ? clothingProducts : artProducts;
        }

        // Render the four primary rectangles (3 filters + magazine) for the mode.
        function renderFilters() {
            const grid = document.getElementById('filterGrid');
            if (!grid) return;
            const segs = filterSegments[currentCategory];
            const cards = segs.map((s, i) => `
                <div class="grid-item filter-card${currentSegment === s.key ? ' active' : ''}" onclick="selectSegment('${s.key}')">
                    <img class="category-image" loading="lazy" alt="${s.name}"
                         src="https://loremflickr.com/600/900/${encodeURIComponent(s.img)}?lock=${currentCategory === 'art' ? 300 + i : 400 + i}"
                         onerror="this.remove()">
                    <div class="filter-label"><span>${s.name}</span></div>
                </div>`).join('');
            const magazine = `
                <div class="grid-item magazine-card">
                    <div class="filter-label"><span>${currentCategory === 'art' ? 'Art Magazine' : 'Magazine'}</span></div>
                </div>`;
            grid.innerHTML = cards + magazine;
        }

        // Select (or toggle off) a primary filter; the whole feed follows.
        function selectSegment(key) {
            currentSegment = currentSegment === key ? null : key;
            renderFilters();
            renderFeed();
            document.querySelector('.feed-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Look up a category's icon/keyword by name and type.
        function categoryMeta(catName, type) {
            const src = type === 'clothing' ? clothingSliderCategories : artCategories;
            return src.find(c => c.name === catName) || { icon: '🛍️', img: catName };
        }

        // Deterministic price so a category always renders the same numbers.
        function catPrice(type, i) {
            const base = type === 'clothing' ? 49 : 180;
            return '₪' + (base + ((i * 47) % 420) + 0.9).toFixed(2);
        }

        // Generate `count` products for a category (used for the two product rows).
        // `offset` shifts the generator so each block shows different products.
        function buildCategoryItems(catName, type, count, offset = 0) {
            const meta = categoryMeta(catName, type);
            const sellers = catSellers[type];
            return Array.from({ length: count }, (_, idx) => {
                const i = idx + offset;
                return {
                    name: `${catName} ${catAdjectives[i % catAdjectives.length]}`,
                    category: catName,
                    price: catPrice(type, i),
                    icon: meta.icon,
                    seller: sellers[i % sellers.length],
                    rating: parseFloat((4.4 + ((i * 3) % 6) / 10).toFixed(1)),
                    type
                };
            });
        }

        // Generate the 5 promoted slides for a category's slider.
        // `offset` varies the slides so repeated sliders aren't identical.
        function buildCategoryFeatured(catName, type, offset = 0) {
            const meta = categoryMeta(catName, type);
            const brands = catBrands[type];
            const label = type === 'clothing' ? 'Fashion' : 'Art';
            const descs = type === 'clothing'
                ? [
                    `Quality ${catName} in excellent condition, flattering cut and comfortable fabric.`,
                    `${catName} in contemporary style — perfect blend of comfort and everyday fashion.`,
                    `Selected ${catName} model, from leading brands, at great secondhand prices.`,
                    `Classic ${catName} that never goes out of style, perfect for any wardrobe.`,
                    `Unique ${catName} in limited edition — a true statement piece.`
                ]
                : [
                    `Original ${catName} artwork by a renowned artist, unique collectible item.`,
                    `${catName} handmade, rich colors and stunning texture for any space.`,
                    `Modern ${catName} that brings life to any wall in your home or office.`,
                    `Classic ${catName} in timeless style, framed and ready to hang.`,
                    `Limited edition ${catName} with certificate of authenticity from the artist.`
                ];
            return Array.from({ length: 5 }, (_, i) => ({
                brand: brands[i],
                name: `${catName} ${catAdjectives[(i + offset) % catAdjectives.length]}`,
                category: `${catName} | ${label}`,
                desc: descs[i],
                price: catPrice(type, i + offset + 3),
                icon: meta.icon,
                type
            }));
        }

        // Open a category page from a card click (index within its slider list).
        function openCategory(type, i) {
            const list = type === 'clothing' ? clothingSliderCategories : artCategories;
            const name = (list[i] || {}).name;
            if (!name) return;
            location.href = `?cat=${encodeURIComponent(name)}&type=${type}`;
        }

        // Render a full category page: green hero, then several feed blocks — each a
        // promo slider followed by two rows of five products — all reusing the feed's
        // components so sizes match.
        const CATEGORY_BLOCKS = 4;
        function showCategoryPage(catName, type) {
            document.getElementById('mainView').style.display = 'none';
            const view = document.getElementById('categoryView');
            view.style.display = 'block';
            document.getElementById('catHeroName').textContent = catName;
            document.getElementById('catHeroEyebrow').textContent =
                `${type === 'clothing' ? 'Fashion' : 'Art'} Category`;
            document.title = `${catName} | VERO`;

            const mount = document.getElementById('catFeedContainer');
            mount.innerHTML = '';

            for (let b = 0; b < CATEGORY_BLOCKS; b++) {
                // Promoted slider (5 slides), varied per block.
                const slider = createPromoSlider(buildCategoryFeatured(catName, type, b * 5));
                mount.appendChild(slider);
                promoGo(slider.dataset.uid, 0);

                // Two rows of five products, varied per block.
                const items = buildCategoryItems(catName, type, 10, b * 10);
                const block = document.createElement('div');
                block.className = 'feed-block';
                block.innerHTML = `<div class="products-grid">${items.map(productCardHTML).join('')}</div>`;
                mount.appendChild(block);
            }
        }

        // Initialize — either a single category page (?cat=…) or the home feed.
        const catParams = new URLSearchParams(location.search);
        const catParam = catParams.get('cat');
        if (catParam) {
            showCategoryPage(catParam, catParams.get('type') || 'clothing');
        } else {
            renderFilters();
            renderCategories();
            initializeApp(); // Shows onboarding if needed, then renders feed
        }
        updateBadges();
    </script>
</body>
</html>
