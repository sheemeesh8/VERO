<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Fine Line 2</title>
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --bg: #f6f5f1; --ink: #1c1c1c; --muted: #8a877f; --line: #e2ddd4; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: var(--ink); font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 34px 26px; justify-content: center; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 649px; border-radius: 30px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 18px 40px rgba(0,0,0,0.14); }
.screen { width: 390px; height: 844px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }
/* fine-line primitives */
.money { font-variant-numeric: tabular-nums; }
.thin { stroke-width: 1; fill: none; stroke: currentColor; }
.th { background: #e7e4dd center / cover no-repeat; filter: grayscale(1); }
/* dimmed cart behind a sheet */
.behind { position: absolute; inset: 0; background: var(--bg); }
.behind .bh { padding: 44px 24px 14px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; }
.behind .bg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 24px; }
.behind .bc { aspect-ratio: 3/4; }
.scrim { position: absolute; inset: 0; background: rgba(246,245,241,0.72); }

/* row — hairline rule, no box */
.row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row .th { width: 42px; height: 54px; flex: none; }
.row .nm { flex: 1; min-width: 0; } .row .nm b { font-weight: 400; font-size: 14px; display: block; letter-spacing: 0.3px; }
.row .nm small { color: var(--muted); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.row .pr { font-size: 14px; }
.sums { padding: 16px 0 2px; } .sums p { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 9px; letter-spacing: 0.3px; }
.sums p.t { color: var(--ink); font-size: 16px; letter-spacing: 1px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line); text-transform: uppercase; }
.sums p.t b { font-weight: 400; font-size: 20px; }
/* fine-line button: thin outline, uppercase */
.cta { display: block; text-align: center; background: transparent; color: var(--ink); border: 1px solid var(--ink);
  padding: 16px; margin-top: 20px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }

/* G — vertical stepper */
.g .top { padding: 46px 26px 10px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
.g .steps { padding: 6px 26px; }
.g .step { display: flex; gap: 16px; }
.g .dot { flex: none; display: flex; flex-direction: column; align-items: center; }
.g .dot i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-style: normal; font-size: 9px; }
.g .step.done .dot i { background: var(--ink); color: #fff; }
.g .step.now .dot i { box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
.g .line { width: 1px; flex: 1; background: var(--line); margin: 4px 0; }
.g .step:last-child .line { display: none; }
.g .body { flex: 1; padding-bottom: 18px; }
.g .st { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.g .step.now .st, .g .step.done .st { color: var(--ink); }
.g .st2 { font-size: 13px; margin-top: 7px; }
.g .mini { display: flex; gap: 8px; margin-top: 10px; } .g .mini div { width: 36px; height: 46px; } .g .mini .th { }
.g .bar { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--ink); padding: 16px 26px 30px; display: flex; align-items: center; }
.g .bar div { flex: 1; } .g .bar .k { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; } .g .bar b { font-size: 20px; font-weight: 400; }
.g .bar span { border: 1px solid var(--ink); padding: 14px 22px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* H — big-number editorial, numbered items */
.h .top { padding: 48px 26px 4px; font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--muted); }
.h .big { padding: 0 26px; font-size: 72px; font-weight: 400; letter-spacing: -1px; line-height: 1; }
.h .cap { padding: 8px 26px 20px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--ink); margin: 0 0 6px; }
.h .nr { display: flex; align-items: baseline; gap: 14px; padding: 15px 26px; border-bottom: 1px solid var(--line); }
.h .nr em { font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 1px; width: 22px; }
.h .nr .nm { flex: 1; } .h .nr .nm b { font-weight: 400; font-size: 15px; display: block; } .h .nr .nm small { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.h .nr .pr { font-size: 14px; }
.h .cta { position: absolute; left: 26px; right: 26px; bottom: 30px; margin: 0; }

/* I — itemised summary emphasis */
.i2 .top { padding: 46px 26px 16px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
.i2 .wrap2 { padding: 0 26px; }
.i2 .box { border: 1px solid var(--ink); padding: 20px 18px; margin-top: 8px; }
.i2 .box h4 { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.i2 .box p { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 11px; }
.i2 .box p span:last-child { color: var(--ink); }
.i2 .box p.t { font-size: 18px; color: var(--ink); margin: 6px 0 0; padding-top: 14px; border-top: 1px solid var(--ink); text-transform: uppercase; letter-spacing: 1px; }
.i2 .cta { position: absolute; left: 26px; right: 26px; bottom: 30px; margin: 0; }

/* J — slide to confirm */
.j2 .top { padding: 46px 26px 16px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
.j2 .wrap2 { padding: 0 26px; }
.j2 .sums { padding: 18px 0 2px; } .j2 .sums p { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 9px; }
.j2 .sums p.t { color: var(--ink); font-size: 18px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--ink); text-transform: uppercase; letter-spacing: 1px; }
.j2 .slide { position: absolute; left: 26px; right: 26px; bottom: 30px; height: 56px; border: 1px solid var(--ink); border-radius: 40px; display: flex; align-items: center; }
.j2 .slide .knob { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; margin: -1px; }
.j2 .slide .knob svg { width: 20px; height: 20px; }
.j2 .slide span { flex: 1; text-align: center; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }

/* K — hero image + order peek */
.k2 .hero { position: absolute; inset: 0 0 300px 0; background: #ddd center/cover no-repeat; filter: grayscale(1); }
.k2 .htag { position: absolute; top: 46px; left: 26px; right: 26px; display: flex; justify-content: space-between; color: #fff; z-index: 2; }
.k2 .htag b { font-size: 20px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
.k2 .htag svg { width: 20px; height: 20px; color: #fff; }
.k2 .peek { position: absolute; left: 0; right: 0; bottom: 0; height: 320px; background: var(--bg); border-top: 1px solid var(--ink); padding: 20px 26px 30px; }
.k2 .lr { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.k2 .lr small { color: var(--muted); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; display: block; margin-top: 2px; }
.k2 .foot { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.k2 .foot div { flex: 1; } .k2 .foot .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); } .k2 .foot b { font-size: 22px; font-weight: 400; }
.k2 .foot span { border: 1px solid var(--ink); padding: 15px 24px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

/* L — formal order sheet with number */
.l2 { }
.l2 .frame { position: absolute; inset: 44px 24px; border: 1px solid var(--ink); padding: 24px 22px; display: flex; flex-direction: column; }
.l2 .fh { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
.l2 .fh b { font-size: 18px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; } .l2 .fh small { display: block; font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }
.l2 .fh .no { text-align: right; font-size: 9px; letter-spacing: 1px; color: var(--muted); }
.l2 .ln { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.l2 .ln small { color: var(--muted); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; display: block; }
.l2 .tot { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--ink); }
.l2 .tot .k { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); } .l2 .tot b { font-size: 26px; font-weight: 400; }
.l2 .cta { margin-top: 18px; }
</style>
</head>
<body>
<h1>Checkout — Fine Line II</h1>
<p class="sub">סבב שני בקו דק · G עד L</p>
<div class="grid" id="grid"></div>
<script>
var IT = [
  { n: 'Wool Overcoat', s: 'Atelier Nord', p: 980, img: '../men-hero.jpg',      pos: '50% 30%' },
  { n: 'Chelsea Boots', s: 'Sole Society', p: 690, img: '../clothing-hero.jpg', pos: '50% 60%' },
  { n: 'Silk Scarf',    s: 'Studio Vero',  p: 210, img: '../hero-beach.jpg',    pos: '50% 50%' }
];
var SUB = 1880, SHIP = 40, TAX = 0, TOTAL = SUB + SHIP;
var m = function (v) { return '₪' + v.toLocaleString('en-US'); };
var bg = function (i) { return 'style="background-image:url(\'' + i.img + '\');background-position:' + i.pos + '"'; };
var ARR = '<svg class="thin" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var SHR = '<svg class="thin" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

var OPTS = [
  ['G · שלבים (stepper)', 'ציר אנכי בקו דק: Review → Delivery → Payment, עם וי במעגל על שלב שהושלם. הפריטים יושבים בשלב הראשון. מתאים לצ׳קאאוט ארוך.',
   '<div class="screen g"><div class="top">Checkout</div><div class="steps">' +
   [['done','1','Cart','3 items reviewed',1],['now','2','Delivery','Shipping · Rothschild 22',0],['','3','Payment','Visa ending 4242',0]].map(function(s,k){
     return '<div class="step '+s[0]+'"><div class="dot"><i>'+(s[0]==='done'?'✓':s[1])+'</i><span class="line"></span></div><div class="body"><div class="st">'+s[2]+'</div><div class="st2">'+s[3]+'</div>'+(s[4]?('<div class="mini">'+IT.map(function(i){return '<div class="th" '+bg(i)+'></div>';}).join('')+'</div>'):'')+'</div></div>';
   }).join('') + '</div><div class="bar"><div><div class="k">Total</div><b class="money">'+m(TOTAL)+'</b></div><span>Continue</span></div></div>'],

  ['H · מספר גדול, רשימה ממוספרת', 'הסה״כ כמספר ענק למעלה, והפריטים כרשימה ממוספרת (01/02/03) על קווים דקים. הכי "מגזין".',
   '<div class="screen h"><div class="top">Your order</div><div class="big money">'+m(TOTAL)+'</div><div class="cap">3 items · incl. shipping</div>' +
   IT.map(function(i,k){return '<div class="nr"><em>0'+(k+1)+'</em><div class="nm"><b>'+i.n+'</b><small>'+i.s+'</small></div><div class="pr money">'+m(i.p)+'</div></div>';}).join('') +
   '<span class="cta">Place order</span></div>'],

  ['I · סיכום הזמנה ממוסגר', 'הפריטים למעלה, ומתחת תיבת "Order summary" במסגרת דקה עם סכום־ביניים, משלוח, מע״מ וסה״כ מודגש. ברור כמה משלמים ולמה.',
   '<div class="screen i2"><div class="top">Checkout</div><div class="wrap2">' +
   IT.map(function(i){return '<div class="row"><div class="th" '+bg(i)+'></div><div class="nm"><b>'+i.n+'</b><small>'+i.s+'</small></div><div class="pr money">'+m(i.p)+'</div></div>';}).join('') +
   '<div class="box"><h4>Order summary</h4><p><span>Subtotal</span><span class="money">'+m(SUB)+'</span></p><p><span>Shipping</span><span class="money">'+m(SHIP)+'</span></p><p><span>VAT incl.</span><span class="money">'+m(272)+'</span></p><p class="t"><span>Total</span><span class="money">'+m(TOTAL)+'</span></p></div></div><span class="cta">Place order</span></div>'],

  ['J · החלקה לאישור', 'סיכום קצר, ולמטה "Slide to place order" — מחליקים את הידית בקו דק כדי לאשר. מונע לחיצה בטעות, מרגיש פרימיום.',
   '<div class="screen j2"><div class="top">Checkout</div><div class="wrap2">' +
   IT.map(function(i){return '<div class="row"><div class="th" '+bg(i)+'></div><div class="nm"><b>'+i.n+'</b><small>'+i.s+'</small></div><div class="pr money">'+m(i.p)+'</div></div>';}).join('') +
   '<div class="sums"><p><span>Subtotal</span><span class="money">'+m(SUB)+'</span></p><p><span>Shipping</span><span class="money">'+m(SHIP)+'</span></p><p class="t"><span>Total</span><span class="money">'+m(TOTAL)+'</span></p></div></div><div class="slide"><div class="knob">'+ARR+'</div><span>Slide to place order</span></div></div>'],

  ['K · תמונת רקע + הצצה', 'תמונת הפריט הראשון במסך מלא עם הכותרת עליה, ומתחת הצצה בקו דק לשאר הפריטים ולסה״כ. הכי ויזואלי.',
   '<div class="screen k2"><div class="hero" '+bg(IT[0])+'></div><div class="htag"><b>Checkout</b>'+SHR+'</div><div class="peek">' +
   IT.map(function(i){return '<div class="lr"><div>'+i.n+'<small>'+i.s+'</small></div><div class="money">'+m(i.p)+'</div></div>';}).join('') +
   '<div class="foot"><div><div class="k">Total</div><b class="money">'+m(TOTAL)+'</b></div><span>Place order</span></div></div></div>'],

  ['L · הזמנה רשמית ממוסגרת', 'כל ההזמנה בתוך מסגרת דקה אחת כמו טופס הזמנה, עם מספר הזמנה בפינה. מסודר ו"מסמכי".',
   '<div class="screen l2"><div class="frame"><div class="fh"><div><b>Order</b><small>moravchick</small></div><div class="no">NO. 2048<br>04.10.26</div></div>' +
   IT.map(function(i){return '<div class="ln"><div>'+i.n+'<small>'+i.s+'</small></div><div class="money">'+m(i.p)+'</div></div>';}).join('') +
   '<div class="tot"><span class="k">Total incl. shipping</span><b class="money">'+m(TOTAL)+'</b></div><span class="cta">Place order</span></div></div>']
];
document.getElementById('grid').innerHTML = OPTS.map(function (o) {
  return '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>';
}).join('');
</script>
</body>
</html>
