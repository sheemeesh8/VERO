<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Opened on its own (not inside the app), hand off to the phone frame like every page. -->
    <script>
      if (window.self === window.top) {
        location.replace('phone-frame.html#page=' + encodeURIComponent('shop-launch.html' + location.search));
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
    <title>moravchick — My shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- The "Store" tab of the seller area (?for=seller) and the "My Shop" tab of
         the personal area (?for=personal): a blank white page with the two ways
         into the shop — edit it in place, or see it as buyers do. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #fff; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #111; -webkit-font-smoothing: antialiased;
            display: grid; place-items: center; padding: 32px 24px;
        }
        .sl { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .sl-kick { font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: #8b8b86; font-weight: 500; }
        .sl-name {
            font-family: 'Bodoni Moda', 'Didot', serif; font-weight: 400; font-size: 30px; line-height: 1.1;
            margin: 10px 0 10px; word-break: break-word;
        }
        .sl-line { font-size: 11.5px; line-height: 1.6; color: #6b6b66; max-width: 26em; }
        .sl-rule { width: 28px; height: 1px; background: #111; margin: 22px 0 26px; }
        .sl-btn {
            width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px 20px; border-radius: 999px; font: 600 11px/1 'Poppins', sans-serif;
            letter-spacing: 2px; text-transform: uppercase; text-decoration: none; cursor: pointer;
            transition: transform 0.15s, background 0.2s, color 0.2s;
        }
        .sl-btn:active { transform: scale(0.98); }
        .sl-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .sl-primary { background: #111; color: #fff; border: 1px solid #111; }
        .sl-primary:hover { background: #2b2b2b; }
        .sl-ghost { background: #fff; color: #111; border: 1px solid #111; margin-top: 10px; }
        .sl-ghost:hover { background: #f4f4f2; }
        .sl-state { margin-top: 18px; font-size: 10px; color: #8b8b86; display: inline-flex; align-items: center; gap: 6px; }
        .sl-state i { width: 6px; height: 6px; border-radius: 50%; background: #2e8b57; }
        .sl-state.is-draft i { background: #e08a00; }
    </style>
</head>
<body>
    <main class="sl">
        <div class="sl-kick" id="slKick">My shop</div>
        <h1 class="sl-name" id="slName">Your shop</h1>
        <p class="sl-line" id="slLine">Your shop is your own website. Change the slider, banners and items right on the page.</p>
        <span class="sl-rule"></span>
        <a class="sl-btn sl-primary" href="buyer-profile.html?edit=1" data-go>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
            Edit my shop
        </a>
        <a class="sl-btn sl-ghost" href="buyer-profile.html?visitor=1" data-go id="slView">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="slViewLabel">View storefront</span>
        </a>
        <div class="sl-state" id="slState"><i></i><span></span></div>
    </main>
    <script>
    (function () {
        var mode = new URLSearchParams(location.search).get('for') === 'personal' ? 'personal' : 'seller';
        var read = function (k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
        var prof = read('vero_profile'), cfg = read('vero_store_config');

        var name = [prof.name, prof.lastName].filter(function (x) { return x && String(x).trim(); }).join(' ');
        if (mode === 'seller') name = prof.name || cfg.name || name;   // same as the seller area's hero
        if (name) document.getElementById('slName').textContent = name;
        if (mode === 'personal') {
            document.getElementById('slKick').textContent = 'My profile front';
            document.getElementById('slViewLabel').textContent = 'View profile front';
            document.getElementById('slLine').textContent = 'Your profile front is your own website. Change the slider, banners and items right on the page.';
        }

        var draft = Array.isArray(cfg.sectionsDraft), st = document.getElementById('slState');
        st.classList.toggle('is-draft', draft);
        st.querySelector('span').textContent = draft ? 'You have unpublished changes' : 'Live — buyers see the published version';

        // Open the shop in the app's page (the area that hosts this panel), not inside the panel.
        document.querySelectorAll('[data-go]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                var url = a.getAttribute('href') + '&from=' + mode;
                try { (window.parent && window.parent !== window ? window.parent : window).location.href = url; }
                catch (err) { location.href = url; }
            });
        });
    })();
    </script>
</body>
</html>
