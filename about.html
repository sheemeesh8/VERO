<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — About Us</title>
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --muted: rgba(255, 255, 255, 0.55);
            --bar: rgba(255, 255, 255, 0.3);
            --bar-active: #fff;
            --font-sans: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: Georgia, 'Times New Roman', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-sans);
            background: #111;
            color: var(--fg);
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The story viewport */
        .story {
            position: relative;
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 900px;
            background: var(--bg);
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
        }

        /* Progress bars */
        .progress {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 30;
            display: flex;
            gap: 5px;
        }
        .progress-seg {
            flex: 1;
            height: 3px;
            border-radius: 3px;
            background: var(--bar);
            overflow: hidden;
        }
        .progress-seg .fill {
            display: block;
            height: 100%;
            width: 0;
            background: var(--bar-active);
            border-radius: 3px;
        }
        .progress-seg.done .fill { width: 100%; }
        .progress-seg.active .fill { width: 100%; }

        /* Brand row */
        .brand {
            position: absolute;
            top: 30px;
            left: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }
        .brand .logo {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .brand .close {
            color: var(--fg);
            text-decoration: none;
            font-size: 26px;
            line-height: 1;
            opacity: 0.85;
            cursor: pointer;
        }

        /* Slides */
        .slides { position: absolute; inset: 0; }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 90px 34px 110px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease;
            background: linear-gradient(160deg, #1a1a1a 0%, #000 60%);
        }
        .slide.active { opacity: 1; visibility: visible; }

        .slide .kicker {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }
        .slide h2 {
            font-family: var(--font-serif);
            font-size: 34px;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .slide p {
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.88);
        }

        /* Tap zones */
        .tap {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 20;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .tap.prev { right: 0; }   /* RTL: right = previous direction? -> we use right = back */
        .tap.next { left: 0; }

        .hint {
            position: absolute;
            bottom: 26px;
            left: 0;
            right: 0;
            z-index: 25;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--muted);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="story" id="story">
        <div class="progress" id="progress"></div>

        <div class="brand">
            <span class="logo">VERO</span>
            <a class="close" href="index.html" title="סגירה">&times;</a>
        </div>

        <div class="slides" id="slides">
            <!-- ====== הוסף/ערוך פסקאות כאן — כל <section> = קליק אחד ======
                 kicker = כותרת קטנה למעלה (אופציונלי)
                 h2     = כותרת ראשית (אופציונלי)
                 p      = טקסט הפסקה
            -->
            <section class="slide" data-kicker="Est. 2026" data-title="ברוכים הבאים ל־VERO">
                כאן מתחילים. VERO היא זירת המפגש בין אופנה לאמנות — מקום שבו כל פריט מספר סיפור.
            </section>

            <section class="slide" data-kicker="הסיפור שלנו">
                כאן תוסיף את הפסקה השנייה. כל פסקה שתוסיף תהפוך לסטורי נפרד שנחשף בקליק.
            </section>

            <section class="slide" data-kicker="החזון">
                וכאן הפסקה השלישית. פשוט תשכפל <section> נוסף כדי להוסיף עוד קליקים.
            </section>
            <!-- ====== סוף אזור הפסקאות ====== -->
        </div>

        <div class="tap prev" id="tapPrev" title="הקודם"></div>
        <div class="tap next" id="tapNext" title="הבא"></div>

        <div class="hint">קליק ימין ← הקודם · קליק שמאל → הבא</div>
    </div>

    <script>
        (function () {
            var slidesWrap = document.getElementById('slides');
            var sections = Array.prototype.slice.call(slidesWrap.querySelectorAll('.slide'));
            var progress = document.getElementById('progress');
            var current = 0;

            // Build each slide's inner markup + a progress segment
            sections.forEach(function (sec, i) {
                var kicker = sec.getAttribute('data-kicker');
                var title = sec.getAttribute('data-title');
                var body = sec.innerHTML.trim();
                sec.innerHTML =
                    (kicker ? '<div class="kicker">' + kicker + '</div>' : '') +
                    (title ? '<h2>' + title + '</h2>' : '') +
                    (body ? '<p>' + body + '</p>' : '');

                var seg = document.createElement('div');
                seg.className = 'progress-seg';
                seg.innerHTML = '<span class="fill"></span>';
                progress.appendChild(seg);
            });

            var segs = Array.prototype.slice.call(progress.querySelectorAll('.progress-seg'));

            function render() {
                sections.forEach(function (s, i) {
                    s.classList.toggle('active', i === current);
                });
                segs.forEach(function (s, i) {
                    s.classList.toggle('done', i < current);
                    s.classList.toggle('active', i === current);
                });
            }

            function next() {
                if (current < sections.length - 1) { current++; render(); }
                else { window.location.href = 'index.html'; } // סוף הסטורי → חזרה לבית
            }
            function prev() {
                if (current > 0) { current--; render(); }
            }

            document.getElementById('tapNext').addEventListener('click', next);
            document.getElementById('tapPrev').addEventListener('click', prev);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowLeft') next();      // חץ שמאל → הבא
                else if (e.key === 'ArrowRight') prev(); // חץ ימין → הקודם
                else if (e.key === 'Escape') window.location.href = 'index.html';
            });

            render();
        })();
    </script>
</body>
</html>
