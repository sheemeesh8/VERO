<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Fashion & Art Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            background: #fafafa;
            direction: rtl;
            letter-spacing: 0.5px;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 12px;
            color: white;
            font-style: italic;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px;
        }

        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 18px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .hero {
            width: 100vw;
            aspect-ratio: 7 / 3;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            color: rgba(255, 255, 255, 0.1);
            margin: 0;
            padding: 0;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -24px;
            padding-top: 50px;
        }

        /* ==================== GRID ==================== */
        .grid-section {
            width: 100vw;
            padding: 40px 40px 40px 40px;
            display: grid;
            grid-template-columns: 0.65fr 0.65fr 0.65fr 2.05fr;
            gap: 15px;
            height: 720px;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        .grid-item {
            background: linear-gradient(135deg, #f5f1ed 0%, #e8e3de 100%);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: rgba(0, 66, 37, 0.1);
        }

        /* ==================== CATEGORIES ==================== */
        .categories-section {
            padding: 40px 40px;
            background: white;
            border-top: none;
            margin-top: 0;
        }

        .section-title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #000;
            display: none;
        }

        .categories-wrapper {
            position: relative;
        }

        .categories-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0;
            scrollbar-width: none;
        }

        .categories-grid::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            aspect-ratio: 9 / 12;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            flex: 0 0 calc(25% - 15px);
            min-width: 220px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .category-text {
            position: absolute;
            bottom: 16px;
            right: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px;
            text-align: right;
            z-index: 2;
            border-radius: 4px;
        }

        .category-text h3 {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 0;
            color: #000;
            letter-spacing: 0.5px;
        }

        .category-text p {
            font-size: 13px;
            color: #999;
            margin-bottom: 0;
            display: none;
        }

        .category-btn {
            display: none;
        }

        .category-icon {
            font-size: 140px;
            color: rgba(0, 66, 37, 0.06);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .category-nav:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .category-nav svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
        }

        .category-nav.prev {
            left: 20px;
        }

        .category-nav.next {
            right: 20px;
        }

        /* ==================== FEED ==================== */
        .feed-section {
            padding: 30px 0;
            background: #fafafa;
        }

        .feed-block {
            background: white;
            margin-bottom: 60px;
            padding: 40px;
            border-radius: 0;
        }

        .featured-product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #e0e0e0;
        }

        .featured-product.flipped {
            grid-template-columns: 1fr 1fr;
            direction: ltr;
        }

        .featured-product.flipped .featured-image {
            order: -1;
        }

        .featured-text {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .featured-brand {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }

        .featured-text h3 {
            font-size: 40px;
            font-weight: 300;
        }

        .featured-category {
            font-size: 14px;
            color: #004225;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .featured-text p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .featured-price {
            font-size: 20px;
            color: #000;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .featured-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
        }

        .featured-btn:hover {
            background: #003319;
        }

        .featured-image {
            width: 100%;
            height: 500px;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 160px;
            color: rgba(0, 66, 37, 0.1);
        }

        .products-label {
            font-size: 16px;
            margin: 30px 0 20px 0;
            font-weight: 400;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            transition: transform 0.4s, box-shadow 0.4s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #efefef 0%, #f9f9f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
        }

        .product-info {
            padding: 16px;
        }

        .product-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: 'Segoe UI', sans-serif;
        }

        .product-name {
            font-size: 14px;
            font-weight: 400;
            color: #000;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 13px;
            color: #004225;
            font-weight: 600;
            margin-bottom: 12px;
            font-family: 'Segoe UI', sans-serif;
        }

        .product-footer {
            display: flex;
            gap: 10px;
        }

        .product-btn {
            flex: 1;
            background: #004225;
            color: white;
            border: none;
            padding: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
        }

        .product-btn:hover {
            background: #003319;
        }

        .product-heart {
            width: 40px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .product-heart:hover {
            background: #f0f0f0;
            border-color: #004225;
        }

        .load-more {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .grid-section {
                grid-template-columns: 1fr 1fr;
                height: auto;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .featured-product {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header-container {
                grid-template-columns: auto 1fr auto;
                gap: 20px;
            }

            .header-left {
                display: none;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 6px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-left">
                <button class="nav-button">Seller Area</button>
                <button class="nav-button">About</button>
            </div>
            <div class="logo">vero</div>
            <div class="header-right">
                <div class="toggle-switch">
                    <button class="toggle-btn active" onclick="toggleCategory(this, 'clothing')">👕 ביגוד</button>
                    <button class="toggle-btn" onclick="toggleCategory(this, 'art')">🎨 אומנות</button>
                </div>
                <button class="icon-btn" title="Wishlist">❤️</button>
                <button class="icon-btn" title="Cart">🛒</button>
                <button class="icon-btn" title="Profile">👤</button>
            </div>
        </div>
    </header>

    <!-- ==================== HERO ==================== -->
    <div class="hero" id="heroImage" style="background: linear-gradient(135deg, #8B7355 0%, #D4AF8C 100%); background-size: cover; background-position: center;">
    </div>

    <!-- ==================== GRID ==================== -->
    <div class="container">
        <div class="grid-section">
            <div class="grid-item">🎨</div>
            <div class="grid-item">🖼️</div>
            <div class="grid-item">✨</div>
            <div class="grid-item">👗</div>
        </div>
    </div>

    <!-- ==================== CATEGORIES ==================== -->
    <div class="categories-section">
        <div class="container">
            <h2 class="section-title" id="categoryTitle">בחר קטגוריה: ביגוד</h2>
            <div class="categories-wrapper">
                <div class="categories-grid" id="categoriesGrid">
                    <!-- Categories will be populated by JavaScript -->
                </div>
                <button class="category-nav prev" onclick="scrollCategories(-1)">
                    <svg viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="category-nav next" onclick="scrollCategories(1)">
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== INFINITE FEED ==================== -->
    <div class="feed-section">
        <div class="container">
            <div id="feedContainer"></div>
            <div class="load-more">↓ גלול למטה לעוד מוצרים ↓</div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Data
        const clothingCategories = [
            { name: 'וינטג\'', desc: 'בגדים ואקססוריז מימים עברים', icon: '👕' },
            { name: 'ספורט', desc: 'נעליים וביגוד ספורטיבי', icon: '👟' },
            { name: 'אקססוריז', desc: 'תיקות, חגורות ותכשיטים', icon: '👜' },
            { name: 'שמלות', desc: 'שמלות לכל אירוע', icon: '👗' },
            { name: 'חולצות', desc: 'חולצות וטי-שירטים', icon: '👕' },
            { name: 'מכנסיים', desc: 'ג\'ינס וביגוד תחתון', icon: '👖' },
            { name: 'עור', desc: 'מעילים וביגוד עור', icon: '🧥' },
            { name: 'תכשיטים', desc: 'שרשראות וטבעות', icon: '💎' },
            { name: 'כובעים', desc: 'כובעים וכיסויי ראש', icon: '🎩' },
            { name: 'נעליים', desc: 'נעליים לכל סגנון', icon: '👞' },
            { name: 'חגורות', desc: 'חגורות עור וינטג\'', icon: '🎀' },
            { name: 'כפפות', desc: 'כפפות וחורביים', icon: '🧤' }
        ];

        const artCategories = [
            { name: 'ציורים', desc: 'ציורים יד שנייה ומקוריים', icon: '🎨' },
            { name: 'הדפסות', desc: 'פוסטרים והדפסות וינטג\'', icon: '🖼️' },
            { name: 'פסלונים', desc: 'פסלונים וקולקציות אומנות', icon: '✨' },
            { name: 'ציור שמן', desc: 'ציורים בטכניקה קלאסית', icon: '🎭' },
            { name: 'גרפיקה', desc: 'עיצובים גרפיים ודיגיטליים', icon: '🖌️' },
            { name: 'צילום', desc: 'צילומים אמנותיים מקוריים', icon: '📸' },
            { name: 'קולאז\'', desc: 'יצירות קולאז\' וקולה גריט', icon: '✂️' },
            { name: 'קרמיקה', desc: 'כלים וקרמיקה אמנותית', icon: '🏺' },
            { name: 'פיסול', desc: 'פסלים ופריטי פיסול', icon: '🗿' },
            { name: 'תכשיטים אמנות', desc: 'תכשיטים אמנותיים', icon: '💍' },
            { name: 'ויטראז\'', desc: 'אומנות ויטראז\' וזכוכית', icon: '🌈' },
            { name: 'טקסטיל', desc: 'יצירות אמנות טקסטיל', icon: '🧵' }
        ];

        const clothingProducts = [
            { name: 'ז\'קט דנים קלאסי', category: 'וינטג\'', price: '₪89.99', icon: '👕' },
            { name: 'שמלה שחורה', category: 'אלגנטי', price: '₪120.00', icon: '👗' },
            { name: 'סניקרס לבן', category: 'ספורט', price: '₪150.00', icon: '👟' },
            { name: 'תיקה עור', category: 'אקססוריז', price: '₪200.00', icon: '👜' },
            { name: 'חולצה וינטג\'', category: 'וינטג\'', price: '₪65.00', icon: '👕' }
        ];

        const artProducts = [
            { name: 'ציור אבסטרקטי', category: 'ציורים', price: '₪450.00', icon: '🎨' },
            { name: 'פוסטר וינטג\'', category: 'הדפסות', price: '₪45.00', icon: '🖼️' },
            { name: 'ציור שמן', category: 'ציורים', price: '₪450.00', icon: '🎨' },
            { name: 'הדפס מוגבל', category: 'הדפסות', price: '₪120.00', icon: '🖼️' },
            { name: 'פסלון ברונזה', category: 'פסלונים', price: '₪800.00', icon: '✨' }
        ];

        const featuredProducts = [
            {
                brand: 'Vintage Collection',
                name: 'ז\'קט דנים קלאסי',
                category: 'וינטג\' | ביגוד',
                desc: 'ז\'קט דנים איכותי מהשנות ה-90 בתנאי שמירה מעולים. עשוי מדנים עבה עם תפרים חזקים.',
                price: '₪89.99',
                icon: '👕',
                type: 'clothing'
            },
            {
                brand: 'Designer Collection',
                name: 'שמלת קוקטייל',
                category: 'עיצוב | ביגוד',
                desc: 'שמלה אלגנטית מעיצוב מפורסם. מושלמת לאירועים ערב. בד איכותי ותפרים מעולים.',
                price: '₪180.00',
                icon: '👗',
                type: 'clothing',
                flipped: true
            },
            {
                brand: 'Art Collection',
                name: 'ציור אבסטרקטי',
                category: 'אומנות מודרנית',
                desc: 'ציור שמן מקורי בטכניקה אבסטרקטית מאת אמן ישראלי בעל ניסיון של 20 שנים.',
                price: '₪450.00',
                icon: '🎨',
                type: 'art'
            },
            {
                brand: 'Footwear Collection',
                name: 'סניקרס ווינטג\'',
                category: 'ספורט | ביגוד',
                desc: 'סניקרס ווינטג\' מקורי מהשנות ה-80. נוח, סטילי וזה פשוט ייקוני. בתנאי מעולה.',
                price: '₪120.00',
                icon: '👟',
                type: 'clothing',
                flipped: true
            }
        ];

        let currentCategory = 'clothing';
        let feedBlocksCount = 0;

        // Toggle Category
        function toggleCategory(btn, category) {
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            document.getElementById('categoryTitle').textContent =
                category === 'clothing' ? 'בחר קטגוריה: ביגוד' : 'בחר קטגוריה: אומנות';

            // Change hero image based on category
            const heroImage = document.getElementById('heroImage');
            if (category === 'clothing') {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1595777712802-91d282f641b1?w=1600&h=600&fit=crop')";
            } else {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1578321272176-639e2e54cb4f?w=1600&h=600&fit=crop')";
            }

            renderCategories();
            renderFeed();
        }

        // Scroll Categories Slider
        function scrollCategories(direction) {
            const grid = document.getElementById('categoriesGrid');
            const scrollAmount = 350;
            grid.scrollBy({
                left: direction > 0 ? scrollAmount : -scrollAmount,
                behavior: 'smooth'
            });
        }

        // Render Categories
        function renderCategories() {
            const categories = currentCategory === 'clothing' ? clothingCategories : artCategories;
            const html = categories.map(cat => `
                <div class="category-card">
                    <div class="category-text">
                        <h3>${cat.name}</h3>
                        <p>${cat.desc}</p>
                        <button class="category-btn">עיין</button>
                    </div>
                    <div class="category-icon">${cat.icon}</div>
                </div>
            `).join('');

            document.getElementById('categoriesGrid').innerHTML = html;
        }

        // Render Feed
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = '';
            feedBlocksCount = 0;
            loadMoreFeedBlocks();
        }

        // Load More Feed Blocks
        function loadMoreFeedBlocks() {
            const feedContainer = document.getElementById('feedContainer');

            // Add 2 blocks at a time
            for (let i = 0; i < 2; i++) {
                const productIndex = feedBlocksCount % featuredProducts.length;
                const featured = featuredProducts[productIndex];

                // Filter products based on category
                const products = currentCategory === 'clothing'
                    ? clothingProducts
                    : artProducts;

                const block = document.createElement('div');
                block.className = 'feed-block';

                let productsHtml = '';
                for (let j = 0; j < 10; j++) {
                    const prod = products[j % products.length];
                    productsHtml += `
                        <div class="product-card">
                            <div class="product-image">${prod.icon}</div>
                            <div class="product-info">
                                <div class="product-label">${prod.category}</div>
                                <div class="product-name">${prod.name}</div>
                                <div class="product-price">${prod.price}</div>
                                <div class="product-footer">
                                    <button class="product-btn">הוסף לעגלה</button>
                                    <button class="product-heart">❤️</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                block.innerHTML = `
                    <div class="featured-product${featured.flipped ? ' flipped' : ''}">
                        <div class="featured-text">
                            <div class="featured-brand">${featured.brand}</div>
                            <h3>${featured.name}</h3>
                            <div class="featured-category">${featured.category}</div>
                            <p>${featured.desc}</p>
                            <div class="featured-price">${featured.price}</div>
                            <button class="featured-btn">צפה בפריט</button>
                        </div>
                        <div class="featured-image">${featured.icon}</div>
                    </div>
                    <h4 class="products-label">10 מוצרים רנדומליים</h4>
                    <div class="products-grid">
                        ${productsHtml.split('</div>').slice(0, 5).join('</div>') + '</div>'}
                    </div>
                    <div class="products-grid">
                        ${productsHtml.split('</div>').slice(5, 10).join('</div>') + '</div>'}
                    </div>
                `;

                feedContainer.appendChild(block);
                feedBlocksCount++;
            }
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                loadMoreFeedBlocks();
            }
        });

        // Initialize
        renderCategories();
        renderFeed();
    </script>
</body>
</html>
