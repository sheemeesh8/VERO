<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO — Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1c1c1c; background: #fff;
            /* Clip the slide-in's horizontal offset so it doesn't cause a sideways
               scroll on phones (matches the other personal-area pages). */
            overflow-x: hidden;
        }

        /* Entry: the cart slides in from the right, continuing the white panel the
           header glides in on the way here (see veroSlideToCart in header.js). No
           upward wipe — the page is white already, so the content just slides in. */
        .page-cover { display: none; }
        @keyframes coverOut { to { transform: translateY(-100%); } }

        .back {
            position: fixed; top: 26px; right: 34px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10.00px; letter-spacing: 1.5px; text-decoration: none; color: #1c1c1c;
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }

        /* No side image — the cart spreads evenly across the full screen. */
        .wrap {
            max-width: none; margin: 0;
            padding: 8px clamp(20px, 5vw, 72px) 90px;
            animation: cartSlideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
        /* Slides in from the right, picking up where the header's white panel left off. */
        @keyframes cartSlideIn { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .wrap { animation: none; } }

        .head-title { font-size: clamp(40px, 6vw, 84px); font-weight: 200; letter-spacing: 1px; line-height: 1; }
        .head-sub { display: none; }

        /* Title row with the Clothing / Art cart toggle beside it. */
        .head-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

        /* Top bar — same clean style as the product page: back on one side,
           Filters + Share on the other, plain icon buttons. */
        .cart-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top,0px)) 4px 16px;
        }
        .cart-topbar .tb-right { display: flex; align-items: center; gap: 4px; }
        .tb-ico {
            width: 42px; height: 42px; flex: none; border: none; background: none;
            color: #16150f; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        .tb-ico:active { opacity: 0.5; }
        .tb-ico svg { width: 23px; height: 23px; stroke: currentColor; stroke-width: 1.6; fill: none; }

        /* Filters bottom-sheet. */
        .cart-sheet-overlay {
            position: fixed; inset: 0; background: rgba(20,18,14,0.4);
            display: none; align-items: flex-end; justify-content: center; z-index: 300;
        }
        .cart-sheet-overlay.show { display: flex; }
        .cart-sheet {
            width: 100%; max-width: 560px; background: #fff;
            border-radius: 20px 20px 0 0; padding: 22px 24px calc(28px + env(safe-area-inset-bottom,0px));
            transform: translateY(100%); animation: cartSheetRise 0.34s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes cartSheetRise { to { transform: translateY(0); } }
        .cart-sheet .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #e6e1d8; margin: 0 auto 18px; }
        .cart-sheet h3 { font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; }
        /* Inside the sheet the toolbar stacks; no big top margin or underline. */
        .cart-sheet .cart-toolbar { margin-top: 0; padding-bottom: 0; border-bottom: none; gap: 22px; }
        .mode-toggle {
            display: inline-flex; border: 1px solid #d8d3ca; border-radius: 999px; overflow: hidden;
        }
        .mode-btn {
            padding: 10px 24px; font-family: inherit; font-size: 10.00px; letter-spacing: 2px;
            text-transform: uppercase; background: transparent; color: #8c877c; border: none; cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        .mode-btn.active { background: #16150f; color: #fff; }

        /* Cart total shown up top, beside the title. */
        .head-total { margin-left: auto; font-size: 10.83px; letter-spacing: 1.5px; text-transform: uppercase; color: #9a958c; }
        .head-total b { font-size: 24.00px; font-weight: 300; letter-spacing: 0.5px; color: #16150f; margin-left: 10px; }

        /* ===== Filter / selection toolbar — quiet, hairline-based ===== */
        .cart-toolbar {
            display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
            margin-top: 14px; padding-bottom: 16px; border-bottom: 1px solid #e6e1d8;
        }
        .ct-group { display: inline-flex; align-items: center; gap: 10px; }
        /* Three filter capsules in one row, each label sitting BELOW its select. */
        .ct-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; flex: 1 1 100%; }
        .ct-field { display: flex; flex-direction: column; align-items: center; gap: 9px; }
        .ct-btn {
            border: 1px solid #d8d3ca; background: transparent; color: #16150f; cursor: pointer;
            font-family: inherit; font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase;
            padding: 10px 20px; border-radius: 999px; transition: border-color 0.25s, color 0.25s;
        }
        .ct-btn:hover { border-color: #16150f; }
        .ct-label { font-size: 9.17px; letter-spacing: 2px; text-transform: uppercase; color: #a8a399; text-align: center; }
        .ct-select {
            font-family: inherit; font-size: 11px; color: #16150f; background: transparent;
            border: 1px solid #d8d3ca; border-radius: 999px; padding: 9px 16px; cursor: pointer;
            transition: border-color 0.25s; width: 100%; text-align: center;
        }
        .ct-select:hover { border-color: #16150f; }
        .ct-select:focus { outline: none; border-color: #16150f; }
        .ct-count { margin-left: auto; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #a8a399; }

        /* Cart-summary slider — one stat at a time (Total / item count), fading
           and rotating like the profile's follower/products slider. */
        .cart-ticker {
            position: relative; width: 170px; height: 44px;
            border-bottom: 1px solid #e6e1d8; margin: 30px 0 0 auto;
        }
        .cart-stat {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%) translateY(10px);
            opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
            display: flex; flex-direction: row-reverse; align-items: center; gap: 9px;
            text-align: center; pointer-events: none; white-space: nowrap;
        }
        .cart-stat.is-active { opacity: 1; transform: translate(-50%, -50%); }
        .cart-stat .cs-num { font-size: 18px; font-weight: 300; letter-spacing: 2px; line-height: 1; color: #16150f; }
        .cart-stat .cs-lbl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: #a8a399; }

        /* Selection checkbox overlaid on each cart card. */
        .cart-item { position: relative; }
        .cart-select {
            position: absolute; top: 12px; left: 12px; z-index: 4;
            width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid #000;
            background: #fff; cursor: pointer; display: grid; place-items: center;
            padding: 0; transition: background 0.2s, color 0.2s;
        }
        .cart-select svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
        .cart-item.is-selected .cart-select { background: #000; }
        .cart-item.is-selected .cart-select svg { opacity: 1; }

        /* Category sections within a cart. */
        .cat-section { margin-top: 44px; }
        /* First section hugs the right-aligned ticker directly above it. */
        #cartBody .cat-section:first-child { margin-top: 0; }
        .cat-label {
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
            font-size: 10.00px; letter-spacing: 2px; text-transform: uppercase; color: #9a9a95;
            border-bottom: 1px solid #000; padding-bottom: 12px; margin-bottom: 26px;
        }
        .cat-label b { color: #1c1c1c; font-weight: 500; letter-spacing: 2px; }

        /* Five product cards per row — exactly like the feed. */
        .cart-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
        }
        @media (max-width: 1400px) { .cart-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 1080px) { .cart-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 760px)  { .cart-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
        /* Keep two per row even on the smallest phones. */
        @media (max-width: 480px)  { .cart-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

        .cart-empty {
            margin-top: 52px; border: 1px solid #000; padding: 60px 40px;
            font-size: 12.50px; color: #9a9a95; text-align: center;
        }

        /* Checkout bar — spread across the full width. */
        .checkout {
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
            padding: 30px 0 0; margin-top: 48px; border-top: 1px solid #000; flex-wrap: wrap;
        }
        .checkout-total { font-size: 12.50px; letter-spacing: 0.5px; }
        .checkout-total b { font-size: 25.00px; font-weight: 300; margin-left: 10px; }
        .checkout-btn {
            border: 1px solid #000; background: #000; color: #fff; cursor: pointer;
            font-family: inherit; font-size: 10.00px; letter-spacing: 2px; padding: 15px 40px;
            text-transform: uppercase; transition: opacity 0.2s;
        }
        .checkout-btn:hover { opacity: 0.78; }
    </style>
    <!-- The product card, shared by every page (single source: product-card.css). -->
    <link rel="stylesheet" href="product-card.css">
    <link rel="stylesheet" href="assets/fonts/aharoni.css">
    <script src="assets/back-button.js"></script>
</head>
<body>
    <div class="page-cover"></div>

    <div class="wrap">
        <!-- Clean top bar (same style as the product page). -->
        <div class="cart-topbar">
            <div class="tb-right">
                <button class="tb-ico" onclick="openFilters()" aria-label="Filters">
                    <svg viewBox="0 0 24 24"><path d="M4 3h16l-8 9-8-9z"/><path d="M12 12v8"/><path d="M8 21h8"/></svg>
                </button>
                <button class="tb-ico" onclick="shareCart()" aria-label="Share">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                </button>
            </div>
            <a class="back-btn tb-ico" href="index.html" aria-label="Back">
                <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>

        <div class="head-row">
            <h1 class="head-title">Cart</h1>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="clothing">Clothing</button>
                <button class="mode-btn" data-mode="art">Art</button>
            </div>
            <div class="head-total" id="headTotal"></div>
        </div>
        <p class="head-sub" id="headSub">The items you've gathered, ready to check out.</p>

        <div id="tickerHost"></div>
        <div id="cartBody"></div>
        <div id="checkoutHost"></div>
    </div>

    <!-- Filters bottom-sheet — holds every filter behind the header button. -->
    <div class="cart-sheet-overlay" id="filterOverlay" onclick="if(event.target===this)closeFilters()">
        <div class="cart-sheet">
            <div class="sheet-grip"></div>
            <h3>Filters</h3>
            <div id="toolbarHost"></div>
        </div>
    </div>

    <script>
        const readJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (e) { return fb; } };
        let cart = readJSON('vero_cart', []);
        if (!Array.isArray(cart)) cart = [];

        // The art categories from the site — anything else counts as clothing.
        const ART_CATS = new Set(['Acrylic','Oil','Watercolor','Mixed Media','Digital','Gouache',
            'Pastel','Epoxy','Stone Sculpture','Metal Sculpture','Ceramic','Photography','Sculpture','Painting']);
        const typeOf = it => it.type === 'art' || it.type === 'clothing'
            ? it.type
            : (ART_CATS.has(it.category) ? 'art' : 'clothing');

        // Demo pieces so both carts show their categories when nothing's saved yet.
        const CLOTHING_DEMO = [
            { name: 'Cotton Oxford Shirt', seller: 'Studio Vero', icon: '👕', price: 220, rating: 4.7, type: 'clothing', category: 'Shirts' },
            { name: 'Linen Overshirt',     seller: 'Atelier Nord', icon: '👔', price: 340, rating: 4.5, type: 'clothing', category: 'Shirts' },
            { name: 'Striped Tee',         seller: 'Basics Co.',   icon: '👕', price: 130, rating: 4.2, type: 'clothing', category: 'Shirts' },
            { name: 'Slim Selvedge Jeans', seller: 'Denim Lab',    icon: '👖', price: 410, rating: 4.8, type: 'clothing', category: 'Pants' },
            { name: 'Wool Trousers',       seller: 'Atelier Nord', icon: '👖', price: 380, rating: 4.6, type: 'clothing', category: 'Pants' },
            { name: 'Cargo Pants',         seller: 'Urban Thread', icon: '🩳', price: 260, rating: 4.1, type: 'clothing', category: 'Pants' },
            { name: 'Leather Sneakers',    seller: 'Sole Society', icon: '👟', price: 520, rating: 4.6, type: 'clothing', category: 'Shoes' },
            { name: 'Chelsea Boots',       seller: 'Sole Society', icon: '🥾', price: 690, rating: 4.9, type: 'clothing', category: 'Shoes' },
            { name: 'Suede Loafers',       seller: 'Milano Feet',  icon: '👞', price: 610, rating: 4.7, type: 'clothing', category: 'Shoes' },
            { name: 'Automatic Watch',     seller: 'Horology Co.', icon: '⌚', price: 1250, rating: 5.0, type: 'clothing', category: 'Watches' },
            { name: 'Diver Chronograph',   seller: 'Horology Co.', icon: '⌚', price: 1680, rating: 4.8, type: 'clothing', category: 'Watches' },
            { name: 'Wool Overcoat',       seller: 'Atelier Nord', icon: '🧥', price: 980, rating: 4.9, type: 'clothing', category: 'Jackets' },
            { name: 'Denim Jacket',        seller: 'Denim Lab',    icon: '🧥', price: 450, rating: 4.4, type: 'clothing', category: 'Jackets' },
            { name: 'Leather Belt',        seller: 'Milano Feet',  icon: '👜', price: 190, rating: 4.3, type: 'clothing', category: 'Accessories' },
            { name: 'Silk Scarf',          seller: 'Studio Vero',  icon: '🧣', price: 210, rating: 4.5, type: 'clothing', category: 'Accessories' },
        ];
        let DEMO = false;
        if (!cart.length && !localStorage.getItem('vero_cart_seeded')) {
            // Seed a starter cart once, persisted to vero_cart, so both cart pages
            // (header + personal area) share exactly the same items.
            cart = [
                ...CLOTHING_DEMO,

                { name: 'Sunset Landscape',    seller: 'Art House',    icon: '🖼️', price: 900, rating: 4.8, type: 'art', category: 'Oil' },
                { name: 'Harbour at Dawn',     seller: 'Art House',    icon: '🖼️', price: 1150, rating: 4.7, type: 'art', category: 'Oil' },
                { name: 'Abstract No. 4',      seller: 'Designer Collection', icon: '🎨', price: 650, rating: 4.4, type: 'art', category: 'Acrylic' },
                { name: 'Colour Field II',     seller: 'Gallery Nine', icon: '🎨', price: 720, rating: 4.6, type: 'art', category: 'Acrylic' },
                { name: 'Morning Mist',        seller: 'Gallery Nine', icon: '💧', price: 480, rating: 4.5, type: 'art', category: 'Watercolor' },
                { name: 'Marble Bust',         seller: 'Studio Vero',  icon: '🗿', price: 1800, rating: 4.9, type: 'art', category: 'Stone Sculpture' },
                { name: 'Bronze Figure',       seller: 'Forge Studio', icon: '⚙️', price: 2200, rating: 5.0, type: 'art', category: 'Metal Sculpture' },
                { name: 'Neon Print',          seller: 'Pixel Works',  icon: '💻', price: 300, rating: 4.3, type: 'art', category: 'Digital' },
                { name: 'Generative Grid',     seller: 'Pixel Works',  icon: '💻', price: 360, rating: 4.2, type: 'art', category: 'Digital' },
                { name: 'City Nights',         seller: 'Frame & Co.',  icon: '📷', price: 540, rating: 4.6, type: 'art', category: 'Photography' },
            ];
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_cart_seeded', '1');
        }

        // Keep the clothing cart stocked — if it holds no clothing, add the set.
        if (!cart.some(it => typeOf(it) === 'clothing')) {
            cart = [...CLOTHING_DEMO, ...cart];
            localStorage.setItem('vero_cart', JSON.stringify(cart));
        }

        let MODE = 'clothing';
        // Filter / sort / selection state for the cart toolbar.
        let filterCat = 'all';      // category filter (alphabetical list)
        let filterSeller = 'all';   // seller filter
        let sortBy = 'featured';    // featured | price-asc | price-desc
        let selected = new Set();   // cart indices ticked for checkout

        const priceNum = p => parseFloat(String(p == null ? 0 : p).replace(/[^\d.]/g, '')) || 0;
        const priceStr = p => {
            const s = String(p == null ? '' : p).trim();
            return s.startsWith('₪') ? s : '₪' + priceNum(p).toFixed(2);
        };

        // Same product page link the feed builds.
        function productPageUrl(item) {
            const data = {
                name: item.name, price: item.price, icon: item.icon,
                category: item.category, seller: item.seller, rating: item.rating, type: item.type
            };
            return `product-showcase.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        // One feed product-card per cart item — the exact markup product-card.css expects.
        function cartCardHTML(item, idx) {
            const rating = item.rating || 4.5;
            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
            const sel = selected.has(idx) ? ' is-selected' : '';
            return `
                <a href="${productPageUrl(item)}" class="product-card cart-item${sel}" data-idx="${idx}">
                    <button class="cart-select" title="Select for checkout"
                            onclick="event.preventDefault(); event.stopPropagation(); toggleSelect(${idx})">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                    <div class="product-image">${item.icon || '🛍️'}
                        <button class="product-icon remove" title="Remove from cart"
                                onclick="event.preventDefault(); event.stopPropagation(); removeItem(${idx})">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="product-info">
                        <div class="pc-left">
                            <div class="product-price"><span class="vprice">${priceStr(item.price)}</span></div>
                        </div>
                        <div class="pc-right">
                            <div class="product-seller">${item.seller || 'Vero Store'}</div>
                            <div class="product-name">${item.name || 'Item'}</div>
                            <div class="product-rating">${stars}</div>
                        </div>
                    </div>
                </a>`;
        }

        // Rows for the active toggle (clothing / art), before the toolbar filters.
        function modeRows() {
            return cart.map((it, idx) => ({ it, idx })).filter(({ it }) => typeOf(it) === MODE);
        }
        // Rows after applying the category / seller / price-sort toolbar controls.
        function visibleRows() {
            let rows = modeRows();
            if (filterCat !== 'all')    rows = rows.filter(({ it }) => (it.category || 'Other') === filterCat);
            if (filterSeller !== 'all') rows = rows.filter(({ it }) => (it.seller || 'Vero Store') === filterSeller);
            if (sortBy === 'price-asc')  rows = rows.slice().sort((a, b) => priceNum(a.it.price) - priceNum(b.it.price));
            if (sortBy === 'price-desc') rows = rows.slice().sort((a, b) => priceNum(b.it.price) - priceNum(a.it.price));
            return rows;
        }

        // Toolbar: select all / deselect all + category (A–Z), seller (A–Z) and price filters.
        function renderToolbar() {
            const host = document.getElementById('toolbarHost');
            const all = modeRows();
            if (!all.length) { host.innerHTML = ''; return; }
            const cats    = [...new Set(all.map(({ it }) => it.category || 'Other'))].sort((a, b) => a.localeCompare(b));
            const sellers = [...new Set(all.map(({ it }) => it.seller || 'Vero Store'))].sort((a, b) => a.localeCompare(b));
            const opt = (v, cur, lbl) => `<option value="${v}"${v === cur ? ' selected' : ''}>${lbl || v}</option>`;
            const selCount = visibleRows().filter(r => selected.has(r.idx)).length;
            host.innerHTML = `
                <div class="cart-toolbar">
                    <div class="ct-group">
                        <button class="ct-btn" onclick="selectAll()">Select all</button>
                        <button class="ct-btn" onclick="deselectAll()">Deselect all</button>
                    </div>
                    <div class="ct-filters">
                        <div class="ct-field">
                            <select class="ct-select" onchange="setFilterCat(this.value)">
                                ${opt('all', filterCat, 'All categories')}${cats.map(c => opt(c, filterCat)).join('')}
                            </select>
                            <span class="ct-label">Category</span>
                        </div>
                        <div class="ct-field">
                            <select class="ct-select" onchange="setFilterSeller(this.value)">
                                ${opt('all', filterSeller, 'All sellers')}${sellers.map(s => opt(s, filterSeller)).join('')}
                            </select>
                            <span class="ct-label">Seller</span>
                        </div>
                        <div class="ct-field">
                            <select class="ct-select" onchange="setSortBy(this.value)">
                                ${opt('featured', sortBy, 'Featured')}${opt('price-asc', sortBy, 'Price: low to high')}${opt('price-desc', sortBy, 'Price: high to low')}
                            </select>
                            <span class="ct-label">Price</span>
                        </div>
                    </div>
                    <span class="ct-count">${selCount} selected</span>
                </div>`;
        }

        function render() {
            const body = document.getElementById('cartBody');
            const host = document.getElementById('checkoutHost');
            const sub = document.getElementById('headSub');

            renderToolbar();

            // This cart = the items whose type matches the active toggle, after filters.
            const mine = visibleRows();

            if (!modeRows().length) {
                body.innerHTML = `<div class="cart-empty">Your ${MODE} cart is empty — pieces you add from the feed appear here.</div>`;
                host.innerHTML = '';
                document.getElementById('headTotal').innerHTML = '';
                document.getElementById('tickerHost').innerHTML = '';
                sub.textContent = "The items you've gathered, ready to check out.";
                return;
            }
            if (!mine.length) {
                body.innerHTML = `<div class="cart-empty">No items match these filters.</div>`;
                host.innerHTML = '';
                document.getElementById('headTotal').innerHTML = '';
                document.getElementById('tickerHost').innerHTML = '';
                return;
            }

            // Group the cart into product categories (Shirts, Shoes, Pants, Watches…),
            // with the category headers themselves in alphabetical order.
            const groups = new Map();
            mine.forEach(row => {
                const c = row.it.category || 'Other';
                if (!groups.has(c)) groups.set(c, []);
                groups.get(c).push(row);
            });
            const orderedCats = [...groups.keys()].sort((a, b) => a.localeCompare(b));

            body.innerHTML = orderedCats.map(cat => {
                const rows = groups.get(cat);
                return `
                <div class="cat-section">
                    <div class="cart-grid">${rows.map(r => cartCardHTML(r.it, r.idx)).join('')}</div>
                </div>`;
            }).join('');

            // Totals reflect the ticked selection when there is one, otherwise everything shown.
            const chosen = mine.filter(r => selected.has(r.idx));
            const forTotal = chosen.length ? chosen : mine;
            const count = forTotal.reduce((s, { it }) => s + (it.qty || 1), 0);
            const total = forTotal.reduce((s, { it }) => s + priceNum(it.price) * (it.qty || 1), 0);
            sub.textContent = chosen.length
                ? `${count} selected item${count === 1 ? '' : 's'} · ready to check out.`
                : `${count} item${count === 1 ? '' : 's'} in your ${MODE} cart · ready to check out.`;
            // The total lives on the auto-scrolling ticker (not the header), which keeps
            // the title row clean and closed-up against the filters.
            document.getElementById('headTotal').innerHTML = '';
            const money = '₪' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('tickerHost').innerHTML =
                `<div class="cart-ticker" id="cartTicker">
                    <div class="cart-stat is-active"><span class="cs-num">${money}</span><span class="cs-lbl">Total</span></div>
                    <div class="cart-stat"><span class="cs-num">${count}</span><span class="cs-lbl">${count === 1 ? 'Item' : 'Items'}</span></div>
                 </div>`;
            host.innerHTML = `
                <div class="checkout">
                    <button class="checkout-btn" onclick="veroCheckout()">Checkout${chosen.length ? ' selected' : ''} &#8594;</button>
                </div>`;
        }

        // ---- Toolbar handlers ----
        window.toggleSelect  = function (idx) { selected.has(idx) ? selected.delete(idx) : selected.add(idx); render(); };
        window.selectAll     = function () { visibleRows().forEach(r => selected.add(r.idx)); render(); };
        window.deselectAll   = function () { visibleRows().forEach(r => selected.delete(r.idx)); render(); };
        window.setFilterCat    = function (v) { filterCat = v; render(); };
        window.setFilterSeller = function (v) { filterSeller = v; render(); };
        window.setSortBy       = function (v) { sortBy = v; render(); };

        // Remove keeps the site's own cart storage in sync (demo items aren't saved).
        window.removeItem = function (idx) {
            cart.splice(idx, 1);
            selected.clear();   // indices shift after a splice — start selection fresh
            if (!DEMO) localStorage.setItem('vero_cart', JSON.stringify(cart));
            render();
        };

        // Checkout — turns the active cart into conversations with each seller,
        // written to the same vero_chats store the Chats page reads, then opens it.
        window.veroCheckout = function () {
            const visible = visibleRows();
            const chosen = visible.filter(r => selected.has(r.idx));
            const mine = chosen.length ? chosen : visible;
            if (!mine.length) return;

            const store = readJSON('vero_chats', {});
            const now = Date.now();
            mine.forEach(({ it }, n) => {
                const seller = it.seller || 'Vero Store';
                if (!Array.isArray(store[seller])) store[seller] = [];
                store[seller].push({ sender: 'buyer',  content: `Order placed — ${it.name} · ${priceStr(it.price)}`, at: now + n * 2 });
                store[seller].push({ sender: 'seller', content: `Thanks for your order of “${it.name}”! Let's arrange pickup or delivery.`, at: now + n * 2 + 1 });
            });
            localStorage.setItem('vero_chats', JSON.stringify(store));

            if (!DEMO) {
                mine.map(m => m.idx).sort((a, b) => b - a).forEach(i => cart.splice(i, 1));
                localStorage.setItem('vero_cart', JSON.stringify(cart));
            }

            const cover = document.createElement('div');
            cover.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:60;transform:translateY(100%);transition:transform .6s cubic-bezier(.76,0,.24,1)';
            document.body.appendChild(cover);
            requestAnimationFrame(() => requestAnimationFrame(() => { cover.style.transform = 'translateY(0)'; }));
            setTimeout(() => { window.location.href = 'chats.html'; }, 640);
        };

        // Filters live behind the header button, in a bottom sheet.
        window.openFilters = function () { document.getElementById('filterOverlay').classList.add('show'); };
        window.closeFilters = function () { document.getElementById('filterOverlay').classList.remove('show'); };
        document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeFilters(); });

        // Share the cart (native share where available, otherwise copy the link).
        window.shareCart = function () {
            const url = location.href;
            const text = 'My VERO cart';
            if (navigator.share) { navigator.share({ title: 'VERO', text, url }).catch(() => {}); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
        };

        // Clothing / Art toggle — two carts, built the same way.
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                MODE = btn.dataset.mode;
                // Fresh filters + selection per cart.
                filterCat = 'all'; filterSeller = 'all'; sortBy = 'featured'; selected.clear();
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
                render();
            });
        });

        render();

        // Rotate the cart-summary stat every 4s (like the profile's stat slider).
        setInterval(function () {
            const slides = document.querySelectorAll('#cartTicker .cart-stat');
            if (slides.length < 2) return;
            let cur = [...slides].findIndex(s => s.classList.contains('is-active'));
            if (cur < 0) cur = 0;
            slides[cur].classList.remove('is-active');
            slides[(cur + 1) % slides.length].classList.add('is-active');
        }, 4000);

        // Exit = same upward white-cover wipe as the entry animation.
        const back = document.querySelector('.back-btn');
        if (back) back.addEventListener('click', (e) => {
            e.preventDefault();
            const cover = document.createElement('div');
            cover.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:60;transform:translateY(100%);transition:transform .6s cubic-bezier(.76,0,.24,1)';
            document.body.appendChild(cover);
            requestAnimationFrame(() => requestAnimationFrame(() => { cover.style.transform = 'translateY(0)'; }));
            setTimeout(() => { window.location.href = back.getAttribute('href'); }, 620);
        });
    </script>
    <script src="vero-editor.js"></script>
</body>
</html>
