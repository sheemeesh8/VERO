<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - האזור האישי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fafafa;
            direction: rtl;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .page-hero {
            width: 100%;
            height: 50vh;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            padding-top: 140px;
            margin-top: 0;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* ==================== TABS ==================== */
        .seller-tabs {
            display: flex;
            gap: 24px;
            padding: 0 40px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            position: relative;
            z-index: 10;
        }

        .seller-tab {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 20px 0;
            color: #999;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
        }

        .seller-tab:hover {
            color: #004225;
        }

        .seller-tab.active {
            color: #004225;
            border-bottom-color: #004225;
        }

        /* ==================== TAB CONTENT ==================== */
        .tab-content {
            display: none;
            padding: 40px;
            background: white;
            min-height: 600px;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            color: #004225;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        /* ==================== PRODUCT GRID (matches the feed) ==================== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
        }

        .product-card {
            background: white;
            border: none;
            overflow: hidden;
            transition: transform 0.5s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            text-decoration: none;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: #F0F0F0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-info {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 5;
        }

        .product-seller {
            font-size: 16.5px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 9px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-name-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 6px;
            gap: 12px;
        }

        .product-name {
            font-size: 21px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .product-price {
            font-size: 21px;
            color: #000;
            font-weight: 700;
            text-align: left;
            flex-shrink: 0;
        }

        .product-rating {
            font-size: 16.5px;
            color: #666;
            font-weight: 400;
        }

        /* Order status pill shown on order cards */
        .order-status {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 6;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .order-status.delivered {
            background: #004225;
            color: white;
        }

        .order-status.shipping {
            background: #e8f0eb;
            color: #004225;
        }

        .order-date {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 18px;
            line-height: 1.8;
        }

        .empty-state .btn-primary {
            margin-top: 24px;
        }

        /* ==================== PROFILE FORM ==================== */
        .profile-form {
            max-width: 560px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #004225;
        }

        .btn-primary {
            background: #004225;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: #003319;
        }

        /* ==================== TOASTS ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #004225;
            color: white;
            padding: 14px 22px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateX(-120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero-title {
                font-size: 40px;
            }
        }

        @media (max-width: 768px) {
            .header-left {
                display: none;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <button class="icon-btn" title="חזרה לחנות" onclick="backToMain()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="fill: white;">
                        <circle cx="12" cy="8" r="4.2"/>
                        <path d="M12 13.5c-4.5 0-8.2 2.9-8.2 6.5h16.4c0-3.6-3.7-6.5-8.2-6.5z"/>
                    </svg>
                </button>
            </div>
            <div class="logo" onclick="backToMain()">vero</div>
            <div class="header-left"></div>
        </div>
    </header>

    <!-- ==================== PAGE HERO ==================== -->
    <div class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">האזור האישי שלי</h1>
            <p class="hero-subtitle">כל ההזמנות, המועדפים והפרטים שלך במקום אחד</p>
        </div>
    </div>

    <!-- ==================== TABS ==================== -->
    <div class="seller-tabs">
        <button class="seller-tab active" onclick="switchTab('orders')">ההזמנות שלי</button>
        <button class="seller-tab" onclick="switchTab('favorites')">המועדפים שלי</button>
        <button class="seller-tab" onclick="switchTab('details')">הפרטים שלי</button>
    </div>

    <!-- ==================== ORDERS TAB ==================== -->
    <div id="orders" class="tab-content active">
        <div class="container">
            <h2 class="section-title">ההזמנות שלי</h2>
            <div class="products-grid" id="ordersGrid"></div>
        </div>
    </div>

    <!-- ==================== FAVORITES TAB ==================== -->
    <div id="favorites" class="tab-content">
        <div class="container">
            <h2 class="section-title">המועדפים שלי</h2>
            <div id="favoritesBody"></div>
        </div>
    </div>

    <!-- ==================== DETAILS TAB ==================== -->
    <div id="details" class="tab-content">
        <div class="container">
            <h2 class="section-title">הפרטים שלי</h2>
            <div class="profile-form">
                <div class="form-group">
                    <label class="form-label">שם מלא</label>
                    <input type="text" class="form-input" id="buyerName" placeholder="השם שלך">
                </div>
                <div class="form-group">
                    <label class="form-label">אימייל</label>
                    <input type="email" class="form-input" id="buyerEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">מספר טלפון</label>
                    <input type="tel" class="form-input" id="buyerPhone" placeholder="+972 50 000 0000">
                </div>
                <div class="form-group">
                    <label class="form-label">כתובת למשלוח</label>
                    <input type="text" class="form-input" id="buyerAddress" placeholder="רחוב, עיר, מיקוד">
                </div>
                <button class="btn-primary" onclick="saveProfile()">שמור פרטים</button>
            </div>
        </div>
    </div>

    <!-- ==================== TOASTS ==================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Sample past orders for the buyer (no real order store yet)
        const sampleOrders = [
            { name: 'טי-שירט לבן קלאסי', price: '₪49.90', icon: '👕', category: 'קז\'ואל', seller: 'Basics Co', rating: 4.7, date: '2026-06-28', status: 'delivered' },
            { name: 'ג\'ינס סקיני כחול', price: '₪189.00', icon: '👖', category: 'ג\'ינס', seller: 'Denim House', rating: 4.6, date: '2026-06-21', status: 'delivered' },
            { name: 'סניקרס לבן קלאסי', price: '₪150.00', icon: '👟', category: 'סניקרס', seller: 'Basics Co', rating: 4.8, date: '2026-07-02', status: 'shipping' },
            { name: 'הודי אפור', price: '₪139.00', icon: '🧥', category: 'הודיס', seller: 'Street Style', rating: 4.6, date: '2026-07-05', status: 'shipping' },
        ];

        // Build a product-page URL for an item (mirrors the store's helper)
        function productPageUrl(item) {
            const data = {
                name: item.name,
                price: item.price,
                icon: item.icon,
                category: item.category,
                seller: item.seller,
                rating: item.rating,
                type: item.type || 'clothing'
            };
            return `product.html?product=${encodeURIComponent(JSON.stringify(data))}`;
        }

        function starString(rating) {
            const r = rating || 4.5;
            return '★'.repeat(Math.floor(r)) + (r % 1 >= 0.5 ? '☆' : '');
        }

        function productCardHTML(item, extras = '') {
            return `
                <a href="${productPageUrl(item)}" class="product-card">
                    <div class="product-image">${item.icon}${extras}</div>
                    <div class="product-info">
                        <div class="product-seller">${item.seller || 'Vero Store'}</div>
                        <div class="product-name-price">
                            <div class="product-name">${item.name}</div>
                            <div class="product-price">${item.price}</div>
                        </div>
                        <div class="product-rating">${starString(item.rating)} ${item.rating || 4.5}</div>
                    </div>
                </a>
            `;
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            if (!sampleOrders.length) {
                grid.outerHTML = '<div class="empty-state">אין לך הזמנות עדיין 🛍️<br>צא לקניות בחנות שלנו</div>';
                return;
            }
            grid.innerHTML = sampleOrders.map(order => {
                const statusLabel = order.status === 'delivered' ? 'נמסר' : 'בדרך אליך';
                const pill = `<span class="order-status ${order.status}">${statusLabel}</span>`;
                const dateNote = `<div class="order-date">הוזמן ב-${order.date}</div>`;
                // append the date note inside product-info by injecting after the card
                const card = productCardHTML(order, pill);
                return card.replace('</a>', dateNote + '</a>');
            }).join('');
        }

        function renderFavorites() {
            const body = document.getElementById('favoritesBody');
            const wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');
            if (!wishlist.length) {
                body.innerHTML = '<div class="empty-state">רשימת המועדפים ריקה 💚<br>הוסף מוצרים שאהבת מהחנות</div>';
                return;
            }
            body.innerHTML = `<div class="products-grid">${wishlist.map(item => productCardHTML(item)).join('')}</div>`;
        }

        // ==================== TABS ====================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.seller-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'orders') renderOrders();
            else if (tabName === 'favorites') renderFavorites();
        }

        // ==================== PROFILE ====================
        function saveProfile() {
            const profile = {
                name: document.getElementById('buyerName').value,
                email: document.getElementById('buyerEmail').value,
                phone: document.getElementById('buyerPhone').value,
                address: document.getElementById('buyerAddress').value
            };
            localStorage.setItem('vero_buyer_profile', JSON.stringify(profile));
            showToast('הפרטים נשמרו בהצלחה! ✅');
        }

        function loadProfile() {
            const profile = JSON.parse(localStorage.getItem('vero_buyer_profile') || '{}');
            if (profile.name) document.getElementById('buyerName').value = profile.name;
            if (profile.email) document.getElementById('buyerEmail').value = profile.email;
            if (profile.phone) document.getElementById('buyerPhone').value = profile.phone;
            if (profile.address) document.getElementById('buyerAddress').value = profile.address;
        }

        // ==================== TOASTS ====================
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        // ==================== NAVIGATION ====================
        function backToMain() {
            window.location.href = 'index.html';
        }

        // Initialize
        renderOrders();
        loadProfile();
    </script>
</body>
</html>
