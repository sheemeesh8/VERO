    <!-- Feed typography (matches index.html's cv-feed): Archivo display + Arimo body. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Arimo:wght@400;500;600;700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; }
        body { background: #fff; color: #111; -webkit-font-smoothing: antialiased; }

        /* ===== Collections feed — 1:1 with index.html's cv-feed ===== */
        .cv-feed { direction: ltr; background: #fff; color: #111; max-width: 100%; overflow-x: clip; padding: 60px 0; }
        .cv-feed * { box-sizing: border-box; }
        .cv-feed .cv-wrap { padding: 0 20px; }

        /* shared type */
        .cv-feed .cv-h1 { font-family: 'Poppins','Archivo',sans-serif; font-weight: 700; color: #fff; line-height: 0.88; letter-spacing: -0.5px; }
        .cv-feed .cv-mega { font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; color: #fff; line-height: 0.92; letter-spacing: -1px; }
        .cv-feed .cv-eyebrow { font-family: 'Arimo','Inter',sans-serif; letter-spacing: 3px; text-transform: uppercase; font-size: 12px; color: #fff; }

        /* SHOW MORE divider */
        .cv-feed .cv-showmore { display: none !important; }
        .cv-feed .cv-showmore::before, .cv-feed .cv-showmore::after { content: ""; flex: 1 1 0; height: 1.5px; background: #111; }
        .cv-feed .cv-showmore span { font-family: 'Archivo','Inter',sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #111; white-space: nowrap; }
        .cv-feed .cv-showmore:hover span { color: #B3433B; }

        /* product grid */
        .cv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 8px; margin: 22px -12px 0; }
        .cv-card { text-decoration: none; color: #1b1916; display: block; min-width: 0; }
        .cv-card-img { width: 100%; aspect-ratio: 0.82; background: #efece6; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cv-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .cv-card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 9px; }
        .cv-card-name { font-family: 'Archivo','Inter',sans-serif; font-size: 13px; line-height: 1.3; font-weight: 400; letter-spacing: 0.4px; text-transform: uppercase; color: #1b1916; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; }
        .cv-card-price { font-family: 'Archivo','Inter',sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.3px; color: #1b1916; white-space: nowrap; flex: 0 0 auto; }
        .cv-card-brand { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; color: #8a857c; margin-top: 2px; }

        /* ===== Collection hero (3:4 video, mirrors cv-coll) ===== */
        .cv-coll { position: relative; width: 100%; min-height: 75svh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 15% 26px 0; overflow: hidden; }
        .cv-coll-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .cv-coll::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.30) 55%, rgba(0,0,0,0.50) 100%); }
        .cv-coll > *:not(.cv-coll-bg):not(.cv-coll-cta) { position: relative; z-index: 2; }
        .cv-coll .cv-h1 { font-size: 15vw; max-width: 9ch; }
        .cv-coll-kicker { font-family: 'Arimo','Inter',sans-serif; letter-spacing: 3px; text-transform: uppercase; font-size: 11px; color: rgba(255,255,255,0.82); margin-bottom: 10px; }
        .cv-coll-sub { font-family: 'Arimo','Inter',sans-serif; color: #fff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; max-width: 22ch; }
        .cv-coll-rule { width: 62%; max-width: 420px; height: 1.5px; background: rgba(255,255,255,0.85); margin: 18px 0; }
        .cv-coll .chips { display: flex; gap: 8px; margin-top: 2px; }
        .cv-coll .chip-now, .cv-coll .chip-sale, .cv-coll .chip-soon { display: inline-block; padding: 7px 16px; border-radius: 999px; font-family: 'Archivo','Inter',sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
        .cv-coll .chip-now { background: #fff; color: #111; }
        .cv-coll .chip-sale { background: #B3433B; color: #fff; }
        .cv-coll .chip-soon { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.55); font-weight: 600; }
        .cv-coll-cta { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: 55%; bottom: 0; width: 44%; max-width: 200px; background: rgba(120,116,110,0.72); color: #fff; font-family: 'Archivo','Poppins',sans-serif; font-weight: 800; font-size: 16px; line-height: 1.1; text-transform: uppercase; text-decoration: none; padding: 20px 14px; display: flex; align-items: flex-start; justify-content: center; text-align: center; transition: filter 0.2s; }
        .cv-coll-cta:hover { filter: brightness(0.9); }

        /* foot under the hero */
        .cv-coll-foot { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 20px 0 6px; }
        .cv-coll-foot p { font-family: 'Arimo','Inter',sans-serif; font-size: 12.5px; line-height: 1.35; color: #1b1b1b; max-width: 60%; margin: 0; }
        .cv-coll-foot .cv-air { text-align: right; }
        .cv-coll-foot .cv-air b { font-family: 'Archivo','Inter',sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; display: block; }
        .cv-coll-foot .cv-air span { font-family: 'Archivo','Inter',sans-serif; font-weight: 800; font-size: 15px; }

        /* category band under the grid (mirrors cv-catband) */
        .cv-catband { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-top: 26px; }
        .cv-catband p { font-family: 'Arimo','Inter',sans-serif; font-size: 12.5px; line-height: 1.3; color: #1b1b1b; max-width: 56%; margin: 0; }
        .cv-catband .cv-cat-r { text-align: right; }
        .cv-catband .cv-cat-r b { font-family: 'Archivo','Inter',sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; display: block; }
        .cv-catband .cv-cat-r span { font-family: 'Arimo','Inter',sans-serif; font-size: 12px; color: #6a6a66; }

        /* link reset */
        .cv-feed a, .cv-feed a:link, .cv-feed a:visited, .cv-feed a:hover, .cv-feed a:active { text-decoration: none !important; }
        .cv-coll-cta, .cv-coll-cta * { color: #fff !important; }

        @media (min-width: 560px) {
          .cv-grid { grid-template-columns: repeat(3, 1fr); }
          .cv-coll .cv-h1 { font-size: 90px; }
        }
    </style>

    <!-- Shared page header (assets/page-header.css): title left, back arrow right. -->

    <!-- Collections rendered 1:1 with the home feed: a 3:4 hero per collection
         (video + centred copy + a corner rectangle CTA) followed by that
         collection's product grid and a Show more divider. -->
    <main class="cv-feed" id="colFeed"></main>

    <script src="product-overrides.js"></script>
    <script src="collections.js"></script>
    <script>
        (function () {
            var VC = window.veroCollections;
            function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
            function hash(s){s=String(s);var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
            function hrefOf(p){
                var o={name:p.name,price:p.price,icon:p.icon,category:p.category,seller:p.seller,rating:4.7,type:'clothing'};
                return 'product-showcase.html?product='+encodeURIComponent(JSON.stringify(o));
            }
            var CARD_IMGS=['assets/hero/women-editorial.jpg','women-hero.jpg','men-hero.jpg','clothing-hero.jpg','hero-beach.jpg','gallery-hero.jpg'];
            function media(p){ var src=p.cover||CARD_IMGS[hash(p.name||p.id||'x')%CARD_IMGS.length]; return '<img src="'+esc(src)+'" alt="'+esc(p.name||'')+'" loading="lazy">'; }
            function cardPrice(n){return (Math.round(Number(n)||0)).toLocaleString('en-US').replace(/,/g,' ')+' ₪';}
            function cardHTML(p){
                return '<a class="cv-card" href="'+esc(hrefOf(p))+'">'+
                    '<div class="cv-card-img">'+media(p)+'</div>'+
                    '<div class="cv-card-row"><span class="cv-card-name">'+esc(p.name||p.category)+'</span><span class="cv-card-price">'+cardPrice(p.price)+'</span></div>'+
                    '<div class="cv-card-brand">'+esc(p.seller||'')+'</div>'+
                '</a>';
            }
            var monthName = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            var HERO_VIDEO = 'assets/hero/unisex.mp4';   // feed-style moving hero; collection image is the poster

            function collectionList() {
                var curr = VC.currentKey(), sale = VC.saleKey();
                var isArt = false;
                try { isArt = localStorage.getItem('vero_category') === 'art'; } catch (e) {}
                if (new URLSearchParams(location.search).get('mode') === 'art') isArt = true;
                // Only the in-season collection (the end-of-season/sale one is omitted).
                var keys = isArt ? VC.artList().map(function (c) { return c.key; }) : [curr];
                var seen = {}, out = [];
                keys.forEach(function (k) { var c = VC.get(k); if (c && !seen[k]) { seen[k] = 1; out.push(c); } });
                return { list: out, curr: curr, sale: sale };
            }

            function build() {
                if (!VC || typeof VC.byCollection !== 'function') return;
                var info = collectionList(), curr = info.curr, sale = info.sale;
                var html = info.list.map(function (c) {
                    var prods = VC.byCollection(c.key);
                    var months = c.art ? (c.tagline || '') : c.months.map(function (m) { return monthName[m]; }).join(' · ');
                    var href = c.art ? 'interiors.html' : 'collection.html?c=' + c.key;
                    var chips = '';
                    if (c.key === curr) chips += '<span class="chip-now">In season now</span>';
                    if (c.key === sale) chips += '<span class="chip-sale">End of season · −' + c.eos + '%</span>';
                    if (c.art) chips += '<span class="chip-now">For interior designers</span>';
                    var grid = prods.slice(0, 4).map(cardHTML).join('');
                    return '<section class="cv-coll">' +
                            '<video class="cv-coll-bg" src="' + HERO_VIDEO + '" poster="' + esc(c.hero) + '" autoplay muted loop playsinline aria-hidden="true"></video>' +
                            '<div class="cv-coll-kicker">moravchick · Collection</div>' +
                            '<h1 class="cv-h1">' + esc(c.he) + '</h1>' +
                            (months ? '<p class="cv-coll-sub">' + esc(months) + '</p>' : '') +
                            '<div class="cv-coll-rule"></div>' +
                            (chips ? '<div class="chips">' + chips + '</div>' : '') +
                            '<a class="cv-coll-cta" href="' + href + '">View the<br>collection</a>' +
                        '</section>' +
                        '<div class="cv-wrap">' +
                            '<div class="cv-coll-foot">' +
                                '<p>As the season turns, our ' + esc(c.he) + ' Collection introduces a refined palette of rich textures and classic silhouettes.</p>' +
                                '<div class="cv-air"><b>Items on air</b><span>' + prods.length + '</span></div>' +
                            '</div>' +
                            '<div class="cv-grid">' + grid + '</div>' +
                            '<div class="cv-catband">' +
                                '<p>clothing, footwear, accessories, and grooming tailored for adults. It combines tailored fits, functional design,</p>' +
                                '<div class="cv-cat-r"><b>Choose by category</b><span>Slide for more</span></div>' +
                            '</div>' +
                            '<a class="cv-showmore" href="' + href + '"><span>Show more</span></a>' +
                        '</div>';
                }).join('');
                document.getElementById('colFeed').innerHTML = html;
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
            // veroCollections may hydrate late — retry briefly.
            var tries = 0, t = setInterval(function () {
                VC = window.veroCollections;
                if ((VC && VC.byCollection && VC.byCollection(VC.currentKey()).length) || tries++ > 20) { clearInterval(t); if (VC) build(); }
            }, 200);
        })();
    </script>

    <script src="reveal.js" defer></script>
<script src="assets/line-icons.js"></script>
