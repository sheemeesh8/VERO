<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>moravchick · Sign up</title>
<!-- Phone-mode handoff: when opened top-level, render inside the shared phone
     frame (same as index.html). Inside the frame this is skipped. -->
<script>if (window.self === window.top) { location.replace('phone-frame.html#page=signup.html'); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --f-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        --f-serif: 'Bodoni Moda', 'Didot', Georgia, serif;
        --line: rgba(255,255,255,0.28);
        --muted: rgba(255,255,255,0.6);
        --err: #e5807f;
        /* Entrance easing shared by every animated element. */
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
        font-family: var(--f-sans); color: #fff; background: #000;
        display: flex; align-items: stretch; justify-content: center;
        overflow: hidden;
    }

    /* Two full-height panels share one stage; the welcome fades out and the form
       fades in when the visitor continues. */
    .stage { position: relative; width: 100%; max-width: 460px; }
    .panel {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center;
        padding: 40px 30px calc(40px + env(safe-area-inset-bottom, 0px));
        transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    }
    /* Panel switch: the outgoing panel drifts up and fades, the incoming rises in. */
    .panel.is-hidden { opacity: 0; transform: translateY(-18px); pointer-events: none; }
    .panel.is-waiting { opacity: 0; transform: translateY(18px); pointer-events: none; }

    /* ---- Welcome panel ---- */
    .brand {
        text-align: center; font-family: var(--f-serif);
        font-size: clamp(34px, 11vw, 46px); font-weight: 500;
        letter-spacing: 0.22em; text-indent: 0.22em;
        margin: 0 auto 0; line-height: 1; color: #fff;
    }
    .brand-logo { display: block; height: 40px; margin: 0 auto; object-fit: contain; }
    .welcome {
        text-align: center; font-family: var(--f-sans); font-weight: 200;
        font-size: clamp(26px, 8vw, 34px); letter-spacing: 0.01em;
        margin: 26px 0 0; color: #fff;
    }
    .welcome-gap { flex: 0 0 12vh; }

    .field-label {
        font-family: var(--f-sans); font-size: 12px; font-weight: 300;
        letter-spacing: 0.02em; color: rgba(255,255,255,0.85); margin: 0 0 6px;
    }
    /* Country selector — a native select styled as a bottom-ruled line with a
       chevron on the right (mirrors the Gucci welcome control). */
    .select-line { position: relative; border-bottom: 1px solid var(--line); }
    .select-line select {
        width: 100%; appearance: none; -webkit-appearance: none; -moz-appearance: none;
        background: transparent; border: none; outline: none;
        color: #fff; font-family: inherit; font-size: 16px; font-weight: 300;
        padding: 10px 30px 12px 0; cursor: pointer;
    }
    .select-line select:invalid { color: rgba(255,255,255,0.55); }
    .select-line select option { color: #111; }
    .select-line::after {
        content: ''; position: absolute; right: 4px; top: 50%; width: 9px; height: 9px;
        border-right: 1.4px solid rgba(255,255,255,0.8); border-bottom: 1.4px solid rgba(255,255,255,0.8);
        transform: translateY(-70%) rotate(45deg); pointer-events: none;
    }

    .cta {
        width: 100%; border: none; border-radius: 2px; margin-top: 26px;
        padding: 18px; font-family: var(--f-sans); font-size: 13px; font-weight: 500;
        letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer;
        background: #6a6a6a; color: rgba(255,255,255,0.75);
        transition: background 0.35s var(--ease), color 0.35s var(--ease), opacity 0.2s;
    }
    .cta.ready { background: #fff; color: #000; }
    .cta.ready:hover { opacity: 0.86; }
    .cta:disabled { cursor: default; }

    /* ---- Form panel ---- */
    .form-title {
        font-family: var(--f-serif); font-size: clamp(22px, 6.5vw, 28px); font-weight: 500;
        letter-spacing: 0.02em; text-align: center; margin: 0 0 4px; color: #fff;
    }
    .form-sub {
        text-align: center; font-family: var(--f-sans); font-weight: 300; font-size: 12.5px;
        letter-spacing: 0.03em; color: var(--muted); margin: 0 0 30px;
    }
    .field { margin-bottom: 22px; }
    .field label {
        display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(255,255,255,0.6); margin-bottom: 8px; font-weight: 300;
    }
    .field input {
        width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
        color: #fff; font-family: inherit; font-size: 16px; font-weight: 300;
        padding: 8px 2px 10px; direction: ltr; text-align: left; border-radius: 0;
    }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus { outline: none; border-bottom-color: #fff; }
    .note { min-height: 16px; margin: 4px 0 0; font-size: 12px; color: var(--err); text-align: center; }
    .foot { text-align: center; margin-top: 26px; font-size: 13px; color: var(--muted); font-weight: 300; }
    .foot a { color: #fff; font-weight: 500; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.5); padding-bottom: 1px; }
    .back {
        position: absolute; top: 22px; left: 24px; background: none; border: none; cursor: pointer;
        color: rgba(255,255,255,0.75); font-size: 22px; line-height: 1; padding: 6px;
    }

    /* ---- Entrance animations (staggered rise + fade) ---- */
    @keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes brandIn { from { opacity: 0; transform: translateY(16px); letter-spacing: 0.5em; } to { opacity: 1; transform: translateY(0); letter-spacing: 0.22em; } }
    .anim { opacity: 0; animation: riseIn 0.9s var(--ease) both; }
    .brand.anim { animation: brandIn 1.15s var(--ease) both; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.55s; }
    .d3 { animation-delay: 0.85s; }
    .d4 { animation-delay: 1.05s; }
    @media (prefers-reduced-motion: reduce) {
        .anim, .brand.anim { animation: none; opacity: 1; }
        .panel { transition: none; }
    }
</style>
</head>
<body>
  <div class="stage">
    <!-- ============ Welcome (Gucci-style) ============ -->
    <section class="panel" id="welcomePanel">
        <div class="welcome-gap"></div>
        <img src="peacock-logo-white.png?v=1" alt="moravchick" class="brand-logo anim"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand anim',textContent:'moravchick'}))">
        <h1 class="welcome anim d1">Welcome to moravchick</h1>
        <div class="welcome-gap"></div>

        <p class="field-label anim d2">Select your country/region</p>
        <div class="select-line anim d2">
            <select id="country" required aria-label="Select your country/region">
                <option value="" disabled selected hidden></option>
            </select>
        </div>

        <button type="button" class="cta anim d3" id="continueBtn" disabled>Continue</button>
    </section>

    <!-- ============ Account form ============ -->
    <section class="panel is-waiting" id="formPanel" aria-hidden="true">
        <button type="button" class="back" id="backBtn" aria-label="Back">&#8249;</button>
        <h2 class="form-title">Create your account</h2>
        <p class="form-sub" id="formSub">Shopping in <span id="formCountry">—</span></p>
        <form id="signupForm" autocomplete="on">
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
            </div>
            <button type="submit" class="cta ready">Sign up and continue</button>
            <p class="note" id="note"></p>
        </form>
        <div class="foot">Already have an account? <a href="login.html">Sign in</a></div>
    </section>
  </div>

    <script src="auth.js"></script>
    <script>
    (function () {
        // A compact but representative country/region list; the user's pick is kept
        // for later use (shipping region, currency, etc.).
        var COUNTRIES = [
            'Israel','United States','United Kingdom','Canada','Australia','France','Germany',
            'Italy','Spain','Portugal','Netherlands','Belgium','Switzerland','Austria','Ireland',
            'Denmark','Sweden','Norway','Finland','Iceland','Poland','Czechia','Greece','Turkey',
            'United Arab Emirates','Saudi Arabia','Qatar','Japan','South Korea','China','Hong Kong',
            'Singapore','India','Brazil','Mexico','Argentina','South Africa','New Zealand'
        ].sort(function (a, b) { return a.localeCompare(b); });

        var sel = document.getElementById('country');
        COUNTRIES.forEach(function (c) {
            var o = document.createElement('option');
            o.value = c; o.textContent = c;
            sel.appendChild(o);
        });
        // Pre-select a previously chosen region, if any.
        try {
            var saved = localStorage.getItem('vero_country');
            if (saved && COUNTRIES.indexOf(saved) >= 0) sel.value = saved;
        } catch (e) {}

        var cta = document.getElementById('continueBtn');
        function refreshCta() { cta.disabled = !sel.value; cta.classList.toggle('ready', !!sel.value); }
        refreshCta();
        sel.addEventListener('change', refreshCta);

        var welcome = document.getElementById('welcomePanel');
        var formP = document.getElementById('formPanel');

        function showForm() {
            if (!sel.value) return;
            try { localStorage.setItem('vero_country', sel.value); } catch (e) {}
            document.getElementById('formCountry').textContent = sel.value;
            welcome.classList.add('is-hidden');
            formP.classList.remove('is-waiting');
            formP.setAttribute('aria-hidden', 'false');
            setTimeout(function () {
                var n = document.getElementById('name'); if (n) n.focus();
            }, 620);
        }
        function showWelcome() {
            formP.classList.add('is-waiting');
            formP.setAttribute('aria-hidden', 'true');
            welcome.classList.remove('is-hidden');
        }
        cta.addEventListener('click', showForm);
        document.getElementById('backBtn').addEventListener('click', showWelcome);

        // ---- Account creation (unchanged auth flow) ----
        if (VeroAuth.guard('auth')) {
            document.getElementById('signupForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var note = document.getElementById('note'); note.textContent = '';
                var pw = document.getElementById('password').value;
                if (pw.length < 6) { note.textContent = 'The password must contain at least 6 characters.'; return; }
                try {
                    VeroAuth.signUp(
                        document.getElementById('email').value,
                        pw,
                        document.getElementById('name').value.trim()
                    );
                    location.href = 'onboarding.html';   // new user → onboarding quiz
                } catch (err) {
                    note.textContent = err.message === 'EMAIL_TAKEN'
                        ? 'An account with this email already exists.'
                        : 'We couldn\'t create the account. Try again.';
                }
            });
        }
    })();
    </script>
    <script src="assets/didone-hairline.js"></script>
</body>
</html>
