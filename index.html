<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERO - Fashion & Art Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: white;
            direction: rtl;
            letter-spacing: 0px;
            color: #000;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ==================== HEADER ==================== */
        header {
            background: transparent;
            border-bottom: none;
            padding: 24px 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            width: 100%;
        }

        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-width: none;
            margin: 0 auto;
            padding: 0 40px;
            gap: 60px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            justify-content: flex-end;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: white;
            font-style: normal;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-button {
            background: none;
            border: none;
            font-size: 12px;
            color: white;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
        }

        .nav-button:hover {
            color: #d0d0d0;
        }

        .toggle-switch {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px;
        }

        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 18px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            color: white;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* ==================== HERO ==================== */
        .hero {
            width: 100vw;
            aspect-ratio: 7 / 3;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            color: rgba(255, 255, 255, 0.1);
            margin: 0;
            padding: 0;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -24px;
            padding-top: 50px;
        }

        /* ==================== GRID ==================== */
        .grid-section {
            width: 100vw;
            padding: 50px 40px 50px 40px;
            display: grid;
            grid-template-columns: 0.65fr 0.65fr 0.65fr 2.05fr;
            gap: 20px;
            height: 720px;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        .grid-item {
            background: #f8f8f8;
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: rgba(0, 66, 37, 0.08);
        }

        /* ==================== CATEGORIES ==================== */
        .categories-section {
            padding: 40px 40px;
            background: white;
            border-top: 1px solid #eee;
            margin-top: 0;
        }

        .section-title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #000;
            display: none;
        }

        .categories-wrapper {
            position: relative;
        }

        .categories-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0;
            scrollbar-width: none;
        }

        .categories-grid::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            background: #f8f8f8;
            border: none;
            border-radius: 8px;
            padding: 0;
            display: flex;
            flex-direction: column;
            aspect-ratio: 9 / 12;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
            flex: 0 0 calc(25% - 15px);
            min-width: 220px;
        }

        .category-card:hover {
            transform: translateY(-4px);
            background: #f0f0f0;
        }

        .category-text {
            position: absolute;
            bottom: 16px;
            right: 16px;
            left: 16px;
            background: white;
            padding: 12px;
            text-align: right;
            z-index: 2;
            border-radius: 6px;
        }

        .category-text h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0;
            color: #000;
            letter-spacing: 0px;
        }

        .category-text p {
            font-size: 13px;
            color: #999;
            margin-bottom: 0;
            display: none;
        }

        .category-btn {
            display: none;
        }

        .category-icon {
            font-size: 140px;
            color: rgba(0, 66, 37, 0.06);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .category-nav:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .category-nav svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
        }

        .category-nav.prev {
            left: 20px;
        }

        .category-nav.next {
            right: 20px;
        }

        /* ==================== FEED ==================== */
        .feed-section {
            padding: 45px 0;
            background: white;
        }

        /* Feed uses the full page width so the 5-up product grid can breathe;
           the 30px horizontal padding matches the grid gap for even edges. */
        .feed-section .container {
            max-width: none;
            padding: 0;
        }

        .feed-block {
            background: white;
            margin-bottom: 90px;
            padding: 60px 30px;
            border-radius: 0;
        }

        .featured-product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 120px;
            align-items: center;
            margin-bottom: 60px;
            padding-bottom: 60px;
            border-bottom: 1px solid #e0e0e0;
        }

        .featured-product.flipped {
            grid-template-columns: 1fr 1fr;
            direction: ltr;
        }

        .featured-product.flipped .featured-image {
            order: -1;
        }

        .featured-text {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .featured-brand {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .featured-text h3 {
            font-size: 48px;
            font-weight: 700;
        }

        .featured-category {
            font-size: 19.5px;
            color: #004225;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .featured-text p {
            font-size: 19.5px;
            color: #666;
            line-height: 1.6;
        }

        .featured-price {
            font-size: 27px;
            color: #000;
            font-weight: 700;
        }

        .featured-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
        }

        .featured-btn:hover {
            background: #003319;
        }

        .featured-image {
            width: 100%;
            height: 750px;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 240px;
            color: rgba(0, 66, 37, 0.1);
        }

        .products-label {
            font-size: 24px;
            margin: 45px 0 30px 0;
            font-weight: 400;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 45px;
        }

        .product-card {
            background: white;
            border: none;
            overflow: hidden;
            transition: transform 0.5s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .product-card:hover {
            transform: none;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: #F0F0F0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            font-size: 50px;
            color: rgba(0, 66, 37, 0.1);
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        .product-card:hover .product-image {
            transform: scale(1.02);
        }

        .product-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            top: 18px;
            padding: 0;
        }

        .product-icon:hover {
            transform: scale(1.1);
        }

        .product-icon.cart {
            right: 18px;
        }

        .product-icon.heart {
            right: 84px;
        }

        .product-icon svg {
            width: 33px;
            height: 33px;
            stroke: #1a1a1a;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .product-icon.heart svg {
            fill: none;
        }

        .product-info {
            padding: 18px 18px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 5;
            border-radius: 2px;
        }

        .product-name-price {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 6px;
        }

        .product-seller {
            font-size: 16.5px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 9px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-name {
            font-size: 21px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 0;
        }

        .product-rating {
            font-size: 16.5px;
            color: #666;
            margin-top: 0;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-label {
            display: none;
        }

        .product-price {
            font-size: 21px;
            color: #000;
            font-weight: 700;
            margin-bottom: 0;
            text-align: left;
            position: static;
        }

        .product-footer {
            display: none;
        }

        .product-btn {
            display: none;
        }

        .product-heart {
            display: none;
        }

        .load-more {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* ==================== ICON BADGES ==================== */
        .icon-wrap {
            position: relative;
            display: inline-flex;
        }

        .badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .badge.show {
            display: flex;
        }

        .product-heart.active {
            background: #fdecea;
            border-color: #c0392b;
        }

        /* ==================== PAGE HERO (full-width, blended with header) ==================== */
        .page-hero {
            width: 100vw;
            margin: 0;
            margin-left: -50vw;
            margin-right: -50vw;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            min-height: 500px;
        }

        .hero-content {
            max-width: 1600px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            direction: rtl;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-slash {
            font-size: 48px;
            color: #004225;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 300;
            color: #000;
            margin: 0;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 1px;
        }

        .hero-description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }

        .hero-checkout-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
            width: fit-content;
            border-radius: 2px;
        }

        .hero-checkout-btn:hover {
            background: #003319;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #e8e3de 0%, #f5f1ed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            border-radius: 4px;
        }

        /* ==================== CART CATEGORY TABS (borderless, labels only) ==================== */
        .page-hero .cart-tabs {
            width: 100%;
            max-width: 1600px;
            margin: -1px auto 0;
            padding: 0 40px 0 40px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            direction: ltr;
        }

        .cart-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            padding: 0 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 40px;
        }

        .cart-tab {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: #999;
            padding: 0;
            transition: color 0.25s;
            text-transform: uppercase;
            font-weight: 600;
        }

        .cart-tab:hover {
            color: #004225;
        }

        .cart-tab.active {
            color: #004225;
        }

        /* ==================== CART PAGE BODY ==================== */
        .cart-page-body {
            padding: 10px 0 80px 0;
        }

        .cart-group {
            margin-bottom: 40px;
        }

        .cart-group-title {
            font-size: 22px;
            font-weight: 400;
            color: #004225;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .cart-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .cart-card {
            background: white;
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .cart-card-img {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, #efefef 0%, #f9f9f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            position: relative;
        }

        .cart-card-info {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cart-card-seller {
            font-size: 11px;
            color: #999;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-family: 'Segoe UI', sans-serif;
        }

        .cart-card-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .cart-card-rating {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .cart-card-price {
            font-size: 15px;
            color: #004225;
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 12px;
        }

        .cart-card-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .cart-card-controls .qty-btn {
            display: none;
        }

        .cart-card-controls .qty-num {
            display: none;
        }

        .cart-card-remove {
            background: none;
            border: none;
            color: #c0392b;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-summary {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            padding-top: 24px;
            border-top: 2px solid #004225;
        }

        .cart-summary-total {
            font-size: 24px;
            font-family: 'Segoe UI', sans-serif;
            color: #004225;
            font-weight: 700;
        }

        .cart-checkout-btn {
            background: #004225;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
        }

        .cart-checkout-btn:hover {
            background: #003319;
        }

        /* ==================== CART HERO (5:3 full-width) ==================== */
        .cart-hero {
            width: 100%;
            max-width: 100vw;
            height: 480px;
            background: linear-gradient(135deg, #004225 0%, #0a6b3f 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .cart-empty {
            text-align: center;
            color: #999;
            padding: 80px 20px;
            font-size: 18px;
        }

        /* ==================== TOAST ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #004225;
            color: white;
            padding: 14px 22px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateX(-120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .grid-section {
                grid-template-columns: 1fr 1fr;
                height: auto;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .featured-product {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header-container {
                grid-template-columns: auto 1fr auto;
                gap: 20px;
            }

            .header-left {
                display: none;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 6px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-container">
            <div class="header-right">
                <div class="toggle-switch">
                    <button class="toggle-btn active" onclick="toggleCategory(this, 'clothing')">👕 ביגוד</button>
                    <button class="toggle-btn" onclick="toggleCategory(this, 'art')">🎨 אומנות</button>
                </div>
                <span class="icon-wrap">
                    <button class="icon-btn" title="Wishlist" onclick="showToast('רשימת המשאלות בקרוב 💭')">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="stroke: white; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                    <span class="badge" id="wishlistBadge">0</span>
                </span>
                <span class="icon-wrap">
                    <button class="icon-btn" title="Cart" onclick="openCart()">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="stroke: white; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;">
                            <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                        </svg>
                    </button>
                    <span class="badge" id="cartBadge">0</span>
                </span>
                <button class="icon-btn" title="Profile">👤</button>
            </div>
            <div class="logo" onclick="showMain()" style="cursor:pointer">vero</div>
            <div class="header-left">
                <button class="nav-button">Seller Area</button>
                <button class="nav-button">מגזין</button>
                <button class="nav-button">About</button>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN VIEW ==================== -->
    <div id="mainView">
    <!-- ==================== HERO ==================== -->
    <div class="hero" id="heroImage" style="background: linear-gradient(135deg, #8B7355 0%, #D4AF8C 100%); background-size: cover; background-position: center;">
    </div>

    <!-- ==================== GRID ==================== -->
    <div class="container">
        <div class="grid-section">
            <div class="grid-item">🎨</div>
            <div class="grid-item">🖼️</div>
            <div class="grid-item">✨</div>
            <div class="grid-item">👗</div>
        </div>
    </div>

    <!-- ==================== CATEGORIES ==================== -->
    <div class="categories-section">
        <div class="container">
            <h2 class="section-title" id="categoryTitle">בחר קטגוריה: ביגוד</h2>
            <div class="categories-wrapper">
                <div class="categories-grid" id="categoriesGrid">
                    <!-- Categories will be populated by JavaScript -->
                </div>
                <button class="category-nav prev" onclick="scrollCategories(-1)">
                    <svg viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="category-nav next" onclick="scrollCategories(1)">
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== INFINITE FEED ==================== -->
    <div class="feed-section">
        <div class="container">
            <div id="feedContainer"></div>
            <div class="load-more">↓ גלול למטה לעוד מוצרים ↓</div>
        </div>
    </div>
    </div><!-- /#mainView -->

    <!-- ==================== SHOPPING CART PAGE ==================== -->
    <div id="cartView" style="display:none"></div>
    <div class="cart-hero" id="cartHero" style="display:none"></div>
    <div id="cartContainer" style="display:none">
        <div class="container" style="padding-top: 60px; padding-bottom: 60px;">
            <div id="cartPageBody"></div>
        </div>
    </div>

    <!-- ==================== TOASTS ==================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // Data
        const clothingCategories = [
            { name: 'וינטג\'', desc: 'בגדים ואקססוריז מימים עברים', icon: '👕' },
            { name: 'ספורט', desc: 'נעליים וביגוד ספורטיבי', icon: '👟' },
            { name: 'אקססוריז', desc: 'תיקות, חגורות ותכשיטים', icon: '👜' },
            { name: 'שמלות', desc: 'שמלות לכל אירוע', icon: '👗' },
            { name: 'חולצות', desc: 'חולצות וטי-שירטים', icon: '👕' },
            { name: 'מכנסיים', desc: 'ג\'ינס וביגוד תחתון', icon: '👖' },
            { name: 'עור', desc: 'מעילים וביגוד עור', icon: '🧥' },
            { name: 'תכשיטים', desc: 'שרשראות וטבעות', icon: '💎' },
            { name: 'כובעים', desc: 'כובעים וכיסויי ראש', icon: '🎩' },
            { name: 'נעליים', desc: 'נעליים לכל סגנון', icon: '👞' },
            { name: 'חגורות', desc: 'חגורות עור וינטג\'', icon: '🎀' },
            { name: 'כפפות', desc: 'כפפות וחורביים', icon: '🧤' }
        ];

        const artCategories = [
            { name: 'ציורים', desc: 'ציורים יד שנייה ומקוריים', icon: '🎨' },
            { name: 'הדפסות', desc: 'פוסטרים והדפסות וינטג\'', icon: '🖼️' },
            { name: 'פסלונים', desc: 'פסלונים וקולקציות אומנות', icon: '✨' },
            { name: 'ציור שמן', desc: 'ציורים בטכניקה קלאסית', icon: '🎭' },
            { name: 'גרפיקה', desc: 'עיצובים גרפיים ודיגיטליים', icon: '🖌️' },
            { name: 'צילום', desc: 'צילומים אמנותיים מקוריים', icon: '📸' },
            { name: 'קולאז\'', desc: 'יצירות קולאז\' וקולה גריט', icon: '✂️' },
            { name: 'קרמיקה', desc: 'כלים וקרמיקה אמנותית', icon: '🏺' },
            { name: 'פיסול', desc: 'פסלים ופריטי פיסול', icon: '🗿' },
            { name: 'תכשיטים אמנות', desc: 'תכשיטים אמנותיים', icon: '💍' },
            { name: 'ויטראז\'', desc: 'אומנות ויטראז\' וזכוכית', icon: '🌈' },
            { name: 'טקסטיל', desc: 'יצירות אמנות טקסטיל', icon: '🧵' }
        ];

        const clothingProducts = [
            { name: 'ז\'קט דנים קלאסי', category: 'וינטג\'', price: '₪89.99', icon: '👕', seller: 'Vintage Store', rating: 4.8 },
            { name: 'שמלה שחורה', category: 'אלגנטי', price: '₪120.00', icon: '👗', seller: 'Fashion House', rating: 4.9 },
            { name: 'סניקרס לבן', category: 'ספורט', price: '₪150.00', icon: '👟', seller: 'Sports Co', rating: 4.7 },
            { name: 'תיקה עור', category: 'אקססוריז', price: '₪200.00', icon: '👜', seller: 'Leather Goods', rating: 4.6 },
            { name: 'חולצה וינטג\'', category: 'וינטג\'', price: '₪65.00', icon: '👕', seller: 'Retro Collection', rating: 5.0 }
        ];

        const artProducts = [
            { name: 'ציור אבסטרקטי', category: 'ציורים', price: '₪450.00', icon: '🎨', seller: 'Modern Art Gallery', rating: 4.9 },
            { name: 'פוסטר וינטג\'', category: 'הדפסות', price: '₪45.00', icon: '🖼️', seller: 'Poster House', rating: 4.5 },
            { name: 'ציור שמן', category: 'ציורים', price: '₪450.00', icon: '🎨', seller: 'Oil Paintings Studio', rating: 5.0 },
            { name: 'הדפס מוגבל', category: 'הדפסות', price: '₪120.00', icon: '🖼️', seller: 'Limited Editions', rating: 4.8 },
            { name: 'פסלון ברונזה', category: 'פסלונים', price: '₪800.00', icon: '✨', seller: 'Bronze Sculptures', rating: 4.7 }
        ];

        const featuredProducts = [
            {
                brand: 'Vintage Collection',
                name: 'ז\'קט דנים קלאסי',
                category: 'וינטג\' | ביגוד',
                desc: 'ז\'קט דנים איכותי מהשנות ה-90 בתנאי שמירה מעולים. עשוי מדנים עבה עם תפרים חזקים.',
                price: '₪89.99',
                icon: '👕',
                type: 'clothing'
            },
            {
                brand: 'Designer Collection',
                name: 'שמלת קוקטייל',
                category: 'עיצוב | ביגוד',
                desc: 'שמלה אלגנטית מעיצוב מפורסם. מושלמת לאירועים ערב. בד איכותי ותפרים מעולים.',
                price: '₪180.00',
                icon: '👗',
                type: 'clothing',
                flipped: true
            },
            {
                brand: 'Art Collection',
                name: 'ציור אבסטרקטי',
                category: 'אומנות מודרנית',
                desc: 'ציור שמן מקורי בטכניקה אבסטרקטית מאת אמן ישראלי בעל ניסיון של 20 שנים.',
                price: '₪450.00',
                icon: '🎨',
                type: 'art'
            },
            {
                brand: 'Footwear Collection',
                name: 'סניקרס ווינטג\'',
                category: 'ספורט | ביגוד',
                desc: 'סניקרס ווינטג\' מקורי מהשנות ה-80. נוח, סטילי וזה פשוט ייקוני. בתנאי מעולה.',
                price: '₪120.00',
                icon: '👟',
                type: 'clothing',
                flipped: true
            }
        ];

        let currentCategory = 'clothing';
        let feedBlocksCount = 0;

        // ==================== CART & WISHLIST STATE ====================
        let cart = JSON.parse(localStorage.getItem('vero_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('vero_wishlist') || '[]');

        function saveState() {
            localStorage.setItem('vero_cart', JSON.stringify(cart));
            localStorage.setItem('vero_wishlist', JSON.stringify(wishlist));
        }

        function priceToNum(p) {
            return parseFloat(String(p).replace(/[^\d.]/g, '')) || 0;
        }

        function isWished(id) {
            return wishlist.some(w => w.id === id);
        }

        function updateBadges() {
            const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const cb = document.getElementById('cartBadge');
            const wb = document.getElementById('wishlistBadge');
            cb.textContent = cartCount;
            cb.classList.toggle('show', cartCount > 0);
            wb.textContent = wishlist.length;
            wb.classList.toggle('show', wishlist.length > 0);
        }

        function cartVisible() {
            return document.getElementById('cartView').style.display !== 'none';
        }

        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            saveState();
            updateBadges();
            showToast(`נוסף לעגלה: ${item.name}`);
            if (cartVisible()) renderCartPage();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveState();
            updateBadges();
            renderCartPage();
        }

        function toggleWishlist(item, btn) {
            if (isWished(item.id)) {
                wishlist = wishlist.filter(w => w.id !== item.id);
                if (btn) btn.classList.remove('active');
                showToast(`הוסר מהמשאלות: ${item.name}`);
            } else {
                wishlist.push(item);
                if (btn) btn.classList.add('active');
                showToast(`נוסף למשאלות: ${item.name}`);
            }
            saveState();
            updateBadges();
            document.querySelectorAll(`.product-card[data-id="${CSS.escape(item.id)}"] .product-heart`)
                .forEach(h => h.classList.toggle('active', isWished(item.id)));
        }

        // ==================== VIEW SWITCHING ====================
        function showMain() {
            document.getElementById('cartHero').style.display = 'none';
            document.getElementById('cartContainer').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function openCart() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('cartHero').style.display = 'block';
            document.getElementById('cartContainer').style.display = 'block';
            renderCartPage();
            window.scrollTo(0, 0);
        }

        // ==================== CART PAGE RENDER ====================
        let activeCartTab = 'all';

        function cartCategories() {
            return [...new Set(cart.map(i => i.category))];
        }

        function selectCartTab(tab) {
            activeCartTab = tab;
            renderCartPage();
        }

        function renderCartPage() {
            const body = document.getElementById('cartPageBody');

            if (cart.length === 0) {
                body.innerHTML = '<div class="cart-empty">העגלה ריקה 🛒<br>חזור לדף הראשי והוסף מוצרים</div>';
                return;
            }

            // build tabs HTML
            const cats = cartCategories();
            const tabs = ['all', ...cats];
            const tabsHtml = tabs.map(tab => {
                const label = tab === 'all' ? 'הכל' : tab;
                return `<button class="cart-tab${activeCartTab === tab ? ' active' : ''}" onclick="selectCartTab('${tab.replace(/'/g, "\\'")}')">${label}</button>`;
            }).join('');

            // group items by category, respecting the active tab filter
            const selectedCats = activeCartTab === 'all' ? cats : [activeCartTab];
            let html = `<div class="cart-tabs">${tabsHtml}</div>`;
            for (const cat of selectedCats) {
                const items = cart.filter(i => i.category === cat);
                if (items.length === 0) continue;
                html += `
                    <div class="cart-group">
                        <h3 class="cart-group-title">${cat}</h3>
                        <div class="cart-cards">
                            ${items.map(cartCardHTML).join('')}
                        </div>
                    </div>
                `;
            }

            const total = cart.reduce((sum, i) => sum + priceToNum(i.price) * i.qty, 0);
            html += `
                <div class="cart-summary">
                    <span>סה"כ לתשלום</span>
                    <span class="cart-summary-total">₪${total.toFixed(2)}</span>
                    <button class="cart-checkout-btn" onclick="checkout()">מעבר לתשלום</button>
                </div>
            `;
            body.innerHTML = html;
        }

        function cartCardHTML(item) {
            const safeId = item.id.replace(/'/g, "\\'");
            const rating = item.rating || 4.5;
            const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '☆' : '');
            return `
                <div class="cart-card">
                    <div class="cart-card-img">${item.icon}</div>
                    <div class="cart-card-info">
                        <div class="cart-card-seller">${item.seller || 'Vero Store'}</div>
                        <div class="cart-card-name">${item.name}</div>
                        <div class="cart-card-rating">${stars} ${rating}</div>
                        <div class="cart-card-price">${item.price}</div>
                        <div class="cart-card-controls">
                            <button class="qty-btn" onclick="changeQty('${safeId}', -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${safeId}', 1)">+</button>
                            <button class="cart-card-remove" onclick="removeFromCart('${safeId}')">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function checkout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, i) => sum + priceToNum(i.price) * i.qty, 0);
            showToast(`התשלום בסך ₪${total.toFixed(2)} התקבל! תודה 🎉`);
            cart = [];
            saveState();
            updateBadges();
            renderCartPage();
        }

        // ==================== TOASTS ====================
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 350);
            }, 2600);
        }

        // ==================== EVENT DELEGATION (product buttons) ====================
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const card = btn.closest('.product-card');
            if (!card) return;
            const item = {
                id: card.dataset.id,
                name: card.dataset.name,
                price: card.dataset.price,
                icon: card.dataset.icon,
                category: card.dataset.category,
                seller: card.dataset.seller,
                rating: parseFloat(card.dataset.rating)
            };
            if (btn.dataset.action === 'cart') addToCart(item);
        });

        // Toggle Category
        function toggleCategory(btn, category) {
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            document.getElementById('categoryTitle').textContent =
                category === 'clothing' ? 'בחר קטגוריה: ביגוד' : 'בחר קטגוריה: אומנות';

            // Change hero image based on category
            const heroImage = document.getElementById('heroImage');
            if (category === 'clothing') {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1595777712802-91d282f641b1?w=1600&h=600&fit=crop')";
            } else {
                heroImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1578321272176-639e2e54cb4f?w=1600&h=600&fit=crop')";
            }

            renderCategories();
            renderFeed();
        }

        // Scroll Categories Slider
        function scrollCategories(direction) {
            const grid = document.getElementById('categoriesGrid');
            const scrollAmount = 350;
            grid.scrollBy({
                left: direction > 0 ? scrollAmount : -scrollAmount,
                behavior: 'smooth'
            });
        }

        // Render Categories
        function renderCategories() {
            const categories = currentCategory === 'clothing' ? clothingCategories : artCategories;
            const html = categories.map(cat => `
                <div class="category-card">
                    <div class="category-text">
                        <h3>${cat.name}</h3>
                        <p>${cat.desc}</p>
                        <button class="category-btn">עיין</button>
                    </div>
                    <div class="category-icon">${cat.icon}</div>
                </div>
            `).join('');

            document.getElementById('categoriesGrid').innerHTML = html;
        }

        // Render Feed
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = '';
            feedBlocksCount = 0;
            loadMoreFeedBlocks();
        }

        // Load More Feed Blocks
        function loadMoreFeedBlocks() {
            const feedContainer = document.getElementById('feedContainer');

            // Add 2 blocks at a time, max 4 blocks
            const blocksToAdd = Math.min(2, 4 - feedBlocksCount);
            if (blocksToAdd <= 0) return;

            for (let i = 0; i < blocksToAdd; i++) {
                const productIndex = feedBlocksCount % featuredProducts.length;
                const featured = featuredProducts[productIndex];

                // Filter products based on category
                const products = currentCategory === 'clothing'
                    ? clothingProducts
                    : artProducts;

                const block = document.createElement('div');
                block.className = 'feed-block';

                let productsHtml = '';
                for (let j = 0; j < 10; j++) {
                    const prod = products[j % products.length];
                    const pid = `${prod.name}|${prod.price}`;
                    const stars = '★'.repeat(Math.floor(prod.rating)) + (prod.rating % 1 >= 0.5 ? '☆' : '');
                    productsHtml += `
                        <div class="product-card" data-id="${pid}" data-name="${prod.name}" data-price="${prod.price}" data-icon="${prod.icon}" data-category="${prod.category}" data-seller="${prod.seller}" data-rating="${prod.rating}">
                            <div class="product-image">${prod.icon}
                                <button class="product-icon cart">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M9 2L6 6H2v2h1.17L4 20c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.83-12H23V6h-4L15 2H9zm0 2h6v2H9V4zm9 14H6L4.22 8h15.56L18 18z"/>
                                    </svg>
                                </button>
                                <button class="product-icon heart">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="product-info">
                                <div class="product-seller">${prod.seller}</div>
                                <div class="product-name-price">
                                    <div class="product-name">${prod.name}</div>
                                    <div class="product-price">${prod.price}</div>
                                </div>
                                <div class="product-rating">${stars} ${prod.rating}</div>
                                <div class="product-footer">
                                    <button class="product-btn" data-action="cart">הוסף לעגלה</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                block.innerHTML = `
                    <div class="featured-product">
                        <div class="featured-text">
                            <div class="featured-brand">${featured.brand}</div>
                            <h3>${featured.name}</h3>
                            <div class="featured-category">${featured.category}</div>
                            <p>${featured.desc}</p>
                            <div class="featured-price">${featured.price}</div>
                            <button class="featured-btn">צפה בפריט</button>
                        </div>
                        <div class="featured-image">${featured.icon}</div>
                    </div>
                    <h4 class="products-label">10 מוצרים רנדומליים</h4>
                    <div class="products-grid">
                        ${productsHtml}
                    </div>
                `;

                feedContainer.appendChild(block);
                feedBlocksCount++;
            }
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                loadMoreFeedBlocks();
            }
        });

        // Initialize
        renderCategories();
        renderFeed();
        updateBadges();
    </script>
</body>
</html>
