<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promoted Slider Options 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz@0,6..96;1,6..96&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Book.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Aharoni CLM'; src: url('../assets/fonts/AharoniCLM-Bold.woff') format('woff'); font-weight: 700; }
:root { --muted: #8a877f; --line: #e4e1dc; --accent: #E8842B; --ink: #111; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eceae4; color: #111; font-family: 'Aharoni CLM', 'Segoe UI', sans-serif; padding: 40px 24px 60px; }
h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 34px; direction: rtl; }
.grid { display: flex; flex-wrap: wrap; gap: 38px 26px; justify-content: center; max-width: 1280px; margin: 0 auto; }
.opt { width: 300px; }
.opt-label { direction: rtl; margin-top: 14px; }
.opt-label b { display: block; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.opt-label span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }

.phone { width: 300px; height: 500px; border-radius: 28px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 16px 36px rgba(0,0,0,0.14); border: 6px solid #0d0d0d; }
.screen { width: 390px; height: 650px; transform: scale(0.7692); transform-origin: 0 0; position: relative; overflow: hidden; background: #fff; font-family: 'Inter', sans-serif; padding-top: 30px; }
.th { display: block; background: #e7e4dd center / cover no-repeat; filter: grayscale(0.15); }
.money { font-variant-numeric: tabular-nums; }
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px; margin: 10px 0 14px; }
.sh b { font-family: 'Aharoni CLM', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.5px; }
.sh .k { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 3px; }
.sh span.see { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.rail { display: flex; gap: 13px; overflow: hidden; padding: 0 22px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #d6d2cb; } .dots i.on { width: 18px; border-radius: 6px; background: #111; }

/* P9 · edge-to-edge cinematic 9:16 */
.p9 .rail { padding: 0 0 0 22px; gap: 10px; }
.p9 .c { width: 240px; flex: none; position: relative; border-radius: 6px; overflow: hidden; color: #fff; }
.p9 .c .th { height: 420px; }
.p9 .c::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.72)); }
.p9 .c .in { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1; }
.p9 .c .nm { font-family: 'Bodoni Moda', serif; font-size: 22px; } .p9 .c .pr { font-size: 13px; opacity: 0.9; }
.p9 .c .promo { position: absolute; left: 14px; top: 14px; z-index: 1; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,0.9); color: #111; padding: 4px 8px; border-radius: 3px; }

/* P10 · swipe deck (stacked) */
.p10 .deck { position: relative; height: 420px; margin: 0 22px; }
.p10 .card { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,0.18); }
.p10 .card .th { position: absolute; inset: 0; }
.p10 .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.7)); }
.p10 .card .in { position: absolute; left: 16px; bottom: 16px; z-index: 1; }
.p10 .card .nm { font-size: 19px; } .p10 .card .pr { font-size: 13px; opacity: 0.9; }
.p10 .c3 { transform: scale(0.9) translateY(-26px); filter: brightness(0.9); }
.p10 .c2 { transform: scale(0.95) translateY(-13px); filter: brightness(0.95); }

/* P11 · stories row */
.p11 .rail { gap: 16px; }
.p11 .st { text-align: center; flex: none; width: 76px; }
.p11 .ring { width: 72px; height: 72px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--accent), #c2552a); }
.p11 .ring .th { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; }
.p11 .st .nm { font-size: 11px; margin-top: 7px; } .p11 .st .pr { font-size: 11px; color: var(--muted); }

/* P12 · split magazine wide */
.p12 .c { display: flex; gap: 0; margin: 0 22px 14px; align-items: stretch; }
.p12 .c .th { width: 130px; height: 150px; flex: none; }
.p12 .c .bd { padding: 6px 16px; display: flex; flex-direction: column; justify-content: center; }
.p12 .c .promo { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.p12 .c .nm { font-family: 'Bodoni Moda', serif; font-size: 24px; line-height: 1.05; margin: 6px 0 4px; }
.p12 .c .s { font-size: 12px; color: var(--muted); } .p12 .c .pr { font-size: 16px; margin-top: 10px; }

/* P13 · accent glow frame */
.p13 .c { width: 146px; flex: none; position: relative; padding: 4px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), #c2552a); }
.p13 .c .inner { background: #fff; border-radius: 11px; padding: 6px; }
.p13 .c .th { aspect-ratio: 3/4; border-radius: 7px; }
.p13 .c .promo { position: absolute; left: 12px; top: -1px; background: var(--accent); color: #fff; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 0 0 6px 6px; z-index: 2; }
.p13 .c .l { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 4px 2px; }

/* P14 · price-drop deals */
.p14 .c { width: 140px; flex: none; position: relative; }
.p14 .c .th { aspect-ratio: 3/4; }
.p14 .c .off { position: absolute; left: 0; top: 0; background: #d33; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; z-index: 2; }
.p14 .c .nm { font-size: 12px; margin-top: 7px; }
.p14 .c .l { display: flex; gap: 7px; align-items: baseline; margin-top: 3px; }
.p14 .c .now { font-size: 14px; font-weight: 700; color: #d33; } .p14 .c .was { font-size: 11px; color: var(--muted); text-decoration: line-through; }

/* P15 · two rows */
.p15 .two { display: flex; flex-direction: column; gap: 12px; }
.p15 .rail { gap: 11px; }
.p15 .c { width: 112px; flex: none; }
.p15 .c .th { aspect-ratio: 1/1; }
.p15 .c .l { display: flex; justify-content: space-between; font-size: 11px; margin-top: 6px; }

/* P16 · spotlight + thumbnails */
.p16 .big { margin: 0 22px; position: relative; border-radius: 8px; overflow: hidden; color: #fff; }
.p16 .big .th { height: 300px; }
.p16 .big::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,0.7)); }
.p16 .big .in { position: absolute; left: 16px; bottom: 14px; z-index: 1; }
.p16 .big .nm { font-family: 'Bodoni Moda', serif; font-size: 23px; } .p16 .big .pr { font-size: 13px; opacity: 0.9; }
.p16 .big .promo { position: absolute; left: 14px; top: 14px; z-index: 1; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,0.9); color: #111; padding: 4px 8px; border-radius: 3px; }
.p16 .thumbs { display: flex; gap: 10px; padding: 12px 22px 0; }
.p16 .thumbs .t { flex: 1; aspect-ratio: 1/1; border-radius: 6px; } .p16 .thumbs .t.on { outline: 2px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<h1>Promoted — עוד סליידרים</h1>
<p class="sub">8 כיוונים נוספים, שונים מהקודמים</p>

<div class="grid" id="opts"></div>

<script>
var IM = [
  { img: '../men-hero.jpg', pos: '50% 30%' }, { img: '../women-hero.jpg', pos: '30% 35%' },
  { img: '../clothing-hero.jpg', pos: '50% 50%' }, { img: '../hero-beach.jpg', pos: '50% 45%' },
  { img: '../gallery-hero.jpg', pos: '50% 50%' }, { img: '../magazine-hero.jpg', pos: '50% 50%' }
];
var bg = o => 'style="background-image:url(\'' + o.img + '\');background-position:' + o.pos + '"';
var P = [['Wool Overcoat', 380, 'Atelier Nord', IM[1]], ['Linen Shirt', 120, 'Studio Vero', IM[0]], ['Leather Bag', 240, 'Milano Feet', IM[2]], ['Silk Scarf', 90, 'Denim Lab', IM[3]], ['Denim Jacket', 210, 'Denim Lab', IM[4]], ['Knit Vest', 160, 'Sole Society', IM[5]]];
var m = v => '₪' + v;
var head = (k, t, see) => '<div class="sh"><b>' + (k ? '<span class="k">' + k + '</span>' : '') + t + '</b><span class="see">' + (see || 'See all') + '</span></div>';

var OPTS = [
  ['P9 · קולנועי מקצה לקצה', 'כרטיסים גבוהים (9:16) צמודים לקצה המסך, כיתוב על התמונה ותווית Promoted. דרמטי ומלא מסך.',
   '<div class="screen p9">' + head('', 'Promoted') + '<div class="rail">' + P.slice(0, 4).map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><span class="promo">Promoted</span><div class="in"><div class="nm">' + c[0] + '</div><div class="pr money">' + m(c[1]) + ' · ' + c[2] + '</div></div></div>').join('') + '</div></div>'],

  ['P10 · חפיסה להחלקה', 'הכרטיסים מוערמים זה על זה כמו חפיסה, ומחליקים את העליון. אינטראקטיבי ומושך.',
   '<div class="screen p10">' + head('', 'Promoted') + '<div class="deck"><div class="card c3"><span class="th" ' + bg(IM[2]) + '></span></div><div class="card c2"><span class="th" ' + bg(IM[0]) + '></span></div><div class="card"><span class="th" ' + bg(IM[1]) + '></span><div class="in"><div class="nm">Wool Overcoat</div><div class="pr money">₪380 · Atelier Nord</div></div></div></div><div class="dots"><i class="on"></i><i></i><i></i></div></div>'],

  ['P11 · שורת סטוריז', 'עיגולים עם טבעת כתומה, שם ומחיר מתחת — כמו סטוריז. קומפקטי ומזמין ללחיצה.',
   '<div class="screen p11">' + head('', 'Promoted') + '<div class="rail">' + P.map(c => '<div class="st"><div class="ring"><span class="th" ' + bg(c[3]) + '></span></div><div class="nm">' + c[0].split(' ')[0] + '</div><div class="pr money">' + m(c[1]) + '</div></div>').join('') + '</div></div>'],

  ['P12 · מגזין מפוצל', 'כרטיס רחב: תמונה בצד, שם גדול בסריף, מוכר ומחיר. אלגנטי ועריכתי, אחד בכל פעם.',
   '<div class="screen p12">' + head('', 'Promoted') + P.slice(0, 2).map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="bd"><span class="promo">Promoted</span><div class="nm">' + c[0] + '</div><div class="s">' + c[2] + '</div><div class="pr money">' + m(c[1]) + '</div></div></div>').join('') + '</div>'],

  ['P13 · מסגרת זוהרת', 'מסגרת בצבע הדגשה סביב כל כרטיס ותווית Promoted. מבדיל ברור בין מקודם לרגיל.',
   '<div class="screen p13">' + head('', 'Promoted') + '<div class="rail">' + P.slice(0, 4).map(c => '<div class="c"><span class="promo">Ad</span><div class="inner"><span class="th" ' + bg(c[3]) + '></span><div class="l"><span>' + c[0].split(' ')[0] + '</span><span class="money">' + m(c[1]) + '</span></div></div></div>').join('') + '</div></div>'],

  ['P14 · מבצעים (היה/עכשיו)', 'תווית אחוז הנחה, מחיר ישן מחוק ומחיר חדש באדום. מושלם לקדם מבצעים ולדחוף לקנייה.',
   '<div class="screen p14">' + head('', 'On sale') + '<div class="rail">' + P.slice(0, 4).map((c, k) => '<div class="c"><span class="off">-' + [40, 30, 50, 25][k] + '%</span><span class="th" ' + bg(c[3]) + '></span><div class="nm">' + c[0] + '</div><div class="l"><span class="now money">' + m(Math.round(c[1] * [0.6, 0.7, 0.5, 0.75][k])) + '</span><span class="was money">' + m(c[1]) + '</span></div></div>').join('') + '</div></div>'],

  ['P15 · שתי שורות', 'שתי שורות קטנות שנגללות יחד. מציג הרבה פריטים מקודמים במעט מקום.',
   '<div class="screen p15">' + head('', 'Promoted') + '<div class="two"><div class="rail">' + P.map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="l"><span>' + c[0].split(' ')[0] + '</span><span class="money">' + m(c[1]) + '</span></div></div>').join('') + '</div>' +
   '<div class="rail">' + P.slice().reverse().map(c => '<div class="c"><span class="th" ' + bg(c[3]) + '></span><div class="l"><span>' + c[0].split(' ')[0] + '</span><span class="money">' + m(c[1]) + '</span></div></div>').join('') + '</div></div></div>'],

  ['P16 · זרקור + תמונות', 'פריט אחד גדול "בזרקור", ומתחת רצועת תמונות קטנות להחלפה. כמו דף מוצר בזעיר.',
   '<div class="screen p16">' + head('', 'Spotlight') + '<div class="big"><span class="th" ' + bg(IM[1]) + '></span><span class="promo">Promoted</span><div class="in"><div class="nm">Wool Overcoat</div><div class="pr money">₪380 · Atelier Nord</div></div></div>' +
   '<div class="thumbs">' + [IM[1], IM[0], IM[2], IM[3]].map((i, k) => '<span class="t th' + (k === 0 ? ' on' : '') + '" ' + bg(i) + '></span>').join('') + '</div></div>']
];
document.getElementById('opts').innerHTML = OPTS.map(o =>
  '<div class="opt"><div class="phone">' + o[2] + '</div><div class="opt-label"><b>' + o[0] + '</b><span>' + o[1] + '</span></div></div>').join('');
</script>
</body>
</html>
