    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-templates.css">
    <style>
        :root { --ink:#1c1c1c; --muted:#7a7a75; --line:#e9e9e6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff; direction: ltr; color: var(--ink);
            overflow-x: hidden; font-size: 14px; line-height: 1.5;
        }
        .back {
            position: fixed; top: 22px; left: 22px; z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border: 1.4px solid #000; border-radius: 999px;
            font-size: 10px; letter-spacing: 1.5px; text-decoration: none; color: var(--ink);
            background: #fff; transition: background 0.25s, color 0.25s;
        }
        .back:hover { background: #000; color: #fff; }
        html.is-embed .back { display: none !important; }

        .wrap { max-width: 1080px; margin: 0 auto; padding: 74px 20px 110px; animation: fade 0.5s ease both; }
        html.is-embed .wrap { padding: 22px 16px 90px; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .head { text-align: center; margin-bottom: 8px; }
        .head h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 200; letter-spacing: 0.5px; }
        .head .sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
        .head p { max-width: 34em; margin: 10px auto 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

        .sec-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 34px 0 14px; }

        /* Accent override row */
        .accent-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .accent-row .lbl { font-size: 12px; color: var(--muted); }
        .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; transition: transform 0.15s; }
        .swatch:hover { transform: scale(1.12); }
        .swatch.on { box-shadow: 0 0 0 2px #111; }

        /* ---- Layout gallery — colorless wireframes of the site structures. ----
           These are intentionally monochrome (neutral greys only): they show the
           arrangement, not the colours. Colour + position are chosen after you open
           a layout in the preview modal. */
        .layout-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (min-width: 620px) { .layout-row { grid-template-columns: 1fr 1fr 1fr; } }
        .lay {
            border: 1.5px solid var(--line); border-radius: 18px; background: #fff; cursor: pointer;
            padding: 12px; text-align: left; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; position: relative;
        }
        .lay:hover { border-color: #bdbdb8; transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0,0,0,0.09); }
        .lay.on { border-color: #111; box-shadow: 0 0 0 1.5px #111; }
        .lay .lay-check {
            position: absolute; top: 8px; inset-inline-end: 8px; width: 22px; height: 22px; border-radius: 50%;
            background: #111; color: #fff; display: none; place-items: center; font-size: 12px; z-index: 2;
        }
        .lay.on .lay-check { display: grid; }

        /* Neutral wireframe canvas. Everything inside is greyscale on purpose. */
        .wf { --wf-line:#cfcbc4; --wf-fill:#ddd9d3; --wf-strong:#bdb8b0; --wf-bg:#f4f2f0;
              height: 132px; border-radius: 10px; background: var(--wf-bg); padding: 8px; overflow: hidden;
              display: flex; flex-direction: column; gap: 5px; }
        .wf .wf-nav { height: 9px; border-radius: 3px; background: var(--wf-strong); display: flex; align-items: center; gap: 4px; padding: 0 5px; }
        .wf .wf-nav b { display: block; width: 8px; height: 3px; border-radius: 2px; background: var(--wf-bg); }
        .wf .wf-nav b.sp { margin-inline-start: auto; }
        .wf .wf-hero { border-radius: 5px; background: var(--wf-fill); position: relative; display: flex; align-items: flex-end; padding: 6px; }
        .wf .wf-hero i { display: block; height: 6px; border-radius: 2px; background: var(--wf-strong); }
        .wf .wf-split { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .wf .wf-split > span { border-radius: 5px; background: var(--wf-fill); }
        .wf .wf-bar { height: 7px; border-radius: 2px; background: var(--wf-line); }
        .wf .wf-bar.c { margin: 0 auto; }
        .wf .wf-pill { height: 8px; width: 34%; border-radius: 999px; background: var(--wf-strong); }
        .wf .wf-pill.c { margin: 0 auto; }
        .wf .wf-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
        .wf .wf-stats i { height: 12px; border-radius: 3px; background: var(--wf-fill); }
        .wf .wf-grid { display: grid; gap: 4px; margin-top: auto; }
        .wf .wf-grid i { border-radius: 3px; background: var(--wf-line); aspect-ratio: 3/4; }
        .wf .wf-side { display: grid; grid-template-columns: 1.1fr 1fr; gap: 6px; flex: 1; }
        .wf .wf-side .wf-txt { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
        .wf .wf-side .wf-txt i { height: 6px; border-radius: 2px; background: var(--wf-line); }
        .wf .wf-side .wf-txt i:nth-child(1) { width: 80%; height: 9px; background: var(--wf-strong); }
        .wf .wf-side .wf-txt i:nth-child(2) { width: 60%; }
        .wf .wf-side .wf-img { border-radius: 5px; background: var(--wf-fill); }
        .lay-name { font-size: 13px; font-weight: 600; margin-top: 11px; }
        .lay-desc { font-size: 11px; color: var(--muted, #7a7a75); margin-top: 3px; line-height: 1.5; }
        .lay-open { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }

        /* ---- Preview modal (opens when you "enter" a layout). ---- */
        .lm-overlay {
            position: fixed; inset: 0; z-index: 60; background: rgba(20,18,16,0.45);
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
            display: none; align-items: flex-end; justify-content: center;
        }
        @media (min-width: 620px) { .lm-overlay { align-items: center; } }
        .lm-overlay.open { display: flex; animation: fade 0.2s ease both; }
        .lm {
            background: #fff; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
            border-radius: 22px 22px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom,0px));
            animation: lmUp 0.28s cubic-bezier(.2,.8,.2,1) both;
        }
        @media (min-width: 620px) { .lm { border-radius: 22px; } }
        @keyframes lmUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        .lm-grip { width: 40px; height: 4px; border-radius: 999px; background: #e0ddd7; margin: 0 auto 14px; }
        @media (min-width: 620px) { .lm-grip { display: none; } }
        .lm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .lm-title { font-size: 20px; font-weight: 200; letter-spacing: 0.5px; }
        .lm-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .lm-x { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; color: #111; }
        .lm-x:hover { background: #111; color: #fff; }
        .lm-preview { background: #f4f2f0; border-radius: 16px; padding: 14px; margin-bottom: 18px; max-height: 62vh; overflow-y: auto; }
        .lm-preview .sfp { max-width: 320px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
        /* Full-layout preview parts (rendered only inside the modal). */
        .lm-preview .sfp .sfp-nav { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: var(--sf-surface); }
        .lm-preview .sfp .sfp-nav i { height: 4px; width: 22px; border-radius: 2px; background: var(--sf-ink); opacity: 0.35; }
        .lm-preview .sfp .sfp-nav i.sp { margin-inline-start: auto; }
        .lm-preview .sfp .sfp-split { display: grid !important; grid-template-columns: 1fr 1fr; gap: 2px; padding: 0; }
        .lm-preview .sfp .sfp-split > span { background: var(--sf-hero); background-size: cover; }
        .lm-preview .sfp .sfp-name-abs { position: absolute; z-index: 2; inset-inline: 0; bottom: 14px; padding: 0 14px; color: #fff; font-size: 22px; line-height: 1; font-family: var(--sf-name-font); font-weight: var(--sf-name-weight); letter-spacing: var(--sf-name-spacing); text-transform: var(--sf-name-transform); }
        .lm-preview .sfp .sfp-tall { height: 168px; }
        .lm-preview .sfp .sfp-center { flex-direction: column; align-items: center; justify-content: center; gap: 9px; }
        .lm-preview .sfp .sfp-cta { position: relative; z-index: 2; background: var(--sf-accent); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; padding: 6px 15px; border-radius: 999px; }
        .lm-preview .sfp .sfp-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 13px; text-align: center; }
        .lm-preview .sfp .sfp-stats span { display: flex; flex-direction: column; gap: 2px; font-size: 7.5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--sf-ink); opacity: 0.7; }
        .lm-preview .sfp .sfp-stats b { font-size: 15px; font-weight: 600; opacity: 1; }
        .lm-field { margin-bottom: 16px; }
        .lm-field > .lm-lbl { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 9px; }
        .lm-swatches { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .lm-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
        .lm-seg button {
            appearance: none; border: 0; background: #fff; color: var(--muted); cursor: pointer;
            padding: 8px 14px; font-family: inherit; font-size: 12px; font-weight: 600; transition: background 0.15s, color 0.15s;
        }
        .lm-seg button.on { background: #111; color: #fff; }
        .lm-actions { display: flex; gap: 10px; margin-top: 22px; }
        .lm-actions .btn { flex: 1; }

        /* Template grid */
        .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
        @media (max-width: 560px) { .tpl-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
        .tpl {
            border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer;
            background: #fff; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; position: relative;
        }
        .tpl:hover { border-color: #bdbdb8; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .tpl.on { border-color: #111; box-shadow: 0 0 0 2px #111; }
        .tpl .sfp { border-radius: 0; }
        .tpl-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; }
        .tpl-name { font-size: 13px; font-weight: 600; }
        .tpl-desc { font-size: 10.5px; color: var(--muted); }
        .tpl .check {
            position: absolute; top: 10px; inset-inline-start: 10px; width: 26px; height: 26px; border-radius: 50%;
            background: #111; color: #fff; display: none; place-items: center; font-size: 14px; z-index: 3;
        }
        .tpl.on .check { display: grid; }

        /* Sticky save/preview bar */
        .actionbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; gap: 12px; justify-content: center; align-items: center;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
        }
        html.is-embed .actionbar { position: sticky; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: 999px; border: 1.4px solid #111; background: #fff; color: #111;
            font-family: inherit; font-size: 12px; letter-spacing: 0.5px; font-weight: 600; cursor: pointer;
            min-height: 46px; text-decoration: none; transition: background 0.2s, color 0.2s;
        }
        .btn:hover { background: #111; color: #fff; }
        .btn.primary { background: #111; color: #fff; }
        .btn.primary:hover { background: #000; }
        .saved-note { font-size: 11px; color: #1f8f4e; opacity: 0; transition: opacity 0.3s; }
        .saved-note.show { opacity: 1; }

    <script>
    (function storeEditor() {
        try { localStorage.setItem('vero_active_account', 'seller'); } catch (e) {}
        if (new URLSearchParams(location.search).get('embed') === '1') {
            document.documentElement.classList.add('is-embed');
        }

        const KEY = 'vero_store_config';
        const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
        const write = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
        let cfg = read();

        // The ten templates (id + Hebrew name + one-line description). Their visual
        // tokens live in store-templates.css, keyed by the same id.
        const TEMPLATES = [
            { id: 't1',  name: 'Minimal',   desc: 'Clean white, Signature red' },
            { id: 't2',  name: 'Editorial', desc: 'Warm cream, Gold, Bodoni' },
            { id: 't3',  name: 'Noir',     desc: 'Dark and bold, Silver' },
            { id: 't4',  name: 'Blush',     desc: 'Soft pink, Elegant serif' },
            { id: 't5',  name: 'Street',    desc: 'Bold orange, Uppercase letters' },
            { id: 't6',  name: 'Luxe',     desc: 'Deep green, Gold' },
            { id: 't7',  name: 'Lavender',    desc: 'Soft purple, Rounded corners' },
            { id: 't8',  name: 'Gallery',    desc: 'Airy gray, Monochrome' },
            { id: 't9',  name: 'Classic',    desc: 'Navy, Traditional serif' },
            { id: 't10', name: 'Coast',     desc: 'Fresh turquoise' }
        ];

        // Accent colours the seller can override on top of a template.
        const ACCENTS = ['#EB2323', '#9a7d52', '#d46a7e', '#ff5a1f', '#c8a24a', '#7b5cd6', '#1f3a5f', '#1f9c8f', '#111111'];

        // Storefront layout presets. Each carries a distinct site structure (rendered
        // as a colorless wireframe) plus its default positions. The seller can nudge
        // namePos + grid inside the preview modal before applying. Stored as
        // cfg.layout / cfg.namePos / cfg.grid.
        const LAYOUTS = [
            { id: 'l1', name: 'Editorial', desc: 'Split hero · centered name · 3-up grid', wf: 'split',   namePos: 'center', grid: 3 },
            { id: 'l2', name: 'Boutique',  desc: 'Roomy 2-up grid · left-aligned name',     wf: 'left',    namePos: 'left',   grid: 2 },
            { id: 'l3', name: 'Gallery',   desc: 'Dense 4-up grid · centered name',          wf: 'dense',   namePos: 'center', grid: 4 },
            { id: 'l4', name: 'Story',     desc: 'Tall portrait hero · stats · 3-up',        wf: 'story',   namePos: 'left',   grid: 3 },
            { id: 'l5', name: 'Landing',   desc: 'Nav bar · hero + intro · feature grid',    wf: 'landing', namePos: 'center', grid: 3 },
            { id: 'l6', name: 'Classic',   desc: 'Centered hero with call-to-action · 3-up', wf: 'classic', namePos: 'center', grid: 3 }
        ];

        // Colorless wireframe markup for each layout structure (neutral greys only).
        function wireframe(type) {
            const cols = (n) => `<span class="wf-grid" style="grid-template-columns:repeat(${n},1fr)">${'<i></i>'.repeat(n)}</span>`;
            const nav = `<span class="wf-nav"><b></b><b></b><b class="sp"></b><b></b></span>`;
            switch (type) {
                case 'split':
                    return `<div class="wf"><span class="wf-split" style="flex:1"><span></span><span></span></span><span class="wf-bar c" style="width:50%"></span>${cols(3)}</div>`;
                case 'left':
                    return `<div class="wf"><span class="wf-hero" style="flex:1"><i style="width:45%"></i></span><span class="wf-bar" style="width:42%"></span>${cols(2)}</div>`;
                case 'dense':
                    return `<div class="wf"><span class="wf-hero" style="flex:1;align-items:center;justify-content:center"><span class="wf-bar c" style="width:60%"></span></span>${cols(4)}</div>`;
                case 'story':
                    return `<div class="wf"><span class="wf-hero" style="flex:1.4"><i style="width:55%"></i></span><span class="wf-stats"><i></i><i></i><i></i></span>${cols(3)}</div>`;
                case 'landing':
                    return `<div class="wf">${nav}<span class="wf-side"><span class="wf-txt"><i></i><i></i><span class="wf-pill" style="width:50%;margin-top:2px"></span></span><span class="wf-img"></span></span>${cols(3)}</div>`;
                case 'classic':
                    return `<div class="wf">${nav}<span class="wf-hero" style="flex:1;flex-direction:column;align-items:center;justify-content:center;gap:5px"><span class="wf-bar c" style="width:55%"></span><span class="wf-pill c"></span></span>${cols(3)}</div>`;
                default:
                    return `<div class="wf"><span class="wf-hero" style="flex:1"></span>${cols(3)}</div>`;
            }
        }

        let selected = cfg.template || 't1';
        let accent = cfg.accent || '';
        let layout = cfg.layout || 'l1';
        let namePos = cfg.namePos || (LAYOUTS.find(l => l.id === layout) || {}).namePos || 'center';
        let gridN = cfg.grid || (LAYOUTS.find(l => l.id === layout) || {}).grid || 3;

        // ---- Build the template preview grid. ----
        const grid = document.getElementById('tplGrid');
        grid.innerHTML = TEMPLATES.map(t => `
            <div class="tpl${t.id === selected ? ' on' : ''}" data-id="${t.id}">
                <span class="check">✓</span>
                <div class="sfp" data-store-template="${t.id}"${accent ? ` style="--sf-accent:${accent}"` : ''}>
                    <div class="sfp-hero"><div class="sfp-name">My Store</div></div>
                    <div class="sfp-body">
                        <div class="sfp-row"><span class="sfp-cat">Items for sale</span><span class="sfp-btn">Follow</span></div>
                        <div class="sfp-tiles"><i class="sfp-tile"></i><i class="sfp-tile"></i><i class="sfp-tile"></i></div>
                    </div>
                </div>
                <div class="tpl-foot"><span class="tpl-name">${t.name}</span><span class="tpl-desc">${t.desc}</span></div>
            </div>`).join('');

        grid.addEventListener('click', (e) => {
            const card = e.target.closest('.tpl');
            if (!card) return;
            selected = card.dataset.id;
            grid.querySelectorAll('.tpl').forEach(c => c.classList.toggle('on', c === card));
            // Persist immediately so the storefront always reflects the chosen template.
            save();
        });

        // ---- Accent swatches. ----
        const accentRow = document.getElementById('accentRow');
        accentRow.insertAdjacentHTML('beforeend',
            `<button class="swatch${!accent ? ' on' : ''}" data-accent="" title="The template default" style="background:conic-gradient(#EB2323,#c8a24a,#1f9c8f,#7b5cd6,#EB2323)"></button>` +
            ACCENTS.map(c => `<button class="swatch${accent === c ? ' on' : ''}" data-accent="${c}" style="background:${c}"></button>`).join(''));
        accentRow.addEventListener('click', (e) => {
            const sw = e.target.closest('.swatch'); if (!sw) return;
            accent = sw.dataset.accent || '';
            accentRow.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === sw));
            // Live-update the previews' accent.
            grid.querySelectorAll('.sfp').forEach(el => {
                if (accent) el.style.setProperty('--sf-accent', accent);
                else el.style.removeProperty('--sf-accent');
            });
            // Persist immediately so the storefront always reflects the chosen accent.
            save();
        });

        // ---- Layout gallery (colorless wireframes). Tap a card to open its preview. ----
        const layoutRow = document.getElementById('layoutRow');
        function renderLayouts() {
            layoutRow.innerHTML = LAYOUTS.map(l => `
                <button type="button" class="lay${l.id === layout ? ' on' : ''}" data-lay="${l.id}">
                    <span class="lay-check">✓</span>
                    ${wireframe(l.wf)}
                    <span class="lay-name">${l.name}</span>
                    <span class="lay-desc">${l.desc}</span>
                    <span class="lay-open">Preview
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    </span>
                </button>`).join('');
        }
        renderLayouts();
        layoutRow.addEventListener('click', (e) => {
            const b = e.target.closest('.lay'); if (!b) return;
            openModal(b.dataset.lay);
        });

        // ---- Layout preview modal: color + positions + apply. ----
        const modal   = document.getElementById('layModal');
        const mPreview = document.getElementById('lmPreview');
        const mNamePos = document.getElementById('lmNamePos');
        const mGrid   = document.getElementById('lmGrid');
        // Draft state while the modal is open — only committed on Apply.
        // dAccent mirrors the accent chosen above (the modal no longer sets colour).
        let dLayout = layout, dAccent = accent, dNamePos = namePos, dGrid = gridN;

        // Build the FULL storefront preview for the open layout — hero variant,
        // optional nav / stats / call-to-action, and a full multi-row product grid.
        function previewHTML() {
            const tiles = `<div class="sfp-tiles" style="grid-template-columns:repeat(${dGrid},1fr)">${'<i class="sfp-tile"></i>'.repeat(dGrid * 2)}</div>`;
            const name  = `<div class="sfp-name" style="width:100%;text-align:${dNamePos}">My Store</div>`;
            const cat   = `<div class="sfp-row"><span class="sfp-cat">Items for sale</span><span class="sfp-btn">Follow</span></div>`;
            const nav   = `<div class="sfp-nav"><i></i><i></i><i class="sp"></i><i></i></div>`;
            let inner;
            switch (dLayout) {
                case 'l1': // Editorial — split hero, name overlay
                    inner = `<div class="sfp-hero sfp-split"><span></span><span></span><div class="sfp-name-abs" style="text-align:${dNamePos}">My Store</div></div>
                             <div class="sfp-body">${cat}${tiles}</div>`;
                    break;
                case 'l4': // Story — tall hero + stats
                    inner = `<div class="sfp-hero sfp-tall">${name}</div>
                             <div class="sfp-body"><div class="sfp-stats"><span><b>52</b>sold</span><span><b>120</b>items</span><span><b>4.9</b>rating</span></div>${cat}${tiles}</div>`;
                    break;
                case 'l5': // Landing — nav bar + hero + grid
                    inner = `${nav}<div class="sfp-hero">${name}</div>
                             <div class="sfp-body">${cat}${tiles}</div>`;
                    break;
                case 'l6': // Classic — nav bar + centered hero with CTA
                    inner = `${nav}<div class="sfp-hero sfp-center"><div class="sfp-name" style="width:100%;text-align:center">My Store</div><span class="sfp-cta">Shop now</span></div>
                             <div class="sfp-body">${cat}${tiles}</div>`;
                    break;
                default: // Boutique / Gallery — single hero
                    inner = `<div class="sfp-hero">${name}</div>
                             <div class="sfp-body">${cat}${tiles}</div>`;
            }
            return `<div class="sfp" data-store-template="${selected}"${dAccent ? ` style="--sf-accent:${dAccent}"` : ''}>${inner}</div>`;
        }

        function paintPreview() {
            mPreview.innerHTML = previewHTML();
            mNamePos.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.pos === dNamePos));
            mGrid.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(b.dataset.grid) === String(dGrid)));
        }

        function openModal(id) {
            const l = LAYOUTS.find(x => x.id === id) || LAYOUTS[0];
            dLayout = l.id;
            // If re-opening the already-applied layout, keep the seller's saved tweaks;
            // otherwise start from that layout's own defaults.
            if (l.id === layout) { dAccent = accent; dNamePos = namePos; dGrid = gridN; }
            else { dAccent = accent; dNamePos = l.namePos; dGrid = l.grid; }
            document.getElementById('lmTitle').textContent = l.name;
            document.getElementById('lmSub').textContent = l.desc;
            paintPreview();
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; }

        mNamePos.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; dNamePos = b.dataset.pos; paintPreview(); });
        mGrid.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; dGrid = +b.dataset.grid; paintPreview(); });

        document.getElementById('lmClose').addEventListener('click', closeModal);
        document.getElementById('lmCancel').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

        document.getElementById('lmApply').addEventListener('click', () => {
            // Colour is chosen above, not here — only layout + positions are applied.
            layout = dLayout; namePos = dNamePos; gridN = dGrid;
            renderLayouts();
            save();
            closeModal();
        });

        // ---- Save + preview. ----
        function save() {
            cfg = read();
            cfg.template = selected;
            cfg.layout = layout;
            cfg.namePos = namePos;
            cfg.grid = gridN;
            if (accent) cfg.accent = accent; else delete cfg.accent;
            write(cfg);
            const note = document.getElementById('savedNote');
            note.classList.add('show');
            setTimeout(() => note.classList.remove('show'), 1600);
        }
        document.getElementById('applyBtn').addEventListener('click', save);
        document.getElementById('viewStore').addEventListener('click', () => {
            save();
            location.href = 'buyer-profile.html';
        });
    })();
    </script>
</body>
</html>
