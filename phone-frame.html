<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- App-style viewport: fill the notch area, no user pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Keep the phone on the freshest deploy: revalidate the shell every load so a
         new GitHub Pages build shows up without a manual cache clear. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VERO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        /* Never show a scrollbar anywhere on the frame chrome. */
        html { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { width: 0; height: 0; display: none; }
        /* Black "no phone" area on the sides. */
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        /* The device body — Samsung Galaxy A56 style: thin uniform bezel, flat
           display, moderately rounded corners, soft shadow + thin rim so it reads
           as a real phone against the black. */
        .phone {
            position: relative;
            width: 412px;
            max-width: 100%;
            height: min(94vh, 900px);
            background: #0b0b0b;
            border-radius: 44px;
            padding: 10px;                 /* thin, even Samsung bezel */
            box-shadow: 0 0 0 2px #2b2b2b, 0 24px 70px rgba(0, 0, 0, 0.6);
        }
        /* The screen: rounded to sit inside the bezel, clips the content. The base
           colour is a soft warm paper (NOT stark white) so any loading gap between
           pages reads as a calm surface instead of a white flash. */
        :root { --pf-paper: #f4f1ec; }
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 36px;
            overflow: hidden;
            background: var(--pf-paper);
            display: flex;
            flex-direction: column;
        }
        /* Centred punch-hole camera (Samsung A56) — a small round dot at top centre
           that floats OVER the content, reserving no space, so the site fills the
           whole screen behind it. pointer-events:none so it never blocks taps. */
        .island {
            position: absolute;
            top: 13px;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 13px;
            background: #000;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.12);
        }
        .screen iframe {
            flex: 1 1 auto;
            width: 100%;
            border: 0;
            display: block;
            position: relative;
            z-index: 2;
            /* Paper (not white) while the inner page's own CSS is still painting. */
            background: var(--pf-paper);
        }
        /* Every in-frame navigation: the new page slides DOWN from the top over the
           paper base (.screen background) — no white, no fade. One animation for all
           navigations (forward and back alike), so transitions feel consistent. */
        @keyframes pfSlideInDown {
            from { transform: translateY(-100%); }
            to   { transform: translateY(0); }
        }
        .screen iframe.pf-enter {
            /* Near-instant page-to-page transition (0.01s) — the new page just
               appears, no drawn-out slide. */
            animation: pfSlideInDown 0.01s linear both;
        }

        /* Instant paper cover (no fade) shown only during the fetch gap, so the
           browser's blank white repaint between documents is never visible. */
        .pf-cover {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: var(--pf-paper);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: none;
        }
        .pf-cover.is-on { opacity: 1; visibility: visible; }

        @media (prefers-reduced-motion: reduce) {
            .screen iframe.pf-enter { animation: none; }
        }
        /* No scrollbar on the frame itself. */
        body::-webkit-scrollbar, .screen::-webkit-scrollbar { width: 0; height: 0; display: none; }
        /* On a real phone (narrow screen) drop the device chrome — the site fills the
           screen edge to edge, no bezel, no black bars, no fake status bar. */
        @media (max-width: 460px) {
            .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; padding: 0; box-shadow: none; background: #fff; }
            .screen { border-radius: 0; }
            .island { display: none; }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="screen">
            <!-- The whole site lives in here. index.html detects it is framed and renders
                 the real homepage instead of bouncing back to this frame. -->
            <iframe title="VERO" id="siteFrame"></iframe>
            <!-- Paper cover shown only during the page-to-page fetch gap. -->
            <div class="pf-cover" id="pfCover"></div>
            <!-- Camera island floats over the full-screen content. -->
            <div class="island"></div>
        </div>
    </div>
    <script>
        // Hide the content scrollbar inside the phone (scrolling still works). Same-origin
        // (file://) lets us inject a style into the framed document; re-runs on every
        // in-frame navigation because onload fires for each page load.
        var frame = document.getElementById('siteFrame');

        // ---- Straight-to-home entry ----
        // The feed is a "protected" view (auth.js bounces logged-out visitors to the
        // login page). So the app can open straight to the home feed every time, seed a
        // lightweight guest session first — but only when none exists, so a real login
        // is never overwritten.
        (function ensureGuestSession() {
            try {
                if (localStorage.getItem('vero_session')) return;
                var uid = 'guest';
                localStorage.setItem('vero_users', JSON.stringify([{ id: uid, handle: 'guest', name: 'Guest' }]));
                localStorage.setItem('vero_session', JSON.stringify({ userId: uid, token: 'guest', expiresAt: Date.now() + 31536000000 }));
                localStorage.setItem('vero_onboarded:' + uid, '1');
                if (!localStorage.getItem('vero_active_account')) localStorage.setItem('vero_active_account', 'buyer');
            } catch (e) { /* storage blocked — the login page will handle it */ }
        })();

        // Which page to render inside the phone. Defaults to the homepage; a
        // ?page=<file>.html param lets a directly-opened inner page (e.g. a profile)
        // hand off to this frame and still load itself. Only a bare local filename is
        // accepted, so the param can't point the frame at an arbitrary URL.
        function pageTargetFromHash(cacheBust) {
            var raw = (location.hash.match(/[#&]page=([^&]+)/) || [])[1];
            raw = raw ? decodeURIComponent(raw) : null;
            // Split an optional query string (e.g. profile.html?from=seller) off the
            // filename, so a mode can be carried into the framed page.
            var file = raw, query = '';
            if (raw) { var qi = raw.indexOf('?'); if (qi >= 0) { file = raw.slice(0, qi); query = raw.slice(qi); } }
            if (file && !/\.html$/.test(file)) file += '.html';   // tolerate clean-URL servers
            var safe = file && /^[a-zA-Z0-9_-]+\.html$/.test(file) && file !== 'phone-frame.html'
                       && /^(\?[\w=&%.-]*)?$/.test(query);
            var target = safe ? file + query : 'index.html';
            if (cacheBust) target += (target.indexOf('?') >= 0 ? '&' : '?') + '_ts=' + Date.now();
            return target;
        }
        // Compare two targets ignoring the cache-bust param, so a hashchange to the
        // page already showing doesn't pointlessly reload it.
        function samePage(a, b) {
            var strip = function (u) { return u.replace(/([?&])_ts=\d+/, '$1').replace(/[?&]$/, ''); };
            return strip(a) === strip(b);
        }
        // Initial load (with cache-bust so a fresh deploy always wins).
        frame.src = pageTargetFromHash(true);

        // In-frame navigation via the #page= hash (veroGoAccount / veroOpenArea /
        // veroSlideToCart set window.top.location.hash). Without this listener the hash
        // would change but the iframe would never move — so honour it here.
        window.addEventListener('hashchange', function () {
            var next = pageTargetFromHash(false);
            if (!samePage(frame.src, next)) frame.src = next;
        });
        function hideFrameScrollbar() {
            try {
                var d = frame.contentDocument;
                if (!d) return;
                if (!d.getElementById('pf-hide-sb')) {
                    var s = d.createElement('style');
                    s.id = 'pf-hide-sb';
                    s.textContent =
                        // No scrollbars anywhere (scrolling still works).
                        'html,body{scrollbar-width:none!important;-ms-overflow-style:none!important;}' +
                        'html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;}' +
                        // ---- App-feel layer (applied to every inner page) ----
                        // No blue tap-highlight, no long-press callout menu.
                        '*{-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;}' +
                        // No pull-to-refresh / rubber-band bounce; no auto text-resize.
                        'html,body{overscroll-behavior:none!important;-webkit-text-size-adjust:100%!important;}' +
                        // Text is not selectable (like a native app)…
                        'body,body *{-webkit-user-select:none!important;user-select:none!important;}' +
                        // …except real inputs, where typing/selection must still work.
                        'input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;}';
                    (d.head || d.documentElement).appendChild(s);
                }
                // ---- Auto cache-busting for in-frame link navigation ----
                // Appends a _ts param to plain same-origin .html link clicks so the
                // browser always fetches the freshest deploy (no manual hard-refresh).
                // Skips links with their own onclick (their handler navigates) and
                // external / hash / new-tab links.
                if (!d.__pfNavBust) {
                    d.__pfNavBust = true;
                    d.addEventListener('click', function (e) {
                        var a = e.target && e.target.closest && e.target.closest('a[href]');
                        if (!a || a.hasAttribute('onclick') || a.target === '_blank') return;
                        var href = a.getAttribute('href');
                        if (!href || href.charAt(0) === '#') return;
                        if (/^(https?:|mailto:|tel:|javascript:|data:)/i.test(href)) return;
                        if (!/\.html(\?|$)/.test(href) || /[?&]_ts=/.test(href)) return;
                        e.preventDefault();
                        var sep = href.indexOf('?') >= 0 ? '&' : '?';
                        d.location.href = href + sep + '_ts=' + Date.now();
                    }, false);
                }
            } catch (e) { /* cross-origin (e.g. served over http) — ignore */ }
        }

        // Replay the slide-in animation on every navigation the iframe performs
        // (each inner link is a full document load, so 'load' fires per page).
        // One consistent slide for ALL navigations — forward and back alike: the new
        // page slides down from the top over the paper base.
        function playSlideIn() {
            frame.classList.remove('pf-enter');
            void frame.offsetWidth;          // force reflow so the animation restarts
            frame.classList.add('pf-enter');
        }

        // ---- No-white-flash page transitions ----
        // The moment the current page starts navigating away (pagehide, same-origin)
        // we raise a paper cover over the iframe, so the browser's blank white repaint
        // during the fetch is never visible. When the new page's 'load' fires we drop
        // the cover and slide the fresh page in over the paper base.
        var cover = document.getElementById('pfCover');
        var coverTimer = null;
        function showCover() {
            cover.classList.add('is-on');
            // Failsafe: if the next page's 'load' never fires (a navigation that was
            // cancelled, a mailto/tel/download, a stalled fetch), drop the cover anyway
            // so the app can never get stuck behind a blank paper screen.
            clearTimeout(coverTimer);
            coverTimer = setTimeout(hideCover, 2500);
        }
        function hideCover() {
            // Drop the cover immediately: behind the iframe is the paper base of
            // .screen, so the new page slides down over paper (never white). Keeping
            // the cover up during the slide would hide the animation.
            clearTimeout(coverTimer);
            cover.classList.remove('is-on');
        }

        // (Re)attach the pagehide listener to whichever document is currently framed.
        function armPageHide() {
            try {
                var w = frame.contentWindow;
                if (!w) return;
                w.removeEventListener('pagehide', showCover);
                w.addEventListener('pagehide', showCover);
            } catch (e) { /* cross-origin — ignore */ }
        }

        frame.addEventListener('load', function () {
            hideFrameScrollbar();
            playSlideIn();        // slide the new page down from the top
            hideCover();          // drop the paper cover so the slide is visible over paper
            armPageHide();        // arm the cover for the next navigation
        });
        hideFrameScrollbar();
        armPageHide();

        // ---- Clean up any previously-registered Service Worker + its caches ----
        // A caching SW fought the cache-busting that keeps the phone on the freshest
        // deploy, so it is removed. This unregisters any lingering SW and clears its
        // caches so no device stays stuck on a stale version.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(reg => reg.unregister());
            }).catch(() => {});
            if (window.caches && caches.keys) {
                caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
            }
        }

        // ---- Proactive page prefetch (runs in the persistent frame, covers every
        //      inner page) — pull the pages a user is most likely to open next into
        //      the browser's HTTP cache, so tapping any of them loads near-instantly.
        //      This is the real fix for slow navigation on the phone (no hover there).
        (function warmPages() {
            var warmed = {};
            function warm(u) {
                if (warmed[u]) return; warmed[u] = 1;
                try { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = u; document.head.appendChild(l); } catch (e) {}
                fetch(u, { priority: 'low' }).catch(function () {});
            }
            var pages = [
                'index.html', 'profile.html', 'products.html', 'seller-area.html',
                'seller-settings.html', 'chats.html', 'cart-store.html', 'cart.html',
                'buyer-profile.html', 'store-profile.html', 'drafts.html',
                'offers-received.html', 'saved.html', 'follows.html', 'product.html'
            ];
            var run = function () { pages.forEach(warm); };
            if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 2500 });
            else setTimeout(run, 1000);
        })();
    </script>
</body>
</html>
